name),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Демонстрация проблемы подглядывания (Peeking Problem)\nimport numpy as np\nfrom scipy import stats\n\nnp.random.seed(42)\nn_simulations = 500\nfalse_positives = 0\n\n# Проверяем две группы БЕЗ реального эффекта (A/A тест)\nfor _ in range(n_simulations):\n    a = np.random.normal(0, 1, 1000)\n    b = np.random.normal(0, 1, 1000)\n    \n    # Подглядываем на шагах 100, 200, 500, 1000\n    for step in [100, 200, 500, 1000]:\n        t_stat, p_val = stats.ttest_ind(a[:step], b[:step])\n        if p_val < 0.05:\n            false_positives += 1\n            break # Остановили тест раньше времени!\n\nobserved_alpha = false_positives / n_simulations\nprint(f\"Номинальный уровень ошибки alpha:  5.0%\")\nprint(f\"Реальный уровень ложных тревог:    {observed_alpha:.1%}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка завышения ошибки I рода\nВо сколько раз подглядывание завысило вероятность ложной победы?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ninflation = observed_alpha / 0.05\nprint(f\"Риск ложного вывода вырос в {inflation:.1f} раз!\")\n\nassert observed_alpha > 0.05, \"Подглядывание всегда завышает alpha\"\nprint(\"✅ Тест успешно пройден: опасность Peeking Problem доказана эмпирически!\")\n"}, {"type": "markdown", "content": "### 💡 Как защититься от подглядывания в A/B тестах?\n1. Заранее фиксировать размер выборки через калькулятор мощности (Sample Size).\n2. Применять последовательный анализ (Sequential Testing / Always Valid p-values)."}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6. BI дашборды в Looker Studio", "cat": "BI", "badge": "BI", "icon": "📉", "desc": "Моделирование данных, интерактивные фильтры, executive-дашборды для бизнеса.", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio & BI)\n\n---\n\n### Вопрос 1\nКак правильно рассчитать конверсию (Conversion Rate) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Purchases / Sessions)`\n- [x] `SUM(Purchases) / SUM(Sessions)`\n- [ ] `Purchases / Sessions`\n*Объяснение*: Нельзя усреднять частные (`AVG(...)`). Необходимо вычислить отношение суммы всех покупок к сумме всех сессий.\n\n---\n\n### Вопрос 2\nЧто такое Granularity Mismatch при Data Blending?\n- [ ] Ошибка в названии столбца.\n- [x] Несоответствие уровня детализации таблиц (например, расходы сгруппированы по дням, а продажи — по конкретным секундам чеков), приводящее к задвоению метрик.\n- [ ] Нехватка оперативной памяти в браузере.\n*Объяснение*: Для корректного соединения обе таблицы должны быть приведены к одинаковому составному ключу группировки.\n\n---\n\n### Вопрос 3\nКаково правило «5 секунд» в дизайне бизнес-дашбордов?\n- [ ] Дашборд должен загружаться не более 5 секунд.\n- [x] Руководитель должен за 5 секунд понять текущий статус ключевых KPI и наличие отклонений от плана.\n- [ ] Графики должны обновляться каждые 5 секунд.\n*Объяснение*: Главные карточки метрик с индикаторами отклонения должны считываться моментально в верхнем левом углу.\n\n---\n\n### Вопрос 4\nПочему в BI-системах агрегированные метрики отношений (например, CTR или Конверсия) нельзя вычислять как среднее по строкам?\n- [ ] BI-инструменты зависают от таких формул.\n- [x] Среднее арифметическое от долей игнорирует вес каждой строки; корректная формула требует отношения сумм: SUM(кликов) / SUM(показов).\n- [ ] Это разрешено, если строк больше 1000.\n*Объяснение*: Неправильная агрегация приводит к парадоксу Симпсона и искажению отчетов.\n\n---\n\n### Вопрос 5\nВ чем преимущество выноса тяжелых JOIN-ов из Looker Studio в витрины данных BigQuery или ClickHouse?\n- [ ] В Looker Studio нельзя использовать JOIN.\n- [x] Предварительно рассчитанные плоские витрины ускоряют загрузку дашборда до долей секунды и экономят ресурсы браузера пользователя.\n- [ ] Это экономит бумагу при печати отчета.\n*Объяснение*: BI должен только визуализировать готовые данные, а не исполнять тяжелые вычисления на лету.\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 1. Архитектура BI и подключение источников данных в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДашборд — это инструмент принятия управленческих решений.\nВ этом уроке мы разберем:\n1. Архитектуру подключения BigQuery / PostgreSQL / Google Sheets.\n2. Подготовку плоских денормализованных витрин (Data Marts).\n3. Принцип 5 секунд (5-second rule) для верхнеуровневых Executive KPI."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\ntotal_mrr = df_saas['mrr'].sum()\nactive_clients = len(df_saas[df_saas['is_churned'] == 0])\nchurned_clients = len(df_saas[df_saas['is_churned'] == 1])\nchurn_rate = churned_clients / len(df_saas)\narpu = total_mrr / active_clients if active_clients > 0 else 0\n\nprint(\"=\" * 45)\nprint(\"📊 EXECUTIVE SUMMARY (Верхний ярус дашборда):\")\nprint(f\"💰 Total MRR:          ${total_mrr:,.2f}\")\nprint(f\"👥 Active Clients:     {active_clients}\")\nprint(f\"🚪 Churn Rate:         {churn_rate:.2%}\")\nprint(f\"📈 ARPU (Active):      ${arpu:.2f}\")\nprint(\"=\" * 45)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет дельты к целевому показателю (Target Delta)\nЦелевой Churn Rate в компании установлен на уровне 4.0%.\nРассчитайте абсолютную разницу между фактическим и целевым оттоком в процентных пунктах (p.p.)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntarget_churn = 0.04\ndelta_pp = (churn_rate - target_churn) * 100\n\nprint(f\"Отклонение от цели: {delta_pp:+.2f} п.п.\")\nassert isinstance(delta_pp, float), \"Дельта должна быть вещественным числом\"\nprint(\"✅ Тест успешно пройден: метрика отклонения готова для KPI-карточки!\")\n"}, {"type": "markdown", "content": "### 💡 Архитектурный фреймворк дашборда\n* **Tier 1 (Верх)**: 3-5 ключевых KPI с дельтами к прошлому периоду и таргету.\n* **Tier 2 (Середина)**: Тренды во времени (динамика недели/месяцы).\n* **Tier 3 (Низ)**: Детализирующая таблица с возможностью фильтрации."}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 2. Вычисляемые поля и параметры: CASE WHEN и агрегированные метрики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ BI-системах вычисляемые поля делятся на:\n* **Row-level calculated fields**: выполняются построчно (например, `CASE WHEN ... THEN`).\n* **Aggregated calculated fields**: вычисляются после агрегации (`SUM(mrr) / COUNT(DISTINCT user_id)`).\nНикогда не усредняйте готовые проценты или отношения!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nconditions = [\n    df_saas['active_seats'] <= 5,\n    (df_saas['active_seats'] >= 6) & (df_saas['active_seats'] <= 20),\n    df_saas['active_seats'] > 20\n]\nchoices = ['Small', 'Medium', 'Enterprise']\ndf_saas['company_size_tier'] = np.select(conditions, choices, default='Unknown')\n\ntier_summary = df_saas.groupby('company_size_tier').agg(\n    total_mrr=('mrr', 'sum'),\n    clients_count=('user_id', 'count'),\n    avg_mrr=('mrr', 'mean')\n).reset_index()\n\nprint(tier_summary.to_string(index=False))\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля выручки по сегментам\nВычислите долю каждого сегмента в общей выручке и сохраните в столбец `revenue_share`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntier_summary['revenue_share'] = tier_summary['total_mrr'] / tier_summary['total_mrr'].sum()\nprint(tier_summary[['company_size_tier', 'revenue_share']])\n\nassert round(tier_summary['revenue_share'].sum(), 2) == 1.0, \"Сумма долей должна быть 1.0\"\nprint(\"✅ Тест успешно пройден: вычисляемая метрика верна!\")\n"}, {"type": "markdown", "content": "### 💼 Формула безопасного вычисления в BI\nВсегда используйте синтаксис `SUM(revenue) / NULLIF(SUM(clicks), 0)` для защиты от деления на ноль."}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 3. Смешивание данных (Data Blending) и объединение источников\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\n\n## 📌 Бизнес-контекст и методология\nData Blending в Looker Studio выполняет LEFT JOIN между источниками по общему ключу (Join Key).\nВажно: смешивание происходит ПОСЛЕ группировки, поэтому данные объединяются на агрегированном уровне."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\n# Таблица 1: Затраты на маркетинг\ndf_spend = pd.DataFrame({\n    'channel': ['Paid Search', 'Social Ads', 'Referral', 'SEO'],\n    'ad_spend': [120_000, 85_000, 15_000, 30_000]\n})\n\n# Таблица 2: Выручка от привлеченных клиентов\ndf_rev = pd.DataFrame({\n    'channel': ['Paid Search', 'Social Ads', 'Referral', 'Email'],\n    'revenue': [340_000, 160_000, 45_000, 70_000]\n})\n\n# Blending (Left Join)\nblended = pd.merge(df_spend, df_rev, on='channel', how='left').fillna(0)\nblended['roas'] = blended['revenue'] / blended['ad_spend']\nprint(blended)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Суммарный ROAS маркетинга\nРассчитайте совокупный ROAS по всем объединенным каналам."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_roas = blended['revenue'].sum() / blended['ad_spend'].sum()\nprint(f\"Совокупный ROAS: {total_roas:.2f}x\")\n\nassert total_roas > 1.0, \"Маркетинг в целом окупаем\"\nprint(\"✅ Тест успешно пройден: смешивание данных и расчет метрики выполнены!\")\n"}, {"type": "markdown", "content": "### 💡 Ограничения Data Blending\nПри смешивании более 3-4 источников дашборды в BI начинают тормозить. Индустриальная рекомендация: готовить плоскую таблицу в BigQuery / ClickHouse."}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 4. UI/UX дашбордов для топ-менеджмента: верстка, цветовая семантика и типографика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДизайн дашборда подчиняется законам восприятия информации:\n1. **Z-паттерн и F-паттерн чтения**: главное слева сверху.\n2. **Семантика цвета**: зеленый = успех, красный = проблема, серый/синий = нейтральный контекст.\n3. **Число Данбара для графиков**: не более 5-7 визуальных элементов на одном экране."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Аудит визуальной загруженности дашборда\ndashboard_specs = {\n    'total_charts': 6,\n    'total_kpi_cards': 4,\n    'custom_colors_used': 3,\n    'has_date_filter': True\n}\n\ndef audit_dashboard_ux(specs):\n    issues = []\n    if specs['total_charts'] > 8:\n        issues.append(\"Слишком много графиков (риск когнитивной перегрузки)\")\n    if specs['custom_colors_used'] > 4:\n        issues.append(\"Эффект 'фруктового салата': слишком много цветов\")\n    if not specs['has_date_filter']:\n        issues.append(\"Отсутствует глобальный фильтр по дате\")\n    return issues\n\nissues = audit_dashboard_ux(dashboard_specs)\nprint(f\"Результат UX аудита: {'🟢 Идеально' if not issues else issues}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация спецификации дашборда\nУбедитесь, что тестовый дашборд проходит UX-аудит без замечаний."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert len(issues) == 0, \"Дашборд должен пройти аудит без замечаний\"\nprint(\"✅ Тест успешно пройден: UX-стандарты соблюдены!\")\n"}, {"type": "markdown", "content": "### 💼 Совет аналитику\nПоказывайте черновик дашборда конечному заказчику на 2-й день разработки, а не через месяц."}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 5. Интерактивные фильтры, элементы управления и кросс-фильтрация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКросс-фильтрация (Cross-filtering) превращает статичный отчет в инструмент исследования данных.\nКлик по сектору на одном графике мгновенно фильтрует все связанные таблицы и KPI."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Симуляция фильтрации по выбранной индустрии\ndef apply_dashboard_filter(df, selected_industry=None, selected_plan=None):\n    filtered = df.copy()\n    if selected_industry:\n        filtered = filtered[filtered['industry'] == selected_industry]\n    if selected_plan:\n        filtered = filtered[filtered['plan'] == selected_plan]\n    return filtered\n\nres_filtered = apply_dashboard_filter(df_saas, selected_industry='Fintech', selected_plan='Enterprise')\nprint(f\"Найдено клиентов Fintech Enterprise: {len(res_filtered)}\")\nprint(f\"Их совокупный MRR: ${res_filtered['mrr'].sum():,.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка фильтрации\nПроверьте, что фильтр возвращает корректное подмножество записей."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert (res_filtered['industry'] == 'Fintech').all()\nassert (res_filtered['plan'] == 'Enterprise').all()\nprint(\"✅ Тест успешно пройден: кросс-фильтрация работает корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Оптимизация скорости\nПри включенной кросс-фильтрации каждый клик шлет десятки SQL-запросов к источнику. Используйте BI Engine или кэширование Extract в Looker Studio."}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7. A/B тестирование и эксперименты", "cat": "Аналитика", "badge": "A/B", "icon": "🧪", "desc": "Расчет размера выборки, MDE, ловушка подглядывания (Peeking), SRM и множественные тесты.", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B-тестирование)\n\n---\n\n### Вопрос 1\nЧто происходит с реальным уровнем ошибки I рода ($\\alpha$), если аналитик каждый день проверяет тест и останавливает его при первом $p < 0.05$ (Peeking Problem)?\n- [ ] Ошибка остается строго 5%.\n- [x] Реальная вероятность ложноположительного результата подскакивает до 30-40%, фиксируя случайный шум.\n- [ ] Ошибка уменьшается до нуля.\n*Объяснение*: Непрерывный мониторинг накапливает вероятность случайного пересечения порога 0.05.\n\n---\n\n### Вопрос 2\nЧто показывает Sample Ratio Mismatch (SRM)?\n- [ ] Разницу в конверсиях между группами.\n- [x] Нарушение запланированного соотношения объемов трафика в группах (например, 48/52 вместо 50/50), указывающее на технический сбой рандомизатора.\n- [ ] Ошибку в расчете выручки.\n*Объяснение*: При наличии SRM результаты сравнения метрик между группами математически невалидны.\n\n---\n\n### Вопрос 3\nЗачем нужны Guardrail-метрики в эксперименте?\n- [ ] Чтобы ускорить расчет p-value.\n- [x] Чтобы предотвратить раскатку фичи, которая вырастила локальную метрику за счет разрушения глобального здоровья бизнеса (например, рост кликов ценой падения выручки).\n- [ ] Для шифрования данных.\n*Объяснение*: Guardrail-метрики защищают ключевые бизнес-показатели от деградации.\n\n---\n\n### Вопрос 4\nЧто такое Peeking Problem (проблема подглядывания) в A/B тестировании?\n- [ ] Пользователи случайно узнают, в какой группе они находятся.\n- [x] Ежедневная проверка p-value и остановка эксперимента при первом получении p < 0.05 раздувает реальную ошибку I рода до 30-40%.\n- [ ] Просмотр дашборда конкурентами.\n*Объяснение*: Для непрерывного мониторинга необходимо использовать методы последовательного анализа (Sequential Testing).\n\n---\n\n### Вопрос 5\nКак метод CUPED снижает дисперсию целевой метрики в экспериментах?\n- [ ] Он удаляет половину пользователей из выборки.\n- [x] Он вычитает из текущей метрики ту часть дисперсии, которая объясняется предэкспериментальным поведением пользователя.\n- [ ] Он искусственно умножает данные на константу.\n*Объяснение*: CUPED эквивалентен бесплатному увеличению размера выборки на 30-50% без затягивания сроков теста.\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 1. Фреймворк A/B-тестирования: MDE, статистическая мощность (Power) и Sample Size\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДизайн эксперимента начинается с расчета необходимого объема выборки:\n* $\\alpha$ (False Positive Rate / Ошибка I рода, 5%)\n* $\\beta$ (False Negative Rate / Ошибка II рода, 20% -> Мощность $1 - \\beta = 80\\%$)\n* MDE (Minimum Detectable Effect) — минимальный значимый для бизнеса эффект."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\ndef calculate_sample_size(p_base, mde_rel, alpha=0.05, power=0.80):\n    p_treat = p_base * (1 + mde_rel)\n    z_alpha = stats.norm.ppf(1 - alpha / 2)\n    z_beta = stats.norm.ppf(power)\n    \n    p_pool = (p_base + p_treat) / 2\n    var_pooled = 2 * p_pool * (1 - p_pool)\n    \n    n_per_group = ((z_alpha + z_beta) ** 2 * var_pooled) / ((p_treat - p_base) ** 2)\n    return int(np.ceil(n_per_group))\n\nbase_cr = 0.05\ndesired_mde = 0.10\nneeded_n = calculate_sample_size(base_cr, desired_mde)\n\nprint(f\"🎯 Необходимый размер выборки на 1 группу: {needed_n:,} пользователей\")\nprint(f\"👥 Всего для A/B теста (A + B):            {needed_n * 2:,} пользователей\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка зависимости выборки от MDE\nРассчитайте необходимый размер выборки для MDE = 5% (0.05)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsmaller_mde = 0.05\nn_for_small_mde = calculate_sample_size(base_cr, smaller_mde)\n\nprint(f\"Размер выборки при MDE 5%: {n_for_small_mde:,} пользователей\")\nassert n_for_small_mde > needed_n * 3, \"Уменьшение MDE в 2 раза требует ~4-кратного роста выборки!\"\nprint(\"✅ Тест успешно пройден: квадратичная зависимость выборки от MDE подтверждена!\")\n"}, {"type": "markdown", "content": "### 💡 Золотой закон A/B тестирования\nРазмер выборки обратно пропорционален квадрату MDE. Обнаружение микроэффектов требует колоссального трафика."}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 2. Сплитование трафика, A/A-тесты и Sample Ratio Mismatch (SRM)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\n\n## 📌 Бизнес-контекст и методология\nSample Ratio Mismatch (SRM) — это симптом поломки системы сплитования трафика.\nЕсли тест настроен 50/50, но фактически пришло 49 000 и 51 000 пользователей, хи-квадрат тест покажет, случайность это или баг."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\nusers_a = 49_210\nusers_b = 50_790\ntotal_users = users_a + users_b\nexpected = [total_users / 2, total_users / 2]\n\nchi2_stat, srm_p_value = stats.chisquare([users_a, users_b], expected)\nprint(f\"Chi2 stat:   {chi2_stat:.3f}\")\nprint(f\"SRM p-value: {srm_p_value:.4f}\")\n\nif srm_p_value < 0.01:\n    print(\"🚨 Зафиксирован SRM! Результаты теста невалидны.\")\nelse:\n    print(\"🟢 SRM отсутствует: группы распределены равномерно.\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Детекция сильного перекоса\nПроверьте выборку 47 000 vs 53 000 на наличие SRM."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\n_, bad_srm_pval = stats.chisquare([47_000, 53_000], [50_000, 50_000])\nprint(f\"p-value для 47k vs 53k: {bad_srm_pval:.4e}\")\n\nassert bad_srm_pval < 0.001, \"Перекос должен быть статистически значимым\"\nprint(\"✅ Тест успешно пройден: детектор SRM сработал корректно!\")\n"}, {"type": "markdown", "content": "### 💼 Причины SRM\n1. Редиректы и кэширование на стороне CDN.\n2. Боты, попадающие только в одну ветку.\n3. Ошибки в хэш-функции соления ID пользователя (salt)."}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 3. Оценка метрик: z-тест для пропорций и t-тест для средних значений\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДля качественной оценки различий:\n* **Z-тест для долей (Proportions)**: конверсии (CR, CTR, Retention).\n* **T-тест Стьюдента / Уэлча для средних (Means)**: средний чек (AOV), ARPU, время на сайте."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\n# Конверсия в группе A и B\nconv_a, n_a = 520, 10_000   # CR = 5.2%\nconv_b, n_b = 610, 10_000   # CR = 6.1%\n\np1 = conv_a / n_a\np2 = conv_b / n_b\np_pooled = (conv_a + conv_b) / (n_a + n_b)\nse = np.sqrt(p_pooled * (1 - p_pooled) * (1/n_a + 1/n_b))\nz_stat = (p2 - p1) / se\np_value = 2 * (1 - stats.norm.cdf(abs(z_stat)))\n\nprint(f\"CR Control:  {p1:.2%}\")\nprint(f\"CR Variant:  {p2:.2%}\")\nprint(f\"Z-статистика: {z_stat:.3f}\")\nprint(f\"p-value:      {p_value:.4f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доверительный интервал разницы конверсий\nРассчитайте 95% доверительный интервал для абсолютной разницы конверсий $(p_2 - p_1)$."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndiff = p2 - p1\nse_diff = np.sqrt((p1*(1-p1)/n_a) + (p2*(1-p2)/n_b))\nci_lower = diff - 1.96 * se_diff\nci_upper = diff + 1.96 * se_diff\n\nprint(f\"95% ДИ абсолютного прироста: [{ci_lower:.4f}, {ci_upper:.4f}]\")\nassert ci_lower > 0, \"Нижняя граница должна быть выше 0 при значимом эффекте\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 t-тест Уэлча vs классический t-тест\nВсегда используйте `stats.ttest_ind(..., equal_var=False)` (тест Уэлча). Он устойчив к неравенству дисперсий в группах."}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 4. P-hacking, Peeking Problem и множественное тестирование\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\n\n## 📌 Бизнес-контекст и методология\nPeeking Problem (подглядывание) возникает, когда аналитик проверяет p-value каждый день и останавливает эксперимент при первом получении $p < 0.05$.\nЭто завышает вероятность ложноположительного вывода (False Positive) с 5% до 30-40%!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\nnp.random.seed(42)\nn_experiments = 300\nfalse_positives = 0\n\nfor _ in range(n_experiments):\n    a = np.random.normal(0, 1, 1000)\n    b = np.random.normal(0, 1, 1000)\n    for check_point in [200, 400, 600, 800, 1000]:\n        _, p = stats.ttest_ind(a[:check_point], b[:check_point])\n        if p < 0.05:\n            false_positives += 1\n            break\n\nactual_alpha = false_positives / n_experiments\nprint(f\"Номинальный alpha: 5.0%\")\nprint(f\"Фактический alpha при 5 подглядываниях: {actual_alpha:.1%}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поправка Бонферрони\nПри проверке 10 независимых метрик скорректируйте пороговый уровень значимости alpha=0.05 методом Бонферрони."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nn_metrics = 10\nalpha_bonferroni = 0.05 / n_metrics\nprint(f\"Скорректированный альфа: {alpha_bonferroni:.4f}\")\n\nassert alpha_bonferroni == 0.005, \"Поправка Бонферрони делит альфа на число тестов\"\nprint(\"✅ Тест успешно пройден: защита от множественной проверки подтверждена!\")\n"}, {"type": "markdown", "content": "### 💼 Как жить без подглядывания?\n1. Заранее фиксировать дату окончания теста.\n2. Применять последовательный анализ Вальда (mSPRT / Sequential Testing)."}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 5. Принятие бизнес-решений по результатам A/B тестов и раскатка (Rollout)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСтатистическая значимость не равна экономической целесообразности.\nПри принятии решения о раскатке учитываются:\n1. Затраты на поддержку новой фичи.\n2. Эффект каннибализации других продуктов.\n3. Риски деградации Guardrail метрик."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Оценка годового экономического эффекта от фичи\nuplift_cr = 0.004           # +0.4% к конверсии\nmonthly_visitors = 500_000\navg_order_value = 3500.0    # 3500 руб.\nmargin_rate = 0.25          # 25% маржинальность\n\nadditional_orders_month = monthly_visitors * uplift_cr\nadditional_gross_profit = additional_orders_month * avg_order_value * margin_rate\nannual_impact = additional_gross_profit * 12\n\nprint(f\"Дополнительных заказов в месяц: {additional_orders_month:,.0f}\")\nprint(f\"Дополнительная маржинальная прибыль в год: {annual_impact:,.2f} руб.\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет ROI раскатки\nРазработка и поддержка фичи стоят 5 000 000 руб. в год. Рассчитайте чистый годовой ROI."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncost_annual = 5_000_000.0\nnet_profit = annual_impact - cost_annual\nroi = net_profit / cost_annual\n\nprint(f\"Чистая прибыль: {net_profit:,.2f} руб. ROI: {roi:.1%}\")\nassert roi > 0, \"Фича должна окупаться\"\nprint(\"✅ Тест успешно пройден: экономическое обоснование готово!\")\n"}, {"type": "markdown", "content": "### 💡 Культура Rollout\nПоэтапная раскатка (10% -> 25% -> 50% -> 100%) минимизирует риски инфраструктурных аварий."}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8. Prompt Engineering для аналитиков", "cat": "AI стек", "badge": "Промпты", "icon": "💬", "desc": "Few-shot, Chain-of-Thought, Structured Outputs, генерация чистого SQL и Python кода.", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n---\n\n### Вопрос 1\nЧто дает добавление инструкции «Рассуждай по шагам» (Chain-of-Thought) в промпте для аналитика?\n- [ ] Уменьшает количество затраченных токенов.\n- [x] Позволяет модели сформировать промежуточные логические выводы перед финальным расчетом, резко снижая процент математических ошибок.\n- [ ] Переводит код на язык C++.\n*Объяснение*: CoT принуждает LLM использовать контекст генерируемых токенов как рабочую память.\n\n---\n\n### Вопрос 2\nВ чем заключается техника Few-Shot Prompting?\n- [ ] Однократный запрос без контекста.\n- [x] Предоставление модели в тексте промпта 1-3 готовых примеров «входные данные -> ожидаемый результат» перед постановкой основной задачи.\n- [ ] Написание кода без использования библиотек.\n*Объяснение*: Few-Shot задает точный шаблон структуры ответа и логики рассуждений.\n\n---\n\n### Вопрос 3\nКакой компонент фреймворка RTCE отвечает за формат и ограничения вывода?\n- [ ] R (Role).\n- [ ] T (Task).\n- [x] E (Expectation).\n*Объяснение*: В Expectation задаются ограничения (например, «только валидный JSON без пояснений», «обработать деление на ноль»).\n\n---\n\n### Вопрос 4\nЧто такое Structured Outputs (JSON Schema) при работе с LLM API?\n- [ ] Сортировка текста по алфавиту.\n- [x] Механизм, при котором декодер модели на уровне токенов гарантирует 100% соответствие ответа заданной Pydantic / JSON схеме.\n- [ ] Преобразование текста в аудиофайл.\n*Объяснение*: Structured Outputs исключают риск поломки JSON-парсеров в продакшен-пайплайнах.\n\n---\n\n### Вопрос 5\nВ чем разница между Zero-Shot и Few-Shot промптингом?\n- [ ] В количестве используемых видеокарт.\n- [x] В Zero-Shot модели дается только инструкция, а в Few-Shot добавляются 2-3 конкретных примера входных и эталонных выходных данных.\n- [ ] В длине токенов.\n*Объяснение*: Примеры Few-Shot снимают неоднозначность классификации и задают формат edge-случаев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 1. Фундамент промпт-инжиниринга: System Prompts, Few-Shot и ролевые контексты\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПромпт-инжиниринг для аналитика — это проектирование детерминированных текстовых пайплайнов.\nОсновные компоненты:\n1. Ролевой контекст (System Prompt).\n2. Четкие правила форматирования (JSON / Таблицы).\n3. ПримерыFew-Shot для устранения двусмысленности."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import json\n\nprompt_template = {\n    \"role\": \"system\",\n    \"content\": \"Ты Senior Data Analyst. Классифицируй отзывы клиентов на категории: [Bug, Billing, Feature]. Формат ответа: строго JSON.\",\n    \"examples\": [\n        {\"input\": \"Списали деньги дважды за подписку!\", \"output\": {\"category\": \"Billing\", \"severity\": \"HIGH\"}},\n        {\"input\": \"Кнопка экспорта в CSV не нажимается\", \"output\": {\"category\": \"Bug\", \"severity\": \"MEDIUM\"}}\n    ]\n}\n\nprint(json.dumps(prompt_template, ensure_ascii=False, indent=2))\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация структуры промпта\nУбедитесь, что промпт содержит описание роли и примеры."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"role\" in prompt_template\nassert len(prompt_template[\"examples\"]) >= 2\nprint(\"✅ Тест успешно пройден: архитектура промпта валидна!\")\n"}, {"type": "markdown", "content": "### 💡 Zero-Shot vs Few-Shot\nFew-Shot примеры сокращают частоту отклонений от требуемой схемы вывода на 85%."}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 2. Chain-of-Thought (CoT) и пошаговая декомпозиция аналитических задач\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМетод Chain-of-Thought заставляет LLM рассуждать по шагам перед выдачей финального ответа, что критически важно в логических и математических расчетах."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример CoT-промпта для расчета LTV\ncot_prompt = \"\"\"\nЗадача: Рассчитай LTV, если ARPU = $50/мес, Churn Rate = 5% в месяц, Gross Margin = 80%.\nРассуждай по шагам:\nШаг 1: Определи среднюю продолжительность жизни клиента (Lifetime = 1 / Churn).\nШаг 2: Умножь Lifetime на месячный ARPU.\nШаг 3: Скорректируй на маржинальность (Gross Margin).\nФинальный ответ запиши в формате LTV = $X.\n\"\"\"\n\n# Аналитический расчет по тем же шагам\nlifetime = 1 / 0.05\nrevenue_ltv = lifetime * 50\nmargin_ltv = revenue_ltv * 0.80\n\nprint(f\"Шаг 1: Lifetime = {lifetime:.0f} месяцев\")\nprint(f\"Шаг 2: Выручка LTV = ${revenue_ltv:.2f}\")\nprint(f\"Шаг 3: Маржинальный LTV = ${margin_ltv:.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка формулы LTV\nУбедитесь, что рассчитанный маржинальный LTV равен $800."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert margin_ltv == 800.0, \"Маржинальный LTV должен быть $800\"\nprint(\"✅ Тест успешно пройден: пошаговый расчет подтвержден!\")\n"}, {"type": "markdown", "content": "### 💼 Как применять CoT в кодогенерации\nПросите модель сначала описать алгоритм в 3-4 пункта в виде комментариев, и только потом писать код."}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 3. Промпты для генерации SQL и Python кода: контекст схемы базы данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЧтобы LLM сгенерировала корректный SQL-запрос, ей необходим точный DDL-контекст таблиц и связей."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Формирование системного контекста схемы данных\nschema_context = \"\"\"\nCREATE TABLE orders (\n    order_id INT PRIMARY KEY,\n    customer_id INT,\n    order_date DATE,\n    status VARCHAR(20) -- ['Completed', 'Refunded', 'Cancelled']\n);\n\nCREATE TABLE order_items (\n    order_item_id INT PRIMARY KEY,\n    order_id INT REFERENCES orders(order_id),\n    total_amount DECIMAL(10, 2)\n);\n\"\"\"\n\nuser_question = \"Посчитай выручку по завершенным заказам за 2026 год\"\nsystem_instruction = f\"Используй схему:\\n{schema_context}\\nНапиши чистый PostgreSQL запрос без пояснений.\"\n\nprint(system_instruction[:250] + \"...\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия таблиц в схеме\nУбедитесь, что обе таблицы `orders` и `order_items` переданы в контекст."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"CREATE TABLE orders\" in schema_context\nassert \"CREATE TABLE order_items\" in schema_context\nprint(\"✅ Тест успешно пройден: контекст схемы полон!\")\n"}, {"type": "markdown", "content": "### 💡 Семантическая ловушка\nВ реальной базе колонка может называться `order_items.total_amount`, а не `orders.amount`. Без передачи DDL модель почти наверняка ошибется в имени колонки."}]}, {"filename": "lesson_04_debugging_and_root_cause_prompts.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 4. Промпты для отладки кода, поиска аномалий и Root Cause Analysis\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb)\n\n## 📌 Бизнес-контекст и методология\nRoot Cause Analysis (RCA) через LLM: передача стектрейса ошибки, фрагмента кода и первых 5 строк входных данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример пайплайна диагностики ошибки\nerror_trace = \"\"\"\nZeroDivisionError: division by zero\nFile \"pipeline.py\", line 42, in calculate_cr\n    return orders / visits\n\"\"\"\n\nrca_fix_logic = \"\"\"\ndef safe_calculate_cr(orders, visits):\n    if visits == 0 or visits is None:\n        return 0.0\n    return orders / visits\n\"\"\"\n\nprint(\"Диагностированный паттерн исправления ошибки деления на ноль:\")\nprint(rca_fix_logic)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Тестирование безопасного делителя\nПроверьте функцию `safe_calculate_cr` при визитах = 0 и при визитах = 100."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndef safe_calculate_cr(orders, visits):\n    if not visits:\n        return 0.0\n    return orders / visits\n\nassert safe_calculate_cr(5, 0) == 0.0\nassert safe_calculate_cr(5, 100) == 0.05\nprint(\"✅ Тест успешно пройден: защитный паттерн работает безупречно!\")\n"}, {"type": "markdown", "content": "### 💼 Правило передачи логов в AI\nНикогда не копируйте токены авторизации, пароли или PII пользователей при отправке логов ошибок в модель."}]}]}, {"id": "module_09_ai_tools_daily", "title": "Модуль 9. AI инструменты в ежедневной работе", "cat": "AI стек", "badge": "Workflow", "icon": "🤖", "desc": "Cursor, Copilot, валидация AI-галлюцинаций и автоматизация рутинных пайплайнов.", "readme": "# 🛠️ Модуль 9: AI в ежедневной работе аналитика (Cursor, Copilot, ChatGPT)\n\n## 📌 О модуле\nРазница между джуном и мидлом в 2027 году: джун пишет скрипт 3 дня, а специалист новой формации решает ту же задачу за 2 часа с помощью AI-инструментов, гарантируя нулевой процент галлюцинаций.\n\n## 🎯 Learning Outcomes\n- **Apply**: Использование Cursor IDE и GitHub Copilot для парного программирования.\n- **Analyze**: Code Interpreter (Advanced Data Analysis) для быстрого разведочного анализа (EDA).\n- **Evaluate**: 5-уровневый фреймворк валидации ответов ИИ: от синтаксиса до краевых бизнес-кейсов.\n\n## 📚 Уроки\n1. `lesson_01_cursor_vs_copilot_workflows.ipynb` — Настройка рабочего места: Cursor, Copilot, индексация кодовой базы.\n2. `lesson_02_claude_chatgpt_data_interpreter.ipynb` — Работа с веб-ассистентами (Claude 3.7 / ChatGPT): быстрый EDA, генерация гипотез.\n3. `lesson_03_ai_validation_framework_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n---\n\n### Вопрос 1\nЗачем в проектах аналитики используется файл `.cursorrules`?\n- [ ] Для ускорения интернета.\n- [x] Для автоматической передачи AI-ассистенту корпоративных стандартов кода, схемы баз данных и бизнес-правил компании.\n- [ ] Для компиляции Python в бинарный файл.\n*Объяснение*: Файл `.cursorrules` автоматически подмешивается в системный контекст каждого запроса в IDE.\n\n---\n\n### Вопрос 2\nЧто такое проверка бизнес-инвариантов при аудите кода нейросети?\n- [ ] Проверка орфографии комментариев.\n- [x] Проверка фундаментальных ограничений предметной области (например: сумма заказов не может быть отрицательной, а LTV не может быть ниже нуля).\n- [ ] Измерение скорости процессора.\n*Объяснение*: Если синтаксически корректный код от ИИ выдал отрицательный отток или конверсию 140%, нарушен бизнес-инвариант.\n\n---\n\n### Вопрос 3\nКакой инструмент лучше всего подходит для мгновенного разведочного анализа (EDA) сырого CSV-файла?\n- [ ] Ручной ввод данных в калькулятор.\n- [x] Advanced Data Analysis / Code Interpreter (встроенный запуск Python с визуализацией в реальном времени).\n- [ ] Отрисовка графиков на бумаге.\n*Объяснение*: Code Interpreter выполняет код в изолированной песочнице, строя графики и считая квантили за секунды.\n\n---\n\n### Вопрос 4\nКакой подход наиболее эффективен при отладке сложного Python-скрипта через AI в IDE?\n- [ ] Скопировать в чат весь проект целиком без пояснений.\n- [x] Предоставить минимальный воспроизводимый пример (MRE), полный стектрейс ошибки и схему первых 3 строк входных данных.\n- [ ] Попросить AI переписать проект на C++.\n*Объяснение*: Точный локализованный контекст предотвращает генерацию галлюцинаций и экономит контекстное окно.\n\n---\n\n### Вопрос 5\nЗачем нужен файл .cursorrules или AGENTS.md в корне проекта аналитика?\n- [ ] Это системный файл Windows.\n- [x] Он задает постоянный системный контекст для AI-ассистентов: стек технологий, соглашения об именовании колонок и бизнес-инварианты проекта.\n- [ ] Чтобы запретить AI читать файлы проекта.\n*Объяснение*: Постоянный контекст избавляет от необходимости повторять правила форматирования в каждом промпте.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 1. Рабочие процессы в Cursor, Copilot и современных AI IDE\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ этом уроке мы разберем эффективные сценарии использования AI в IDE:\n1. Автодополнение (Ghost Text) для рутинных операций.\n2. Inline Edit (Cmd+K / Ctrl+K) для рефакторинга функций.\n3. Проектный контекст (.cursorrules / AGENTS.md)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Генерация карточки проекта для передачи контекста в AI IDE\nproject_context = f\"\"\"\nDataset Summary:\n- Rows: {len(df_saas)}\n- Columns: {list(df_saas.columns)}\n- Target Variable: is_churned (0 or 1)\n\"\"\"\nprint(project_context.strip())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия целевой переменной\nУбедитесь, что целевая переменная `is_churned` указана в контексте."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"is_churned\" in project_context\nprint(\"✅ Тест успешно пройден: карточка контекста готова!\")\n"}, {"type": "markdown", "content": "### 💡 Совет по эффективности\nИспользуйте контекстные ссылки на файлы (`@файл`), чтобы модель читала реальный код проекта, а не выдумывала функции."}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 2. Использование Claude и ChatGPT Advanced Data Analysis для экспресс-аналитики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\n\n## 📌 Бизнес-контекст и методология\nAdvanced Data Analysis (Code Interpreter) позволяет выполнять Python код прямо в песочнице чат-бота для быстрой проверки гипотез."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Экспресс-вычисление корреляционной матрицы\nnumeric_cols = df_saas.select_dtypes(include=['float64', 'int64']).columns\ncorr_matrix = df_saas[numeric_cols].corr().round(2)\nprint(\"📊 Фрагмент корреляционной матрицы:\")\nprint(corr_matrix.iloc[:4, :4])\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Диагональ корреляционной матрицы\nУбедитесь, что значения на главной диагонали равны 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndiag_values = np.diag(corr_matrix.values)\nassert (diag_values == 1.0).all(), \"Диагональ корреляционной матрицы обязана состоять из 1.0\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Когда не стоит использовать браузерный Data Interpreter?\nПри объемах данных свыше 500 МБ или при наличии строгих политик безопасности данных (банковская тайна, персональные данные)."}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 3. Фреймворк валидации AI-ответов и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик несет юридическую и финансовую ответственность за презентуемые цифры.\nФреймворк фактчекинга:\n1. Запрет на слепое копирование чисел из текстового ответа LLM.\n2. Проверка граничных условий и сумм (Sanity Checks).\n3. Дублирующий расчет на агрегированном SQL."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urlli
