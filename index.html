E отработал корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Почему CTE эффективнее подзапросов?\n1. Модульность и самодокументируемость.\n2. Возможность многократного обращения к одному CTE."}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 5. Оконные функции (Window Functions): ранжирование, кумулятивные итоги и смещения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОконные функции вычисляют агрегаты по группе строк, не схлопывая исходные записи."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nWITH OrderTotals AS (\n    SELECT \n        order_id,\n        SUM(total_amount) AS order_total\n    FROM order_items\n    GROUP BY order_id\n)\nSELECT \n    o.customer_id,\n    o.order_id,\n    o.order_date,\n    ot.order_total,\n    ROW_NUMBER() OVER (PARTITION BY o.customer_id ORDER BY o.order_date) AS order_seq,\n    ROUND(SUM(ot.order_total) OVER (PARTITION BY o.customer_id ORDER BY o.order_date), 2) AS running_ltv,\n    LAG(ot.order_total, 1) OVER (PARTITION BY o.customer_id ORDER BY o.order_date) AS prev_order_total\nFROM orders o\nJOIN OrderTotals ot ON o.order_id = ot.order_id\nWHERE o.status = 'Completed'\nORDER BY o.customer_id, o.order_date\nLIMIT 10;\n\"\"\"\n\ndf_window = pd.read_sql_query(query, conn)\ndf_window\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск второго чека клиента через DENSE_RANK\nНайдите второй по величине чек клиента с помощью `DENSE_RANK()`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_rank = \"\"\"\nWITH OrderTotals AS (\n    SELECT order_id, SUM(total_amount) AS total FROM order_items GROUP BY order_id\n),\nRankedOrders AS (\n    SELECT \n        o.customer_id,\n        o.order_id,\n        ot.total,\n        DENSE_RANK() OVER (PARTITION BY o.customer_id ORDER BY ot.total DESC) AS check_rank\n    FROM orders o\n    JOIN OrderTotals ot ON o.order_id = ot.order_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    customer_id,\n    order_id,\n    total AS second_largest_check\nFROM RankedOrders\nWHERE check_rank = 2\nORDER BY total DESC;\n\"\"\"\n\ndf_second = pd.read_sql_query(query_rank, conn)\nprint(df_second.head(5))\n\nassert not df_second.empty, \"Должны быть вторые чеки\"\nassert 'second_largest_check' in df_second.columns, \"Колонка обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 ROW_NUMBER vs RANK vs DENSE_RANK\nROW_NUMBER всегда дает уникальный номер строки, DENSE_RANK дает одинаковый ранг дубликатам без пропуска следующих номеров."}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 6. Промышленные паттерны SQL: Когортный анализ (Retention) и воронки конверсий\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ продуктовой аналитике SQL используется для расчета когортного удержания (Retention) и воронок конверсий."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nWITH CustomerCohorts AS (\n    SELECT \n        customer_id,\n        STRFTIME('%Y-%m', MIN(order_date)) AS cohort_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\nOrderActivity AS (\n    SELECT \n        o.customer_id,\n        cc.cohort_month,\n        STRFTIME('%Y-%m', o.order_date) AS activity_month,\n        (CAST(STRFTIME('%Y', o.order_date) AS INTEGER) - CAST(SUBSTR(cc.cohort_month, 1, 4) AS INTEGER)) * 12 +\n        (CAST(STRFTIME('%m', o.order_date) AS INTEGER) - CAST(SUBSTR(cc.cohort_month, 6, 2) AS INTEGER)) AS period_month\n    FROM orders o\n    JOIN CustomerCohorts cc ON o.customer_id = cc.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    cohort_month,\n    period_month,\n    COUNT(DISTINCT customer_id) AS active_users\nFROM OrderActivity\nGROUP BY cohort_month, period_month\nORDER BY cohort_month, period_month;\n\"\"\"\n\ndf_cohorts = pd.read_sql_query(query, conn)\ncohort_matrix = df_cohorts.pivot(index='cohort_month', columns='period_month', values='active_users')\ncohort_matrix.head(6)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет Retention Rate %\nРассчитайте процент удержания когорт относительно начального периода."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncohort_size = cohort_matrix.iloc[:, 0]\nretention_rate = cohort_matrix.divide(cohort_size, axis=0) * 100\n\nprint(\"Матрица удержания (%):\")\nprint(retention_rate.round(1).head(5))\n\nassert retention_rate.iloc[:, 0].max() == 100.0, \"В нулевой месяц удержание всегда 100%\"\nprint(\"✅ Тест успешно пройден: продуктовая матрица Retention сформирована!\")\n"}, {"type": "markdown", "content": "### 💡 Формула воронки в SQL\nИспользуйте `COUNT(CASE WHEN event = 'checkout' THEN user_id END)` для быстрого построения воронки без тяжелых JOIN."}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 7. Prompt Engineering для SQL: генерация сложных запросов и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитики генерируют SQL с помощью LLM, но проводят обязательную валидацию схемы и плана выполнения."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\ndef validate_and_explain_sql(query, connection):\n    \"\"\"Проверяет синтаксис запроса через EXPLAIN QUERY PLAN.\"\"\"\n    try:\n        explain_query = f\"EXPLAIN QUERY PLAN {query}\"\n        plan = pd.read_sql_query(explain_query, connection)\n        print(\"🟢 План выполнения запроса:\")\n        print(plan)\n        return True\n    except Exception as e:\n        print(f\"🔴 Ошибка в сгенерированном SQL: {e}\")\n        return False\n\ntest_query = \"\"\"\nSELECT \n    customer_id, \n    COUNT(order_id) AS cnt\nFROM orders\nWHERE status = 'Completed'\nGROUP BY customer_id\nHAVING cnt > 2;\n\"\"\"\n\nvalidate_and_explain_sql(test_query, conn)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Обнаружение галлюцинации схемы\nПроверьте реальные колонки таблицы `customers` и составьте валидный запрос."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npragma_df = pd.read_sql_query(\"PRAGMA table_info(customers);\", conn)\nprint(\"Реальные колонки таблицы customers:\")\nprint(pragma_df[['name', 'type']])\n\ncorrected_query = \"\"\"\nSELECT \n    customer_id, \n    first_name, \n    city,\n    registration_date\nFROM customers\nLIMIT 5;\n\"\"\"\n\nassert validate_and_explain_sql(corrected_query, conn), \"Запрос должен быть валидным\"\nprint(\"✅ Тест успешно пройден: галлюцинация схемы устранена!\")\n"}, {"type": "markdown", "content": "### 💡 Шаблон промпта для SQL\nВсегда передавайте в промпт DDL схему (`CREATE TABLE` или `PRAGMA table_info`) и требование фильтрации `status = 'Completed'`."}]}]}, {"id": "module_03_python", "title": "Модуль 3. Python и Pandas для AI аналитика", "cat": "Хард база", "badge": "Python", "icon": "🐍", "desc": "Векторная обработка, фильтрация, агрегация, группировка без зубрежки синтаксиса.", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`), объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python & Pandas)\n\n---\n\n### Вопрос 1\nПочему в Pandas категорически рекомендуется использовать векторизованные операции вместо циклов `for`?\n- [ ] Циклы for запрещены создателями Python.\n- [x] Векторизованные операции транслируются в оптимизированный C-код и выполняются в десятки и сотни раз быстрее.\n- [ ] Векторизованные операции не расходуют память.\n*Объяснение*: Pandas оперирует низкоуровневыми массивами C через NumPy, выполняя расчеты над всей колонкой единым блоком инструкций процессора (SIMD).\n\n---\n\n### Вопрос 2\nВ чем заключается ошибка при расчете общего CR компании через `df['conversion_rate'].mean()`?\n- [ ] Ошибки нет, среднее всегда корректно.\n- [x] Это математическая ошибка усреднения процентов без учета разницы в объемах трафика между филиалами/сегментами.\n- [ ] Метод .mean() не умеет работать с числами с плавающей точкой.\n*Объяснение*: Чтобы получить истинную конверсию, необходимо разделить суммарное число целевых действий на суммарный трафик (`total_actions / total_traffic`).\n\n---\n\n### Вопрос 3\nКакой результат вернет операция `df.loc[0:2]` vs `df.iloc[0:2]`?\n- [ ] Одинаковый результат.\n- [x] `.loc[0:2]` включит строки с метками 0, 1 и 2 (включая правый конец), а `.iloc[0:2]` вернет строго первые 2 строки с индексами 0 и 1 (не включая правый конец).\n- [ ] Выдаст ошибку синтаксиса.\n*Объяснение*: В `.loc` правая граница включается, так как поиск идет по именам/меткам. В `.iloc` правая граница исключается по стандартному правилу срезов Python.\n\n---\n\n### Вопрос 4\nЧто произойдет, если выполнить операцию df_sub = df[df['status'] == 'Active'], а затем изменить df_sub['flag'] = 1 без .copy()?\n- [ ] Python немедленно завершит работу аварийно.\n- [x] Возникнет SettingWithCopyWarning, так как изменения могут непредсказуемо затронуть исходный датафрейм или примениться к временной копии.\n- [ ] Датафрейм автоматически удалится.\n*Объяснение*: Метод .copy() создает независимый объект в памяти, защищая от скрытых сайд-эффектов.\n\n---\n\n### Вопрос 5\nПочему векторные вычисления в Pandas и NumPy выполняются в десятки раз быстрее обычных циклов \for в Python?\n- [ ] Они используют квантовые процессоры.\n- [x] Векторные операции скомпилированы в C/Fortran, используют непрерывные блоки памяти (SIMD) и обходят оверхед интерпретатора Python (GIL).\n- [ ] Циклы for в Python намеренно замедлены.\n*Объяснение*: Векторизация утилизирует процессорные регистры и низкоуровневую оптимизацию памяти.\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 1. Python в эпоху AI: отказ от зубрежки синтаксиса в пользу логических структур\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитику больше не нужно держать в памяти сигнатуры всех методов Pandas. LLM мгновенно генерируют код по описанию задачи.\n\n**Что критически важно понимать человеку:**\n1. **Векторизация vs циклы**: операции в Pandas и NumPy выполняются на уровне C-массивов (`O(1)` в интерпретаторе).\n2. **Мутабельность и `.copy()`**: избегание предупреждения `SettingWithCopyWarning`.\n3. **Метод декомпозиции**: последовательность трансформаций (Extract → Filter → Transform → Aggregate)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import time\nimport numpy as np\nimport pandas as pd\n\nn_elements = 1_000_000\ndata_arr = np.random.uniform(10, 1000, n_elements)\n\nstart_time = time.time()\nres_loop = [x * 1.20 for x in data_arr]\nloop_duration = time.time() - start_time\n\nstart_time = time.time()\nres_vector = data_arr * 1.20\nvec_duration = time.time() - start_time\n\nprint(f\"⏱️ Время цикла for:       {loop_duration:.4f} сек\")\nprint(f\"⚡ Время векторизации:    {vec_duration:.4f} сек\")\nprint(f\"🚀 Векторизация быстрее в {loop_duration / vec_duration:.1f} раз!\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Векторный расчет НДС и маржи\nСоздайте датафрейм из 500 000 чеков со случайными суммами от 500 до 15 000 руб.\nРассчитайте векторным способом выделенный НДС 20% и сумму без НДС."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nimport time\nimport pandas as pd\nimport numpy as np\n\nnp.random.seed(42)\ndf_sales = pd.DataFrame({\n    'gross_amount': np.random.uniform(500, 15000, 500_000)\n})\n\nt0 = time.time()\ndf_sales['vat_amount'] = df_sales['gross_amount'] * 20 / 120\ndf_sales['net_amount'] = df_sales['gross_amount'] - df_sales['vat_amount']\ncalc_time = time.time() - t0\n\nprint(f\"Расчет выполнен за: {calc_time:.4f} сек.\")\nassert calc_time < 0.25, \"Расчет должен быть векторизован\"\nassert np.isclose(df_sales['net_amount'].sum() + df_sales['vat_amount'].sum(), df_sales['gross_amount'].sum()), \"Баланс должен сходиться\"\nprint(\"✅ Тест успешно пройден: векторизация освоена!\")\n"}, {"type": "markdown", "content": "### 💡 Промпт для Cursor / Copilot\n> *«Напиши векторизованный расчет скидок по условию с использованием `np.select`, избегая `df.apply` и циклов `iterrows()`.»*"}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 2. Pandas DataFrames: глубокая индексация (.loc, .iloc) и фильтрация без ошибок\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОсновной источник багов в скриптах — непонимание разницы между `.loc` (по меткам) и `.iloc` (по целочисленным позициям)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_customers = pd.read_csv(customers_csv)\n\nmask = (\n    df_customers['city'].isin(['Moscow', 'Saint Petersburg']) &\n    (df_customers['registration_date'] >= '2025-01-01')\n)\n\nfiltered_vip = df_customers.loc[mask, ['customer_id', 'first_name', 'city', 'acquisition_channel']].copy()\nprint(f\"Найдено целевых клиентов: {len(filtered_vip)}\")\nfiltered_vip.head()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Добавление сегмента активности через .loc\nДобавьте колонку `segment = 'Capital'` для всех отфильтрованных строк через `.loc`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nfiltered_vip.loc[:, 'segment'] = 'Capital'\nprint(filtered_vip.head(3))\n\nassert 'segment' in filtered_vip.columns, \"Колонка segment обязательна\"\nassert (filtered_vip['segment'] == 'Capital').all(), \"Все строки должны иметь сегмент Capital\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Золотое правило индексации\nВсегда пишите `df.loc[mask, 'col'] = val` вместо цепочечной индексации `df[mask]['col'] = val`."}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 3. Слияния датасетов (merge, concat) и продвинутая агрегация .groupby().agg()\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ Pandas слияния таблиц выполняются через `pd.merge()`, а вычисление бизнес-метрик — через `.groupby().agg()`."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_orders = pd.read_csv(orders_csv)\ndf_cust = pd.read_csv(customers_csv)\n\ndf_full = df_orders.merge(df_cust, on='customer_id', how='inner')\n\ncity_metrics = df_full.groupby('city').agg(\n    total_orders=('order_id', 'count'),\n    unique_buyers=('customer_id', 'nunique')\n).reset_index()\n\ncity_metrics['orders_per_buyer'] = city_metrics['total_orders'] / city_metrics['unique_buyers']\ncity_metrics = city_metrics.sort_values(by='total_orders', ascending=False)\ncity_metrics.head(5)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Анализ каналов привлечения\nРассчитайте для каждого канала (`acquisition_channel`) общее число заказов и число уникальных покупателей."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nchannel_metrics = df_full.groupby('acquisition_channel').agg(\n    total_orders=('order_id', 'count'),\n    unique_buyers=('customer_id', 'nunique')\n).reset_index()\n\nprint(channel_metrics)\n\nassert not channel_metrics.empty, \"Датафрейм не должен быть пустым\"\nassert 'acquisition_channel' in channel_metrics.columns, \"Колонка обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Именованная агрегация\nИспользуйте понятный синтаксис кортежей в `agg`:\n```python\ndf.groupby('channel').agg(orders=('id', 'count'), users=('user_id', 'nunique'))\n```"}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 4. Эксплораторный анализ данных (EDA) и визуализация в Seaborn & Matplotlib\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭксплораторный анализ данных (EDA) позволяет увидеть распределения, тяжелые хвосты и выбросы."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\ndf_saas = pd.read_csv(saas_csv)\n\nplt.figure(figsize=(9, 4), facecolor='#fefefe')\nsns.boxplot(\n    data=df_saas, \n    x='plan', \n    y='mrr', \n    palette=['#1779ba', '#3adb76', '#ffae00']\n)\nplt.title(\"Распределение MRR по тарифным планам\", fontsize=13, fontweight='bold', pad=12)\nplt.xlabel(\"Тарифный план\", fontweight='bold')\nplt.ylabel(\"Monthly Recurring Revenue ($)\", fontweight='bold')\nplt.grid(axis='y', linestyle='--', alpha=0.5)\nplt.tight_layout()\nplt.show()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет квантилей MRR для плана Enterprise\nРассчитайте 25-й (Q1), медиану (Q2) и 75-й (Q3) процентили MRR для тарифа Enterprise."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nent_mrr = df_saas[df_saas['plan'] == 'Enterprise']['mrr']\n\nq1 = ent_mrr.quantile(0.25)\nmed = ent_mrr.median()\nq3 = ent_mrr.quantile(0.75)\n\nprint(f\"Enterprise Q1: {q1:.1f}, Med: {med:.1f}, Q3: {q3:.1f}\")\n\nassert q3 >= q1 and len(ent_mrr) > 0, \"Квантили рассчитаны корректно\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Почему боксплот надежнее среднего?\nМедиана и IQR устойчивы к единичным экстремальным значениям."}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 5. Code Review AI-кода: юнит-тесты, assert-проверки и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик несет персональную ответственность за выводы. Самопроверяющиеся скрипты с `assert` гарантируют целостность данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndef validate_financial_pipeline(df):\n    assert df['amount'].notna().all(), \"Критическая ошибка: обнаружены NULL суммы!\"\n    assert (df['amount'] >= 0).all(), \"Критическая ошибка: отрицательные платежи!\"\n    assert df['transaction_id'].is_unique, \"Критическая ошибка: дубликаты ID!\"\n    print(\"🟢 Все 3 бизнес-инварианта подтверждены!\")\n    return True\n\ndf_tx = pd.DataFrame({\n    'transaction_id': [101, 102, 103, 104],\n    'amount': [1200.0, 3450.0, 890.0, 5600.0]\n})\nvalidate_financial_pipeline(df_tx)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидатор конверсий\nНапишите функцию `validate_conversion(cr_series)`, проверяющую диапазон 0.0 <= CR <= 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndef validate_conversion(cr_series):\n    assert (cr_series >= 0.0).all(), \"Конверсия не может быть отрицательной\"\n    assert (cr_series <= 1.0).all(), \"Конверсия не может превышать 100%\"\n    print(\"🟢 Валидация успешна!\")\n    return True\n\nvalid_cr = pd.Series([0.024, 0.051, 0.12])\nvalidate_conversion(valid_cr)\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Чек-лист фактчекинга\n1. Проверка деления на 0.\n2. Проверка типов колонок.\n3. Проверка изменения числа строк после слияний."}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4. Очистка данных и Data Quality", "cat": "Хард база", "badge": "Качество", "icon": "🧹", "desc": "Пропуски, аномалии, дедупликация, приведение типов и автоматические валидаторы.", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Очистка и качество данных)\n\n---\n\n### Вопрос 1\nЧто означает пропуск типа MNAR (Missing Not at Random)?\n- [ ] Данные потерялись из-за случайного обрыва связи Wi-Fi.\n- [x] Вероятность отсутствия значения напрямую связана с самим этим скрытым значением (например, люди с очень низким доходом отказываются его называть).\n- [ ] Ошибка в формате даты.\n*Объяснение*: При MNAR нельзя просто удалять строки или заменять их на среднее, так как это системно исказит распределение.\n\n---\n\n### Вопрос 2\nЧто делать, если в транзакциях интернет-магазина обнаружен заказ на сумму в 50 раз выше среднего чека?\n- [ ] Немедленно удалить этот заказ как выброс.\n- [x] Проверить контекст: если это реальный оптовый покупатель, сохранить его в базе, но при расчете розничного среднего чека выделить в отдельный B2B-сегмент.\n- [ ] Заменить сумму на медиану.\n*Объяснение*: Выбросы в коммерческих данных часто представляют наиболее ценный сегмент клиентов (B2B, киты), который требует отдельного анализа.\n\n---\n\n### Вопрос 3\nКакое регулярное выражение (RegEx) извлечет только цифры из строки `Order #4592-A`?\n- [ ] `[A-Z]+`\n- [x] `\\d+`\n- [ ] `\\s+`\n*Объяснение*: `\\d` обозначает digit (любую цифру от 0 до 9), а квантификатор `+` означает одно или более вхождений.\n\n---\n\n### Вопрос 4\nЧто такое пропуск типа MNAR (Missing Not at Random) и почему его нельзя заполнять средним?\n- [ ] Это случайный сбой сетевого оборудования.\n- [x] Вероятность пропуска напрямую связана со скрытым значением величины (например, респонденты с экстремально высоким доходом скрывают его), и заполнение средним исказит распределение.\n- [ ] Пропуски MNAR всегда равны нулю.\n*Объяснение*: Заполнение MNAR средним или медианой радикально смещает статистические тесты.\n\n---\n\n### Вопрос 5\nКак метод межквартильного размаха (IQR) находит выбросы в данных?\n- [ ] Он делит все значения на 100.\n- [x] Выбросами считаются точки за пределами диапазона [Q1 - 1.5 * IQR, Q3 + 1.5 * IQR], где IQR = Q3 - Q1.\n- [ ] Выбросами считаются все отрицательные числа.\n*Объяснение*: Правило 1.5*IQR Тьюки робастно к аномалиям, в отличие от стандартного отклонения.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 1. Грязные данные: пропуски (MCAR/MAR/MNAR) и приведение типов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ реальном бизнесе 80% времени уходит на очистку данных. Пропуски делятся на:\n* **MCAR** (Missing Completely at Random) — случайный сбой датчика\n* **MAR** (Missing at Random) — пропуск зависит от других наблюдаемых полей\n* **MNAR** (Missing Not at Random) — пропуск зависит от самого значения (клиенты с высоким доходом скрывают зарплату)"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nprint(\"Аудит пропущенных значений в saas_users.csv:\")\nmissing_report = pd.DataFrame({\n    'missing_count': df_saas.isna().sum(),\n    'missing_pct': (df_saas.isna().mean() * 100).round(2)\n})\nprint(missing_report[missing_report['missing_count'] > 0])\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Корректная обработка пропусков в churn_date\nКолонка `churn_date` пуста для активных клиентов (`is_churned = 0`).\nЗаполните `churn_date` для активных клиентов значением 'Still_Active' и убедитесь, что пропусков не осталось."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_clean = df_saas.copy()\ndf_clean['churn_date_filled'] = df_clean['churn_date'].fillna('Still_Active')\n\nassert df_clean['churn_date_filled'].isna().sum() == 0, \"Пропусков не должно остаться\"\nprint(\"✅ Тест успешно пройден: пропуски обработаны осмысленно!\")\n"}, {"type": "markdown", "content": "### 💡 Ловушка среднего при заполнении пропусков\nЗаполнение пропусков средним (`df.fillna(df.mean())`) искусственно занижает дисперсию и искажает доверительные интервалы."}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 2. Дедупликация и нормализация строковых полей через RegEx\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПользовательский ввод полон опечаток: 'Москва', ' москва ', 'г. Москва', 'МСК'. Аналитик обязан приводить строки к каноническому виду."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport re\n\ndirty_cities = pd.Series([\n    \"  Москва \", \"москва\", \"г. Москва\", \"Санкт-Петербург\", \"СПб\", \"спб \"\n])\n\ndef clean_city_name(raw):\n    s = str(raw).strip().lower()\n    s = re.sub(r'г\\.\\s*', '', s)\n    if 'москв' in s:\n        return 'Москва'\n    elif 'петербург' in s or 'спб' in s:\n        return 'Санкт-Петербург'\n    return s.title()\n\ncleaned = dirty_cities.apply(clean_city_name)\nprint(cleaned)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Нормализация номеров телефонов\nНапишите функцию очистки номеров телефонов от скобок, пробелов и дефисов, приводящую их к формату 79991234567."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nraw_phones = pd.Series([\"+7 (999) 123-45-67\", \"8 999 1234567\", \"79991234567\", \"+7(999)1234567\"])\n\ndef normalize_phone(phone):\n    digits = re.sub(r'\\D', '', str(phone))\n    if digits.startswith('8'):\n        digits = '7' + digits[1:]\n    return digits\n\nclean_phones = raw_phones.apply(normalize_phone)\nprint(clean_phones)\n\nassert (clean_phones == '79991234567').all(), \"Все номера должны быть приведены к каноническому виду\"\nprint(\"✅ Тест успешно пройден: RegEx очистка работает безошибочно!\")\n"}, {"type": "markdown", "content": "### 💡 Дедупликация в Pandas\n`df.drop_duplicates(subset=['user_id'], keep='last')` — сохраняет самое актуальное состояние записи."}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 3. Поиск аномалий и выбросов: Z-Score, метод Тьюки (IQR) и изоляционный лес\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВыбросы искажают средний чек и ломают метрики воронки. Существует два классических статистических метода:\n1. **Правило 3 сигм (Z-Score)**: для нормальных распределений\n2. **Метод межквартильного размаха (IQR)**: для распределений с тяжелыми хвостами"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nq1 = df_saas['mrr'].quantile(0.25)\nq3 = df_saas['mrr'].quantile(0.75)\niqr = q3 - q1\n\nlower_bound = q1 - 1.5 * iqr\nupper_bound = q3 + 1.5 * iqr\n\noutliers = df_saas[(df_saas['mrr'] < lower_bound) | (df_saas['mrr'] > upper_bound)]\nprint(f\"Порог выбросов: < {lower_bound:.1f} или > {upper_bound:.1f}\")\nprint(f\"Обнаружено аномальных записей: {len(outliers)}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Винзоризация (Winsorization)\nВместо удаления выбросов примените винзоризацию: ограничьте максимальные значения 99-м процентилем."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\np99 = df_saas['mrr'].quantile(0.99)\ndf_winsorized = df_saas['mrr'].clip(upper=p99)\n\nprint(f\"Исходный максимум: {df_saas['mrr'].max():.1f}\")\nprint(f\"Винзоризованный максимум: {df_winsorized.max():.1f}\")\n\nassert df_winsorized.max() <= p99, \"Значения не должны превышать 99-й процентиль\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Когда удалять выбросы нельзя?\nВ задачах поиска мошенничества (Fraud Detection) или оттока крупных клиентов именно выбросы содержат ключевую ценность."}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 4. Автоматизация очистки: построение воспроизводимых конвейеров\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик не очищает данные руками в блокноте. Он оформляет логику в пайплайн, готовый к запуску в Airflow или dbt."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndef clean_orders_pipeline(raw_orders):\n    df = raw_orders.copy()\n    df['order_date'] = pd.to_datetime(df['order_date'])\n    df = df.dropna(subset=['order_id', 'customer_id'])\n    df = df[df['status'] != 'Cancelled']\n    return df\n\ndf_raw = pd.read_csv(orders_csv)\ndf_clean = clean_orders_pipeline(df_raw)\nprint(f\"До очистки: {len(df_raw)} строк, после: {len(df_clean)} строк\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Добавление валидации пайплайна\nДобавьте проверку `assert not df_clean.empty` и убедитесь, что датасет валиден."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert not df_clean.empty, \"Датафрейм не должен быть пустым\"\nassert 'order_id' in df_clean.columns, \"Колонка order_id обязательна\"\nprint(\"✅ Тест успешно пройден: пайплайн очистки готов к продакшену!\")\n"}, {"type": "markdown", "content": "### 💡 Архитектура Data Quality\nВ 2027 году используются инструменты Great Expectations и Soda Core для проверки контрактов данных (Data Contracts)."}]}]}, {"id": "module_05_statistics", "title": "Модуль 5. Статистика и проверка гипотез", "cat": "Аналитика", "badge": "Статы", "icon": "📈", "desc": "ЦПТ, p-value, t-тест Стьюдента, Манн-Уитни, бутстреп и доверительные интервалы.", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика & Гипотезы)\n\n---\n\n### Вопрос 1\nЧто в строгом математическом смысле показывает $p\\text{-value} = 0.02$?\n- [ ] Вероятность того, что альтернативная гипотеза верна, равна 98%.\n- [x] Вероятность получить такое же или еще более сильное различие случайно, если нулевая гипотеза (об отсутствии эффекта) на самом деле верна, составляет 2%.\n- [ ] Ошибка в расчете доверительного интервала.\n*Объяснение*: $p$-value — это условная вероятность наблюдаемых данных при истинности нулевой гипотезы $P(\\text{Data} | H_0)$.\n\n---\n\n### Вопрос 2\nВ каких случаях следует отдать предпочтение U-критерию Манна-Уитни перед t-тестом Стьюдента?\n- [ ] Когда выборка идеально подчиняется нормальному распределению Гаусса.\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты и не подчиняются нормальному распределению (например, доходы или чеки).\n- [ ] Когда сравниваются доли конверсий.\n*Объяснение*: Манна-Уитни — непараметрический ранговый критерий, он сравнивает распределение рангов и устойчив к экстремальным выбросам.\n\n---\n\n### Вопрос 3\nЧто описывает Парадокс Симпсона?\n- [ ] Ошибку округления при делении на ноль.\n- [x] Ситуацию, когда тренд, наблюдаемый в отдельных подгруппах данных, полностью исчезает или меняет знак на противоположный при объединении этих групп.\n- [ ] Корреляцию двух не связанных случайных величин.\n*Объяснение*: Парадокс возникает из-за неравномерного распределения скрытой переменной (confounding variable), например, перекоса трафика между десктопом и мобайлом.\n\n---\n\n### Вопрос 4\nЧто утверждает Центральная Предельная Теорема (ЦПТ) простыми словами?\n- [ ] Любая выборка всегда распределена нормально.\n- [x] Распределение выборочных средних стремится к нормальному при росте объема выборки, даже если исходная генеральная совокупность не является нормальной.\n- [ ] Среднее значение выборки всегда равно нулю.\n*Объяснение*: ЦПТ позволяет использовать t-тесты и z-тесты для средних даже на сильно скошенных исходных данных при достаточном N.\n\n---\n\n### Вопрос 5\nЧто такое Ошибка I рода (False Positive) в статистических выводах?\n- [ ] Не заметить реально существующий эффект.\n- [x] Отклонить верную нулевую гипотезу (ложно объявить победу теста при отсутствии реальных различий).\n- [ ] Ошибка синтаксиса в формуле.\n*Объяснение*: Ошибка первого рода контролируется уровнем значимости alpha (обычно 5%).\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 1. Описательная статистика: среднее, медиана, мода, дисперсия и асимметрия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСреднее значение в отчетах обманывает руководство. В асимметричных распределениях медиана отражает реальный опыт пользователя."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nmean_mrr = df_saas['mrr'].mean()\nmedian_mrr = df_saas['mrr'].median()\nstd_mrr = df_saas['mrr'].std()\nskew_mrr = df_saas['mrr'].skew()\n\nprint(f\"Средний MRR:    ${mean_mrr:.2f}\")\nprint(f\"Медианный MRR:  ${median_mrr:.2f}\")\nprint(f\"Стандартное откл.: ${std_mrr:.2f}\")\nprint(f\"Коэф. асимметрии:  {skew_mrr:.2f} (скошен вправо)\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Сравнение среднего и медианы по тарифным планам\nСгруппируйте `saas_users.csv` по тарифным планам (`plan`) и рассчитайте разницу между средним и медианой."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nplan_stats = df_saas.groupby('plan')['mrr'].agg(['mean', 'median'])\nplan_stats['diff'] = plan_stats['mean'] - plan_stats['median']\n\nprint(plan_stats)\nassert not plan_stats.empty, \"Сводка не должна быть пустой\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Когда использовать медиану?\nЗарплаты, цены на недвижимость, чеки интернет-магазинов и время ответа сервера (latency p95/p99) всегда анализируются через медианы и квантили."}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 2. Теория вероятностей: закон больших чисел и теорема Байеса\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nТеорема Байеса обновляет уверенность в гипотезе по мере поступления новых данных:\n`P(A|B) = P(B|A) * P(A) / P(B)`"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Байесовский расчет: вероятность оттока при падении активности\np_churn = 0.08             # Базовая вероятность оттока (Prior)\np_drop_if_churn = 0.75     # Вероятность падения активности у ушедших\np_drop_if_stay = 0.15      # Вероятность падения активности у оставшихся\n\n# Полная вероятность падения активности\np_drop = (p_drop_if_churn * p_churn) + (p_drop_if_stay * (1 - p_churn))\n\n# Апостериорная вероятность оттока P(Churn | Drop)\np_churn_given_drop = (p_drop_if_churn * p_churn) / p_drop\nprint(f\"Базовая вероятность оттока:          {p_churn:.1%}\")\nprint(f\"Вероятность оттока при падении сессий: {p_churn_given_drop:.1%}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет ложноположительных срабатываний (False Positives)\nРассчитайте вероятность того, что клиент с упавшей активностью на самом деле НЕ уйдет в отток."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\np_stay_given_drop = 1.0 - p_churn_given_drop\nprint(f\"Вероятность ложной тревоги: {p_stay_given_drop:.1%}\")\n\nassert np.isclose(p_churn_given_drop + p_stay_given_drop, 1.0), \"Сумма вероятностей равна 1\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Инсайт для продуктовой аналитики\nДаже при сильном сигнале (75% ушедших снизили активность) из-за редкого базового оттока (8%) большинство тревог оказываются ложными."}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 3. Распределения, Центральная предельная теорема (ЦПТ) и доверительные интервалы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЦентральная предельная теорема (ЦПТ) — краеугольный камень A/B тестирования: распределение выборочных средних стремится к нормальному при росте размера выборки, независимо от формы исходного распределения."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nimport matplotlib.pyplot as plt\n\n# Экспоненциальное распределение (время сессии, чеки)\nnp.random.seed(42)\npop = np.random.exponential(scale=50, size=100_000)\n\n# Выборочные средние по 1000 выборкам размера 100\nsample_means = [np.random.choice(pop, 100).mean() for _ in range(1000)]\n\nprint(f\"Среднее генеральной совокупности: {pop.mean():.2f}\")\nprint(f\"Среднее выборочных средних:       {np.mean(sample_means):.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет 95% доверительного интервала\nРассчитайте 95% доверительный интервал для среднего чека по формуле: `mean +- 1.96 * (std / sqrt(n))`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsample = np.random.choice(pop, 500)\nmean_s = sample.mean()\nstd_s = sample.std()\nn = len(sample)\n\nci_lower = mean_s - 1.96 * (std_s / np.sqrt(n))\nci_upper = mean_s + 1.96 * (std_s / np.sqrt(n))\n\nprint(f\"Точечная оценка: {mean_s:.2f}\")\nprint(f\"95% Доверительный интервал: [{ci_lower:.2f}, {ci_upper:.2f}]\")\n\nassert ci_upper > ci_lower, \"Верхняя граница выше нижней\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Что означает 95% доверительный интервал?\nЕсли мы повторим эксперимент 100 раз, в 95 случаях построенный интервал накроет истинное среднее генеральной совокупности."}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 4. Проверка статистических гипотез: p-value, t-тест Стьюдента и критерий Манна-Уитни\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКак доказать, что рост метрики в тесте — это не случайный шум?\n* **t-тест Стьюдента**: сравнивает средние значения двух выборок (требует достаточного размера выборки по ЦПТ)\n* **Критерий Манна-Уитни**: непараметрический тест для рангов в сильно скошенных данных"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\nnp.random.seed(42)\n# Контрольная группа (A) и Тестовая группа (B)\ngroup_a = np.random.normal(loc=120, scale=30, size=200)\ngroup_b = np.random.normal(loc=127, scale=30, size=200) # Реальный прирост +7\n\nt_stat, p_val = stats.ttest_ind(group_a, group_b)\nprint(f\"t-статистика: {t_stat:.3f}\")\nprint(f\"p-value:      {p_val:.4f}\")\n\nif p_val < 0.05:\n    print(\"🟢 Различия статистически значимы на уровне alpha=0.05\")\nelse:\n    print(\"🔴 Нет оснований отвергнуть нулевую гипотезу\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка через непараметрический тест Манна-Уитни\nПримените тест Манна-Уитни (`stats.mannwhitneyu`) и сравните полученный p-value с t-тестом."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nu_stat, u_pval = stats.mannwhitneyu(group_a, group_b, alternative='two-sided')\nprint(f\"Mann-Whitney U: {u_stat:.1f}, p-value: {u_pval:.4f}\")\n\nassert u_pval < 0.05, \"Различия должны быть значимы\"\nprint(\"✅ Тест успешно пройден: критерий Манна-Уитни подтвердил результат!\")\n"}, {"type": "markdown", "content": "### 💼 Что на самом деле означает p-value?\np-value — это вероятность получить такие же или еще более экстремальные различия при условии, что на самом деле эффекта нет (нулевая гипотеза верна). Это НЕ вероятность правоты гипотезы."}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 5. Корреляция и регрессионный анализ: линейная (OLS) и логистическая регрессия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКорреляция не означает причинно-следственную связь (Correlation != Causation). Регрессионный анализ позволяет изолировать влияние факторов при контроле сопутствующих переменных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nfrom scipy import stats\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Линейная регрессия (OLS): Зависимость MRR от количества рабочих мест (active_seats)\nres = stats.linregress(df_saas['active_seats'], df_saas['mrr'])\nprint(f\"Коэффициент наклона (Slope / Прирост на 1 место): ${res.slope:.2f}\")\nprint(f\"Свободный член (Intercept):                     ${res.intercept:.2f}\")\nprint(f\"R-квадрат (R²):                                  {res.rvalue**2:.3f}\")\nprint(f\"p-value:                                         {res.pvalue:.4e}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Интерпретация коэффициента наклона\nОпределите, на сколько долларов возрастает ожидаемый MRR при подключении 1 дополнительного рабочего места (`slope` при `active_seats`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nseat_coef = res.slope\nprint(f\"Прирост MRR на 1 рабочее место: ${seat_coef:.2f}\")\n\nassert seat_coef > 0, \"Коэффициент должен быть положительным\"\nprint(\"✅ Тест успешно пройден: модель линейной регрессии оценена!\")\n"}, {"type": "markdown", "content": "### 💡 Логистическая регрессия для прогнозирования оттока\nДля бинарных исходов (ушел в отток / остался: 1 или 0) используется логистическая регрессия (`Logit`), моделирующая логарифм шансов (log-odds)."}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 6. Статистические ловушки в бизнесе: парадокс Симпсона, регрессия к среднему и подглядывание\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСамые дорогие ошибки бизнеса совершаются из-за неверной трактовки статистики:\n1. **Парадокс Симпсона**: тренд, наблюдаемый в отдельных группах, обращается вспять при объединении данных.\n2. **Peeking Problem**: ежедневная проверка A/B теста до набора выборки увеличивает ложную значимость в 3-5 раз.\n3. **Регрессия к среднему**: после аномально успешного месяца следующий почти наверняка будет ближе к норме."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, file
