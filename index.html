b.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\n# Пайплайн автоматической верификации баланса\ndef verify_financial_integrity(df_transactions, reported_total):\n    calculated_total = df_transactions['amount'].sum()\n    discrepancy = abs(calculated_total - reported_total)\n    is_valid = discrepancy < 0.01\n    return is_valid, discrepancy\n\nsample_tx = pd.DataFrame({'amount': [100.50, 200.25, 45.25]})\nvalid, diff = verify_financial_integrity(sample_tx, 346.00)\n\nprint(f\"Баланс сошелся: {valid} (Расхождение: ${diff:.4f})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Детекция расхождения в балансе\nПроверьте реакцию валидатора на сфальсифицированную сумму 400.00."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nbad_valid, bad_diff = verify_financial_integrity(sample_tx, 400.00)\nassert not bad_valid, \"Валидатор должен зафиксировать ошибку\"\nassert bad_diff > 50.0, \"Расхождение должно быть обнаружено\"\nprint(\"✅ Тест успешно пройден: валидатор целостности надежен!\")\n"}, {"type": "markdown", "content": "### 💡 Золотое правило Data Analyst 2027\nAI генерирует гипотезы и черновики кода, но валидируют результат автотесты и математические инварианты."}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10. LLM API и неструктурированные данные", "cat": "AI стек", "badge": "API", "icon": "🔌", "desc": "Парсинг отзывов, классификация клиентских обращений, NER и извлечение JSON из текста.", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API & Неструктурированные данные)\n\n---\n\n### Вопрос 1\nЗачем в аналитических пайплайнах обогащения данных использовать Structured Outputs (Pydantic / JSON Mode)?\n- [ ] Чтобы нейросеть писала более вежливые ответы.\n- [x] Чтобы модель гарантированно вернула валидный JSON строго заданной структуры с проверкой типов полей, исключая поломку ETL-пайплайна.\n- [ ] Чтобы снизить задержку сети.\n*Объяснение*: Structured Outputs принудительно направляет сэмплирование токенов согласно переданной JSON-схеме.\n\n---\n\n### Вопрос 2\nКакую температуру (`temperature`) следует указывать при вызове LLM для извлечения фактов и разметки тональности?\n- [ ] 1.5 (для максимального разнообразия).\n- [x] 0.0 (для максимальной детерминированности, воспроизводимости и строгого следования схеме).\n- [ ] 0.8.\n*Объяснение*: Для аналитических задач и классификации требуется нулевая случайность (greedy decoding).\n\n---\n\n### Вопрос 3\nСколько примерно стоит классификация 10 000 коротких отзывов клиентов через современные эффективные LLM (например, Gemini Flash / GPT-4o-mini)?\n- [ ] Около \\$500.\n- [x] Менее \\$1.00 (порядка 50-80 рублей).\n- [ ] Более \\$10 000.\n*Объяснение*: Цены на легковесные модели упали до \\$0.10–\\$0.15 за миллион токенов, делая автоматическую разметку текста невероятно дешевой.\n\n---\n\n### Вопрос 4\nЧто такое Prompt Caching и какую экономию он дает в ETL-пайплайнах?\n- [ ] Сохранение ответов в файл Excel.\n- [x] Кэширование неизменяемого системного префикса промпта на стороне провайдера API, снижающее стоимость входных токенов на 75-90%.\n- [ ] Отключение платных запросов.\n*Объяснение*: При обработке миллионов строк кэширование схемы и инструкций сокращает расходы компании в разы.\n\n---\n\n### Вопрос 5\nПочему параметр temperature при аналитической обработке данных через LLM API выставляют строго в 0.0?\n- [ ] При температуре 0 процессор не нагревается.\n- [x] Температура 0.0 обеспечивает максимальную детерминированность и воспроизводимость извлечения фактов и классификации.\n- [ ] Значения выше 0 запрещены правилами API.\n*Объяснение*: Стохастический шум недопустим в задачах точной разметки финансовых и продуктовых данных.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 1. Работа с LLM API в Python: OpenAI, Anthropic и Google Gemini\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитик использует LLM API как функцию в data-пайплайнах:\n1. Архитектура Client-Request: передача сообщений (role: system / user / assistant).\n2. Параметры генерации: `temperature` (0.0 для детерминированного анализа данных, 0.7 для креатива), `max_tokens`.\n3. Обработка Rate Limits и Exponential Backoff при сетевых ошибках."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import json\nimport time\n\n# Моделирование унифицированного клиента вызова LLM API с повторными попытками\ndef mock_llm_api_call(messages, temperature=0.0, max_retries=3):\n    \"\"\"Имитация вызова API с защитой Exponential Backoff.\"\"\"\n    for attempt in range(max_retries):\n        try:\n            # Симулируем успешный вызов\n            system_role = [m['content'] for m in messages if m['role'] == 'system'][0]\n            user_msg = [m['content'] for m in messages if m['role'] == 'user'][0]\n            response_payload = {\n                \"id\": \"chatcmpl-mock-2027\",\n                \"model\": \"gpt-4o-mini\",\n                \"temperature\": temperature,\n                \"usage\": {\"prompt_tokens\": 45, \"completion_tokens\": 20, \"total_tokens\": 65},\n                \"choices\": [{\n                    \"message\": {\n                        \"role\": \"assistant\",\n                        \"content\": f\"Аналитический вывод по запросу '{user_msg}': Зафиксирован рост конверсии на 3.4%.\"\n                    }\n                }]\n            }\n            return response_payload\n        except Exception as e:\n            wait = 2 ** attempt\n            time.sleep(wait)\n    raise RuntimeError(\"API недоступен после всех попыток\")\n\ntest_messages = [\n    {\"role\": \"system\", \"content\": \"Ты Staff Data Analyst.\"},\n    {\"role\": \"user\", \"content\": \"Проанализируй динамику A/B теста #42\"}\n]\nresp = mock_llm_api_call(test_messages)\nprint(\"Ответ API:\")\nprint(resp['choices'][0]['message']['content'])\nprint(f\"Потреблено токенов: {resp['usage']['total_tokens']}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка детерминированности температуры\nДля строгих математических расчетов температура обязана быть равна 0.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert resp['temperature'] == 0.0, \"Для аналитики всегда используйте temperature=0.0\"\nassert \"usage\" in resp, \"Ответ API должен возвращать метрики токенов\"\nprint(\"✅ Тест успешно пройден: стандарты работы с API соблюдены!\")\n"}, {"type": "markdown", "content": "### 💡 Почему temperature=0.0 критична для аналитики?\nНенулевая температура вносит стохастический шум, из-за чего один и тот же отчет о выручке при повторном запуске может выдать разные цифры."}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 2. Извлечение структурированных сущностей из неструктурированных данных (NER)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\n\n## 📌 Бизнес-контекст и методология\n80% корпоративных данных — неструктурированные: логи чатов саппорта, PDF-счета, отзывы на маркетплейсах.\nАналитик создает пайплайны Named Entity Recognition (NER), извлекающие атрибуты в строгую таблицу Pandas."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import re\nimport pandas as pd\n\nraw_messages = [\n    \"Клиент ООО 'Вектор' (ИНН 7701234567) жалуется на задержку поставки на 4 дня.\",\n    \"Компания АО 'Технопром' (ИНН 7809876543) просит увеличить лимит до 500 000 руб.\",\n    \"ИП Смирнов (ИНН 500112233445) запросил закрытие счета.\"\n]\n\nextracted_records = []\nfor msg in raw_messages:\n    inn_match = re.search(r'ИНН\\s+(\\d+)', msg)\n    inn = inn_match.group(1) if inn_match else None\n    \n    org_match = re.search(r'(?:ООО|АО|ИП)\\s+([^\\(\\)]+)', msg)\n    org_name = org_match.group(0).strip() if org_match else \"Unknown\"\n    \n    extracted_records.append({\n        'organization': org_name,\n        'inn': inn,\n        'raw_text_len': len(msg)\n    })\n\ndf_entities = pd.DataFrame(extracted_records)\nprint(\"📊 Извлеченные структурированные сущности:\")\nprint(df_entities)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация полноты извлечения\nУбедитесь, что для всех 3 сообщений ИНН был успешно извлечен без пропусков."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert df_entities['inn'].notna().all(), \"Все ИНН должны быть извлечены\"\nassert len(df_entities) == 3, \"Должно быть 3 записи\"\nprint(\"✅ Тест успешно пройден: неструктурированные данные преобразованы в Dataframe!\")\n"}, {"type": "markdown", "content": "### 💼 Пайплайн обработки текста в 2027 году\nLLM извлекает сложные семантические сущности (тональность, контекст претензии), а быстрые RegEx валидируют строгие форматы (ИНН, номера заказов, email)."}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 3. Structured Outputs через Pydantic: гарантия схемы и типизации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ продакшене аналитик не имеет права получать от модели произвольный текст.\nИспользование Pydantic позволяет валидировать входные и выходные типы данных, гарантируя соблюдение схемы перед записью в хранилище."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "from pydantic import BaseModel, Field, ValidationError\nfrom typing import List, Literal\n\nclass SentimentAnalysisOutput(BaseModel):\n    sentiment: Literal['POSITIVE', 'NEUTRAL', 'NEGATIVE']\n    score: float = Field(..., ge=0.0, le=1.0, description=\"Уверенность модели\")\n    detected_topics: List[str] = Field(default_factory=list)\n\n# Проверка валидного ответа\nvalid_payload = {\n    \"sentiment\": \"NEGATIVE\",\n    \"score\": 0.94,\n    \"detected_topics\": [\"slow_delivery\", \"damaged_box\"]\n}\n\nparsed_obj = SentimentAnalysisOutput(**valid_payload)\nprint(\"🟢 Успешная валидация объекта Pydantic:\")\nprint(parsed_obj.model_dump())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Перехват невалидных данных\nПроверьте, что передача `score = 1.5` (вне диапазона [0, 1]) вызывает исключение `ValidationError`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncaught_error = False\ntry:\n    bad_payload = {\"sentiment\": \"POSITIVE\", \"score\": 1.5, \"detected_topics\": []}\n    SentimentAnalysisOutput(**bad_payload)\nexcept ValidationError:\n    caught_error = True\n\nassert caught_error, \"Pydantic обязан отловить нарушение валидации диапазона score\"\nprint(\"✅ Тест успешно пройден: строгий контракт схемы защищает пайплайн!\")\n"}, {"type": "markdown", "content": "### 💡 Интеграция с базой данных\nОбъекты Pydantic конвертируются в словари через `.model_dump()` и напрямую вставляются в PostgreSQL через SQLAlchemy или DuckDB."}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 4. Batch-процессинг, расчет стоимости токенов и оптимизация затрат (FinOps LLM)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПри обработке 1 000 000 отзывов клиентов вызов API в лоб может стоить тысячи долларов.\nСтратегии оптимизации затрат (FinOps):\n1. **Batch API**: скидка 50% при асинхронной пакетной обработке в течение 24 часов.\n2. **Prompt Caching**: кэширование системного промпта снижает стоимость входных токенов на 75-90%.\n3. **Моделирование размеров моделей**: 90% задач аналитики закрываются быстрыми моделями (mini / flash)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Калькулятор стоимости обработки корпуса текстов\nn_records = 500_000\ntokens_per_input = 400\ntokens_per_output = 50\n\n# Цены за 1M токенов (ориентир 2026-2027)\nprice_input_per_m = 0.15   # $0.15 за 1M токенов вход\nprice_output_per_m = 0.60  # $0.60 за 1M токенов выход\n\ntotal_input_tokens = n_records * tokens_per_input\ntotal_output_tokens = n_records * tokens_per_output\n\ncost_input = (total_input_tokens / 1_000_000) * price_input_per_m\ncost_output = (total_output_tokens / 1_000_000) * price_output_per_m\ntotal_cost_standard = cost_input + cost_output\n\n# При использовании Batch API (-50%)\ncost_batch_api = total_cost_standard * 0.50\n\nprint(f\"Объем данных:                         {n_records:,} записей\")\nprint(f\"Всего входных токенов:               {total_input_tokens:,}\")\nprint(f\"Стоимость Real-time API:             ${total_cost_standard:.2f}\")\nprint(f\"Стоимость через Batch API (-50%):     ${cost_batch_api:.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Экономия при Prompt Caching\nЕсли 300 из 400 входных токенов кэшируются со скидкой 80%, рассчитайте итоговую экономию."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncached_tokens = 300\nuncached_tokens = 100\n\ncached_input_cost = (n_records * cached_tokens / 1_000_000) * (price_input_per_m * 0.20)\nuncached_input_cost = (n_records * uncached_tokens / 1_000_000) * price_input_per_m\ntotal_caching_cost = cached_input_cost + uncached_input_cost + cost_output\n\nprint(f\"Стоимость с Prompt Caching: ${total_caching_cost:.2f}\")\nassert total_caching_cost < total_cost_standard * 0.70, \"Кэширование должно дать существенную экономию\"\nprint(\"✅ Тест успешно пройден: FinOps оптимизация доказана расчетом!\")\n"}, {"type": "markdown", "content": "### 💼 Правило FinOps для аналитика\nВсегда рассчитывайте бюджет до запуска пакетной обработки в цикле `for`."}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11. RAG и векторные базы данных", "cat": "AI стек", "badge": "RAG", "icon": "🔍", "desc": "ChromaDB, семантический поиск, эмбеддинги и вопросно-ответные системы по документам.", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG & Векторные базы данных)\n\n---\n\n### Вопрос 1\nВ чем заключается главное преимущество архитектуры RAG перед файнтюнингом (дообучением) модели на данных компании?\n- [ ] RAG работает без использования электричества.\n- [x] RAG позволяет обращаться к постоянно обновляемым корпоративным документам в реальном времени без дорогостоящего переобучения нейросети и дает ссылки на точные источники.\n- [ ] RAG используется только для картинок.\n*Объяснение*: При изменении регламента или добавлении данных достаточно обновить индекс в векторной БД, не меняя веса модели.\n\n---\n\n### Вопрос 2\nЧто показывает косинусное сходство (Cosine Similarity) между двумя эмбеддингами?\n- [ ] Разницу в количестве букв в тексте.\n- [x] Косинус угла между векторами в многомерном пространстве (от 1.0 — полное совпадение смысла, до 0.0 — отсутствие семантической связи).\n- [ ] Скорость загрузки страницы.\n*Объяснение*: Чем ближе угол векторов к нулю (косинус к 1.0), тем ближе смысловое значение текстов.\n\n---\n\n### Вопрос 3\nКак RAG помогает масштабировать Text-to-SQL в компании с сотнями таблиц в базе данных?\n- [ ] Сжимает таблицы в zip-архив.\n- [x] Динамически находит по смыслу запроса только 2-4 релевантные таблицы и передает в контекст промпта только их схемы, не перегружая лимит контекста.\n- [ ] Удаляет старые таблицы из базы.\n*Объяснение*: Семантический поиск по метаданным оставляет в промпте только нужные фрагменты схемы.\n\n---\n\n### Вопрос 4\nЧто такое косинусное сходство (Cosine Similarity) между векторами эмбеддингов?\n- [ ] Разность длин двух векторов.\n- [x] Косинус угла между ними: отношение скалярного произведения к произведению норм, измеряющее смысловую близость независимо от длины текста.\n- [ ] Количество общих слов в текстах.\n*Объяснение*: Нормализация по длине делает косинус идеальной метрикой для текстов разного объема.\n\n---\n\n### Вопрос 5\nЧто такое Chunking (нарезка текста на фрагменты) в RAG-системах и почему размер чанка критичен?\n- [ ] Удаление знаков препинания.\n- [x] Разбиение длинных документов на логические блоки; слишком мелкий чанк теряет контекст, а слишком крупный размывает семантический вектор в эмбеддинге.\n- [ ] Сжатие файлов архиватором.\n*Объяснение*: Оптимальный размер чанка (обычно 250-500 токенов с перекрытием) обеспечивает баланс точности и полноты поиска.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 1. Эмбеддинги и векторные пространства: косинусное сходство и семантический поиск\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭмбеддинг — это вектор чисел в многомерном пространстве ($\\mathbb{R}^d$), отражающий смысловое значение текста.\nБлизость двух понятий в пространстве измеряется через **косинусное сходство (Cosine Similarity)**:\n$$\\cos(\\mathbf{u}, \\mathbf{v}) = \frac{\\mathbf{u} \\cdot \\mathbf{v}}{\\|\\mathbf{u}\\| \\|\\mathbf{v}\\|}$$"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\n\ndef cosine_similarity(v1, v2):\n    dot_product = np.dot(v1, v2)\n    norm_v1 = np.linalg.norm(v1)\n    norm_v2 = np.linalg.norm(v2)\n    return dot_product / (norm_v1 * norm_v2)\n\n# Моделирование семантических векторов понятий\nv_revenue = np.array([0.85, 0.90, 0.10])\nv_mrr     = np.array([0.82, 0.88, 0.12])   # Очень близко к revenue\nv_weather = np.array([0.05, 0.10, 0.95])   # Далекая тема\n\nsim_mrr_rev = cosine_similarity(v_revenue, v_mrr)\nsim_weather_rev = cosine_similarity(v_revenue, v_weather)\n\nprint(f\"Сходство 'Revenue' и 'MRR':     {sim_mrr_rev:.4f}\")\nprint(f\"Сходство 'Revenue' и 'Weather': {sim_weather_rev:.4f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка семантической близости\nУбедитесь, что схожесть финансовых терминов превышает 0.98, а с погодой ниже 0.50."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert sim_mrr_rev > 0.98, \"Финансовые термины должны иметь высокое семантическое сходство\"\nassert sim_weather_rev < 0.50, \"Несвязанные темы должны иметь низкое сходство\"\nprint(\"✅ Тест успешно пройден: векторная метрика расстояния работает корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Почему косинусное расстояние лучше евклидова?\nКосинусное сходство нормализует длину векторов, нивелируя влияние разницы в длине сравниваемых документов."}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 2. Векторные базы данных: индексация, метаданные и фильтрация в ChromaDB\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВекторная база данных хранит эмбеддинги вместе с исходным текстом и метаданными, позволяя выполнять быстрый поиск ближайших соседей (HNSW / ANN).\nКритически важный паттерн: **гибридная фильтрация** (поиск по вектору + жесткий фильтр по метаданным `category = 'finance'`)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\n\ndef cosine_similarity(v1, v2):\n    return float(np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2)))\n\n# Симуляция векторного хранилища с метаданными\nclass SimpleVectorDB:\n    def __init__(self):\n        self.documents = []\n        \n    def add(self, doc_id, text, vector, metadata):\n        self.documents.append({\n            'id': doc_id,\n            'text': text,\n            'vector': np.array(vector),\n            'metadata': metadata\n        })\n        \n    def query(self, query_vec, filter_meta=None, top_k=2):\n        results = []\n        for doc in self.documents:\n            if filter_meta:\n                match = all(doc['metadata'].get(k) == v for k, v in filter_meta.items())\n                if not match:\n                    continue\n            sim = cosine_similarity(query_vec, doc['vector'])\n            results.append((sim, doc))\n        results.sort(key=lambda x: x[0], reverse=True)\n        return results[:top_k]\n\ndb = SimpleVectorDB()\ndb.add(\"1\", \"Как считать LTV для подписочных сервисов\", [0.8, 0.9, 0.1], {\"domain\": \"finance\"})\ndb.add(\"2\", \"Инструкция по настройке SSO авторизации\", [0.1, 0.2, 0.9], {\"domain\": \"it_sec\"})\ndb.add(\"3\", \"Когортный анализ удержания клиентов (Retention)\", [0.75, 0.85, 0.15], {\"domain\": \"finance\"})\n\nq_res = db.query(np.array([0.8, 0.88, 0.1]), filter_meta={\"domain\": \"finance\"}, top_k=1)\nprint(\"Найденный документ:\")\nprint(q_res[0][1]['text'], f\"(Score: {q_res[0][0]:.3f})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка работы фильтра метаданных\nУбедитесь, что найденный документ принадлежит домену `'finance'`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntop_doc = q_res[0][1]\nassert top_doc['metadata']['domain'] == 'finance'\nprint(\"✅ Тест успешно пройден: гибридный поиск отработал безупречно!\")\n"}, {"type": "markdown", "content": "### 💼 Паттерн для аналитика\nПри индексации документации по метрикам обязательно добавляйте в метаданные: `department`, `author`, `last_updated_year`."}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 3. Построение RAG-пайплайна (Retrieval-Augmented Generation) для базы знаний\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\n\n## 📌 Бизнес-контекст и методология\nRAG объединяет поиск по корпоративной базе знаний и генерацию ответа моделью:\n1. Retrieval: поиск релевантных фрагментов документации.\n2. Augmentation: добавление найденных фрагментов в контекст промпта.\n3. Generation: генерация ответа со ссылками на источники."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Сборка RAG-промпта с цитированием контекста\nretrieved_context = [\n    \"Документ #41: Формула расчета CAC = (Маркетинговые расходы + Зарплата сейлзов) / Новые клиенты.\",\n    \"Документ #42: Бенчмарк окупаемости CAC для B2B SaaS составляет менее 12 месяцев.\"\n]\n\nuser_query = \"Как рассчитать CAC и каков здоровый срок окупаемости?\"\n\nrag_prompt = f\"\"\"\nИспользуй ТОЛЬКО следующий контекст для ответа на вопрос:\n{' '.join(retrieved_context)}\n\nВопрос: {user_query}\nОтветь кратко и укажи номера использованных документов.\n\"\"\"\n\nprint(\"Сформированный RAG-промпт:\")\nprint(rag_prompt.strip())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия контекста\nУбедитесь, что оба документа переданы в RAG-промпт."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"Документ #41\" in rag_prompt\nassert \"Документ #42\" in rag_prompt\nprint(\"✅ Тест успешно пройден: контекстная инъекция выполнена корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Борьба с галлюцинациями в RAG\nВсегда добавляйте инструкцию: \"Если в предоставленном контексте нет ответа, прямо ответь: 'Информация отсутствует в базе знаний'.\"."}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 4. Text-to-SQL RAG-ассистент: индексация схемы DDL и метаданных витрин\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЕсли в корпоративном хранилище 500 таблиц, передать всю схему в промпт невозможно (превышение контекста и деградация внимания).\nРешение: RAG над схемой данных. Мы индексируем описания таблиц и колонок, извлекаем только топ-3 релевантные таблицы и передаем их DDL в LLM."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "table_catalog = {\n    \"dim_customers\": \"Справочник клиентов, города, каналы привлечения и дата регистрации\",\n    \"fct_orders\": \"Транзакции заказов, статус оплаты, дата совершения покупки\",\n    \"fct_server_logs\": \"Технические логи latency микросервисов и ошибок 500\"\n}\n\nuser_biz_question = \"Сколько новых клиентов зарегистрировалось из Москвы?\"\n\n# Простой эвристический семантический матчер для выбора схемы\nselected_tables = []\nfor tbl, desc in table_catalog.items():\n    if \"клиент\" in desc.lower() or \"регистраци\" in desc.lower():\n        selected_tables.append(tbl)\n\nprint(f\"Бизнес-вопрос: {user_biz_question}\")\nprint(f\"Автоматически отобранные релевантные таблицы схемы: {selected_tables}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация отбора таблиц\nУбедитесь, что таблица `dim_customers` выбрана, а `fct_server_logs` исключена."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"dim_customers\" in selected_tables\nassert \"fct_server_logs\" not in selected_tables\nprint(\"✅ Тест успешно пройден: редукция схемы выполнена успешно!\")\n"}, {"type": "markdown", "content": "### 💼 Архитектура Enterprise Text-to-SQL\n1. Vector Search по метаданным таблиц -> 2. Сборка DDL топ-5 таблиц -> 3. Генерация SQL -> 4. Dry-run валидация через EXPLAIN."}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12. AI агенты и автоматический анализ", "cat": "AI стек", "badge": "Агенты", "icon": "🕹️", "desc": "Паттерн ReAct, LangChain, автономные аналитические агенты, вызывающие SQL и код.", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты & LLM Evaluation)\n\n---\n\n### Вопрос 1\nЧто лежит в основе паттерна ReAct для автономных агентов?\n- [ ] Однократный ответ без проверки.\n- [x] Цикл: рассуждение (Thought) -> выбор инструмента и действие (Action) -> наблюдение за результатом (Observation) -> корректировка дальнейших шагов.\n- [ ] Перезагрузка базы данных.\n*Объяснение*: ReAct позволяет агенту динамически адаптировать свой план при получении промежуточных данных.\n\n---\n\n### Вопрос 2\nЧто означает метрика Faithfulness во фреймворках тестирования LLM (Ragas / DeepEval)?\n- [ ] Скорость генерации ответа в токенах за секунду.\n- [x] Доля утверждений в сгенерированном ответе, которые строго подтверждаются контекстом переданных данных (отсутствие галлюцинаций).\n- [ ] Количество положительных отзывов пользователей.\n*Объяснение*: Faithfulness гарантирует, что ИИ не додумал цифры от себя.\n\n---\n\n### Вопрос 3\nКакую роль выполняет LLM-as-a-Judge в индустрии 2027 года?\n- [ ] Вынесение юридических приговоров.\n- [x] Использование сильной LLM для автоматической оценки качества, корректности и точности работы других прикладных моделей и пайплайнов на тестовых датасетах.\n- [ ] Блокировка спама.\n*Объяснение*: LLM-as-a-Judge масштабирует проверку качества аналитики без необходимости вручную вычитывать тысячи ответов.\n\n---\n\n### Вопрос 4\nЧто представляет собой цикл ReAct (Reason + Act) в агентных системах?\n- [ ] Быстрое обновление страницы в браузере.\n- [x] Чередование шагов размышления модели (Thought), вызова инструмента (Action) и анализа ответа инструмента (Observation) до достижения цели.\n- [ ] Автоматическое удаление неверных файлов.\n*Объяснение*: ReAct позволяет агенту динамически планировать следующие шаги на основе фактических данных.\n\n---\n\n### Вопрос 5\nЗачем в коде AI-агентов обязательно настраивать параметр max_iterations?\n- [ ] Чтобы ограничить расход электричества.\n- [x] Чтобы предотвратить бесконечный цикл и исчерпание баланса API при возникновении непредвиденной ошибки в одном из инструментов.\n- [ ] Это требование языка Python.\n*Объяснение*: Ограничитель итераций — базовый предохранитель стабильности продакшен-систем.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 1. Концепция агентных рабочих процессов (ReAct Pattern: Reason + Act)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\n\n## 📌 Бизнес-контекст и методология\nAI-агент отличается от обычного чат-бота наличием цикла действий и инструментов (Tool Calling).\nПаттерн **ReAct**:\n1. **Thought (Размышление)**: агент оценивает текущее состояние.\n2. **Action (Действие)**: вызов внешнего инструмента (SQL-запрос, расчет в Python, HTTP API).\n3. **Observation (Наблюдение)**: получение результата работы инструмента.\n4. Повторение цикла до достижения финального ответа."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Симуляция цикла ReAct агента\ndef execute_agent_step(goal, current_step, tool_output=None):\n    if current_step == 0:\n        return {\"thought\": \"Нужно получить список заказов за прошлую неделю\", \"action\": \"run_sql('SELECT count(*) FROM orders')\"}\n    elif current_step == 1:\n        return {\"thought\": f\"Получено наблюдение: {tool_output}. Теперь формирую ответ.\", \"action\": \"FINISH\", \"final_answer\": f\"Всего заказов: {tool_output}\"}\n\nstep0 = execute_agent_step(\"Посчитай заказы\", 0)\nstep1 = execute_agent_step(\"Посчитай заказы\", 1, tool_output=\"14,250\")\n\nprint(f\"Шаг 1: {step0['thought']} -> {step0['action']}\")\nprint(f\"Шаг 2: {step1['thought']} -> {step1['final_answer']}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка завершения цикла\nУбедитесь, что на шаге 1 агент вызвал действие `'FINISH'`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert step1[\"action\"] == \"FINISH\"\nassert \"14,250\" in step1[\"final_answer\"]\nprint(\"✅ Тест успешно пройден: цикл ReAct отработал штатно!\")\n"}, {"type": "markdown", "content": "### 💡 Защита от бесконечного цикла\nВсегда устанавливайте параметр `max_iterations` (обычно 5-10 шагов), чтобы агент не зациклился при ошибке инструмента."}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 2. Инструменты и тулы аналитика в LangChain / LlamaIndex\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nИнструмент (Tool) — это Python-функция с описанием входных аргументов, которую модель может вызвать по своему усмотрению."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Описание интерфейса тула аналитика\ndef calculate_metric_delta(val_current: float, val_previous: float) -> dict:\n    \"\"\"Вычисляет абсолютное и относительное изменение метрики.\"\"\"\n    diff_abs = val_current - val_previous\n    diff_rel = (diff_abs / val_previous) if val_previous != 0 else 0.0\n    return {\"absolute_change\": diff_abs, \"relative_change_pct\": round(diff_rel * 100, 2)}\n\ntool_spec = {\n    \"name\": \"calculate_metric_delta\",\n    \"description\": \"Полезно для расчета дельты между текущим и прошлым периодом\",\n    \"parameters\": {\n        \"val_current\": \"float\",\n        \"val_previous\": \"float\"\n    }\n}\n\nres = calculate_metric_delta(120.0, 100.0)\nprint(f\"Результат выполнения тула: {res}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка расчета дельты\nУбедитесь, что относительный прирост составляет 20.0%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert res[\"relative_change_pct\"] == 20.0\nassert res[\"absolute_change\"] == 20.0\nprint(\"✅ Тест успешно пройден: тул аналитика протестирован!\")\n"}, {"type": "markdown", "content": "### 💼 Качество docstring в тулах\nМодель решает, вызывать ли инструмент, основываясь исключительно на его docstring. Пишите описания максимально конкретно."}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 3. Автономный агент мониторинга аномалий и сбора данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАвтономный агент запускается по расписанию (cron), опрашивает базу данных, сравнивает метрики с доверительными интервалами и отправляет алерт в Slack/Telegram при выходе за пределы нормы."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\n\n# Логика детекции аномалий в автономном агенте\ndef anomaly_detector_agent(current_value, history_values):\n    mean_hist = np.mean(history_values)\n    std_hist = np.std(history_values)\n    z_score = (current_value - mean_hist) / std_hist if std_hist > 0 else 0\n    \n    is_anomaly = abs(z_score) > 2.5\n    severity = \"CRITICAL\" if abs(z_score) > 3.5 else (\"WARNING\" if is_anomaly else \"NORMAL\")\n    return {\"is_anomaly\": is_anomaly, \"z_score\": round(z_score, 2), \"severity\": severity}\n\nhistory = [100, 102, 98, 105, 99, 101, 103]\nalert = anomaly_detector_agent(145, history) # Внезапный скачок\nprint(f\"Результат работы агента мониторинга: {alert}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Детекция критической аномалии\nУбедитесь, что для значения 145 агент выставил флаг `is_anomaly = True`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert alert[\"is_anomaly\"] == True\nassert alert[\"severity\"] in [\"WARNING\", \"CRITICAL\"]\nprint(\"✅ Тест успешно пройден: аномалия успешно зафиксирована агентом!\")\n"}, {"type": "markdown", "content": "### 💡 Борьба с Alert Fatigue\nНе отправляйте алерты по каждому шуму. Группируйте уведомления и настраивайте скользящие окна сглаживания."}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 4. Оценка и мониторинг агентных систем в продакшене (Observability & Tracing)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ агентных системах критически важна трассировка (Tracing): сколько шагов сделал агент, какие инструменты вызвал, какова латентность каждого шага и суммарная стоимость сессии."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Моделирование объекта трассировки (Trace Log)\ntrace_log = {\n    \"trace_id\": \"tr-9812-agent\",\n    \"total_steps\": 3,\n    \"tools_called\": [\"sql_runner\", \"python_evaluator\"],\n    \"total_latency_sec\": 2.45,\n    \"total_cost_usd\": 0.0034,\n    \"status\": \"SUCCESS\"\n}\n\ndef validate_agent_execution(trace):\n    if trace[\"total_steps\"] > 5:\n        return False, \"Слишком много итераций\"\n    if trace[\"total_latency_sec\"] > 10.0:\n        return False, \"Превышен SLA по времени\"\n    return True, \"SLA соблюден\"\n\nok, msg = validate_agent_execution(trace_log)\nprint(f\"Статус проверки трассировки: {ok} ({msg})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка SLA\nУбедитесь, что тестовый лог удовлетворяет критериям SLA."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert ok == True\nprint(\"✅ Тест успешно пройден: мониторинг агентных систем настроен!\")\n"}, {"type": "markdown", "content": "### 💼 OpenTelemetry в аналитике\nСовременные платформы (LangSmith, Phoenix, OpenLLMetry) сохраняют полные деревья трассировок вызовов в OpenTelemetry формате."}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13. Soft Skills и Data Storytelling", "cat": "Soft Skills", "badge": "Коммуникация", "icon": "🎤", "desc": "Пирамида Минто, юнит-экономика (LTV, CAC, Retention) и презентация выводов стейкхолдерам.", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n---\n\n### Вопрос 1\nКакое отношение LTV / CAC считается эталонным стандартом для устойчивого масштабирования бизнеса?\n- [ ] Ровно 1.0x (работа в ноль).\n- [x] От 3.0x и выше при сроке окупаемости (Payback) до 12 месяцев.\n- [ ] Менее 0.5x.\n*Объяснение*: Соотношение $\\ge 3$ компенсирует операционные расходы, налоги и оставляет чистую прибыль на развитие.\n\n---\n\n### Вопрос 2\nВ чем заключается принцип Пирамиды Минто при защите отчета перед топ-менеджментом?\n- [ ] Начинать презентацию с подробного описания процесса парсинга и очистки данных.\n- [x] Начинать сразу с ключевого вывода и рекомендуемого решения (Answer First), а затем подкреплять его аргументами и цифрами.\n- [ ] Не показывать цифры вообще.\n*Объяснение*: Руководители принимают решения; им в первую очередь нужен ответ на вопрос: «Что делать и какой экономический эффект?».\n\n---\n\n### Вопрос 3\nЧто такое Problem Framing в работе аналитика?\n- [ ] Оформление дашборда в корпоративные рамки.\n- [x] Процесс перевода абстрактной жалобы или идеи бизнеса в строго проверяемую систему метрик, гипотез и аналитических задач.\n- [ ] Установка Python библиотек.\n*Объяснение*: Problem Framing гарантирует, что аналитик решает настоящую корневую проблему, а не симптомы.\n\n---\n\n### Вопрос 4\nВ чем суть принципа Answer First в пирамиде Минто?\n- [ ] Отвечать на письма клиентов быстрее чем за 1 минуту.\n- [x] Начинать презентацию сразу с главного управленческого вывода или рекомендации, а затем подкреплять его логическими аргументами и деталями.\n- [ ] Никогда не показывать графики руководству.\n*Объяснение*: Руководители высшего звена мыслят решениями; подход Answer First экономит их время и фокусирует дискуссию.\n\n---\n\n### Вопрос 5\nЧто показывает метрика Payback Period (Срок окупаемости CAC) в юнит-экономике?\n- [ ] Время работы службы поддержки.\n- [x] Количество месяцев, за которое валовая прибыль от привлеченного клиента полностью покрывает затраты на его привлечение (CAC).\n- [ ] Срок действия банковской карты клиента.\n*Объяснение*: Здоровый Payback Period в B2B SaaS составляет менее 12 месяцев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 1. Юнит-экономика и бизнес-метрики: CAC, LTV, Payback, Churn и Burn Rate\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЮнит-экономика показывает прибыльность одной единицы бизнеса (одного клиента или одного заказа).\nКлючевые формулы:\n* $\\mathrm{Contribution\\ Margin} = \\mathrm{Revenue} - \\mathrm{COGS} - \\mathrm{Variable\\ Costs}$\n* $\\mathrm{LTV} = \frac{\\mathrm{ARPU} \times \\mathrm{Gross\\ Margin}}{\\mathrm{Churn\\ Rate}}$\n* $\\mathrm{Payback\\ Period} = \frac{\\mathrm{CAC}}{\\mathrm{ARPU} \times \\mathrm{Gross\\ Margin}}$"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "arpu = 60.0             # $60 в месяц\ngross_margin = 0.75     # 75%\nmonthly_churn = 0.05    # 5% отток в месяц\ncac = 300.0             # Стоимость привлечения $300\n\nltv = (arpu * gross_margin) / monthly_churn\npayback_months = cac / (arpu * gross_margin)\nltv_cac_ratio = ltv / cac\n\nprint(\"=\" * 40)\nprint(\"📊 ФИНАНСОВАЯ МОДЕЛЬ ЮНИТ-ЭКОНОМИКИ:\")\nprint(f\"💰 LTV:             ${ltv:.2f}\")\nprint(f\"🎯 CAC:             ${cac:.2f}\")\nprint(f\"📈 LTV / CAC:       {ltv_cac_ratio:.2f}x (Здоровый бенчмарк > 3.0x)\")\nprint(f\"⏳ Срок окупаемости: {payback_months:.1f} мес. (Бенчмарк < 12 мес.)\")\nprint(\"=\" * 40)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка бизнес-здоровья\nУбедитесь, что юнит-экономика сходится (LTV/CAC >= 3.0 и окупаемость <= 12 месяцев)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert ltv_cac_ratio >= 3.0, \"LTV/CAC должен быть не менее 3x\"\nassert payback_months <= 12.0, \"Срок окупаемости не должен превышать 12 месяцев\"\nprint(\"✅ Тест успешно пройден: модель юнит-экономики устойчива!\")\n"}, {"type": "markdown", "content": "### 💡 Почему LTV/CAC > 5x не всегда хорошо?\nСлишком высокое отношение говорит о том, что компания недоинвестирует в маркетинг и медленно захватывает рынок."}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 2. Problem Framing: перевод размытых бизнес-вопросов в строгие дата-задачи\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЗаказчик почти никогда не приходит с четким ТЗ. Обычно он говорит: \"Кажется, наши продажи падают, разберись\".\nФреймворк **Issue Tree (Дерево проблем)** декомпозирует вопрос:\n1. Выручка = Трафик $\times$ Конверсия (CR) $\times$ Средний чек (AOV).\n2. Падение в каком именно сегменте? (Новые vs Повторные клиенты).\n3. Проблема техническая (отказ платежей) или маркетинговая (нецелевой трафик)?"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример декомпозиции выручки по мультипликативной модели\ndef decompose_revenue(visitors, cr, aov):\n    orders = visitors * cr\n    revenue = orders * aov\n    return {\"visitors\": visitors, \"orders\": int(orders), \"revenue\": revenue}\n\nbaseline = decompose_revenue(100_000, 0.03, 3000)\nbad_month = decompose_revenue(100_000, 0.024, 3000) # CR просел с 3.0% до 2.4%\n\nloss = baseline[\"revenue\"] - bad_month[\"revenue\"]\nprint(f\"Базовая выручка:  {baseline['revenue']:,.0f} руб.\")\nprint(f\"Выручка в кризис: {bad_month['revenue']:,.0f} руб.\")\nprint(f\"Потери из-за просадки CR: {loss:,.0f} руб.\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка относительных потерь\nВычислите относительную долю потерянной выручки."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nloss_pct = loss / baseline[\"revenue\"]\nprint(f\"Потеряно: {loss_pct:.1%} выручки\")\n\nassert round(loss_pct, 2) == 0.20, \"Просадка CR на 20% дает 20% потерю выручки при неизменных прочих\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Правило первой встречи\nНикогда не начинайте писать SQL до тех пор, пока с заказчиком письменно не зафиксирован ожидаемый результат анализа."}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 3. Пирамида Минто (Minto Pyramid Principle) и C-Level презентации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПринцип пирамиды Минто (McKinsey): **Answer First**.\nСначала озвучьте главное управленческое решение / рекомендацию, затем приведите 3 ключевых аргумента, и только в конце — детализирующие расчеты."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Шаблон executive-сообщения по принципу Минто\nminto_structure = {\n    \"headline\": \"Рекомендуем заморозить закупки в категории X и перенаправить 15 млн руб. в категорию Y.\",\n    \"key_arguments\": [\n        \"Категория X показывает отрицательную маржинальность (-4%) из-за роста возвратов.\",\n        \"Категория Y растет на 45% YoY с маржинальностью 28%.\",\n        \"Срок окупаемости реаллокации бюджета составит 2.5 месяца.\"\n    ],\n    \"action_plan\": [\n        \"1. Согласовать лимиты с финдиректором до пятницы.\",\n        \"2. Скорректировать автозаказ в ERP системе.\"\n    ]\n}\n\nprint(f\"📌 ГЛАВНЫЙ ВЫВОД (ANSWER FIRST):\\n{minto_structure['headline']}\\n\")\nprint(\"🔍 АРГУМЕНТАЦИЯ:\")\nfor arg in minto_structure['key_arguments']:\n    print(f\"  • {arg}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка полноты аргументации\nУбедитесь, что приведено не менее 3 ключевых аргументов в структуре."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert len(minto_structure[\"key_arguments\"]) >= 3\nassert \"headline\" in minto_structure\nprint(\"✅ Тест успешно пройден: структура Минто безупречна!\")\n"}, {"type": "markdown", "content": "### 💡 Формат One-Pager\nТоп-менеджмент ценит лаконичность: весь отчет должен умещаться на один лист A4 или один экран слайда."}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 4. Сквозной кейс: Data Storytelling от поиска инсайта до защиты бюджета\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ финальном уроке по коммуникациям мы собираем весь нарратив:\n1. Завязка (Контекст и цель бизнеса).\n2. Конфликт (Неожиданное препятствие или просадка метрик).\n3. Кульминация (Дата-инсайт: обнаружение первопричины).\n4. Развязка (Бизнес-решение и прогноз финансового эффекта)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\np
