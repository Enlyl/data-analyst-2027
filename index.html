объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python)\n\n### Вопрос 1\nКакой подход к коду на Python является правильным для аналитика 2027 года?\n- [ ] Заучивать синтаксис методов наизусть\n- [x] Понимать логику структур данных, формулировать задачи для AI-ассистентов и валидировать сгенерированный код\n- [ ] Отказаться от Python в пользу калькулятора\n\n### Вопрос 2\nВ чем разница между `.loc[]` и `.iloc[]` в Pandas?\n- [ ] Разницы нет\n- [x] `.loc` выбирает данные по текстовым меткам (колонкам/индексам), а `.iloc` — строго по целочисленным позициям (номерам строк/колонок)\n- [ ] `.iloc` работает только с датами\n\n### Вопрос 3\nКакая главная опасность при слепом доверии коду от ChatGPT/Copilot?\n- [ ] Компьютер перегреется\n- [x] Логические ошибки в агрегациях (например, задвоение сумм или расчет среднего вместо взвешенного среднего), которые синтаксически работают без ошибок, но дают неверные бизнес-цифры\n- [ ] Код сотрет жесткий диск\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 3. Урок 1: Как аналитик пишет код в 2027 году\\n\",\n        \"\\n\",\n        \"Забудьте учебники по синтаксису Python на 500 страниц. Аналитик оперирует концепциями:\\n\",\n        \"1. **Input**: Какие данные на входе? (типы колонок, структура).\\n\",\n        \"2. **Transformation**: Что математически/логически происходит со строками?\\n\",\n        \"3. **Output**: Какой формат нужен на выходе?\\n\",\n        \"\\n\",\n        \"## Демонстрация: Промпт-комментарий для Copilot\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# ТЗ ДЛЯ AI: Создай синтетический датасет заказов с колонками user_id, order_date, amount\\n\",\n        \"# и отфильтруй заказы с суммой выше медианной за последний квартал\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Сгенерировано по ТЗ:\\n\",\n        \"np.random.seed(42)\\n\",\n        \"df = pd.DataFrame({\\n\",\n        \"    'user_id': np.random.randint(100, 200, 20),\\n\",\n        \"    'order_date': pd.date_range(start='2026-07-01', periods=20, freq='4D'),\\n\",\n        \"    'amount': np.random.uniform(500, 15000, 20).round(2)\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"median_val = df['amount'].median()\\n\",\n        \"filtered_df = df[df['amount'] > median_val].sort_values(by='amount', ascending=False)\\n\",\n        \"print(f\\\"Медианный чек: {median_val:.2f} руб\\\")\\n\",\n        \"print(filtered_df.head(5))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 3. Урок 1: Как аналитик пишет код в 2027 году\n\nЗабудьте учебники по синтаксису Python на 500 страниц. Аналитик оперирует концепциями:\n1. **Input**: Какие данные на входе? (типы колонок, структура).\n2. **Transformation**: Что математически/логически происходит со строками?\n3. **Output**: Какой формат нужен на выходе?\n\n## Демонстрация: Промпт-комментарий для Copilot\n"}, {"type": "code", "content": "# ТЗ ДЛЯ AI: Создай синтетический датасет заказов с колонками user_id, order_date, amount\n# и отфильтруй заказы с суммой выше медианной за последний квартал\nimport pandas as pd\nimport numpy as np\n\n# Сгенерировано по ТЗ:\nnp.random.seed(42)\ndf = pd.DataFrame({\n    'user_id': np.random.randint(100, 200, 20),\n    'order_date': pd.date_range(start='2026-07-01', periods=20, freq='4D'),\n    'amount': np.random.uniform(500, 15000, 20).round(2)\n})\n\nmedian_val = df['amount'].median()\nfiltered_df = df[df['amount'] > median_val].sort_values(by='amount', ascending=False)\nprint(f\"Медианный чек: {median_val:.2f} руб\")\nprint(filtered_df.head(5))\n"}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 3. Урок 2: DataFrame: Загрузка, срезы и фильтрация\\n\",\n        \"\\n\",\n        \"Работаем с реальным датасетом клиентов интернет-магазина.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Загружаем реальный датасет курса\\n\",\n        \"df_customers = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customers.csv\\\")\\n\",\n        \"\\n\",\n        \"print(\\\"1. Форма датасета (строк, колонок):\\\", df_customers.shape)\\n\",\n        \"print(\\\"\\\\n2. Типы данных:\\\")\\n\",\n        \"print(df_customers.dtypes)\\n\",\n        \"\\n\",\n        \"# Фильтрация: клиенты из Москвы или Казани с мобильных устройств\\n\",\n        \"target_users = df_customers[\\n\",\n        \"    (df_customers['city'].isin(['Moscow', 'Kazan'])) & \\n\",\n        \"    (df_customers['device'].str.contains('Mobile'))\\n\",\n        \"]\\n\",\n        \"print(f\\\"\\\\n3. Найдено целевых пользователей: {len(target_users)}\\\")\\n\",\n        \"print(target_users.head(3))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 3. Урок 2: DataFrame: Загрузка, срезы и фильтрация\n\nРаботаем с реальным датасетом клиентов интернет-магазина.\n"}, {"type": "code", "content": "import pandas as pd\n\n# Загружаем реальный датасет курса\ndf_customers = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\nprint(\"1. Форма датасета (строк, колонок):\", df_customers.shape)\nprint(\"\\n2. Типы данных:\")\nprint(df_customers.dtypes)\n\n# Фильтрация: клиенты из Москвы или Казани с мобильных устройств\ntarget_users = df_customers[\n    (df_customers['city'].isin(['Moscow', 'Kazan'])) & \n    (df_customers['device'].str.contains('Mobile'))\n]\nprint(f\"\\n3. Найдено целевых пользователей: {len(target_users)}\")\nprint(target_users.head(3))\n"}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 3. Урок 3: Агрегации и соединения данных (Merge)\\n\",\n        \"\\n\",\n        \"Аналог `SQL JOIN` и `GROUP BY` в Pandas:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"products = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\products.csv\\\")\\n\",\n        \"\\n\",\n        \"# Соединяем чеки с позициями и товарами\\n\",\n        \"merged = items.merge(orders, on='order_id').merge(products, on='product_id')\\n\",\n        \"\\n\",\n        \"# Анализ маржинальности по категориям\\n\",\n        \"cat_summary = merged[merged['status'] == 'Completed'].groupby('category').agg(\\n\",\n        \"    total_revenue=('total_amount', 'sum'),\\n\",\n        \"    units_sold=('quantity', 'sum'),\\n\",\n        \"    avg_price=('unit_price', 'mean'),\\n\",\n        \"    margin_est=('total_amount', lambda x: (x * 0.35).sum()) # Оценочная маржа 35%\\n\",\n        \").reset_index()\\n\",\n        \"\\n\",\n        \"cat_summary['revenue_share_%'] = (cat_summary['total_revenue'] / cat_summary['total_revenue'].sum() * 100).round(1)\\n\",\n        \"print(cat_summary.sort_values(by='total_revenue', ascending=False))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 3. Урок 3: Агрегации и соединения данных (Merge)\n\nАналог `SQL JOIN` и `GROUP BY` в Pandas:\n"}, {"type": "code", "content": "import pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\n\n# Соединяем чеки с позициями и товарами\nmerged = items.merge(orders, on='order_id').merge(products, on='product_id')\n\n# Анализ маржинальности по категориям\ncat_summary = merged[merged['status'] == 'Completed'].groupby('category').agg(\n    total_revenue=('total_amount', 'sum'),\n    units_sold=('quantity', 'sum'),\n    avg_price=('unit_price', 'mean'),\n    margin_est=('total_amount', lambda x: (x * 0.35).sum()) # Оценочная маржа 35%\n).reset_index()\n\ncat_summary['revenue_share_%'] = (cat_summary['total_revenue'] / cat_summary['total_revenue'].sum() * 100).round(1)\nprint(cat_summary.sort_values(by='total_revenue', ascending=False))\n"}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 3. Урок 4: Продвинутая визуализация с Seaborn\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import seaborn as sns\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"# Загружаем SaaS-датасет\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"plt.figure(figsize=(10, 5))\\n\",\n        \"sns.boxplot(data=saas, x='plan', y='nps_score', hue='is_churned', palette='Set2')\\n\",\n        \"plt.title('Распределение NPS по тарифам и статусу оттока (Churn)', fontsize=13)\\n\",\n        \"plt.xlabel('Тарифный план')\\n\",\n        \"plt.ylabel('NPS (Оценка удовлетворенности)')\\n\",\n        \"plt.grid(axis='y', alpha=0.3)\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 3. Урок 4: Продвинутая визуализация с Seaborn\n"}, {"type": "code", "content": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\n# Загружаем SaaS-датасет\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\nplt.figure(figsize=(10, 5))\nsns.boxplot(data=saas, x='plan', y='nps_score', hue='is_churned', palette='Set2')\nplt.title('Распределение NPS по тарифам и статусу оттока (Churn)', fontsize=13)\nplt.xlabel('Тарифный план')\nplt.ylabel('NPS (Оценка удовлетворенности)')\nplt.grid(axis='y', alpha=0.3)\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 3. Урок 5: Code Review кода от ИИ (Поиск типичных багов)\\n\",\n        \"\\n\",\n        \"### Кейс: Нейросеть написала код для расчета Retention Rate\\n\",\n        \"Посмотрите на код ниже. В чем критическая логическая ошибка?\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# КОД ОТ НЕЙРОСЕТИ С ОШИБКОЙ:\\n\",\n        \"# \\\"Посчитай процент вернувшихся клиентов\\\"\\n\",\n        \"# df.groupby('user_id')['order_date'].count() > 1 / len(df)  <-- ОШИБКА ЗДЕСЬ!\\n\",\n        \"\\n\",\n        \"# ПРАВИЛЬНЫЙ АНАЛИТИЧЕСКИЙ КОД С ВАЛИДАЦИЕЙ:\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"\\n\",\n        \"# 1. Считаем уникальных пользователей всего\\n\",\n        \"total_customers = orders['customer_id'].nunique()\\n\",\n        \"\\n\",\n        \"# 2. Считаем тех, у кого > 1 завершенного заказа\\n\",\n        \"repeat_buyers = orders[orders['status'] == 'Completed'].groupby('customer_id')['order_id'].nunique()\\n\",\n        \"repeat_buyers_count = (repeat_buyers > 1).sum()\\n\",\n        \"\\n\",\n        \"retention_rate = (repeat_buyers_count / total_customers) * 100\\n\",\n        \"print(f\\\"Всего пользователей: {total_customers}\\\")\\n\",\n        \"print(f\\\"Повторных покупателей: {repeat_buyers_count}\\\")\\n\",\n        \"print(f\\\"Repeat Purchase Rate: {retention_rate:.2f}%\\\")\\n\",\n        \"print(\\\"\\\\n Разбор ошибки AI: Нейросеть делила на общее число строк (заказов), а не на уникальных пользователей!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 3. Урок 5: Code Review кода от ИИ (Поиск типичных багов)\n\n### Кейс: Нейросеть написала код для расчета Retention Rate\nПосмотрите на код ниже. В чем критическая логическая ошибка?\n"}, {"type": "code", "content": "# КОД ОТ НЕЙРОСЕТИ С ОШИБКОЙ:\n# \"Посчитай процент вернувшихся клиентов\"\n# df.groupby('user_id')['order_date'].count() > 1 / len(df)  <-- ОШИБКА ЗДЕСЬ!\n\n# ПРАВИЛЬНЫЙ АНАЛИТИЧЕСКИЙ КОД С ВАЛИДАЦИЕЙ:\nimport pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\n\n# 1. Считаем уникальных пользователей всего\ntotal_customers = orders['customer_id'].nunique()\n\n# 2. Считаем тех, у кого > 1 завершенного заказа\nrepeat_buyers = orders[orders['status'] == 'Completed'].groupby('customer_id')['order_id'].nunique()\nrepeat_buyers_count = (repeat_buyers > 1).sum()\n\nretention_rate = (repeat_buyers_count / total_customers) * 100\nprint(f\"Всего пользователей: {total_customers}\")\nprint(f\"Повторных покупателей: {repeat_buyers_count}\")\nprint(f\"Repeat Purchase Rate: {retention_rate:.2f}%\")\nprint(\"\\n Разбор ошибки AI: Нейросеть делила на общее число строк (заказов), а не на уникальных пользователей!\")\n"}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4: Очистка данных & Data Quality", "category": "Хард-база", "badge": "Data Quality", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Data Cleaning)\n\n### Вопрос 1\nЧто делать с выбросами при подготовке данных для анализа среднего чека?\n- [ ] Всегда сразу удалять любые выбросы\n- [x] Исследовать причину: если это ошибка ввода — исправить/удалить; если реальные оптовые клиенты — сегментировать анализ (B2C отдельно, B2B отдельно)\n- [ ] Заменить все выбросы на нули\n\n### Вопрос 2\nКакой метод заполнения пропусков наиболее нейтрален для числовых метрик с сильной асимметрией?\n- [ ] Среднее арифметическое\n- [x] Медиана (она устойчива к экстремальным значениям)\n- [ ] Случайное число\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 4. Урок 1: Пропущенные значения и трансформация типов\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Имитация грязного фрагмента данных\\n\",\n        \"raw_data = pd.DataFrame({\\n\",\n        \"    'user_id': [1, 2, 3, 4, 5],\\n\",\n        \"    'amount': ['1500', ' 2 300,50 ', np.nan, 'NULL', '4200'],\\n\",\n        \"    'signup_date': ['2026-01-10', '15/01/2026', '2026-02-01', None, '2026-03-05']\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"print(\\\"Сырые грязные данные:\\\")\\n\",\n        \"print(raw_data)\\n\",\n        \"\\n\",\n        \"# Шаг 1: Очистка строк и конвертация в float\\n\",\n        \"def clean_currency(val):\\n\",\n        \"    if pd.isna(val) or val == 'NULL':\\n\",\n        \"        return np.nan\\n\",\n        \"    val_str = str(val).replace(' ', '').replace(',', '.')\\n\",\n        \"    return float(val_str)\\n\",\n        \"\\n\",\n        \"raw_data['amount_cleaned'] = raw_data['amount'].apply(clean_currency)\\n\",\n        \"# Заполняем пропуск медианой\\n\",\n        \"raw_data['amount_imputed'] = raw_data['amount_cleaned'].fillna(raw_data['amount_cleaned'].median())\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\nОчищенные данные:\\\")\\n\",\n        \"print(raw_data[['user_id', 'amount_cleaned', 'amount_imputed']])\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 4. Урок 1: Пропущенные значения и трансформация типов\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Имитация грязного фрагмента данных\nraw_data = pd.DataFrame({\n    'user_id': [1, 2, 3, 4, 5],\n    'amount': ['1500', ' 2 300,50 ', np.nan, 'NULL', '4200'],\n    'signup_date': ['2026-01-10', '15/01/2026', '2026-02-01', None, '2026-03-05']\n})\n\nprint(\"Сырые грязные данные:\")\nprint(raw_data)\n\n# Шаг 1: Очистка строк и конвертация в float\ndef clean_currency(val):\n    if pd.isna(val) or val == 'NULL':\n        return np.nan\n    val_str = str(val).replace(' ', '').replace(',', '.')\n    return float(val_str)\n\nraw_data['amount_cleaned'] = raw_data['amount'].apply(clean_currency)\n# Заполняем пропуск медианой\nraw_data['amount_imputed'] = raw_data['amount_cleaned'].fillna(raw_data['amount_cleaned'].median())\n\nprint(\"\\nОчищенные данные:\")\nprint(raw_data[['user_id', 'amount_cleaned', 'amount_imputed']])\n"}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 4. Урок 2: Дедупликация и стандартизация текста\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"contacts = pd.DataFrame({\\n\",\n        \"    'name': ['Иван Иванов', 'иван  иванов', 'ПЕТР СИДОРОВ', 'Петр Сидоров '],\\n\",\n        \"    'phone': ['+7 (999) 111-22-33', '89991112233', '+79992223344', '8 (999) 222-33-44']\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"# Очистка номера телефона регулярным выражением (оставляем только цифры, нормализуем +7)\\n\",\n        \"contacts['phone_clean'] = contacts['phone'].str.replace(r'\\\\D', '', regex=True)\\n\",\n        \"contacts['phone_clean'] = contacts['phone_clean'].apply(lambda x: '7' + x[1:] if x.startswith('8') else x)\\n\",\n        \"\\n\",\n        \"# Нормализация ФИО\\n\",\n        \"contacts['name_clean'] = contacts['name'].str.strip().str.title().str.replace(r'\\\\s+', ' ', regex=True)\\n\",\n        \"\\n\",\n        \"# Удаление полных дублей\\n\",\n        \"cleaned = contacts[['name_clean', 'phone_clean']].drop_duplicates()\\n\",\n        \"print(\\\"Нормализованная база контактов:\\\")\\n\",\n        \"print(cleaned)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 4. Урок 2: Дедупликация и стандартизация текста\n"}, {"type": "code", "content": "import pandas as pd\n\ncontacts = pd.DataFrame({\n    'name': ['Иван Иванов', 'иван  иванов', 'ПЕТР СИДОРОВ', 'Петр Сидоров '],\n    'phone': ['+7 (999) 111-22-33', '89991112233', '+79992223344', '8 (999) 222-33-44']\n})\n\n# Очистка номера телефона регулярным выражением (оставляем только цифры, нормализуем +7)\ncontacts['phone_clean'] = contacts['phone'].str.replace(r'\\D', '', regex=True)\ncontacts['phone_clean'] = contacts['phone_clean'].apply(lambda x: '7' + x[1:] if x.startswith('8') else x)\n\n# Нормализация ФИО\ncontacts['name_clean'] = contacts['name'].str.strip().str.title().str.replace(r'\\s+', ' ', regex=True)\n\n# Удаление полных дублей\ncleaned = contacts[['name_clean', 'phone_clean']].drop_duplicates()\nprint(\"Нормализованная база контактов:\")\nprint(cleaned)\n"}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 4. Урок 3: Выявление выбросов (IQR и Z-Score)\\n\",\n        \"\\n\",\n        \"Формула межквартильного размаха:\\n\",\n        \"$$IQR = Q_3 - Q_1$$\\n\",\n        \"$$\\\\text{Нижняя граница} = Q_1 - 1.5 \\\\times IQR$$\\n\",\n        \"$$\\\\text{Верхняя граница} = Q_3 + 1.5 \\\\times IQR$$\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Проверим чеки в заказах\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"\\n\",\n        \"q1 = orders['total_amount'].quantile(0.25)\\n\",\n        \"q3 = orders['total_amount'].quantile(0.75)\\n\",\n        \"iqr = q3 - q1\\n\",\n        \"\\n\",\n        \"lower_bound = q1 - 1.5 * iqr\\n\",\n        \"upper_bound = q3 + 1.5 * iqr\\n\",\n        \"\\n\",\n        \"outliers = orders[(orders['total_amount'] < lower_bound) | (orders['total_amount'] > upper_bound)]\\n\",\n        \"print(f\\\"Q1: {q1:.2f}, Q3: {q3:.2f}, IQR: {iqr:.2f}\\\")\\n\",\n        \"print(f\\\"Границы нормы: [{lower_bound:.2f}, {upper_bound:.2f}]\\\")\\n\",\n        \"print(f\\\"Количество выбросов: {len(outliers)} из {len(orders)} строк\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 4. Урок 3: Выявление выбросов (IQR и Z-Score)\n\nФормула межквартильного размаха:\n$$IQR = Q_3 - Q_1$$\n$$\\text{Нижняя граница} = Q_1 - 1.5 \\times IQR$$\n$$\\text{Верхняя граница} = Q_3 + 1.5 \\times IQR$$\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Проверим чеки в заказах\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\n\nq1 = orders['total_amount'].quantile(0.25)\nq3 = orders['total_amount'].quantile(0.75)\niqr = q3 - q1\n\nlower_bound = q1 - 1.5 * iqr\nupper_bound = q3 + 1.5 * iqr\n\noutliers = orders[(orders['total_amount'] < lower_bound) | (orders['total_amount'] > upper_bound)]\nprint(f\"Q1: {q1:.2f}, Q3: {q3:.2f}, IQR: {iqr:.2f}\")\nprint(f\"Границы нормы: [{lower_bound:.2f}, {upper_bound:.2f}]\")\nprint(f\"Количество выбросов: {len(outliers)} из {len(orders)} строк\")\n"}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 4. Урок 4: Автоматический пайплайн очистки (Pipeline Pattern)\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"def clean_pipeline(df: pd.DataFrame) -> pd.DataFrame:\\n\",\n        \"    df_clean = df.copy()\\n\",\n        \"    # 1. Удаление полных дубликатов\\n\",\n        \"    df_clean = df_clean.drop_duplicates()\\n\",\n        \"    # 2. Обработка дат\\n\",\n        \"    if 'order_date' in df_clean.columns:\\n\",\n        \"        df_clean['order_date'] = pd.to_datetime(df_clean['order_date'])\\n\",\n        \"    # 3. Фильтрация статусов\\n\",\n        \"    if 'status' in df_clean.columns:\\n\",\n        \"        df_clean = df_clean[df_clean['status'].isin(['Completed', 'Refunded'])]\\n\",\n        \"    return df_clean\\n\",\n        \"\\n\",\n        \"orders_raw = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"orders_processed = clean_pipeline(orders_raw)\\n\",\n        \"print(f\\\"До очистки: {len(orders_raw)} строк, После: {len(orders_processed)} строк\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 4. Урок 4: Автоматический пайплайн очистки (Pipeline Pattern)\n"}, {"type": "code", "content": "import pandas as pd\n\ndef clean_pipeline(df: pd.DataFrame) -> pd.DataFrame:\n    df_clean = df.copy()\n    # 1. Удаление полных дубликатов\n    df_clean = df_clean.drop_duplicates()\n    # 2. Обработка дат\n    if 'order_date' in df_clean.columns:\n        df_clean['order_date'] = pd.to_datetime(df_clean['order_date'])\n    # 3. Фильтрация статусов\n    if 'status' in df_clean.columns:\n        df_clean = df_clean[df_clean['status'].isin(['Completed', 'Refunded'])]\n    return df_clean\n\norders_raw = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\norders_processed = clean_pipeline(orders_raw)\nprint(f\"До очистки: {len(orders_raw)} строк, После: {len(orders_processed)} строк\")\n"}]}]}, {"id": "module_05_statistics", "title": "Модуль 5: Статистика & Регрессия", "category": "Математика", "badge": "Статистика", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика)\n\n### Вопрос 1\nЧто строго означает $p\\text{-value} = 0.03$?\n- [ ] Вероятность того, что тестируемая гипотеза верна, равна 3%\n- [x] Вероятность получить такое или еще более экстремальное различие случайно при условии, что нулевая гипотеза $H_0$ истинна, составляет 3%\n- [ ] Вероятность ошибки ровно 97%\n\n### Вопрос 2\nКогда следует применять критерий Манна-Уитни вместо t-теста Стьюдента?\n- [ ] Когда выборки очень большие\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты выбросов и не подчиняются нормальному распределению\n- [ ] Всегда вместо t-теста\n\n### Вопрос 3\nЧто показывает коэффициент детерминации $R^2$ в линейной регрессии?\n- [ ] Точность предсказания в процентах\n- [x] Долю дисперсии зависимой переменной, которая объясняется включенными в модель факторами\n- [ ] Вероятность переобучения\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 1: Меры центральной тенденции и разброса\\n\",\n        \"\\n\",\n        \"Когда среднее врет? Пример с зарплатами в комнате, куда зашел миллиардер:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"salaries = [50000, 60000, 55000, 65000, 70000, 52000, 58000] # Обычные сотрудники\\n\",\n        \"salaries_with_vip = salaries + [100_000_000] # Пришел инвестор\\n\",\n        \"\\n\",\n        \"print(\\\"БЕЗ ВЫБРОСА:\\\")\\n\",\n        \"print(f\\\"Среднее: {np.mean(salaries):,.0f} руб | Медиана: {np.median(salaries):,.0f} руб\\\")\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\nС ВЫБРОСОМ:\\\")\\n\",\n        \"print(f\\\"Среднее: {np.mean(salaries_with_vip):,.0f} руб (Искажено!) | Медиана: {np.median(salaries_with_vip):,.0f} руб (Устойчива!)\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 1: Меры центральной тенденции и разброса\n\nКогда среднее врет? Пример с зарплатами в комнате, куда зашел миллиардер:\n"}, {"type": "code", "content": "import numpy as np\nimport pandas as pd\n\nsalaries = [50000, 60000, 55000, 65000, 70000, 52000, 58000] # Обычные сотрудники\nsalaries_with_vip = salaries + [100_000_000] # Пришел инвестор\n\nprint(\"БЕЗ ВЫБРОСА:\")\nprint(f\"Среднее: {np.mean(salaries):,.0f} руб | Медиана: {np.median(salaries):,.0f} руб\")\n\nprint(\"\\nС ВЫБРОСОМ:\")\nprint(f\"Среднее: {np.mean(salaries_with_vip):,.0f} руб (Искажено!) | Медиана: {np.median(salaries_with_vip):,.0f} руб (Устойчива!)\")\n"}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 2: Вероятность и теорема Байеса в аналитике\\n\",\n        \"\\n\",\n        \"Формула Байеса:\\n\",\n        \"$$P(A|B) = \\\\frac{P(B|A) \\\\cdot P(A)}{P(B)}$$\\n\",\n        \"\\n\",\n        \"Пример: Модель антифрода отметила платеж как подозрительный. Какова реальная вероятность мошенничества?\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Расчет апостериорной вероятности фрода\\n\",\n        \"# P(Fraud) = 0.01 (1% транзакций мошеннические)\\n\",\n        \"# Sensitivity (Recall) = 0.95 (если фрод, модель видит с шансом 95%)\\n\",\n        \"# False Positive Rate = 0.05 (на честных срабатывает в 5% случаев)\\n\",\n        \"\\n\",\n        \"p_fraud = 0.01\\n\",\n        \"p_clean = 0.99\\n\",\n        \"p_alert_given_fraud = 0.95\\n\",\n        \"p_alert_given_clean = 0.05\\n\",\n        \"\\n\",\n        \"# Полная вероятность срабатывания алерта\\n\",\n        \"p_alert = (p_alert_given_fraud * p_fraud) + (p_alert_given_clean * p_clean)\\n\",\n        \"\\n\",\n        \"# Истинная вероятность фрода при алерте\\n\",\n        \"p_fraud_given_alert = (p_alert_given_fraud * p_fraud) / p_alert\\n\",\n        \"print(f\\\"Вероятность того, что отмеченная транзакция действительно фрод: {p_fraud_given_alert*100:.1f}%\\\")\\n\",\n        \"print(\\\"Инсайт: Несмотря на 95% точность, из-за редкого базового события более половины алертов — ложные!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 2: Вероятность и теорема Байеса в аналитике\n\nФормула Байеса:\n$$P(A|B) = \\frac{P(B|A) \\cdot P(A)}{P(B)}$$\n\nПример: Модель антифрода отметила платеж как подозрительный. Какова реальная вероятность мошенничества?\n"}, {"type": "code", "content": "# Расчет апостериорной вероятности фрода\n# P(Fraud) = 0.01 (1% транзакций мошеннические)\n# Sensitivity (Recall) = 0.95 (если фрод, модель видит с шансом 95%)\n# False Positive Rate = 0.05 (на честных срабатывает в 5% случаев)\n\np_fraud = 0.01\np_clean = 0.99\np_alert_given_fraud = 0.95\np_alert_given_clean = 0.05\n\n# Полная вероятность срабатывания алерта\np_alert = (p_alert_given_fraud * p_fraud) + (p_alert_given_clean * p_clean)\n\n# Истинная вероятность фрода при алерте\np_fraud_given_alert = (p_alert_given_fraud * p_fraud) / p_alert\nprint(f\"Вероятность того, что отмеченная транзакция действительно фрод: {p_fraud_given_alert*100:.1f}%\")\nprint(\"Инсайт: Несмотря на 95% точность, из-за редкого базового события более половины алертов — ложные!\")\n"}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 3: Центральная предельная теорема (ЦПТ) на практике\\n\",\n        \"\\n\",\n        \"Даже если исходное распределение экспоненциальное или сильно скошенное, **распределение выборочных средних стремится к нормальному**!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"np.random.seed(42)\\n\",\n        \"# Исходное скошенное распределение (чеки интернет-магазина)\\n\",\n        \"population = np.random.exponential(scale=1000, size=50000)\\n\",\n        \"\\n\",\n        \"sample_means = []\\n\",\n        \"for _ in range(2000):\\n\",\n        \"    sample = np.random.choice(population, size=50)\\n\",\n        \"    sample_means.append(sample.mean())\\n\",\n        \"\\n\",\n        \"plt.figure(figsize=(10, 4))\\n\",\n        \"plt.subplot(1, 2, 1)\\n\",\n        \"plt.hist(population, bins=50, color='orange', alpha=0.7)\\n\",\n        \"plt.title('Исходная совокупность (Скошенная)')\\n\",\n        \"\\n\",\n        \"plt.subplot(1, 2, 2)\\n\",\n        \"plt.hist(sample_means, bins=40, color='blue', alpha=0.7)\\n\",\n        \"plt.title('Выборочные средние (Нормальное ЦПТ!)')\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 3: Центральная предельная теорема (ЦПТ) на практике\n\nДаже если исходное распределение экспоненциальное или сильно скошенное, **распределение выборочных средних стремится к нормальному**!\n"}, {"type": "code", "content": "import numpy as np\nimport matplotlib.pyplot as plt\n\nnp.random.seed(42)\n# Исходное скошенное распределение (чеки интернет-магазина)\npopulation = np.random.exponential(scale=1000, size=50000)\n\nsample_means = []\nfor _ in range(2000):\n    sample = np.random.choice(population, size=50)\n    sample_means.append(sample.mean())\n\nplt.figure(figsize=(10, 4))\nplt.subplot(1, 2, 1)\nplt.hist(population, bins=50, color='orange', alpha=0.7)\nplt.title('Исходная совокупность (Скошенная)')\n\nplt.subplot(1, 2, 2)\nplt.hist(sample_means, bins=40, color='blue', alpha=0.7)\nplt.title('Выборочные средние (Нормальное ЦПТ!)')\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 4: Проверка гипотез и p-value\\n\",\n        \"\\n\",\n        \"Алгоритм проверки гипотез:\\n\",\n        \"1. $H_0$: Разницы между группами нет.\\n\",\n        \"2. $H_1$: Разница статистически значима.\\n\",\n        \"3. Порог значимости $\\\\alpha = 0.05$.\\n\",\n        \"4. Если $p\\\\text{-value} < \\\\alpha$ — отклоняем $H_0$.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"from scipy import stats\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Симулируем чеки двух версий сайта\\n\",\n        \"np.random.seed(42)\\n\",\n        \"revenue_a = np.random.normal(loc=3100, scale=800, size=500)\\n\",\n        \"revenue_b = np.random.normal(loc=3250, scale=820, size=500)\\n\",\n        \"\\n\",\n        \"# Двухвыборочный t-тест\\n\",\n        \"t_stat, p_val = stats.ttest_ind(revenue_a, revenue_b)\\n\",\n        \"\\n\",\n        \"print(f\\\"Среднее группы А: {revenue_a.mean():.2f}\\\")\\n\",\n        \"print(f\\\"Среднее группы B: {revenue_b.mean():.2f}\\\")\\n\",\n        \"print(f\\\"t-statistic: {t_stat:.4f}\\\")\\n\",\n        \"print(f\\\"p-value: {p_val:.5f}\\\")\\n\",\n        \"\\n\",\n        \"if p_val < 0.05:\\n\",\n        \"    print(\\\" Результат статистически значим! Разница не случайна.\\\")\\n\",\n        \"else:\\n\",\n        \"    print(\\\" Не удалось отклонить H0. Разница может быть случайным шумом.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 4: Проверка гипотез и p-value\n\nАлгоритм проверки гипотез:\n1. $H_0$: Разницы между группами нет.\n2. $H_1$: Разница статистически значима.\n3. Порог значимости $\\alpha = 0.05$.\n4. Если $p\\text{-value} < \\alpha$ — отклоняем $H_0$.\n"}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\n# Симулируем чеки двух версий сайта\nnp.random.seed(42)\nrevenue_a = np.random.normal(loc=3100, scale=800, size=500)\nrevenue_b = np.random.normal(loc=3250, scale=820, size=500)\n\n# Двухвыборочный t-тест\nt_stat, p_val = stats.ttest_ind(revenue_a, revenue_b)\n\nprint(f\"Среднее группы А: {revenue_a.mean():.2f}\")\nprint(f\"Среднее группы B: {revenue_b.mean():.2f}\")\nprint(f\"t-statistic: {t_stat:.4f}\")\nprint(f\"p-value: {p_val:.5f}\")\n\nif p_val < 0.05:\n    print(\" Результат статистически значим! Разница не случайна.\")\nelse:\n    print(\" Не удалось отклонить H0. Разница может быть случайным шумом.\")\n"}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 5: Линейная и логистическая регрессия\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import statsmodels.api as sm\\n\",\n        \"\\n\",\n        \"# На реальных данных SaaS исследуем связь использования фичей и NPS\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"X = saas[['active_seats', 'feature_a_usage']]\\n\",\n        \"X = sm.add_constant(X)\\n\",\n        \"y = saas['nps_score']\\n\",\n        \"\\n\",\n        \"model = sm.OLS(y, X).fit()\\n\",\n        \"print(\\\"Краткая сводка регрессии OLS:\\\")\\n\",\n        \"print(f\\\"R-squared: {model.rsquared:.4f}\\\")\\n\",\n        \"print(f\\\"Коэффициенты:\\\\n{model.params}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 5: Линейная и логистическая регрессия\n"}, {"type": "code", "content": "import pandas as pd\nimport statsmodels.api as sm\n\n# На реальных данных SaaS исследуем связь использования фичей и NPS\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\nX = saas[['active_seats', 'feature_a_usage']]\nX = sm.add_constant(X)\ny = saas['nps_score']\n\nmodel = sm.OLS(y, X).fit()\nprint(\"Краткая сводка регрессии OLS:\")\nprint(f\"R-squared: {model.rsquared:.4f}\")\nprint(f\"Коэффициенты:\\n{model.params}\")\n"}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 5. Урок 6: Ловушки аналитика: Парадокс Симпсона\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация Парадокса Симпсона\\n\",\n        \"# В общем конверсия в группе А выше, но в разрезе каждого сегмента (Desktop/Mobile) группа B побеждает!\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"data = {\\n\",\n        \"    'Variant': ['A', 'A', 'B', 'B'],\\n\",\n        \"    'Device': ['Mobile', 'Desktop', 'Mobile', 'Desktop'],\\n\",\n        \"    'Visitors': [800, 200, 200, 800],\\n\",\n        \"    'Conversions': [80, 40, 24, 176]\\n\",\n        \"}\\n\",\n        \"simpson_df = pd.DataFrame(data)\\n\",\n        \"simpson_df['CR_%'] = (simpson_df['Conversions'] / simpson_df['Visitors'] * 100).round(1)\\n\",\n        \"print(simpson_df)\\n\",\n        \"print(\\\"\\\\n Общий CR A: (80+40)/1000 = 12.0%\\\")\\n\",\n        \"print(\\\" Общий CR B: (24+176)/1000 = 20.0%\\\")\\n\",\n        \"print(\\\" Инсайт: Разбалансировка долей трафика меняет вывод на противоположный. Всегда сегментируйте данные!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 5. Урок 6: Ловушки аналитика: Парадокс Симпсона\n"}, {"type": "code", "content": "# Демонстрация Парадокса Симпсона\n# В общем конверсия в группе А выше, но в разрезе каждого сегмента (Desktop/Mobile) группа B побеждает!\nimport pandas as pd\n\ndata = {\n    'Variant': ['A', 'A', 'B', 'B'],\n    'Device': ['Mobile', 'Desktop', 'Mobile', 'Desktop'],\n    'Visitors': [800, 200, 200, 800],\n    'Conversions': [80, 40, 24, 176]\n}\nsimpson_df = pd.DataFrame(data)\nsimpson_df['CR_%'] = (simpson_df['Conversions'] / simpson_df['Visitors'] * 100).round(1)\nprint(simpson_df)\nprint(\"\\n Общий CR A: (80+40)/1000 = 12.0%\")\nprint(\" Общий CR B: (24+176)/1000 = 20.0%\")\nprint(\" Инсайт: Разбалансировка долей трафика меняет вывод на противоположный. Всегда сегментируйте данные!\")\n"}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6: BI-аналитика в Looker Studio", "category": "Визуализация", "badge": "BI", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio)\n\n### Вопрос 1\nКак правильно рассчитать показатель конверсии (CR) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Conversions / Visitors)`\n- [x] `SUM(Conversions) / SUM(Visitors)`\n- [ ] `Conversions / Visitors`\n\n### Вопрос 2\nВ чем разница между Dimension (Измерением) и Metric (Показателем)?\n- [ ] Нет разницы\n- [x] Dimension — это нечисловой срез или группировка (текст, дата, категория), а Metric — это агрегируемое числовое значение\n- [ ] Metric всегда отображается зеленым цветом\n\n### Вопрос 3\nЧто означает F-паттерн в дизайне дашбордов?\n- [ ] Форматирование шрифтов в стиле Google\n- [x] Привычка взгляда пользователя сканировать экран слева направо и сверху вниз; самые важные KPI размещают в левом верхнем углу\n- [ ] Быстрое построение графиков за 5 минут\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 6. Урок 1: Введение в Looker Studio\\n\",\n        \"\\n\",\n        \"В BI-инструментах все поля делятся на два фундаментальных класса:\\n\",\n        \"1. **Dimensions (Измерения, зеленые поля)**: Категориальные срезы, даты, сегменты (например, `City`, `Date`, `Category`). Они попадают в строки/группировки.\\n\",\n        \"2. **Metrics (Показатели, синие поля)**: Числовые агрегируемые значения (например, `Revenue`, `Orders_Count`, `Avg_Check`).\\n\",\n        \"\\n\",\n        \"## Подготовка данных для загрузки в Looker Studio\\n\",\n        \"Перед импортом таблицы в Looker Studio создадим агрегированную плоскую выгрузку:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import sqlite3\\n\",\n        \"\\n\",\n        \"# Экспорт готовой витрины для Looker Studio\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    SUBSTR(o.order_date, 1, 10) AS order_date,\\n\",\n        \"    c.city,\\n\",\n        \"    c.acquisition_channel,\\n\",\n        \"    c.device,\\n\",\n        \"    p.category,\\n\",\n        \"    p.product_name,\\n\",\n        \"    oi.quantity,\\n\",\n        \"    oi.unit_price,\\n\",\n        \"    oi.total_amount AS revenue,\\n\",\n        \"    (oi.total_amount - (p.cost * oi.quantity)) AS gross_profit\\n\",\n        \"FROM orders o\\n\",\n        \"JOIN customers c ON o.customer_id = c.customer_id\\n\",\n        \"JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"JOIN products p ON oi.product_id = p.product_id\\n\",\n        \"WHERE o.status = 'Completed';\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"bi_export = pd.read_sql(query, conn)\\n\",\n        \"bi_export.to_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\processed\\\\looker_studio_source.csv\\\", index=False)\\n\",\n        \"print(f\\\"Витрина успешно сохранена! Строк: {len(bi_export)}\\\")\\n\",\n        \"print(bi_export.head(3))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 6. Урок 1: Введение в Looker Studio\n\nВ BI-инструментах все поля делятся на два фундаментальных класса:\n1. **Dimensions (Измерения, зеленые поля)**: Категориальные срезы, даты, сегменты (например, `City`, `Date`, `Category`). Они попадают в строки/группировки.\n2. **Metrics (Показатели, синие поля)**: Числовые агрегируемые значения (например, `Revenue`, `Orders_Count`, `Avg_Check`).\n\n## Подготовка данных для загрузки в Looker Studio\nПеред импортом таблицы в Looker Studio создадим агрегированную плоскую выгрузку:\n"}, {"type": "code", "content": "import pandas as pd\nimport sqlite3\n\n# Экспорт готовой витрины для Looker Studio\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\nquery = \"\"\"\nSELECT \n    SUBSTR(o.order_date, 1, 10) AS order_date,\n    c.city,\n    c.acquisition_channel,\n    c.device,\n    p.category,\n    p.product_name,\n    oi.quantity,\n    oi.unit_price,\n    oi.total_amount AS revenue,\n    (oi.total_amount - (p.cost * oi.quantity)) AS gross_profit\nFROM orders o\nJOIN customers c ON o.customer_id = c.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nJOIN products p ON oi.product_id = p.product_id\nWHERE o.status = 'Completed';\n\"\"\"\nbi_export = pd.read_sql(query, conn)\nbi_export.to_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\processed\\looker_studio_source.csv\", index=False)\nprint(f\"Витрина успешно сохранена! Строк: {len(bi_export)}\")\nprint(bi_export.head(3))\n"}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 6. Урок 2: Вычисляемые поля и синтаксис Looker Studio\\n\",\n        \"\\n\",\n        \"Формулы в Looker Studio похожи на гибрид SQL и Excel:\\n\",\n        \"\\n\",\n        \"### 1. Маржинальность в процентах:\\n\",\n        \"```sql\\n\",\n        \"SUM(gross_profit) / SUM(revenue)\\n\",\n        \"```\\n\",\n        \"*(Важно: делить именно сумму на сумму, а не брать среднее от частных!)*\\n\",\n        \"\\n\",\n        \"### 2. Сегментация чека через CASE WHEN:\\n\",\n        \"```sql\\n\",\n        \"CASE \\n\",\n        \"  WHEN revenue >= 10000 THEN 'Крупный чек (>10k)'\\n\",\n        \"  WHEN revenue >= 3000 THEN 'Средний чек (3k-10k)'\\n\",\n        \"  ELSE 'Малый чек (<3k)'\\n\",\n        \"END\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 6. Урок 2: Вычисляемые поля и синтаксис Looker Studio\n\nФормулы в Looker Studio похожи на гибрид SQL и Excel:\n\n### 1. Маржинальность в процентах:\n```sql\nSUM(gross_profit) / SUM(revenue)\n```\n*(Важно: делить именно сумму на сумму, а не брать среднее от частных!)*\n\n### 2. Сегментация чека через CASE WHEN:\n```sql\nCASE \n  WHEN revenue >= 10000 THEN 'Крупный чек (>10k)'\n  WHEN revenue >= 3000 THEN 'Средний чек (3k-10k)'\n  ELSE 'Малый чек (<3k)'\nEND\n```\n"}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 6. Урок 3: Data Blending (Смешивание данных)\\n\",\n        \"\\n\",\n        \"Когда факты лежат в разных таблицах (например, расходы на маркетинг из Google Sheets, а реальные продажи из базы заказов), в Looker Studio используется **Data Blending**.\\n\",\n        \"\\n\",\n        \"### Правила надежного Blending:\\n\",\n        \"1. Выбирайте единый ключ объединения (Join Key): например, `Date` + `Channel`.\\n\",\n        \"2. Используйте **Left Outer Join**, чтобы не терять дни без расходов или без продаж.\\n\",\n        \"3. Согласовывайте форматы дат (YYYY-MM-DD).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 6. Урок 3: Data Blending (Смешивание данных)\n\nКогда факты лежат в разных таблицах (например, расходы на маркетинг из Google Sheets, а реальные продажи из базы заказов), в Looker Studio используется **Data Blending**.\n\n### Правила надежного Blending:\n1. Выбирайте единый ключ объединения (Join Key): например, `Date` + `Channel`.\n2. Используйте **Left Outer Join**, чтобы не терять дни без расходов или без продаж.\n3. Согласовывайте форматы дат (YYYY-MM-DD).\n"}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 6. Урок 4: UI/UX дизайн дашборда для руководителей\\n\",\n        \"\\n\",\n        \"## Правило 5 секунд (5-Second Rule):\\n\",\n        \"Руководитель должен за 5 секунд понять:\\n\",\n        \"1. **Что происходит прямо сейчас?** (Главные KPI карточки в верхнем левом углу).\\n\",\n        \"2. **Это хорошо или плохо?** (Сравнение с планом или предыдущим периодом $\\\\Delta\\\\%$).\\n\",\n        \"3. **Где точка внимания?** (Цветовой акцент: зеленый/красный).\\n\",\n        \"\\n\",\n        \"### Зонирование экрана (F-Pattern):\\n\",\n        \"```\\n\",\n        \"┌────────────────────────────────────────────────────────┐\\n\",\n        \"│  [Logo / Название]   [Фильтр дат]  [Фильтр каналов]    │\\n\",\n        \"├────────────────────────────────────────────────────────┤\\n\",\n        \"│  [KPI: Выручка]   [KPI: Заказы]   [KPI: Средний чек]   │\\n\",\n        \"├──────────────────────────┬─────────────────────────────┤\\n\",\n        \"│  Тренд выручки (Line)    │  Структура по категориям   │\\n\",\n        \"├──────────────────────────┴─────────────────────────────┤\\n\",\n        \"│  Таблица лидеров / аутсайдеров (с условным выделением) │\\n\",\n        \"└────────────────────────────────────────────────────────┘\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 6. Урок 4: UI/UX дизайн дашборда для руководителей\n\n## Правило 5 секунд (5-Second Rule):\nРуководитель должен за 5 секунд понять:\n1. **Что происходит прямо сейчас?** (Главные KPI карточки в верхнем левом углу).\n2. **Это хорошо или плохо?** (Сравнение с планом или предыдущим периодом $\\Delta\\%$).\n3. **Где точка внимания?** (Цветовой акцент: зеленый/красный).\n\n### Зонирование экрана (F-Pattern):\n```\n┌────────────────────────────────────────────────────────┐\n│  [Logo / Название]   [Фильтр дат]  [Фильтр каналов]    │\n├────────────────────────────────────────────────────────┤\n│  [KPI: Выручка]   [KPI: Заказы]   [KPI: Средний чек]   │\n├──────────────────────────┬─────────────────────────────┤\n│  Тренд выручки (Line)    │  Структура по категориям   │\n├──────────────────────────┴─────────────────────────────┤\n│  Таблица лидеров / аутсайдеров (с условным выделением) │\n└────────────────────────────────────────────────────────┘\n```\n"}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 6. Урок 5: Интерактивность и Cross-Filtering\\n\",\n        \"\\n\",\n        \"1. **Date Range Control**: Установка плавающих диапазонов («Последние 30 дней», «Текущий квартал»).\\n\",\n        \"2. **Cross-filtering**: Клик по столбцу «Electronics» на диаграмме категорий автоматически фильтрует все остальные графики на странице.\\n\",\n        \"3. **Drill-down**: Проваливание от уровня «Год» к «Месяцу» и «Дню» внутри одной диаграммы.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 6. Урок 5: Интерактивность и Cross-Filtering\n\n1. **Date Range Control**: Установка плавающих диапазонов («Последние 30 дней», «Текущий квартал»).\n2. **Cross-filtering**: Клик по столбцу «Electronics» на диаграмме категорий автоматически фильтрует все остальные графики на странице.\n3. **Drill-down**: Проваливание от уровня «Год» к «Месяцу» и «Дню» внутри одной диаграммы.\n"}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7: A/B-тестирование & Эксперименты", "category": "Эксперименты", "badge": "A/B", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B Testing)\n\n### Вопрос 1\nЧто такое Sample Ratio Mismatch (SRM)?\n- [ ] Ошибка в расчете среднего чека\n- [x] Аномальное отклонение фактического соотношения пользователей в группах от запланированного (например, 45/55 вместо 50/50), указывающее на технический баг сплиттера\n- [ ] Разница между конверсиями в группах\n\n### Вопрос 2\nПочему опасно завершать A/B-тест досрочно, как только p-value впервые упал ниже 0.05 (Peeking Problem)?\n- [ ] Сервер зависнет\n- [x] Это резко завышает вероятность ошибки I рода (ложноположительного результата), фиксируя случайный временный шум\n- [ ] Теряются исторические логи\n\n### Вопрос 3\nЧто такое Guardrail Metric?\n- [ ] Метрика скорости загрузки кода\n- [x] Защитная метрика, ухудшение которой недопустимо даже при росте целевой метрики (например: уровень возвратов, отток, жалобы в саппорт)\n- [ ] Название кнопки на сайте\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 7. Урок 1: Дизайн эксперимента и расчет выборки\\n\",\n        \"\\n\",\n        \"Формула размера выборки для пропорции (конверсии):\\n\",\n        \"$$n = \\\\frac{2 \\\\cdot (Z_{\\\\alpha/2} + Z_{\\\\beta})^2 \\\\cdot p(1-p)}{MDE^2}$$\\n\",\n        \"\\n\",\n        \"Где:\\n\",\n        \"- $\\\\alpha = 0.05$ (Уровень значимости, $Z_{0.025} \\\\approx 1.96$)\\n\",\n        \"- $\\\\beta = 0.20$ (Мощность $80\\\\%$, $Z_{0.20} \\\\approx 0.84$)\\n\",\n        \"- $p$ — базовая конверсия\\n\",\n        \"- $MDE$ — минимальный детектируемый эффект в абсолютных долях\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import statsmodels.stats.api as sms\\n\",\n        \"\\n\",\n        \"# Расчет необходимого размера выборки на группу\\n\",\n        \"baseline_cr = 0.080 # Базовая конверсия 8%\\n\",\n        \"target_cr = 0.092   # Хотим заметить рост до 9.2% (MDE = 1.2% абс. / 15% отн.)\\n\",\n        \"\\n\",\n        \"effect_size = sms.proportion_effectsize(baseline_cr, target_cr)\\n\",\n        \"required_sample = sms.NormalIndPower().solve_power(\\n\",\n        \"    effect_size=effect_size,\\n\",\n        \"    power=0.80,\\n\",\n        \"    alpha=0.05,\\n\",\n        \"    ratio=1\\n\",\n        \")\\n\",\n        \"print(f\\\"Базовая конверсия: {baseline_cr*100}% | Ожидаемая: {target_cr*100}%\\\")\\n\",\n        \"print(f\\\"Необходимо пользователей В КАЖДОЙ группе: {int(round(required_sample)):,}\\\")\\n\",\n        \"print(f\\\"Всего участников теста: {int(round(required_sample))*2:,}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 7. Урок 1: Дизайн эксперимента и расчет выборки\n\nФормула размера выборки для пропорции (конверсии):\n$$n = \\frac{2 \\cdot (Z_{\\alpha/2} + Z_{\\beta})^2 \\cdot p(1-p)}{MDE^2}$$\n\nГде:\n- $\\alpha = 0.05$ (Уровень значимости, $Z_{0.025} \\approx 1.96$)\n- $\\beta = 0.20$ (Мощность $80\\%$, $Z_{0.20} \\approx 0.84$)\n- $p$ — базовая конверсия\n- $MDE$ — минимальный детектируемый эффект в абсолютных долях\n"}, {"type": "code", "content": "import statsmodels.stats.api as sms\n\n# Расчет необходимого размера выборки на группу\nbaseline_cr = 0.080 # Базовая конверсия 8%\ntarget_cr = 0.092   # Хотим заметить рост до 9.2% (MDE = 1.2% абс. / 15% отн.)\n\neffect_size = sms.proportion_effectsize(baseline_cr, target_cr)\nrequired_sample = sms.NormalIndPower().solve_power(\n    effect_size=effect_size,\n    power=0.80,\n    alpha=0.05,\n    ratio=1\n)\nprint(f\"Базовая конверсия: {baseline_cr*100}% | Ожидаемая: {target_cr*100}%\")\nprint(f\"Необходимо пользователей В КАЖДОЙ группе: {int(round(required_sample)):,}\")\nprint(f\"Всего участников теста: {int(round(required_sample))*2:,}\")\n"}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 7. Урок 2: Проверка сплитования: Sample Ratio Mismatch (SRM)\\n\",\n        \"\\n\",\n        \"Если сплит 50/50, а пришло 5 200 против 4 800 пользователей — сломался ли сплиттер? Проверяем критерием $\\\\chi^2$.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"from scipy.stats import chisquare\\n\",\n        \"\\n\",\n        \"# Загружаем датасет A/B теста\\n\",\n        \"ab_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\ab_test_checkout.csv\\\")\\n\",\n        \"counts = ab_df['test_group'].value_counts()\\n\",\n        \"print(\\\"Фактическое распределение:\\\")\\n\",\n        \"print(counts)\\n\",\n        \"\\n\",\n        \"# Хи-квадрат проверка SRM при ожидании 50 / 50\\n\",\n        \"observed = [counts['A_Control'], counts['B_Variant']]\\n\",\n        \"total = sum(observed)\\n\",\n        \"expected = [total / 2, total / 2]\\n\",\n        \"\\n\",\n        \"chi2_stat, p_val = chisquare(f_obs=observed, f_exp=expected)\\n\",\n        \"print(f\\\"\\\\nChi2 stat: {chi2_stat:.4f}, p-value: {p_val:.4f}\\\")\\n\",\n        \"if p_val < 0.01:\\n\",\n        \"    print(\\\" КРИТИЧЕСКАЯ ОШИБКА: Обнаружен SRM! Трафик распределился неравномерно, тест невалиден!\\\")\\n\",\n        \"else:\\n\",\n        \"    print(\\\" SRM не обнаружен. Сплитование корректное (50/50 соблюдено).\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 7. Урок 2: Проверка сплитования: Sample Ratio Mismatch (SRM)\n\nЕсли сплит 50/50, а пришло 5 200 против 4 800 пользователей — сломался ли сплиттер? Проверяем критерием $\\chi^2$.\n"}, {"type": "code", "content": "import pandas as pd\nfrom scipy.stats import chisquare\n\n# Загружаем датасет A/B теста\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\ncounts = ab_df['test_group'].value_counts()\nprint(\"Фактическое распределение:\")\nprint(counts)\n\n# Хи-квадрат проверка SRM при ожидании 50 / 50\nobserved = [counts['A_Control'], counts['B_Variant']]\ntotal = sum(observed)\nexpected = [total / 2, total / 2]\n\nchi2_stat, p_val = chisquare(f_obs=observed, f_exp=expected)\nprint(f\"\\nChi2 stat: {chi2_stat:.4f}, p-value: {p_val:.4f}\")\nif p_val < 0.01:\n    print(\" КРИТИЧЕСКАЯ ОШИБКА: Обнаружен SRM! Трафик распределился неравномерно, тест невалиден!\")\nelse:\n    print(\" SRM не обнаружен. Сплитование корректное (50/50 соблюдено).\")\n"}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 7. Урок 3: Анализ конверсии и выручки в A/B тесте\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"from statsmodels.stats.proportion import proportions_ztest\\n\",\n        \"from scipy import stats\\n\",\n        \"\\n\",\n        \"ab_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\ab_test_checkout.csv\\\")\\n\",\n        \"\\n\",\n
