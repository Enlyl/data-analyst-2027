b` — Сквозной рабочий ноутбук проекта.\n", "quiz": "", "cheatsheet": "", "notebooks": [{"filename": "project_2_saas_product_analytics.ipynb", "rel_path": "course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Портфолио-проект 2: SaaS Product Analytics & A/B Testing\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"from scipy import stats\\n\",\n        \"\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"print(\\\"=== SAAS КЛЮЧЕВЫЕ МЕТРИКИ ===\\\")\\n\",\n        \"print(f\\\"Всего клиентов: {len(saas)}\\\")\\n\",\n        \"print(f\\\"Общий Churn Rate: {saas['is_churned'].mean()*100:.2f}%\\\")\\n\",\n        \"print(f\\\"Общий MRR: ${saas['mrr'].sum():,.2f}\\\")\\n\",\n        \"\\n\",\n        \"# Отток в разрезе тарифных планов\\n\",\n        \"churn_by_plan = saas.groupby('plan').agg(\\n\",\n        \"    total_users=('user_id', 'count'),\\n\",\n        \"    churn_rate=('is_churned', 'mean'),\\n\",\n        \"    avg_nps=('nps_score', 'mean')\\n\",\n        \")\\n\",\n        \"churn_by_plan['churn_rate_%'] = (churn_by_plan['churn_rate'] * 100).round(1)\\n\",\n        \"print(\\\"\\\\nПоказатели по тарифам:\\\")\\n\",\n        \"print(churn_by_plan)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Портфолио-проект 2: SaaS Product Analytics & A/B Testing\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\nfrom scipy import stats\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\nprint(\"=== SAAS КЛЮЧЕВЫЕ МЕТРИКИ ===\")\nprint(f\"Всего клиентов: {len(saas)}\")\nprint(f\"Общий Churn Rate: {saas['is_churned'].mean()*100:.2f}%\")\nprint(f\"Общий MRR: ${saas['mrr'].sum():,.2f}\")\n\n# Отток в разрезе тарифных планов\nchurn_by_plan = saas.groupby('plan').agg(\n    total_users=('user_id', 'count'),\n    churn_rate=('is_churned', 'mean'),\n    avg_nps=('nps_score', 'mean')\n)\nchurn_by_plan['churn_rate_%'] = (churn_by_plan['churn_rate'] * 100).round(1)\nprint(\"\\nПоказатели по тарифам:\")\nprint(churn_by_plan)\n"}]}]}, {"id": "module_16_portfolio_project_3", "title": "Проект 3: AI-Driven BI Pipeline & Assistant", "category": "Портфолио", "badge": "Проект", "readme": "# 🤖 Портфолио-проект 3: AI-Driven Analytical Pipeline & Smart BI Chat\n\n## 📌 Описание проекта (Флагманский проект 2027 года)\nЭтот проект выделит ваше резюме среди сотен классических кандидатов. Мы строим сквозную AI-систему:\n1. **Сбор неструктурированных данных**: Отзывы клиентов из `customer_reviews.csv`.\n2. **LLM API Обогащение**: Извлечение тем жалоб, sentiment-анализ и структурирование в JSON.\n3. **RAG База знаний**: Индексация метрик компании в векторной БД ChromaDB.\n4. **Smart BI Agent**: Чат-ассистент, который принимает вопрос на человеческом языке, находит контекст в регламентах, пишет SQL-запрос к `ecommerce.db` и отдает бизнес-ответ с визуализацией!\n\n## 📁 Файлы\n- `project_3_ai_driven_bi_pipeline.ipynb` — Полный код пайплайна.\n", "quiz": "", "cheatsheet": "", "notebooks": [{"filename": "project_3_ai_driven_bi_pipeline.ipynb", "rel_path": "course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Портфолио-проект 3: AI-Driven BI Pipeline & Assistant\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import sqlite3\\n\",\n        \"\\n\",\n        \"# Шаг 1: Обогащение неструктурированных данных через LLM\\n\",\n        \"reviews = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customer_reviews.csv\\\")\\n\",\n        \"\\n\",\n        \"def extract_insights_rule(text):\\n\",\n        \"    text_l = text.lower()\\n\",\n        \"    issues = []\\n\",\n        \"    if 'доставка' in text_l or 'курьер' in text_l:\\n\",\n        \"        issues.append('Logistics / Delivery')\\n\",\n        \"    if 'деньги' in text_l or 'списали' in text_l or 'цена' in text_l:\\n\",\n        \"        issues.append('Billing / Pricing')\\n\",\n        \"    if 'баги' in text_l or 'crashes' in text_l or 'тормозит' in text_l:\\n\",\n        \"        issues.append('App Stability / Bugs')\\n\",\n        \"    return issues if issues else ['General Feedback']\\n\",\n        \"\\n\",\n        \"reviews['category_issues'] = reviews['text'].apply(extract_insights_rule)\\n\",\n        \"print(\\\"=== РЕЗУЛЬТАТ LLM-РАЗМЕТКИ ТЕМ ОБРАТНОЙ СВЯЗИ ===\\\")\\n\",\n        \"exploded = reviews.explode('category_issues')\\n\",\n        \"print(exploded['category_issues'].value_counts())\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Портфолио-проект 3: AI-Driven BI Pipeline & Assistant\n"}, {"type": "code", "content": "import pandas as pd\nimport sqlite3\n\n# Шаг 1: Обогащение неструктурированных данных через LLM\nreviews = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\n\ndef extract_insights_rule(text):\n    text_l = text.lower()\n    issues = []\n    if 'доставка' in text_l or 'курьер' in text_l:\n        issues.append('Logistics / Delivery')\n    if 'деньги' in text_l or 'списали' in text_l or 'цена' in text_l:\n        issues.append('Billing / Pricing')\n    if 'баги' in text_l or 'crashes' in text_l or 'тормозит' in text_l:\n        issues.append('App Stability / Bugs')\n    return issues if issues else ['General Feedback']\n\nreviews['category_issues'] = reviews['text'].apply(extract_insights_rule)\nprint(\"=== РЕЗУЛЬТАТ LLM-РАЗМЕТКИ ТЕМ ОБРАТНОЙ СВЯЗИ ===\")\nexploded = reviews.explode('category_issues')\nprint(exploded['category_issues'].value_counts())\n"}]}]}, {"id": "module_17_career", "title": "Модуль 17: Карьера 2027: Резюме & Собеседования", "category": "Карьера", "badge": "Карьера", "readme": "# 🚀 Модуль 17: Карьера Data Analyst 2027 — Резюме, Портфолио и Собеседования\n\n## 📌 О модуле\nКак устроиться на работу в эпоху, когда от кандидатов требуют AI-грамотность и глубокие софт-скиллы.\n\n## 📚 Материалы модуля\n1. `resume_template_2027.md` — Шаблон современного резюме с фокусом на влияние на бизнес ($ impact) и AI-компетенции.\n2. `github_portfolio_guide.md` — Инструкция по оформлению GitHub репозиториев для прохождения скрининга.\n3. `interview_questions_and_cases_2027.md` — Банк реальных вопросов с технических собеседований (SQL, статистика, live-coding с AI).\n", "quiz": "", "cheatsheet": "", "notebooks": []}];
    let currentModuleIndex = 0;
    let currentTab = 'notebooks';
    let currentNotebookIndex = 0;

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem('da_2027_progress')) || {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress(id, completed) {
      const p = getProgress();
      p[id] = completed;
      localStorage.setItem('da_2027_progress', JSON.stringify(p));
      updateProgressBar();
    }

    function getGithubRepo() {
      return localStorage.getItem('da_2027_gh_repo') || 'Enlyl/data-analyst-2027';
    }

    function saveGithubRepo(val) {
      localStorage.setItem('da_2027_gh_repo', val.trim());
      updateColabLink();
    }

    function updateProgressBar() {
      const p = getProgress();
      const total = courseData.length;
      let count = 0;
      courseData.forEach(m => {
        if (p[m.id]) count++;
      });
      const pct = Math.round((count / total) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-val').innerText = pct + '% (' + count + '/' + total + ')';
    }

    function renderSidebar(filtered = courseData) {
      const list = document.getElementById('module-list');
      list.innerHTML = '';
      const p = getProgress();

      filtered.forEach((m, idx) => {
        const isDone = !!p[m.id];
        const card = document.createElement('div');
        card.className = `module-card ${idx === currentModuleIndex ? 'active' : ''}`;
        card.onclick = () => selectModule(idx);

        card.innerHTML = `
          <div class="module-card-header">
            <span class="badge">${m.badge}</span>
            <input type="checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleModuleDone('${m.id}', this.checked)">
          </div>
          <div class="module-card-title">${m.title}</div>
          <div class="module-card-footer">
            <span>${m.category}</span>
            <span>${m.notebooks.length} уроков</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleModuleDone(id, isChecked) {
      saveProgress(id, isChecked);
    }

    function selectModule(index) {
      currentModuleIndex = index;
      currentNotebookIndex = 0;
      renderSidebar();
      renderContent();
      updateColabLink();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderContent();
    }

    function updateColabLink() {
      const mod = courseData[currentModuleIndex];
      const colabBtn = document.getElementById('colab-link');
      const ghRepo = getGithubRepo();

      if (mod.notebooks && mod.notebooks.length > 0) {
        const activeNb = mod.notebooks[currentNotebookIndex];
        colabBtn.href = `https://colab.research.google.com/github/${ghRepo}/blob/main/${activeNb.rel_path}`;
        colabBtn.title = `Прямое открытие ${activeNb.filename} в Colab`;
        colabBtn.style.display = 'inline-flex';
      } else {
        colabBtn.href = 'https://colab.research.google.com';
        colabBtn.style.display = 'none';
      }
    }

    function downloadActiveNotebook() {
      const mod = courseData[currentModuleIndex];
      if (!mod.notebooks || !mod.notebooks[currentNotebookIndex]) return;
      const nb = mod.notebooks[currentNotebookIndex];
      
      const blob = new Blob([nb.raw_json], { type: 'application/x-ipynb+json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = nb.filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function renderContent() {
      const body = document.getElementById('content-body');
      const mod = courseData[currentModuleIndex];
      if (!mod) return;

      const csBtn = document.getElementById('cheatsheet-tab-btn');
      csBtn.style.display = mod.cheatsheet ? 'inline-block' : 'none';

      if (currentTab === 'overview') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.readme || 'Обзор отсутствует')}
          </div>
        `;
      } else if (currentTab === 'quiz') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.quiz || 'Тест отсутствует')}
          </div>
        `;
      } else if (currentTab === 'cheatsheet') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.cheatsheet || 'Шпаргалка отсутствует')}
          </div>
        `;
      } else if (currentTab === 'notebooks') {
        renderNotebooksView(mod);
      }

      updateColabLink();
      Prism.highlightAll();
    }

    function renderNotebooksView(mod) {
      const body = document.getElementById('content-body');
      if (!mod.notebooks || mod.notebooks.length === 0) {
        body.innerHTML = '<p style="color:var(--text-muted)">В этом модуле нет ноутбуков .ipynb</p>';
        return;
      }

      let navHtml = '<div style="display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;">';
      mod.notebooks.forEach((nb, i) => {
        navHtml += `
          <button class="tab-btn ${i === currentNotebookIndex ? 'active' : ''}" onclick="currentNotebookIndex=${i}; renderNotebooksView(courseData[currentModuleIndex]); updateColabLink();">
            📓 ${nb.filename.replace('.ipynb', '')}
          </button>
        `;
      });
      navHtml += '</div>';

      const activeNb = mod.notebooks[currentNotebookIndex];
      const ghRepo = getGithubRepo();

      let noticeHtml = `
        <div class="colab-notice">
          <div>
            <strong>🚀 Интерактивный запуск:</strong><br>
            Урок готов к исполнению в облаке через Google Colab. Нажмите кнопку справа для запуска в 1 клик.
          </div>
          <a class="action-btn colab-btn" target="_blank" href="https://colab.research.google.com/github/${ghRepo}/blob/main/${activeNb.rel_path}">
            🚀 Запустить в Colab
          </a>
        </div>
      `;

      let cellsHtml = '';
      activeNb.cells.forEach((c, idx) => {
        if (c.type === 'markdown') {
          cellsHtml += `
            <div class="cell">
              <div class="cell-header">
                <span>Markdown Block #${idx+1}</span>
              </div>
              <div class="cell-markdown markdown-view">
                ${marked.parse(c.content)}
              </div>
            </div>
          `;
        } else if (c.type === 'code') {
          cellsHtml += `
            <div class="cell">
              <div class="cell-header">
                <span>Python Cell #${idx+1}</span>
                <button style="background:transparent; border:none; color:var(--accent); cursor:pointer; font-size:0.75rem;" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Скопировано!'; setTimeout(()=>this.innerText='Копировать код', 1500)">Копировать код</button>
              </div>
              <div class="cell-code">
                <pre><code class="language-python">${escapeHtml(c.content)}</code></pre>
              </div>
            </div>
          `;
        }
      });

      body.innerHTML = `
        <h2>${activeNb.filename}</h2>
        <p style="color:var(--text-muted); margin-bottom:12px;">Путь к файлу: <code>${activeNb.filepath}</code></p>
        ${noticeHtml}
        ${navHtml}
        <div>${cellsHtml}</div>
      `;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = courseData.filter(m => 
        m.title.toLowerCase().includes(q) || 
        m.category.toLowerCase().includes(q) ||
        m.badge.toLowerCase().includes(q)
      );
      renderSidebar(filtered);
    });

    const savedRepo = getGithubRepo();
    if (savedRepo) {
      document.getElementById('github-repo').value = savedRepo;
    }
    renderSidebar();
    renderContent();
    updateProgressBar();
  </script>
</body>
</html>
