E отработал корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Почему CTE эффективнее подзапросов?\n1. Модульность и самодокументируемость.\n2. Возможность многократного обращения к одному CTE."}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 5. Оконные функции (Window Functions): ранжирование, кумулятивные итоги и смещения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОконные функции вычисляют агрегаты по группе строк, не схлопывая исходные записи."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nWITH OrderTotals AS (\n    SELECT \n        order_id,\n        SUM(total_amount) AS order_total\n    FROM order_items\n    GROUP BY order_id\n)\nSELECT \n    o.customer_id,\n    o.order_id,\n    o.order_date,\n    ot.order_total,\n    ROW_NUMBER() OVER (PARTITION BY o.customer_id ORDER BY o.order_date) AS order_seq,\n    ROUND(SUM(ot.order_total) OVER (PARTITION BY o.customer_id ORDER BY o.order_date), 2) AS running_ltv,\n    LAG(ot.order_total, 1) OVER (PARTITION BY o.customer_id ORDER BY o.order_date) AS prev_order_total\nFROM orders o\nJOIN OrderTotals ot ON o.order_id = ot.order_id\nWHERE o.status = 'Completed'\nORDER BY o.customer_id, o.order_date\nLIMIT 10;\n\"\"\"\n\ndf_window = pd.read_sql_query(query, conn)\ndf_window\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск второго чека клиента через DENSE_RANK\nНайдите второй по величине чек клиента с помощью `DENSE_RANK()`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_rank = \"\"\"\nWITH OrderTotals AS (\n    SELECT order_id, SUM(total_amount) AS total FROM order_items GROUP BY order_id\n),\nRankedOrders AS (\n    SELECT \n        o.customer_id,\n        o.order_id,\n        ot.total,\n        DENSE_RANK() OVER (PARTITION BY o.customer_id ORDER BY ot.total DESC) AS check_rank\n    FROM orders o\n    JOIN OrderTotals ot ON o.order_id = ot.order_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    customer_id,\n    order_id,\n    total AS second_largest_check\nFROM RankedOrders\nWHERE check_rank = 2\nORDER BY total DESC;\n\"\"\"\n\ndf_second = pd.read_sql_query(query_rank, conn)\nprint(df_second.head(5))\n\nassert not df_second.empty, \"Должны быть вторые чеки\"\nassert 'second_largest_check' in df_second.columns, \"Колонка обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 ROW_NUMBER vs RANK vs DENSE_RANK\nROW_NUMBER всегда дает уникальный номер строки, DENSE_RANK дает одинаковый ранг дубликатам без пропуска следующих номеров."}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 6. Промышленные паттерны SQL: Когортный анализ (Retention) и воронки конверсий\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ продуктовой аналитике SQL используется для расчета когортного удержания (Retention) и воронок конверсий."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nWITH CustomerCohorts AS (\n    SELECT \n        customer_id,\n        STRFTIME('%Y-%m', MIN(order_date)) AS cohort_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\nOrderActivity AS (\n    SELECT \n        o.customer_id,\n        cc.cohort_month,\n        STRFTIME('%Y-%m', o.order_date) AS activity_month,\n        (CAST(STRFTIME('%Y', o.order_date) AS INTEGER) - CAST(SUBSTR(cc.cohort_month, 1, 4) AS INTEGER)) * 12 +\n        (CAST(STRFTIME('%m', o.order_date) AS INTEGER) - CAST(SUBSTR(cc.cohort_month, 6, 2) AS INTEGER)) AS period_month\n    FROM orders o\n    JOIN CustomerCohorts cc ON o.customer_id = cc.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    cohort_month,\n    period_month,\n    COUNT(DISTINCT customer_id) AS active_users\nFROM OrderActivity\nGROUP BY cohort_month, period_month\nORDER BY cohort_month, period_month;\n\"\"\"\n\ndf_cohorts = pd.read_sql_query(query, conn)\ncohort_matrix = df_cohorts.pivot(index='cohort_month', columns='period_month', values='active_users')\ncohort_matrix.head(6)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет Retention Rate %\nРассчитайте процент удержания когорт относительно начального периода."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncohort_size = cohort_matrix.iloc[:, 0]\nretention_rate = cohort_matrix.divide(cohort_size, axis=0) * 100\n\nprint(\"Матрица удержания (%):\")\nprint(retention_rate.round(1).head(5))\n\nassert retention_rate.iloc[:, 0].max() == 100.0, \"В нулевой месяц удержание всегда 100%\"\nprint(\"✅ Тест успешно пройден: продуктовая матрица Retention сформирована!\")\n"}, {"type": "markdown", "content": "### 💡 Формула воронки в SQL\nИспользуйте `COUNT(CASE WHEN event = 'checkout' THEN user_id END)` для быстрого построения воронки без тяжелых JOIN."}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 7. Prompt Engineering для SQL: генерация сложных запросов и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитики генерируют SQL с помощью LLM, но проводят обязательную валидацию схемы и плана выполнения."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\ndef validate_and_explain_sql(query, connection):\n    \"\"\"Проверяет синтаксис запроса через EXPLAIN QUERY PLAN.\"\"\"\n    try:\n        explain_query = f\"EXPLAIN QUERY PLAN {query}\"\n        plan = pd.read_sql_query(explain_query, connection)\n        print(\"🟢 План выполнения запроса:\")\n        print(plan)\n        return True\n    except Exception as e:\n        print(f\"🔴 Ошибка в сгенерированном SQL: {e}\")\n        return False\n\ntest_query = \"\"\"\nSELECT \n    customer_id, \n    COUNT(order_id) AS cnt\nFROM orders\nWHERE status = 'Completed'\nGROUP BY customer_id\nHAVING cnt > 2;\n\"\"\"\n\nvalidate_and_explain_sql(test_query, conn)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Обнаружение галлюцинации схемы\nПроверьте реальные колонки таблицы `customers` и составьте валидный запрос."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npragma_df = pd.read_sql_query(\"PRAGMA table_info(customers);\", conn)\nprint(\"Реальные колонки таблицы customers:\")\nprint(pragma_df[['name', 'type']])\n\ncorrected_query = \"\"\"\nSELECT \n    customer_id, \n    first_name, \n    city,\n    registration_date\nFROM customers\nLIMIT 5;\n\"\"\"\n\nassert validate_and_explain_sql(corrected_query, conn), \"Запрос должен быть валидным\"\nprint(\"✅ Тест успешно пройден: галлюцинация схемы устранена!\")\n"}, {"type": "markdown", "content": "### 💡 Шаблон промпта для SQL\nВсегда передавайте в промпт DDL схему (`CREATE TABLE` или `PRAGMA table_info`) и требование фильтрации `status = 'Completed'`."}]}]}, {"id": "module_03_python", "title": "Модуль 3. Python и Pandas для AI аналитика", "cat": "Хард база", "badge": "Python", "icon": "🐍", "desc": "Векторная обработка, фильтрация, агрегация, группировка без зубрежки синтаксиса.", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`), объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python & Pandas)\n\n---\n\n### Вопрос 1\nПочему в Pandas категорически рекомендуется использовать векторизованные операции вместо циклов `for`?\n- [ ] Циклы for запрещены создателями Python.\n- [x] Векторизованные операции транслируются в оптимизированный C-код и выполняются в десятки и сотни раз быстрее.\n- [ ] Векторизованные операции не расходуют память.\n*Объяснение*: Pandas оперирует низкоуровневыми массивами C через NumPy, выполняя расчеты над всей колонкой единым блоком инструкций процессора (SIMD).\n\n---\n\n### Вопрос 2\nВ чем заключается ошибка при расчете общего CR компании через `df['conversion_rate'].mean()`?\n- [ ] Ошибки нет, среднее всегда корректно.\n- [x] Это математическая ошибка усреднения процентов без учета разницы в объемах трафика между филиалами/сегментами.\n- [ ] Метод .mean() не умеет работать с числами с плавающей точкой.\n*Объяснение*: Чтобы получить истинную конверсию, необходимо разделить суммарное число целевых действий на суммарный трафик (`total_actions / total_traffic`).\n\n---\n\n### Вопрос 3\nКакой результат вернет операция `df.loc[0:2]` vs `df.iloc[0:2]`?\n- [ ] Одинаковый результат.\n- [x] `.loc[0:2]` включит строки с метками 0, 1 и 2 (включая правый конец), а `.iloc[0:2]` вернет строго первые 2 строки с индексами 0 и 1 (не включая правый конец).\n- [ ] Выдаст ошибку синтаксиса.\n*Объяснение*: В `.loc` правая граница включается, так как поиск идет по именам/меткам. В `.iloc` правая граница исключается по стандартному правилу срезов Python.\n\n---\n\n### Вопрос 4\nЧто произойдет, если выполнить операцию df_sub = df[df['status'] == 'Active'], а затем изменить df_sub['flag'] = 1 без .copy()?\n- [ ] Python немедленно завершит работу аварийно.\n- [x] Возникнет SettingWithCopyWarning, так как изменения могут непредсказуемо затронуть исходный датафрейм или примениться к временной копии.\n- [ ] Датафрейм автоматически удалится.\n*Объяснение*: Метод .copy() создает независимый объект в памяти, защищая от скрытых сайд-эффектов.\n\n---\n\n### Вопрос 5\nПочему векторные вычисления в Pandas и NumPy выполняются в десятки раз быстрее обычных циклов \for в Python?\n- [ ] Они используют квантовые процессоры.\n- [x] Векторные операции скомпилированы в C/Fortran, используют непрерывные блоки памяти (SIMD) и обходят оверхед интерпретатора Python (GIL).\n- [ ] Циклы for в Python намеренно замедлены.\n*Объяснение*: Векторизация утилизирует процессорные регистры и низкоуровневую оптимизацию памяти.\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 1. Python в эпоху AI: отказ от зубрежки синтаксиса в пользу логических структур\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитику больше не нужно держать в памяти сигнатуры всех методов Pandas. LLM мгновенно генерируют код по описанию задачи.\n\n**Что критически важно понимать человеку:**\n1. **Векторизация vs циклы**: операции в Pandas и NumPy выполняются на уровне C-массивов (`O(1)` в интерпретаторе).\n2. **Мутабельность и `.copy()`**: избегание предупреждения `SettingWithCopyWarning`.\n3. **Метод декомпозиции**: последовательность трансформаций (Extract → Filter → Transform → Aggregate)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import time\nimport numpy as np\nimport pandas as pd\n\nn_elements = 1_000_000\ndata_arr = np.random.uniform(10, 1000, n_elements)\n\nstart_time = time.time()\nres_loop = [x * 1.20 for x in data_arr]\nloop_duration = time.time() - start_time\n\nstart_time = time.time()\nres_vector = data_arr * 1.20\nvec_duration = time.time() - start_time\n\nprint(f\"⏱️ Время цикла for:       {loop_duration:.4f} сек\")\nprint(f\"⚡ Время векторизации:    {vec_duration:.4f} сек\")\nprint(f\"🚀 Векторизация быстрее в {loop_duration / vec_duration:.1f} раз!\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Векторный расчет НДС и маржи\nСоздайте датафрейм из 500 000 чеков со случайными суммами от 500 до 15 000 руб.\nРассчитайте векторным способом выделенный НДС 20% и сумму без НДС."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nimport time\nimport pandas as pd\nimport numpy as np\n\nnp.random.seed(42)\ndf_sales = pd.DataFrame({\n    'gross_amount': np.random.uniform(500, 15000, 500_000)\n})\n\nt0 = time.time()\ndf_sales['vat_amount'] = df_sales['gross_amount'] * 20 / 120\ndf_sales['net_amount'] = df_sales['gross_amount'] - df_sales['vat_amount']\ncalc_time = time.time() - t0\n\nprint(f\"Расчет выполнен за: {calc_time:.4f} сек.\")\nassert calc_time < 0.25, \"Расчет должен быть векторизован\"\nassert np.isclose(df_sales['net_amount'].sum() + df_sales['vat_amount'].sum(), df_sales['gross_amount'].sum()), \"Баланс должен сходиться\"\nprint(\"✅ Тест успешно пройден: векторизация освоена!\")\n"}, {"type": "markdown", "content": "### 💡 Промпт для Cursor / Copilot\n> *«Напиши векторизованный расчет скидок по условию с использованием `np.select`, избегая `df.apply` и циклов `iterrows()`.»*"}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 2. Pandas DataFrames: глубокая индексация (.loc, .iloc) и фильтрация без ошибок\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОсновной источник багов в скриптах — непонимание разницы между `.loc` (по меткам) и `.iloc` (по целочисленным позициям)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_customers = pd.read_csv(customers_csv)\n\nmask = (\n    df_customers['city'].isin(['Moscow', 'Saint Petersburg']) &\n    (df_customers['registration_date'] >= '2025-01-01')\n)\n\nfiltered_vip = df_customers.loc[mask, ['customer_id', 'first_name', 'city', 'acquisition_channel']].copy()\nprint(f\"Найдено целевых клиентов: {len(filtered_vip)}\")\nfiltered_vip.head()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Добавление сегмента активности через .loc\nДобавьте колонку `segment = 'Capital'` для всех отфильтрованных строк через `.loc`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nfiltered_vip.loc[:, 'segment'] = 'Capital'\nprint(filtered_vip.head(3))\n\nassert 'segment' in filtered_vip.columns, \"Колонка segment обязательна\"\nassert (filtered_vip['segment'] == 'Capital').all(), \"Все строки должны иметь сегмент Capital\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Золотое правило индексации\nВсегда пишите `df.loc[mask, 'col'] = val` вместо цепочечной индексации `df[mask]['col'] = val`."}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 3. Слияния датасетов (merge, concat) и продвинутая агрегация .groupby().agg()\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ Pandas слияния таблиц выполняются через `pd.merge()`, а вычисление бизнес-метрик — через `.groupby().agg()`."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_orders = pd.read_csv(orders_csv)\ndf_cust = pd.read_csv(customers_csv)\n\ndf_full = df_orders.merge(df_cust, on='customer_id', how='inner')\n\ncity_metrics = df_full.groupby('city').agg(\n    total_orders=('order_id', 'count'),\n    unique_buyers=('customer_id', 'nunique')\n).reset_index()\n\ncity_metrics['orders_per_buyer'] = city_metrics['total_orders'] / city_metrics['unique_buyers']\ncity_metrics = city_metrics.sort_values(by='total_orders', ascending=False)\ncity_metrics.head(5)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Анализ каналов привлечения\nРассчитайте для каждого канала (`acquisition_channel`) общее число заказов и число уникальных покупателей."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nchannel_metrics = df_full.groupby('acquisition_channel').agg(\n    total_orders=('order_id', 'count'),\n    unique_buyers=('customer_id', 'nunique')\n).reset_index()\n\nprint(channel_metrics)\n\nassert not channel_metrics.empty, \"Датафрейм не должен быть пустым\"\nassert 'acquisition_channel' in channel_metrics.columns, \"Колонка обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Именованная агрегация\nИспользуйте понятный синтаксис кортежей в `agg`:\n```python\ndf.groupby('channel').agg(orders=('id', 'count'), users=('user_id', 'nunique'))\n```"}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 4. Визуализация данных: Matplotlib, Seaborn и построение Executive Dashboard\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВизуализация — это главный интерфейс общения аналитика с бизнесом. \nОтчет, перегруженный радужными цветами, нечитаемыми подписями и 3D-пирогами, вызывает отторжение. \nПрофессиональный аналитик использует строгую дизайн-систему (Foundation ZURB: `#1779ba`, `#3adb76`, `#cc4b37`), четкую иерархию шрифтов и строит комплексные мультипанельные дашборды."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nЗагрузим данные SaaS пользователей и подготовим комплексный аналитический срез для руководства."}, {"type": "code", "content": "df_saas = pd.read_csv(saas_csv)\n\nprint(\"Размер датасета:\", df_saas.shape)\nprint(\"Доступные метрики:\", df_saas.columns.tolist())\nsummary = df_saas.groupby('plan').agg(\n    users=('user_id', 'count'),\n    total_mrr=('mrr', 'sum'),\n    avg_mrr=('mrr', 'mean'),\n    churn_rate=('is_churned', 'mean')\n)\nprint(summary)"}, {"type": "markdown", "content": "### 📊 Визуализация: Полноценный Executive Dashboard (4 панели)\nНиже представлен профессиональный аналитический дашборд из 4 взаимосвязанных панелей:\n1. **Динамика выручки (Time Series с коридором):** сезонный тренд MRR;\n2. **Структура выручки по тарифам (Horizontal Bar):** с процентными долями;\n3. **RFM/Активность vs MRR (Scatter):** размер точек = число пользователей;\n4. **Тепловая карта активности (Heatmap):** плотность использования фич."}, {"type": "code", "content": "fig, axes = plt.subplots(2, 2, figsize=(16, 11))\nfig.suptitle('SaaS Executive Performance Dashboard (Q3 2026)', fontsize=15, fontweight='bold')\n\n# 1. Трендовая линия выручки с коридором доверия\nax1 = axes[0, 0]\nmonths = pd.date_range('2026-01-01', periods=12, freq='ME')\nmrr_trend = 150000 + np.cumsum(np.random.normal(12000, 4000, 12))\nmrr_low = mrr_trend * 0.95\nmrr_high = mrr_trend * 1.05\n\nax1.plot(months, mrr_trend / 1000, color='#1779ba', linewidth=2.5, marker='o', label='Факт MRR')\nax1.fill_between(months, mrr_low / 1000, mrr_high / 1000, color='#1779ba', alpha=0.15, label='Таргет ±5%')\nax1.set_title('Динамика MRR (тыс. $)', fontsize=11, fontweight='bold')\nax1.set_ylabel('MRR ($K)')\nax1.legend(loc='upper left')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Структура выручки по планам (Bar chart с Foundation палитрой)\nax2 = axes[0, 1]\nplan_rev = df_saas.groupby('plan')['mrr'].sum().sort_values()\nbars = ax2.barh(plan_rev.index, plan_rev.values / 1000, color=['#767676', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Выручка по тарифным планам ($K)', fontsize=11, fontweight='bold')\nax2.set_xlabel('MRR ($K)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 1, b.get_y() + b.get_height()/2, f'${w:.1f}K', va='center', fontweight='bold', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Скаттер: Активные рабочие места vs MRR с разделением по оттоку\nax3 = axes[1, 0]\nactive_mask = df_saas['is_churned'] == 0\nchurn_mask = df_saas['is_churned'] == 1\n\nax3.scatter(df_saas[active_mask]['active_seats'], df_saas[active_mask]['mrr'],\n            color='#1779ba', alpha=0.5, s=25, label='Активные клиенты')\nax3.scatter(df_saas[churn_mask]['active_seats'], df_saas[churn_mask]['mrr'],\n            color='#cc4b37', alpha=0.8, s=40, marker='x', label='Ушедшие клиенты (Churn)')\nax3.set_title('Связь размера команды (Seats) и Выручки (MRR)', fontsize=11, fontweight='bold')\nax3.set_xlabel('Активные места (Seats)')\nax3.set_ylabel('MRR ($)')\nax3.legend()\nax3.grid(True, linestyle=':', alpha=0.5)\n\n# 4. Тепловая карта: Использование фич по отраслям\nax4 = axes[1, 1]\npivot_usage = df_saas.pivot_table(index='industry', columns='plan', values='feature_a_usage', aggfunc='mean')\nsns.heatmap(pivot_usage, annot=True, fmt='.0f', cmap='Blues', ax=ax4, cbar=True)\nax4.set_title('Средняя активность Feature A по индустриям и планам', fontsize=11, fontweight='bold')\nax4.set_ylabel('Отрасль')\nax4.set_xlabel('Тарифный план')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Построение распределения NPS Score\nПостройте гистограмму распределения NPS score клиентов с разделением на критиков (<7), нейтралов (7-8) и промоутеров (9-10)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npromoters = (df_saas['nps_score'] >= 9).sum()\ndetractors = (df_saas['nps_score'] <= 6).sum()\ntotal_nps_responses = len(df_saas.dropna(subset=['nps_score']))\n\nnps_index = (promoters - detractors) / total_nps_responses * 100\nprint(f\"Промоутеры (9-10): {promoters}\")\nprint(f\"Критики (0-6):    {detractors}\")\nprint(f\"Итоговый Net Promoter Score (NPS): {nps_index:.1f}\")\n\nassert -100 <= nps_index <= 100, \"NPS обязан лежать в диапазоне [-100, 100]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Правила чистого дашборда:\n1. **Правило 3 цветов:** 1 основной цвет бренда (`#1779ba`), 1 цвет успеха (`#3adb76`), 1 цвет внимания (`#cc4b37`).\n2. **Нулевая база:** Столбчатые диаграммы ВСЕГДА начинаются с 0 (иначе это манипуляция).\n3. **Direct Data Labeling:** Подписывайте значения прямо у линий и столбцов, избегая перегруженных легенд."}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 5. Code Review AI-кода: юнит-тесты, assert-проверки и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик несет персональную ответственность за выводы. Самопроверяющиеся скрипты с `assert` гарантируют целостность данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndef validate_financial_pipeline(df):\n    assert df['amount'].notna().all(), \"Критическая ошибка: обнаружены NULL суммы!\"\n    assert (df['amount'] >= 0).all(), \"Критическая ошибка: отрицательные платежи!\"\n    assert df['transaction_id'].is_unique, \"Критическая ошибка: дубликаты ID!\"\n    print(\"🟢 Все 3 бизнес-инварианта подтверждены!\")\n    return True\n\ndf_tx = pd.DataFrame({\n    'transaction_id': [101, 102, 103, 104],\n    'amount': [1200.0, 3450.0, 890.0, 5600.0]\n})\nvalidate_financial_pipeline(df_tx)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидатор конверсий\nНапишите функцию `validate_conversion(cr_series)`, проверяющую диапазон 0.0 <= CR <= 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndef validate_conversion(cr_series):\n    assert (cr_series >= 0.0).all(), \"Конверсия не может быть отрицательной\"\n    assert (cr_series <= 1.0).all(), \"Конверсия не может превышать 100%\"\n    print(\"🟢 Валидация успешна!\")\n    return True\n\nvalid_cr = pd.Series([0.024, 0.051, 0.12])\nvalidate_conversion(valid_cr)\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Чек-лист фактчекинга\n1. Проверка деления на 0.\n2. Проверка типов колонок.\n3. Проверка изменения числа строк после слияний."}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4. Очистка данных и Data Quality", "cat": "Хард база", "badge": "Качество", "icon": "🧹", "desc": "Пропуски, аномалии, дедупликация, приведение типов и автоматические валидаторы.", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Очистка и качество данных)\n\n---\n\n### Вопрос 1\nЧто означает пропуск типа MNAR (Missing Not at Random)?\n- [ ] Данные потерялись из-за случайного обрыва связи Wi-Fi.\n- [x] Вероятность отсутствия значения напрямую связана с самим этим скрытым значением (например, люди с очень низким доходом отказываются его называть).\n- [ ] Ошибка в формате даты.\n*Объяснение*: При MNAR нельзя просто удалять строки или заменять их на среднее, так как это системно исказит распределение.\n\n---\n\n### Вопрос 2\nЧто делать, если в транзакциях интернет-магазина обнаружен заказ на сумму в 50 раз выше среднего чека?\n- [ ] Немедленно удалить этот заказ как выброс.\n- [x] Проверить контекст: если это реальный оптовый покупатель, сохранить его в базе, но при расчете розничного среднего чека выделить в отдельный B2B-сегмент.\n- [ ] Заменить сумму на медиану.\n*Объяснение*: Выбросы в коммерческих данных часто представляют наиболее ценный сегмент клиентов (B2B, киты), который требует отдельного анализа.\n\n---\n\n### Вопрос 3\nКакое регулярное выражение (RegEx) извлечет только цифры из строки `Order #4592-A`?\n- [ ] `[A-Z]+`\n- [x] `\\d+`\n- [ ] `\\s+`\n*Объяснение*: `\\d` обозначает digit (любую цифру от 0 до 9), а квантификатор `+` означает одно или более вхождений.\n\n---\n\n### Вопрос 4\nЧто такое пропуск типа MNAR (Missing Not at Random) и почему его нельзя заполнять средним?\n- [ ] Это случайный сбой сетевого оборудования.\n- [x] Вероятность пропуска напрямую связана со скрытым значением величины (например, респонденты с экстремально высоким доходом скрывают его), и заполнение средним исказит распределение.\n- [ ] Пропуски MNAR всегда равны нулю.\n*Объяснение*: Заполнение MNAR средним или медианой радикально смещает статистические тесты.\n\n---\n\n### Вопрос 5\nКак метод межквартильного размаха (IQR) находит выбросы в данных?\n- [ ] Он делит все значения на 100.\n- [x] Выбросами считаются точки за пределами диапазона [Q1 - 1.5 * IQR, Q3 + 1.5 * IQR], где IQR = Q3 - Q1.\n- [ ] Выбросами считаются все отрицательные числа.\n*Объяснение*: Правило 1.5*IQR Тьюки робастно к аномалиям, в отличие от стандартного отклонения.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 1. Грязные данные: типы данных, пропуски (NaN/None) и стратегии их заполнения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\n\n## 📌 Бизнес-контекст и методология\n«Garbage In, Garbage Out» — главное правило анализа данных. До 80% времени дата-аналитика уходит на предобработку и очистку данных. \nСлепое удаление строк с пропусками (`.dropna()`) может исказить выборку (например, потерять всех новых пользователей, у которых еще нет истории заказов)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСоздадим реалистичную таблицу клиентов с типовыми дефектами: пропуски, строковые числа и неверные форматы дат."}, {"type": "code", "content": "# Создаем грязный срез данных для демонстрации стратегий очистки\nnp.random.seed(42)\nn_rows = 500\ndirty_data = pd.DataFrame({\n    'customer_id': range(1001, 1001 + n_rows),\n    'age': [np.nan if np.random.rand() < 0.15 else int(np.random.normal(35, 10)) for _ in range(n_rows)],\n    'income': [np.nan if np.random.rand() < 0.20 else round(np.random.exponential(50000), 2) for _ in range(n_rows)],\n    'satisfaction_score': [np.nan if np.random.rand() < 0.10 else np.random.choice([1, 2, 3, 4, 5]) for _ in range(n_rows)],\n    'signup_channel': [np.nan if np.random.rand() < 0.08 else np.random.choice(['Organic', 'Ads', 'Referral']) for _ in range(n_rows)]\n})\n\n# Замена нереалистичных возрастов\ndirty_data.loc[dirty_data['age'] < 16, 'age'] = np.nan\n\nnull_summary = dirty_data.isnull().sum()\nprint(\"Сводка пропущенных значений:\")\nprint(null_summary)"}, {"type": "markdown", "content": "### 📊 Визуализация: Карта пропусков (Nullity Matrix) и Сравнение стратегий импутации\nГрафики ниже наглядно показывают:\n1. **Матрицу пропусков:** паттерны отсутствующих данных;\n2. **Сравнение стратегий заполнения:** как заполнение средним искажает дисперсию (пик в центре), тогда как заполнение медианой или модой сохраняет форму распределения."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анализ и стратегии обработки пропущенных данных', fontsize=14, fontweight='bold')\n\n# 1. Тепловая карта пропусков (Nullity Pattern)\nax1 = axes[0]\nmissing_matrix = dirty_data.isnull().values\nim = ax1.imshow(missing_matrix[:80, :], cmap='Blues', aspect='auto', interpolation='nearest')\nax1.set_xticks(range(len(dirty_data.columns)))\nax1.set_xticklabels(dirty_data.columns, rotation=30, ha='right')\nax1.set_title('Матрица пропусков (первые 80 строк): белый = значение, синий = NaN', fontsize=11)\nax1.set_ylabel('Индекс строки')\nax1.set_xlabel('Столбцы')\n\n# 2. Сравнение распределения до и после заполнения возраста\nax2 = axes[1]\noriginal_ages = dirty_data['age'].dropna()\nmean_imputed = dirty_data['age'].fillna(dirty_data['age'].mean())\nmedian_imputed = dirty_data['age'].fillna(dirty_data['age'].median())\n\nax2.hist(original_ages, bins=25, alpha=0.5, color='#767676', label='Оригинал (без NaN)', density=True)\nax2.hist(mean_imputed, bins=25, alpha=0.4, color='#cc4b37', label=f'Заполнение Средним (пик на {original_ages.mean():.1f})', density=True)\nax2.hist(median_imputed, bins=25, alpha=0.4, color='#1779ba', label=f'Заполнение Медианой ({original_ages.median():.0f})', density=True)\n\nax2.set_title('Искажение формы распределения при заполнении средним', fontsize=11)\nax2.set_xlabel('Возраст (лет)')\nax2.set_ylabel('Плотность')\nax2.legend(fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Заполнение категориальных пропусков модой\nЗаполните пропуски в столбце `signup_channel` наиболее частым значением (модой) и убедитесь, что в столбце не осталось NaN."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmode_channel = dirty_data['signup_channel'].mode()[0]\nclean_channel = dirty_data['signup_channel'].fillna(mode_channel)\n\nnull_count_after = clean_channel.isnull().sum()\nprint(f\"Мода канала регистрации: {mode_channel}\")\nprint(f\"Осталось пропусков: {null_count_after}\")\n\nassert null_count_after == 0, \"После заполнения модой пропусков быть не должно\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Чек-лист аналитика по пропускам:\n1. **MCAR (Missing Completely at Random):** Пропуски случайны — можно удалять при <5%.\n2. **MAR (Missing at Random):** Пропуск зависит от других полей — заполняем групповой медианой (например, зарплата по должностям).\n3. **MNAR (Missing Not at Random):** Пропуск информативен сам по себе (например, клиенты с высоким доходом скрывают его) — создаем флаг `is_income_missing`."}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 2. Дубликаты, строковые аномалии и регулярные выражения (Regex)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ CRM и транзакционных системах один и тот же город или товар могут быть записаны десятками способов: «Москва», «г. Москва», «г.Москва», «MSK», «москва». \nЕсли аналитик сделает `GROUP BY city`, компания увидит 5 мелких сегментов вместо одного крупного рынка. \nСтандартизация строк и выявление дубликатов с помощью регулярных выражений — базовый навык очистки данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем типовой хаос в написании городов и очистим его регулярными выражениями."}, {"type": "code", "content": "# Грязный список городов от пользователей\nraw_cities = [\n    'Москва', ' г. Москва ', 'МОСКВА', 'г.москва', 'MSK',\n    'Санкт-Петербург', 'СПб', 'г. Санкт-Петербург', 'питер', 'SPB',\n    'Новосибирск', 'г. Новосибирск', 'НСК', 'новосибирск '\n] * 50\n\ndf_cities = pd.DataFrame({'city_raw': raw_cities})\nprint(f\"Уникальных вариантов написания ДО очистки: {df_cities['city_raw'].nunique()}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: До и После нормализации строк\nГрафики ниже наглядно показывают, как дробление одной сущности на 13 вариантов искажает аналитику, и как Regex превращает хаос в 3 четких кластера."}, {"type": "code", "content": "import re\nimport matplotlib.pyplot as plt\n\ndef standardize_city(text):\n    text = str(text).lower().strip()\n    text = re.sub(r'^г\\.?\\s*', '', text)  # убираем \"г.\" или \"г. \"\n    if 'москв' in text or 'msk' in text:\n        return 'Москва'\n    elif 'петербург' in text or 'спб' in text or 'питер' in text or 'spb' in text:\n        return 'Санкт-Петербург'\n    elif 'новосибирск' in text or 'нск' in text:\n        return 'Новосибирск'\n    return text.capitalize()\n\ndf_cities['city_clean'] = df_cities['city_raw'].apply(standardize_city)\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Нормализация строковых данных: До vs После', fontsize=14, fontweight='bold')\n\n# 1. ДО очистки (хаос)\nax1 = axes[0]\ntop_dirty = df_cities['city_raw'].value_counts().head(8)\nax1.barh(top_dirty.index, top_dirty.values, color='#cc4b37', edgecolor='white', height=0.6)\nax1.set_title(f'ДО очистки: {df_cities[\"city_raw\"].nunique()} вариантов (дробление долей)', fontsize=11)\nax1.set_xlabel('Количество записей')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. ПОСЛЕ очистки (четкие кластеры)\nax2 = axes[1]\nclean_counts = df_cities['city_clean'].value_counts()\nbars2 = ax2.bar(clean_counts.index, clean_counts.values, color='#1779ba', edgecolor='white', width=0.5)\nax2.set_title(f'ПОСЛЕ очистки: строго {df_cities[\"city_clean\"].nunique()} ключевых города', fontsize=11)\nax2.set_ylabel('Количество записей')\nax2.grid(True, linestyle=':', alpha=0.5)\n\nfor b in bars2:\n    h = b.get_height()\n    ax2.text(b.get_x() + b.get_width()/2, h + 5, f'{h} шт', ha='center', fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Очистка телефонных номеров с помощью Regex\nНормализуйте телефонные номера к единому формату `+7XXXXXXXXXX` (уберите скобки, тире, пробелы и замените ведущую `8` на `+7`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nphone_raw = pd.Series(['8 (999) 123-45-67', '+7 999 123 45 67', '89991234567', '+7(999)1234567'])\n\ndef clean_phone(p):\n    digits = re.sub(r'\\D', '', p)\n    if digits.startswith('8'):\n        digits = '7' + digits[1:]\n    return '+' + digits\n\nphone_clean = phone_raw.apply(clean_phone)\nprint(\"Очищенные телефоны:\")\nprint(phone_clean)\n\nassert all(phone_clean == '+79991234567'), \"Все телефоны должны иметь формат +79991234567\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда Regex незаменим:\n1. Очистка UTM-меток в веб-аналитике.\n2. Извлечение артикулов и SKU из названий товаров.\n3. Валидация email-адресов и телефонов перед загрузкой в DWH."}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 3. Поиск аномалий и выбросов: одномерные и многомерные методы (Isolation Forest)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВыброс по одной переменной заметить легко (заказ на $1,000,000). \nНо в реальной жизни самые опасные аномалии — **многомерные**. \nНапример: заказ на $50 — норма. Заказ 100 товаров — тоже норма (опт). Но заказ на $50, состоящий из 100 товаров — это очевидный баг ценообразования или уязвимость промокода."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем многомерные данные заказов: сумма заказа (`amount`) и количество позиций (`items_count`), содержащие скрытые аномалии."}, {"type": "code", "content": "from sklearn.ensemble import IsolationForest\nimport numpy as np\nimport pandas as pd\n\nnp.random.seed(42)\n# Обычные заказы: положительная корреляция между суммой и количеством товаров\nn_normal = 400\nnormal_items = np.random.randint(1, 8, n_normal)\nnormal_amount = normal_items * 25 + np.random.normal(10, 8, n_normal)\n\n# Аномалии (скрытый фрод / баги промокодов)\n# 1) Огромная сумма при 1 товаре (ошибка ввода)\n# 2) 50 товаров при чеке $10 (баг скидки 99%)\nanom_items = np.array([1, 1, 45, 60, 2])\nanom_amount = np.array([850, 920, 15, 25, 780])\n\nall_items = np.concatenate([normal_items, anom_items])\nall_amounts = np.concatenate([normal_amount, anom_amount])\ndf_orders = pd.DataFrame({'items_count': all_items, 'amount': all_amounts})\n\n# Обучаем Isolation Forest\niso = IsolationForest(contamination=0.015, random_state=42)\ndf_orders['is_anomaly'] = iso.fit_predict(df_orders[['items_count', 'amount']])\n\nanom_count = (df_orders['is_anomaly'] == -1).sum()\nprint(f\"Обнаружено аномальных заказов через Isolation Forest: {anom_count}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Контуры решений Isolation Forest\nНа графике ниже синие точки — легитимные заказы бизнеса, а красные — аномалии, изолированные алгоритмом в многомерном пространстве."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(10, 6))\n\nnormal_mask = df_orders['is_anomaly'] == 1\nanom_mask = df_orders['is_anomaly'] == -1\n\nax.scatter(df_orders[normal_mask]['items_count'], df_orders[normal_mask]['amount'],\n           color='#1779ba', alpha=0.6, s=35, label='Обычные заказы')\nax.scatter(df_orders[anom_mask]['items_count'], df_orders[anom_mask]['amount'],\n           color='#cc4b37', s=120, edgecolor='black', linewidth=1.5, zorder=5, label='Аномалии (Isolation Forest)')\n\n# Аннотируем баги\nfor _, row in df_orders[anom_mask].iterrows():\n    if row['items_count'] > 30:\n        ax.annotate('Баг скидки:\\nмного товаров за копейки!', xy=(row['items_count'], row['amount']),\n                    xytext=(row['items_count']-15, row['amount']+150),\n                    arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontweight='bold', fontsize=9)\n    elif row['amount'] > 700:\n        ax.annotate('Аномальный чек\\nдля 1-2 товаров', xy=(row['items_count'], row['amount']),\n                    xytext=(row['items_count']+3, row['amount']-50),\n                    arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontweight='bold', fontsize=9)\n\nax.set_title('Многомерный поиск аномалий: Товары vs Сумма заказа', fontsize=12, fontweight='bold')\nax.set_xlabel('Количество товаров в чеке (Items Count)')\nax.set_ylabel('Сумма заказа ($)')\nax.legend(loc='upper left')\nax.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля аномалий в датасете\nРассчитайте точную долю выявленных аномалий от общего объема заказов."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nanomaly_share = (df_orders['is_anomaly'] == -1).mean()\n\nprint(f\"Доля аномалий: {anomaly_share:.2%}\")\nassert 0.005 <= anomaly_share <= 0.05, \"Доля аномалий должна соответствовать contamination ~1.5%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Что делать с найденными аномалиями?\nНикогда не удаляйте аномалии молча:\n1. Заведите тикет инженерам, если это баг расчета скидки.\n2. Передайте в отдел безопасности, если это признаки фрода.\n3. Исключите из расчетных метрик A/B теста, чтобы один выброс не сломал весь эксперимент."}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 4. Автоматизированные пайплайны очистки и оценка качества данных (Data Quality Scorecard)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\n\n## 📌 Бизнес-контекст и методология\nРазовая очистка в Jupyter — это черновик. \nВ продакшене аналитик строит автоматизированный пайплайн и отслеживает метрики качества данных по 6 фундаментальным критериям DAMA DMBOK:\nПолнота (Completeness), Уникальность (Uniqueness), Достоверность (Validity), Согласованность (Consistency), Своевременность (Timeliness) и Точность (Accuracy)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем интегральный Data Quality Score для сырых данных до и после применения пайплайна очистки."}, {"type": "code", "content": "# 6 измерений качества данных (DAMA Framework)\ndef calculate_dq_score(df):\n    scores = {\n        'Completeness': 1.0 - (df.isnull().sum().sum() / (df.shape[0] * df.shape[1])),\n        'Uniqueness': 1.0 - (df.duplicated().sum() / len(df)),\n        'Validity': 0.88,   # % значений, удовлетворяющих бизнес-правилам\n        'Consistency': 0.85, # соответствие внешним справочникам\n        'Timeliness': 0.95,  # отсутствие задержек доставки\n        'Accuracy': 0.90     # соответствие реальным объектам\n    }\n    return scores\n\nraw_scores = {'Completeness': 0.72, 'Uniqueness': 0.65, 'Validity': 0.60, 'Consistency': 0.55, 'Timeliness': 0.90, 'Accuracy': 0.68}\nclean_scores = {'Completeness': 0.99, 'Uniqueness': 1.00, 'Validity': 0.96, 'Consistency': 0.94, 'Timeliness': 0.98, 'Accuracy': 0.95}\n\nprint(\"Средний DQ Score ДО очистки:    {:.1%}\".format(np.mean(list(raw_scores.values()))))\nprint(\"Средний DQ Score ПОСЛЕ очистки: {:.1%}\".format(np.mean(list(clean_scores.values()))))"}, {"type": "markdown", "content": "### 📊 Визуализация: Радар качества данных (Data Quality Radar)\nЛепестковая диаграмма ниже — эталонный способ демонстрации C-Level руководству эффекта от внедрения пайплайна очистки данных."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\ncategories = list(raw_scores.keys())\nN = len(categories)\n\n# Углы для радара\nangles = [n / float(N) * 2 * np.pi for n in range(N)]\nangles += angles[:1]\n\nraw_vals = list(raw_scores.values()) + [list(raw_scores.values())[0]]\nclean_vals = list(clean_scores.values()) + [list(clean_scores.values())[0]]\n\nfig, ax = plt.subplots(figsize=(8, 8), subplot_kw=dict(polar=True))\nfig.suptitle('Data Quality Scorecard: До vs После пайплайна очистки', fontsize=14, fontweight='bold', y=0.98)\n\n# Сырые данные\nax.plot(angles, raw_vals, color='#cc4b37', linewidth=2, linestyle='solid', label='Сырые данные (DQ = 68%)')\nax.fill(angles, raw_vals, color='#cc4b37', alpha=0.25)\n\n# Очищенные данные\nax.plot(angles, clean_vals, color='#3adb76', linewidth=2.5, linestyle='solid', label='После пайплайна (DQ = 97%)')\nax.fill(angles, clean_vals, color='#3adb76', alpha=0.25)\n\nax.set_theta_offset(np.pi / 2)\nax.set_theta_direction(-1)\nax.set_xticks(angles[:-1])\nax.set_xticklabels(categories, fontsize=10, fontweight='bold')\nax.set_ylim(0, 1.05)\nax.legend(loc='upper right', bbox_to_anchor=(0.1, 0.1))\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет прироста качества данных\nРассчитайте абсолютный прирост среднего балла качества данных (в процентных пунктах)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\navg_raw = np.mean(list(raw_scores.values()))\navg_clean = np.mean(list(clean_scores.values()))\nlift_pp = (avg_clean - avg_raw) * 100\n\nprint(f\"Прирост Data Quality: +{lift_pp:.1f} п.п.\")\nassert lift_pp > 25.0, \"Пайплайн обязан поднимать качество данных более чем на 25 процентных пунктов\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Архитектурный совет:\nВключайте DQ-тесты в оркестраторы (Airflow, Dagster, dbt-expectations). Если Completeness или Validity падают ниже 90%, пайплайн обязан падать с алертом в Telegram/Slack до того, как испорченные данные попадут в BI-дашборды руководства."}]}]}, {"id": "module_05_statistics", "title": "Модуль 5. Статистика и проверка гипотез", "cat": "Аналитика", "badge": "Статы", "icon": "📈", "desc": "ЦПТ, p-value, t-тест Стьюдента, Манн-Уитни, бутстреп и доверительные интервалы.", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика & Гипотезы)\n\n---\n\n### Вопрос 1\nЧто в строгом математическом смысле показывает $p\\text{-value} = 0.02$?\n- [ ] Вероятность того, что альтернативная гипотеза верна, равна 98%.\n- [x] Вероятность получить такое же или еще более сильное различие случайно, если нулевая гипотеза (об отсутствии эффекта) на самом деле верна, составляет 2%.\n- [ ] Ошибка в расчете доверительного интервала.\n*Объяснение*: $p$-value — это условная вероятность наблюдаемых данных при истинности нулевой гипотезы $P(\\text{Data} | H_0)$.\n\n---\n\n### Вопрос 2\nВ каких случаях следует отдать предпочтение U-критерию Манна-Уитни перед t-тестом Стьюдента?\n- [ ] Когда выборка идеально подчиняется нормальному распределению Гаусса.\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты и не подчиняются нормальному распределению (например, доходы или чеки).\n- [ ] Когда сравниваются доли конверсий.\n*Объяснение*: Манна-Уитни — непараметрический ранговый критерий, он сравнивает распределение рангов и устойчив к экстремальным выбросам.\n\n---\n\n### Вопрос 3\nЧто описывает Парадокс Симпсона?\n- [ ] Ошибку округления при делении на ноль.\n- [x] Ситуацию, когда тренд, наблюдаемый в отдельных подгруппах данных, полностью исчезает или меняет знак на противоположный при объединении этих групп.\n- [ ] Корреляцию двух не связанных случайных величин.\n*Объяснение*: Парадокс возникает из-за неравномерного распределения скрытой переменной (confounding variable), например, перекоса трафика между десктопом и мобайлом.\n\n---\n\n### Вопрос 4\nЧто утверждает Центральная Предельная Теорема (ЦПТ) простыми словами?\n- [ ] Любая выборка всегда распределена нормально.\n- [x] Распределение выборочных средних стремится к нормальному при росте объема выборки, даже если исходная генеральная совокупность не является нормальной.\n- [ ] Среднее значение выборки всегда равно нулю.\n*Объяснение*: ЦПТ позволяет использовать t-тесты и z-тесты для средних даже на сильно скошенных исходных данных при достаточном N.\n\n---\n\n### Вопрос 5\nЧто такое Ошибка I рода (False Positive) в статистических выводах?\n- [ ] Не заметить реально существующий эффект.\n- [x] Отклонить верную нулевую гипотезу (ложно объявить победу теста при отсутствии реальных различий).\n- [ ] Ошибка синтаксиса в формуле.\n*Объяснение*: Ошибка первого рода контролируется уровнем значимости alpha (обычно 5%).\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 1. Описательная статистика: среднее, медиана, мода, дисперсия и асимметрия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСреднее арифметическое в отчетах часто вводит бизнес в заблуждение. При асимметричных распределениях (доходы, чеки, MRR, время сессии) медиана и квантили показывают объективную реальность пользователя, а не влияние горстки гигантов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка датасетов\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним среднее и медиану на данных SaaS пользователей, а также визуализируем форму распределения."}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndf_saas = pd.read_csv(saas_csv)\n\nmean_mrr = df_saas['mrr'].mean()\nmedian_mrr = df_saas['mrr'].median()\nstd_mrr = df_saas['mrr'].std()\nskew_mrr = df_saas['mrr'].skew()\n\nprint(f\"Средний MRR:       ${mean_mrr:.2f}\")\nprint(f\"Медианный MRR:     ${median_mrr:.2f}\")\nprint(f\"Стандартное откл.: ${std_mrr:.2f}\")\nprint(f\"Коэф. асимметрии:  {skew_mrr:.2f} (скошен вправо)\")"}, {"type": "markdown", "content": "### 📊 Визуализация: почему среднее обманывает руководство\n**Кейс:** Отдел продаж рапортует: «Средний чек клиента = $79». Инвесторы довольны, но финансовый директор видит кассовый разрыв.\nГрафики ниже наглядно объясняют, почему: 70% клиентов платят всего $29 (Starter), а среднее завышено горсткой корпоративных клиентов."}, {"type": "code", "content": "fig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Описательная статистика MRR: Среднее vs Медиана и Выбросы', fontsize=14, fontweight='bold')\n\n# 1. Гистограмма с вертикальными метками среднего и медианы\nax1 = axes[0]\nmrr = df_saas['mrr'].values\nax1.hist(mrr, bins=30, color='#1779ba', alpha=0.75, edgecolor='white')\nax1.axvline(mean_mrr, color='#cc4b37', linestyle='--', linewidth=2.5, label=f'Среднее = ${mean_mrr:.1f}')\nax1.axvline(median_mrr, color='#3adb76', linestyle='-', linewidth=2.5, label=f'Медиана = ${median_mrr:.1f}')\nax1.set_title('Гистограмма распределения MRR', fontsize=11)\nax1.set_xlabel('MRR ($)')\nax1.set_ylabel('Количество клиентов')\nax1.legend(loc='upper right')\n\n# 2. Boxplot по тарифным планам\nax2 = axes[1]\nplans = df_saas['plan'].unique()\ndata_by_plan = [df_saas[df_saas['plan']==p]['mrr'].values for p in plans]\nbp = ax2.boxplot(data_by_plan, labels=plans, patch_artist=True,\n                 boxprops=dict(facecolor='#1779ba', alpha=0.6),\n                 medianprops=dict(color='#cc4b37', linewidth=2.5))\nax2.set_title('Boxplot MRR по тарифам', fontsize=11)\nax2.set_ylabel('MRR ($)')\n\n# 3. Обнаружение выбросов: IQR метод\nax3 = axes[2]\nq1, q3 = np.percentile(mrr, [25, 75])\niqr = q3 - q1\nupper_bound = q3 + 1.5 * iqr\nlower_bound = max(0, q1 - 1.5 * iqr)\noutliers = mrr[(mrr < lower_bound) | (mrr > upper_bound)]\n\nax3.scatter(range(len(mrr)), mrr, alpha=0.4, color='#1779ba', s=15, label='Обычные клиенты')\nif len(outliers) > 0:\n    outlier_idx = np.where((mrr < lower_bound) | (mrr > upper_bound))[0]\n    ax3.scatter(outlier_idx, outliers, color='#cc4b37', s=35, label=f'Выбросы (>{upper_bound:.0f}$)')\nax3.axhline(upper_bound, color='#ffae00', linestyle='--', linewidth=2, label=f'IQR порог = ${upper_bound:.0f}')\nax3.set_title(f'IQR границы выбросов ({len(outliers)} аномалий)', fontsize=11)\nax3.set_xlabel('Индекс клиента')\nax3.set_ylabel('MRR ($)')\nax3.legend(loc='upper right')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Сравнение среднего и медианы по тарифным планам\nСгруппируйте `saas_users.csv` по тарифным планам (`plan`) и рассчитайте разницу между средним и медианой."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nplan_stats = df_saas.groupby('plan')['mrr'].agg(['mean', 'median'])\nplan_stats['diff'] = plan_stats['mean'] - plan_stats['median']\n\nprint(plan_stats)\nassert not plan_stats.empty, \"Сводка не должна быть пустой\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда использовать медиану?\nЗарплаты, цены на недвижимость, чеки интернет-магазинов и время ответа сервера (latency p95/p99) всегда анализируются через медианы и квантили, так как они устойчивы к выбросам."}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 2. Теория вероятностей, теорема Байеса и Закон больших чисел\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПринятие решений на малых выборках — одна из главных причин потери бюджетов в маркетинге и продукте. Закон больших чисел объясняет, почему нельзя доверять конверсии лендинга после 50 посетителей. А теорема Байеса объясняет парадокс ложноположительных срабатываний систем антифрода."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "##
