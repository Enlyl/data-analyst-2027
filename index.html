🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем вероятность оттока (`is_churned`) и условную вероятность оттока по тарифам."}, {"type": "code", "content": "df_saas = pd.read_csv(saas_csv)\n\ntotal_users = len(df_saas)\nchurned_users = len(df_saas[df_saas['is_churned'] == 1])\np_churn = churned_users / total_users\n\n# P(Churn | Starter plan)\nstarter_users = df_saas[df_saas['plan'] == 'Starter']\np_churn_given_starter = len(starter_users[starter_users['is_churned'] == 1]) / len(starter_users)\n\nprint(f\"Общая вероятность оттока P(Churn): {p_churn:.2%}\")\nprint(f\"Условная вероятность оттока P(Churn | Starter): {p_churn_given_starter:.2%}\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Закон больших чисел в действии (Стабилизация CTR)\n**Кейс:** Маркетолог запустил баннер. После первых 40 показов CTR составил 5.0% (2 клика). Маркетолог просит $50,000 на масштабную кампанию.\nЗапустите интерактивную анимацию ниже: смотрите, как накопленный CTR неистово колеблется на малых n и стабилизируется строго к истинным 2.5% лишь к 1,500 показам!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\nimport numpy as np\n\nnp.random.seed(42)\ntrue_ctr = 0.025\ntotal_trials = 2000\nclicks = np.random.binomial(1, true_ctr, total_trials)\ncumulative_ctr = np.cumsum(clicks) / np.arange(1, total_trials + 1)\n\nfig, ax = plt.subplots(figsize=(10, 4.5))\nax.set_xlim(1, total_trials)\nax.set_ylim(0, 0.08)\nax.axhline(true_ctr, color='#cc4b37', linestyle='--', linewidth=2, label=f'Истинный CTR = {true_ctr:.1%}')\nax.axvspan(0, 100, alpha=0.15, color='#ffae00', label='Зона ранней паники (n < 100)')\nline, = ax.plot([], [], color='#1779ba', linewidth=1.8, label='Накопленный CTR')\nax.set_title('Закон больших чисел: Стабилизация оценки конверсии', fontsize=12, fontweight='bold')\nax.set_xlabel('Количество показов (n)')\nax.set_ylabel('Оценка CTR')\nax.legend(loc='upper right')\nax.grid(True, linestyle=':', alpha=0.6)\n\nframes_list = list(range(10, 200, 10)) + list(range(200, total_trials, 50))\n\ndef update(frame):\n    x = np.arange(1, frame + 1)\n    y = cumulative_ctr[:frame]\n    line.set_data(x, y)\n    return line,\n\nanim = animation.FuncAnimation(fig, update, frames=frames_list, blit=True)\nplt.close(fig)\n\nHTML(anim.to_jshtml())"}, {"type": "markdown", "content": "### 📊 Теорема Байеса: Почему точный антифрод ошибается на 90%\n**Кейс:** Система выявления мошеннических транзакций имеет точность 99% (Sensitivity = 0.99, Specificity = 0.99).\nЕсли уровень фрода в базе 0.1% (1 из 1000), какова вероятность того, что помеченная транзакция действительно фрод?\nГрафик ниже показывает, как апостериорная вероятность ($P(Fraud | Alert)$) зависит от базовой распространенности фрода."}, {"type": "code", "content": "fig, axes = plt.subplots(1, 2, figsize=(15, 5))\n\n# 1. Зависимость PPV от базового уровня фрода\nax1 = axes[0]\nbase_rates = np.linspace(0.0005, 0.05, 200)\nsensitivity = 0.99\nspecificity = 0.99\n\nppv = (sensitivity * base_rates) / (sensitivity * base_rates + (1 - specificity) * (1 - base_rates))\nax1.plot(base_rates * 100, ppv * 100, color='#1779ba', linewidth=2.5)\nax1.set_title('Точность антифрода (PPV) vs Уровень фрода в популяции', fontsize=11)\nax1.set_xlabel('Базовый уровень фрода в транзакциях (%)')\nax1.set_ylabel('Шанс, что алерт реален: P(Fraud | +) %')\nax1.axvline(0.1, color='#cc4b37', linestyle='--', label='Реальный фрод = 0.1% (PPV всего ~9%)')\nax1.grid(True, linestyle=':', alpha=0.6)\nax1.legend()\n\n# 2. Воронка транзакций на 10,000 платежей\nax2 = axes[1]\ncategories = ['Всего платежей\\n10,000', 'Реальный фрод\\n10', 'Ложные алерты\\n100', 'Истинные алерты\\n10']\ncounts = [10000, 10, 100, 10]\ncolors = ['#767676', '#cc4b37', '#ffae00', '#3adb76']\nbars = ax2.bar(categories, counts, color=colors, edgecolor='white')\nax2.set_yscale('log')\nax2.set_title('На 10 истинных фродов приходится 100 ложных алертов!', fontsize=11)\nax2.set_ylabel('Количество (лог. шкала)')\nfor bar in bars:\n    yval = bar.get_height()\n    ax2.text(bar.get_x() + bar.get_width()/2, yval * 1.2, f'{int(yval)}', ha='center', fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет вероятности оттока для тарифа Enterprise\nРассчитайте вероятность $P(Churn | Enterprise)$ и убедитесь, что она меньше, чем по тарифу Starter."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nent_users = df_saas[df_saas['plan'] == 'Enterprise']\np_churn_enterprise = len(ent_users[ent_users['is_churned'] == 1]) / len(ent_users)\n\nprint(f\"P(Churn | Enterprise): {p_churn_enterprise:.2%}\")\nassert p_churn_enterprise < p_churn_given_starter, \"Отток в Enterprise должен быть ниже Starter\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главный вывод для аналитика\nПри редких событиях (фрод, клики с низким CTR, конверсия в покупку квартиры) даже тест с 99% точностью порождает больше шума, чем сигнала. Всегда калибруйте пороги моделей с учетом базовой вероятности."}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 3. Распределения, Центральная предельная теорема и Доверительные интервалы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ реальном бизнесе распределения почти никогда не бывают нормальными: время ответа сервера экспоненциально, чеки логнормальны, отток биномиален. \nЦентральная предельная теорема (ЦПТ / CLT) — фундамент аналитики данных: независимо от формы исходного распределения, средние арифметические выборок всегда распределены нормально при достаточном размере выборки ($n \\ge 30$)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПроверим работу ЦПТ на сильно скошенном распределении времени ответа техподдержки."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\nnp.random.seed(42)\n# Исходная генеральная совокупность: время ответа поддержки (экспоненциальное, среднее = 5.0 часов)\npopulation = np.random.exponential(scale=5.0, size=50000)\n\nsample_sizes = [5, 30, 100]\nresults = {}\n\nfor n in sample_sizes:\n    sample_means = [np.mean(np.random.choice(population, size=n)) for _ in range(1000)]\n    results[n] = sample_means\n    print(f\"Размер выборки n={n:3d}: Среднее выборочных средних = {np.mean(sample_means):.2f}, Станд. ошибка = {np.std(sample_means):.2f}\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Центральная предельная теорема в действии\nЗапустите анимацию ниже: смотрите, как при росте размера выборки $n$ от 1 до 50 сильно скошенное исходное распределение средних волшебным образом трансформируется в идеальную симметричную гауссиану (колокол Гаусса)!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\nfrom scipy import stats\n\nfig, ax = plt.subplots(figsize=(10, 5))\n\nn_steps = [1, 2, 3, 5, 8, 12, 18, 25, 35, 50, 75, 100]\n\ndef update_clt(step_idx):\n    ax.clear()\n    n = n_steps[step_idx]\n    means = [np.mean(np.random.choice(population, size=n)) for _ in range(2500)]\n    \n    ax.hist(means, bins=45, density=True, color='#1779ba', alpha=0.65, edgecolor='white')\n    \n    x_grid = np.linspace(min(means), max(means), 200)\n    theo_mean = 5.0\n    theo_std = 5.0 / np.sqrt(n)\n    ax.plot(x_grid, stats.norm.pdf(x_grid, theo_mean, theo_std), color='#cc4b37', linewidth=2.5,\n            label=f'Нормальная кривая N({theo_mean}, {theo_std:.2f}²)')\n    \n    ax.axvline(theo_mean, color='#3adb76', linestyle='--', linewidth=2, label=f'Истинное μ = {theo_mean}')\n    ax.set_title(f'ЦПТ в динамике: размер выборки n = {n} (чем больше n, тем точнее колокол)', fontsize=12, fontweight='bold')\n    ax.set_xlabel('Выборочное среднее (часы)')\n    ax.set_ylabel('Плотность вероятности')\n    ax.set_xlim(0, 15)\n    ax.legend(loc='upper right')\n    ax.grid(True, linestyle=':', alpha=0.5)\n\nanim_clt = animation.FuncAnimation(fig, update_clt, frames=len(n_steps), repeat=True)\nplt.close(fig)\n\nHTML(anim_clt.to_jshtml())"}, {"type": "markdown", "content": "### 📊 Визуализация Доверительных интервалов (Гусеница CI)\n**Кейс:** Что на самом деле означает «95% доверительный интервал»? Это НЕ значит, что истинное среднее лежит в интервале с вероятностью 95%.\nЭто означает: если мы повторим эксперимент 100 раз и построим 100 интервалов, ровно 95 из них накроют истинное среднее генеральной совокупности."}, {"type": "code", "content": "fig, ax = plt.subplots(figsize=(12, 6))\n\ntrue_mean = 5.0\nn_experiments = 30\nsample_size = 40\n\nhits, misses = 0, 0\n\nfor i in range(n_experiments):\n    sample = np.random.choice(population, size=sample_size)\n    s_mean = np.mean(sample)\n    se = stats.sem(sample)\n    ci_low, ci_high = stats.t.interval(0.95, df=sample_size-1, loc=s_mean, scale=se)\n    \n    covers_true = (ci_low <= true_mean <= ci_high)\n    if covers_true:\n        hits += 1\n        color = '#1779ba'\n    else:\n        misses += 1\n        color = '#cc4b37'\n        \n    ax.plot([ci_low, ci_high], [i, i], color=color, linewidth=2.5)\n    ax.plot(s_mean, i, 'o', color=color, markersize=5)\n\nax.axvline(true_mean, color='#3adb76', linestyle='--', linewidth=2.5, label=f'Истинное значение μ = {true_mean}')\nax.set_title(f'30 независимых выборок: 95% CI накрыли истинное среднее в {hits}/{n_experiments} случаях', fontsize=12, fontweight='bold')\nax.set_xlabel('Время ответа техподдержки (часы)')\nax.set_ylabel('Номер эксперимента')\nax.legend(loc='upper right')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Построение 99% доверительного интервала\nРассчитайте 99% доверительный интервал для времени ответа на выборке размера $n=100$ и сравните его ширину с 95% интервалом."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsample = np.random.choice(population, size=100)\nmean_s = np.mean(sample)\nse = stats.sem(sample)\n\nci_95 = stats.t.interval(0.95, df=99, loc=mean_s, scale=se)\nci_99 = stats.t.interval(0.99, df=99, loc=mean_s, scale=se)\n\nwidth_95 = ci_95[1] - ci_95[0]\nwidth_99 = ci_99[1] - ci_99[0]\n\nprint(f\"95% CI ширина: {width_95:.3f}\")\nprint(f\"99% CI ширина: {width_99:.3f}\")\n\nassert width_99 > width_95, \"99% доверительный интервал обязан быть шире 95%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда использовать доверительные интервалы?\nВсегда показывайте CI на графиках динамики метрик (Error Bars). Одиночная точка без доверительного интервала вводит руководство в иллюзию абсолютной точности."}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 4. Проверка статистических гипотез: p-value, t-тест и U-критерий Манна-Уитни\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКаждый раз, когда продуктовая команда выкатывает фичу, возникает вопрос: «Рост метрики — это реальный эффект или случайность?». \nP-value дает ответ: какова вероятность получить такую или большую разницу при условии, что никакого эффекта на самом деле нет ($H_0$)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним выручку на пользователя между контрольной (`A_Control`) и тестовой (`B_Variant`) группами с помощью t-теста Уэлча и U-критерия Манна-Уитни."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\n\ndf_ab = pd.read_csv(ab_csv)\n\ngroup_a = df_ab[df_ab['test_group'] == 'A_Control']['revenue']\ngroup_b = df_ab[df_ab['test_group'] == 'B_Variant']['revenue']\n\n# t-тест Уэлча\nt_stat, t_pval = stats.ttest_ind(group_a, group_b, equal_var=False)\n\n# U-критерий Манна-Уитни\nu_stat, u_pval = stats.mannwhitneyu(group_a, group_b)\n\nprint(f\"t-test:  t-statistic = {t_stat:.3f}, p-value = {t_pval:.4f}\")\nprint(f\"MWU-test: U-statistic = {u_stat:.1f}, p-value = {u_pval:.4f}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Что такое p-value геометрически?\nP-value — это площадь хвоста распределения нулевой гипотезы $H_0$ правее (и левее) наблюдаемой t-статистики. \nЕсли наблюдаемое значение попадает в «красную зону» отвержения ($\\alpha = 0.05$), мы отвергаем $H_0$."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nfrom scipy import stats\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анатомия проверки гипотез: p-value и распределения групп', fontsize=14, fontweight='bold')\n\n# 1. Геометрический смысл p-value\nax1 = axes[0]\nx = np.linspace(-4, 4, 500)\ny = stats.norm.pdf(x)\nax1.plot(x, y, color='#0a0a0a', linewidth=2, label='Распределение H₀ (нет эффекта)')\n\nalpha_crit = 1.96\nax1.fill_between(x[x >= alpha_crit], y[x >= alpha_crit], color='#cc4b37', alpha=0.35, label='Критическая зона α=0.05')\nax1.fill_between(x[x <= -alpha_crit], y[x <= -alpha_crit], color='#cc4b37', alpha=0.35)\n\nt_obs = abs(t_stat)\nax1.axvline(t_obs, color='#1779ba', linewidth=2.5, linestyle='-', label=f'Наблюдаемая |t| = {t_obs:.2f}')\nax1.fill_between(x[x >= t_obs], y[x >= t_obs], color='#1779ba', alpha=0.6, label='p-value (площадь хвоста)')\n\nax1.set_title('Геометрия p-value на распределении Стьюдента', fontsize=11)\nax1.set_xlabel('t-значение')\nax1.set_ylabel('Плотность')\nax1.legend(loc='upper left', fontsize=9)\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Наложение распределений Группы А и Группы В\nax2 = axes[1]\nax2.hist(group_a, bins=30, alpha=0.55, color='#767676', label=f'Контроль A (Среднее=${group_a.mean():.1f})', density=True)\nax2.hist(group_b, bins=30, alpha=0.55, color='#1779ba', label=f'Тест B (Среднее=${group_b.mean():.1f})', density=True)\nax2.axvline(group_a.mean(), color='#767676', linestyle='--', linewidth=2)\nax2.axvline(group_b.mean(), color='#1779ba', linestyle='--', linewidth=2)\n\nstatus_text = \"Различие статистически значимо\" if t_pval < 0.05 else \"Различие НЕ значимо (шум)\"\nax2.set_title(f'Сравнение выборок: {status_text} (p={t_pval:.3f})', fontsize=11)\nax2.set_xlabel('Выручка на пользователя ($)')\nax2.set_ylabel('Плотность')\nax2.legend(loc='upper right', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Односторонний vs Двусторонний t-тест\nПроведите односторонний t-тест с альтернативой `alternative='greater'` (проверяем, что группа B строго лучше группы A)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nt_stat_1s, t_pval_1s = stats.ttest_ind(group_b, group_a, alternative='greater', equal_var=False)\n\nprint(f\"Односторонний p-value: {t_pval_1s:.4f}\")\nassert t_pval_1s <= 1.0, \"p-value обязан быть в диапазоне [0, 1]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда выбирать Манна-Уитни вместо t-теста?\nЕсли распределение сильно скошено (время сессий, количество кликов, чеки с редкими гигантскими выбросами), t-тест теряет мощность. U-критерий Манна-Уитни работает на рангах и устойчив к любым экстремальным выбросам."}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 5. Корреляция и регрессионный анализ: OLS и логистическая регрессия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\n\n## 📌 Бизнес-контекст и методология\n«Корреляция не означает причинность» — золотое правило аналитика. Два показателя могут коррелировать из-за третьего скрытого фактора (Confounder). \nЛинейная регрессия (МНК / OLS) позволяет не только измерить силу связи, но и прогнозировать $Y$ по $X$, оценивая маржинальный эффект каждого вложенного доллара."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПостроим регрессионную модель зависимости выручки от активности пользователя в приложении (`active_seats`)."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nx = df_saas['active_seats'].values\ny = df_saas['mrr'].values\n\nslope, intercept, r_val, p_val, std_err = stats.linregress(x, y)\n\nprint(f\"Коэффициент наклона (Slope): ${slope:.2f} прибавки к MRR на каждое рабочее место\")\nprint(f\"Коэффициент корреляции Пирсона r: {r_val:.3f}\")\nprint(f\"Коэффициент детерминации R²:     {r_val**2:.3f}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: OLS линия регрессии, Квартет Энскомба и Корреляционная матрица\nГрафик ниже демонстрирует:\n1. Линейную регрессию с доверительным интервалом предсказания;\n2. Почему нельзя слепо верить цифре $r$ без визуализации (Квартет Энскомба);\n3. Корреляционную тепловую карту ключевых продуктовых метрик."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Регрессионный анализ и опасности слепой корреляции', fontsize=14, fontweight='bold')\n\n# 1. Скаттер с OLS линией тренда и 95% доверительным интервалом\nax1 = axes[0]\nax1.scatter(x, y, alpha=0.3, color='#1779ba', s=20, label='Пользователи')\nx_line = np.linspace(min(x), max(x), 100)\ny_line = slope * x_line + intercept\nax1.plot(x_line, y_line, color='#cc4b37', linewidth=2.5, label=f'OLS: Y = {slope:.2f}X + {intercept:.1f}')\nax1.set_title(f'Связь Active Seats и Выручки (R²={r_val**2:.2f})', fontsize=11)\nax1.set_xlabel('Количество мест (Active Seats)')\nax1.set_ylabel('MRR ($)')\nax1.legend(loc='upper left')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Демонстрация: Одинаковый r, совершенно разные зависимости\nax2 = axes[1]\nx_demo = np.linspace(1, 10, 40)\ny_lin = 2 * x_demo + np.random.normal(0, 1, 40)\ny_curve = -(x_demo - 5)**2 + 25 + np.random.normal(0, 0.5, 40)\n\nax2.scatter(x_demo, y_lin, color='#1779ba', label='Линейная (r=0.91)', alpha=0.7)\nax2.scatter(x_demo, y_curve, color='#ffae00', label='Нелинейная парабола (r=0.05)', alpha=0.7)\nax2.set_title('Ловушка корреляции: Всегда смотрите на график!', fontsize=11)\nax2.set_xlabel('Предиктор X')\nax2.set_ylabel('Отклик Y')\nax2.legend(loc='lower center', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Корреляционная матрица метрик бизнеса\nax3 = axes[2]\nmetrics = ['Ad Spend', 'Visits', 'Bounce %', 'Conv %', 'Revenue']\ncorr_data = np.array([\n    [ 1.00,  0.88, -0.22,  0.41,  0.82],\n    [ 0.88,  1.00, -0.31,  0.35,  0.74],\n    [-0.22, -0.31,  1.00, -0.68, -0.45],\n    [ 0.41,  0.35, -0.68,  1.00,  0.79],\n    [ 0.82,  0.74, -0.45,  0.79,  1.00]\n])\nim = ax3.imshow(corr_data, cmap='coolwarm', vmin=-1, vmax=1)\nax3.set_xticks(range(len(metrics)))\nax3.set_yticks(range(len(metrics)))\nax3.set_xticklabels(metrics, rotation=45, ha='right', fontsize=9)\nax3.set_yticklabels(metrics, fontsize=9)\n\nfor i in range(len(metrics)):\n    for j in range(len(metrics)):\n        val = corr_data[i, j]\n        color = 'white' if abs(val) > 0.5 else 'black'\n        ax3.text(j, i, f'{val:.2f}', ha='center', va='center', color=color, fontweight='bold', fontsize=8)\n\nax3.set_title('Корреляционная матрица метрик', fontsize=11)\nplt.colorbar(im, ax=ax3, shrink=0.75)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Прогнозирование MRR для нового клиента\nИспользуя найденные коэффициенты регрессии (`slope` и `intercept`), сделайте прогноз MRR для клиента с `active_seats = 15`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npredicted_mrr = slope * 15 + intercept\n\nprint(f\"Прогнозируемый MRR для 15 active seats: ${predicted_mrr:.2f}\")\nassert predicted_mrr > 0, \"Прогноз MRR должен быть положительным числом\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главное предостережение\nВысокий $R^2$ не гарантирует причинность. Перед тем как советовать отделу маркетинга раздувать бюджет на основе регрессии, запустите контролируемый A/B тест."}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 6. Статистические ловушки в бизнесе: парадокс Симпсона, ошибка выжившего и регрессия к среднему\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДаже математически безупречные расчеты могут привести компанию к катастрофическим управленческим решениям, если аналитик попадает в классические статистические ловушки:\n1. **Парадокс Симпсона:** Агрегированные данные показывают тренд, противоположный тренду внутри каждой отдельной подгруппы.\n2. **Ошибка выжившего (Survivorship bias):** Анализ только успешных кейсов (победивших стартапов, активных клиентов) без учета «кладбища» ушедших.\n3. **Регрессия к среднему:** Экстремальные взлеты или падения метрик естественным образом откатываются назад без какого-либо вмешательства."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем реальный продуктовый кейс: новый дизайн лендинга побеждает на мобилках и побеждает на десктопе, но проигрывает в сумме."}, {"type": "code", "content": "# Пример парадокса Симпсона в A/B тесте конверсии\n# Сегмент 1: Mobile\nmobile_a_views, mobile_a_conv = 1000, 100  # 10.0%\nmobile_b_views, mobile_b_conv = 4000, 480  # 12.0% (B побеждает на +2%)\n\n# Сегмент 2: Desktop\ndesktop_a_views, desktop_a_conv = 4000, 800  # 20.0%\ndesktop_b_views, desktop_b_conv = 1000, 220  # 22.0% (B побеждает на +2%)\n\n# ИТОГО (агрегированно):\ntotal_a_views = mobile_a_views + desktop_a_views\ntotal_a_conv = mobile_a_conv + desktop_a_conv\ncr_a = total_a_conv / total_a_views  # 900 / 5000 = 18.0%\n\ntotal_b_views = mobile_b_views + desktop_b_views\ntotal_b_conv = mobile_b_conv + desktop_b_conv\ncr_b = total_b_conv / total_b_views  # 700 / 5000 = 14.0% (Агрегированно B \"проиграл\" 14% vs 18%!)\n\nprint(f\"Mobile:  CR(A)={mobile_a_conv/mobile_a_views:.1%}, CR(B)={mobile_b_conv/mobile_b_views:.1%} -> Вариант B ЛУЧШЕ (+2%)\")\nprint(f\"Desktop: CR(A)={desktop_a_conv/desktop_a_views:.1%}, CR(B)={desktop_b_conv/desktop_b_views:.1%} -> Вариант B ЛУЧШЕ (+2%)\")\nprint(f\"ИТОГО:   CR(A)={cr_a:.1%}, CR(B)={cr_b:.1%} -> Вариант B 'ХУЖЕ' на -4.0%?!\")"}, {"type": "markdown", "content": "### 📊 Визуализация: 3 главные ловушки аналитики\nНиже визуализированы:\n1. **Парадокс Симпсона:** почему смешивание разных долей мобильного и десктопного трафика вызвало оптический обман;\n2. **Ошибка выжившего:** реальное кладбище продуктов vs видимый успех;\n3. **Регрессия к среднему:** естественный откат аномального всплеска продаж."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Анатомия статистических ловушек в продуктовых решениях', fontsize=14, fontweight='bold')\n\n# 1. Парадокс Симпсона (Bar chart)\nax1 = axes[0]\nsegments = ['Mobile', 'Desktop', 'ИТОГО (Общий)']\ncr_a_vals = [mobile_a_conv/mobile_a_views * 100, desktop_a_conv/desktop_a_views * 100, cr_a * 100]\ncr_b_vals = [mobile_b_conv/mobile_b_views * 100, desktop_b_conv/desktop_b_views * 100, cr_b * 100]\n\nx_idx = np.arange(len(segments))\nwidth = 0.35\n\nrects1 = ax1.bar(x_idx - width/2, cr_a_vals, width, label='Вариант A (Контроль)', color='#767676')\nrects2 = ax1.bar(x_idx + width/2, cr_b_vals, width, label='Вариант B (Тест)', color='#1779ba')\n\nax1.set_title('Парадокс Симпсона: B лучше в группах, но хуже в сумме', fontsize=10, fontweight='bold')\nax1.set_ylabel('Конверсия (%)')\nax1.set_xticks(x_idx)\nax1.set_xticklabels(segments)\nax1.legend()\nax1.grid(True, linestyle=':', alpha=0.5)\n\nfor r in rects1 + rects2:\n    h = r.get_height()\n    ax1.annotate(f'{h:.1f}%', xy=(r.get_x() + r.get_width() / 2, h),\n                 xytext=(0, 3), textcoords=\"offset points\", ha='center', va='bottom', fontsize=9)\n\n# 2. Ошибка выжившего (Survivorship Bias)\nax2 = axes[1]\nyears = np.arange(1, 11)\nall_startups = 1000 * np.exp(-0.25 * years)\nprofitable = all_startups * (0.05 + 0.08 * years)\n\nax2.fill_between(years, 0, all_startups, color='#cc4b37', alpha=0.3, label='Закрывшиеся стартапы (90%)')\nax2.fill_between(years, 0, profitable, color='#3adb76', alpha=0.7, label='Выжившие единороги (10%)')\nax2.set_title('Ошибка выжившего: Мы изучаем только 10%', fontsize=11, fontweight='bold')\nax2.set_xlabel('Лет с основания компании')\nax2.set_ylabel('Количество компаний')\nax2.legend(loc='upper right')\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Регрессия к среднему (Regression to the Mean)\nax3 = axes[2]\nnp.random.seed(42)\ndays = np.arange(1, 31)\ndaily_sales = 100 + np.random.normal(0, 10, 30)\ndaily_sales[14] = 155\n\nax3.plot(days, daily_sales, marker='o', markersize=4, color='#1779ba', label='Дневные продажи')\nax3.axhline(100, color='#767676', linestyle='--', label='Средний уровень (100 шт)')\nax3.scatter(15, 155, color='#cc4b37', s=80, zorder=5, label='Аномальный пик')\nax3.annotate('После пика спад неизбежен\\nБЕЗ всяких внешних причин!', xy=(15, 155), xytext=(17, 135),\n             arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontsize=9)\nax3.set_title('Регрессия к среднему: Пик сменяется откатом', fontsize=11, fontweight='bold')\nax3.set_xlabel('День месяца')\nax3.set_ylabel('Продажи (шт)')\nax3.legend(loc='upper left', fontsize=8)\nax3.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет взвешенной конверсии по сегментам\nИспользуя стратифицированное взвешивание, рассчитайте корректную конверсию для вариантов A и B при равных долях трафика 50/50."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nstratified_cr_a = 0.5 * (mobile_a_conv / mobile_a_views) + 0.5 * (desktop_a_conv / desktop_a_views)\nstratified_cr_b = 0.5 * (mobile_b_conv / mobile_b_views) + 0.5 * (desktop_b_conv / desktop_b_views)\n\nprint(f\"Взвешенная CR(A): {stratified_cr_a:.2%}\")\nprint(f\"Взвешенная CR(B): {stratified_cr_b:.2%}\")\n\nassert stratified_cr_b > stratified_cr_a, \"При равных весах вариант B обязан побеждать!\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Чек-лист аналитика перед сдачей отчета:\n1. Сегментируйте метрики по ключевым срезам (устройства, страны, каналы).\n2. Проверяйте, не изменились ли пропорции трафика в группах.\n3. Не приписывайте изменения метрик новым фичам, если это просто регрессия к среднему."}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6. BI дашборды в Looker Studio", "cat": "BI", "badge": "BI", "icon": "📉", "desc": "Моделирование данных, интерактивные фильтры, executive-дашборды для бизнеса.", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio & BI)\n\n---\n\n### Вопрос 1\nКак правильно рассчитать конверсию (Conversion Rate) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Purchases / Sessions)`\n- [x] `SUM(Purchases) / SUM(Sessions)`\n- [ ] `Purchases / Sessions`\n*Объяснение*: Нельзя усреднять частные (`AVG(...)`). Необходимо вычислить отношение суммы всех покупок к сумме всех сессий.\n\n---\n\n### Вопрос 2\nЧто такое Granularity Mismatch при Data Blending?\n- [ ] Ошибка в названии столбца.\n- [x] Несоответствие уровня детализации таблиц (например, расходы сгруппированы по дням, а продажи — по конкретным секундам чеков), приводящее к задвоению метрик.\n- [ ] Нехватка оперативной памяти в браузере.\n*Объяснение*: Для корректного соединения обе таблицы должны быть приведены к одинаковому составному ключу группировки.\n\n---\n\n### Вопрос 3\nКаково правило «5 секунд» в дизайне бизнес-дашбордов?\n- [ ] Дашборд должен загружаться не более 5 секунд.\n- [x] Руководитель должен за 5 секунд понять текущий статус ключевых KPI и наличие отклонений от плана.\n- [ ] Графики должны обновляться каждые 5 секунд.\n*Объяснение*: Главные карточки метрик с индикаторами отклонения должны считываться моментально в верхнем левом углу.\n\n---\n\n### Вопрос 4\nПочему в BI-системах агрегированные метрики отношений (например, CTR или Конверсия) нельзя вычислять как среднее по строкам?\n- [ ] BI-инструменты зависают от таких формул.\n- [x] Среднее арифметическое от долей игнорирует вес каждой строки; корректная формула требует отношения сумм: SUM(кликов) / SUM(показов).\n- [ ] Это разрешено, если строк больше 1000.\n*Объяснение*: Неправильная агрегация приводит к парадоксу Симпсона и искажению отчетов.\n\n---\n\n### Вопрос 5\nВ чем преимущество выноса тяжелых JOIN-ов из Looker Studio в витрины данных BigQuery или ClickHouse?\n- [ ] В Looker Studio нельзя использовать JOIN.\n- [x] Предварительно рассчитанные плоские витрины ускоряют загрузку дашборда до долей секунды и экономят ресурсы браузера пользователя.\n- [ ] Это экономит бумагу при печати отчета.\n*Объяснение*: BI должен только визуализировать готовые данные, а не исполнять тяжелые вычисления на лету.\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 1. Архитектура BI и подключение источников данных в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДашборд — это инструмент принятия управленческих решений.\nВ этом уроке мы разберем:\n1. Архитектуру подключения BigQuery / PostgreSQL / Google Sheets.\n2. Подготовку плоских денормализованных витрин (Data Marts).\n3. Принцип 5 секунд (5-second rule) для верхнеуровневых Executive KPI."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\ntotal_mrr = df_saas['mrr'].sum()\nactive_clients = len(df_saas[df_saas['is_churned'] == 0])\nchurned_clients = len(df_saas[df_saas['is_churned'] == 1])\nchurn_rate = churned_clients / len(df_saas)\narpu = total_mrr / active_clients if active_clients > 0 else 0\n\nprint(\"=\" * 45)\nprint(\"📊 EXECUTIVE SUMMARY (Верхний ярус дашборда):\")\nprint(f\"💰 Total MRR:          ${total_mrr:,.2f}\")\nprint(f\"👥 Active Clients:     {active_clients}\")\nprint(f\"🚪 Churn Rate:         {churn_rate:.2%}\")\nprint(f\"📈 ARPU (Active):      ${arpu:.2f}\")\nprint(\"=\" * 45)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет дельты к целевому показателю (Target Delta)\nЦелевой Churn Rate в компании установлен на уровне 4.0%.\nРассчитайте абсолютную разницу между фактическим и целевым оттоком в процентных пунктах (p.p.)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntarget_churn = 0.04\ndelta_pp = (churn_rate - target_churn) * 100\n\nprint(f\"Отклонение от цели: {delta_pp:+.2f} п.п.\")\nassert isinstance(delta_pp, float), \"Дельта должна быть вещественным числом\"\nprint(\"✅ Тест успешно пройден: метрика отклонения готова для KPI-карточки!\")\n"}, {"type": "markdown", "content": "### 💡 Архитектурный фреймворк дашборда\n* **Tier 1 (Верх)**: 3-5 ключевых KPI с дельтами к прошлому периоду и таргету.\n* **Tier 2 (Середина)**: Тренды во времени (динамика недели/месяцы).\n* **Tier 3 (Низ)**: Детализирующая таблица с возможностью фильтрации."}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 2. Вычисляемые поля и параметры: CASE WHEN и агрегированные метрики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ BI-системах вычисляемые поля делятся на:\n* **Row-level calculated fields**: выполняются построчно (например, `CASE WHEN ... THEN`).\n* **Aggregated calculated fields**: вычисляются после агрегации (`SUM(mrr) / COUNT(DISTINCT user_id)`).\nНикогда не усредняйте готовые проценты или отношения!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nconditions = [\n    df_saas['active_seats'] <= 5,\n    (df_saas['active_seats'] >= 6) & (df_saas['active_seats'] <= 20),\n    df_saas['active_seats'] > 20\n]\nchoices = ['Small', 'Medium', 'Enterprise']\ndf_saas['company_size_tier'] = np.select(conditions, choices, default='Unknown')\n\ntier_summary = df_saas.groupby('company_size_tier').agg(\n    total_mrr=('mrr', 'sum'),\n    clients_count=('user_id', 'count'),\n    avg_mrr=('mrr', 'mean')\n).reset_index()\n\nprint(tier_summary.to_string(index=False))\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля выручки по сегментам\nВычислите долю каждого сегмента в общей выручке и сохраните в столбец `revenue_share`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntier_summary['revenue_share'] = tier_summary['total_mrr'] / tier_summary['total_mrr'].sum()\nprint(tier_summary[['company_size_tier', 'revenue_share']])\n\nassert round(tier_summary['revenue_share'].sum(), 2) == 1.0, \"Сумма долей должна быть 1.0\"\nprint(\"✅ Тест успешно пройден: вычисляемая метрика верна!\")\n"}, {"type": "markdown", "content": "### 💼 Формула безопасного вычисления в BI\nВсегда используйте синтаксис `SUM(revenue) / NULLIF(SUM(clicks), 0)` для защиты от деления на ноль."}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 3. Смешивание данных (Data Blending) и объединение источников\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\n\n## 📌 Бизнес-контекст и методология\nData Blending в Looker Studio выполняет LEFT JOIN между источниками по общему ключу (Join Key).\nВажно: смешивание происходит ПОСЛЕ группировки, поэтому данные объединяются на агрегированном уровне."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\n# Таблица 1: Затраты на маркетинг\ndf_spend = pd.DataFrame({\n    'channel': ['Paid Search', 'Social Ads', 'Referral', 'SEO'],\n    'ad_spend': [120_000, 85_000, 15_000, 30_000]\n})\n\n# Таблица 2: Выручка от привлеченных клиентов\ndf_rev = pd.DataFrame({\n    'channel': ['Paid Search', 'Social Ads', 'Referral', 'Email'],\n    'revenue': [340_000, 160_000, 45_000, 70_000]\n})\n\n# Blending (Left Join)\nblended = pd.merge(df_spend, df_rev, on='channel', how='left').fillna(0)\nblended['roas'] = blended['revenue'] / blended['ad_spend']\nprint(blended)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Суммарный ROAS маркетинга\nРассчитайте совокупный ROAS по всем объединенным каналам."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_roas = blended['revenue'].sum() / blended['ad_spend'].sum()\nprint(f\"Совокупный ROAS: {total_roas:.2f}x\")\n\nassert total_roas > 1.0, \"Маркетинг в целом окупаем\"\nprint(\"✅ Тест успешно пройден: смешивание данных и расчет метрики выполнены!\")\n"}, {"type": "markdown", "content": "### 💡 Ограничения Data Blending\nПри смешивании более 3-4 источников дашборды в BI начинают тормозить. Индустриальная рекомендация: готовить плоскую таблицу в BigQuery / ClickHouse."}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 4. UI/UX дашбордов для топ-менеджмента: верстка, цветовая семантика и типографика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДизайн дашборда подчиняется законам восприятия информации:\n1. **Z-паттерн и F-паттерн чтения**: главное слева сверху.\n2. **Семантика цвета**: зеленый = успех, красный = проблема, серый/синий = нейтральный контекст.\n3. **Число Данбара для графиков**: не более 5-7 визуальных элементов на одном экране."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Аудит визуальной загруженности дашборда\ndashboard_specs = {\n    'total_charts': 6,\n    'total_kpi_cards': 4,\n    'custom_colors_used': 3,\n    'has_date_filter': True\n}\n\ndef audit_dashboard_ux(specs):\n    issues = []\n    if specs['total_charts'] > 8:\n        issues.append(\"Слишком много графиков (риск когнитивной перегрузки)\")\n    if specs['custom_colors_used'] > 4:\n        issues.append(\"Эффект 'фруктового салата': слишком много цветов\")\n    if not specs['has_date_filter']:\n        issues.append(\"Отсутствует глобальный фильтр по дате\")\n    return issues\n\nissues = audit_dashboard_ux(dashboard_specs)\nprint(f\"Результат UX аудита: {'🟢 Идеально' if not issues else issues}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация спецификации дашборда\nУбедитесь, что тестовый дашборд проходит UX-аудит без замечаний."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert len(issues) == 0, \"Дашборд должен пройти аудит без замечаний\"\nprint(\"✅ Тест успешно пройден: UX-стандарты соблюдены!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: UI/UX Антипаттерны vs Эталонный Executive Dashboard\nНиже представлено прямое визуальное сравнение:\n1. **Плохой дашборд:** перегружен цветами, 3D-графиками, нечитаемыми круговыми диаграммами и отсутствием структуры.\n2. **Хороший дашборд (Foundation ZURB Design):** строгая иерархия (KPI карточки вверху -> динамика -> структура категорий), монохромный серый фон и один контрастный акцентный цвет (`#1779ba`)."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport numpy as np\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 6))\nfig.suptitle('Executive Dashboard UI/UX Standard: Антипаттерны vs Лучшие практики', fontsize=14, fontweight='bold')\n\n# --- 1. Плохой дашборд (Хаос и Антипаттерны) ---\nax1 = axes[0]\nax1.set_facecolor('#fffae6')  # режущий глаз желтоватый фон\n# Нагромождение нечитаемых пирогов и радужных цветов\nslices = [35, 25, 20, 10, 5, 3, 2]\nbad_colors = ['red', 'green', 'magenta', 'cyan', 'yellow', 'orange', 'blue']\nwedges, texts = ax1.pie(slices, colors=bad_colors, startangle=140)\nax1.set_title('❌ ПЛОХОЙ ДАШБОРД:\\nРадужные цвета, пирог на 7 долей, нет KPI', fontsize=11, color='#cc4b37', fontweight='bold')\nax1.text(0, -1.3, '• Глаза разбегаются\\n• Невозможно сравнить доли визуально\\n• Нет контекста (план/факт)', ha='center', fontsize=9, color='#cc4b37')\n\n# --- 2. Хороший дашборд (Foundation ZURB стиль) ---\nax2 = axes[1]\nax2.set_facecolor('#fefefe')\n# Модульная сетка: 3 KPI карточки + Чистый горизонтальный Bar Chart\ncategories = ['Enterprise B2B', 'Mid-Market SaaS', 'SMB Starter', 'Self-Serve']\nrevenue_k = [420, 280, 150, 45]\ncolors_good = ['#1779ba', '#2a8fc7', '#767676', '#cacaca']\n\nbars = ax2.barh(categories, revenue_k, color=colors_good, edgecolor='white', height=0.55)\nax2.set_title('✅ ЭТАЛОННЫЙ ДАШБОРД (Foundation ZURB):\\nСтрогая иерархия, монохром + акцент', fontsize=11, color='#3adb76', fontweight='bold')\nax2.set_xlabel('Выручка ($K)')\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# Добавляем KPI карточки над графиком текстовыми плашками\nax2.text(0.1, 1.15, 'MRR: $895K\\n(+12.4% MoM)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f4f9fd\", ec=\"#1779ba\"))\nax2.text(0.45, 1.15, 'Retention: 94.2%\\n(Цель: 92%)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f0fff4\", ec=\"#3adb76\"))\nax2.text(0.80, 1.15, 'CAC Payback: 5.2m\\n(-1.1m MoM)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f4f9fd\", ec=\"#1779ba\"))\n\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 10, b.get_y() + b.get_height()/2, f'${w}K', va='center', fontweight='bold', fontsize=9)\n\nax2.set_xlim(0, 520)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 💼 Совет аналитику\nПоказывайте черновик дашборда конечному заказчику на 2-й день разработки, а не через месяц."}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 5. Интерактивные фильтры, элементы управления и кросс-фильтрация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКросс-фильтрация (Cross-filtering) превращает статичный отчет в инструмент исследования данных.\nКлик по сектору на одном графике мгновенно фильтрует все связанные таблицы и KPI."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Симуляция фильтрации по выбранной индустрии\ndef apply_dashboard_filter(df, selected_industry=None, selected_plan=None):\n    filtered = df.copy()\n    if selected_industry:\n        filtered = filtered[filtered['industry'] == selected_industry]\n    if selected_plan:\n        filtered = filtered[filtered['plan'] == selected_plan]\n    return filtered\n\nres_filtered = apply_dashboard_filter(df_saas, selected_industry='Fintech', selected_plan='Enterprise')\nprint(f\"Найдено клиентов Fintech Enterprise: {len(res_filtered)}\")\nprint(f\"Их совокупный MRR: ${res_filtered['mrr'].sum():,.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка фильтрации\nПроверьте, что фильтр возвращает корректное подмножество записей."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert (res_filtered['industry'] == 'Fintech').all()\nassert (res_filtered['plan'] == 'Enterprise').all()\nprint(\"✅ Тест успешно пройден: кросс-фильтрация работает корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Оптимизация скорости\nПри включенной кросс-фильтрации каждый клик шлет десятки SQL-запросов к источнику. Используйте BI Engine или кэширование Extract в Looker Studio."}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7. A/B тестирование и эксперименты", "cat": "Аналитика", "badge": "A/B", "icon": "🧪", "desc": "Расчет размера выборки, MDE, ловушка подглядывания (Peeking), SRM и множественные тесты.", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B-тестирование)\n\n---\n\n### Вопрос 1\nЧто происходит с реальным уровнем ошибки I рода ($\\alpha$), если аналитик каждый день проверяет тест и останавливает его при первом $p < 0.05$ (Peeking Problem)?\n- [ ] Ошибка остается строго 5%.\n- [x] Реальная вероятность ложноположительного результата подскакивает до 30-40%, фиксируя случайный шум.\n- [ ] Ошибка уменьшается до нуля.\n*Объяснение*: Непрерывный мониторинг накапливает вероятность случайного пересечения порога 0.05.\n\n---\n\n### Вопрос 2\nЧто показывает Sample Ratio Mismatch (SRM)?\n- [ ] Разницу в конверсиях между группами.\n- [x] Нарушение запланированного соотношения объемов трафика в группах (например, 48/52 вместо 50/50), указывающее на технический сбой рандомизатора.\n- [ ] Ошибку в расчете выручки.\n*Объяснение*: При наличии SRM результаты сравнения метрик между группами математически невалидны.\n\n---\n\n### Вопрос 3\nЗачем нужны Guardrail-метрики в эксперименте?\n- [ ] Чтобы ускорить расчет p-value.\n- [x] Чтобы предотвратить раскатку фичи, которая вырастила локальную метрику за счет разрушения глобального здоровья бизнеса (например, рост кликов ценой падения выручки).\n- [ ] Для шифрования данных.\n*Объяснение*: Guardrail-метрики защищают ключевые бизнес-показатели от деградации.\n\n---\n\n### Вопрос 4\nЧто такое Peeking Problem (проблема подглядывания) в A/B тестировании?\n- [ ] Пользователи случайно узнают, в какой группе они находятся.\n- [x] Ежедневная проверка p-value и остановка эксперимента при первом получении p < 0.05 раздувает реальную ошибку I рода до 30-40%.\n- [ ] Просмотр дашборда конкурентами.\n*Объяснение*: Для непрерывного мониторинга необходимо использовать методы последовательного анализа (Sequential Testing).\n\n---\n\n### Вопрос 5\nКак метод CUPED снижает дисперсию целевой метрики в экспериментах?\n- [ ] Он удаляет половину пользователей из выборки.\n- [x] Он вычитает из текущей метрики ту часть дисперсии, которая объясняется предэкспериментальным поведением пользователя.\n- [ ] Он искусственно умножает данные на константу.\n*Объяснение*: CUPED эквивалентен бесплатному увеличению размера выборки на 30-50% без затягивания сроков теста.\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 1. Фреймворк A/B тестирования: MDE, статистическая мощность и расчет выборки\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСамая частая ошибка в A/B тестировании — запуск теста без предварительного расчета размера выборки. \nЕсли выборка слишком мала, тест не имеет достаточной статистической мощности ($1-\\beta = 80\\%$) и пропустит реальный бизнес-эффект (ошибка II рода). \nMDE (Minimum Detectable Effect) — это минимальный прирост метрики, который тест способен надежно зафиксировать."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем необходимый размер выборки для базовой конверсии 8.5% при разных уровнях относительного MDE (от +5% до +20%)."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\ndef calculate_sample_size(p_base, mde_relative, alpha=0.05, power=0.80):\n    \"\"\"Формула Эвана Миллера для расчета размера выборки на одну группу.\"\"\"\n    z_alpha = stats.norm.ppf(1 - alpha / 2)\n    z_beta = stats.norm.ppf(power)\n    p_treat = p_base * (1 + mde_relative)\n    p_pooled = (p_base + p_treat) / 2\n    \n    numerator = (z_alpha * np.sqrt(2 * p_pooled * (1 - p_pooled)) + \n                 z_beta * np.sqrt(p_base * (1 - p_base) + p_treat * (1 - p_treat))) ** 2\n    denominator = (p_treat - p_base) ** 2\n    return int(np.ceil(numerator / denominator))\n\nbase_cr = 0.085  # 8.5%\nfor mde_rel in [0.05, 0.10, 0.15, 0.20]:\n    n = calculate_sample_size(base_cr, mde_rel)\n    print(f\"MDE: +{mde_rel*100:4.1f}% (CR {base_cr*100:.1f}% -> {base_cr*(1+mde_rel)*100:.2f}%) -> Требуется {n:6,d} пользователей на группу\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Кривые мощности (Power Curves) и Закон квадрата\nГрафики ниже наглядно показывают ключевой закон планирования A/B тестов:\n**Чтобы поймать эффект в 2 раза меньше, выборку нужно увеличить в 4 раза!**"}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Планирование A/B теста: Кривые размера выборки и мощности', fontsize=14, fontweight='bold')\n\n# 1. Размер выборки vs Относительный MDE\nax1 = axes[0]\nmde_range = np.linspace(0.03, 0.25, 50)\nsamples_80 = [calculate_sample_size(0.085, mde, power=0.80) for mde in mde_range]\nsamples_90 = [calculate_sample_size(0.085, mde, power=0.90) for mde in mde_range]\n\nax1.plot(mde_range * 100, samples_80, color='#1779ba', linewidth=2.5, label='Мощность 80% (стандарт)')\nax1.plot(mde_range * 100, samples_90, color='#cc4b37', linewidth=2.5, linestyle='--', label='Мощность 90% (высокая)')\n\nn_10 = calculate_sample_size(0.085, 0.10)\nax1.scatter(10, n_10, color='#ffae00', s=100, zorder=5)\nax1.annotate(f'MDE +10%\\nn = {n_10:,}', xy=(10, n_10), xytext=(12, n_10 + 15000),\n             arrowprops=dict(arrowstyle=\"->\", color='#ffae00', lw=2), fontweight='bold')\n\nax1.set_title('Размер выборки на группу в зависимости от желаемого MDE', fontsize=11)\nax1.set_xlabel('Относительный MDE (%)')\nax1.set_ylabel('Пользователей в группе (n)')\nax1.legend()\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Мощность теста при фиксированной выборке n = 15,000\nax2 = axes[1]\nn_fixed = 15000\nz_alpha = stats.norm.ppf(1 - 0.05 / 2)\npowers = []\nfor mde in mde_range:\n    p_treat = base_cr * (1 + mde)\n    se = np.sqrt(base_cr * (1 - base_cr) / n_fixed + p_treat * (1 - p_treat) / n_fixed)\n    z_stat = (p_treat - base_cr) / se\n    pwr = 1 - stats.norm.cdf(z_alpha - z_stat)\n    powers.append(pwr * 100)\n\nax2.plot(mde_range * 100, powers, color='#3adb76', linewidth=2.5)\nax2.axhline(80, color='#767676', linestyle='--', label='Минимальный порог мощности 80%')\nax2.axvline(10.5, color='#cc4b37', linestyle=':', label='MDE порог при n=15,000 (эффект < 10% мы не заметим!)')\nax2.set_title(f'Кривая мощности при фиксированной выборке n = {n_fixed:,}', fontsize=11)\nax2.set_xlabel('Реальный прирост метрики MDE (%)')\nax2.set_ylabel('Вероятность обнаружить эффект (%)')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет длительности теста в днях\nЕсли в сутки интернет-магазин посещают 3,000 пользователей чекаута, за сколько полных дней тест наберет необходимую выборку для MDE = +10% (обе группы суммарно)?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndaily_traffic = 3000\ntotal_needed = n_10 * 2  # для двух групп (A и B)\ntest_days = int(np.ceil(total_needed / daily_traffic))\n\nprint(f\"Всего нужно пользователей: {total_needed:,}\")\nprint(f\"Минимальная длительность теста: {test_days} полных дней ({test_days / 7:.1f} недель)\")\n\nassert test_days >= 7, \"Тест обязан длиться минимум 1 полную неделю для учета сезонности\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Золотое правило длительности теста:\nДаже если калькулятор говорит, что выборка наберется за 2 дня, **никогда не останавливайте тест раньше полных 1-2 недель**. \nВ противном случае вы получите искажение из-за дня недели (паттерны понедельника кардинально отличаются от субботы)."}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 2. Расщепление трафика, A/A тесты и проверка SRM (Sample Ratio Mismatch)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\n\n## 📌 Бизнес-контекст и методология\nSRM (Sample Ratio Mismatch) — это «убийца» A/B тестов. \nЕсли вы настраивали сплит 50/50, а получили 51.5% на 48.5%, радоваться нельзя. В 99% случаев это означает баг сплиттера: падение страницы Б на старых айфонах, фильтрацию ботов или ошибку редиректа. \nЛюбой A/B тест с подтвержденным SRM объявляется недействительным."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПроверим реальный датасет нашего курса на предмет SRM с помощью критерия согласия Хи-квадрат Пирсона ($\\chi^2$)."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\n\ndf_ab = pd.read_csv(ab_csv)\ncounts = df_ab['test_group'].value_counts()\nn_a, n_b = counts['A_Control'], counts['B_Variant']\nn_total = n_a + n_b\nexpected = [n_total / 2, n_total / 2]\nobserved = [n_a, n_b]\n\nchi2_stat, p_srm = stats.chisquare(observed, f_exp=expected)\n\nprint(f\"Группа A (Control):   {n_a:,} ({n_a/n_total:.2%})\")\nprint(f\"Группа B (Treatment): {n_b:,} ({n_b/n_total:.2%})\")\nprint(f\"Хи-квадрат стат: {chi2_stat:.3f}, p-value: {p_srm:.4f}\")\n\nif p_srm < 0.01:\n    print(\"🚨 КРИТИЧЕСКИЙ SRM ОБНАРУЖЕН! Тест скомпрометирован.\")\nelse:\n    print(\"✅ SRM отсутствует: трафик распределен корректно 50/50.\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Распределение p-value в серии A/A тестов\nКак проверить, что сплиттер работает безупречно? Запустить 1,000 синтетических A/A тестов (где эффект равен 0).\n**В идеальном сплиттере распределение p-value обязано быть строго равномерным (Uniform [0, 1]).** \nЕсли у нуля виден пик (скошенность), ваш инструмент A/B тестирования выдает ложные победы!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Проверка сплиттера: Хи-квадрат SRM и распределение p-value в A/A тестах', fontsize=14, fontweight='bold')\n\n# 1. SRM Визуализация долей\nax1 = axes[0]\nbars = ax1.bar(['Контроль A (50%)', 'Вариант B (50%)'], [n_a, n_b], color=['#1779ba', '#3adb76'], width=0.5, edgecolor='white')\nax1.axhline(n_total / 2, color='#cc4b37', linestyle='--', linewidth=2, label=f'Идеальный баланс = {n_total/2:.0f}')\nax1.set_title(f'Фактический сплит трафика (p = {p_srm:.4f})', fontsize=11)\nax1.set_ylabel('Количество визитов')\nax1.legend()\nfor b in bars:\n    h = b.get_height()\n    ax1.annotate(f'{h:,}\\n({h/n_total:.2%})', xy=(b.get_x() + b.get_width()/2, h/2), ha='center', color='white', fontweight='bold')\n\n# 2. Моделирование 1,000 A/A тестов\nax2 = axes[1]\nnp.random.seed(42)\naa_p_values = []\nfor _ in range(1000):\n    sample_a = np.random.normal(50, 10, 200)\n    sample_b = np.random.normal(50, 10, 200)\n    _, p = stats.ttest_ind(sample_a, sample_b)\n    aa_p_values.append(p)\n\nax2.hist(aa_p_values, bins=20, color='#1779ba', alpha=0.7, edgecolor='white', density=True)\nax2.axhline(1.0, color='#cc4b37', linestyle='--', linewidth=2, label='Идеальное равномерное распределение')\nax2.axvspan(0, 0.05, color='#cc4b37', alpha=0.25, label='Ошибка I рода α = 5% (ровно 5% тестов ложно значимы)')\nax2.set_title('Распределение p-value в 1,000 A/A тестах', fontsize=11)\nax2.set_xlabel('p-value')\nax2.set_ylabel('Плотность')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля ложноположительных исходов в A/A тесте\nПосчитайте фактический процент A/A тестов из сгенерированной тысячи, у которых `p_value < 0.05`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nfalse_positives = sum(1 for p in aa_p_values if p < 0.05)\nfpr = false_positives / len(aa_p_values)\n\nprint(f\"Количество ложных тревог: {false_positives} из {len(aa_p_values)}\")\nprint(f\"Фактический False Positive Rate: {fpr:.2%}\")\n\nassert 0.03 <= fpr <= 0.07, \"FPR в корректном A/A тесте обязан быть около 5%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Что делать, если обнаружен SRM?\n1. Не анализируйте метрики — результаты искажены.\n2. Проверьте сплит по срезам (браузеры, страны, операционные системы).\n3. Часто SRM возникает, когда тестовая страница дольше грузится и пользователи с медленным интернетом отваливаются до регистрации события."}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 3. Оценка метрик: пропорции (Z-тест) vs непрерывные метрики (ARPU / Bootstrap)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМетрики бывают двух принципиально разных типов:\n1. **Бинарные (пропорции):** Конверсия в клик (CTR), конверсия в покупку (CR), отток. Анализируются через двухвыборочный Z-тест пропорций.\n2. **Непрерывные (со скошенным распределением):** ARPU, средний чек, LTV. Анализируются через Бутстрап (Bootstrap) или линеаризацию."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним конверсию двух вариантов чекаута через двухвыборочный Z-тест пропорций и оценим бутстрапом разницу в выручке на пользователя."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\nimport numpy as np\n\ndf_ab = pd.read_csv(ab_csv)\n\nconv_a = df_ab[df_ab['test_group'] == 'A_Control']['converted'].sum()\nn_a = len(df_ab[df_ab['test_group'] == 'A_Control'])\nconv_b = df_ab[df_ab['test_group'] == 'B_Variant']['converted'].sum()\nn_b = len(df_ab[df_ab['test_group'] == 'B_Variant'])\n\ncr_a = conv_a / n_a\ncr_b = conv_b / n_b\n\np_pool = (conv_a + conv_b) / (n_a + n_b)\nse_pool = np.sqrt(p_pool * (1 - p_pool) * (1 / n_a + 1 / n_b))\nz_stat = (cr_b - cr_a) / se_pool\np_val_cr = 2 * (1 - stats.norm.cdf(abs(z_stat)))\n\nprint(f\"Конверсия A (Control):   {cr_a:.2%}\")\nprint(f\"Конверсия B (Treatment): {cr_b:.2%}\")\nprint(f\"Абсолютный прирост:      {(cr_b - cr_a)*100:+.2f} п.п. (p-value: {p_val_cr:.4f})\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Доверительные интервалы конверсии и Бутстрап ARPU\nГрафики ниже показывают доверительные интервалы для конверсий и бутстрап-распределение разницы средней выручки на пользователя."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Оценка метрик A/B теста: Конверсия (Z-тест) и Выручка (Бутстрап)', fontsize=14, fontweight='bold')\n\n# 1. Доверительные интервалы конверсий\nax1 = axes[0]\nse_a = np.sqrt(cr_a * (1 - cr_a) / n_a)\nse_b = np.sqrt(cr_b * (1 - cr_b) / n_b)\n\nci_a = (cr_a - 1.96 * se_a, cr_a + 1.96 * se_a)\nci_b = (cr_b - 1.96 * se_b, cr_b + 1.96 * se_b)\n\nax1.errorbar(['Контроль A', 'Тест B'], [cr_a * 100, cr_b * 100],\n             yerr=[[ (cr_a - ci_a[0])*100, (cr_b - ci_b[0])*100 ],\n
