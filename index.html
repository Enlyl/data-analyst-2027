<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analyst 2027</title>

  <!-- Foundation (ZURB) Design System Typography: Helvetica Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Favicon -->

  <!-- Marked + Prism -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <style>
    /* ===== FOUNDATION (ZURB) DESIGN SYSTEM TOKENS ===== */
    :root {
      /* Foundation Palette */
      --foundation-primary: #1779ba;
      --foundation-primary-hover: #126195;
      --foundation-secondary: #767676;
      --foundation-success: #3adb76;
      --foundation-warning: #ffae00;
      --foundation-alert: #cc4b37;
      --foundation-black: #0a0a0a;
      --foundation-white: #fefefe;
      --foundation-medium-gray: #cacaca;
      --foundation-light-gray: #f4f4f4;
      --foundation-subtle-blue: #eef6fb;

      /* Semantic Mappings */
      --bg-base: #f4f4f4;
      --bg-surface: #fefefe;
      --bg-card: #fefefe;
      --bg-card-hover: #f0f7fb;
      --bg-deep: #e6e6e6;
      --border: #cacaca;
      --border-focus: #1779ba;
      --text-main: #0a0a0a;
      --text-secondary: #333333;
      --text-muted: #767676;
      --text-dim: #8a8a8a;
      --accent: #1779ba;
      --accent-hover: #126195;
      --success: #3adb76;
      --error: #cc4b37;
      --warning: #ffae00;
      --code-bg: #1e1e1e;
      --code-text: #fefefe;

      /* Typography */
      --font-body: 'Helvetica Neue', Helvetica, Roboto, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;

      /* Type Scale (Foundation Spec) */
      --text-h1: 48px;
      --line-h1: 62px;
      --text-h2: 40px;
      --line-h2: 52px;
      --text-h3: 31px;
      --line-h3: 40px;
      --text-body: 16px;
      --line-body: 24px;

      /* Spacing rhythm */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;

      /* Radius: Foundation default is strictly 3px */
      --radius-default: 3px;
      --radius-pill: 3px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ===== RESET ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--foundation-primary);
    }

    .brand svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* Progress */
    .progress-wrap { margin-top: 16px; }
    .progress-bar {
      background: var(--bg-deep);
      border-radius: var(--radius-default);
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--foundation-primary);
      height: 100%;
      width: 0%;
      transition: width 400ms var(--ease);
      border-radius: var(--radius-default);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Search */
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .search-input {
      width: 100%;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 8px 12px 8px 36px;
      font-size: 14px;
      color: var(--text-main);
      font-family: var(--font-body);
      outline: none;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .search-input:focus {
      border-color: var(--foundation-primary);
      box-shadow: 0 0 4px rgba(23, 121, 186, 0.35);
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    /* Module list */
    .module-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-surface);
    }
    .module-list::-webkit-scrollbar { width: 5px; }
    .module-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cat-group { margin-bottom: 4px; }
    .cat-label {
      padding: 12px 20px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--foundation-secondary);
    }

    .mod-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 150ms var(--ease);
      border-left: 3px solid transparent;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .mod-item:hover {
      background: var(--bg-card-hover);
    }
    .mod-item.active {
      background: var(--foundation-subtle-blue);
      border-left-color: var(--foundation-primary);
      color: var(--foundation-primary);
      font-weight: 600;
    }
    .mod-item .mod-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .mod-item .mod-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-default);
      background: var(--bg-deep);
      color: var(--text-secondary);
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid #d4d4d4;
    }
    .mod-item.active .mod-badge {
      background: #dbebf6;
      color: var(--foundation-primary);
      border-color: #bcd9ee;
    }
    .mod-item .check-done {
      color: var(--foundation-success);
      font-size: 14px;
      margin-left: 4px;
      font-weight: bold;
    }

    /* ===== MAIN CONTENT ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Top bar (Foundation Top-Bar Style) */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      min-height: 56px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.04);
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--foundation-black);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      padding: 0 32px;
    }
    .tab {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
      white-space: nowrap;
    }
    .tab:hover { color: var(--foundation-primary); }
    .tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
    }

    /* Content area */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-base);
    }
    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== HERO (Foundation Style) ===== */
    .hero {
      text-align: center;
      padding: 64px 32px 48px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: var(--radius-default);
      border: 1px solid var(--border);
      background: var(--foundation-subtle-blue);
      font-size: 12px;
      font-weight: 700;
      color: var(--foundation-primary);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: var(--text-h1);
      line-height: var(--line-h1);
      font-weight: 700;
      max-width: 720px;
      margin: 0 auto 20px;
      color: var(--foundation-black);
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: 18px;
      line-height: 28px;
      color: var(--foundation-secondary);
      max-width: 680px;
      margin: 0 auto 36px;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .hero-stat {
      text-align: center;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 16px 28px;
      min-width: 160px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.05);
    }
    .hero-stat-num {
      font-size: var(--text-h2);
      line-height: var(--line-h2);
      font-weight: 700;
      color: var(--foundation-primary);
      font-family: var(--font-body);
    }
    .hero-stat-label {
      font-size: 13px;
      line-height: 18px;
      color: var(--foundation-secondary);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ===== NOTEBOOK LESSON VIEW ===== */
    .lesson-header {
      margin-bottom: 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .lesson-header h2 {
      font-size: var(--text-h3);
      line-height: var(--line-h3);
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--foundation-black);
    }
    .lesson-header .lesson-desc {
      font-size: 16px;
      line-height: 24px;
      color: var(--foundation-secondary);
    }

    /* Foundation Button */
    .colab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--foundation-primary);
      border: 1px solid var(--foundation-primary-hover);
      border-radius: var(--radius-default);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      text-decoration: none;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.1);
    }
    .colab-btn:hover {
      background: var(--foundation-primary-hover);
      border-color: #0e4c75;
      color: #ffffff;
    }
    .colab-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Notebook sub-tabs */
    .nb-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nb-tab {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      border-radius: var(--radius-default) var(--radius-default) 0 0;
      transition: color 150ms var(--ease), background 150ms var(--ease);
      font-family: var(--font-body);
      white-space: nowrap;
    }
    .nb-tab:hover {
      color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }
    .nb-tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }

    /* Cell rendering */
    .cell {
      margin-bottom: 16px;
      border-radius: var(--radius-default);
      overflow: hidden;
    }
    .cell-md {
      padding: 20px 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      font-size: 16px;
      line-height: 24px;
      color: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.03);
    }
    .cell-md h1, .cell-md h2, .cell-md h3, .cell-md h4 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .cell-md h1 { font-size: 30px; line-height: 38px; }
    .cell-md h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .cell-md h3 { font-size: 20px; line-height: 28px; }
    .cell-md h4 { font-size: 17px; line-height: 24px; }
    .cell-md p { margin-bottom: 12px; }
    .cell-md ul, .cell-md ol { padding-left: 24px; margin-bottom: 12px; }
    .cell-md li { margin-bottom: 4px; }
    .cell-md code {
      background: var(--bg-deep);
      color: var(--foundation-black);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .cell-md pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 12px;
      border: 1px solid #333333;
    }
    .cell-md pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .cell-md blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .cell-md table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background: var(--foundation-white);
    }
    .cell-md th, .cell-md td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
    }
    .cell-md th {
      background: var(--bg-deep);
      font-weight: 700;
      color: var(--foundation-black);
    }
    .cell-md strong { color: var(--foundation-black); font-weight: 700; }
    .cell-md a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .cell-md a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }

    .cell-code {
      position: relative;
      background: var(--code-bg);
      border: 1px solid #333333;
      border-radius: var(--radius-default);
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.12);
    }
    .cell-code-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #999999;
      border-bottom: 1px solid #333333;
      background: #181818;
      font-family: var(--font-mono);
      border-radius: var(--radius-default) var(--radius-default) 0 0;
    }
    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #444444;
      border-radius: var(--radius-default);
      color: #cccccc;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }
    .copy-btn:hover { color: #ffffff; background: #3a3a3a; border-color: #666666; }
    .cell-code pre {
      padding: 16px;
      overflow-x: auto;
      margin: 0;
      font-size: 14px;
      line-height: 22px;
      color: #fefefe;
    }
    .cell-code code {
      font-family: var(--font-mono);
    }

    /* ===== README / QUIZ / CHEATSHEET views ===== */
    .md-view {
      max-width: 860px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 28px 32px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .md-view h1, .md-view h2, .md-view h3 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .md-view h1 { font-size: 30px; line-height: 38px; }
    .md-view h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md-view h3 { font-size: 20px; line-height: 28px; }
    .md-view p { margin-bottom: 12px; color: var(--text-secondary); font-size: 16px; line-height: 24px; }
    .md-view ul, .md-view ol { padding-left: 24px; margin-bottom: 12px; color: var(--text-secondary); }
    .md-view li { margin-bottom: 6px; font-size: 16px; line-height: 24px; }
    .md-view code {
      background: var(--bg-deep);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .md-view pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
      border: 1px solid #333333;
    }
    .md-view pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .md-view blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .md-view strong { color: var(--foundation-black); font-weight: 700; }
    .md-view a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .md-view a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }
    .md-view table { width: 100%; border-collapse: collapse; margin: 14px 0; }
    .md-view th, .md-view td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
    .md-view th { background: var(--bg-deep); font-weight: 700; color: var(--foundation-black); }
    .md-view hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ===== QUIZ INTERACTIVE ===== */
    .quiz-question {
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .quiz-question h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--foundation-black);
    }
    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-default);
      cursor: pointer;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: var(--foundation-white);
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      border-color: var(--foundation-primary);

const GITHUB_BASE = "https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main";
const COURSE = [{"id": "module_00_onboarding", "title": "Модуль 0. Онбординг и мышление аналитика", "cat": "Фундамент", "badge": "Старт", "icon": "🚀", "desc": "Инструменты, майндсет AI-эры, постановка ТЗ и первая тетрадь в Colab.", "readme": "# 🚀 Модуль 0: Онбординг и мышление Data Analyst 2027\n\n## 📌 О модуле\nДобро пожаловать в профессию! Аналитика данных образца 2027 года фундаментально отличается от того, что было 5 лет назад. Рутинный синтаксис SQL и Python берет на себя искусственный интеллект, а от аналитика требуются **Problem Framing**, архитектурное понимание данных, формулирование ТЗ для AI и глубокое бизнес-видение.\n\n## 🎯 Learning Outcomes (Таксономия Блума)\n- **Remember**: Терминология (Data Analyst vs Data Scientist, CRISP-DM, EDA, KPI, Pipeline).\n- **Understand**: Отличия роли аналитика до и после AI-революции; архитектуру современного стека данных.\n- **Apply**: Развертывание рабочего окружения в Google Colab, подключение AI-ассистентов, создание первого репозитория на GitHub.\n- **Analyze**: Декомпозиция сырой проблемы бизнеса в систему метрик и аналитических задач.\n\n## 📚 Содержание уроков\n1. `lesson_01_role_data_analyst_2027.ipynb` — Профессия аналитика в эпоху AI: ландшафт рынка, карта компетенций, день из жизни.\n2. `lesson_02_environment_setup_colab_ai.ipynb` — Среда разработки: Google Colab, VS Code, Git, настройка Copilot/Cursor/Claude.\n3. `lesson_03_analytical_thinking_crisp_dm.ipynb` — Аналитическое мышление: методология CRISP-DM, перевод бизнес-боли в метрики.\n4. `quiz.md` — Тест для самопроверки (Active Recall).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 0 (Онбординг & Аналитическое мышление)\n\n---\n\n### Вопрос 1\nВ чем заключается фундаментальное отличие роли Data Analyst 2027 года от роли 2020 года?\n- [ ] В 2027 году аналитики больше не используют базы данных и SQL.\n- [x] В 2027 году рутинное написание кода автоматизировано AI, а фокус сместился на Problem Framing, постановку ТЗ для LLM, фактчекинг и Data Storytelling.\n- [ ] В 2027 году аналитик обязан обучать собственные нейросети на суперкомпьютере.\n*Объяснение*: Рутинный синтаксис генерируют LLM. Главная ценность человека — перевод бизнес-проблем в метрики, критический аудит кода и коммуникация решений с топ-менеджментом.\n\n---\n\n### Вопрос 2\nРуководство компании жалуется: *«В этом месяце выручка упала на 10%, срочно удвойте расходы на маркетинг»*. Каково первое действие профессионального аналитика?\n- [ ] Сразу согласовать бюджет и запустить рекламу.\n- [x] Декомпозировать выручку на метрики Traffic * CR * AOV, сегментировать данные по платформам/каналам и локализовать причину падения.\n- [ ] Построить круговую диаграмму продаж.\n*Объяснение*: Если просадка вызвана техническим багом в чекауте или падением среднего чека, заливка нового рекламного трафика лишь сожжет деньги компании без роста продаж.\n\n---\n\n### Вопрос 3\nКакой этап методологии CRISP-DM является первым и самым важным для успеха проекта?\n- [ ] Data Preparation (Очистка данных).\n- [ ] Modeling (Построение моделей).\n- [x] Business Understanding (Понимание бизнес-контекста и целей).\n*Объяснение*: Не поняв экономический смысл задачи и решение, которое будет приниматься, аналитик рискует построить идеальный технический отчет, который окажется бесполезен бизнесу.\n\n---\n\n### Вопрос 4\nВ чем главная опасность слепого доверия AI-ассистентам при формулировании аналитических выводов?\n- [ ] Модели работают слишком медленно.\n- [x] AI может выдать правдоподобно звучащую, но математически ложную семантическую галлюцинацию (неверный знаменатель дроби, игнорирование фильтра).\n- [ ] AI требует слишком много электроэнергии.\n*Объяснение*: Аналитик несет персональную ответственность перед бизнесом; любые расчеты AI требуют валидации инвариантов.\n\n---\n\n### Вопрос 5\nЧто такое 'Business Understanding' в цикле анализа данных?\n- [ ] Заучивание имен топ-менеджеров компании.\n- [x] Понимание бизнес-модели компании, ключевых метрик выручки и того, какое конкретно управленческое решение будет принято по результатам исследования.\n- [ ] Установка офисных программ.\n*Объяснение*: Без понимания сути бизнеса даже идеальный с технической точки зрения дашборд окажется бесполезным.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_what_is_data_analyst.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Урок 1. Кто такой Data Analyst в 2027 году: от написания кода к AI-оркестрации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году ценность аналитика больше не измеряется скоростью набора синтаксиса `pd.read_csv` или умением вручную писать вложенные циклы. LLM-модели (Claude 3.7/4.6, GPT-5, Gemini 2.5) генерируют рутинный код за секунды.\n\n**Ключевой сдвиг профессии:**\n1. **Problem Framing (Постановка задачи):** Перевод абстрактных болей бизнеса («почему падают продажи?») в математические метрики (AOV, LTV, CR по когортам).\n2. **AI-Orchestration & Tool Use:** Формулирование ТЗ для AI-ассистентов, генерация запросов через Cursor/Copilot, анализ неструктурированных данных.\n3. **Критический аудит и фактчекинг:** Выявление скрытых галлюцинаций LLM, проверка краевых условий (NULL, дубликаты, сдвиг часовых поясов).\n4. **Data Storytelling & Minto Pyramid:** Защита инсайтов перед топ-менеджментом на языке денег, а не технических терминов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример 2027: Декомпозиция бизнес-метрики выручки (Revenue = Traffic * CR * AOV)\ntraffic = 150000       # Визитов в месяц\nconversion_rate = 0.024 # Конверсия в покупку (2.4%)\naov = 3450             # Средний чек (руб.)\n\nrevenue = traffic * conversion_rate * aov\nprint(f\"📊 Текущая выручка: {revenue:,.0f} руб.\")\n\n# Моделирование сценариев роста: что даст больший прирост выручки?\nrev_a = traffic * (conversion_rate + 0.003) * aov\nrev_b = traffic * conversion_rate * (aov * 1.10)\n\nprint(f\"📈 Сценарий A (+0.3% CR): {rev_a:,.0f} руб. (Прирост: +{rev_a - revenue:,.0f} руб.)\")\nprint(f\"📈 Сценарий B (+10% AOV): {rev_b:,.0f} руб. (Прирост: +{rev_b - revenue:,.0f} руб.)\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка уязвимости воронки\nРуководство планирует запустить скидочную акцию, которая поднимет конверсию с 2.4% до 3.0%, но снизит средний чек на 15% из-за промокодов.\nНапишите расчет и определите: выгодна ли эта акция компании при том же трафике (150 000 визитов)?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntraffic = 150000\nnew_cr = 0.030\nnew_aov = 3450 * 0.85\n\npromo_revenue = traffic * new_cr * new_aov\nbase_revenue = 150000 * 0.024 * 3450\ndiff = promo_revenue - base_revenue\n\nprint(f\"Выручка по акции: {promo_revenue:,.0f} руб.\")\nprint(f\"Разница с базовой: {diff:,.0f} руб.\")\n\nassert promo_revenue > 0, \"Выручка должна быть больше нуля\"\nassert diff > 0, \"Акция выгодна: прирост положительный!\"\nprint(\"✅ Тест успешно пройден: акция экономически оправдана!\")\n"}, {"type": "markdown", "content": "### 💡 Промпт для AI-ассистента (Problem Framing)\n> *«Действуй как Lead Product Analyst. У меня есть e-commerce воронка со следующими вводными: Трафик = 150к, CR = 2.4%, AOV = 3450 руб. Мы тестируем скидку 15%, ожидаем рост CR до 3.0%. Рассчитай точку безубыточности (Break-Even CR), при которой выручка не упадет, и выдели 3 риска этой акции (каннибализация, отток лояльных, задержка повторных заказов). Выведи ответ по методологии пирамиды Минто.»*"}]}, {"filename": "lesson_02_environment_setup_colab_ai.ipynb", "rel_path": "course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Урок 2. Рабочее окружение 2027: Google Colab, библиотеки и AI-помощники\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb)\n\n## 📌 Бизнес-контекст и методология\nGoogle Colab — стандарт индустрии для прототипирования, командного ревью и воспроизводимых исследований. В облаке доступны бесплатные GPU, среда Linux и интеграция с GitHub."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import platform\nimport pandas as pd\nimport numpy as np\n\nprint(f\"🐍 Python версия: {platform.python_version()}\")\nprint(f\"📦 Pandas версия: {pd.__version__}\")\nprint(f\"⚡ NumPy версия:  {np.__version__}\")\n\ndf_test = pd.DataFrame({\n    \"metric\": [\"LTV\", \"CAC\", \"ROI\", \"Retention 30d\"],\n    \"target_2027\": [12500, 3200, 3.9, 0.42]\n})\ndf_test\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка среды и математические расчеты\nСоздайте массив NumPy с целевыми значениями месячной выручки на 6 месяцев (от 1.0 млн до 2.5 млн с равным шагом). Рассчитайте кумулятивную сумму выручки за полугодие."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nimport numpy as np\n\nmonthly_targets = np.linspace(1_000_000, 2_500_000, 6)\ncumulative_revenue = np.cumsum(monthly_targets)\n\nprint(\"Ежемесячные цели:\", monthly_targets)\nprint(\"Кумулятивная выручка:\", cumulative_revenue)\n\nassert len(monthly_targets) == 6, \"Должно быть ровно 6 месяцев\"\nassert cumulative_revenue[-1] == 10_500_000, \"Сумма за 6 месяцев должна быть 10.5 млн\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Шпаргалка горячих клавиш Google Colab\n* `Shift + Enter`: Выполнить текущую ячейку и перейти к следующей.\n* `Ctrl + M + B`: Добавить новую ячейку кода снизу.\n* `Ctrl + M + M`: Преобразовать текущую ячейку в Markdown.\n* `Ctrl + /`: Закомментировать / раскомментировать строку."}]}, {"filename": "lesson_03_analytical_thinking_crisp_dm.ipynb", "rel_path": "course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Урок 3. Аналитическое мышление и методология CRISP-DM в e-commerce\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМетодология **CRISP-DM** (Cross-Industry Standard Process for Data Mining) — проверенный стандарт ведения аналитических проектов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\ntables_query = \"SELECT name FROM sqlite_master WHERE type='table';\"\ntables = pd.read_sql_query(tables_query, conn)\nprint(\"📋 Таблицы в нашей базе данных:\")\nprint(tables)\n\ndf_customers = pd.read_sql_query(\"SELECT * FROM customers LIMIT 5;\", conn)\ndf_customers\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Аудит каналов привлечения\nПосчитайте распределение клиентов по каналам привлечения (`acquisition_channel`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery = \"\"\"\nSELECT \n    acquisition_channel,\n    COUNT(customer_id) AS total_customers\nFROM customers\nGROUP BY acquisition_channel\nORDER BY total_customers DESC;\n\"\"\"\n\ndf_channels = pd.read_sql_query(query, conn)\nprint(df_channels)\n\nassert not df_channels.empty, \"Датафрейм не должен быть пустым\"\nassert \"acquisition_channel\" in df_channels.columns, \"Колонка acquisition_channel обязательна\"\nassert df_channels[\"total_customers\"].sum() > 0, \"Должны быть клиенты\"\nprint(\"✅ Тест успешно пройден: каналы привлечения проанализированы!\")\n"}, {"type": "markdown", "content": "### 💼 Реальный кейс: Перевод бизнес-задачи в аналитическую метрику\nСтейкхолдер говорит: *«Наш органический поиск стал хуже работать»*.\n* **Верный ответ по CRISP-DM**: фиксируем период (LFL / MoM), декомпозируем на Сессии, CR, AOV, долю новых vs повторных покупателей."}]}]}, {"id": "module_01_excel", "title": "Модуль 1. Excel и Google Sheets", "cat": "Хард база", "badge": "Таблицы", "icon": "📊", "desc": "ВПР, XLOOKUP, сводные таблицы, формулы массивов и аудит вычислений.", "readme": "# 📊 Модуль 1: Excel и Google Sheets — Фундамент работы с данными\n\n## 📌 О модуле\nExcel и Google Sheets остаются главным языком коммуникации бизнеса. Топ-менеджеры, финансисты и маркетологи думают таблицами. Аналитик обязан уметь быстро рассчитывать срезы, собирать сводные таблицы и формулировать промпты для генерации сложных формул в Copilot.\n\n## 🎯 Learning Outcomes\n- **Understand**: Структуру плоских таблиц (tidy data), принципы адресации ($A$1 vs A1).\n- **Apply**: Функции `SUMIFS`, `COUNTIFS`, `XLOOKUP`, `INDEX+MATCH`, вложенные условия.\n- **Analyze**: Сводные таблицы (Pivot Tables), вычисляемые поля, когортные группировки.\n- **Create**: Интерактивные отчеты с визуализацией и срезами (Slicers); формулы через AI Copilot.\n\n## 📚 Уроки\n1. `lesson_01_interface_basics_formatting.ipynb` — Интерфейс, горячие клавиши, типы данных, условное форматирование.\n2. `lesson_02_formulas_functions_xlookup.ipynb` — Библиотека формул: математика, логика, текст, даты, современный XLOOKUP.\n3. `lesson_03_pivot_tables_aggregations.ipynb` — Сводные таблицы: многоуровневая группировка, % от общего, срезы.\n4. `lesson_04_visualization_data_story.ipynb` — Построение диаграмм по стандартам Тафти (Tufte): устранение визуального шума.\n5. `lesson_05_ai_copilot_excel_formulas.ipynb` — Промпт-инжиниринг для формул Excel, генерация Google Apps Script, валидация.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Справочник главных формул.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 1 (Excel)\n\n### Вопрос 1\nВ чем ключевое преимущество `XLOOKUP` перед `VLOOKUP`?\n- [ ] XLOOKUP работает быстрее ровно в 10 раз\n- [x] Искомый столбец может находиться левее возвращаемого, формула не ломается при добавлении столбцов\n- [ ] XLOOKUP работает только с числами\n\n### Вопрос 2\nЧто произойдет при копировании формулы `=A$1 + 10` вниз на 5 строк?\n- [ ] Ссылка сместится на A6\n- [x] Номер строки зафиксирован знаком $, ссылка останется на ячейку A1\n- [ ] Выдаст ошибку #REF!\n\n### Вопрос 3\nПочему в профессиональных отчетах избегают 3D круговых диаграмм (Pie Charts)?\n- [ ] Они занимают слишком много памяти на компьютере\n- [x] Они искажают пропорции восприятия долей и перегружают внимание визуальным мусором\n- [ ] Их не поддерживает Excel\n\n---\n\n### Вопрос 4\nВ чем преимущество функции XLOOKUP (ПРОСМОТРX) перед классическим VLOOKUP (ВПР)?\n- [ ] XLOOKUP работает только с числами.\n- [x] XLOOKUP может искать влево, не ломается при вставке/удалении промежуточных колонок и имеет встроенную обработку ошибок (if_not_found).\n- [ ] VLOOKUP больше не поддерживается в Excel.\n*Объяснение*: XLOOKUP устойчив к структурным изменениям таблицы и более интуитивен по аргументам.\n\n---\n\n### Вопрос 5\nПочему при расчете среднего чека в сводной таблице опасно брать 'Среднее по столбцу Total'?\n- [ ] Excel округляет средние до целых чисел.\n- [x] Если в строках таблицы содержатся товарные позиции заказа (order items), а не уникальные чеки, расчет усреднит стоимость позиций, а не средний чек заказа.\n- [ ] Сводные таблицы не умеют вычислять среднее.\n*Объяснение*: Уровень детализации (гранулярность) таблицы определяет корректность агрегации.\n", "cheatsheet": "# 📋 Excel & Sheets Cheatsheet\n\n| Задача | Формула |\n|---|---|\n| Поиск значения | `=XLOOKUP(F2, A:A, C:C, \"Не найдено\")` |\n| Сумма с условием | `=SUMIFS(D:D, A:A, \"Completed\", B:B, \">=\"&DATE(2026,1,1))` |\n| Количество уникальных | `=COUNTA(UNIQUE(FILTER(B:B, A:A=\"Completed\")))` |\n| Безопасный расчет | `=IFERROR(A2 / B2, 0)` |\n| Склейка текста | `=TEXTJOIN(\" - \", TRUE, A2, B2)` |\n", "notebooks": [{"filename": "lesson_01_interface_basics_formatting.ipynb", "rel_path": "course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 1. Архитектура современных электронных таблиц и культура работы с данными\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭлектронные таблицы (Excel и Google Sheets) остаются главным инструментом быстрой коммуникации со стейкхолдерами."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\norders_path = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\ndf_orders = pd.read_csv(orders_path)\n\nprint(f\"Строк в таблице: {len(df_orders):,}\")\nprint(\"Типы данных колонок:\")\nprint(df_orders.dtypes)\n\ndf_orders.head()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка целостности типов данных\nПреобразуйте колонку `order_date` в формат datetime и найдите диапазон дат."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_orders['order_date'] = pd.to_datetime(df_orders['order_date'])\n\nmin_date = df_orders['order_date'].min()\nmax_date = df_orders['order_date'].max()\n\nprint(f\"Период наблюдений: с {min_date.date()} по {max_date.date()}\")\n\nassert pd.api.types.is_datetime64_any_dtype(df_orders['order_date']), \"order_date должен быть datetime!\"\nprint(\"✅ Тест успешно пройден: даты нормализованы!\")\n"}, {"type": "markdown", "content": "### 💡 Золотые правила «чистых таблиц»\n1. 1 строка = 1 наблюдение, 1 столбец = 1 атрибут.\n2. Никаких объединенных ячеек внутри массивов данных."}]}, {"filename": "lesson_02_formulas_functions_xlookup.ipynb", "rel_path": "course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 2. Продвинутые формулы: XLOOKUP, INDEX/MATCH и векторные вычисления\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВПР (`VLOOKUP`) морально устарел. Современный стандарт Excel и Sheets — функция **`XLOOKUP`**."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\nitems_path = ensure_dataset(\"order_items.csv\", subfolder=\"raw\")\nproducts_path = ensure_dataset(\"products.csv\", subfolder=\"raw\")\n\ndf_items = pd.read_csv(items_path)\ndf_products = pd.read_csv(products_path)\n\n# Аналог =XLOOKUP(df_items.product_id, df_products.product_id, df_products.price)\ndf_merged = df_items.merge(df_products, on=\"product_id\", how=\"left\")\ndf_merged[['order_item_id', 'order_id', 'product_name', 'quantity', 'price', 'total_amount']].head()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет себестоимости и валовой прибыли\nРассчитайте:\n1. Себестоимость позиции: `total_cost = quantity * cost`\n2. Валовую прибыль позиции: `gross_profit = total_amount - total_cost`\n3. Общую валовую прибыль."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_merged['total_cost'] = df_merged['quantity'] * df_merged['cost']\ndf_merged['gross_profit'] = df_merged['total_amount'] - df_merged['total_cost']\n\ntotal_profit = df_merged['gross_profit'].sum()\nprint(f\"💰 Общая валовая прибыль: {total_profit:,.2f} руб.\")\n\nassert total_profit > 0, \"Прибыль должна быть положительной\"\nassert 'gross_profit' in df_merged.columns, \"Колонка gross_profit обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Синтаксис формулы XLOOKUP\n```excel\n=XLOOKUP(C2, Products!$A:$A, Products!$D:$D, 0, 0)\n```"}]}, {"filename": "lesson_03_pivot_tables_aggregations.ipynb", "rel_path": "course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 3. Сводные таблицы (Pivot Tables) и многомерные срезы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСводные таблицы позволяют за секунды сгруппировать миллионы строк по категориям и статусам."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\nitems_path = ensure_dataset(\"order_items.csv\", subfolder=\"raw\")\nproducts_path = ensure_dataset(\"products.csv\", subfolder=\"raw\")\norders_path = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\n\nitems = pd.read_csv(items_path)\nproducts = pd.read_csv(products_path)\norders = pd.read_csv(orders_path)\n\ndf = items.merge(products, on=\"product_id\").merge(orders, on=\"order_id\")\n\npivot_report = pd.pivot_table(\n    df,\n    values='total_amount',\n    index='category',\n    columns='status',\n    aggfunc='sum',\n    fill_value=0,\n    margins=True,\n    margins_name='Итого'\n)\npivot_report.style.format('{:,.0f} руб.')\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля завершенной выручки по категориям\nПостройте сводную таблицу и рассчитайте долю статуса `Completed` в общей сумме продаж категории."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncat_summary = df.groupby(['category', 'status'])['total_amount'].sum().unstack(fill_value=0)\ncat_summary['total'] = cat_summary.sum(axis=1)\nif 'Completed' in cat_summary.columns:\n    cat_summary['completed_rate'] = cat_summary['Completed'] / cat_summary['total']\nelse:\n    cat_summary['completed_rate'] = 1.0\n\nprint(cat_summary[['total', 'completed_rate']])\n\nassert 'completed_rate' in cat_summary.columns, \"Колонка completed_rate обязательна\"\nassert (cat_summary['completed_rate'] <= 1.0).all(), \"Доля не может превышать 100%\"\nprint(\"✅ Тест успешно пройден: конверсия рассчитана!\")\n"}, {"type": "markdown", "content": "### 💼 Calculated Fields\nСоздавайте расчетные поля вида `= SUM(Revenue) / COUNT(Orders)` вместо усреднения средних значений."}]}, {"filename": "lesson_04_visualization_data_story.ipynb", "rel_path": "course/module_01_excel/lesson_04_visualization_data_story.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 4. Визуализация в таблицах и ликвидация Chart Junk\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_04_visualization_data_story.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭдвард Тафти ввел понятие **Chart Junk** — визуальный мусор, который отвлекает от сути данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nitems_path = ensure_dataset(\"order_items.csv\", subfolder=\"raw\")\norders_path = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\n\nitems = pd.read_csv(items_path)\norders = pd.read_csv(orders_path)\ndf = items.merge(orders, on=\"order_id\")\ndf['order_date'] = pd.to_datetime(df['order_date'])\n\nmonthly_trend = df.set_index('order_date').resample('ME')['total_amount'].sum()\n\nplt.figure(figsize=(9, 4), facecolor='#fefefe')\nax = plt.subplot(111)\nax.set_facecolor('#fefefe')\nplt.plot(monthly_trend.index, monthly_trend.values, color='#1779ba', linewidth=2.5, marker='o')\nplt.title(\"Динамика выручки по месяцам (руб.)\", fontsize=14, fontweight='bold', pad=15, color='#0a0a0a')\nplt.grid(True, linestyle='--', alpha=0.4, color='#cacaca')\nfor spine in ['top', 'right']:\n    ax.spines[spine].set_visible(False)\nplt.tight_layout()\nplt.show()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Добавление расчетных меток MoM\nРассчитайте изменение выручки месяц к месяцу (MoM Growth %)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmom_growth = monthly_trend.pct_change() * 100\nworst_month = mom_growth.idxmin()\nworst_drop = mom_growth.min()\n\nprint(f\"Наибольшая просадка зафиксирована в {worst_month.strftime('%Y-%m')}: {worst_drop:.1f}%\")\nassert not mom_growth.empty, \"Ряд не должен быть пустым\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Чек-лист чистоты бизнес-графика\n1. Заголовок содержит ключевой инсайт.\n2. Числа отформатированы с разделителями тысяч.\n3. Акцентный цвет выделяет только ключевые точки."}]}, {"filename": "lesson_05_ai_copilot_excel_formulas.ipynb", "rel_path": "course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 5. AI Copilot для формул Excel и аудит вычислений\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитики генерируют сложные формулы (`LET`, `LAMBDA`) через AI, но валидируют их на краевых случаях."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\nmanagers_data = pd.DataFrame({\n    \"manager\": [\"Иванов\", \"Петров\", \"Сидорова\", \"Кузнецов\", \"Смирнова\"],\n    \"sales_volume\": [620000, 280000, 490000, 750000, 150000]\n})\n\ndef calculate_bonus(sales):\n    if sales >= 500000:\n        return sales * 0.10\n    elif sales >= 300000:\n        return sales * 0.07\n    else:\n        return sales * 0.03\n\nmanagers_data['bonus_rub'] = managers_data['sales_volume'].apply(calculate_bonus)\nmanagers_data\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка краевого условия (Edge Case)\nУбедитесь, что бонус при ровно 500 000 руб. составляет 10%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nbonus_at_threshold = calculate_bonus(500000)\nrate = bonus_at_threshold / 500000\n\nprint(f\"Бонус при 500,000 руб.: {bonus_at_threshold:,.0f} руб. (Ставка: {rate:.1%})\")\n\nassert calculate_bonus(500000) == 50000, \"При 500к бонус должен составлять 10%!\"\nprint(\"✅ Тест успешно пройден: краевое условие закрыто!\")\n"}, {"type": "markdown", "content": "### 💡 Промпт для генерации формул\n> *«Напиши формулу для Excel с использованием LET. Рассчитай статус клиента по сумме покупок. Обязательно обработай ISBLANK.»*"}]}]}, {"id": "module_02_sql", "title": "Модуль 2. SQL Master: от SELECT до оконных функций", "cat": "Хард база", "badge": "SQL", "icon": "🗄️", "desc": "CTE, оконные агрегаты, партиционирование, когорты и оптимизация запросов.", "readme": "# 🗃️ Модуль 2: SQL — От первых запросов до аналитических оконных функций\n\n## 📌 О модуле\nSQL (Structured Query Language) — главный фундамент data-стека. LLM пишут синтаксис, но только аналитик понимает структуру реляционной модели, видит дублирование при JOIN и умеет оптимизировать тяжелые запросы. В этом модуле мы работаем с реальной SQLite базой e-commerce на 15 000+ записей.\n\n## 🎯 Learning Outcomes\n- **Apply**: Составление сложных запросов (`SELECT`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`).\n- **Analyze**: Все виды `JOIN` (INNER, LEFT, FULL, CROSS, SELF), борьба с декартовым произведением строк.\n- **Evaluate**: Использование CTE (Common Table Expressions) для структурирования запросов вместо спагетти-подзапросов.\n- **Create**: Аналитические оконные функции (`ROW_NUMBER`, `DENSE_RANK`, `LAG`, `LEAD`, `SUM OVER (PARTITION BY ...)`).\n- **AI Orchestration**: Промптинг для генерации SQL, проверка EXPLAIN QUERY PLAN, защита от галлюцинаций агрегаций.\n\n## 📚 Уроки\n1. `lesson_01_db_intro_select_filtering.ipynb` — Подключение к базе, анатомия SQL, SELECT, WHERE, LIKE, IN.\n2. `lesson_02_aggregations_group_by_having.ipynb` — Агрегатные функции, группировка, разница WHERE vs HAVING.\n3. `lesson_03_joins_deep_dive.ipynb` — Реляционная связь, виды JOIN, поиск потерянных строк.\n4. `lesson_04_subqueries_and_cte.ipynb` — Чистый код через CTE (`WITH`), многоуровневая аналитика.\n5. `lesson_05_window_functions_advanced.ipynb` — Оконные функции: ранги, нарастающий итог, темпы роста (MoM / YoY).\n6. `lesson_06_sql_patterns_retention_funnels.ipynb` — Паттерны продуктовой аналитики: когорты, воронки на чистом SQL.\n7. `lesson_07_prompt_engineering_for_sql_and_validation.ipynb` — Генерация SQL через нейросети и строгий чеклист валидации.\n8. `quiz.md` — 15 вопросов со скринингов.\n9. `cheatsheet.md` — Справочник SQL конструкций.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 2 (SQL)\n\n### Вопрос 1\nВ чем разница между `RANK()` и `DENSE_RANK()`?\n- [ ] Разницы нет\n- [x] При одинаковых значениях RANK оставляет пропуски в нумерации (1, 2, 2, 4), а DENSE_RANK нумерует без пробелов (1, 2, 2, 3)\n- [ ] DENSE_RANK работает только в PostgreSQL\n\n### Вопрос 2\nЗачем нужна конструкция `WITH` (CTE)?\n- [ ] Она ускоряет любой запрос в 100 раз\n- [x] Она позволяет разбить сложный запрос на логические читаемые блоки и использовать их повторно\n- [ ] Без нее нельзя соединять таблицы\n\n### Вопрос 3\nКакой результат вернет `COUNT(*)` vs `COUNT(column_name)` если в колонке есть NULL?\n- [ ] Одинаковый\n- [x] `COUNT(*)` считает все строки, а `COUNT(column_name)` игнорирует строки с NULL\n- [ ] Вернет ошибку базы данных\n\n---\n\n### Вопрос 4\nВ чем ключевое отличие оконной функции DENSE_RANK() от RANK()?\n- [ ] DENSE_RANK работает только в PostgreSQL.\n- [x] DENSE_RANK не оставляет пропусков в нумерации рангов при наличии одинаковых значений (например: 1, 2, 2, 3 вместо 1, 2, 2, 4 у RANK).\n- [ ] RANK нумерует строки в обратном порядке.\n*Объяснение*: DENSE_RANK плотно нумерует ранги без скачков при дубликатах.\n\n---\n\n### Вопрос 5\nПочему CTE (Common Table Expressions, блок WITH) предпочтительнее глубоко вложенных подзапросов в SELECT?\n- [ ] CTE всегда выполняется быстрее оптимизатором.\n- [x] CTE делает код модульным, легко читаемым человеком и AI, упрощает дебаг и повторное переиспользование промежуточных выборок.\n- [ ] Вложенные подзапросы запрещены в стандарте SQL 2026.\n*Объяснение*: Чистота и поддерживаемость кода снижают количество ошибок при передаче запросов между аналитиками.\n", "cheatsheet": "# 📋 SQL Cheatsheet\n\n```sql\n-- Оконная функция: прирост к предыдущему значению\nLAG(metric, 1) OVER (PARTITION BY user_id ORDER BY event_date)\n\n-- Оконная функция: доля строки в разрезе группы\nmetric * 100.0 / SUM(metric) OVER (PARTITION BY category)\n\n-- Безопасный расчет конверсии\nROUND(COUNT(DISTINCT converted_users) * 1.0 / NULLIF(COUNT(DISTINCT total_users), 0), 4)\n```\n", "notebooks": [{"filename": "lesson_01_db_intro_select_filtering.ipynb", "rel_path": "course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 1. Реляционные базы данных и фильтрация данных (SELECT, WHERE, NULL)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb)\n\n## 📌 Бизнес-контекст и методология\nSQL — фундаментальный язык аналитика данных. В реляционной СУБД данные нормализованы по таблицам."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nSELECT \n    customer_id,\n    first_name,\n    city,\n    acquisition_channel,\n    registration_date\nFROM customers\nWHERE city IN ('Moscow', 'Saint Petersburg')\n  AND registration_date >= '2025-01-01'\nORDER BY registration_date DESC\nLIMIT 5;\n\"\"\"\n\ndf_res = pd.read_sql_query(query, conn)\ndf_res\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск завершенных заказов через Apple/Mir Pay\nНайдите все завершенные заказы со статусом `Completed` и методом оплаты `Apple Pay / Mir Pay`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_pay = \"\"\"\nSELECT \n    order_id,\n    customer_id,\n    order_date,\n    status,\n    payment_method\nFROM orders\nWHERE status = 'Completed'\n  AND payment_method LIKE '%Apple Pay%'\nLIMIT 10;\n\"\"\"\n\ndf_pay = pd.read_sql_query(query_pay, conn)\nprint(df_pay.head(5))\n\nassert not df_pay.empty, \"Заказы должны быть найдены\"\nassert (df_pay['status'] == 'Completed').all(), \"Статус должен быть Completed\"\nprint(\"✅ Тест успешно пройден: фильтрация отработала безошибочно!\")\n"}, {"type": "markdown", "content": "### 💡 Трехзначная логика SQL\nСравнение `col = NULL` всегда возвращает `UNKNOWN`. Используйте `col IS NULL` или `col IS NOT NULL`."}]}, {"filename": "lesson_02_aggregations_group_by_having.ipynb", "rel_path": "course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 2. Агрегация данных, GROUP BY и разница с HAVING\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАгрегатные функции (`COUNT`, `SUM`, `AVG`, `MIN`, `MAX`) сжимают строки в бизнес-метрики. `WHERE` фильтрует до агрегации, `HAVING` — после."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nSELECT \n    c.city,\n    COUNT(DISTINCT c.customer_id) AS total_customers,\n    COUNT(DISTINCT o.order_id) AS total_orders,\n    ROUND(SUM(oi.total_amount), 2) AS total_revenue\nFROM customers c\nJOIN orders o ON c.customer_id = o.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'\nGROUP BY c.city\nHAVING total_orders >= 10\nORDER BY total_revenue DESC;\n\"\"\"\n\ndf_cities = pd.read_sql_query(query, conn)\ndf_cities\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск постоянных клиентов (Repeat Buyers)\nНайдите клиентов с более чем 2 завершенными заказами."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_repeats = \"\"\"\nSELECT \n    o.customer_id,\n    COUNT(DISTINCT o.order_id) AS orders_count,\n    ROUND(SUM(oi.total_amount), 2) AS customer_ltv\nFROM orders o\nJOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'\nGROUP BY o.customer_id\nHAVING COUNT(DISTINCT o.order_id) >= 2\nORDER BY customer_ltv DESC;\n\"\"\"\n\ndf_repeats = pd.read_sql_query(query_repeats, conn)\nprint(f\"Постоянных клиентов: {len(df_repeats)}\")\nprint(df_repeats.head(5))\n\nassert not df_repeats.empty, \"Список не должен быть пустым\"\nassert (df_repeats['orders_count'] >= 2).all(), \"Заказов должно быть не менее 2\"\nprint(\"✅ Тест успешно пройден: когорта постоянных клиентов собрана!\")\n"}, {"type": "markdown", "content": "### 💼 COUNT(*) vs COUNT(column)\n`COUNT(*)` считает все строки, `COUNT(DISTINCT col)` считает уникальные сущности."}]}, {"filename": "lesson_03_joins_deep_dive.ipynb", "rel_path": "course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 3. Глубокое погружение в JOIN: исключение дубликатов и декартова произведения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_03_joins_deep_dive.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОбъединение таблиц (`INNER`, `LEFT`, `FULL`) лежит в основе аналитических запросов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nSELECT \n    p.category,\n    COUNT(DISTINCT o.order_id) AS orders_count,\n    SUM(oi.quantity) AS units_sold,\n    ROUND(SUM(oi.total_amount), 2) AS category_revenue,\n    ROUND(SUM(oi.quantity * (p.price - p.cost)), 2) AS category_profit\nFROM order_items oi\nJOIN products p ON oi.product_id = p.product_id\nJOIN orders o ON oi.order_id = o.order_id\nWHERE o.status = 'Completed'\nGROUP BY p.category\nORDER BY category_revenue DESC;\n\"\"\"\n\ndf_cats = pd.read_sql_query(query, conn)\ndf_cats\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск клиентов без заказов\nИспользуя `LEFT JOIN`, найдите клиентов без совершенных заказов."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_no_orders = \"\"\"\nSELECT \n    c.acquisition_channel,\n    COUNT(c.customer_id) AS inactive_customers\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id\nWHERE o.order_id IS NULL\nGROUP BY c.acquisition_channel\nORDER BY inactive_customers DESC;\n\"\"\"\n\ndf_inactive = pd.read_sql_query(query_no_orders, conn)\nprint(df_inactive)\n\nassert not df_inactive.empty, \"Датафрейм не должен быть пустым\"\nassert 'inactive_customers' in df_inactive.columns, \"Колонка обязательна\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Памятка по типам JOIN\nLEFT JOIN сохраняет все строки левой таблицы, заменяя несовпавшие значения на NULL."}]}, {"filename": "lesson_04_subqueries_and_cte.ipynb", "rel_path": "course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 4. Подзапросы и Common Table Expressions (CTE): читаемый модульный SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ промышленной аналитике CTE через `WITH` заменяют вложенные подзапросы, делая код модульным."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(ensure_dataset(\"ecommerce.db\"))\n\nquery = \"\"\"\nWITH OrderTotals AS (\n    SELECT \n        order_id,\n        SUM(total_amount) AS order_total\n    FROM order_items\n    GROUP BY order_id\n),\nCustomerAverages AS (\n    SELECT \n        o.customer_id,\n        AVG(ot.order_total) AS customer_avg_order,\n        COUNT(o.order_id) AS total_orders\n    FROM orders o\n    JOIN OrderTotals ot ON o.order_id = ot.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY o.customer_id\n)\nSELECT \n    c.customer_id,\n    c.first_name,\n    c.city,\n    ROUND(ca.customer_avg_order, 2) AS avg_check,\n    ca.total_orders\nFROM CustomerAverages ca\nJOIN customers c ON ca.customer_id = c.customer_id\nORDER BY ca.customer_avg_order DESC\nLIMIT 5;\n\"\"\"\n\ndf_cte = pd.read_sql_query(query, conn)\ndf_cte\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: CTE для поиска первого и последнего заказа\nНапишите запрос с CTE, находящим дату первого и последнего заказа клиента."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_lifespan = \"\"\"\nWITH FirstOrders AS (\n    SELECT \n        customer_id,\n        MIN(order_date) AS first_order_date,\n        MAX(order_date) AS last_order_date,\n        COUNT(order_id) AS total_orders\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n    HAVING COUNT(order_id) > 1\n)\nSELECT \n    customer_id,\n    first_order_date,\n    last_order_date,\n    total_orders,\n    ROUND(JULIANDAY(last_order_date) - JULIANDAY(first_order_date), 1) AS lifespan_days\nFROM FirstOrders\nORDER BY lifespan_days DESC\nLIMIT 10;\n\"\"\"\n\ndf_life = pd.read_sql_query(query_lifespan, conn)\nprint(df_life.head(5))\n\nassert not df_life.empty, \"Список не должен быть пустым\"\nassert (df_life['lifespan_days'] >= 0).all(), \"Срок жизни должен быть неотрицательным\"\nprint(\"✅ Тест успешно пройден: CT
