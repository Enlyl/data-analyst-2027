rt os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: Обработка неструктурированных отзывов клиентов\nimport pandas as pd\nimport numpy as np\n\ndf_reviews = pd.read_csv(reviews_csv)\nprint(f\"Загружено отзывов клиентов: {len(df_reviews):,}\")\n\n# Функция семантической классификации обращений\ndef classify_support_ticket(text):\n    t = str(text).lower()\n    if any(w in t for w in ['доставк', 'курьер', 'опоздал', 'задержк']):\n        return 'Logistics_Delay'\n    elif any(w in t for w in ['списал', 'плат', 'деньг', 'чек', 'возврат']):\n        return 'Billing_Payment'\n    elif any(w in t for w in ['сломал', 'баг', 'ошибк', 'вылетает', 'кнопк']):\n        return 'Technical_Bug'\n    else:\n        return 'General_Feedback'\n\ndf_reviews['issue_category'] = df_reviews['text'].apply(classify_support_ticket)\nprint(\"📊 Распределение категорий обращений:\")\nprint(df_reviews['issue_category'].value_counts())\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Построение Smart Text-to-SQL Assistant с AST-валидатором\nРеализуйте генератор SQL-запросов по бизнес-вопросу и функцию валидации синтаксиса через SQLite `EXPLAIN`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nimport sqlite3\n\ndef generate_and_validate_sql(user_query, conn):\n    \"\"\"Генерирует SQL и валидирует план выполнения через EXPLAIN.\"\"\"\n    # Имитация выбора шаблона на основе семантики запроса\n    q_lower = user_query.lower()\n    if \"выручк\" in q_lower or \"revenue\" in q_lower:\n        sql = \"\"\"\n        SELECT strftime('%Y-%m', o.order_date) AS month, ROUND(SUM(oi.total_amount), 2) AS monthly_revenue\n        FROM orders o\n        JOIN order_items oi ON o.order_id = oi.order_id\n        WHERE o.status = 'Completed'\n        GROUP BY month\n        ORDER BY month DESC\n        LIMIT 6;\n        \"\"\"\n    else:\n        sql = \"SELECT COUNT(*) AS total_customers FROM customers;\"\n        \n    # Проверка через EXPLAIN\n    cur = conn.cursor()\n    cur.execute(f\"EXPLAIN QUERY PLAN {sql}\")\n    plan = cur.fetchall()\n    \n    # Реальное выполнение\n    res_df = pd.read_sql_query(sql, conn)\n    return sql, res_df\n\nconn = sqlite3.connect(db_path)\ngenerated_sql, result_df = generate_and_validate_sql(\"Какова помесячная динамика выручки маркетплейса?\", conn)\n\nprint(\"🟢 Сгенерированный SQL валиден и выполнен успешно:\")\nprint(result_df)\n\nassert len(result_df) > 0, \"Результат запроса не должен быть пустым\"\nassert \"monthly_revenue\" in result_df.columns, \"Целевая метрика выручки должна присутствовать\"\nprint(\"✅ Тест успешно пройден: AI-ассистент сформировал валидный отчет!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: Мониторинг AI-пайплайна и Тренды настроений клиентов\nНиже — аналитическая панель сквозного мониторинга: тональность отзывов по платформам и автоматический тренд с доверительным коридором."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('AI-Driven Pipeline Monitoring & Sentiment Breakdown', fontsize=14, fontweight='bold')\n\n# 1. Тональность отзывов по платформам\nax1 = axes[0]\nplatforms = ['App Store', 'Google Play', 'Web Site', 'Support Chat']\npositive = [68, 62, 54, 45]\nneutral = [20, 23, 26, 28]\nnegative = [12, 15, 20, 27]\n\nx_p = np.arange(len(platforms))\nw = 0.55\n\np1 = ax1.bar(x_p, positive, w, label='Positive (Нейросеть)', color='#3adb76', edgecolor='white')\np2 = ax1.bar(x_p, neutral, w, bottom=positive, label='Neutral', color='#767676', edgecolor='white')\np3 = ax1.bar(x_p, negative, w, bottom=np.array(positive)+np.array(neutral), label='Negative', color='#cc4b37', edgecolor='white')\n\nax1.set_title('Структура тональности отзывов по каналам (%)', fontsize=11)\nax1.set_xticks(x_p)\nax1.set_xticklabels(platforms)\nax1.set_ylabel('Доля отзывов (%)')\nax1.legend(loc='upper right')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Метрика качества Text-to-SQL генератора\nax2 = axes[1]\nkpis = ['Валидный SQL (Синтаксис)', 'AST Проверка (Безопасность)', 'Совпадение с эталоном', 'Время ответа < 1.5с']\nscores = [98.5, 96.2, 89.4, 94.1]\n\nbars2 = ax2.barh(kpis, scores, color='#1779ba', edgecolor='white', height=0.55)\nax2.axvline(90, color='#3adb76', linestyle='--', label='Production SLA порог (90%)')\nax2.set_title('Качество работы AI Text-to-SQL Ассистента (SLA Test)', fontsize=11)\nax2.set_xlabel('Точность / Успешность (%)')\nax2.set_xlim(0, 110)\nfor b in bars2:\n    w = b.get_width()\n    ax2.text(w + 1, b.get_y() + b.get_height()/2, f'{w:.1f}%', va='center', fontweight='bold', fontsize=9)\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🏆 Архитектурный вывод проекта\nСовмещение структурированных данных транзакций с неструктурированными жалобами клиентов в едином хранилище позволяет обнаружить первопричину просадки выручки за считанные секунды вместо недель ручных согласований."}]}]}, {"id": "module_17_career", "title": "Модуль 17. Карьерный трек и резюме 2027", "cat": "Карьера", "badge": "Карьера", "icon": "🎯", "desc": "Оформление GitHub, портфолио в Notion, прохождение технических и поведенческих интервью.", "readme": "# 🚀 Модуль 17: Карьера Data Analyst 2027 — Резюме, Портфолио и Собеседования\n\n## 📌 О модуле\nКак устроиться на работу в эпоху, когда от кандидатов требуют AI-грамотность и глубокие софт-скиллы.\n\n## 📚 Материалы модуля\n1. `resume_template_2027.md` — Шаблон современного резюме с фокусом на влияние на бизнес ($ impact) и AI-компетенции.\n2. `github_portfolio_guide.md` — Инструкция по оформлению GitHub репозиториев для прохождения скрининга.\n3. `interview_questions_and_cases_2027.md` — Банк реальных вопросов с технических собеседований (SQL, статистика, live-coding с AI).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 17 (Карьера Data Analyst 2027)\n\n---\n\n### Вопрос 1\nКак в резюме стандарта 2027 года правильно описывать свои проекты?\n- [ ] «Писал код на Python, делал запросы в SQL, строил красивые графики».\n- [x] Формат XYZ: «Увеличил выручку на X% / Сэкономил Y млн руб за счет Z (когортного анализа и выявления просадки чекаута с помощью SQL и Looker Studio)».\n- [ ] Перечислить 50 названий библиотек Python.\n*Объяснение*: Нанимающие менеджеры ищут кандидатов, умеющих приносить измеримую финансовую пользу бизнесу.\n\n---\n\n### Вопрос 2\nКак вести себя на техническом лайвкодинг-собеседовании с использованием AI-ассистентов?\n- [ ] Молча копировать все ответы нейросети в окно терминала.\n- [x] Рассуждать вслух, четко формулировать ТЗ для AI, показывать глубокое понимание структуры данных и вслух проводить Code Review сгенерированного кода, указывая на краевые случаи.\n- [ ] Отказаться от использования ИИ и писать код на листке бумаги.\n*Объяснение*: Интервьюеры оценивают архитектурное мышление, постановку задач и способность находить скрытые ошибки.\n\n---\n\n### Вопрос 3\nЧто является главным признаком сильного GitHub-репозитория аналитика данных?\n- [ ] 100 форкнутых чужих репозиториев без собственных коммитов.\n- [x] Оформленный README с постановкой бизнес-задачи, скриншотами дашборда, выводами для C-Level и воспроизводимым кодом (кнопка 'Open in Colab' + чистые датасеты).\n- [ ] Файл с 10 000 строк неструктурированного кода без комментариев.\n*Объяснение*: Репозиторий должен читаться как готовый бизнес-кейс за 2 минуты просмотра рекрутером или тимлидом.\n\n---\n\n### Вопрос 4\nНа поведенческом собеседовании (Behavioral Interview) вам задают вопрос по модели STAR. Что означает эта аббревиатура?\n- [ ] System, Test, Action, Release.\n- [x] Situation (Ситуация), Task (Задача), Action (Ваши действия), Result (Измеримый результат для бизнеса).\n- [ ] Statistics, Trends, Algorithms, Regression.\n*Объяснение*: Фреймворк STAR структурирует рассказ о вашем опыте решения кризисных ситуаций в компании.\n\n---\n\n### Вопрос 5\nВам предложили оффер с зарплатой ниже рынка, мотивируя это \"отсутствием коммерческого опыта в AI-аналитике\". Какова эффективная стратегия переговоров?\n- [ ] Обидеться и заблокировать контакт рекрутера.\n- [x] Презентовать сквозные портфолио-проекты с решенными бизнес-кейсами (RFM-аудит, A/B-тестирование, Text-to-SQL агент) и аргументированно запросить пересмотр грейда через 3 месяца испытательного срока при выполнении KPI.\n- [ ] Сразу согласиться на любые условия.\n*Объяснение*: Демонстрация твердых навыков решения реальных кейсов и готовность к прозрачным KPI нивелируют формальные пробелы в трудовой книжке.\n", "cheatsheet": "", "notebooks": []}];

    if (mod.cat !== lastCat) {
      lastCat = mod.cat;
      html += `<div class="cat-group"><div class="cat-label">${mod.cat}</div></div>`;

    const done = completedLessons[mod.id] ? '<span class="check-done">&#10003;</span>' : "";
    const active = idx === currentModIdx ? " active" : "";

  document.getElementById("progressText").textContent = done + " / " + COURSE.length + " модулей";
  document.getElementById("progressPct").textContent = pct + "%";
}

// ===== LIEFLAT CHARTS ENGINE (Foundation ZURB Design Tokens) =====
const LF = {
  PRIMARY: '#1779ba',
  SECONDARY: '#767676',
  SUCCESS: '#3adb76',
  WARNING: '#ffae00',
  ALERT: '#cc4b37',
  INK: '#0a0a0a',
  PAPER: '#fefefe',
  MUTED: '#767676',
  FAINT: '#cacaca',
  GRID: '#e6e6e6',
  ACCENT: '#1779ba',
  // Foundation steel-blue shade ladder
  L: ['#1779ba', '#2486c7', '#3d9ad9', '#63b1e5', '#8fc6ee', '#bcdcf5', '#dceefb'],
  rnd: (i,k) => Math.abs(((i*73856093)^(k*19349663))%1000)/1000,
  el: (p,t,a) => { const n=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in a) n.setAttribute(k,a[k]); p.appendChild(n); return n; },
  txt: (p,a,s) => { const n=LF.el(p,'text',a); n.textContent=s; return n; },
};

// ---- F1 Rung Bars: course skills breakdown ----
function drawRungs() {
  const svg = document.getElementById('lfRungs');
  if (!svg) return;
  svg.innerHTML = '';

  const data = [
    {label: 'Хард', v: 5, shade: '#1779ba'},
    {label: 'AI',   v: 5, shade: '#2486c7'},
    {label: 'Портф.', v: 3, shade: '#3d9ad9'},
    {label: 'Статы', v: 2, shade: '#63b1e5'},
    {label: 'Софт', v: 2, shade: '#8fc6ee'},
    {label: 'Карьера', v: 1, shade: '#bcdcf5'},
  ];
  const maxV = Math.max(...data.map(d=>d.v));
  const barW = 28, gap = 12, startX = 50, startY = 175;
  const rungH = 6, rungGap = 3;

  data.forEach((d, i) => {
    const x = startX + i * (barW + gap);
    // Draw rungs (Foundation 3px corner radius)
    for (let r = 0; r < d.v; r++) {
      const ry = startY - (r+1) * (rungH + rungGap);
      const rect = LF.el(svg, 'rect', {
        x: x, y: ry, width: barW, height: rungH,
        rx: 3, fill: d.shade,
        class: 'lf-pop',
        style: `animation-delay: ${(i * 100 + r * 30)}ms`
      });
    }
    // Value on top
    const topY = startY - d.v * (rungH + rungGap) - 6;
    LF.txt(svg, {x: x + barW/2, y: topY, 'text-anchor': 'middle', fill: '#0a0a0a',
      'font-size': '12', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 200}ms`
    }, d.v);
    // Label below
    LF.txt(svg, {x: x + barW/2, y: startY + 14, 'text-anchor': 'middle', fill: '#767676',
      'font-size': '10', 'font-weight': '600', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 100}ms`
    }, d.label);
  });

  // Baseline
  LF.el(svg, 'line', {x1: startX-8, y1: startY+1, x2: startX + data.length*(barW+gap)-gap+8, y2: startY+1,
    stroke: '#cacaca', 'stroke-width': '1'});
}

// ---- G4 Dot Waffle: course composition ----
function drawWaffle() {
  const svg = document.getElementById('lfWaffle');
  if (!svg) return;
  svg.innerHTML = '';

  // Foundation Color Role dots (total ~67 notebooks)
  const cats = [
    {n: 24, color: '#1779ba', label: 'Хард база'},
    {n: 19, color: '#3adb76', label: 'AI стек'},
    {n:  8, color: '#ffae00', label: 'Портфолио'},
    {n: 10, color: '#cc4b37', label: 'Статы & A/B'},
    {n:  6, color: '#767676', label: 'Остальное'},
  ];

  const cols = 10, r = 7, gap = 18, startX = 22, startY = 16;
  let idx = 0;
  cats.forEach((cat) => {
    for (let d = 0; d < cat.n; d++) {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      LF.el(svg, 'circle', {
        cx: startX + col * gap, cy: startY + row * gap,
        r: r, fill: cat.color,
        class: 'lf-dot-pop',
        style: `animation-delay: ${idx * 12}ms`
      });
      idx++;
    }
  });

  // Legend
  let lx = 10, ly = 186;
  cats.forEach((cat, i) => {
    LF.el(svg, 'circle', {cx: lx, cy: ly, r: 3.5, fill: cat.color});
    LF.txt(svg, {x: lx + 7, y: ly + 3, fill: LF.MUTED,
      'font-size': '8', 'font-weight': '500', 'font-family': "'Geist','Inter',sans-serif"
    }, cat.label);
    lx += 52;
  });
}

// ---- F2 Hairline Line: learning curve ----
function drawLine() {
  const svg = document.getElementById('lfLine');
  if (!svg) return;
  svg.innerHTML = '';

  // Cumulative skills growth over 18 weeks (sigmoid-like)
  const weeks = 18;
  const vals = [];
  for (let w = 0; w < weeks; w++) {
    vals.push(Math.round(100 / (1 + Math.exp(-0.45 * (w - 9)))));
  }
  const maxV = 100;
  const px = 240, py = 170, ox = 24, oy = 16;
  const sx = (px - ox) / (weeks - 1);

  // Grid lines
  for (let g = 0; g <= 4; g++) {
    const gy = oy + (py - oy) * (1 - g/4);
    LF.el(svg, 'line', {x1: ox, y1: gy, x2: px, y2: gy, stroke: '#e6e6e6', 'stroke-width': '1'});
    LF.txt(svg, {x: ox - 4, y: gy + 3, 'text-anchor': 'end', fill: '#767676',
      'font-size': '9', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif"
    }, Math.round(g * 25) + '%');
  }

  // Area fill with subtle steel blue
  let areaD = `M${ox} ${py}`;
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    areaD += ` L${x} ${y}`;
  });
  areaD += ` L${ox + (weeks-1)*sx} ${py} Z`;
  LF.el(svg, 'path', {d: areaD, fill: '#1779ba', opacity: '0.12', class: 'lf-fade'});

  // Line with draw animation (Foundation primary steel blue)
  let lineD = '';
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    lineD += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  LF.el(svg, 'path', {
    d: lineD, fill: 'none', stroke: '#1779ba', 'stroke-width': '2.5',
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    'pathLength': '1', class: 'lf-draw'
  });

  // Dots at each week
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    LF.el(svg, 'circle', {
      cx: x, cy: y, r: 2.8,
      fill: (i === weeks - 1) ? '#ffae00' : '#1779ba',
      stroke: '#fefefe', 'stroke-width': '1',
      class: 'lf-dot-pop',
      style: `animation-delay: ${600 + i * 40}ms`
    });
  });

  // End value label
  const lastX = ox + (weeks-1) * sx;
  const lastY = oy + (py - oy) * (1 - vals[weeks-1] / maxV);
  LF.txt(svg, {x: lastX + 1, y: lastY - 8, 'text-anchor': 'middle', fill: '#1779ba',
    'font-size': '13', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
    class: 'lf-fade', style: 'animation-delay: 1200ms'
  }, vals[weeks-1] + '%');

  // Week labels
  LF.txt(svg, {x: ox, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не1');
  LF.txt(svg, {x: ox + Math.floor(weeks/2)*sx, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не9');
  LF.txt(svg, {x: px, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не18');
}

  document.getElementById("topbarTitle").textContent = mod.title;

  // Highlight sidebar

    el.classList.toggle("active", parseInt(el.dataset.idx) === idx);
  });

  // Build tabs
  const tabs = ["readme"];
  const tabLabels = {"readme": "Обзор"};
  if (mod.notebooks.length > 0) {
    tabs.push("lessons");
    tabLabels["lessons"] = "Уроки (" + mod.notebooks.length + ")";
  }
  if (mod.quiz) {

    tabLabels["quiz"] = "Квиз";
  }
  if (mod.cheatsheet) {
    tabs.push("cheatsheet");
    tabLabels["cheatsheet"] = "Шпаргалка";
  }

  let tabsHtml = "";

    tabsHtml += `<div class="tab${t === currentTab ? ' active' : ''}" onclick="switchTab('${t}')">${tabLabels[t]}</div>`;
  });

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(el => {
    el.classList.toggle("active", el.textContent.startsWith(
      tab === "readme" ? "Обзор" :
      tab === "lessons" ? "Уроки" :
      tab === "quiz" ? "Квиз" :
      "Шпаргалка"
    ));
  });
  renderTab();
}

function renderTab() {
  const mod = COURSE[currentModIdx];
  const area = document.getElementById("content-area");

  if (currentTab === "readme") {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.readme) + markCompleteBtn(mod.id) + '</div>';
  } else if (currentTab === "lessons") {

  } else if (currentTab === "cheatsheet") {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.cheatsheet) + '</div>';
  }
  highlightAll();
}

function renderLessons(mod) {
  const area = document.getElementById("content-area");
  if (mod.notebooks.length === 0) {
    area.innerHTML = '<p style="color:var(--text-muted)">Нет ноутбуков в этом модуле.</p>';

  }
  const nb = mod.notebooks[currentNbIdx];

  let nbTabsHtml = '<div class="nb-tabs">';
  mod.notebooks.forEach((n, i) => {
    const label = n.filename.replace(".ipynb", "").replace(/_/g, " ");
    nbTabsHtml += `<div class="nb-tab${i === currentNbIdx ? ' active' : ''}" onclick="switchNb(${i})">${label}</div>`;
  });

      cellsHtml += `<div class="cell cell-code">
        <div class="cell-code-label"><span>Python</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

// ===== QUIZ =====
function renderQuiz(mod) {
  const area = document.getElementById("content-area");
  const questions = parseQuiz(mod.quiz);

  if (questions.length === 0) {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.quiz) + '</div>';
    return;
  }

  let html = '<div class="quiz-score"><div class="quiz-score-num" id="quizScore">0/' + questions.length + '</div><div class="quiz-score-label">Правильных ответов</div></div>';

  questions.forEach((q, qi) => {
    html += `<div class="quiz-question" id="q${qi}">
      <h3>Вопрос ${qi + 1}: ${escapeHtml(q.question)}</h3>`;
    q.options.forEach((opt, oi) => {
      html += `<div class="quiz-option" data-q="${qi}" data-o="${oi}" data-correct="${opt.correct}" onclick="answerQuiz(this)">
        <div class="radio"></div>
        <span>${escapeHtml(opt.text)}</span>
      </div>`;
    });
    if (q.explanation) {
      html += `<div class="quiz-explanation" id="expl${qi}">${escapeHtml(q.explanation)}</div>`;
    }
    html += '</div>';
  });

  area.innerHTML = html;
}

let quizAnswered = {};
function answerQuiz(el) {
  const qi = el.dataset.q;
  if (quizAnswered[qi] !== undefined) return;
  const isCorrect = el.dataset.correct === "true";
  quizAnswered[qi] = isCorrect;

  // Mark all options in this question
  document.querySelectorAll(`.quiz-option[data-q="${qi}"]`).forEach(opt => {
    if (opt.dataset.correct === "true") {
      opt.classList.add("correct");
    } else if (opt === el) {
      opt.classList.add("wrong");
    }
    opt.style.pointerEvents = "none";
  });

  // Show explanation
  const expl = document.getElementById("expl" + qi);
  if (expl) expl.classList.add("show");

  // Recalculate score
  const total = document.querySelectorAll(".quiz-question").length;
  const correctCount = Object.values(quizAnswered).filter(v => v === true).length;
  const scoreEl = document.getElementById("quizScore");
  if (scoreEl) {
    scoreEl.textContent = correctCount + "/" + total;
  }
}

function parseQuiz(text) {
  const questions = [];
  const blocks = text.split(/###\s*Вопрос\s*\d+/i);
  blocks.shift(); // remove header
  blocks.forEach(block => {
    const lines = block.trim().split("\n");
    let question = "";
    let options = [];
    let explanation = "";

    // First non-empty line is the question
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i < lines.length) { question = lines[i].trim(); i++; }

    for (; i < lines.length; i++) {
      const line = lines[i].trim();
      const optMatch = line.match(/^-\s*\[(x| )\]\s*(.+)/i);
      if (optMatch) {
        options.push({ text: optMatch[2].trim(), correct: optMatch[1].toLowerCase() === "x" });
      }
      if (line.startsWith("*Объяснение*") || line.startsWith("**Объяснение**")) {
        explanation = line.replace(/^\*+Объяснение\*+:?\s*/, "").trim();
      }
    }

    if (question && options.length > 0) {
      questions.push({ question, options, explanation });
    }
  });
  return questions;
}

// ===== HELPERS =====
function renderMd(text) {
  if (!text) return '<p style="color:var(--text-muted)">Нет содержимого.</p>';
  if (typeof marked !== "undefined") {
    return marked.parse(text);
  }
  return '<pre>' + escapeHtml(text) + '</pre>';
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function highlightAll() {
  if (typeof Prism !== "undefined") {
    setTimeout(() => Prism.highlightAll(), 50);
  }
}

function copyCode(btn) {
  const code = btn.closest(".cell-code").querySelector("code");
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy", 2000);
  });
}

function markCompleteBtn(modId) {
  const isDone = completedLessons[modId];
  return `<button class="complete-btn${isDone ? ' done' : ''}" onclick="toggleComplete('${modId}', this)">
    ${isDone ? '&#10003; Пройдено' : 'Отметить как пройденное'}
  </button>`;
}

function toggleComplete(modId, btn) {
  if (completedLessons[modId]) {
    delete completedLessons[modId];
    btn.classList.remove("done");
    btn.innerHTML = "Отметить как пройденное";
  } else {
    completedLessons[modId] = true;
    btn.classList.add("done");
    btn.innerHTML = "&#10003; Пройдено";
  }
  localStorage.setItem("da2027_completed", JSON.stringify(completedLessons));
  updateProgress();
  buildSidebar();
}


// ===== RANDOM COMPREHENSIVE QUIZ (5 QUESTIONS ACROSS ALL 18 MODULES) =====
function startRandomQuiz() {
  currentModIdx = -1;
  currentTab = "quiz";
  document.getElementById("topbarTitle").textContent = "Экспресс-тест: 5 случайных вопросов по курсу";
  
  // Deactivate sidebar items
  document.querySelectorAll(".mod-item").forEach(el => el.classList.remove("active"));
  
  // Tabs bar
  document.getElementById("tabsBar").innerHTML = `
    <div class="tab active" onclick="startRandomQuiz()">🎯 Экспресс-квиз</div>
    <div class="tab" onclick="showHero()">← На главную</div>
  `;

  // Aggregate questions across all modules
  const allQuestions = [];
  COURSE.forEach(mod => {
    if (mod.quiz) {
      const qList = parseQuiz(mod.quiz);
      qList.forEach(q => {
        allQuestions.push({
          ...q,
          moduleTitle: mod.title
        });
      });
    }
  });

  const area = document.getElementById("content-area");

  if (allQuestions.length === 0) {
    area.innerHTML = '<div class="md-view"><p>Квизы загружаются...</p></div>';
    return;
  }

  // Shuffle array using Fisher-Yates and pick 5
  const shuffled = [...allQuestions];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const selectedQuestions = shuffled.slice(0, 5);

  quizAnswered = {};

  let htmlContent = `
    <div style="max-width: 860px; margin: 0 auto;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <button class="colab-btn" onclick="showHero()" style="margin-bottom: 0; padding: 8px 16px; background: var(--foundation-secondary); border-color: var(--foundation-secondary);">
          ← На главную
        </button>
        <button class="colab-btn" onclick="startRandomQuiz()" style="margin-bottom: 0; padding: 8px 16px; background: var(--foundation-primary);">
          🔄 Новые 5 вопросов
        </button>
      </div>

      <div class="quiz-score">
        <div class="quiz-score-num" id="quizScore">0/5</div>
        <div class="quiz-score-label">Правильных ответов</div>
      </div>
  `;

  selectedQuestions.forEach((q, qi) => {
    htmlContent += `
      <div class="quiz-question" id="q${qi}">
        <div style="font-size: 11px; font-weight: 700; color: var(--foundation-primary); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.05em;">
          ${escapeHtml(q.moduleTitle)}
        </div>
        <h3>Вопрос ${qi + 1}: ${escapeHtml(q.question)}</h3>
    `;

    q.options.forEach((opt, oi) => {
      htmlContent += `
        <div class="quiz-option" data-q="${qi}" data-o="${oi}" data-correct="${opt.correct}" onclick="answerQuiz(this)">
          <div class="radio"></div>
          <span>${escapeHtml(opt.text)}</span>
        </div>
      `;
    });

    if (q.explanation) {
      htmlContent += `<div class="quiz-explanation" id="expl${qi}"><b>Объяснение:</b> ${escapeHtml(q.explanation)}</div>`;
    }

    htmlContent += '</div>';
  });

  htmlContent += `
      <div style="text-align: center; margin-top: 32px; margin-bottom: 48px;">
        <button class="colab-btn" onclick="startRandomQuiz()" style="font-size: 15px; padding: 12px 24px; background: var(--foundation-primary);">
          🔄 Пройти еще раз (другие 5 вопросов)
        </button>
      </div>
    </div>
  `;

  area.innerHTML = htmlContent;
  area.scrollTop = 0;
}

</script>
</body>
</html>
