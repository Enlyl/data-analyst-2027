      [ (ci_a[1] - cr_a)*100, (ci_b[1] - cr_b)*100 ]],\n             fmt='o', color='#1779ba', ecolor='#cc4b37', elinewidth=3, capsize=8, markersize=8)\n\nax1.set_title('95% Доверительные интервалы конверсии чекаута', fontsize=11)\nax1.set_ylabel('Конверсия в покупку (%)')\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Бутстрап разницы ARPU (1000 итераций)\nax2 = axes[1]\nrev_a = df_ab[df_ab['test_group'] == 'A_Control']['revenue'].values\nrev_b = df_ab[df_ab['test_group'] == 'B_Variant']['revenue'].values\n\nnp.random.seed(42)\nboot_diffs = []\nfor _ in range(1000):\n    sample_a = np.random.choice(rev_a, size=len(rev_a), replace=True)\n    sample_b = np.random.choice(rev_b, size=len(rev_b), replace=True)\n    boot_diffs.append(np.mean(sample_b) - np.mean(sample_a))\n\nboot_diffs = np.array(boot_diffs)\nci_boot = np.percentile(boot_diffs, [2.5, 97.5])\n\nax2.hist(boot_diffs, bins=35, color='#1779ba', alpha=0.7, edgecolor='white')\nax2.axvline(0, color='#0a0a0a', linestyle='-', linewidth=2, label='Нулевой эффект (Δ=0)')\nax2.axvline(ci_boot[0], color='#cc4b37', linestyle='--', linewidth=2, label=f'95% CI: [{ci_boot[0]:.2f}$, {ci_boot[1]:.2f}$]')\nax2.axvline(ci_boot[1], color='#cc4b37', linestyle='--', linewidth=2)\nax2.set_title(f'Бутстрап разницы ARPU (B - A): Средний прирост ${np.mean(boot_diffs):.2f}', fontsize=11)\nax2.set_xlabel('Разница средней выручки ($)')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля положительных бутстрап-итераций\nПосчитайте процент итераций бутстрапа, в которых выручка варианта B превысила вариант A (`boot_diffs > 0`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\np_b_wins = np.mean(boot_diffs > 0)\n\nprint(f\"Вероятность превосходства варианта B: {p_b_wins:.1%}\")\nassert 0.0 <= p_b_wins <= 1.0, \"Вероятность обязана лежать в интервале [0, 1]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда бутстрап превосходит t-тест?\nВыручка в e-commerce содержит 90% нулей (не купили) и единичные чеки на $500+. Обычный t-тест на таких данных теряет калибровку. Бутстрап не требует никаких предположений о нормальности данных."}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 4. Проблема подглядывания (Peeking Problem) и P-hacking в аналитике\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМенеджер проекта запускает A/B тест и каждое утро заглядывает в дашборд. На 4-й день он видит «p-value = 0.03!» и радостно кричит: «Победа, останавливаем тест и катим в прод!».\nЭто называется **проблемой подглядывания (Peeking Problem)**. \nПри ежедневной проверке реальный уровень ложных тревог (False Positive Rate) вырастает с номинальных 5% до **30-40%**! Команда катит в прод фичи-пустышки, удивляясь, почему годовая выручка не растет."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем 500 A/A тестов (где эффект строго равен нулю), в которых аналитик подглядывает результаты каждый день в течение 30 дней."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\nnp.random.seed(42)\nn_simulations = 500\nn_days = 30\ndaily_users = 100\n\npeeking_false_positives = 0\nfinal_day_false_positives = 0\n\nfor _ in range(n_simulations):\n    data_a = np.random.normal(10, 2, n_days * daily_users)\n    data_b = np.random.normal(10, 2, n_days * daily_users)\n    \n    peeked_significant = False\n    for day in range(1, n_days + 1):\n        sample_a = data_a[:day * daily_users]\n        sample_b = data_b[:day * daily_users]\n        _, p = stats.ttest_ind(sample_a, sample_b)\n        if p < 0.05:\n            peeked_significant = True\n            break\n            \n    if peeked_significant:\n        peeking_false_positives += 1\n        \n    _, p_final = stats.ttest_ind(data_a, data_b)\n    if p_final < 0.05:\n        final_day_false_positives += 1\n\nprint(f\"Честный тест (проверка строго в день 30): {final_day_false_positives / n_simulations:.1%} ложных тревог (около 5%)\")\nprint(f\"Подглядывание (остановка при первом p < 0.05): {peeking_false_positives / n_simulations:.1%} ЛОЖНЫХ ПОБЕД!\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Как подглядывание раздувает ошибку I рода\nЗапустите анимацию ниже: смотрите, как с каждым новым днем наблюдений накопленный процент ошибочно объявленных «побед» непрерывно растет, взлетая выше 30%!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\n\nfig, ax = plt.subplots(figsize=(10, 5))\n\nnp.random.seed(42)\ndays_eval = list(range(1, 31))\ncum_fpr_by_day = []\n\nfor max_d in days_eval:\n    fp = 0\n    for _ in range(300):\n        data_a = np.random.normal(10, 2, max_d * 80)\n        data_b = np.random.normal(10, 2, max_d * 80)\n        for d in range(1, max_d + 1):\n            _, p = stats.ttest_ind(data_a[:d*80], data_b[:d*80])\n            if p < 0.05:\n                fp += 1\n                break\n    cum_fpr_by_day.append(fp / 300 * 100)\n\ndef update_peeking(frame):\n    ax.clear()\n    current_days = days_eval[:frame+1]\n    current_fpr = cum_fpr_by_day[:frame+1]\n    \n    ax.plot(current_days, current_fpr, color='#cc4b37', linewidth=2.5, marker='o', label='Фактический FPR при подглядывании')\n    ax.axhline(5.0, color='#3adb76', linestyle='--', linewidth=2, label='Допустимый порог α = 5%')\n    ax.set_title(f'Эрозия доверия к тесту: День {current_days[-1]}, FPR = {current_fpr[-1]:.1f}%!', fontsize=12, fontweight='bold')\n    ax.set_xlabel('Количество дней ежедневных проверок')\n    ax.set_ylabel('Вероятность ложной победы (%)')\n    ax.set_xlim(1, 30)\n    ax.set_ylim(0, 40)\n    ax.legend(loc='upper left')\n    ax.grid(True, linestyle=':', alpha=0.6)\n\nanim_peeking = animation.FuncAnimation(fig, update_peeking, frames=len(days_eval), repeat=True)\nplt.close(fig)\n\nHTML(anim_peeking.to_jshtml())"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поправка Бонферрони при множественных проверках\nЕсли аналитик обязан проверить тест 5 раз в течение месяца, скорректируйте критический уровень $\\alpha = 0.05$ с помощью поправки Бонферрони."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nk_checks = 5\nalpha_bonferroni = 0.05 / k_checks\n\nprint(f\"Скорректированный порог альфа Бонферрони: {alpha_bonferroni:.4f}\")\nassert alpha_bonferroni == 0.01, \"Поправка Бонферрони: 0.05 / 5 = 0.01\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Как бороться с Peeking Problem в современной индустрии?\n1. **Строгое правило фиксации выборки:** Заранее рассчитать $N$, спрятать дашборд и не открывать до набора выборки.\n2. **Последовательное тестирование (Sequential Testing):** Использовать метод Вальда (mSPRT) или байесовский подход, где границы решений динамически корректируются с учетом количества наблюдений."}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 5. Принятие бизнес-решений: раскатка, Guardrail-метрики и Trade-offs\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПобеда целевой метрики (например, рост конверсии на +4%) — это лишь полдела. \nЕсли при этом страница стала грузиться на 400 мс дольше, а отток в подписку вырос на 1.5%, решение о раскатке на 100% пользователей может стать фатальным. \nДля защиты бизнеса аналитик использует **Guardrail-метрики** (метрики безопасности) и матрицу компромиссов (Trade-offs)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСформируем комплексную сводку эксперимента: Primary метрика (CR) + Guardrail метрики (App Latency, Support Tickets, Refund Rate)."}, {"type": "code", "content": "metrics_summary = pd.DataFrame({\n    'Metric': ['Conversion Rate (Primary)', 'Latency p95 (Guardrail)', 'Refund Rate (Guardrail)', 'NPS Score'],\n    'Control_A': [0.085, 1.20, 0.021, 58],\n    'Treatment_B': [0.092, 1.65, 0.022, 52],\n    'Delta_pct': ['+8.2%', '+37.5%', '+4.7%', '-10.3%'],\n    'Stat_Significant': [False, True, False, True],\n    'Status': ['⚪ Нейтрально (p>0.05)', '🔴 ОПАСНО (Замедление)', '🟢 В норме', '🔴 Ухудшение']\n})\n\nprint(metrics_summary.to_string(index=False))"}, {"type": "markdown", "content": "### 📊 Визуализация: Квадрант решений и радар метрик\nГрафики ниже помогают C-Level руководству принять взвешенное решение о релизе фичи."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Матрица принятия решений о раскатке фичи в прод', fontsize=14, fontweight='bold')\n\n# 1. Скаттер квадрант компромиссов: Прирост выручки vs Замедление\nax1 = axes[0]\nfeatures = ['Новый чекаут', 'Автозаполнение карт', 'Видео на лендинге', 'Всплывающий промокод', 'Темная тема']\nrev_lift = [3.2, 5.1, -1.2, 0.5, 0.2]\nlatency_diff = [150, 20, 420, -50, 10]\n\nax1.scatter(latency_diff, rev_lift, color='#1779ba', s=120, edgecolor='black', zorder=5)\nfor i, txt in enumerate(features):\n    ax1.annotate(txt, (latency_diff[i] + 10, rev_lift[i] + 0.15), fontsize=9, fontweight='bold')\n\nax1.axhline(0, color='#767676', linestyle='--')\nax1.axvline(100, color='#cc4b37', linestyle=':', label='Макс. допустимое замедление (+100 мс)')\nax1.fill_between([-100, 100], 0, 7, color='#3adb76', alpha=0.15, label='Зона безоговорочной раскатки (Зеленый свет)')\nax1.fill_between([100, 500], 0, 7, color='#ffae00', alpha=0.15, label='Зона тяжелого компромисса')\nax1.fill_between([-100, 500], -3, 0, color='#cc4b37', alpha=0.15, label='Зона отклонения фичи')\n\nax1.set_title('Trade-off: Рост выручки (%) vs Изменение времени ответа (мс)', fontsize=11)\nax1.set_xlabel('Изменение Latency (мс)')\nax1.set_ylabel('Прирост выручки (%)')\nax1.legend(loc='lower left', fontsize=8)\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Поэтапный план раскатки фичи (Staged Rollout)\nax2 = axes[1]\nstages = ['Этап 1: Канрейка (1%)', 'Этап 2: Ранние пользователи (10%)', 'Этап 3: Половина базы (50%)', 'Этап 4: Полный релиз (100%)']\ntraffic_pct = [1, 10, 50, 100]\n\nbars = ax2.barh(stages, traffic_pct, color=['#767676', '#ffae00', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Best Practice: Поэтапная раскатка (Staged Rollout)', fontsize=11)\nax2.set_xlabel('Доля пользователей (%)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 2, b.get_y() + b.get_height()/2, f'{int(w)}%', va='center', fontweight='bold')\nax2.set_xlim(0, 115)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет чистого финансового эффекта с учетом потерь Guardrail\nЕсли фича дает +$50,000 выручки, но падение NPS увеличивает отток на $15,000, рассчитайте чистую годовую прибыль от раскатки."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ngross_gain = 50000\nchurn_loss = 15000\nnet_gain = gross_gain - churn_loss\n\nprint(f\"Валовый эффект фичи: +${gross_gain:,}\")\nprint(f\"Потери от оттока:     -${churn_loss:,}\")\nprint(f\"Чистый годовой итог: +${net_gain:,}\")\n\nassert net_gain == 35000, \"Чистый эффект должен составлять 35 000$\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Итоговый вердикт аналитика:\nНикогда не раскатывайте фичу на 100% в один клик. Всегда используйте поэтапную раскатку (1% -> 10% -> 50% -> 100%) и непрерывно мониторьте системные ошибки (5xx HTTP status codes) и жалобы пользователей."}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8. Prompt Engineering для аналитиков", "cat": "AI стек", "badge": "Промпты", "icon": "💬", "desc": "Few-shot, Chain-of-Thought, Structured Outputs, генерация чистого SQL и Python кода.", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n---\n\n### Вопрос 1\nЧто дает добавление инструкции «Рассуждай по шагам» (Chain-of-Thought) в промпте для аналитика?\n- [ ] Уменьшает количество затраченных токенов.\n- [x] Позволяет модели сформировать промежуточные логические выводы перед финальным расчетом, резко снижая процент математических ошибок.\n- [ ] Переводит код на язык C++.\n*Объяснение*: CoT принуждает LLM использовать контекст генерируемых токенов как рабочую память.\n\n---\n\n### Вопрос 2\nВ чем заключается техника Few-Shot Prompting?\n- [ ] Однократный запрос без контекста.\n- [x] Предоставление модели в тексте промпта 1-3 готовых примеров «входные данные -> ожидаемый результат» перед постановкой основной задачи.\n- [ ] Написание кода без использования библиотек.\n*Объяснение*: Few-Shot задает точный шаблон структуры ответа и логики рассуждений.\n\n---\n\n### Вопрос 3\nКакой компонент фреймворка RTCE отвечает за формат и ограничения вывода?\n- [ ] R (Role).\n- [ ] T (Task).\n- [x] E (Expectation).\n*Объяснение*: В Expectation задаются ограничения (например, «только валидный JSON без пояснений», «обработать деление на ноль»).\n\n---\n\n### Вопрос 4\nЧто такое Structured Outputs (JSON Schema) при работе с LLM API?\n- [ ] Сортировка текста по алфавиту.\n- [x] Механизм, при котором декодер модели на уровне токенов гарантирует 100% соответствие ответа заданной Pydantic / JSON схеме.\n- [ ] Преобразование текста в аудиофайл.\n*Объяснение*: Structured Outputs исключают риск поломки JSON-парсеров в продакшен-пайплайнах.\n\n---\n\n### Вопрос 5\nВ чем разница между Zero-Shot и Few-Shot промптингом?\n- [ ] В количестве используемых видеокарт.\n- [x] В Zero-Shot модели дается только инструкция, а в Few-Shot добавляются 2-3 конкретных примера входных и эталонных выходных данных.\n- [ ] В длине токенов.\n*Объяснение*: Примеры Few-Shot снимают неоднозначность классификации и задают формат edge-случаев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 1. Фундамент промпт-инжиниринга: System Prompts, Few-Shot и ролевые контексты\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПромпт-инжиниринг для аналитика — это проектирование детерминированных текстовых пайплайнов.\nОсновные компоненты:\n1. Ролевой контекст (System Prompt).\n2. Четкие правила форматирования (JSON / Таблицы).\n3. ПримерыFew-Shot для устранения двусмысленности."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import json\n\nprompt_template = {\n    \"role\": \"system\",\n    \"content\": \"Ты Senior Data Analyst. Классифицируй отзывы клиентов на категории: [Bug, Billing, Feature]. Формат ответа: строго JSON.\",\n    \"examples\": [\n        {\"input\": \"Списали деньги дважды за подписку!\", \"output\": {\"category\": \"Billing\", \"severity\": \"HIGH\"}},\n        {\"input\": \"Кнопка экспорта в CSV не нажимается\", \"output\": {\"category\": \"Bug\", \"severity\": \"MEDIUM\"}}\n    ]\n}\n\nprint(json.dumps(prompt_template, ensure_ascii=False, indent=2))\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация структуры промпта\nУбедитесь, что промпт содержит описание роли и примеры."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"role\" in prompt_template\nassert len(prompt_template[\"examples\"]) >= 2\nprint(\"✅ Тест успешно пройден: архитектура промпта валидна!\")\n"}, {"type": "markdown", "content": "### 💡 Zero-Shot vs Few-Shot\nFew-Shot примеры сокращают частоту отклонений от требуемой схемы вывода на 85%."}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 2. Chain-of-Thought (CoT) и пошаговая декомпозиция аналитических задач\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМетод Chain-of-Thought заставляет LLM рассуждать по шагам перед выдачей финального ответа, что критически важно в логических и математических расчетах."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример CoT-промпта для расчета LTV\ncot_prompt = \"\"\"\nЗадача: Рассчитай LTV, если ARPU = $50/мес, Churn Rate = 5% в месяц, Gross Margin = 80%.\nРассуждай по шагам:\nШаг 1: Определи среднюю продолжительность жизни клиента (Lifetime = 1 / Churn).\nШаг 2: Умножь Lifetime на месячный ARPU.\nШаг 3: Скорректируй на маржинальность (Gross Margin).\nФинальный ответ запиши в формате LTV = $X.\n\"\"\"\n\n# Аналитический расчет по тем же шагам\nlifetime = 1 / 0.05\nrevenue_ltv = lifetime * 50\nmargin_ltv = revenue_ltv * 0.80\n\nprint(f\"Шаг 1: Lifetime = {lifetime:.0f} месяцев\")\nprint(f\"Шаг 2: Выручка LTV = ${revenue_ltv:.2f}\")\nprint(f\"Шаг 3: Маржинальный LTV = ${margin_ltv:.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка формулы LTV\nУбедитесь, что рассчитанный маржинальный LTV равен $800."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert margin_ltv == 800.0, \"Маржинальный LTV должен быть $800\"\nprint(\"✅ Тест успешно пройден: пошаговый расчет подтвержден!\")\n"}, {"type": "markdown", "content": "### 💼 Как применять CoT в кодогенерации\nПросите модель сначала описать алгоритм в 3-4 пункта в виде комментариев, и только потом писать код."}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 3. Промпты для генерации SQL и Python кода: контекст схемы базы данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЧтобы LLM сгенерировала корректный SQL-запрос, ей необходим точный DDL-контекст таблиц и связей."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Формирование системного контекста схемы данных\nschema_context = \"\"\"\nCREATE TABLE orders (\n    order_id INT PRIMARY KEY,\n    customer_id INT,\n    order_date DATE,\n    status VARCHAR(20) -- ['Completed', 'Refunded', 'Cancelled']\n);\n\nCREATE TABLE order_items (\n    order_item_id INT PRIMARY KEY,\n    order_id INT REFERENCES orders(order_id),\n    total_amount DECIMAL(10, 2)\n);\n\"\"\"\n\nuser_question = \"Посчитай выручку по завершенным заказам за 2026 год\"\nsystem_instruction = f\"Используй схему:\\n{schema_context}\\nНапиши чистый PostgreSQL запрос без пояснений.\"\n\nprint(system_instruction[:250] + \"...\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия таблиц в схеме\nУбедитесь, что обе таблицы `orders` и `order_items` переданы в контекст."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"CREATE TABLE orders\" in schema_context\nassert \"CREATE TABLE order_items\" in schema_context\nprint(\"✅ Тест успешно пройден: контекст схемы полон!\")\n"}, {"type": "markdown", "content": "### 💡 Семантическая ловушка\nВ реальной базе колонка может называться `order_items.total_amount`, а не `orders.amount`. Без передачи DDL модель почти наверняка ошибется в имени колонки."}]}, {"filename": "lesson_04_debugging_and_root_cause_prompts.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 4. Промпты для отладки кода, поиска аномалий и Root Cause Analysis\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb)\n\n## 📌 Бизнес-контекст и методология\nRoot Cause Analysis (RCA) через LLM: передача стектрейса ошибки, фрагмента кода и первых 5 строк входных данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример пайплайна диагностики ошибки\nerror_trace = \"\"\"\nZeroDivisionError: division by zero\nFile \"pipeline.py\", line 42, in calculate_cr\n    return orders / visits\n\"\"\"\n\nrca_fix_logic = \"\"\"\ndef safe_calculate_cr(orders, visits):\n    if visits == 0 or visits is None:\n        return 0.0\n    return orders / visits\n\"\"\"\n\nprint(\"Диагностированный паттерн исправления ошибки деления на ноль:\")\nprint(rca_fix_logic)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Тестирование безопасного делителя\nПроверьте функцию `safe_calculate_cr` при визитах = 0 и при визитах = 100."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndef safe_calculate_cr(orders, visits):\n    if not visits:\n        return 0.0\n    return orders / visits\n\nassert safe_calculate_cr(5, 0) == 0.0\nassert safe_calculate_cr(5, 100) == 0.05\nprint(\"✅ Тест успешно пройден: защитный паттерн работает безупречно!\")\n"}, {"type": "markdown", "content": "### 💼 Правило передачи логов в AI\nНикогда не копируйте токены авторизации, пароли или PII пользователей при отправке логов ошибок в модель."}]}]}, {"id": "module_09_ai_tools_daily", "title": "Модуль 9. AI инструменты в ежедневной работе", "cat": "AI стек", "badge": "Workflow", "icon": "🤖", "desc": "Cursor, Copilot, валидация AI-галлюцинаций и автоматизация рутинных пайплайнов.", "readme": "# 🛠️ Модуль 9: AI в ежедневной работе аналитика (Cursor, Copilot, ChatGPT)\n\n## 📌 О модуле\nРазница между джуном и мидлом в 2027 году: джун пишет скрипт 3 дня, а специалист новой формации решает ту же задачу за 2 часа с помощью AI-инструментов, гарантируя нулевой процент галлюцинаций.\n\n## 🎯 Learning Outcomes\n- **Apply**: Использование Cursor IDE и GitHub Copilot для парного программирования.\n- **Analyze**: Code Interpreter (Advanced Data Analysis) для быстрого разведочного анализа (EDA).\n- **Evaluate**: 5-уровневый фреймворк валидации ответов ИИ: от синтаксиса до краевых бизнес-кейсов.\n\n## 📚 Уроки\n1. `lesson_01_cursor_vs_copilot_workflows.ipynb` — Настройка рабочего места: Cursor, Copilot, индексация кодовой базы.\n2. `lesson_02_claude_chatgpt_data_interpreter.ipynb` — Работа с веб-ассистентами (Claude 3.7 / ChatGPT): быстрый EDA, генерация гипотез.\n3. `lesson_03_ai_validation_framework_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n---\n\n### Вопрос 1\nЗачем в проектах аналитики используется файл `.cursorrules`?\n- [ ] Для ускорения интернета.\n- [x] Для автоматической передачи AI-ассистенту корпоративных стандартов кода, схемы баз данных и бизнес-правил компании.\n- [ ] Для компиляции Python в бинарный файл.\n*Объяснение*: Файл `.cursorrules` автоматически подмешивается в системный контекст каждого запроса в IDE.\n\n---\n\n### Вопрос 2\nЧто такое проверка бизнес-инвариантов при аудите кода нейросети?\n- [ ] Проверка орфографии комментариев.\n- [x] Проверка фундаментальных ограничений предметной области (например: сумма заказов не может быть отрицательной, а LTV не может быть ниже нуля).\n- [ ] Измерение скорости процессора.\n*Объяснение*: Если синтаксически корректный код от ИИ выдал отрицательный отток или конверсию 140%, нарушен бизнес-инвариант.\n\n---\n\n### Вопрос 3\nКакой инструмент лучше всего подходит для мгновенного разведочного анализа (EDA) сырого CSV-файла?\n- [ ] Ручной ввод данных в калькулятор.\n- [x] Advanced Data Analysis / Code Interpreter (встроенный запуск Python с визуализацией в реальном времени).\n- [ ] Отрисовка графиков на бумаге.\n*Объяснение*: Code Interpreter выполняет код в изолированной песочнице, строя графики и считая квантили за секунды.\n\n---\n\n### Вопрос 4\nКакой подход наиболее эффективен при отладке сложного Python-скрипта через AI в IDE?\n- [ ] Скопировать в чат весь проект целиком без пояснений.\n- [x] Предоставить минимальный воспроизводимый пример (MRE), полный стектрейс ошибки и схему первых 3 строк входных данных.\n- [ ] Попросить AI переписать проект на C++.\n*Объяснение*: Точный локализованный контекст предотвращает генерацию галлюцинаций и экономит контекстное окно.\n\n---\n\n### Вопрос 5\nЗачем нужен файл .cursorrules или AGENTS.md в корне проекта аналитика?\n- [ ] Это системный файл Windows.\n- [x] Он задает постоянный системный контекст для AI-ассистентов: стек технологий, соглашения об именовании колонок и бизнес-инварианты проекта.\n- [ ] Чтобы запретить AI читать файлы проекта.\n*Объяснение*: Постоянный контекст избавляет от необходимости повторять правила форматирования в каждом промпте.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 1. Рабочие процессы в Cursor, Copilot и современных AI IDE\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ этом уроке мы разберем эффективные сценарии использования AI в IDE:\n1. Автодополнение (Ghost Text) для рутинных операций.\n2. Inline Edit (Cmd+K / Ctrl+K) для рефакторинга функций.\n3. Проектный контекст (.cursorrules / AGENTS.md)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Генерация карточки проекта для передачи контекста в AI IDE\nproject_context = f\"\"\"\nDataset Summary:\n- Rows: {len(df_saas)}\n- Columns: {list(df_saas.columns)}\n- Target Variable: is_churned (0 or 1)\n\"\"\"\nprint(project_context.strip())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия целевой переменной\nУбедитесь, что целевая переменная `is_churned` указана в контексте."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"is_churned\" in project_context\nprint(\"✅ Тест успешно пройден: карточка контекста готова!\")\n"}, {"type": "markdown", "content": "### 💡 Совет по эффективности\nИспользуйте контекстные ссылки на файлы (`@файл`), чтобы модель читала реальный код проекта, а не выдумывала функции."}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 2. Использование Claude и ChatGPT Advanced Data Analysis для экспресс-аналитики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\n\n## 📌 Бизнес-контекст и методология\nAdvanced Data Analysis (Code Interpreter) позволяет выполнять Python код прямо в песочнице чат-бота для быстрой проверки гипотез."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Экспресс-вычисление корреляционной матрицы\nnumeric_cols = df_saas.select_dtypes(include=['float64', 'int64']).columns\ncorr_matrix = df_saas[numeric_cols].corr().round(2)\nprint(\"📊 Фрагмент корреляционной матрицы:\")\nprint(corr_matrix.iloc[:4, :4])\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Диагональ корреляционной матрицы\nУбедитесь, что значения на главной диагонали равны 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndiag_values = np.diag(corr_matrix.values)\nassert (diag_values == 1.0).all(), \"Диагональ корреляционной матрицы обязана состоять из 1.0\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Когда не стоит использовать браузерный Data Interpreter?\nПри объемах данных свыше 500 МБ или при наличии строгих политик безопасности данных (банковская тайна, персональные данные)."}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 3. Фреймворк валидации AI-ответов и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик несет юридическую и финансовую ответственность за презентуемые цифры.\nФреймворк фактчекинга:\n1. Запрет на слепое копирование чисел из текстового ответа LLM.\n2. Проверка граничных условий и сумм (Sanity Checks).\n3. Дублирующий расчет на агрегированном SQL."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\n\n# Пайплайн автоматической верификации баланса\ndef verify_financial_integrity(df_transactions, reported_total):\n    calculated_total = df_transactions['amount'].sum()\n    discrepancy = abs(calculated_total - reported_total)\n    is_valid = discrepancy < 0.01\n    return is_valid, discrepancy\n\nsample_tx = pd.DataFrame({'amount': [100.50, 200.25, 45.25]})\nvalid, diff = verify_financial_integrity(sample_tx, 346.00)\n\nprint(f\"Баланс сошелся: {valid} (Расхождение: ${diff:.4f})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Детекция расхождения в балансе\nПроверьте реакцию валидатора на сфальсифицированную сумму 400.00."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nbad_valid, bad_diff = verify_financial_integrity(sample_tx, 400.00)\nassert not bad_valid, \"Валидатор должен зафиксировать ошибку\"\nassert bad_diff > 50.0, \"Расхождение должно быть обнаружено\"\nprint(\"✅ Тест успешно пройден: валидатор целостности надежен!\")\n"}, {"type": "markdown", "content": "### 💡 Золотое правило Data Analyst 2027\nAI генерирует гипотезы и черновики кода, но валидируют результат автотесты и математические инварианты."}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10. LLM API и неструктурированные данные", "cat": "AI стек", "badge": "API", "icon": "🔌", "desc": "Парсинг отзывов, классификация клиентских обращений, NER и извлечение JSON из текста.", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API & Неструктурированные данные)\n\n---\n\n### Вопрос 1\nЗачем в аналитических пайплайнах обогащения данных использовать Structured Outputs (Pydantic / JSON Mode)?\n- [ ] Чтобы нейросеть писала более вежливые ответы.\n- [x] Чтобы модель гарантированно вернула валидный JSON строго заданной структуры с проверкой типов полей, исключая поломку ETL-пайплайна.\n- [ ] Чтобы снизить задержку сети.\n*Объяснение*: Structured Outputs принудительно направляет сэмплирование токенов согласно переданной JSON-схеме.\n\n---\n\n### Вопрос 2\nКакую температуру (`temperature`) следует указывать при вызове LLM для извлечения фактов и разметки тональности?\n- [ ] 1.5 (для максимального разнообразия).\n- [x] 0.0 (для максимальной детерминированности, воспроизводимости и строгого следования схеме).\n- [ ] 0.8.\n*Объяснение*: Для аналитических задач и классификации требуется нулевая случайность (greedy decoding).\n\n---\n\n### Вопрос 3\nСколько примерно стоит классификация 10 000 коротких отзывов клиентов через современные эффективные LLM (например, Gemini Flash / GPT-4o-mini)?\n- [ ] Около \\$500.\n- [x] Менее \\$1.00 (порядка 50-80 рублей).\n- [ ] Более \\$10 000.\n*Объяснение*: Цены на легковесные модели упали до \\$0.10–\\$0.15 за миллион токенов, делая автоматическую разметку текста невероятно дешевой.\n\n---\n\n### Вопрос 4\nЧто такое Prompt Caching и какую экономию он дает в ETL-пайплайнах?\n- [ ] Сохранение ответов в файл Excel.\n- [x] Кэширование неизменяемого системного префикса промпта на стороне провайдера API, снижающее стоимость входных токенов на 75-90%.\n- [ ] Отключение платных запросов.\n*Объяснение*: При обработке миллионов строк кэширование схемы и инструкций сокращает расходы компании в разы.\n\n---\n\n### Вопрос 5\nПочему параметр temperature при аналитической обработке данных через LLM API выставляют строго в 0.0?\n- [ ] При температуре 0 процессор не нагревается.\n- [x] Температура 0.0 обеспечивает максимальную детерминированность и воспроизводимость извлечения фактов и классификации.\n- [ ] Значения выше 0 запрещены правилами API.\n*Объяснение*: Стохастический шум недопустим в задачах точной разметки финансовых и продуктовых данных.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 1. Работа с LLM API в Python: OpenAI, Anthropic и Google Gemini\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитик использует LLM API как функцию в data-пайплайнах:\n1. Архитектура Client-Request: передача сообщений (role: system / user / assistant).\n2. Параметры генерации: `temperature` (0.0 для детерминированного анализа данных, 0.7 для креатива), `max_tokens`.\n3. Обработка Rate Limits и Exponential Backoff при сетевых ошибках."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import json\nimport time\n\n# Моделирование унифицированного клиента вызова LLM API с повторными попытками\ndef mock_llm_api_call(messages, temperature=0.0, max_retries=3):\n    \"\"\"Имитация вызова API с защитой Exponential Backoff.\"\"\"\n    for attempt in range(max_retries):\n        try:\n            # Симулируем успешный вызов\n            system_role = [m['content'] for m in messages if m['role'] == 'system'][0]\n            user_msg = [m['content'] for m in messages if m['role'] == 'user'][0]\n            response_payload = {\n                \"id\": \"chatcmpl-mock-2027\",\n                \"model\": \"gpt-4o-mini\",\n                \"temperature\": temperature,\n                \"usage\": {\"prompt_tokens\": 45, \"completion_tokens\": 20, \"total_tokens\": 65},\n                \"choices\": [{\n                    \"message\": {\n                        \"role\": \"assistant\",\n                        \"content\": f\"Аналитический вывод по запросу '{user_msg}': Зафиксирован рост конверсии на 3.4%.\"\n                    }\n                }]\n            }\n            return response_payload\n        except Exception as e:\n            wait = 2 ** attempt\n            time.sleep(wait)\n    raise RuntimeError(\"API недоступен после всех попыток\")\n\ntest_messages = [\n    {\"role\": \"system\", \"content\": \"Ты Staff Data Analyst.\"},\n    {\"role\": \"user\", \"content\": \"Проанализируй динамику A/B теста #42\"}\n]\nresp = mock_llm_api_call(test_messages)\nprint(\"Ответ API:\")\nprint(resp['choices'][0]['message']['content'])\nprint(f\"Потреблено токенов: {resp['usage']['total_tokens']}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка детерминированности температуры\nДля строгих математических расчетов температура обязана быть равна 0.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert resp['temperature'] == 0.0, \"Для аналитики всегда используйте temperature=0.0\"\nassert \"usage\" in resp, \"Ответ API должен возвращать метрики токенов\"\nprint(\"✅ Тест успешно пройден: стандарты работы с API соблюдены!\")\n"}, {"type": "markdown", "content": "### 💡 Почему temperature=0.0 критична для аналитики?\nНенулевая температура вносит стохастический шум, из-за чего один и тот же отчет о выручке при повторном запуске может выдать разные цифры."}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 2. Извлечение структурированных сущностей из неструктурированных данных (NER)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\n\n## 📌 Бизнес-контекст и методология\n80% корпоративных данных — неструктурированные: логи чатов саппорта, PDF-счета, отзывы на маркетплейсах.\nАналитик создает пайплайны Named Entity Recognition (NER), извлекающие атрибуты в строгую таблицу Pandas."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import re\nimport pandas as pd\n\nraw_messages = [\n    \"Клиент ООО 'Вектор' (ИНН 7701234567) жалуется на задержку поставки на 4 дня.\",\n    \"Компания АО 'Технопром' (ИНН 7809876543) просит увеличить лимит до 500 000 руб.\",\n    \"ИП Смирнов (ИНН 500112233445) запросил закрытие счета.\"\n]\n\nextracted_records = []\nfor msg in raw_messages:\n    inn_match = re.search(r'ИНН\\s+(\\d+)', msg)\n    inn = inn_match.group(1) if inn_match else None\n    \n    org_match = re.search(r'(?:ООО|АО|ИП)\\s+([^\\(\\)]+)', msg)\n    org_name = org_match.group(0).strip() if org_match else \"Unknown\"\n    \n    extracted_records.append({\n        'organization': org_name,\n        'inn': inn,\n        'raw_text_len': len(msg)\n    })\n\ndf_entities = pd.DataFrame(extracted_records)\nprint(\"📊 Извлеченные структурированные сущности:\")\nprint(df_entities)\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация полноты извлечения\nУбедитесь, что для всех 3 сообщений ИНН был успешно извлечен без пропусков."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert df_entities['inn'].notna().all(), \"Все ИНН должны быть извлечены\"\nassert len(df_entities) == 3, \"Должно быть 3 записи\"\nprint(\"✅ Тест успешно пройден: неструктурированные данные преобразованы в Dataframe!\")\n"}, {"type": "markdown", "content": "### 💼 Пайплайн обработки текста в 2027 году\nLLM извлекает сложные семантические сущности (тональность, контекст претензии), а быстрые RegEx валидируют строгие форматы (ИНН, номера заказов, email)."}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 3. Structured Outputs через Pydantic: гарантия схемы и типизации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ продакшене аналитик не имеет права получать от модели произвольный текст.\nИспользование Pydantic позволяет валидировать входные и выходные типы данных, гарантируя соблюдение схемы перед записью в хранилище."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "from pydantic import BaseModel, Field, ValidationError\nfrom typing import List, Literal\n\nclass SentimentAnalysisOutput(BaseModel):\n    sentiment: Literal['POSITIVE', 'NEUTRAL', 'NEGATIVE']\n    score: float = Field(..., ge=0.0, le=1.0, description=\"Уверенность модели\")\n    detected_topics: List[str] = Field(default_factory=list)\n\n# Проверка валидного ответа\nvalid_payload = {\n    \"sentiment\": \"NEGATIVE\",\n    \"score\": 0.94,\n    \"detected_topics\": [\"slow_delivery\", \"damaged_box\"]\n}\n\nparsed_obj = SentimentAnalysisOutput(**valid_payload)\nprint(\"🟢 Успешная валидация объекта Pydantic:\")\nprint(parsed_obj.model_dump())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Перехват невалидных данных\nПроверьте, что передача `score = 1.5` (вне диапазона [0, 1]) вызывает исключение `ValidationError`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncaught_error = False\ntry:\n    bad_payload = {\"sentiment\": \"POSITIVE\", \"score\": 1.5, \"detected_topics\": []}\n    SentimentAnalysisOutput(**bad_payload)\nexcept ValidationError:\n    caught_error = True\n\nassert caught_error, \"Pydantic обязан отловить нарушение валидации диапазона score\"\nprint(\"✅ Тест успешно пройден: строгий контракт схемы защищает пайплайн!\")\n"}, {"type": "markdown", "content": "### 💡 Интеграция с базой данных\nОбъекты Pydantic конвертируются в словари через `.model_dump()` и напрямую вставляются в PostgreSQL через SQLAlchemy или DuckDB."}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 4. Batch-процессинг, расчет стоимости токенов и оптимизация затрат (FinOps LLM)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПри обработке 1 000 000 отзывов клиентов вызов API в лоб может стоить тысячи долларов.\nСтратегии оптимизации затрат (FinOps):\n1. **Batch API**: скидка 50% при асинхронной пакетной обработке в течение 24 часов.\n2. **Prompt Caching**: кэширование системного промпта снижает стоимость входных токенов на 75-90%.\n3. **Моделирование размеров моделей**: 90% задач аналитики закрываются быстрыми моделями (mini / flash)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Калькулятор стоимости обработки корпуса текстов\nn_records = 500_000\ntokens_per_input = 400\ntokens_per_output = 50\n\n# Цены за 1M токенов (ориентир 2026-2027)\nprice_input_per_m = 0.15   # $0.15 за 1M токенов вход\nprice_output_per_m = 0.60  # $0.60 за 1M токенов выход\n\ntotal_input_tokens = n_records * tokens_per_input\ntotal_output_tokens = n_records * tokens_per_output\n\ncost_input = (total_input_tokens / 1_000_000) * price_input_per_m\ncost_output = (total_output_tokens / 1_000_000) * price_output_per_m\ntotal_cost_standard = cost_input + cost_output\n\n# При использовании Batch API (-50%)\ncost_batch_api = total_cost_standard * 0.50\n\nprint(f\"Объем данных:                         {n_records:,} записей\")\nprint(f\"Всего входных токенов:               {total_input_tokens:,}\")\nprint(f\"Стоимость Real-time API:             ${total_cost_standard:.2f}\")\nprint(f\"Стоимость через Batch API (-50%):     ${cost_batch_api:.2f}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Экономия при Prompt Caching\nЕсли 300 из 400 входных токенов кэшируются со скидкой 80%, рассчитайте итоговую экономию."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncached_tokens = 300\nuncached_tokens = 100\n\ncached_input_cost = (n_records * cached_tokens / 1_000_000) * (price_input_per_m * 0.20)\nuncached_input_cost = (n_records * uncached_tokens / 1_000_000) * price_input_per_m\ntotal_caching_cost = cached_input_cost + uncached_input_cost + cost_output\n\nprint(f\"Стоимость с Prompt Caching: ${total_caching_cost:.2f}\")\nassert total_caching_cost < total_cost_standard * 0.70, \"Кэширование должно дать существенную экономию\"\nprint(\"✅ Тест успешно пройден: FinOps оптимизация доказана расчетом!\")\n"}, {"type": "markdown", "content": "### 💼 Правило FinOps для аналитика\nВсегда рассчитывайте бюджет до запуска пакетной обработки в цикле `for`."}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11. RAG и векторные базы данных", "cat": "AI стек", "badge": "RAG", "icon": "🔍", "desc": "ChromaDB, семантический поиск, эмбеддинги и вопросно-ответные системы по документам.", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG & Векторные базы данных)\n\n---\n\n### Вопрос 1\nВ чем заключается главное преимущество архитектуры RAG перед файнтюнингом (дообучением) модели на данных компании?\n- [ ] RAG работает без использования электричества.\n- [x] RAG позволяет обращаться к постоянно обновляемым корпоративным документам в реальном времени без дорогостоящего переобучения нейросети и дает ссылки на точные источники.\n- [ ] RAG используется только для картинок.\n*Объяснение*: При изменении регламента или добавлении данных достаточно обновить индекс в векторной БД, не меняя веса модели.\n\n---\n\n### Вопрос 2\nЧто показывает косинусное сходство (Cosine Similarity) между двумя эмбеддингами?\n- [ ] Разницу в количестве букв в тексте.\n- [x] Косинус угла между векторами в многомерном пространстве (от 1.0 — полное совпадение смысла, до 0.0 — отсутствие семантической связи).\n- [ ] Скорость загрузки страницы.\n*Объяснение*: Чем ближе угол векторов к нулю (косинус к 1.0), тем ближе смысловое значение текстов.\n\n---\n\n### Вопрос 3\nКак RAG помогает масштабировать Text-to-SQL в компании с сотнями таблиц в базе данных?\n- [ ] Сжимает таблицы в zip-архив.\n- [x] Динамически находит по смыслу запроса только 2-4 релевантные таблицы и передает в контекст промпта только их схемы, не перегружая лимит контекста.\n- [ ] Удаляет старые таблицы из базы.\n*Объяснение*: Семантический поиск по метаданным оставляет в промпте только нужные фрагменты схемы.\n\n---\n\n### Вопрос 4\nЧто такое косинусное сходство (Cosine Similarity) между векторами эмбеддингов?\n- [ ] Разность длин двух векторов.\n- [x] Косинус угла между ними: отношение скалярного произведения к произведению норм, измеряющее смысловую близость независимо от длины текста.\n- [ ] Количество общих слов в текстах.\n*Объяснение*: Нормализация по длине делает косинус идеальной метрикой для текстов разного объема.\n\n---\n\n### Вопрос 5\nЧто такое Chunking (нарезка текста на фрагменты) в RAG-системах и почему размер чанка критичен?\n- [ ] Удаление знаков препинания.\n- [x] Разбиение длинных документов на логические блоки; слишком мелкий чанк теряет контекст, а слишком крупный размывает семантический вектор в эмбеддинге.\n- [ ] Сжатие файлов архиватором.\n*Объяснение*: Оптимальный размер чанка (обычно 250-500 токенов с перекрытием) обеспечивает баланс точности и полноты поиска.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 1. Эмбеддинги и векторное пространство: геометрия семантического поиска\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭмбеддинг — это перевод смысла текста в многомерный вектор чисел (например, 1536 измерений в OpenAI text-embedding-3). \nБлизкие по смыслу фразы («где посмотреть выручку за май» и «покажи продажи в прошлом месяце») имеют косинусное сходство (Cosine Similarity) близкое к 1.0, даже если не содержат ни одного общего слова!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем косинусное сходство между векторами запросов пользователей к аналитической системе."}, {"type": "code", "content": "def cosine_sim(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n\n# Синтетические эмбеддинги 3 запросов\n# v1: \"выручка за месяц\"\n# v2: \"продажи за май\" (синоним v1)\n# v3: \"как сбросить пароль\" (технический саппорт)\nnp.random.seed(42)\nbase_sales = np.random.normal(1.0, 0.1, 10)\nbase_auth = np.random.normal(-1.0, 0.1, 10)\n\nv1 = base_sales + np.random.normal(0, 0.05, 10)\nv2 = base_sales + np.random.normal(0, 0.05, 10)\nv3 = base_auth + np.random.normal(0, 0.05, 10)\n\nprint(f\"Сходство 'Выручка' <-> 'Продажи': {cosine_sim(v1, v2):.4f} (Высокое сходство!)\")\nprint(f\"Сходство 'Выручка' <-> 'Пароль':  {cosine_sim(v1, v3):.4f} (Полная противоположность)\")"}, {"type": "markdown", "content": "### 📊 Визуализация: 2D Проекция векторного пространства запросов (PCA)\nГрафик ниже демонстрирует, как алгоритмы RAG группируют запросы аналитиков, жалобы клиентов и технические тикеты в отдельные семантические острова."}, {"type": "code", "content": "from sklearn.decomposition import PCA\nimport matplotlib.pyplot as plt\n\nnp.random.seed(42)\n# Создаем 3 кластера запросов: 1) Финансы, 2) Продукт/Фичи, 3) Жалобы на доставку\nfin_queries = [f'Финансовый запрос #{i}' for i in range(1, 11)]\nprod_queries = [f'Вопрос по продукту #{i}' for i in range(1, 11)]\ndelivery_queries = [f'Жалоба на курьера #{i}' for i in range(1, 11)]\n\nfin_vectors = np.random.normal(loc=[3, 3], scale=0.6, size=(10, 2))\nprod_vectors = np.random.normal(loc=[-2, 4], scale=0.6, size=(10, 2))\ndelivery_vectors = np.random.normal(loc=[0, -3], scale=0.6, size=(10, 2))\n\nfig, ax = plt.subplots(figsize=(10, 6))\n\nax.scatter(fin_vectors[:, 0], fin_vectors[:, 1], color='#1779ba', s=90, label='Аналитика и Выручка', zorder=5)\nax.scatter(prod_vectors[:, 0], prod_vectors[:, 1], color='#3adb76', s=90, label='Фичи продукта', zorder=5)\nax.scatter(delivery_vectors[:, 0], delivery_vectors[:, 1], color='#cc4b37', s=90, label='Жалобы на логистику', zorder=5)\n\n# Новый входящий запрос пользователя\nquery_vec = np.array([2.8, 3.2])\nax.scatter(query_vec[0], query_vec[1], color='#ffae00', marker='*', s=350, zorder=6, label='Запрос: \"Сколько заработали в Q2?\"')\nax.annotate('Вектор попадает строго в кластер Финансов!\\nRAG направит запрос в SQL базу выручки',\n            xy=(query_vec[0], query_vec[1]), xytext=(query_vec[0]-2.5, query_vec[1]+1.8),\n            arrowprops=dict(arrowstyle=\"->\", color='#ffae00', lw=2), fontweight='bold')\n\nax.set_title('2D Проекция векторного пространства эмбеддингов (RAG Router)', fontsize=12, fontweight='bold')\nax.set_xlabel('Главная компонента 1')\nax.set_ylabel('Главная компонента 2')\nax.legend(loc='lower left')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Нормализация вектора\nНормализуйте вектор `v1` к единичной длине (L2 norm) и убедитесь, что его норма равна строго 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nnorm_v1 = v1 / np.linalg.norm(v1)\nl2_length = np.linalg.norm(norm_v1)\n\nprint(f\"Длина нормализованного вектора: {l2_length:.4f}\")\nassert np.isclose(l2_length, 1.0), \"Длина единичного вектора обязана равняться 1.0\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Почему векторный поиск важнее ключевых слов?\nОбычный поиск по ключевым словам бессилен при опечатках, синонимах и метафорах. Эмбеддинги улавливают глубинный смысл запроса, позволяя создавать Text-to-SQL помощников нового поколения."}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 2. Векторные базы данных: индексация, метаданные и фильтрация в ChromaDB\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВекторная база данных хранит эмбеддинги вместе с исходным текстом и метаданными, позволяя выполнять быстрый поиск ближайших соседей (HNSW / ANN).\nКритически важный паттерн: **гибридная фильтрация** (поиск по вектору + жесткий фильтр по метаданным `category = 'finance'`)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно
