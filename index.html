  <script>
    const courseData = [{"id": "module_00_onboarding", "title": "Модуль 0: Онбординг & Мышление 2027", "category": "Фундамент", "badge": "Старт", "readme": "# 🚀 Модуль 0: Онбординг и мышление Data Analyst 2027\n\n## 📌 О модуле\nДобро пожаловать в профессию! Аналитика данных образца 2027 года фундаментально отличается от того, что было 5 лет назад. Рутинный синтаксис SQL и Python берет на себя искусственный интеллект, а от аналитика требуются **Problem Framing**, архитектурное понимание данных, формулирование ТЗ для AI и глубокое бизнес-видение.\n\n## 🎯 Learning Outcomes (Таксономия Блума)\n- **Remember**: Терминология (Data Analyst vs Data Scientist, CRISP-DM, EDA, KPI, Pipeline).\n- **Understand**: Отличия роли аналитика до и после AI-революции; архитектуру современного стека данных.\n- **Apply**: Развертывание рабочего окружения в Google Colab, подключение AI-ассистентов, создание первого репозитория на GitHub.\n- **Analyze**: Декомпозиция сырой проблемы бизнеса в систему метрик и аналитических задач.\n\n## 📚 Содержание уроков\n1. `lesson_01_role_data_analyst_2027.ipynb` — Профессия аналитика в эпоху AI: ландшафт рынка, карта компетенций, день из жизни.\n2. `lesson_02_environment_setup_colab_ai.ipynb` — Среда разработки: Google Colab, VS Code, Git, настройка Copilot/Cursor/Claude.\n3. `lesson_03_analytical_thinking_crisp_dm.ipynb` — Аналитическое мышление: методология CRISP-DM, перевод бизнес-боли в метрики.\n4. `quiz.md` — Тест для самопроверки (Active Recall).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 0\n\n### Вопрос 1\nКакова главная роль Data Analyst в 2027 году в условиях доступности генеративного ИИ?\n- [ ] Быстро печатать код SQL и Pandas наизусть без подсказок\n- [x] Постановка бизнес-задач, формулирование ТЗ для AI, валидация результатов и Data Storytelling\n- [ ] Ручной ввод данных в Excel\n\n### Вопрос 2\nЧто означает этап Business Understanding в методологии CRISP-DM?\n- [ ] Выбор цветовой палитры графиков\n- [x] Четкое определение бизнес-цели, метрик успеха и перевод проблемы бизнеса в аналитическую задачу\n- [ ] Очистка пропущенных значений в базе данных\n\n### Вопрос 3\nЕсли общая выручка компании упала на 20%, какой первый шаг должен сделать аналитик?\n- [ ] Сразу обучить нейросеть предсказывать продажи\n- [x] Декомпозировать выручку на составляющие (Traffic * CR * AOV) и определить, какой сегмент дал просадку\n- [ ] Сказать руководству, что виноват отдел маркетинга\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_role_data_analyst_2027.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Урок 1: Кто такой Data Analyst в 2027 году?\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\\n\",\n        \"\\n\",\n        \"## 1. Сдвиг парадигмы: Аналитик 2020 vs Аналитик 2027\\n\",\n        \"\\n\",\n        \"В 2020 году аналитик 80% времени тратил на:\\n\",\n        \"- Поиск синтаксиса `pandas` и StackOverflow\\n\",\n        \"- Ручное исправление запятых в 200-строчных SQL-запросах\\n\",\n        \"- Копирование графиков из Excel в PowerPoint\\n\",\n        \"\\n\",\n        \"В 2027 году рутина автоматизирована LLM. **Аналитик стал архитектором решений и бизнес-стратегом:**\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"2020: [Бизнес вопрос] -> (Аналитик долго пишет SQL) -> (Аналитик строит график) -> [Сырые цифры]\\n\",\n        \"2027: [Бизнес вопрос] -> (Аналитик валидирует гипотезу + ставит ТЗ AI) -> (AI генерит код + пайплайн) -> (Аналитик интерпретирует & Storytelling) -> [Решение бизнеса]\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"### Ключевая формула успеха аналитика 2027:\\n\",\n        \"$$\\\\text{Value} = \\\\text{Domain Knowledge} \\\\times \\\\text{Critical Thinking} \\\\times \\\\text{AI Orchestration}$$\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Анализ рынка вакансий Data Analyst: визуализация тренда ключевых навыков\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"skills = ['SQL', 'Business Metrics', 'AI Prompting / Validation', 'Python / Pandas', 'BI (Looker/PBI)', 'RAG / LLM APIs']\\n\",\n        \"importance_2022 = [95, 70, 5, 85, 90, 0]\\n\",\n        \"importance_2027 = [90, 95, 95, 80, 85, 85]\\n\",\n        \"\\n\",\n        \"x = range(len(skills))\\n\",\n        \"plt.figure(figsize=(10, 5))\\n\",\n        \"plt.plot(skills, importance_2022, marker='o', label='2022 Demand (%)', color='gray', linestyle='--')\\n\",\n        \"plt.plot(skills, importance_2027, marker='s', label='2027 Demand (%)', color='#0066cc', linewidth=2.5)\\n\",\n        \"plt.title('Эволюция требований к Data Analyst (2022 vs 2027)', fontsize=14)\\n\",\n        \"plt.ylabel('Востребованность в вакансиях (%)')\\n\",\n        \"plt.xticks(rotation=20)\\n\",\n        \"plt.grid(True, alpha=0.3)\\n\",\n        \"plt.legend()\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## 2. Карта компетенций современного специалиста\\n\",\n        \"1. **Hard Skills База**: SQL (сложные выборки, оконные функции), Python (Pandas для трансформаций), Looker Studio.\\n\",\n        \"2. **AI Copilot Skills**: Составление точных промптов для генерации кода, валидация ответов (Zero Hallucination Tolerance).\\n\",\n        \"3. **Advanced AI**: Интеграция LLM API в пайплайны, RAG для аналитики внутренних документов.\\n\",\n        \"4. **Soft Skills**: Data Storytelling (пирамида Минто), умение защитить выводы перед CEO.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Урок 1: Кто такой Data Analyst в 2027 году?\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\n\n## 1. Сдвиг парадигмы: Аналитик 2020 vs Аналитик 2027\n\nВ 2020 году аналитик 80% времени тратил на:\n- Поиск синтаксиса `pandas` и StackOverflow\n- Ручное исправление запятых в 200-строчных SQL-запросах\n- Копирование графиков из Excel в PowerPoint\n\nВ 2027 году рутина автоматизирована LLM. **Аналитик стал архитектором решений и бизнес-стратегом:**\n\n```\n2020: [Бизнес вопрос] -> (Аналитик долго пишет SQL) -> (Аналитик строит график) -> [Сырые цифры]\n2027: [Бизнес вопрос] -> (Аналитик валидирует гипотезу + ставит ТЗ AI) -> (AI генерит код + пайплайн) -> (Аналитик интерпретирует & Storytelling) -> [Решение бизнеса]\n```\n\n### Ключевая формула успеха аналитика 2027:\n$$\\text{Value} = \\text{Domain Knowledge} \\times \\text{Critical Thinking} \\times \\text{AI Orchestration}$$\n"}, {"type": "code", "content": "# Анализ рынка вакансий Data Analyst: визуализация тренда ключевых навыков\nimport matplotlib.pyplot as plt\n\nskills = ['SQL', 'Business Metrics', 'AI Prompting / Validation', 'Python / Pandas', 'BI (Looker/PBI)', 'RAG / LLM APIs']\nimportance_2022 = [95, 70, 5, 85, 90, 0]\nimportance_2027 = [90, 95, 95, 80, 85, 85]\n\nx = range(len(skills))\nplt.figure(figsize=(10, 5))\nplt.plot(skills, importance_2022, marker='o', label='2022 Demand (%)', color='gray', linestyle='--')\nplt.plot(skills, importance_2027, marker='s', label='2027 Demand (%)', color='#0066cc', linewidth=2.5)\nplt.title('Эволюция требований к Data Analyst (2022 vs 2027)', fontsize=14)\nplt.ylabel('Востребованность в вакансиях (%)')\nplt.xticks(rotation=20)\nplt.grid(True, alpha=0.3)\nplt.legend()\nplt.tight_layout()\nplt.show()\n"}, {"type": "markdown", "content": "## 2. Карта компетенций современного специалиста\n1. **Hard Skills База**: SQL (сложные выборки, оконные функции), Python (Pandas для трансформаций), Looker Studio.\n2. **AI Copilot Skills**: Составление точных промптов для генерации кода, валидация ответов (Zero Hallucination Tolerance).\n3. **Advanced AI**: Интеграция LLM API в пайплайны, RAG для аналитики внутренних документов.\n4. **Soft Skills**: Data Storytelling (пирамида Минто), умение защитить выводы перед CEO.\n"}]}, {"filename": "lesson_01_what_is_data_analyst.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"id\": \"cbab311d\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"# 📊 Урок 1: Кто такой Data Analyst в 2027 году\\n\",\n        \"\\n\",\n        \"**Модуль 0: Стартовая площадка** | Время: ~45 минут\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"> *«Данные — это новая нефть, а аналитик — тот, кто умеет её перерабатывать в бензин для бизнеса»*\\n\",\n        \"\\n\",\n        \"## 🎯 Цели урока\\n\",\n        \"\\n\",\n        \"После этого урока вы сможете:\\n\",\n        \"- ✅ Объяснить, кто такой Data Analyst и чем он занимается\\n\",\n        \"- ✅ Понять, чем аналитик 2027 года отличается от аналитика 2020 года\\n\",\n        \"- ✅ Перечислить ключевые навыки: Hard Skills, Soft Skills, AI Skills\\n\",\n        \"- ✅ Различать типы аналитиков: продуктовый, маркетинговый, финансовый, BI\\n\",\n        \"- ✅ Понять карьерный путь и уровни зарплат\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"d169cb04\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Кто такой Data Analyst? 🤔\\n\",\n        \"\\n\",\n        \"### Аналогия: Аналитик — это «переводчик» между данными и бизнесом\\n\",\n        \"\\n\",\n        \"Представьте ситуацию: у вашей компании есть огромный склад с коробками. В каждой коробке — числа, даты, имена, суммы покупок, клики на сайте. **Сами по себе эти коробки бесполезны.** Никто не знает, что с ними делать.\\n\",\n        \"\\n\",\n        \"**Data Analyst** — это человек, который:\\n\",\n        \"1. 📦 **Открывает коробки** (собирает и чистит данные)\\n\",\n        \"2. 🔍 **Находит паттерны** (анализирует, что происходит)\\n\",\n        \"3. 📝 **Пишет историю** (визуализирует и объясняет результаты)\\n\",\n        \"4. 💡 **Даёт рекомендации** (помогает бизнесу принять решение)\\n\",\n        \"\\n\",\n        \"### Простой пример\\n\",\n        \"\\n\",\n        \"Менеджер спрашивает: *«Почему у нас упали продажи в марте?»*\\n\",\n        \"\\n\",\n        \"Аналитик:\\n\",\n        \"- Достаёт данные о продажах за последний год\\n\",\n        \"- Смотрит, какие товары «просели»\\n\",\n        \"- Находит, что скидки конкурента совпали с падением\\n\",\n        \"- Показывает это на графике\\n\",\n        \"- Рекомендует: «Давайте запустим акцию на топ-3 товара»\\n\",\n        \"\\n\",\n        \"**Без аналитика** менеджер бы гадал наугад. **С аналитиком** — принимает решение на основе фактов.\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"7d168388\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"---\\n\",\n        \"\\n\",\n        \"## 2. Аналитик 2020 vs Аналитик 2027 🕰️ → 🚀\\n\",\n        \"\\n\",\n        \"Профессия аналитика радикально изменилась. Вот ключевые отличия:\\n\",\n        \"\\n\",\n        \"| Аспект | Аналитик 2020 | Аналитик 2027 |\\n\",\n        \"|--------|--------------|---------------|\\n\",\n        \"| **Основная работа** | Писать SQL-запросы, строить графики в Excel | Формулировать правильные вопросы, интерпретировать результаты AI |\\n\",\n        \"| **Рутина** | 60-70% времени на чистку данных | AI автоматизирует 80% чистки, аналитик проверяет результат |\\n\",\n        \"| **Инструменты** | Excel, SQL, Tableau | Python + AI-ассистенты, SQL, BI-платформы |\\n\",\n        \"| **Роль AI** | Почти не использовался | Ежедневный инструмент: генерация кода, EDA, визуализации |\\n\",\n        \"| **Коммуникация** | Отчёт раз в неделю | Real-time дашборды + storytelling с данными |\\n\",\n        \"| **Ценность** | «Человек, который делает отчёты» | «Человек, который находит инсайты и влияет на решения» |\\n\",\n        \"| **Скорость** | Неделя на анализ | Часы на анализ (с помощью AI) |\\n\",\n        \"\\n\",\n        \"### Главный сдвиг\\n\",\n        \"\\n\",\n        \"> **2020:** Аналитик ценился за то, что *умел писать сложные запросы*.\\n\",\n        \">\\n\",\n        \"> **2027:** Аналитик ценится за то, что *умеет задавать правильные вопросы* и *превращать данные в действия*.\\n\",\n        \"\\n\",\n        \"Это не значит, что технические навыки не нужны — наоборот! Но теперь вы можете использовать AI как «второго пилота», который помогает с кодом, пока вы фокусируетесь на **смысле данных**.\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"71ab4872\",\n      \"cell_type\": \"code\",\n      \"source\": [\n        \"# 🎯 Давайте визуализируем, как изменилось распределение времени аналитика\\n\",\n        \"\\n\",\n        \"# Это ваш первый код! Не бойтесь — просто нажмите ▶️ (Play) слева от ячейки\\n\",\n        \"\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import matplotlib\\n\",\n        \"matplotlib.rcParams['font.size'] = 12\\n\",\n        \"\\n\",\n        \"# --- Аналитик 2020 ---\\n\",\n        \"tasks_2020 = ['Сбор и\\\\nчистка данных', 'Написание\\\\nзапросов/кода', 'Анализ и\\\\nвизуализация', 'Коммуникация\\\\nс бизнесом']\\n\",\n        \"time_2020 = [40, 25, 20, 15]\\n\",\n        \"colors_2020 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\\n\",\n        \"\\n\",\n        \"# --- Аналитик 2027 ---\\n\",\n        \"tasks_2027 = ['Проверка данных\\\\n(AI делает чистку)', 'Промптинг AI +\\\\nпроверка кода', 'Глубокий анализ\\\\nи инсайты', 'Storytelling и\\\\nбизнес-решения']\\n\",\n        \"time_2027 = [15, 20, 30, 35]\\n\",\n        \"colors_2027 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\\n\",\n        \"\\n\",\n        \"fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6))\\n\",\n        \"\\n\",\n        \"# Круговая диаграмма 2020\\n\",\n        \"ax1.pie(time_2020, labels=tasks_2020, autopct='%1.0f%%', colors=colors_2020,\\n\",\n        \"        startangle=90, textprops={'fontsize': 10})\\n\",\n        \"ax1.set_title('⏰ Рабочий день аналитика 2020', fontsize=14, fontweight='bold')\\n\",\n        \"\\n\",\n        \"# Круговая диаграмма 2027\\n\",\n        \"ax2.pie(time_2027, labels=tasks_2027, autopct='%1.0f%%', colors=colors_2027,\\n\",\n        \"        startangle=90, textprops={'fontsize': 10})\\n\",\n        \"ax2.set_title('🚀 Рабочий день аналитика 2027', fontsize=14, fontweight='bold')\\n\",\n        \"\\n\",\n        \"plt.suptitle('Как AI изменил работу аналитика', fontsize=16, fontweight='bold', y=1.02)\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\\n\",\n        \"print(\\\"📊 Обратите внимание: в 2027 году аналитик тратит БОЛЬШЕ времени на анализ и коммуникацию,\\\")\\n\",\n        \"print(\\\"   а AI берёт на себя рутину сбора и чистки данных!\\\")\"\n      ],\n      \"metadata\": {},\n      \"execution_count\": null,\n      \"outputs\": []\n    }\n  ],\n  \"metadata\": {\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"language\": \"python\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 5\n}\n", "cells": [{"type": "markdown", "content": "# 📊 Урок 1: Кто такой Data Analyst в 2027 году\n\n**Модуль 0: Стартовая площадка** | Время: ~45 минут\n\n---\n\n> *«Данные — это новая нефть, а аналитик — тот, кто умеет её перерабатывать в бензин для бизнеса»*\n\n## 🎯 Цели урока\n\nПосле этого урока вы сможете:\n- ✅ Объяснить, кто такой Data Analyst и чем он занимается\n- ✅ Понять, чем аналитик 2027 года отличается от аналитика 2020 года\n- ✅ Перечислить ключевые навыки: Hard Skills, Soft Skills, AI Skills\n- ✅ Различать типы аналитиков: продуктовый, маркетинговый, финансовый, BI\n- ✅ Понять карьерный путь и уровни зарплат"}, {"type": "markdown", "content": "---\n\n## 1. Кто такой Data Analyst? 🤔\n\n### Аналогия: Аналитик — это «переводчик» между данными и бизнесом\n\nПредставьте ситуацию: у вашей компании есть огромный склад с коробками. В каждой коробке — числа, даты, имена, суммы покупок, клики на сайте. **Сами по себе эти коробки бесполезны.** Никто не знает, что с ними делать.\n\n**Data Analyst** — это человек, который:\n1. 📦 **Открывает коробки** (собирает и чистит данные)\n2. 🔍 **Находит паттерны** (анализирует, что происходит)\n3. 📝 **Пишет историю** (визуализирует и объясняет результаты)\n4. 💡 **Даёт рекомендации** (помогает бизнесу принять решение)\n\n### Простой пример\n\nМенеджер спрашивает: *«Почему у нас упали продажи в марте?»*\n\nАналитик:\n- Достаёт данные о продажах за последний год\n- Смотрит, какие товары «просели»\n- Находит, что скидки конкурента совпали с падением\n- Показывает это на графике\n- Рекомендует: «Давайте запустим акцию на топ-3 товара»\n\n**Без аналитика** менеджер бы гадал наугад. **С аналитиком** — принимает решение на основе фактов."}, {"type": "markdown", "content": "---\n\n## 2. Аналитик 2020 vs Аналитик 2027 🕰️ → 🚀\n\nПрофессия аналитика радикально изменилась. Вот ключевые отличия:\n\n| Аспект | Аналитик 2020 | Аналитик 2027 |\n|--------|--------------|---------------|\n| **Основная работа** | Писать SQL-запросы, строить графики в Excel | Формулировать правильные вопросы, интерпретировать результаты AI |\n| **Рутина** | 60-70% времени на чистку данных | AI автоматизирует 80% чистки, аналитик проверяет результат |\n| **Инструменты** | Excel, SQL, Tableau | Python + AI-ассистенты, SQL, BI-платформы |\n| **Роль AI** | Почти не использовался | Ежедневный инструмент: генерация кода, EDA, визуализации |\n| **Коммуникация** | Отчёт раз в неделю | Real-time дашборды + storytelling с данными |\n| **Ценность** | «Человек, который делает отчёты» | «Человек, который находит инсайты и влияет на решения» |\n| **Скорость** | Неделя на анализ | Часы на анализ (с помощью AI) |\n\n### Главный сдвиг\n\n> **2020:** Аналитик ценился за то, что *умел писать сложные запросы*.\n>\n> **2027:** Аналитик ценится за то, что *умеет задавать правильные вопросы* и *превращать данные в действия*.\n\nЭто не значит, что технические навыки не нужны — наоборот! Но теперь вы можете использовать AI как «второго пилота», который помогает с кодом, пока вы фокусируетесь на **смысле данных**."}, {"type": "code", "content": "# 🎯 Давайте визуализируем, как изменилось распределение времени аналитика\n\n# Это ваш первый код! Не бойтесь — просто нажмите ▶️ (Play) слева от ячейки\n\nimport matplotlib.pyplot as plt\nimport matplotlib\nmatplotlib.rcParams['font.size'] = 12\n\n# --- Аналитик 2020 ---\ntasks_2020 = ['Сбор и\\nчистка данных', 'Написание\\nзапросов/кода', 'Анализ и\\nвизуализация', 'Коммуникация\\nс бизнесом']\ntime_2020 = [40, 25, 20, 15]\ncolors_2020 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\n# --- Аналитик 2027 ---\ntasks_2027 = ['Проверка данных\\n(AI делает чистку)', 'Промптинг AI +\\nпроверка кода', 'Глубокий анализ\\nи инсайты', 'Storytelling и\\nбизнес-решения']\ntime_2027 = [15, 20, 30, 35]\ncolors_2027 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6))\n\n# Круговая диаграмма 2020\nax1.pie(time_2020, labels=tasks_2020, autopct='%1.0f%%', colors=colors_2020,\n        startangle=90, textprops={'fontsize': 10})\nax1.set_title('⏰ Рабочий день аналитика 2020', fontsize=14, fontweight='bold')\n\n# Круговая диаграмма 2027\nax2.pie(time_2027, labels=tasks_2027, autopct='%1.0f%%', colors=colors_2027,\n        startangle=90, textprops={'fontsize': 10})\nax2.set_title('🚀 Рабочий день аналитика 2027', fontsize=14, fontweight='bold')\n\nplt.suptitle('Как AI изменил работу аналитика', fontsize=16, fontweight='bold', y=1.02)\nplt.tight_layout()\nplt.show()\n\nprint(\"📊 Обратите внимание: в 2027 году аналитик тратит БОЛЬШЕ времени на анализ и коммуникацию,\")\nprint(\"   а AI берёт на себя рутину сбора и чистки данных!\")"}]}, {"filename": "lesson_02_environment_setup_colab_ai.ipynb", "rel_path": "course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Урок 2: Развертывание рабочего окружения (Colab, Python, AI)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\\n\",\n        \"\\n\",\n        \"В этом уроке мы настроим облачную среду Google Colab и проверим готовность к работе с данными.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Проверка версий ключевых аналитических библиотек\\n\",\n        \"import sys\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"import matplotlib\\n\",\n        \"import sqlite3\\n\",\n        \"\\n\",\n        \"print(\\\"=== ДИАГНОСТИКА ОКРУЖЕНИЯ ===\\\")\\n\",\n        \"print(f\\\"Python version : {sys.version.split()[0]}\\\")\\n\",\n        \"print(f\\\"Pandas version : {pd.__version__}\\\")\\n\",\n        \"print(f\\\"NumPy version  : {np.__version__}\\\")\\n\",\n        \"print(f\\\"Matplotlib     : {matplotlib.__version__}\\\")\\n\",\n        \"print(f\\\"SQLite version : {sqlite3.sqlite_version}\\\")\\n\",\n        \"print(\\\" Среда готова к работе!\\\")\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## Принцип работы с AI-ассистентами в Colab и локально\\n\",\n        \"1. **Cursor / Copilot**: Используются как парный программист (Pair Programmer). Вы формулируете намерение в комментарии, AI предлагает реализацию.\\n\",\n        \"2. **Правило валидации**: Никогда не запускайте AI-код вслепую. Всегда проверяйте типы колонок (`.dtypes`), наличие `NaN`, размеры (`.shape`).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Урок 2: Развертывание рабочего окружения (Colab, Python, AI)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\n\nВ этом уроке мы настроим облачную среду Google Colab и проверим готовность к работе с данными.\n"}, {"type": "code", "content": "# Проверка версий ключевых аналитических библиотек\nimport sys\nimport pandas as pd\nimport numpy as np\nimport matplotlib\nimport sqlite3\n\nprint(\"=== ДИАГНОСТИКА ОКРУЖЕНИЯ ===\")\nprint(f\"Python version : {sys.version.split()[0]}\")\nprint(f\"Pandas version : {pd.__version__}\")\nprint(f\"NumPy version  : {np.__version__}\")\nprint(f\"Matplotlib     : {matplotlib.__version__}\")\nprint(f\"SQLite version : {sqlite3.sqlite_version}\")\nprint(\" Среда готова к работе!\")\n"}, {"type": "markdown", "content": "## Принцип работы с AI-ассистентами в Colab и локально\n1. **Cursor / Copilot**: Используются как парный программист (Pair Programmer). Вы формулируете намерение в комментарии, AI предлагает реализацию.\n2. **Правило валидации**: Никогда не запускайте AI-код вслепую. Всегда проверяйте типы колонок (`.dtypes`), наличие `NaN`, размеры (`.shape`).\n"}]}, {"filename": "lesson_03_analytical_thinking_crisp_dm.ipynb", "rel_path": "course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Урок 3: Аналитическое мышление и фреймворк CRISP-DM\\n\",\n        \"\\n\",\n        \"## 1. Методология CRISP-DM\\n\",\n        \"Стандарт де-факто в индустрии анализа данных:\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"[1. Business Understanding]\\n\",\n        \"           │\\n\",\n        \"[2. Data Understanding]\\n\",\n        \"           │\\n\",\n        \"[3. Data Preparation] ─── (80% рутины, теперь ускоряется AI)\\n\",\n        \"           │\\n\",\n        \"[4. Modeling / Analysis]\\n\",\n        \"           │\\n\",\n        \"[5. Evaluation] ──────── (Защита от галлюцинаций и бизнес-валидация)\\n\",\n        \"           │\\n\",\n        \"[6. Deployment / Action]\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"## 2. Практический кейс: \\\"У нас падают продажи в мобильном приложении\\\"\\n\",\n        \"Как классический новичок отвечает на такой запрос:\\n\",\n        \"- *«Я построил график заказов по дням, вот скриншот»* (Бесполезно для бизнеса).\\n\",\n        \"\\n\",\n        \"Как действует аналитик 2027 года:\\n\",\n        \"1. Декомпозирует проблему на формулу выручки:\\n\",\n        \"$$\\\\text{Revenue} = \\\\text{Traffic} \\\\times \\\\text{Conversion Rate (CR)} \\\\times \\\\text{Average Order Value (AOV)}$$\\n\",\n        \"2. Локализует просадку: какой множитель упал?\\n\",\n        \"3. Проверяет технические срезы: iOS vs Android, версия приложения, сбой платежного шлюза.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Симуляция декомпозиции выручки: поиск точки сбоя\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"data = {\\n\",\n        \"    'Period': ['Week 1 (Baseline)', 'Week 2 (Incident)'],\\n\",\n        \"    'Traffic (Users)': [100000, 102000],\\n\",\n        \"    'Checkout_Conversion': [0.035, 0.018], # Упала почти в 2 раза!\\n\",\n        \"    'AOV (Руб)': [3200, 3250]\\n\",\n        \"}\\n\",\n        \"\\n\",\n        \"df_case = pd.DataFrame(data)\\n\",\n        \"df_case['Revenue'] = df_case['Traffic (Users)'] * df_case['Checkout_Conversion'] * df_case['AOV (Руб)']\\n\",\n        \"df_case['Revenue_Formatted'] = df_case['Revenue'].apply(lambda x: f\\\"{x:,.0f} руб\\\")\\n\",\n        \"print(df_case[['Period', 'Traffic (Users)', 'Checkout_Conversion', 'AOV (Руб)', 'Revenue_Formatted']])\\n\",\n        \"print(\\\"\\\\n Вывод: Трафик и средний чек на месте. Проблема строго в конверсии чекаута!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Урок 3: Аналитическое мышление и фреймворк CRISP-DM\n\n## 1. Методология CRISP-DM\nСтандарт де-факто в индустрии анализа данных:\n\n```\n[1. Business Understanding]\n           │\n[2. Data Understanding]\n           │\n[3. Data Preparation] ─── (80% рутины, теперь ускоряется AI)\n           │\n[4. Modeling / Analysis]\n           │\n[5. Evaluation] ──────── (Защита от галлюцинаций и бизнес-валидация)\n           │\n[6. Deployment / Action]\n```\n\n## 2. Практический кейс: \"У нас падают продажи в мобильном приложении\"\nКак классический новичок отвечает на такой запрос:\n- *«Я построил график заказов по дням, вот скриншот»* (Бесполезно для бизнеса).\n\nКак действует аналитик 2027 года:\n1. Декомпозирует проблему на формулу выручки:\n$$\\text{Revenue} = \\text{Traffic} \\times \\text{Conversion Rate (CR)} \\times \\text{Average Order Value (AOV)}$$\n2. Локализует просадку: какой множитель упал?\n3. Проверяет технические срезы: iOS vs Android, версия приложения, сбой платежного шлюза.\n"}, {"type": "code", "content": "# Симуляция декомпозиции выручки: поиск точки сбоя\nimport pandas as pd\n\ndata = {\n    'Period': ['Week 1 (Baseline)', 'Week 2 (Incident)'],\n    'Traffic (Users)': [100000, 102000],\n    'Checkout_Conversion': [0.035, 0.018], # Упала почти в 2 раза!\n    'AOV (Руб)': [3200, 3250]\n}\n\ndf_case = pd.DataFrame(data)\ndf_case['Revenue'] = df_case['Traffic (Users)'] * df_case['Checkout_Conversion'] * df_case['AOV (Руб)']\ndf_case['Revenue_Formatted'] = df_case['Revenue'].apply(lambda x: f\"{x:,.0f} руб\")\nprint(df_case[['Period', 'Traffic (Users)', 'Checkout_Conversion', 'AOV (Руб)', 'Revenue_Formatted']])\nprint(\"\\n Вывод: Трафик и средний чек на месте. Проблема строго в конверсии чекаута!\")\n"}]}]}, {"id": "module_01_excel", "title": "Модуль 1: Excel & Google Sheets", "category": "Хард-база", "badge": "Таблицы", "readme": "# 📊 Модуль 1: Excel и Google Sheets — Фундамент работы с данными\n\n## 📌 О модуле\nExcel и Google Sheets остаются главным языком коммуникации бизнеса. Топ-менеджеры, финансисты и маркетологи думают таблицами. Аналитик обязан уметь быстро рассчитывать срезы, собирать сводные таблицы и формулировать промпты для генерации сложных формул в Copilot.\n\n## 🎯 Learning Outcomes\n- **Understand**: Структуру плоских таблиц (tidy data), принципы адресации ($A$1 vs A1).\n- **Apply**: Функции `SUMIFS`, `COUNTIFS`, `XLOOKUP`, `INDEX+MATCH`, вложенные условия.\n- **Analyze**: Сводные таблицы (Pivot Tables), вычисляемые поля, когортные группировки.\n- **Create**: Интерактивные отчеты с визуализацией и срезами (Slicers); формулы через AI Copilot.\n\n## 📚 Уроки\n1. `lesson_01_interface_basics_formatting.ipynb` — Интерфейс, горячие клавиши, типы данных, условное форматирование.\n2. `lesson_02_formulas_functions_xlookup.ipynb` — Библиотека формул: математика, логика, текст, даты, современный XLOOKUP.\n3. `lesson_03_pivot_tables_aggregations.ipynb` — Сводные таблицы: многоуровневая группировка, % от общего, срезы.\n4. `lesson_04_visualization_data_story.ipynb` — Построение диаграмм по стандартам Тафти (Tufte): устранение визуального шума.\n5. `lesson_05_ai_copilot_excel_formulas.ipynb` — Промпт-инжиниринг для формул Excel, генерация Google Apps Script, валидация.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Справочник главных формул.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 1 (Excel)\n\n### Вопрос 1\nВ чем ключевое преимущество `XLOOKUP` перед `VLOOKUP`?\n- [ ] XLOOKUP работает быстрее ровно в 10 раз\n- [x] Искомый столбец может находиться левее возвращаемого, формула не ломается при добавлении столбцов\n- [ ] XLOOKUP работает только с числами\n\n### Вопрос 2\nЧто произойдет при копировании формулы `=A$1 + 10` вниз на 5 строк?\n- [ ] Ссылка сместится на A6\n- [x] Номер строки зафиксирован знаком $, ссылка останется на ячейку A1\n- [ ] Выдаст ошибку #REF!\n\n### Вопрос 3\nПочему в профессиональных отчетах избегают 3D круговых диаграмм (Pie Charts)?\n- [ ] Они занимают слишком много памяти на компьютере\n- [x] Они искажают пропорции восприятия долей и перегружают внимание визуальным мусором\n- [ ] Их не поддерживает Excel\n", "cheatsheet": "# 📋 Excel & Sheets Cheatsheet\n\n| Задача | Формула |\n|---|---|\n| Поиск значения | `=XLOOKUP(F2, A:A, C:C, \"Не найдено\")` |\n| Сумма с условием | `=SUMIFS(D:D, A:A, \"Completed\", B:B, \">=\"&DATE(2026,1,1))` |\n| Количество уникальных | `=COUNTA(UNIQUE(FILTER(B:B, A:A=\"Completed\")))` |\n| Безопасный расчет | `=IFERROR(A2 / B2, 0)` |\n| Склейка текста | `=TEXTJOIN(\" - \", TRUE, A2, B2)` |\n", "notebooks": [{"filename": "lesson_01_interface_basics_formatting.ipynb", "rel_path": "course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 1. Урок 1: Архитектура таблиц и базовые операции\\n\",\n        \"\\n\",\n        \"В аналитике таблица должна быть **Tidy Data**:\\n\",\n        \"1. Каждый столбец — одна переменная.\\n\",\n        \"2. Каждая строка — одно наблюдение.\\n\",\n        \"3. Каждая ячейка — единичное значение.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация принципа Tidy Data через Pandas (эквивалент правильной структуры Excel)\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Плохой формат: даты размазаны по колонкам\\n\",\n        \"bad_table = pd.DataFrame({\\n\",\n        \"    'Product': ['Laptop', 'Mouse'],\\n\",\n        \"    'Jan_2026': [1000, 200],\\n\",\n        \"    'Feb_2026': [1200, 250]\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"# Правильный Tidy формат (Unpivoted / Flat)\\n\",\n        \"tidy_table = pd.melt(bad_table, id_vars=['Product'], var_name='Month', value_name='Sales')\\n\",\n        \"print(\\\"НЕПРАВИЛЬНЫЙ ФОРМАТ ДЛЯ АНАЛИТИКИ (Широкий):\\\")\\n\",\n        \"print(bad_table)\\n\",\n        \"print(\\\"\\\\nПРАВИЛЬНЫЙ TIDY ФОРМАТ (Готов для Pivot Table и SQL):\\\")\\n\",\n        \"print(tidy_table)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 1. Урок 1: Архитектура таблиц и базовые операции\n\nВ аналитике таблица должна быть **Tidy Data**:\n1. Каждый столбец — одна переменная.\n2. Каждая строка — одно наблюдение.\n3. Каждая ячейка — единичное значение.\n"}, {"type": "code", "content": "# Демонстрация принципа Tidy Data через Pandas (эквивалент правильной структуры Excel)\nimport pandas as pd\n\n# Плохой формат: даты размазаны по колонкам\nbad_table = pd.DataFrame({\n    'Product': ['Laptop', 'Mouse'],\n    'Jan_2026': [1000, 200],\n    'Feb_2026': [1200, 250]\n})\n\n# Правильный Tidy формат (Unpivoted / Flat)\ntidy_table = pd.melt(bad_table, id_vars=['Product'], var_name='Month', value_name='Sales')\nprint(\"НЕПРАВИЛЬНЫЙ ФОРМАТ ДЛЯ АНАЛИТИКИ (Широкий):\")\nprint(bad_table)\nprint(\"\\nПРАВИЛЬНЫЙ TIDY ФОРМАТ (Готов для Pivot Table и SQL):\")\nprint(tidy_table)\n"}]}, {"filename": "lesson_02_formulas_functions_xlookup.ipynb", "rel_path": "course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 1. Урок 2: Формулы: от агрегаций до XLOOKUP\\n\",\n        \"\\n\",\n        \"## Главные функции аналитика:\\n\",\n        \"- `SUMIFS(sum_range, criteria_range1, criterion1, ...)` — сумма по нескольким условиям.\\n\",\n        \"- `COUNTIFS(...)` — подсчет строк по условиям.\\n\",\n        \"- `XLOOKUP(lookup_value, lookup_array, return_array, if_not_found)` — современная замена устаревшего VLOOKUP. Не ломается при вставке столбцов!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Имитация логики XLOOKUP на реальных данных заказов\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Загрузим датасеты, сгенерированные для курса\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\").head(5)\\n\",\n        \"customers = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customers.csv\\\")\\n\",\n        \"\\n\",\n        \"# Логика: XLOOKUP(orders.customer_id, customers.customer_id, customers.city)\\n\",\n        \"merged_sample = orders.merge(customers[['customer_id', 'city', 'acquisition_channel']], on='customer_id', how='left')\\n\",\n        \"print(\\\"Результат сопоставления данных (аналог XLOOKUP):\\\")\\n\",\n        \"print(merged_sample[['order_id', 'customer_id', 'order_date', 'city', 'acquisition_channel']])\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 1. Урок 2: Формулы: от агрегаций до XLOOKUP\n\n## Главные функции аналитика:\n- `SUMIFS(sum_range, criteria_range1, criterion1, ...)` — сумма по нескольким условиям.\n- `COUNTIFS(...)` — подсчет строк по условиям.\n- `XLOOKUP(lookup_value, lookup_array, return_array, if_not_found)` — современная замена устаревшего VLOOKUP. Не ломается при вставке столбцов!\n"}, {"type": "code", "content": "# Имитация логики XLOOKUP на реальных данных заказов\nimport pandas as pd\n\n# Загрузим датасеты, сгенерированные для курса\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\").head(5)\ncustomers = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\n# Логика: XLOOKUP(orders.customer_id, customers.customer_id, customers.city)\nmerged_sample = orders.merge(customers[['customer_id', 'city', 'acquisition_channel']], on='customer_id', how='left')\nprint(\"Результат сопоставления данных (аналог XLOOKUP):\")\nprint(merged_sample[['order_id', 'customer_id', 'order_date', 'city', 'acquisition_channel']])\n"}]}, {"filename": "lesson_03_pivot_tables_aggregations.ipynb", "rel_path": "course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 1. Урок 3: Сводные таблицы (Pivot Tables)\\n\",\n        \"\\n\",\n        \"Сводная таблица — главный инструмент мгновенного исследования многомерных данных без написания кода.\\n\",\n        \"\\n\",\n        \"Ключевые зоны Pivot Table:\\n\",\n        \"1. **Строки (Rows)**: Измерение группировки (например, Город).\\n\",\n        \"2. **Столбцы (Columns)**: Дополнительный разрез (например, Канал привлечения).\\n\",\n        \"3. **Значения (Values)**: Числовая агрегация (Сумма выручки, Количество клиентов).\\n\",\n        \"4. **Фильтры (Filters / Slicers)**: Глобальный срез данных.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Создание сводного отчета по продажам\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"order_items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"customers = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customers.csv\\\")\\n\",\n        \"\\n\",\n        \"# Сборка плоского датасета\\n\",\n        \"full_df = order_items.merge(orders, on='order_id').merge(customers, on='customer_id')\\n\",\n        \"\\n\",\n        \"# Pivot Table: Город x Канал привлечения -> Выручка\\n\",\n        \"pivot = pd.pivot_table(\\n\",\n        \"    full_df[full_df['status'] == 'Completed'],\\n\",\n        \"    values='total_amount',\\n\",\n        \"    index='city',\\n\",\n        \"    columns='acquisition_channel',\\n\",\n        \"    aggfunc='sum',\\n\",\n        \"    fill_value=0\\n\",\n        \")\\n\",\n        \"print(\\\"Сводная таблица выручки (Руб):\\\")\\n\",\n        \"print(pivot.round(0).astype(int))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 1. Урок 3: Сводные таблицы (Pivot Tables)\n\nСводная таблица — главный инструмент мгновенного исследования многомерных данных без написания кода.\n\nКлючевые зоны Pivot Table:\n1. **Строки (Rows)**: Измерение группировки (например, Город).\n2. **Столбцы (Columns)**: Дополнительный разрез (например, Канал привлечения).\n3. **Значения (Values)**: Числовая агрегация (Сумма выручки, Количество клиентов).\n4. **Фильтры (Filters / Slicers)**: Глобальный срез данных.\n"}, {"type": "code", "content": "# Создание сводного отчета по продажам\nimport pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\norder_items = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\ncustomers = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\n# Сборка плоского датасета\nfull_df = order_items.merge(orders, on='order_id').merge(customers, on='customer_id')\n\n# Pivot Table: Город x Канал привлечения -> Выручка\npivot = pd.pivot_table(\n    full_df[full_df['status'] == 'Completed'],\n    values='total_amount',\n    index='city',\n    columns='acquisition_channel',\n    aggfunc='sum',\n    fill_value=0\n)\nprint(\"Сводная таблица выручки (Руб):\")\nprint(pivot.round(0).astype(int))\n"}]}, {"filename": "lesson_04_visualization_data_story.ipynb", "rel_path": "course/module_01_excel/lesson_04_visualization_data_story.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_04_visualization_data_story.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 1. Урок 4: Графики и принципы Эдварда Тафти (Data-Ink Ratio)\\n\",\n        \"\\n\",\n        \"Принципы чистой визуализации:\\n\",\n        \"1. **Data-Ink Ratio**: Максимум чернил на отображение данных, минимум на фоновые сетки, 3D-эффекты и тени.\\n\",\n        \"2. **Круговые диаграммы (Pie Charts) запрещены**, если срезов больше 3. Человеческий глаз плохо оценивает углы; используйте горизонтальный Bar Chart.\\n\",\n        \"3. Всегда подписывайте единицы измерения.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"order_items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"products = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\products.csv\\\")\\n\",\n        \"df = order_items.merge(products, on='product_id')\\n\",\n        \"\\n\",\n        \"cat_sales = df.groupby('category')['total_amount'].sum().sort_values(ascending=True)\\n\",\n        \"\\n\",\n        \"plt.figure(figsize=(9, 4.5))\\n\",\n        \"bars = plt.barh(cat_sales.index, cat_sales.values, color='#1f77b4', edgecolor='none')\\n\",\n        \"plt.title('Выручка по товарным категориям (Tufte Style)', fontsize=13, pad=15)\\n\",\n        \"plt.xlabel('Сумма (USD)')\\n\",\n        \"# Убираем лишние рамки\\n\",\n        \"for spine in ['top', 'right', 'left']:\\n\",\n        \"    plt.gca().spines[spine].set_visible(False)\\n\",\n        \"plt.grid(axis='x', linestyle=':', alpha=0.6)\\n\",\n        \"# Подписываем значения прямо у столбцов\\n\",\n        \"for bar in bars:\\n\",\n        \"    w = bar.get_width()\\n\",\n        \"    plt.text(w + 1000, bar.get_y() + bar.get_height()/2, f\\\"${w:,.0f}\\\", va='center', fontsize=10)\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 1. Урок 4: Графики и принципы Эдварда Тафти (Data-Ink Ratio)\n\nПринципы чистой визуализации:\n1. **Data-Ink Ratio**: Максимум чернил на отображение данных, минимум на фоновые сетки, 3D-эффекты и тени.\n2. **Круговые диаграммы (Pie Charts) запрещены**, если срезов больше 3. Человеческий глаз плохо оценивает углы; используйте горизонтальный Bar Chart.\n3. Всегда подписывайте единицы измерения.\n"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport pandas as pd\n\norder_items = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\ndf = order_items.merge(products, on='product_id')\n\ncat_sales = df.groupby('category')['total_amount'].sum().sort_values(ascending=True)\n\nplt.figure(figsize=(9, 4.5))\nbars = plt.barh(cat_sales.index, cat_sales.values, color='#1f77b4', edgecolor='none')\nplt.title('Выручка по товарным категориям (Tufte Style)', fontsize=13, pad=15)\nplt.xlabel('Сумма (USD)')\n# Убираем лишние рамки\nfor spine in ['top', 'right', 'left']:\n    plt.gca().spines[spine].set_visible(False)\nplt.grid(axis='x', linestyle=':', alpha=0.6)\n# Подписываем значения прямо у столбцов\nfor bar in bars:\n    w = bar.get_width()\n    plt.text(w + 1000, bar.get_y() + bar.get_height()/2, f\"${w:,.0f}\", va='center', fontsize=10)\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_ai_copilot_excel_formulas.ipynb", "rel_path": "course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 1. Урок 5: AI Copilot для формул и валидация логики\\n\",\n        \"\\n\",\n        \"## Шаблон эффективного промпта для генерации формул:\\n\",\n        \"```text\\n\",\n        \"РОЛЬ: Ты эксперт по Google Sheets / Excel.\\n\",\n        \"ДАННЫЕ: В таблице на листе \\\"Orders\\\" колонка A: Order_Date, B: Customer_ID, C: Amount, D: Status.\\n\",\n        \"ЗАДАЧА: Напиши формулу для расчета среднего чека только для клиентов, совершивших более 3 заказов со статусом \\\"Completed\\\" в 2026 году.\\n\",\n        \"ФОРМАТ: Дай саму формулу, объяснение логики и возможные краевые случаи (деление на ноль).\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"### Чеклист валидации формул от ИИ:\\n\",\n        \"1. Корректность разделителей (запятая `,` в US-локали vs точка с запятой `;` в RU-локали).\\n\",\n        \"2. Обработка ошибок через `IFERROR` / `IFNA`.\\n\",\n        \"3. Соответствие диапазонов строк (не забыли ли знак доллара `$`).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 1. Урок 5: AI Copilot для формул и валидация логики\n\n## Шаблон эффективного промпта для генерации формул:\n```text\nРОЛЬ: Ты эксперт по Google Sheets / Excel.\nДАННЫЕ: В таблице на листе \"Orders\" колонка A: Order_Date, B: Customer_ID, C: Amount, D: Status.\nЗАДАЧА: Напиши формулу для расчета среднего чека только для клиентов, совершивших более 3 заказов со статусом \"Completed\" в 2026 году.\nФОРМАТ: Дай саму формулу, объяснение логики и возможные краевые случаи (деление на ноль).\n```\n\n### Чеклист валидации формул от ИИ:\n1. Корректность разделителей (запятая `,` в US-локали vs точка с запятой `;` в RU-локали).\n2. Обработка ошибок через `IFERROR` / `IFNA`.\n3. Соответствие диапазонов строк (не забыли ли знак доллара `$`).\n"}]}]}, {"id": "module_02_sql", "title": "Модуль 2: SQL Master: От SELECT до Оконных функций", "category": "Хард-база", "badge": "SQL", "readme": "# 🗃️ Модуль 2: SQL — От первых запросов до аналитических оконных функций\n\n## 📌 О модуле\nSQL (Structured Query Language) — главный фундамент data-стека. LLM пишут синтаксис, но только аналитик понимает структуру реляционной модели, видит дублирование при JOIN и умеет оптимизировать тяжелые запросы. В этом модуле мы работаем с реальной SQLite базой e-commerce на 15 000+ записей.\n\n## 🎯 Learning Outcomes\n- **Apply**: Составление сложных запросов (`SELECT`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`).\n- **Analyze**: Все виды `JOIN` (INNER, LEFT, FULL, CROSS, SELF), борьба с декартовым произведением строк.\n- **Evaluate**: Использование CTE (Common Table Expressions) для структурирования запросов вместо спагетти-подзапросов.\n- **Create**: Аналитические оконные функции (`ROW_NUMBER`, `DENSE_RANK`, `LAG`, `LEAD`, `SUM OVER (PARTITION BY ...)`).\n- **AI Orchestration**: Промптинг для генерации SQL, проверка EXPLAIN QUERY PLAN, защита от галлюцинаций агрегаций.\n\n## 📚 Уроки\n1. `lesson_01_db_intro_select_filtering.ipynb` — Подключение к базе, анатомия SQL, SELECT, WHERE, LIKE, IN.\n2. `lesson_02_aggregations_group_by_having.ipynb` — Агрегатные функции, группировка, разница WHERE vs HAVING.\n3. `lesson_03_joins_deep_dive.ipynb` — Реляционная связь, виды JOIN, поиск потерянных строк.\n4. `lesson_04_subqueries_and_cte.ipynb` — Чистый код через CTE (`WITH`), многоуровневая аналитика.\n5. `lesson_05_window_functions_advanced.ipynb` — Оконные функции: ранги, нарастающий итог, темпы роста (MoM / YoY).\n6. `lesson_06_sql_patterns_retention_funnels.ipynb` — Паттерны продуктовой аналитики: когорты, воронки на чистом SQL.\n7. `lesson_07_prompt_engineering_for_sql_and_validation.ipynb` — Генерация SQL через нейросети и строгий чеклист валидации.\n8. `quiz.md` — 15 вопросов со скринингов.\n9. `cheatsheet.md` — Справочник SQL конструкций.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 2 (SQL)\n\n### Вопрос 1\nВ чем разница между `RANK()` и `DENSE_RANK()`?\n- [ ] Разницы нет\n- [x] При одинаковых значениях RANK оставляет пропуски в нумерации (1, 2, 2, 4), а DENSE_RANK нумерует без пробелов (1, 2, 2, 3)\n- [ ] DENSE_RANK работает только в PostgreSQL\n\n### Вопрос 2\nЗачем нужна конструкция `WITH` (CTE)?\n- [ ] Она ускоряет любой запрос в 100 раз\n- [x] Она позволяет разбить сложный запрос на логические читаемые блоки и использовать их повторно\n- [ ] Без нее нельзя соединять таблицы\n\n### Вопрос 3\nКакой результат вернет `COUNT(*)` vs `COUNT(column_name)` если в колонке есть NULL?\n- [ ] Одинаковый\n- [x] `COUNT(*)` считает все строки, а `COUNT(column_name)` игнорирует строки с NULL\n- [ ] Вернет ошибку базы данных\n", "cheatsheet": "# 📋 SQL Cheatsheet\n\n```sql\n-- Оконная функция: прирост к предыдущему значению\nLAG(metric, 1) OVER (PARTITION BY user_id ORDER BY event_date)\n\n-- Оконная функция: доля строки в разрезе группы\nmetric * 100.0 / SUM(metric) OVER (PARTITION BY category)\n\n-- Безопасный расчет конверсии\nROUND(COUNT(DISTINCT converted_users) * 1.0 / NULLIF(COUNT(DISTINCT total_users), 0), 4)\n```\n", "notebooks": [{"filename": "lesson_01_db_intro_select_filtering.ipynb", "rel_path": "course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 1: Архитектура SQL и базовые запросы\\n\",\n        \"\\n\",\n        \"Подключаемся к учебной базе данных `ecommerce.db`.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"DB_PATH = r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\"\\n\",\n        \"conn = sqlite3.connect(DB_PATH)\\n\",\n        \"\\n\",\n        \"# Посмотрим список таблиц\\n\",\n        \"tables = pd.read_sql(\\\"SELECT name FROM sqlite_master WHERE type='table';\\\", conn)\\n\",\n        \"print(\\\"Таблицы в базе данных:\\\")\\n\",\n        \"print(tables)\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## Базовый синтаксис SELECT + WHERE\\n\",\n        \"Порядок выполнения в SQL (важно понимать!):\\n\",\n        \"1. `FROM`\\n\",\n        \"2. `WHERE`\\n\",\n        \"3. `GROUP BY`\\n\",\n        \"4. `HAVING`\\n\",\n        \"5. `SELECT`\\n\",\n        \"6. `ORDER BY`\\n\",\n        \"7. `LIMIT`\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    customer_id, \\n\",\n        \"    first_name, \\n\",\n        \"    city, \\n\",\n        \"    acquisition_channel\\n\",\n        \"FROM customers\\n\",\n        \"WHERE city IN ('Moscow', 'Saint Petersburg')\\n\",\n        \"  AND acquisition_channel = 'Paid Ads'\\n\",\n        \"ORDER BY customer_id ASC\\n\",\n        \"LIMIT 5;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"res = pd.read_sql(query, conn)\\n\",\n        \"print(res)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 1: Архитектура SQL и базовые запросы\n\nПодключаемся к учебной базе данных `ecommerce.db`.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nDB_PATH = r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\"\nconn = sqlite3.connect(DB_PATH)\n\n# Посмотрим список таблиц\ntables = pd.read_sql(\"SELECT name FROM sqlite_master WHERE type='table';\", conn)\nprint(\"Таблицы в базе данных:\")\nprint(tables)\n"}, {"type": "markdown", "content": "## Базовый синтаксис SELECT + WHERE\nПорядок выполнения в SQL (важно понимать!):\n1. `FROM`\n2. `WHERE`\n3. `GROUP BY`\n4. `HAVING`\n5. `SELECT`\n6. `ORDER BY`\n7. `LIMIT`\n"}, {"type": "code", "content": "query = \"\"\"\nSELECT \n    customer_id, \n    first_name, \n    city, \n    acquisition_channel\nFROM customers\nWHERE city IN ('Moscow', 'Saint Petersburg')\n  AND acquisition_channel = 'Paid Ads'\nORDER BY customer_id ASC\nLIMIT 5;\n\"\"\"\nres = pd.read_sql(query, conn)\nprint(res)\n"}]}, {"filename": "lesson_02_aggregations_group_by_having.ipynb", "rel_path": "course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 2: Агрегации: GROUP BY и разница с HAVING\\n\",\n        \"\\n\",\n        \"- `WHERE` фильтрует **сырые строки** ДО агрегации.\\n\",\n        \"- `HAVING` фильтрует **сгруппированные результаты** ПОСЛЕ `GROUP BY`.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    status,\\n\",\n        \"    COUNT(order_id) AS total_orders,\\n\",\n        \"    ROUND(COUNT(order_id) * 100.0 / (SELECT COUNT(*) FROM orders), 2) AS share_pct\\n\",\n        \"FROM orders\\n\",\n        \"GROUP BY status\\n\",\n        \"HAVING total_orders > 50\\n\",\n        \"ORDER BY total_orders DESC;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 2: Агрегации: GROUP BY и разница с HAVING\n\n- `WHERE` фильтрует **сырые строки** ДО агрегации.\n- `HAVING` фильтрует **сгруппированные результаты** ПОСЛЕ `GROUP BY`.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nSELECT \n    status,\n    COUNT(order_id) AS total_orders,\n    ROUND(COUNT(order_id) * 100.0 / (SELECT COUNT(*) FROM orders), 2) AS share_pct\nFROM orders\nGROUP BY status\nHAVING total_orders > 50\nORDER BY total_orders DESC;\n\"\"\"\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_03_joins_deep_dive.ipynb", "rel_path": "course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 3: Объединение таблиц (JOIN)\\n\",\n        \"\\n\",\n        \"Виды соединений:\\n\",\n        \"- **INNER JOIN**: только те строки, которые есть в обеих таблицах.\\n\",\n        \"- **LEFT JOIN**: все строки из левой таблицы + совпадения из правой (если нет совпадений — NULL).\\n\",\n        \"- **WARNING**: Неосторожный JOIN «один-ко-многим» может искусственно размножить строки и утроить выручку в отчете!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    c.acquisition_channel,\\n\",\n        \"    COUNT(DISTINCT o.order_id) AS orders_count,\\n\",\n        \"    ROUND(SUM(oi.total_amount), 2) AS total_revenue,\\n\",\n        \"    ROUND(AVG(oi.total_amount), 2) AS avg_item_revenue\\n\",\n        \"FROM customers c\\n\",\n        \"LEFT JOIN orders o ON c.customer_id = o.customer_id\\n\",\n        \"LEFT JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"WHERE o.status = 'Completed'\\n\",\n        \"GROUP BY c.acquisition_channel\\n\",\n        \"ORDER BY total_revenue DESC;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 3: Объединение таблиц (JOIN)\n\nВиды соединений:\n- **INNER JOIN**: только те строки, которые есть в обеих таблицах.\n- **LEFT JOIN**: все строки из левой таблицы + совпадения из правой (если нет совпадений — NULL).\n- **WARNING**: Неосторожный JOIN «один-ко-многим» может искусственно размножить строки и утроить выручку в отчете!\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nSELECT \n    c.acquisition_channel,\n    COUNT(DISTINCT o.order_id) AS orders_count,\n    ROUND(SUM(oi.total_amount), 2) AS total_revenue,\n    ROUND(AVG(oi.total_amount), 2) AS avg_item_revenue\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id\nLEFT JOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'\nGROUP BY c.acquisition_channel\nORDER BY total_revenue DESC;\n\"\"\"\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_04_subqueries_and_cte.ipynb", "rel_path": "course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 4: Чистый SQL через CTE (Common Table Expressions)\\n\",\n        \"\\n\",\n        \"Вместо вложенных подзапросов в 5 этажей, пишите читаемый код с `WITH`:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"WITH customer_spending AS (\\n\",\n        \"    SELECT \\n\",\n        \"        customer_id,\\n\",\n        \"        ROUND(SUM(total_amount), 2) AS ltv\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY customer_id\\n\",\n        \"),\\n\",\n        \"thresholds AS (\\n\",\n        \"    SELECT AVG(ltv) AS avg_spend FROM customer_spending\\n\",\n        \")\\n\",\n        \"SELECT \\n\",\n        \"    cs.customer_id,\\n\",\n        \"    cs.ltv,\\n\",\n        \"    ROUND(t.avg_spend, 2) AS market_avg,\\n\",\n        \"    CASE \\n\",\n        \"        WHEN cs.ltv >= t.avg_spend * 2 THEN 'VIP Tier'\\n\",\n        \"        WHEN cs.ltv >= t.avg_spend THEN 'Above Average'\\n\",\n        \"        ELSE 'Regular'\\n\",\n        \"    END AS customer_tier\\n\",\n        \"FROM customer_spending cs\\n\",\n        \"CROSS JOIN thresholds t\\n\",\n        \"ORDER BY cs.ltv DESC\\n\",\n        \"LIMIT 10;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 4: Чистый SQL через CTE (Common Table Expressions)\n\nВместо вложенных подзапросов в 5 этажей, пишите читаемый код с `WITH`:\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH customer_spending AS (\n    SELECT \n        customer_id,\n        ROUND(SUM(total_amount), 2) AS ltv\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY customer_id\n),\nthresholds AS (\n    SELECT AVG(ltv) AS avg_spend FROM customer_spending\n)\nSELECT \n    cs.customer_id,\n    cs.ltv,\n    ROUND(t.avg_spend, 2) AS market_avg,\n    CASE \n        WHEN cs.ltv >= t.avg_spend * 2 THEN 'VIP Tier'\n        WHEN cs.ltv >= t.avg_spend THEN 'Above Average'\n        ELSE 'Regular'\n    END AS customer_tier\nFROM customer_spending cs\nCROSS JOIN thresholds t\nORDER BY cs.ltv DESC\nLIMIT 10;\n\"\"\"\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 5: Оконные функции (Window Functions)\\n\",\n        \"\\n\",\n        \"Оконные функции производят вычисления по группе строк, **не схлопывая строки** (в отличие от `GROUP BY`).\\n\",\n        \"\\n\",\n        \"Синтаксис:\\n\",\n        \"$$\\\\text{FUNCTION}() \\\\text{ OVER } (\\\\text{PARTITION BY } col \\\\text{ ORDER BY } col)$$\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"WITH monthly_sales AS (\\n\",\n        \"    SELECT \\n\",\n        \"        SUBSTR(o.order_date, 1, 7) AS order_month,\\n\",\n        \"        ROUND(SUM(oi.total_amount), 2) AS revenue\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY order_month\\n\",\n        \")\\n\",\n        \"SELECT \\n\",\n        \"    order_month,\\n\",\n        \"    revenue,\\n\",\n        \"    -- Нарастающий итог (Running Total)\\n\",\n        \"    ROUND(SUM(revenue) OVER (ORDER BY order_month), 2) AS cumulative_revenue,\\n\",\n        \"    -- Предыдущий месяц через LAG\\n\",\n        \"    LAG(revenue, 1) OVER (ORDER BY order_month) AS prev_month_revenue,\\n\",\n        \"    -- Темп прироста MoM %\\n\",\n        \"    ROUND((revenue - LAG(revenue, 1) OVER (ORDER BY order_month)) * 100.0 / \\n\",\n        \"          LAG(revenue, 1) OVER (ORDER BY order_month), 2) AS mom_growth_pct\\n\",\n        \"FROM monthly_sales\\n\",\n        \"ORDER BY order_month;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 5: Оконные функции (Window Functions)\n\nОконные функции производят вычисления по группе строк, **не схлопывая строки** (в отличие от `GROUP BY`).\n\nСинтаксис:\n$$\\text{FUNCTION}() \\text{ OVER } (\\text{PARTITION BY } col \\text{ ORDER BY } col)$$\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH monthly_sales AS (\n    SELECT \n        SUBSTR(o.order_date, 1, 7) AS order_month,\n        ROUND(SUM(oi.total_amount), 2) AS revenue\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY order_month\n)\nSELECT \n    order_month,\n    revenue,\n    -- Нарастающий итог (Running Total)\n    ROUND(SUM(revenue) OVER (ORDER BY order_month), 2) AS cumulative_revenue,\n    -- Предыдущий месяц через LAG\n    LAG(revenue, 1) OVER (ORDER BY order_month) AS prev_month_revenue,\n    -- Темп прироста MoM %\n    ROUND((revenue - LAG(revenue, 1) OVER (ORDER BY order_month)) * 100.0 / \n          LAG(revenue, 1) OVER (ORDER BY order_month), 2) AS mom_growth_pct\nFROM monthly_sales\nORDER BY order_month;\n\"\"\"\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 6: Продуктовые паттерны на SQL (Когорты & Retention)\\n\",\n        \"\\n\",\n        \"Расчет даты первого заказа для каждого пользователя (Когорта) и распределение повторных покупок.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"WITH first_orders AS (\\n\",\n        \"    SELECT \\n\",\n        \"        customer_id,\\n\",\n        \"        MIN(SUBSTR(order_date, 1, 7)) AS cohort_month\\n\",\n        \"    FROM orders\\n\",\n        \"    WHERE status = 'Completed'\\n\",\n        \"    GROUP BY customer_id\\n\",\n        \"),\\n\",\n        \"customer_activities AS (\\n\",\n        \"    SELECT \\n\",\n        \"        o.customer_id,\\n\",\n        \"        fo.cohort_month,\\n\",\n        \"        SUBSTR(o.order_date, 1, 7) AS order_month\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN first_orders fo ON o.customer_id = fo.customer_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \")\\n\",\n        \"SELECT \\n\",\n        \"    cohort_month,\\n\",\n        \"    COUNT(DISTINCT customer_id) AS total_cohort_users,\\n\",\n        \"    COUNT(DISTINCT CASE WHEN order_month = cohort_month THEN customer_id END) AS month_0,\\n\",\n        \"    COUNT(DISTINCT CASE WHEN order_month > cohort_month THEN customer_id END) AS repeat_buyers\\n\",\n        \"FROM customer_activities\\n\",\n        \"GROUP BY cohort_month\\n\",\n        \"ORDER BY cohort_month\\n\",\n        \"LIMIT 6;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 6: Продуктовые паттерны на SQL (Когорты & Retention)\n\nРасчет даты первого заказа для каждого пользователя (Когорта) и распределение повторных покупок.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH first_orders AS (\n    SELECT \n        customer_id,\n        MIN(SUBSTR(order_date, 1, 7)) AS cohort_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\ncustomer_activities AS (\n    SELECT \n        o.customer_id,\n        fo.cohort_month,\n        SUBSTR(o.order_date, 1, 7) AS order_month\n    FROM orders o\n    JOIN first_orders fo ON o.customer_id = fo.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    cohort_month,\n    COUNT(DISTINCT customer_id) AS total_cohort_users,\n    COUNT(DISTINCT CASE WHEN order_month = cohort_month THEN customer_id END) AS month_0,\n    COUNT(DISTINCT CASE WHEN order_month > cohort_month THEN customer_id END) AS repeat_buyers\nFROM customer_activities\nGROUP BY cohort_month\nORDER BY cohort_month\nLIMIT 6;\n\"\"\"\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 2. Урок 7: AI Prompting для SQL и Чеклист Валидации\\n\",\n        \"\\n\",\n        \"## Шаблон System Prompt для Text-to-SQL:\\n\",\n        \"```sql\\n\",\n        \"Ты senior Data Architect. База данных: SQLite.\\n\",\n        \"Схема:\\n\",\n        \"- customers(customer_id PK, city, acquisition_channel, registration_date)\\n\",\n        \"- orders(order_id PK, customer_id FK, order_date, status)\\n\",\n        \"- order_items(order_item_id PK, order_id FK, product_id FK, quantity, unit_price, total_amount)\\n\",\n        \"Правило: Всегда фильтруй orders.status = 'Completed' при расчете выручки.\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"### Чеклист проверки SQL-кода от нейросети (Red Flags):\\n\",\n        \"- [ ] **Cartesian Explosion**: Не задвоил ли JOIN строки перед SUM? Всегда сравнивайте `COUNT(DISTINCT id)` до и после.\\n\",\n        \"- [ ] **NULL Trap**: Проверены ли пропуски в колонках фильтрации?\\n\",\n        \"- [ ] **Grouping Leak**: Все ли неагрегированные поля из `SELECT` попали в `GROUP BY`?\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 2. Урок 7: AI Prompting для SQL и Чеклист Валидации\n\n## Шаблон System Prompt для Text-to-SQL:\n```sql\nТы senior Data Architect. База данных: SQLite.\nСхема:\n- customers(customer_id PK, city, acquisition_channel, registration_date)\n- orders(order_id PK, customer_id FK, order_date, status)\n- order_items(order_item_id PK, order_id FK, product_id FK, quantity, unit_price, total_amount)\nПравило: Всегда фильтруй orders.status = 'Completed' при расчете выручки.\n```\n\n### Чеклист проверки SQL-кода от нейросети (Red Flags):\n- [ ] **Cartesian Explosion**: Не задвоил ли JOIN строки перед SUM? Всегда сравнивайте `COUNT(DISTINCT id)` до и после.\n- [ ] **NULL Trap**: Проверены ли пропуски в колонках фильтрации?\n- [ ] **Grouping Leak**: Все ли неагрегированные поля из `SELECT` попали в `GROUP BY`?\n"}]}]}, {"id": "module_03_python", "title": "Модуль 3: Python & Pandas (AI-Assisted)", "category": "Хард-база", "badge": "Python", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`),
