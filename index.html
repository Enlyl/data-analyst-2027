 готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\n\ndef cosine_similarity(v1, v2):\n    return float(np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2)))\n\n# Симуляция векторного хранилища с метаданными\nclass SimpleVectorDB:\n    def __init__(self):\n        self.documents = []\n        \n    def add(self, doc_id, text, vector, metadata):\n        self.documents.append({\n            'id': doc_id,\n            'text': text,\n            'vector': np.array(vector),\n            'metadata': metadata\n        })\n        \n    def query(self, query_vec, filter_meta=None, top_k=2):\n        results = []\n        for doc in self.documents:\n            if filter_meta:\n                match = all(doc['metadata'].get(k) == v for k, v in filter_meta.items())\n                if not match:\n                    continue\n            sim = cosine_similarity(query_vec, doc['vector'])\n            results.append((sim, doc))\n        results.sort(key=lambda x: x[0], reverse=True)\n        return results[:top_k]\n\ndb = SimpleVectorDB()\ndb.add(\"1\", \"Как считать LTV для подписочных сервисов\", [0.8, 0.9, 0.1], {\"domain\": \"finance\"})\ndb.add(\"2\", \"Инструкция по настройке SSO авторизации\", [0.1, 0.2, 0.9], {\"domain\": \"it_sec\"})\ndb.add(\"3\", \"Когортный анализ удержания клиентов (Retention)\", [0.75, 0.85, 0.15], {\"domain\": \"finance\"})\n\nq_res = db.query(np.array([0.8, 0.88, 0.1]), filter_meta={\"domain\": \"finance\"}, top_k=1)\nprint(\"Найденный документ:\")\nprint(q_res[0][1]['text'], f\"(Score: {q_res[0][0]:.3f})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка работы фильтра метаданных\nУбедитесь, что найденный документ принадлежит домену `'finance'`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntop_doc = q_res[0][1]\nassert top_doc['metadata']['domain'] == 'finance'\nprint(\"✅ Тест успешно пройден: гибридный поиск отработал безупречно!\")\n"}, {"type": "markdown", "content": "### 💼 Паттерн для аналитика\nПри индексации документации по метрикам обязательно добавляйте в метаданные: `department`, `author`, `last_updated_year`."}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 3. Построение RAG-пайплайна (Retrieval-Augmented Generation) для базы знаний\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\n\n## 📌 Бизнес-контекст и методология\nRAG объединяет поиск по корпоративной базе знаний и генерацию ответа моделью:\n1. Retrieval: поиск релевантных фрагментов документации.\n2. Augmentation: добавление найденных фрагментов в контекст промпта.\n3. Generation: генерация ответа со ссылками на источники."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Сборка RAG-промпта с цитированием контекста\nretrieved_context = [\n    \"Документ #41: Формула расчета CAC = (Маркетинговые расходы + Зарплата сейлзов) / Новые клиенты.\",\n    \"Документ #42: Бенчмарк окупаемости CAC для B2B SaaS составляет менее 12 месяцев.\"\n]\n\nuser_query = \"Как рассчитать CAC и каков здоровый срок окупаемости?\"\n\nrag_prompt = f\"\"\"\nИспользуй ТОЛЬКО следующий контекст для ответа на вопрос:\n{' '.join(retrieved_context)}\n\nВопрос: {user_query}\nОтветь кратко и укажи номера использованных документов.\n\"\"\"\n\nprint(\"Сформированный RAG-промпт:\")\nprint(rag_prompt.strip())\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия контекста\nУбедитесь, что оба документа переданы в RAG-промпт."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"Документ #41\" in rag_prompt\nassert \"Документ #42\" in rag_prompt\nprint(\"✅ Тест успешно пройден: контекстная инъекция выполнена корректно!\")\n"}, {"type": "markdown", "content": "### 💡 Борьба с галлюцинациями в RAG\nВсегда добавляйте инструкцию: \"Если в предоставленном контексте нет ответа, прямо ответь: 'Информация отсутствует в базе знаний'.\"."}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 4. Text-to-SQL RAG-ассистент: индексация схемы DDL и метаданных витрин\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЕсли в корпоративном хранилище 500 таблиц, передать всю схему в промпт невозможно (превышение контекста и деградация внимания).\nРешение: RAG над схемой данных. Мы индексируем описания таблиц и колонок, извлекаем только топ-3 релевантные таблицы и передаем их DDL в LLM."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "table_catalog = {\n    \"dim_customers\": \"Справочник клиентов, города, каналы привлечения и дата регистрации\",\n    \"fct_orders\": \"Транзакции заказов, статус оплаты, дата совершения покупки\",\n    \"fct_server_logs\": \"Технические логи latency микросервисов и ошибок 500\"\n}\n\nuser_biz_question = \"Сколько новых клиентов зарегистрировалось из Москвы?\"\n\n# Простой эвристический семантический матчер для выбора схемы\nselected_tables = []\nfor tbl, desc in table_catalog.items():\n    if \"клиент\" in desc.lower() or \"регистраци\" in desc.lower():\n        selected_tables.append(tbl)\n\nprint(f\"Бизнес-вопрос: {user_biz_question}\")\nprint(f\"Автоматически отобранные релевантные таблицы схемы: {selected_tables}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация отбора таблиц\nУбедитесь, что таблица `dim_customers` выбрана, а `fct_server_logs` исключена."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"dim_customers\" in selected_tables\nassert \"fct_server_logs\" not in selected_tables\nprint(\"✅ Тест успешно пройден: редукция схемы выполнена успешно!\")\n"}, {"type": "markdown", "content": "### 💼 Архитектура Enterprise Text-to-SQL\n1. Vector Search по метаданным таблиц -> 2. Сборка DDL топ-5 таблиц -> 3. Генерация SQL -> 4. Dry-run валидация через EXPLAIN."}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12. AI агенты и автоматический анализ", "cat": "AI стек", "badge": "Агенты", "icon": "🕹️", "desc": "Паттерн ReAct, LangChain, автономные аналитические агенты, вызывающие SQL и код.", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты & LLM Evaluation)\n\n---\n\n### Вопрос 1\nЧто лежит в основе паттерна ReAct для автономных агентов?\n- [ ] Однократный ответ без проверки.\n- [x] Цикл: рассуждение (Thought) -> выбор инструмента и действие (Action) -> наблюдение за результатом (Observation) -> корректировка дальнейших шагов.\n- [ ] Перезагрузка базы данных.\n*Объяснение*: ReAct позволяет агенту динамически адаптировать свой план при получении промежуточных данных.\n\n---\n\n### Вопрос 2\nЧто означает метрика Faithfulness во фреймворках тестирования LLM (Ragas / DeepEval)?\n- [ ] Скорость генерации ответа в токенах за секунду.\n- [x] Доля утверждений в сгенерированном ответе, которые строго подтверждаются контекстом переданных данных (отсутствие галлюцинаций).\n- [ ] Количество положительных отзывов пользователей.\n*Объяснение*: Faithfulness гарантирует, что ИИ не додумал цифры от себя.\n\n---\n\n### Вопрос 3\nКакую роль выполняет LLM-as-a-Judge в индустрии 2027 года?\n- [ ] Вынесение юридических приговоров.\n- [x] Использование сильной LLM для автоматической оценки качества, корректности и точности работы других прикладных моделей и пайплайнов на тестовых датасетах.\n- [ ] Блокировка спама.\n*Объяснение*: LLM-as-a-Judge масштабирует проверку качества аналитики без необходимости вручную вычитывать тысячи ответов.\n\n---\n\n### Вопрос 4\nЧто представляет собой цикл ReAct (Reason + Act) в агентных системах?\n- [ ] Быстрое обновление страницы в браузере.\n- [x] Чередование шагов размышления модели (Thought), вызова инструмента (Action) и анализа ответа инструмента (Observation) до достижения цели.\n- [ ] Автоматическое удаление неверных файлов.\n*Объяснение*: ReAct позволяет агенту динамически планировать следующие шаги на основе фактических данных.\n\n---\n\n### Вопрос 5\nЗачем в коде AI-агентов обязательно настраивать параметр max_iterations?\n- [ ] Чтобы ограничить расход электричества.\n- [x] Чтобы предотвратить бесконечный цикл и исчерпание баланса API при возникновении непредвиденной ошибки в одном из инструментов.\n- [ ] Это требование языка Python.\n*Объяснение*: Ограничитель итераций — базовый предохранитель стабильности продакшен-систем.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 1. Концепция агентных рабочих процессов (ReAct Pattern: Reason + Act)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\n\n## 📌 Бизнес-контекст и методология\nAI-агент отличается от обычного чат-бота наличием цикла действий и инструментов (Tool Calling).\nПаттерн **ReAct**:\n1. **Thought (Размышление)**: агент оценивает текущее состояние.\n2. **Action (Действие)**: вызов внешнего инструмента (SQL-запрос, расчет в Python, HTTP API).\n3. **Observation (Наблюдение)**: получение результата работы инструмента.\n4. Повторение цикла до достижения финального ответа."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Симуляция цикла ReAct агента\ndef execute_agent_step(goal, current_step, tool_output=None):\n    if current_step == 0:\n        return {\"thought\": \"Нужно получить список заказов за прошлую неделю\", \"action\": \"run_sql('SELECT count(*) FROM orders')\"}\n    elif current_step == 1:\n        return {\"thought\": f\"Получено наблюдение: {tool_output}. Теперь формирую ответ.\", \"action\": \"FINISH\", \"final_answer\": f\"Всего заказов: {tool_output}\"}\n\nstep0 = execute_agent_step(\"Посчитай заказы\", 0)\nstep1 = execute_agent_step(\"Посчитай заказы\", 1, tool_output=\"14,250\")\n\nprint(f\"Шаг 1: {step0['thought']} -> {step0['action']}\")\nprint(f\"Шаг 2: {step1['thought']} -> {step1['final_answer']}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка завершения цикла\nУбедитесь, что на шаге 1 агент вызвал действие `'FINISH'`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert step1[\"action\"] == \"FINISH\"\nassert \"14,250\" in step1[\"final_answer\"]\nprint(\"✅ Тест успешно пройден: цикл ReAct отработал штатно!\")\n"}, {"type": "markdown", "content": "### 💡 Защита от бесконечного цикла\nВсегда устанавливайте параметр `max_iterations` (обычно 5-10 шагов), чтобы агент не зациклился при ошибке инструмента."}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 2. Инструменты и тулы аналитика в LangChain / LlamaIndex\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nИнструмент (Tool) — это Python-функция с описанием входных аргументов, которую модель может вызвать по своему усмотрению."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Описание интерфейса тула аналитика\ndef calculate_metric_delta(val_current: float, val_previous: float) -> dict:\n    \"\"\"Вычисляет абсолютное и относительное изменение метрики.\"\"\"\n    diff_abs = val_current - val_previous\n    diff_rel = (diff_abs / val_previous) if val_previous != 0 else 0.0\n    return {\"absolute_change\": diff_abs, \"relative_change_pct\": round(diff_rel * 100, 2)}\n\ntool_spec = {\n    \"name\": \"calculate_metric_delta\",\n    \"description\": \"Полезно для расчета дельты между текущим и прошлым периодом\",\n    \"parameters\": {\n        \"val_current\": \"float\",\n        \"val_previous\": \"float\"\n    }\n}\n\nres = calculate_metric_delta(120.0, 100.0)\nprint(f\"Результат выполнения тула: {res}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка расчета дельты\nУбедитесь, что относительный прирост составляет 20.0%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert res[\"relative_change_pct\"] == 20.0\nassert res[\"absolute_change\"] == 20.0\nprint(\"✅ Тест успешно пройден: тул аналитика протестирован!\")\n"}, {"type": "markdown", "content": "### 💼 Качество docstring в тулах\nМодель решает, вызывать ли инструмент, основываясь исключительно на его docstring. Пишите описания максимально конкретно."}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 3. Автономный агент мониторинга аномалий и сбора данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАвтономный агент запускается по расписанию (cron), опрашивает базу данных, сравнивает метрики с доверительными интервалами и отправляет алерт в Slack/Telegram при выходе за пределы нормы."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import numpy as np\n\n# Логика детекции аномалий в автономном агенте\ndef anomaly_detector_agent(current_value, history_values):\n    mean_hist = np.mean(history_values)\n    std_hist = np.std(history_values)\n    z_score = (current_value - mean_hist) / std_hist if std_hist > 0 else 0\n    \n    is_anomaly = abs(z_score) > 2.5\n    severity = \"CRITICAL\" if abs(z_score) > 3.5 else (\"WARNING\" if is_anomaly else \"NORMAL\")\n    return {\"is_anomaly\": is_anomaly, \"z_score\": round(z_score, 2), \"severity\": severity}\n\nhistory = [100, 102, 98, 105, 99, 101, 103]\nalert = anomaly_detector_agent(145, history) # Внезапный скачок\nprint(f\"Результат работы агента мониторинга: {alert}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Детекция критической аномалии\nУбедитесь, что для значения 145 агент выставил флаг `is_anomaly = True`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert alert[\"is_anomaly\"] == True\nassert alert[\"severity\"] in [\"WARNING\", \"CRITICAL\"]\nprint(\"✅ Тест успешно пройден: аномалия успешно зафиксирована агентом!\")\n"}, {"type": "markdown", "content": "### 💡 Борьба с Alert Fatigue\nНе отправляйте алерты по каждому шуму. Группируйте уведомления и настраивайте скользящие окна сглаживания."}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 4. Оценка и мониторинг агентных систем в продакшене (Observability & Tracing)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ агентных системах критически важна трассировка (Tracing): сколько шагов сделал агент, какие инструменты вызвал, какова латентность каждого шага и суммарная стоимость сессии."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Моделирование объекта трассировки (Trace Log)\ntrace_log = {\n    \"trace_id\": \"tr-9812-agent\",\n    \"total_steps\": 3,\n    \"tools_called\": [\"sql_runner\", \"python_evaluator\"],\n    \"total_latency_sec\": 2.45,\n    \"total_cost_usd\": 0.0034,\n    \"status\": \"SUCCESS\"\n}\n\ndef validate_agent_execution(trace):\n    if trace[\"total_steps\"] > 5:\n        return False, \"Слишком много итераций\"\n    if trace[\"total_latency_sec\"] > 10.0:\n        return False, \"Превышен SLA по времени\"\n    return True, \"SLA соблюден\"\n\nok, msg = validate_agent_execution(trace_log)\nprint(f\"Статус проверки трассировки: {ok} ({msg})\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка SLA\nУбедитесь, что тестовый лог удовлетворяет критериям SLA."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert ok == True\nprint(\"✅ Тест успешно пройден: мониторинг агентных систем настроен!\")\n"}, {"type": "markdown", "content": "### 💼 OpenTelemetry в аналитике\nСовременные платформы (LangSmith, Phoenix, OpenLLMetry) сохраняют полные деревья трассировок вызовов в OpenTelemetry формате."}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13. Soft Skills и Data Storytelling", "cat": "Soft Skills", "badge": "Коммуникация", "icon": "🎤", "desc": "Пирамида Минто, юнит-экономика (LTV, CAC, Retention) и презентация выводов стейкхолдерам.", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n---\n\n### Вопрос 1\nКакое отношение LTV / CAC считается эталонным стандартом для устойчивого масштабирования бизнеса?\n- [ ] Ровно 1.0x (работа в ноль).\n- [x] От 3.0x и выше при сроке окупаемости (Payback) до 12 месяцев.\n- [ ] Менее 0.5x.\n*Объяснение*: Соотношение $\\ge 3$ компенсирует операционные расходы, налоги и оставляет чистую прибыль на развитие.\n\n---\n\n### Вопрос 2\nВ чем заключается принцип Пирамиды Минто при защите отчета перед топ-менеджментом?\n- [ ] Начинать презентацию с подробного описания процесса парсинга и очистки данных.\n- [x] Начинать сразу с ключевого вывода и рекомендуемого решения (Answer First), а затем подкреплять его аргументами и цифрами.\n- [ ] Не показывать цифры вообще.\n*Объяснение*: Руководители принимают решения; им в первую очередь нужен ответ на вопрос: «Что делать и какой экономический эффект?».\n\n---\n\n### Вопрос 3\nЧто такое Problem Framing в работе аналитика?\n- [ ] Оформление дашборда в корпоративные рамки.\n- [x] Процесс перевода абстрактной жалобы или идеи бизнеса в строго проверяемую систему метрик, гипотез и аналитических задач.\n- [ ] Установка Python библиотек.\n*Объяснение*: Problem Framing гарантирует, что аналитик решает настоящую корневую проблему, а не симптомы.\n\n---\n\n### Вопрос 4\nВ чем суть принципа Answer First в пирамиде Минто?\n- [ ] Отвечать на письма клиентов быстрее чем за 1 минуту.\n- [x] Начинать презентацию сразу с главного управленческого вывода или рекомендации, а затем подкреплять его логическими аргументами и деталями.\n- [ ] Никогда не показывать графики руководству.\n*Объяснение*: Руководители высшего звена мыслят решениями; подход Answer First экономит их время и фокусирует дискуссию.\n\n---\n\n### Вопрос 5\nЧто показывает метрика Payback Period (Срок окупаемости CAC) в юнит-экономике?\n- [ ] Время работы службы поддержки.\n- [x] Количество месяцев, за которое валовая прибыль от привлеченного клиента полностью покрывает затраты на его привлечение (CAC).\n- [ ] Срок действия банковской карты клиента.\n*Объяснение*: Здоровый Payback Period в B2B SaaS составляет менее 12 месяцев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 1. Бизнес-метрики и Unit-экономика: CAC, LTV, Retention и маржинальность\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик, считающий только среднее и p-value, бесполезен бизнесу. \nГлавный язык общения с топ-менеджментом и инвесторами — **Unit-экономика**. \nОна отвечает на вопрос: «Зарабатывает ли компания на одном конкретном клиенте (юните), или каждый новый пользователь увеличивает чистый убыток?». \nЗолотое правило масштабирования стартапа: $LTV / CAC \\ge 3.0$ при сроке окупаемости (Payback Period) $< 12$ месяцев."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем Unit-экономику когорты: стоимость привлечения (CAC), валовую маржу, средний чек и итоговый LTV."}, {"type": "code", "content": "# Параметры Unit-экономики B2B SaaS продукта\ncac = 450.0            # Стоимость привлечения клиента ($)\narpu_month = 95.0      # Выручка в месяц ($)\ngross_margin = 0.82    # Валовая маржинальность (82%)\nchurn_rate_month = 0.04 # Месячный отток (4%)\n\nlifetime_months = 1 / churn_rate_month  # 25 месяцев\nltv = arpu_month * gross_margin * lifetime_months  # $1,947.50\nltv_cac_ratio = ltv / cac\npayback_months = cac / (arpu_month * gross_margin)\n\nprint(f\"LTV (Lifetime Value):   ${ltv:,.2f}\")\nprint(f\"CAC (Acquisition Cost): ${cac:,.2f}\")\nprint(f\"LTV / CAC отношение:    {ltv_cac_ratio:.2f}x (Здоровый бизнес > 3.0x)\")\nprint(f\"Срок окупаемости (Payback): {payback_months:.1f} мес.\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Водопад Unit-экономики (Waterfall Chart)\nВодопадная диаграмма ниже раскладывает валовую выручку на составляющие: от CAC и себестоимости серверов до чистой прибыли на клиента."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анатомия Unit-экономики клиента (LTV vs CAC)', fontsize=14, fontweight='bold')\n\n# 1. Водопад формирования чистой прибыли на юнит\nax1 = axes[0]\nstages = ['LTV (Выручка)', 'COGS (Серверы)', 'Поддержка', 'Маркетинг (CAC)', 'Чистый доход']\nvalues = [ltv, -ltv*(1-gross_margin), -120, -cac, 0]\nvalues[-1] = sum(values[:-1])\n\nbottoms = [0, ltv - ltv*(1-gross_margin), ltv - ltv*(1-gross_margin) - 120, ltv - ltv*(1-gross_margin) - 120 - cac, 0]\ncolors = ['#1779ba', '#cc4b37', '#cc4b37', '#ffae00', '#3adb76']\n\nbars = ax1.bar(stages, [abs(v) for v in values], bottom=bottoms, color=colors, edgecolor='white', width=0.55)\nax1.set_title(f'Waterfall прибыли: LTV/CAC = {ltv_cac_ratio:.1f}x', fontsize=11)\nax1.set_ylabel('Сумма на одного клиента ($)')\nax1.set_xticklabels(stages, rotation=25, ha='right', fontsize=9)\nax1.grid(True, linestyle=':', alpha=0.5)\n\nfor i, b in enumerate(bars):\n    val = values[i]\n    y_pos = bottoms[i] + b.get_height() / 2\n    sign = '+' if val > 0 else ''\n    ax1.text(b.get_x() + b.get_width()/2, y_pos, f'{sign}${val:,.0f}', ha='center', va='center',\n             color='white', fontweight='bold', fontsize=9)\n\n# 2. График окупаемости CAC во времени (Payback Curve)\nax2 = axes[1]\nmonths_timeline = np.arange(0, 37)\ncumulative_contribution = -cac + (arpu_month * gross_margin) * months_timeline\n\nax2.plot(months_timeline, cumulative_contribution, color='#1779ba', linewidth=2.5, label='Накопленный денежный поток')\nax2.axhline(0, color='#cc4b37', linestyle='--', linewidth=1.5, label='Точка безубыточности (0$)')\nax2.axvline(payback_months, color='#3adb76', linestyle=':', linewidth=2, label=f'Окупаемость = {payback_months:.1f} мес.')\nax2.fill_between(months_timeline, -cac, cumulative_contribution, where=(cumulative_contribution < 0), color='#cc4b37', alpha=0.15)\nax2.fill_between(months_timeline, 0, cumulative_contribution, where=(cumulative_contribution >= 0), color='#3adb76', alpha=0.15)\n\nax2.set_title('Кривая окупаемости привлечения клиента (Payback Timeline)', fontsize=11)\nax2.set_xlabel('Месяцев жизни клиента')\nax2.set_ylabel('Чистый финансовый итог ($)')\nax2.legend(loc='lower right')\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Влияние оттока на отношение LTV/CAC\nЕсли месячный отток вырастет с 4% до 7%, рассчитайте новое отношение LTV / CAC и определите, останется ли юнит-экономика здоровой (> 3.0x)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nnew_churn = 0.07\nnew_ltv = arpu_month * gross_margin * (1 / new_churn)\nnew_ratio = new_ltv / cac\n\nprint(f\"Новый LTV при оттоке 7%: ${new_ltv:,.2f}\")\nprint(f\"Новое отношение LTV/CAC:  {new_ratio:.2f}x\")\n\nassert new_ratio < ltv_cac_ratio, \"Рост оттока обязан снижать LTV/CAC\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главный урок Unit-экономики:\nСнижение оттока (Retention) влияет на LTV в разы сильнее, чем снижение стоимости привлечения (CAC). Удерживать старых клиентов всегда выгоднее, чем заливать дырявую воронку новым платным трафиком."}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 2. Problem Framing: перевод размытых бизнес-вопросов в строгие дата-задачи\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЗаказчик почти никогда не приходит с четким ТЗ. Обычно он говорит: \"Кажется, наши продажи падают, разберись\".\nФреймворк **Issue Tree (Дерево проблем)** декомпозирует вопрос:\n1. Выручка = Трафик $\times$ Конверсия (CR) $\times$ Средний чек (AOV).\n2. Падение в каком именно сегменте? (Новые vs Повторные клиенты).\n3. Проблема техническая (отказ платежей) или маркетинговая (нецелевой трафик)?"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Пример декомпозиции выручки по мультипликативной модели\ndef decompose_revenue(visitors, cr, aov):\n    orders = visitors * cr\n    revenue = orders * aov\n    return {\"visitors\": visitors, \"orders\": int(orders), \"revenue\": revenue}\n\nbaseline = decompose_revenue(100_000, 0.03, 3000)\nbad_month = decompose_revenue(100_000, 0.024, 3000) # CR просел с 3.0% до 2.4%\n\nloss = baseline[\"revenue\"] - bad_month[\"revenue\"]\nprint(f\"Базовая выручка:  {baseline['revenue']:,.0f} руб.\")\nprint(f\"Выручка в кризис: {bad_month['revenue']:,.0f} руб.\")\nprint(f\"Потери из-за просадки CR: {loss:,.0f} руб.\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка относительных потерь\nВычислите относительную долю потерянной выручки."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nloss_pct = loss / baseline[\"revenue\"]\nprint(f\"Потеряно: {loss_pct:.1%} выручки\")\n\nassert round(loss_pct, 2) == 0.20, \"Просадка CR на 20% дает 20% потерю выручки при неизменных прочих\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💼 Правило первой встречи\nНикогда не начинайте писать SQL до тех пор, пока с заказчиком письменно не зафиксирован ожидаемый результат анализа."}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 3. Пирамида Минто (Minto Pyramid Principle) и C-Level презентации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПринцип пирамиды Минто (McKinsey): **Answer First**.\nСначала озвучьте главное управленческое решение / рекомендацию, затем приведите 3 ключевых аргумента, и только в конце — детализирующие расчеты."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Шаблон executive-сообщения по принципу Минто\nminto_structure = {\n    \"headline\": \"Рекомендуем заморозить закупки в категории X и перенаправить 15 млн руб. в категорию Y.\",\n    \"key_arguments\": [\n        \"Категория X показывает отрицательную маржинальность (-4%) из-за роста возвратов.\",\n        \"Категория Y растет на 45% YoY с маржинальностью 28%.\",\n        \"Срок окупаемости реаллокации бюджета составит 2.5 месяца.\"\n    ],\n    \"action_plan\": [\n        \"1. Согласовать лимиты с финдиректором до пятницы.\",\n        \"2. Скорректировать автозаказ в ERP системе.\"\n    ]\n}\n\nprint(f\"📌 ГЛАВНЫЙ ВЫВОД (ANSWER FIRST):\\n{minto_structure['headline']}\\n\")\nprint(\"🔍 АРГУМЕНТАЦИЯ:\")\nfor arg in minto_structure['key_arguments']:\n    print(f\"  • {arg}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка полноты аргументации\nУбедитесь, что приведено не менее 3 ключевых аргументов в структуре."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert len(minto_structure[\"key_arguments\"]) >= 3\nassert \"headline\" in minto_structure\nprint(\"✅ Тест успешно пройден: структура Минто безупречна!\")\n"}, {"type": "markdown", "content": "### 💡 Формат One-Pager\nТоп-менеджмент ценит лаконичность: весь отчет должен умещаться на один лист A4 или один экран слайда."}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 4. Сквозной кейс: Data Storytelling и структура «Что? Ну и что? Что делать?»\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\n\n## 📌 Бизнес-контекст и методология\nРуководители C-Level не хотят видеть сырой SQL или 20 разрозненных графиков без выводов. \nЭталонная подача аналитики строится по трехактной структуре McKinsey / Google:\n1. **Что произошло? (Fact):** Внезапное падение конверсии на 14% в июне.\n2. **Ну и что? (Impact & Root Cause):** Потери $120,000/мес; баг затронул только пользователей Safari на iOS 18.\n3. **Что делать? (Recommendation):** Срочный хотфикс платежного SDK + ретроспектива QA."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем временной ряд инцидента с конверсией и разложим его по браузерным сегментам."}, {"type": "code", "content": "np.random.seed(42)\ndates = pd.date_range('2026-06-01', periods=30, freq='D')\n\n# Нормальная конверсия 8.5%\nchrome_cr = 0.085 + np.random.normal(0, 0.003, 30)\n# Safari падает после релиза 12 июня\nsafari_cr = 0.085 + np.random.normal(0, 0.003, 30)\nsafari_cr[11:] -= 0.035  # обвал до 5.0%\n\ntotal_cr = 0.6 * chrome_cr + 0.4 * safari_cr\nprint(\"Средняя конверсия до 12 июня:   {:.2%}\".format(np.mean(total_cr[:11])))\nprint(\"Средняя конверсия после 12 июня: {:.2%}\".format(np.mean(total_cr[11:])))"}, {"type": "markdown", "content": "### 📊 Визуализация: Аннотированная нарративная диаграмма инцидента\nГрафик ниже оформлен в стиле The Economist и Financial Times: четкая аннотация момента релиза, подсветка корневой причины и стрелка решения."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(14, 6))\n\nax.plot(dates, chrome_cr * 100, color='#767676', linewidth=2, linestyle='--', label='Chrome (Стабилен 8.5%)')\nax.plot(dates, safari_cr * 100, color='#cc4b37', linewidth=2.5, label='Safari iOS (Обвал с 12 июня до 5.0%)')\nax.plot(dates, total_cr * 100, color='#1779ba', linewidth=3, label='Общая конверсия чекаута')\n\n# Аннотация инцидента\nrelease_date = dates[11]\nax.axvline(release_date, color='#cc4b37', linestyle=':', linewidth=2)\nax.scatter(release_date, safari_cr[11] * 100, color='#cc4b37', s=100, zorder=5)\n\nax.annotate('Релиз v2.4 (12 июня):\\nБаг верстки кнопки оплаты\\nна Safari iOS',\n            xy=(release_date, safari_cr[11] * 100),\n            xytext=(dates[13], 4.0),\n            arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=2),\n            fontweight='bold', color='#cc4b37', bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#fff2f0\", ec=\"#cc4b37\"))\n\n# Аннотация хотфикса\nax.annotate('Рекомендация:\\nОткат платежного SDK\\nвернет +$120K/мес',\n            xy=(dates[25], total_cr[25] * 100),\n            xytext=(dates[20], 8.8),\n            arrowprops=dict(arrowstyle=\"->\", color='#3adb76', lw=2),\n            fontweight='bold', color='#2d864e', bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f0fff4\", ec=\"#3adb76\"))\n\nax.set_title('Data Storytelling: Что произошло с конверсией в июне и где источник проблемы?', fontsize=13, fontweight='bold')\nax.set_xlabel('Дата')\nax.set_ylabel('Конверсия в заказ (%)')\nax.set_ylim(3.0, 10.5)\nax.legend(loc='lower left')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет финансовых потерь от инцидента\nЕсли в день на чекаут заходят 10,000 пользователей, средний чек $45, а падение конверсии составило 1.4 п.п. (0.014), сколько компания теряет за 18 дней бага?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndaily_visitors = 10000\naov = 45.0\ncr_drop = 0.014\ndays_incident = 18\n\nlost_orders_daily = daily_visitors * cr_drop\ntotal_revenue_loss = lost_orders_daily * aov * days_incident\n\nprint(f\"Потеряно заказов в день: {int(lost_orders_daily)}\")\nprint(f\"Суммарные потери выручки: ${total_revenue_loss:,.0f}\")\n\nassert total_revenue_loss == 113400.0, \"Потери: 10000 * 0.014 * 45 * 18 = 113,400$\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Золотое правило C-Level презентации:\nВсегда завершайте аналитический отчет слайдом с конкретным планом действий (Action Items), ответственными лицами и ожидаемым финансовым эффектом в долларах."}]}]}, {"id": "module_14_portfolio_project_1", "title": "Проект 1. E-Commerce 360 аудит", "cat": "Портфолио", "badge": "Проект", "icon": "🛒", "desc": "Сквозной аудит 15 000+ заказов: когортный анализ, LTV, выручка, воронка конверсий.", "readme": "# 🛒 Портфолио-проект 1: Сквозная E-Commerce аналитика 360°\n\n## 📌 Описание проекта\nПолноценный аудит интернет-магазина на основе реальной базы заказов (15 000+ позиций, база `ecommerce.db`):\n1. **SQL Витрина**: Расчет LTV, среднего чека, маржинальности.\n2. **Pandas & Python**: Когортный анализ удержания (Retention Rate Matrix) и RFM-сегментация клиентов.\n3. **Looker Studio**: Создание интерактивного дашборда для коммерческого директора.\n4. **Бизнес-отчет**: Аналитическая записка с точками роста выручки.\n\n## 📁 Файлы\n- `project_1_ecommerce_analytics.ipynb` — Полный рабочий ноутбук выполнения проекта от SQL до визуализации.\n", "quiz": "# 🧠 Quiz: Защита Проекта 1 (E-Commerce 360°)\n\n---\n\n### Вопрос 1\nЧто показывает RFM-сегментация клиентской базы?\n- [ ] Скорость загрузки карточек товаров на сайте.\n- [x] Сегментацию клиентов по трем измерениям: давность последней покупки (Recency), частота заказов (Frequency) и общая сумма затрат (Monetary).\n- [ ] Ошибки в артикулах товаров на складе.\n*Объяснение*: RFM позволяет точечно адресовать маркетинг: удерживать VIP-клиентов и реактивировать уходящих.\n\n---\n\n### Вопрос 2\nКакое главное действие должен предпринять отдел маркетинга для сегмента «At Risk» (высокая частота в прошлом, но давно не покупали)?\n- [ ] Не беспокоить их, чтобы не раздражать.\n- [x] Запустить персональную триггерную реактивацию со скидкой или бонусами, пока клиент окончательно не ушел к конкурентам.\n- [ ] Удалить их контакты из базы.\n*Объяснение*: Клиенты «At Risk» уже знакомы с брендом и имеют высокий LTV; их реактивация гораздо дешевле привлечения нового холодного трафика.\n\n---\n\n### Вопрос 3\nПочему при расчете когортного Retention важно группировать клиентов по месяцу первой покупки, а не по месяцу регистрации?\n- [ ] Месяц регистрации всегда совпадает с месяцем покупки.\n- [x] Аналитика интересует удержание платящих клиентов; регистрация без покупки не генерирует юнит-экономику.\n- [ ] Это требование стандарта SQL.\n*Объяснение*: Retention платящих пользователей показывает реальную ценность продукта (Product-Market Fit) и возврат инвестиций в привлечение (CAC).\n\n---\n\n### Вопрос 4\nВ таблице `orders` интернет-магазина статус заказа равен `'Refunded'`. Как учесть этот заказ при расчете чистой выручки (Net Revenue)?\n- [ ] Проигнорировать возврат, так как деньги поступили на счет.\n- [x] Исключить данный заказ из расчета чистой выручки либо вычесть сумму возврата из валового оборота.\n- [ ] Умножить сумму на два.\n*Объяснение*: Возвраты не являются выручкой и при искажении отчетности приведут к выплате незаработанных бонусов и неверному учету налогов.\n\n---\n\n### Вопрос 5\nПо результатам когортного анализа Retention 2-го месяца упал с 25% до 14%. Каково первое действие аналитика?\n- [ ] Немедленно переписать SQL-запрос.\n- [x] Сегментировать просевшую когорту по рекламным каналам, устройствам и категориям первого купленного товара.\n- [ ] Увеличить скидки на весь каталог.\n*Объяснение*: Локализация просадки позволяет понять истинную причину: приток нецелевого трафика из нового канала или баг в мобильном приложении.\n", "cheatsheet": "", "notebooks": [{"filename": "project_1_ecommerce_analytics.ipynb", "rel_path": "course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 🛒 Выпускной проект 1: Сквозной аудит интернет-магазина (E-Commerce 360° Audit)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт флагманского проекта\n* **Заказчик**: Коммерческий директор маркетплейса (Retail & E-commerce).\n* **Проблема**: За последние два квартала темп роста выручки замедлился. Заказчик подозревает просадку повторных покупок (LTV) и неэффективность платных каналов привлечения.\n* **Стек**: SQL (SQLite/PostgreSQL), Python (Pandas, NumPy, Seaborn), RFM-сегментация, когортный анализ, Pyramid Principle.\n* **Цель**: Провести глубокий аудит клиентской базы, сегментировать клиентов по ценности (RFM), оценить Retention по когортам и составить Executive Presentation для C-Level с конкретным планом действий."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: SQL-аналитика когорт и жизненного цикла клиентов\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\nconn = sqlite3.connect(db_path)\n\n# SQL-запрос для извлечения витрины RFM (Recency, Frequency, Monetary)\nquery_rfm = \"\"\"\nWITH customer_aggregates AS (\n    SELECT \n        c.customer_id,\n        c.city,\n        c.acquisition_channel,\n        c.device,\n        MAX(o.order_date) AS last_order_date,\n        COUNT(DISTINCT o.order_id) AS total_orders,\n        ROUND(SUM(oi.total_amount), 2) AS total_monetary\n    FROM customers c\n    JOIN orders o ON c.customer_id = o.customer_id\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY c.customer_id\n)\nSELECT \n    customer_id,\n    city,\n    acquisition_channel,\n    device,\n    last_order_date,\n    total_orders,\n    total_monetary\nFROM customer_aggregates;\n\"\"\"\n\ndf_rfm_raw = pd.read_sql_query(query_rfm, conn)\nprint(f\"📊 Извлечено активных покупателей с завершенными заказами: {len(df_rfm_raw):,}\")\nprint(df_rfm_raw.head())\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Построение скоринга RFM и кластеризация клиентов\nРассчитайте:\n1. `recency_days`: количество дней с момента последней покупки клиента до максимальной даты базы (`2026-10-31`).\n2. Скоринг R, F, M по квантилям (от 1 до 4, где 4 — наилучший результат).\n3. Создайте сегмент `'Champions'` для клиентов с `R_score >= 3` и `M_score >= 3`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsnapshot_date = pd.to_datetime('2026-10-31')\ndf_rfm = df_rfm_raw.copy()\ndf_rfm['last_order_date'] = pd.to_datetime(df_rfm['last_order_date'])\ndf_rfm['recency_days'] = (snapshot_date - df_rfm['last_order_date']).dt.days\n\n# Расчет баллов RFM\ndf_rfm['r_score'] = pd.qcut(df_rfm['recency_days'], q=4, labels=[4, 3, 2, 1]).astype(int)\ndf_rfm['f_score'] = pd.qcut(df_rfm['total_orders'].rank(method='first'), q=4, labels=[1, 2, 3, 4]).astype(int)\ndf_rfm['m_score'] = pd.qcut(df_rfm['total_monetary'], q=4, labels=[1, 2, 3, 4]).astype(int)\n\ndf_rfm['segment'] = np.where(\n    (df_rfm['r_score'] >= 3) & (df_rfm['m_score'] >= 3),\n    'Champions',\n    np.where(df_rfm['r_score'] <= 2, 'At Risk / Churn', 'Regular')\n)\n\nsegment_stats = df_rfm.groupby('segment').agg(\n    users=('customer_id', 'count'),\n    revenue=('total_monetary', 'sum'),\n    avg_orders=('total_orders', 'mean')\n).reset_index()\n\nprint(\"📊 Результаты RFM-сегментации:\")\nprint(segment_stats)\n\nassert len(df_rfm[df_rfm['segment'] == 'Champions']) > 0, \"Сегмент Champions должен быть не пустым\"\nassert df_rfm['total_monetary'].sum() > 0, \"Сумма выручки должна быть положительной\"\nprint(\"✅ Тест успешно пройден: RFM-модель построена корректно!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: RFM-Сегментация клиентской базы и Выручка сегментов\nГрафики ниже представляют ключевой артефакт портфолио проекта:\n1. **RFM 2D Скаттер:** сегменты клиентов (Champions, Loyal, At Risk, Hibernating) по давности последнего заказа и чеку;\n2. **Вклад сегментов в общую выручку бизнеса ($).**"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport numpy as np\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('RFM Customer Segmentation & Revenue Contribution', fontsize=14, fontweight='bold')\n\n# 1. Скаттер Recency vs Monetary\nax1 = axes[0]\nnp.random.seed(42)\nn_cust = 300\nrecency = np.random.exponential(45, n_cust)\nmonetary = np.random.exponential(250, n_cust) + 20\n\n# Кластеризация по правилам RFM\nsegments = []\ncolors_seg = []\nfor r, m in zip(recency, monetary):\n    if r < 30 and m > 300:\n        segments.append('VIP / Champions')\n        colors_seg.append('#3adb76')\n    elif r < 60:\n        segments.append('Loyal Customers')\n        colors_seg.append('#1779ba')\n    elif m > 200:\n        segments.append('At Risk / Big Spenders')\n        colors_seg.append('#ffae00')\n    else:\n        segments.append('Lost / Hibernating')\n        colors_seg.append('#cc4b37')\n\nscatter = ax1.scatter(recency, monetary, c=colors_seg, alpha=0.7, s=40, edgecolor='white')\nax1.set_title('RFM Сегменты: Давность (Recency) vs Выручка (Monetary)', fontsize=11)\nax1.set_xlabel('Дней с последней покупки (Recency)')\nax1.set_ylabel('Общая сумма покупок ($)')\nax1.axvline(60, color='#767676', linestyle=':', label='Порог риска оттока (60 дней)')\nax1.legend(loc='upper right')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Выручка по сегментам\nax2 = axes[1]\nseg_series = pd.Series(segments)\nmon_series = pd.Series(monetary)\nrev_by_seg = mon_series.groupby(seg_series).sum().sort_values()\n\nbars = ax2.barh(rev_by_seg.index, rev_by_seg.values / 1000,\n                color=['#cc4b37', '#ffae00', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Суммарная выручка по сегментам клиентов ($K)', fontsize=11)\nax2.set_xlabel('Выручка ($K)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 0.5, b.get_y() + b.get_height()/2, f'${w:.1f}K', va='center', fontweight='bold', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 📌 ЭТАП 3: C-Level Executive Summary (Minto Pyramid)\n1. **Answer First**: Главный драйвер выручки — сегмент Champions (обеспечивает свыше 40% денежного оборота).\n2. **Key Action**: Запустить автоматические retention-рассылки для сегмента 'At Risk' через 30 дней после заказа.\n3. **Budget Impact**: Предотвращение оттока 15% рисковых клиентов сохранит 2.4 млн руб. выручки в следующем квартале."}]}]}, {"id": "module_15_portfolio_project_2", "title": "Проект 2. SaaS аналитика и A/B тест", "cat": "Портфолио", "badge": "Проект", "icon": "📱", "desc": "Анализ 2 000 пользователей, оценка воронки активации и расчет результатов A/B теста фичи.", "readme": "# 📱 Портфолио-проект 2: SaaS Продуктовая аналитика и A/B Тестирование\n\n## 📌 Описание проекта\nАнализ продуктовых метрик B2B SaaS платформы (2000 компаний, датасет `saas_users.csv`):\n1. **Воронка активации**: Использование ключевых фичей A и B.\n2. **Анализ оттока (Churn Analysis)**: Влияние NPS и тарифа на удержание клиентов.\n3. **A/B Эксперимент**: Полный статистический анализ нового флоу оплаты (Z-test, проверка SRM, расчет доверительных интервалов).\n\n## 📁 Файлы\n- `project_2_saas_product_analytics.ipynb` — Сквозной рабочий ноутбук проекта.\n", "quiz": "# 🧠 Quiz: Защита Проекта 2 (SaaS Product Analytics & A/B)\n\n---\n\n### Вопрос 1\nПочему перед расчетом конверсий в A/B-тесте обязательно проводить проверку на SRM (Sample Ratio Mismatch)?\n- [ ] Чтобы проверить скорость интернета.\n- [x] Потому что неравномерное распределение трафика указывает на технический баг рандомизатора (например, отвал пользователей на старых браузерах), делая любые выводы о конверсии невалидными.\n- [ ] Это формальное требование без математического смысла.\n*Объяснение*: Если одна группа системно теряет пользователей до попадания в лог, выборки смещены.\n\n---\n\n### Вопрос 2\nЕсли $p\\text{-value} = 0.008$ при пороге $\\alpha = 0.05$, какое решение принимает продуктовый аналитик?\n- [ ] Отклонить альтернативную гипотезу и продолжить тест.\n- [x] Отклонить нулевую гипотезу (разница статистически значима) и при отсутствии деградации защитных метрик рекомендовать раскатку фичи.\n- [ ] Перезагрузить сервер.\n*Объяснение*: $p < \\alpha$ означает статистическую достоверность зафиксированного эффекта.\n\n---\n\n### Вопрос 3\nA/B-тест показал рост конверсии в подписку на +12%, но защитная метрика Churn Rate 1-го месяца выросла на 4 п.п. Что должен рекомендовать аналитик?\n- [ ] Срочно раскатать новую форму на 100% пользователей.\n- [x] Заблокировать раскатку: рост кратковременной конверсии нивелируется ускоренным оттоком клиентов, снижая общий LTV.\n- [ ] Отключить мониторинг Churn Rate.\n*Объяснение*: Защитные метрики (Guardrail Metrics) страхуют бизнес от «токсичной оптимизации» локальных показателей в ущерб долгосрочной экономике.\n\n---\n\n### Вопрос 4\nЧто такое Net Revenue Retention (NRR) в B2B SaaS и почему инвесторы ставят его выше обычной выручки?\n- [ ] Процент пользователей, заходящих в приложение каждый день.\n- [x] Процент удержания выручки от существующей когорты клиентов с учетом апгрейдов, даунгрейдов и оттока (здоровый NRR > 110%).\n- [ ] Сумма налога на прибыль.\n*Объяснение*: NRR > 100% означает, что бизнес растет даже без привлечения новых клиентов за счет расширения существующих контрактов.\n\n---\n\n### Вопрос 5\nВ ходе A/B теста получено $p\\text{-value} = 0.18$ при наблюдаемом относительном приросте конверсии +8.9%. Каково корректное управленческое решение?\n- [ ] Объявить победу тестовой группы, так как +8.9% — это отличный рост.\n- [x] Заморозить раскатку: наблюдаемый прирост статистически не отличим от случайного шума на текущем размере выборки.\n- [ ] Удалить группу A.\n*Объяснение*: Раскатка фичи с $p > 0.05$ несет высокий риск внедрения пустышки, которая потратит ресурсы инженеров без реального бизнес-эффекта.\n", "cheatsheet": "", "notebooks": [{"filename": "project_2_saas_product_analytics.ipynb", "rel_path": "course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 📱 Выпускной проект 2: Продуктовая аналитика B2B SaaS и статистический A/B аудит\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт проекта\n* **Продукт**: Облачная платформа аналитики подписок (SaaS).\n* **Бизнес-задача**:\n  1. Выявить скрытые триггеры оттока (Churn Analysis) на базе поведения пользователей (`saas_users.csv`).\n  2. Провести сквозной статистический аудит A/B-эксперимента новой формы онбординга (`ab_test_checkout.csv`): проверка SRM, расчет Z-теста и бутстрэпа, экономическая оценка раскатки."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: Аудит факторов оттока (Churn Drivers)\nimport pandas as pd\nimport numpy as np\nfrom scipy import stats\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Анализ зависимости оттока от использования фич (Feature Adoption)\nfeature_usage_churn = df_saas.groupby('is_churned').agg(\n    avg_nps=('nps_score', 'mean'),\n    avg_seats=('active_seats', 'mean'),\n    avg_feature_a=('feature_a_usage', 'mean'),\n    avg_feature_b=('feature_b_usage', 'mean'),\n    avg_mrr=('mrr', 'mean')\n).reset_index()\n\nprint(\"📊 Сравнение характеристик активных (0) и оттекших (1) клиентов:\")\nprint(feature_usage_churn)\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Статистический анализ A/B теста онбординга\n1. Проверьте A/B тест на Sample Ratio Mismatch (SRM) через `stats.chisquare`.\n2. Рассчитайте конверсию групп A (Control) и B (Variant).\n3. Проведите двусторонний Z-тест для разницы конверсий и сделайте вывод о значимости."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_ab = pd.read_csv(ab_csv)\n\n# 1. SRM Check\ncounts = df_ab['test_group'].value_counts()\nstat_srm, p_srm = stats.chisquare(counts.values, [len(df_ab)/2, len(df_ab)/2])\nprint(f\"SRM Chi2: {stat_srm:.3f}, p-value: {p_srm:.4f}\")\nassert p_srm > 0.01, \"SRM не обнаружен, группы разделены честно\"\n\n# 2. Conversion Analysis\ncr_a = df_ab[df_ab['test_group'] == 'A_Control']['converted'].mean()\ncr_b = df_ab[df_ab['test_group'] == 'B_Variant']['converted'].mean()\nn_a = len(df_ab[df_ab['test_group'] == 'A_Control'])\nn_b = len(df_ab[df_ab['test_group'] == 'B_Variant'])\n\nuplift_rel = (cr_b - cr_a) / cr_a\npooled_p = (cr_a * n_a + cr_b * n_b) / (n_a + n_b)\nse = np.sqrt(pooled_p * (1 - pooled_p) * (1/n_a + 1/n_b))\nz_score = (cr_b - cr_a) / se\np_value = 2 * (1 - stats.norm.cdf(abs(z_score)))\n\nprint(f\"CR A: {cr_a:.2%}, CR B: {cr_b:.2%}, Относительный прирост: +{uplift_rel:.1%}\")\nprint(f\"Z-score: {z_score:.3f}, p-value: {p_value:.4e}\")\n\nis_significant = p_value < 0.05\nprint(f\"Статистическая значимость на уровне alpha=0.05: {is_significant}\")\n\nassert not is_significant, \"На текущей выборке различия не достигли порога alpha=0.05\"\nassert uplift_rel > 0, \"Наблюдаемый точечный uplift положителен, но статистически не подтвержден\"\nprint(\"✅ Тест успешно пройден: аналитик избежал ложноположительной ошибки (False Discovery)!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: Тепловая карта когортного удержания (Cohort Retention)\nЗолотой стандарт продуктовой аналитики B2B SaaS: удержание пользователей по когортам регистрации от Месяца 0 до Месяца 11."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport seaborn as sns\n\n# Моделирование матрицы когортного удержания (12 месяцев x 12 когорт)\ncohort_labels = [f'2025-{m:02d}' for m in range(1, 13)]\nn_cohorts = len(cohort_labels)\nretention_matrix = np.full((n_cohorts, n_cohorts), np.nan)\n\nfor i in range(n_cohorts):\n    base_ret = 1.0\n    for j in range(n_cohorts - i):\n        if j == 0:\n            retention_matrix[i, j] = 100.0\n        else:\n            # Логарифмический спад с выходом на плато\n            decay = 0.55 * np.exp(-0.35 * j) + 0.35\n            retention_matrix[i, j] = decay * 100.0 + np.random.normal(0, 1.2)\n\nfig, ax = plt.subplots(figsize=(14, 7))\nsns.heatmap(retention_matrix, annot=True, fmt='.0f', cmap='Blues', ax=ax,\n            xticklabels=[f'M+{m}' for m in range(n_cohorts)],\n            yticklabels=cohort_labels, cbar_kws={'label': 'Retention Rate (%)'})\n\nax.set_title('SaaS Cohort Retention Matrix (Плато удержания на уровне ~35%)', fontsize=13, fontweight='bold')\nax.set_xlabel('Месяцев с момента регистрации (Lifetime)')\nax.set_ylabel('Когорта регистрации')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 💼 ЭТАП 3: C-Level вердикт по эксперименту\n* Наблюдаемый прирост конверсии составляет +8.9%, однако $p = 0.18 > 0.05$.\n* Риск ошибки I рода (ложная тревога) превышает допустимый порог.\n* **Управленческое решение**: Раскатку на 100% заморозить до сбора расчетного Sample Size либо признать эффект статистическим шумом, сэкономив ресурсы разработки на поддержку сырой функциональности."}]}]}, {"id": "module_16_portfolio_project_3", "title": "Проект 3. AI-Driven аналитический пайплайн", "cat": "Портфолио", "badge": "Проект", "icon": "⚡", "desc": "Обработка 800+ отзывов через LLM API, категоризация болей и интерактивный дашборд.", "readme": "# 🤖 Портфолио-проект 3: AI-Driven Analytical Pipeline & Smart BI Chat\n\n## 📌 Описание проекта (Флагманский проект 2027 года)\nЭтот проект выделит ваше резюме среди сотен классических кандидатов. Мы строим сквозную AI-систему:\n1. **Сбор неструктурированных данных**: Отзывы клиентов из `customer_reviews.csv`.\n2. **LLM API Обогащение**: Извлечение тем жалоб, sentiment-анализ и структурирование в JSON.\n3. **RAG База знаний**: Индексация метрик компании в векторной БД ChromaDB.\n4. **Smart BI Agent**: Чат-ассистент, который принимает вопрос на человеческом языке, находит контекст в регламентах, пишет SQL-запрос к `ecommerce.db` и отдает бизнес-ответ с визуализацией!\n\n## 📁 Файлы\n- `project_3_ai_driven_bi_pipeline.ipynb` — Полный код пайплайна.\n", "quiz": "# 🧠 Quiz: Защита Проекта 3 (AI-Driven BI Pipeline)\n\n---\n\n### Вопрос 1\nКакова ключевая ценность связки LLM API + Векторная БД (RAG) в аналитическом пайплайне компании?\n- [ ] Полная замена живых сотрудников на роботов.\n- [x] Возможность автоматически структурировать до 80% закрытых корпоративных данных (отзывы, регламенты, документация) и открывать к ним мгновенный семантический доступ на естественном языке без галлюцинаций.\n- [ ] Увеличение расхода памяти на сервере.\n*Объяснение*: RAG объединяет вычислительную мощь LLM с актуальными закрытыми данными компании.\n\n---\n\n### Вопрос 2\nЧто обеспечивает надежную защиту от галлюцинаций в корпоративном Text-to-SQL ассистенте?\n- [x] Ограничение генерации SQL к реальной DDL схеме БД, проверка через EXPLAIN/AST и запрет деструктивных операций (DROP/DELETE).\n- [ ] Отключение интернета.\n- [ ] Использование исключительно коротких вопросов от пользователей.\n*Объяснение*: Верификация схемы и AST-валидация гарантируют надежность получаемых цифр до передачи данных в BI.\n\n---\n\n### Вопрос 3\nЗачем при построении RAG-ассистента над метаданными хранилища использовать гибридный поиск (Keyword + Semantic Vector Search)?\n- [ ] Векторный поиск не умеет работать со строками.\n- [x] Векторный поиск находит контекстный смысл («выручка компании»), а ключевой поиск точно матчит технические идентификаторы колонок (`fct_mrr_v2`).\n- [ ] Это снижает объем оперативной памяти в 10 раз.\n*Объяснение*: Гибридный поиск дает наивысшую точность (Recall@K) при поиске по техническим схемам баз данных.\n\n---\n\n### Вопрос 4\nКакой механизм позволяет подавать на вход LLM API миллионы клиентских обращений без риска перерасхода бюджета компании?\n- [ ] Ручной ввод текстов в веб-интерфейс чат-бота.\n- [x] Использование асинхронного Batch API со скидкой 50% и Prompt Caching для системных инструкций.\n- [ ] Отказ от парсинга текста.\n*Объяснение*: Batch API и кэширование префиксов — ключевые инструменты FinOps для больших корпусов данных.\n\n---\n\n### Вопрос 5\nЧто такое Self-Correction Loop в агентных аналитических системах?\n- [ ] Автоматическое удаление неверных строк из исходной базы данных.\n- [x] Механизм, при котором агент перехватывает ошибку выполнения SQL-запроса, анализирует текст ошибки и автоматически генерирует исправленный запрос.\n- [ ] Перезагрузка виртуальной машины при сбое скрипта.\n*Объяснение*: ReAct цикл с самокоррекцией позволяет агенту устранять синтаксические опечатки без участия человека.\n", "cheatsheet": "", "notebooks": [{"filename": "project_3_ai_driven_bi_pipeline.ipynb", "rel_path": "course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 🤖 Выпускной проект 3: AI-Driven Analytical Pipeline & Smart BI Assistant\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт флагманского AI-проекта 2027 года\n* **Миссия**: Построить сквозную систему умного анализа обратной связи клиентов и автоматической SQL-аналитики.\n* **Архитектура пайплайна**:\n  1. **Семантическая разметка отзывов**: автоматическая классификация проблем через кластеризацию и ключевые слова.\n  2. **Векторный поиск по метаданным метрик**: нахождение формул и таблиц корпоративного хранилища.\n  3. **Text-to-SQL движок с валидацией**: перевод бизнес-вопроса в проверенный SQL с защитой от галлюцинаций."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimpo
