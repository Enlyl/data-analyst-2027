   \"group_a = ab_df[ab_df['test_group'] == 'A_Control']\\n\",\n        \"group_b = ab_df[ab_df['test_group'] == 'B_Variant']\\n\",\n        \"\\n\",\n        \"cr_a = group_a['converted'].mean()\\n\",\n        \"cr_b = group_b['converted'].mean()\\n\",\n        \"uplift = ((cr_b - cr_a) / cr_a) * 100\\n\",\n        \"\\n\",\n        \"print(f\\\"Конверсия Control (A): {cr_a*100:.2f}% ({group_a['converted'].sum()} / {len(group_a)})\\\")\\n\",\n        \"print(f\\\"Конверсия Variant (B): {cr_b*100:.2f}% ({group_b['converted'].sum()} / {len(group_b)})\\\")\\n\",\n        \"print(f\\\"Относительный прирост (Uplift): +{uplift:.2f}%\\\")\\n\",\n        \"\\n\",\n        \"# Z-test для конверсий\\n\",\n        \"count = [group_b['converted'].sum(), group_a['converted'].sum()]\\n\",\n        \"nobs = [len(group_b), len(group_a)]\\n\",\n        \"z_stat, p_val = proportions_ztest(count, nobs)\\n\",\n        \"\\n\",\n        \"print(f\\\"Z-statistic: {z_stat:.4f}, p-value: {p_val:.5f}\\\")\\n\",\n        \"if p_val < 0.05:\\n\",\n        \"    print(\\\" Статистически значимый прирост конверсии!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 7. Урок 3: Анализ конверсии и выручки в A/B тесте\n"}, {"type": "code", "content": "import pandas as pd\nfrom statsmodels.stats.proportion import proportions_ztest\nfrom scipy import stats\n\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\n\ngroup_a = ab_df[ab_df['test_group'] == 'A_Control']\ngroup_b = ab_df[ab_df['test_group'] == 'B_Variant']\n\ncr_a = group_a['converted'].mean()\ncr_b = group_b['converted'].mean()\nuplift = ((cr_b - cr_a) / cr_a) * 100\n\nprint(f\"Конверсия Control (A): {cr_a*100:.2f}% ({group_a['converted'].sum()} / {len(group_a)})\")\nprint(f\"Конверсия Variant (B): {cr_b*100:.2f}% ({group_b['converted'].sum()} / {len(group_b)})\")\nprint(f\"Относительный прирост (Uplift): +{uplift:.2f}%\")\n\n# Z-test для конверсий\ncount = [group_b['converted'].sum(), group_a['converted'].sum()]\nnobs = [len(group_b), len(group_a)]\nz_stat, p_val = proportions_ztest(count, nobs)\n\nprint(f\"Z-statistic: {z_stat:.4f}, p-value: {p_val:.5f}\")\nif p_val < 0.05:\n    print(\" Статистически значимый прирост конверсии!\")\n"}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 7. Урок 4: Peeking Problem (Почему нельзя останавливать тест раньше времени)\\n\",\n        \"\\n\",\n        \"Если аналитик каждый день проверяет $p\\\\text{-value}$ и останавливает тест в момент $p < 0.05$, реальный уровень ошибки I рода возрастает с $5\\\\%$ до $30\\\\%+$!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Симуляция Peeking Problem на пустом A/A тесте (где различий нет!)\\n\",\n        \"import numpy as np\\n\",\n        \"from scipy import stats\\n\",\n        \"\\n\",\n        \"np.random.seed(123)\\n\",\n        \"n_days = 30\\n\",\n        \"users_per_day = 100\\n\",\n        \"\\n\",\n        \"# Генерируем накопительные данные для одинаковых групп\\n\",\n        \"a_users = np.random.binomial(1, 0.10, size=(n_days, users_per_day))\\n\",\n        \"b_users = np.random.binomial(1, 0.10, size=(n_days, users_per_day))\\n\",\n        \"\\n\",\n        \"peeking_false_alarms = 0\\n\",\n        \"for day in range(5, n_days):\\n\",\n        \"    sample_a = a_users[:day].flatten()\\n\",\n        \"    sample_b = b_users[:day].flatten()\\n\",\n        \"    _, p = stats.ttest_ind(sample_a, sample_b)\\n\",\n        \"    if p < 0.05:\\n\",\n        \"        peeking_false_alarms += 1\\n\",\n        \"        print(f\\\"День {day}: Подглядели! p-value={p:.4f} < 0.05. Ложное срабатывание!\\\")\\n\",\n        \"        break\\n\",\n        \"\\n\",\n        \"if peeking_false_alarms == 0:\\n\",\n        \"    print(\\\"Ложных срабатываний не было.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 7. Урок 4: Peeking Problem (Почему нельзя останавливать тест раньше времени)\n\nЕсли аналитик каждый день проверяет $p\\text{-value}$ и останавливает тест в момент $p < 0.05$, реальный уровень ошибки I рода возрастает с $5\\%$ до $30\\%+$!\n"}, {"type": "code", "content": "# Симуляция Peeking Problem на пустом A/A тесте (где различий нет!)\nimport numpy as np\nfrom scipy import stats\n\nnp.random.seed(123)\nn_days = 30\nusers_per_day = 100\n\n# Генерируем накопительные данные для одинаковых групп\na_users = np.random.binomial(1, 0.10, size=(n_days, users_per_day))\nb_users = np.random.binomial(1, 0.10, size=(n_days, users_per_day))\n\npeeking_false_alarms = 0\nfor day in range(5, n_days):\n    sample_a = a_users[:day].flatten()\n    sample_b = b_users[:day].flatten()\n    _, p = stats.ttest_ind(sample_a, sample_b)\n    if p < 0.05:\n        peeking_false_alarms += 1\n        print(f\"День {day}: Подглядели! p-value={p:.4f} < 0.05. Ложное срабатывание!\")\n        break\n\nif peeking_false_alarms == 0:\n    print(\"Ложных срабатываний не было.\")\n"}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 7. Урок 5: Бизнес-решение о раскатке изменений\\n\",\n        \"\\n\",\n        \"Чеклист перед раскаткой фичи на 100% пользователей:\\n\",\n        \"1. Статистическая значимость основной целевой метрики ($p < 0.05$).\\n\",\n        \"2. Отсутствие деградации guardrail-метрик (например, выросла конверсия, но упал средний чек или выросло число жалоб).\\n\",\n        \"3. Экономическая окупаемость разработки (Cost-Benefit Analysis).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 7. Урок 5: Бизнес-решение о раскатке изменений\n\nЧеклист перед раскаткой фичи на 100% пользователей:\n1. Статистическая значимость основной целевой метрики ($p < 0.05$).\n2. Отсутствие деградации guardrail-метрик (например, выросла конверсия, но упал средний чек или выросло число жалоб).\n3. Экономическая окупаемость разработки (Cost-Benefit Analysis).\n"}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8: Prompt Engineering для аналитика", "category": "AI Стек", "badge": "AI", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n### Вопрос 1\nЧто дает метод Chain-of-Thought (рассуждение по шагам)?\n- [ ] Уменьшает расход токенов\n- [x] Повышает точность сложных аналитических расчетов за счет промежуточного вывода рассуждений\n- [ ] Заставляет модель писать код на Java\n\n### Вопрос 2\nЧто такое Few-Shot Prompting?\n- [ ] Однократный запуск запроса\n- [x] Передача модели одного или нескольких примеров «входные данные -> правильный результат» прямо в контексте промпта\n- [ ] Быстрый ответ без рассуждений\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 8. Урок 1: Архитектурный фреймворк RTCE для аналитика\\n\",\n        \"\\n\",\n        \"Любой надежный аналитический промпт должен содержать 4 компонента:\\n\",\n        \"1. **R (Role)**: Роль эксперта (например: Lead PostgreSQL Database Administrator).\\n\",\n        \"2. **T (Task)**: Четкое действие в повелительном наклонении (Напиши SQL-запрос...).\\n\",\n        \"3. **C (Context)**: Схема базы, примеры данных, краевые условия (только клиенты 2026 года, статус Completed).\\n\",\n        \"4. **E (Expectation / Format)**: Формат вывода (только чистый SQL в блоке кода без лишних приветствий, поясни логику).\\n\",\n        \"\\n\",\n        \"### Плохой промпт:\\n\",\n        \"> «Посчитай мне ретеншн в базе»\\n\",\n        \"\\n\",\n        \"### Идеальный промпт:\\n\",\n        \"> «Ты senior Product Analyst. База: PostgreSQL. Таблица `events(user_id INT, event_name TEXT, event_date TIMESTAMP)`. Напиши запрос расчета Day 1, Day 7, Day 30 Retention для когорт регистрации за январь 2026 года. Используй CTE. Обработай деление на ноль через NULLIF. Верни только код с комментариями.»\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 8. Урок 1: Архитектурный фреймворк RTCE для аналитика\n\nЛюбой надежный аналитический промпт должен содержать 4 компонента:\n1. **R (Role)**: Роль эксперта (например: Lead PostgreSQL Database Administrator).\n2. **T (Task)**: Четкое действие в повелительном наклонении (Напиши SQL-запрос...).\n3. **C (Context)**: Схема базы, примеры данных, краевые условия (только клиенты 2026 года, статус Completed).\n4. **E (Expectation / Format)**: Формат вывода (только чистый SQL в блоке кода без лишних приветствий, поясни логику).\n\n### Плохой промпт:\n> «Посчитай мне ретеншн в базе»\n\n### Идеальный промпт:\n> «Ты senior Product Analyst. База: PostgreSQL. Таблица `events(user_id INT, event_name TEXT, event_date TIMESTAMP)`. Напиши запрос расчета Day 1, Day 7, Day 30 Retention для когорт регистрации за январь 2026 года. Используй CTE. Обработай деление на ноль через NULLIF. Верни только код с комментариями.»\n"}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 8. Урок 2: Метод Chain-of-Thought (Цепочка рассуждений)\\n\",\n        \"\\n\",\n        \"Когда LLM генерирует ответ сразу, вероятность логической ошибки высока. Добавление фразы:\\n\",\n        \"> **«Рассуждай пошагово перед написанием формулы» (Think step by step)**\\n\",\n        \"\\n\",\n        \"вынуждает модель сначала сгенерировать рассуждение в токенах, что повышает точность вычислений в разы.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 8. Урок 2: Метод Chain-of-Thought (Цепочка рассуждений)\n\nКогда LLM генерирует ответ сразу, вероятность логической ошибки высока. Добавление фразы:\n> **«Рассуждай пошагово перед написанием формулы» (Think step by step)**\n\nвынуждает модель сначала сгенерировать рассуждение в токенах, что повышает точность вычислений в разы.\n"}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 8. Урок 3: Промпты для SQL и Python (Few-Shot Prompting)\\n\",\n        \"\\n\",\n        \"Демонстрация техники Few-Shot (показ 1-2 эталонных примеров решения похожей задачи):\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 8. Урок 3: Промпты для SQL и Python (Few-Shot Prompting)\n\nДемонстрация техники Few-Shot (показ 1-2 эталонных примеров решения похожей задачи):\n"}]}, {"filename": "lesson_04_debugging_and_root_cause_prompts.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 8. Урок 4: Промпты для отладки и поиска багов\\n\",\n        \"\\n\",\n        \"## Шаблон промпта \\\"Анализ стектрейса\\\":\\n\",\n        \"```text\\n\",\n        \"У меня возникла ошибка при выполнении скрипта Pandas:\\n\",\n        \"[ВСТАВИТЬ СТЕКТРЕЙС ОШИБКИ]\\n\",\n        \"\\n\",\n        \"Фрагмент кода:\\n\",\n        \"[ВСТАВИТЬ КОД]\\n\",\n        \"\\n\",\n        \"Формат ответа:\\n\",\n        \"1. Корневая причина ошибки (Root Cause).\\n\",\n        \"2. Минимальный исправленный фрагмент кода.\\n\",\n        \"3. Совет, как предотвратить подобные ошибки на стадии валидации данных.\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 8. Урок 4: Промпты для отладки и поиска багов\n\n## Шаблон промпта \"Анализ стектрейса\":\n```text\nУ меня возникла ошибка при выполнении скрипта Pandas:\n[ВСТАВИТЬ СТЕКТРЕЙС ОШИБКИ]\n\nФрагмент кода:\n[ВСТАВИТЬ КОД]\n\nФормат ответа:\n1. Корневая причина ошибки (Root Cause).\n2. Минимальный исправленный фрагмент кода.\n3. Совет, как предотвратить подобные ошибки на стадии валидации данных.\n```\n"}]}]}, {"id": "module_09_ai_tools_daily", "title": "Модуль 9: AI в ежедневной работе (Cursor, Copilot)", "category": "AI Стек", "badge": "AI", "readme": "# 🛠️ Модуль 9: AI в ежедневной работе аналитика (Cursor, Copilot, ChatGPT)\n\n## 📌 О модуле\nРазница между джуном и мидлом в 2027 году: джун пишет скрипт 3 дня, а специалист новой формации решает ту же задачу за 2 часа с помощью AI-инструментов, гарантируя нулевой процент галлюцинаций.\n\n## 🎯 Learning Outcomes\n- **Apply**: Использование Cursor IDE и GitHub Copilot для парного программирования.\n- **Analyze**: Code Interpreter (Advanced Data Analysis) для быстрого разведочного анализа (EDA).\n- **Evaluate**: 5-уровневый фреймворк валидации ответов ИИ: от синтаксиса до краевых бизнес-кейсов.\n\n## 📚 Уроки\n1. `lesson_01_cursor_vs_copilot_workflows.ipynb` — Настройка рабочего места: Cursor, Copilot, индексация кодовой базы.\n2. `lesson_02_claude_chatgpt_data_interpreter.ipynb` — Работа с веб-ассистентами (Claude 3.7 / ChatGPT): быстрый EDA, генерация гипотез.\n3. `lesson_03_ai_validation_framework_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n### Вопрос 1\nЧто делать, если ChatGPT написал сложный SQL-запрос, который выполнился без ошибок?\n- [ ] Сразу отправить результаты финансовому директору\n- [x] Провести ручную валидацию: проверить результат на известных тестовых пользователях, проверить отсутствие задвоения строк при JOIN и соответствие бизнес-логике\n- [ ] Закрыть проект\n\n### Вопрос 2\nЧто такое бизнес-инвариант при валидации кода?\n- [ ] Название корпоративной почты\n- [x] Фундаментальное правило предметной области, которое ни при каких обстоятельствах не может быть нарушено (например: отток не может быть отрицательным, конверсия не может превышать 100%)\n- [ ] Количество пробелов в строке\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 9. Урок 1: Воркфлоу с Cursor и Copilot\\n\",\n        \"\\n\",\n        \"### Три режима работы с AI в редакторе:\\n\",\n        \"1. **Tab Autocomplete**: Автодополнение следующей строки или блока кода.\\n\",\n        \"2. **Inline Edit (Cmd+K / Ctrl+K)**: Рефакторинг выделенного участка («перепиши через векторизованную операцию Pandas»).\\n\",\n        \"3. **Project Chat (Cmd+L / Ctrl+L)**: Запрос с контекстом всего репозитория («найди, где в проекте рассчитывается LTV и добавь фильтр по статусу»).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 9. Урок 1: Воркфлоу с Cursor и Copilot\n\n### Три режима работы с AI в редакторе:\n1. **Tab Autocomplete**: Автодополнение следующей строки или блока кода.\n2. **Inline Edit (Cmd+K / Ctrl+K)**: Рефакторинг выделенного участка («перепиши через векторизованную операцию Pandas»).\n3. **Project Chat (Cmd+L / Ctrl+L)**: Запрос с контекстом всего репозитория («найди, где в проекте рассчитывается LTV и добавь фильтр по статусу»).\n"}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 9. Урок 2: Разведочный анализ (EDA) в Code Interpreter\\n\",\n        \"\\n\",\n        \"Как за 10 минут получить предварительную картину любого неизвестного датасета с помощью AI:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация скрипта автоматического EDA, который генерируют современные Code Interpreter\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"def automated_eda_summary(data: pd.DataFrame):\\n\",\n        \"    print(\\\"=== АВТОМАТИЧЕСКАЯ СВОДКА ДАТАСЕТА ===\\\")\\n\",\n        \"    print(f\\\"Строк: {data.shape[0]}, Колонок: {data.shape[1]}\\\")\\n\",\n        \"    print(\\\"\\\\nПропуски в данных:\\\")\\n\",\n        \"    print(data.isnull().sum()[data.isnull().sum() > 0])\\n\",\n        \"    print(\\\"\\\\nЧисловые показатели (Ключевые квантили):\\\")\\n\",\n        \"    print(data.describe().T[['mean', '50%', 'std', 'min', 'max']])\\n\",\n        \"\\n\",\n        \"automated_eda_summary(df)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 9. Урок 2: Разведочный анализ (EDA) в Code Interpreter\n\nКак за 10 минут получить предварительную картину любого неизвестного датасета с помощью AI:\n"}, {"type": "code", "content": "# Демонстрация скрипта автоматического EDA, который генерируют современные Code Interpreter\nimport pandas as pd\n\ndf = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\ndef automated_eda_summary(data: pd.DataFrame):\n    print(\"=== АВТОМАТИЧЕСКАЯ СВОДКА ДАТАСЕТА ===\")\n    print(f\"Строк: {data.shape[0]}, Колонок: {data.shape[1]}\")\n    print(\"\\nПропуски в данных:\")\n    print(data.isnull().sum()[data.isnull().sum() > 0])\n    print(\"\\nЧисловые показатели (Ключевые квантили):\")\n    print(data.describe().T[['mean', '50%', 'std', 'min', 'max']])\n\nautomated_eda_summary(df)\n"}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 9. Урок 3: Фреймворк валидации ИИ (Zero Hallucination)\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"             [Входной ответ от LLM]\\n\",\n        \"                        │\\n\",\n        \"    1. Синтаксическая валидация (Код запускается?)\\n\",\n        \"                        │\\n\",\n        \"    2. Проверка размерностей (shape, dtypes, nulls)\\n\",\n        \"                        │\\n\",\n        \"    3. Бизнес-инварианты (Выручка >= 0, CR <= 100%)\\n\",\n        \"                        │\\n\",\n        \"    4. Сверка с контрольными бенчмарками\\n\",\n        \"                        │\\n\",\n        \"             [Одобрено в прод]\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 9. Урок 3: Фреймворк валидации ИИ (Zero Hallucination)\n\n```\n             [Входной ответ от LLM]\n                        │\n    1. Синтаксическая валидация (Код запускается?)\n                        │\n    2. Проверка размерностей (shape, dtypes, nulls)\n                        │\n    3. Бизнес-инварианты (Выручка >= 0, CR <= 100%)\n                        │\n    4. Сверка с контрольными бенчмарками\n                        │\n             [Одобрено в прод]\n```\n"}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10: LLM API & Неструктурированные данные", "category": "AI Стек", "badge": "AI", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API)\n\n### Вопрос 1\nЗачем в аналитических пайплайнах использовать параметр Structured Outputs (JSON Schema / Pydantic)?\n- [ ] Чтобы код работал только по выходным\n- [x] Чтобы модель гарантированно вернула валидный JSON заданной структуры, который можно без ошибок распарсить в DataFrame\n- [ ] Чтобы сэкономить оперативную память\n\n### Вопрос 2\nКакой параметр температуры (temperature) следует выставлять для задач извлечения данных и классификации?\n- [ ] temperature = 1.8 (максимальная креативность)\n- [x] temperature = 0.0 (детерминированный, максимально точный и воспроизводимый результат)\n- [ ] temperature = -1.0\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 10. Урок 1: Архитектура вызова LLM API\\n\",\n        \"\\n\",\n        \"Базовый шаблон для аналитического запроса к API (универсальный интерфейс):\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрационный мок вызова LLM API для анализа тональности\\n\",\n        \"def mock_llm_sentiment_analyzer(text: str) -> dict:\\n\",\n        \"    \\\"\\\"\\\"Имитация вызова современной LLM через API\\\"\\\"\\\"\\n\",\n        \"    text_lower = text.lower()\\n\",\n        \"    if any(w in text_lower for w in ['отличный', 'прекрасно', 'супер', 'быстро', 'loving', 'intuitive']):\\n\",\n        \"        sentiment = 'Positive'\\n\",\n        \"        score = 0.95\\n\",\n        \"    elif any(w in text_lower for w in ['ужасно', 'баги', 'списали', 'тормозит', 'crashes', 'верните']):\\n\",\n        \"        sentiment = 'Negative'\\n\",\n        \"        score = 0.10\\n\",\n        \"    else:\\n\",\n        \"        sentiment = 'Neutral'\\n\",\n        \"        score = 0.50\\n\",\n        \"        \\n\",\n        \"    return {\\n\",\n        \"        'sentiment': sentiment,\\n\",\n        \"        'confidence': score,\\n\",\n        \"        'tokens_used': len(text.split()) * 2\\n\",\n        \"    }\\n\",\n        \"\\n\",\n        \"sample_review = \\\"Ужасная доставка! Курьер опоздал на 4 часа, а приложение крашится.\\\"\\n\",\n        \"response = mock_llm_sentiment_analyzer(sample_review)\\n\",\n        \"print(\\\"Входной отзыв:\\\", sample_review)\\n\",\n        \"print(\\\"Результат LLM API:\\\", response)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 10. Урок 1: Архитектура вызова LLM API\n\nБазовый шаблон для аналитического запроса к API (универсальный интерфейс):\n"}, {"type": "code", "content": "# Демонстрационный мок вызова LLM API для анализа тональности\ndef mock_llm_sentiment_analyzer(text: str) -> dict:\n    \"\"\"Имитация вызова современной LLM через API\"\"\"\n    text_lower = text.lower()\n    if any(w in text_lower for w in ['отличный', 'прекрасно', 'супер', 'быстро', 'loving', 'intuitive']):\n        sentiment = 'Positive'\n        score = 0.95\n    elif any(w in text_lower for w in ['ужасно', 'баги', 'списали', 'тормозит', 'crashes', 'верните']):\n        sentiment = 'Negative'\n        score = 0.10\n    else:\n        sentiment = 'Neutral'\n        score = 0.50\n        \n    return {\n        'sentiment': sentiment,\n        'confidence': score,\n        'tokens_used': len(text.split()) * 2\n    }\n\nsample_review = \"Ужасная доставка! Курьер опоздал на 4 часа, а приложение крашится.\"\nresponse = mock_llm_sentiment_analyzer(sample_review)\nprint(\"Входной отзыв:\", sample_review)\nprint(\"Результат LLM API:\", response)\n"}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 10. Урок 2: Разметка неструктурированных данных на масштабе\\n\",\n        \"\\n\",\n        \"Применим логику извлечения инсайтов на датасете реальных отзывов `customer_reviews.csv`:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Загружаем реальный датасет отзывов курса\\n\",\n        \"reviews_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customer_reviews.csv\\\")\\n\",\n        \"\\n\",\n        \"print(\\\"Примеры отзывов из базы:\\\")\\n\",\n        \"for idx, row in reviews_df.head(3).iterrows():\\n\",\n        \"    print(f\\\"[{row['platform']} | Рейтинг: {row['rating']}] {row['text']}\\\")\\n\",\n        \"\\n\",\n        \"# Агрегация по платформам и тональности\\n\",\n        \"summary = reviews_df.groupby(['platform', 'sentiment_label']).size().unstack(fill_value=0)\\n\",\n        \"print(\\\"\\\\nРаспределение тональности по каналам обратной связи:\\\")\\n\",\n        \"print(summary)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 10. Урок 2: Разметка неструктурированных данных на масштабе\n\nПрименим логику извлечения инсайтов на датасете реальных отзывов `customer_reviews.csv`:\n"}, {"type": "code", "content": "import pandas as pd\n\n# Загружаем реальный датасет отзывов курса\nreviews_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\n\nprint(\"Примеры отзывов из базы:\")\nfor idx, row in reviews_df.head(3).iterrows():\n    print(f\"[{row['platform']} | Рейтинг: {row['rating']}] {row['text']}\")\n\n# Агрегация по платформам и тональности\nsummary = reviews_df.groupby(['platform', 'sentiment_label']).size().unstack(fill_value=0)\nprint(\"\\nРаспределение тональности по каналам обратной связи:\")\nprint(summary)\n"}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 10. Урок 3: Structured Outputs и Pydantic\\n\",\n        \"\\n\",\n        \"Главное требование к LLM в аналитическом пайплайне — **строгий JSON без лишнего сопроводительного текста**.\\n\",\n        \"\\n\",\n        \"Пример схемы Pydantic:\\n\",\n        \"```python\\n\",\n        \"from pydantic import BaseModel, Field\\n\",\n        \"from typing import List, Literal\\n\",\n        \"\\n\",\n        \"class CustomerFeedbackAnalysis(BaseModel):\\n\",\n        \"    sentiment: Literal['Positive', 'Negative', 'Neutral']\\n\",\n        \"    urgency_level: Literal['Low', 'Medium', 'Critical']\\n\",\n        \"    identified_issues: List[str] = Field(description=\\\"Список конкретных проблем, например: доставка, оплата, интерфейс\\\")\\n\",\n        \"    estimated_satisfaction_score: int = Field(ge=1, le=5)\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 10. Урок 3: Structured Outputs и Pydantic\n\nГлавное требование к LLM в аналитическом пайплайне — **строгий JSON без лишнего сопроводительного текста**.\n\nПример схемы Pydantic:\n```python\nfrom pydantic import BaseModel, Field\nfrom typing import List, Literal\n\nclass CustomerFeedbackAnalysis(BaseModel):\n    sentiment: Literal['Positive', 'Negative', 'Neutral']\n    urgency_level: Literal['Low', 'Medium', 'Critical']\n    identified_issues: List[str] = Field(description=\"Список конкретных проблем, например: доставка, оплата, интерфейс\")\n    estimated_satisfaction_score: int = Field(ge=1, le=5)\n```\n"}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 10. Урок 4: Экономика токенов (Token Economics)\\n\",\n        \"\\n\",\n        \"Расчет стоимости обогащения датасета через LLM API:\\n\",\n        \"- Модель: \\\\$0.15 за 1M входных токенов, \\\\$0.60 за 1M выходных токенов.\\n\",\n        \"- 10 000 отзывов по 100 токенов = 1 000 000 входных токенов (\\\\$0.15).\\n\",\n        \"- Выходные JSON (50 токенов) = 500 000 выходных токенов (\\\\$0.30).\\n\",\n        \"- Итого: **\\\\$0.45 за полную классификацию 10 000 отзывов!** (В 2021 году на это уходили недели разметчиков).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 10. Урок 4: Экономика токенов (Token Economics)\n\nРасчет стоимости обогащения датасета через LLM API:\n- Модель: \\$0.15 за 1M входных токенов, \\$0.60 за 1M выходных токенов.\n- 10 000 отзывов по 100 токенов = 1 000 000 входных токенов (\\$0.15).\n- Выходные JSON (50 токенов) = 500 000 выходных токенов (\\$0.30).\n- Итого: **\\$0.45 за полную классификацию 10 000 отзывов!** (В 2021 году на это уходили недели разметчиков).\n"}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11: RAG & Векторные базы данных", "category": "AI Стек", "badge": "AI", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG и векторные БД)\n\n### Вопрос 1\nВ чем главная роль Retrieval-Augmented Generation (RAG)?\n- [ ] Обучение нейросети с нуля на суперкомпьютере\n- [x] Обогащение запроса к LLM актуальными релевантными фрагментами из внешних документов или базы данных перед генерацией ответа\n- [ ] Перевод текста на китайский язык\n\n### Вопрос 2\nКакая мера чаще всего используется для оценки близости двух векторов эмбеддингов?\n- [ ] Евклидово расстояние\n- [x] Косинусное сходство (Cosine Similarity)\n- [ ] Дисперсия выборки\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 11. Урок 1: Векторные эмбеддинги и семантическое сходство\\n\",\n        \"\\n\",\n        \"Эмбеддинг — это список чисел (вектор), отражающий смысл фразы. Похожие по смыслу фразы находятся близко в многомерном пространстве:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Имитация векторов эмбеддингов для демонстрации косинусной близости\\n\",\n        \"# Векторы размерности 3 для наглядности\\n\",\n        \"vec_retention = np.array([0.9, 0.8, 0.1])\\n\",\n        \"vec_churn = np.array([0.85, 0.75, 0.15])      # Очень близко по смыслу к retention\\n\",\n        \"vec_pizza = np.array([0.05, 0.1, 0.95])        # Вообще про другое\\n\",\n        \"\\n\",\n        \"def cosine_similarity(a, b):\\n\",\n        \"    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\\n\",\n        \"\\n\",\n        \"sim_metrics = cosine_similarity(vec_retention, vec_churn)\\n\",\n        \"sim_unrelated = cosine_similarity(vec_retention, vec_pizza)\\n\",\n        \"\\n\",\n        \"print(f\\\"Сходство (Retention vs Churn) : {sim_metrics:.4f} (Высокое семантическое сродство!)\\\")\\n\",\n        \"print(f\\\"Сходство (Retention vs Pizza) : {sim_unrelated:.4f} (Не связаны)\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 11. Урок 1: Векторные эмбеддинги и семантическое сходство\n\nЭмбеддинг — это список чисел (вектор), отражающий смысл фразы. Похожие по смыслу фразы находятся близко в многомерном пространстве:\n"}, {"type": "code", "content": "import numpy as np\n\n# Имитация векторов эмбеддингов для демонстрации косинусной близости\n# Векторы размерности 3 для наглядности\nvec_retention = np.array([0.9, 0.8, 0.1])\nvec_churn = np.array([0.85, 0.75, 0.15])      # Очень близко по смыслу к retention\nvec_pizza = np.array([0.05, 0.1, 0.95])        # Вообще про другое\n\ndef cosine_similarity(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n\nsim_metrics = cosine_similarity(vec_retention, vec_churn)\nsim_unrelated = cosine_similarity(vec_retention, vec_pizza)\n\nprint(f\"Сходство (Retention vs Churn) : {sim_metrics:.4f} (Высокое семантическое сродство!)\")\nprint(f\"Сходство (Retention vs Pizza) : {sim_unrelated:.4f} (Не связаны)\")\n"}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 11. Урок 2: Векторная база ChromaDB для базы знаний аналитика\\n\",\n        \"\\n\",\n        \"Индексируем словарь корпоративных метрик компании:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация логики индексации в базе знаний\\n\",\n        \"metrics_knowledge_base = [\\n\",\n        \"    {\\\"id\\\": \\\"doc_1\\\", \\\"text\\\": \\\"LTV (Lifetime Value) — совокупная чистая прибыль от клиента за всё время работы. Формула: ARPU * Lifetime.\\\"},\\n\",\n        \"    {\\\"id\\\": \\\"doc_2\\\", \\\"text\\\": \\\"Churn Rate — процент клиентов, отказавшихся от подписки в отчетном периоде. Формула: Ушедшие / Активные на начало.\\\"},\\n\",\n        \"    {\\\"id\\\": \\\"doc_3\\\", \\\"text\\\": \\\"CAC (Customer Acquisition Cost) — стоимость привлечения платящего клиента: Маркетинг_расходы / Число_новых_клиентов.\\\"}\\n\",\n        \"]\\n\",\n        \"\\n\",\n        \"print(\\\"База знаний метрик готова к векторному поиску:\\\")\\n\",\n        \"for doc in metrics_knowledge_base:\\n\",\n        \"    print(f\\\"- [{doc['id']}]: {doc['text'][:60]}...\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 11. Урок 2: Векторная база ChromaDB для базы знаний аналитика\n\nИндексируем словарь корпоративных метрик компании:\n"}, {"type": "code", "content": "# Демонстрация логики индексации в базе знаний\nmetrics_knowledge_base = [\n    {\"id\": \"doc_1\", \"text\": \"LTV (Lifetime Value) — совокупная чистая прибыль от клиента за всё время работы. Формула: ARPU * Lifetime.\"},\n    {\"id\": \"doc_2\", \"text\": \"Churn Rate — процент клиентов, отказавшихся от подписки в отчетном периоде. Формула: Ушедшие / Активные на начало.\"},\n    {\"id\": \"doc_3\", \"text\": \"CAC (Customer Acquisition Cost) — стоимость привлечения платящего клиента: Маркетинг_расходы / Число_новых_клиентов.\"}\n]\n\nprint(\"База знаний метрик готова к векторному поиску:\")\nfor doc in metrics_knowledge_base:\n    print(f\"- [{doc['id']}]: {doc['text'][:60]}...\")\n"}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 11. Урок 3: Сквозной пайплайн RAG\\n\",\n        \"```\\n\",\n        \"[Вопрос пользователя: \\\"Как мы считаем отток?\\\"]\\n\",\n        \"                      │\\n\",\n        \"           (Поиск в Векторной БД)\\n\",\n        \"                      │\\n\",\n        \"   [Найден контекст: doc_2 Churn Rate]\\n\",\n        \"                      │\\n\",\n        \"       (Промпт: \\\"Ответь на основе контекста\\\")\\n\",\n        \"                      │\\n\",\n        \"[Итоговый ответ: \\\"Отток считается как отношение... Источник: doc_2\\\"]\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 11. Урок 3: Сквозной пайплайн RAG\n```\n[Вопрос пользователя: \"Как мы считаем отток?\"]\n                      │\n           (Поиск в Векторной БД)\n                      │\n   [Найден контекст: doc_2 Churn Rate]\n                      │\n       (Промпт: \"Ответь на основе контекста\")\n                      │\n[Итоговый ответ: \"Отток считается как отношение... Источник: doc_2\"]\n```\n"}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 11. Урок 4: Архитектура Text-to-SQL с RAG\\n\",\n        \"\\n\",\n        \"Когда база данных содержит 500+ таблиц, передать всю схему в промпт невозможно (превысит лимит контекста).\\n\",\n        \"Решение: **RAG по схеме БД**:\\n\",\n        \"1. Индексируем описания таблиц в векторной базе.\\n\",\n        \"2. По запросу пользователя («Сколько мы продали смартфонов в Москве?») находим 2-3 релевантные таблицы (`orders`, `products`, `customers`).\\n\",\n        \"3. Передаем в LLM только схемы этих 3 таблиц.\\n\",\n        \"4. Получаем точный и дешевый SQL-запрос!\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 11. Урок 4: Архитектура Text-to-SQL с RAG\n\nКогда база данных содержит 500+ таблиц, передать всю схему в промпт невозможно (превысит лимит контекста).\nРешение: **RAG по схеме БД**:\n1. Индексируем описания таблиц в векторной базе.\n2. По запросу пользователя («Сколько мы продали смартфонов в Москве?») находим 2-3 релевантные таблицы (`orders`, `products`, `customers`).\n3. Передаем в LLM только схемы этих 3 таблиц.\n4. Получаем точный и дешевый SQL-запрос!\n"}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12: AI-агенты (Agentic Workflows)", "category": "AI Стек", "badge": "AI", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты)\n\n### Вопрос 1\nЧто отличает AI-агента от простого одиночного вызова LLM?\n- [ ] Агент работает только на серверах Linux\n- [x] Агент обладает циклом ReAct (рассуждение -> выбор инструмента -> получение результата -> корректировка плана) и может вызывать внешние функции (SQL, Python, API)\n- [ ] Агент стоит дешевле\n\n### Вопрос 2\nЧто оценивает метрика Faithfulness в фреймворках LLM Evaluation (Ragas, DeepEval)?\n- [ ] Скорость печати ответа\n- [x] Отсутствие галлюцинаций — проверяет, что каждый факт в сгенерированном ответе строго подтверждается переданным контекстом\n- [ ] Количество грамматических ошибок\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 12. Урок 1: Архитектура аналитического агента (ReAct)\\n\",\n        \"\\n\",\n        \"Цикл ReAct:\\n\",\n        \"```\\n\",\n        \"[Цель: \\\"Выясни причину просадки выручки в октябре\\\"]\\n\",\n        \"                    │\\n\",\n        \"            ┌───────┴───────┐\\n\",\n        \"            │   Thought     │ (Мне нужно посмотреть заказы за октябрь)\\n\",\n        \"            ├───────────────┤\\n\",\n        \"            │   Action      │ (Вызов инструмента SQL_Query)\\n\",\n        \"            ├───────────────┤\\n\",\n        \"            │  Observation  │ (Выручка упала на 15%, заказы электроники упали на 40%)\\n\",\n        \"            ├───────────────┤\\n\",\n        \"            │   Thought     │ (Почему упала электроника? Проверю остатки на складе)\\n\",\n        \"            ├───────────────┤\\n\",\n        \"            │   Action      │ (Вызов инструмента Check_Inventory)\\n\",\n        \"            ├───────────────┤\\n\",\n        \"            │  Observation  │ (Топ-3 смартфона закончились на складе 5 октября)\\n\",\n        \"            └───────┬───────┘\\n\",\n        \"                    │\\n\",\n        \"        [Final Answer бизнесу]\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 12. Урок 1: Архитектура аналитического агента (ReAct)\n\nЦикл ReAct:\n```\n[Цель: \"Выясни причину просадки выручки в октябре\"]\n                    │\n            ┌───────┴───────┐\n            │   Thought     │ (Мне нужно посмотреть заказы за октябрь)\n            ├───────────────┤\n            │   Action      │ (Вызов инструмента SQL_Query)\n            ├───────────────┤\n            │  Observation  │ (Выручка упала на 15%, заказы электроники упали на 40%)\n            ├───────────────┤\n            │   Thought     │ (Почему упала электроника? Проверю остатки на складе)\n            ├───────────────┤\n            │   Action      │ (Вызов инструмента Check_Inventory)\n            ├───────────────┤\n            │  Observation  │ (Топ-3 смартфона закончились на складе 5 октября)\n            └───────┬───────┘\n                    │\n        [Final Answer бизнесу]\n```\n"}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 12. Урок 2: Агент со встроенными инструментами на Python\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация архитектуры агента с Tool Execution\\n\",\n        \"class SimpleAnalyticsAgent:\\n\",\n        \"    def __init__(self):\\n\",\n        \"        self.tools = {\\n\",\n        \"            'sql_query': self._mock_sql,\\n\",\n        \"            'calc_ratio': lambda a, b: a / b if b != 0 else 0\\n\",\n        \"        }\\n\",\n        \"        \\n\",\n        \"    def _mock_sql(self, query: str):\\n\",\n        \"        return {\\\"status\\\": \\\"success\\\", \\\"rows_returned\\\": 150, \\\"sample_metric\\\": 420000}\\n\",\n        \"        \\n\",\n        \"    def execute_step(self, tool_name: str, **kwargs):\\n\",\n        \"        if tool_name in self.tools:\\n\",\n        \"            return self.tools[tool_name](**kwargs)\\n\",\n        \"        raise ValueError(f\\\"Unknown tool: {tool_name}\\\")\\n\",\n        \"\\n\",\n        \"agent = SimpleAnalyticsAgent()\\n\",\n        \"step_res = agent.execute_step('sql_query', query=\\\"SELECT SUM(amount) FROM orders\\\")\\n\",\n        \"print(\\\"Результат шага агента:\\\", step_res)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 12. Урок 2: Агент со встроенными инструментами на Python\n"}, {"type": "code", "content": "# Демонстрация архитектуры агента с Tool Execution\nclass SimpleAnalyticsAgent:\n    def __init__(self):\n        self.tools = {\n            'sql_query': self._mock_sql,\n            'calc_ratio': lambda a, b: a / b if b != 0 else 0\n        }\n        \n    def _mock_sql(self, query: str):\n        return {\"status\": \"success\", \"rows_returned\": 150, \"sample_metric\": 420000}\n        \n    def execute_step(self, tool_name: str, **kwargs):\n        if tool_name in self.tools:\n            return self.tools[tool_name](**kwargs)\n        raise ValueError(f\"Unknown tool: {tool_name}\")\n\nagent = SimpleAnalyticsAgent()\nstep_res = agent.execute_step('sql_query', query=\"SELECT SUM(amount) FROM orders\")\nprint(\"Результат шага агента:\", step_res)\n"}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 12. Урок 3: Автоматический пайплайн агента по сбору данных\\n\",\n        \"\\n\",\n        \"Агент выполняет регулярный мониторинг:\\n\",\n        \"1. Забирает свежие выгрузки из источников.\\n\",\n        \"2. Прогоняет тесты качества данных.\\n\",\n        \"3. Формирует саммари с главными отклонениями и отправляет алерт в Telegram/Slack.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 12. Урок 3: Автоматический пайплайн агента по сбору данных\n\nАгент выполняет регулярный мониторинг:\n1. Забирает свежие выгрузки из источников.\n2. Прогоняет тесты качества данных.\n3. Формирует саммари с главными отклонениями и отправляет алерт в Telegram/Slack.\n"}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 12. Урок 4: LLM Evaluation (Оценка качества работы нейросетей)\\n\",\n        \"\\n\",\n        \"В вакансиях Middle/Senior 2027 года стандартное требование — **LLM Evaluation**.\\n\",\n        \"\\n\",\n        \"Ключевые метрики:\\n\",\n        \"1. **Faithfulness (Верность фактам)**: Содержит ли ответ утверждения, которых не было в предоставленных данных? (Детектор галлюцинаций).\\n\",\n        \"2. **Answer Relevance (Релевантность)**: Отвечает ли модель именно на заданный вопрос бизнеса?\\n\",\n        \"3. **Context Recall (Полнота контекста)**: Нашел ли поисковый механизм все нужные таблицы?\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 12. Урок 4: LLM Evaluation (Оценка качества работы нейросетей)\n\nВ вакансиях Middle/Senior 2027 года стандартное требование — **LLM Evaluation**.\n\nКлючевые метрики:\n1. **Faithfulness (Верность фактам)**: Содержит ли ответ утверждения, которых не было в предоставленных данных? (Детектор галлюцинаций).\n2. **Answer Relevance (Релевантность)**: Отвечает ли модель именно на заданный вопрос бизнеса?\n3. **Context Recall (Полнота контекста)**: Нашел ли поисковый механизм все нужные таблицы?\n"}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13: Soft Skills, Юнит-экономика & Storytelling", "category": "Бизнес", "badge": "Soft Skills", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n### Вопрос 1\nКаково оптимальное соотношение LTV / CAC для масштабируемого устойчивого бизнеса?\n- [ ] Меньше 0.5\n- [x] От 3.0 и выше\n- [ ] Ровно 1.0\n\n### Вопрос 2\nВ чем суть принципа Пирамиды Минто при презентации аналитики руководителям?\n- [ ] Начинать с подробного описания процесса загрузки данных и библиотек Python\n- [x] Начинать сразу с ключевого вывода и рекомендуемого бизнес-действия, а затем раскрывать аргументы и цифры\n- [ ] Не показывать цифры вообще\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 13. Урок 1: Юнит-экономика продукта\\n\",\n        \"\\n\",\n        \"Ключевые формулы здоровья бизнеса:\\n\",\n        \"$$LTV = ARPU \\\\times \\\\text{Lifetime} = \\\\frac{\\\\text{ARPPU} \\\\times \\\\text{Paying Share}}{\\\\text{Churn Rate}}$$\\n\",\n        \"$$\\\\text{Unit Economics Rule: } \\\\frac{LTV}{CAC} \\\\ge 3.0$$\\n\",\n        \"\\n\",\n        \"Если отношение $\\\\frac{LTV}{CAC} < 1$, бизнес сжигает деньги на каждом привлеченном клиенте!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Калькулятор юнит-экономики\\n\",\n        \"def calculate_unit_economics(cac, arpu, monthly_churn_rate):\\n\",\n        \"    lifetime_months = 1.0 / monthly_churn_rate if monthly_churn_rate > 0 else 1\\n\",\n        \"    ltv = arpu * lifetime_months\\n\",\n        \"    ltv_to_cac = ltv / cac if cac > 0 else 0\\n\",\n        \"    payback_months = cac / arpu if arpu > 0 else 0\\n\",\n        \"    \\n\",\n        \"    return {\\n\",\n        \"        'LTV': round(ltv, 2),\\n\",\n        \"        'CAC': round(cac, 2),\\n\",\n        \"        'LTV / CAC Ratio': round(ltv_to_cac, 2),\\n\",\n        \"        'Payback (Months)': round(payback_months, 1),\\n\",\n        \"        'Status': 'Здоровый бизнес (>3x)' if ltv_to_cac >= 3 else ('На грани (1x-3x)' if ltv_to_cac >= 1 else 'Убыточный бизнес (<1x)')\\n\",\n        \"    }\\n\",\n        \"\\n\",\n        \"metrics = calculate_unit_economics(cac=1200, arpu=450, monthly_churn_rate=0.08)\\n\",\n        \"for k, v in metrics.items():\\n\",\n        \"    print(f\\\"{k:20}: {v}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 13. Урок 1: Юнит-экономика продукта\n\nКлючевые формулы здоровья бизнеса:\n$$LTV = ARPU \\times \\text{Lifetime} = \\frac{\\text{ARPPU} \\times \\text{Paying Share}}{\\text{Churn Rate}}$$\n$$\\text{Unit Economics Rule: } \\frac{LTV}{CAC} \\ge 3.0$$\n\nЕсли отношение $\\frac{LTV}{CAC} < 1$, бизнес сжигает деньги на каждом привлеченном клиенте!\n"}, {"type": "code", "content": "# Калькулятор юнит-экономики\ndef calculate_unit_economics(cac, arpu, monthly_churn_rate):\n    lifetime_months = 1.0 / monthly_churn_rate if monthly_churn_rate > 0 else 1\n    ltv = arpu * lifetime_months\n    ltv_to_cac = ltv / cac if cac > 0 else 0\n    payback_months = cac / arpu if arpu > 0 else 0\n    \n    return {\n        'LTV': round(ltv, 2),\n        'CAC': round(cac, 2),\n        'LTV / CAC Ratio': round(ltv_to_cac, 2),\n        'Payback (Months)': round(payback_months, 1),\n        'Status': 'Здоровый бизнес (>3x)' if ltv_to_cac >= 3 else ('На грани (1x-3x)' if ltv_to_cac >= 1 else 'Убыточный бизнес (<1x)')\n    }\n\nmetrics = calculate_unit_economics(cac=1200, arpu=450, monthly_churn_rate=0.08)\nfor k, v in metrics.items():\n    print(f\"{k:20}: {v}\")\n"}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 13. Урок 2: Problem Framing (Формулирование проблемы)\\n\",\n        \"\\n\",\n        \"### Пример диалога с бизнес-заказчиком:\\n\",\n        \"- **Заказчик**: «Сделай мне дашборд со всеми пользователями и кликами за 2 года!»\\n\",\n        \"- **Обычный джун**: «Хорошо, делаю...» (Тратит 2 недели, дашборд никто не открывает).\\n\",\n        \"- **Аналитик 2027**: «Какое решение вы планируете принять на основе этих цифр? Какая проблема сейчас болит сильнее всего?»\\n\",\n        \"- **Заказчик**: «Маркетинг просит еще 5 миллионов на рекламу, а я не знаю, окупаются ли старые каналы».\\n\",\n        \"- **Аналитик**: «Тогда нам нужен не дашборд по всем кликам, а когортный анализ окупаемости каналов (ROAS по когортам) за последние 3 месяца. Я подготовлю его к вечеру».\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 13. Урок 2: Problem Framing (Формулирование проблемы)\n\n### Пример диалога с бизнес-заказчиком:\n- **Заказчик**: «Сделай мне дашборд со всеми пользователями и кликами за 2 года!»\n- **Обычный джун**: «Хорошо, делаю...» (Тратит 2 недели, дашборд никто не открывает).\n- **Аналитик 2027**: «Какое решение вы планируете принять на основе этих цифр? Какая проблема сейчас болит сильнее всего?»\n- **Заказчик**: «Маркетинг просит еще 5 миллионов на рекламу, а я не знаю, окупаются ли старые каналы».\n- **Аналитик**: «Тогда нам нужен не дашборд по всем кликам, а когортный анализ окупаемости каналов (ROAS по когортам) за последние 3 месяца. Я подготовлю его к вечеру».\n"}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 13. Урок 3: Пирамида Минто (Коммуникация с CEO)\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"                       [ГЛАВНЫЙ ВЫВОД / РЕШЕНИЕ]\\n\",\n        \"            \\\"Нужно закрыть таргетированную рекламу в канале X: \\n\",\n        \"                  она приносит 80% оттока и чистый убыток\\\"\\n\",\n        \"                                   │\\n\",\n        \"         ┌─────────────────────────┼─────────────────────────┐\\n\",\n        \"    [АРГУМЕНТ 1]              [АРГУМЕНТ 2]              [АРГУМЕНТ 3]\\n\",\n        \"LTV/CAC канала = 0.6      Churn в 1-й месяц 45%      Экономия 1.8 млн руб\\n\",\n        \"         │                         │                         │\\n\",\n        \"  (Факты / SQL)             (Факты / Когорты)          (Факты / Финмодель)\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 13. Урок 3: Пирамида Минто (Коммуникация с CEO)\n\n```\n                       [ГЛАВНЫЙ ВЫВОД / РЕШЕНИЕ]\n            \"Нужно закрыть таргетированную рекламу в канале X: \n                  она приносит 80% оттока и чистый убыток\"\n                                   │\n         ┌─────────────────────────┼─────────────────────────┐\n    [АРГУМЕНТ 1]              [АРГУМЕНТ 2]              [АРГУМЕНТ 3]\nLTV/CAC канала = 0.6      Churn в 1-й месяц 45%      Экономия 1.8 млн руб\n         │                         │                         │\n  (Факты / SQL)             (Факты / Когорты)          (Факты / Финмодель)\n```\n"}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Модуль 13. Урок 4: Сквозной кейс Data Storytelling\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Модуль 13. Урок 4: Сквозной кейс Data Storytelling\n"}]}]}, {"id": "module_14_portfolio_project_1", "title": "Проект 1: E-Commerce 360° Audit", "category": "Портфолио", "badge": "Проект", "readme": "# 🛒 Портфолио-проект 1: Сквозная E-Commerce аналитика 360°\n\n## 📌 Описание проекта\nПолноценный аудит интернет-магазина на основе реальной базы заказов (15 000+ позиций, база `ecommerce.db`):\n1. **SQL Витрина**: Расчет LTV, среднего чека, маржинальности.\n2. **Pandas & Python**: Когортный анализ удержания (Retention Rate Matrix) и RFM-сегментация клиентов.\n3. **Looker Studio**: Создание интерактивного дашборда для коммерческого директора.\n4. **Бизнес-отчет**: Аналитическая записка с точками роста выручки.\n\n## 📁 Файлы\n- `project_1_ecommerce_analytics.ipynb` — Полный рабочий ноутбук выполнения проекта от SQL до визуализации.\n", "quiz": "", "cheatsheet": "", "notebooks": [{"filename": "project_1_ecommerce_analytics.ipynb", "rel_path": "course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# Портфолио-проект 1: E-Commerce Analytics 360°\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\\n\",\n        \"\\n\",\n        \"В этом проекте мы проводим глубокий анализ интернет-магазина.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import seaborn as sns\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"# 1. SQL: Выгрузка данных для RFM-сегментации\\n\",\n        \"query_rfm = \\\"\\\"\\\"\\n\",\n        \"WITH customer_orders AS (\\n\",\n        \"    SELECT \\n\",\n        \"        c.customer_id,\\n\",\n        \"        MAX(o.order_date) AS last_order_date,\\n\",\n        \"        COUNT(DISTINCT o.order_id) AS frequency,\\n\",\n        \"        ROUND(SUM(oi.total_amount), 2) AS monetary\\n\",\n        \"    FROM customers c\\n\",\n        \"    JOIN orders o ON c.customer_id = o.customer_id\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY c.customer_id\\n\",\n        \")\\n\",\n        \"SELECT * FROM customer_orders;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"rfm_df = pd.read_sql(query_rfm, conn)\\n\",\n        \"rfm_df['last_order_date'] = pd.to_datetime(rfm_df['last_order_date'])\\n\",\n        \"now = pd.to_datetime('2026-10-01')\\n\",\n        \"rfm_df['recency_days'] = (now - rfm_df['last_order_date']).dt.days\\n\",\n        \"\\n\",\n        \"# Расчет RFM-рангов (1-4)\\n\",\n        \"rfm_df['R_Score'] = pd.qcut(rfm_df['recency_days'], q=4, labels=[4, 3, 2, 1])\\n\",\n        \"rfm_df['F_Score'] = pd.qcut(rfm_df['frequency'].rank(method='first'), q=4, labels=[1, 2, 3, 4])\\n\",\n        \"rfm_df['M_Score'] = pd.qcut(rfm_df['monetary'], q=4, labels=[1, 2, 3, 4])\\n\",\n        \"\\n\",\n        \"print(\\\"=== RFM СЕГМЕНТАЦИЯ КЛИЕНТСКОЙ БАЗЫ ===\\\")\\n\",\n        \"print(rfm_df[['customer_id', 'recency_days', 'frequency', 'monetary', 'R_Score', 'F_Score', 'M_Score']].head(5))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# Портфолио-проект 1: E-Commerce Analytics 360°\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com)\n\nВ этом проекте мы проводим глубокий анализ интернет-магазина.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# 1. SQL: Выгрузка данных для RFM-сегментации\nquery_rfm = \"\"\"\nWITH customer_orders AS (\n    SELECT \n        c.customer_id,\n        MAX(o.order_date) AS last_order_date,\n        COUNT(DISTINCT o.order_id) AS frequency,\n        ROUND(SUM(oi.total_amount), 2) AS monetary\n    FROM customers c\n    JOIN orders o ON c.customer_id = o.customer_id\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY c.customer_id\n)\nSELECT * FROM customer_orders;\n\"\"\"\nrfm_df = pd.read_sql(query_rfm, conn)\nrfm_df['last_order_date'] = pd.to_datetime(rfm_df['last_order_date'])\nnow = pd.to_datetime('2026-10-01')\nrfm_df['recency_days'] = (now - rfm_df['last_order_date']).dt.days\n\n# Расчет RFM-рангов (1-4)\nrfm_df['R_Score'] = pd.qcut(rfm_df['recency_days'], q=4, labels=[4, 3, 2, 1])\nrfm_df['F_Score'] = pd.qcut(rfm_df['frequency'].rank(method='first'), q=4, labels=[1, 2, 3, 4])\nrfm_df['M_Score'] = pd.qcut(rfm_df['monetary'], q=4, labels=[1, 2, 3, 4])\n\nprint(\"=== RFM СЕГМЕНТАЦИЯ КЛИЕНТСКОЙ БАЗЫ ===\")\nprint(rfm_df[['customer_id', 'recency_days', 'frequency', 'monetary', 'R_Score', 'F_Score', 'M_Score']].head(5))\n"}]}]}, {"id": "module_15_portfolio_project_2", "title": "Проект 2: SaaS Product Analytics & A/B", "category": "Портфолио", "badge": "Проект", "readme": "# 📱 Портфолио-проект 2: SaaS Продуктовая аналитика и A/B Тестирование\n\n## 📌 Описание проекта\nАнализ продуктовых метрик B2B SaaS платформы (2000 компаний, датасет `saas_users.csv`):\n1. **Воронка активации**: Использование ключевых фичей A и B.\n2. **Анализ оттока (Churn Analysis)**: Влияние NPS и тарифа на удержание клиентов.\n3. **A/B Эксперимент**: Полный статистический анализ нового флоу оплаты (Z-test, проверка SRM, расчет доверительных интервалов).\n\n## 📁 Файлы\n- `project_2_saas_product_analytics.ipyn
