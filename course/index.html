ы)│\\n\",\n        \"│ 7. LIMIT                        │ 7. DISTINCT                     │\\n\",\n        \"│                                 │ 8. ORDER BY (сортируем)         │\\n\",\n        \"│                                 │ 9. LIMIT / OFFSET (отрезаем)    │\\n\",\n        \"└─────────────────────────────────┴─────────────────────────────────┘\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"> **Инсайт собеседований**: Вы не можете использовать алиас из `SELECT` внутри секции `WHERE`, потому что на момент выполнения `WHERE` секция `SELECT` еще даже не запускалась!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"# Запрос с правильной фильтрацией и строгим порядком\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    customer_id,\\n\",\n        \"    first_name,\\n\",\n        \"    city,\\n\",\n        \"    acquisition_channel,\\n\",\n        \"    registration_date\\n\",\n        \"FROM customers\\n\",\n        \"WHERE city IN ('Moscow', 'Saint Petersburg', 'Kazan')\\n\",\n        \"  AND acquisition_channel != 'Direct'\\n\",\n        \"  AND registration_date >= '2025-06-01'\\n\",\n        \"ORDER BY registration_date DESC\\n\",\n        \"LIMIT 5;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"РЕЗУЛЬТАТ ЗАПРОСА К E-COMMERCE БАЗЕ:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🗃️ Модуль 2. Урок 1: Реляционная модель данных и логический порядок выполнения SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb)\n\n---\n\n## 1. Главный секрет SQL: Порядок написания vs Порядок выполнения\n\nПочему новички пишут неработающие запросы? Потому что SQL **пишется** в одном порядке, а СУБД **выполняет** его совершенно в другом!\n\n```\n┌─────────────────────────────────┬─────────────────────────────────┐\n│     КАК ВЫ ПИШЕТЕ ЗАПРОС        │      КАК ЕГО ВЫПОЛНЯЕТ СУБД     │\n├─────────────────────────────────┼─────────────────────────────────┤\n│ 1. SELECT                       │ 1. FROM (откуда берем данные)   │\n│ 2. FROM                         │ 2. ON / JOIN (как связываем)    │\n│ 3. WHERE                        │ 3. WHERE (фильтруем сырые строки)│\n│ 4. GROUP BY                     │ 4. GROUP BY (схлопываем группы) │\n│ 5. HAVING                       │ 5. HAVING (фильтруем группы)    │\n│ 6. ORDER BY                     │ 6. SELECT (выбираем поля/алиасы)│\n│ 7. LIMIT                        │ 7. DISTINCT                     │\n│                                 │ 8. ORDER BY (сортируем)         │\n│                                 │ 9. LIMIT / OFFSET (отрезаем)    │\n└─────────────────────────────────┴─────────────────────────────────┘\n```\n\n> **Инсайт собеседований**: Вы не можете использовать алиас из `SELECT` внутри секции `WHERE`, потому что на момент выполнения `WHERE` секция `SELECT` еще даже не запускалась!\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Запрос с правильной фильтрацией и строгим порядком\nquery = \"\"\"\nSELECT \n    customer_id,\n    first_name,\n    city,\n    acquisition_channel,\n    registration_date\nFROM customers\nWHERE city IN ('Moscow', 'Saint Petersburg', 'Kazan')\n  AND acquisition_channel != 'Direct'\n  AND registration_date >= '2025-06-01'\nORDER BY registration_date DESC\nLIMIT 5;\n\"\"\"\n\nprint(\"РЕЗУЛЬТАТ ЗАПРОСА К E-COMMERCE БАЗЕ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_02_aggregations_group_by_having.ipynb", "rel_path": "course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 2. Урок 2: Агрегатные функции и жесткая разница WHERE vs HAVING\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Разница между WHERE и HAVING на реальном кейсе\\n\",\n        \"\\n\",\n        \"- **WHERE**: Фильтрует отдельные строки **до того**, как они объединятся в группы. Не может содержать агрегатные функции (`SUM`, `AVG`, `COUNT`).\\n\",\n        \"- **HAVING**: Фильтрует уже готовые сгруппированные строки **после** группировки.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"# Кейс: Найти города, где совершено более 150 успешных заказов, \\n\",\n        \"# исключив тестовые и отмененные заказы ДО агрегации\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    c.city,\\n\",\n        \"    COUNT(o.order_id) AS completed_orders,\\n\",\n        \"    ROUND(SUM(oi.total_amount), 2) AS city_revenue,\\n\",\n        \"    ROUND(AVG(oi.total_amount), 2) AS avg_item_amount\\n\",\n        \"FROM customers c\\n\",\n        \"JOIN orders o ON c.customer_id = o.customer_id\\n\",\n        \"JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"WHERE o.status = 'Completed'                      -- WHERE: отсекаем строки до расчета\\n\",\n        \"GROUP BY c.city\\n\",\n        \"HAVING completed_orders > 150                      -- HAVING: фильтруем агрегированный результат\\n\",\n        \"ORDER BY city_revenue DESC;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"ГОРОДА-ЛИДЕРЫ С БОЛЕЕ ЧЕМ 150 УСПЕШНЫМИ ЗАКАЗАМИ:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 2. Урок 2: Агрегатные функции и жесткая разница WHERE vs HAVING\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb)\n\n---\n\n## 1. Разница между WHERE и HAVING на реальном кейсе\n\n- **WHERE**: Фильтрует отдельные строки **до того**, как они объединятся в группы. Не может содержать агрегатные функции (`SUM`, `AVG`, `COUNT`).\n- **HAVING**: Фильтрует уже готовые сгруппированные строки **после** группировки.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Кейс: Найти города, где совершено более 150 успешных заказов, \n# исключив тестовые и отмененные заказы ДО агрегации\nquery = \"\"\"\nSELECT \n    c.city,\n    COUNT(o.order_id) AS completed_orders,\n    ROUND(SUM(oi.total_amount), 2) AS city_revenue,\n    ROUND(AVG(oi.total_amount), 2) AS avg_item_amount\nFROM customers c\nJOIN orders o ON c.customer_id = o.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'                      -- WHERE: отсекаем строки до расчета\nGROUP BY c.city\nHAVING completed_orders > 150                      -- HAVING: фильтруем агрегированный результат\nORDER BY city_revenue DESC;\n\"\"\"\n\nprint(\"ГОРОДА-ЛИДЕРЫ С БОЛЕЕ ЧЕМ 150 УСПЕШНЫМИ ЗАКАЗАМИ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_03_joins_deep_dive.ipynb", "rel_path": "course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔗 Модуль 2. Урок 3: Все виды JOIN и защита от Cartesian Explosion (Задвоения данных)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_03_joins_deep_dive.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Опасность дублирования строк при JOIN\\n\",\n        \"\\n\",\n        \"Самая частая ошибка, из-за которой компании увольняют аналитиков: **случайное размножение строк при связи «один-ко-многим»**.\\n\",\n        \"\\n\",\n        \"Если у одного клиента 3 заказа, а у каждого заказа по 2 товара:\\n\",\n        \"- `customers` JOIN `orders` -> 3 строки;\\n\",\n        \"- `orders` JOIN `order_items` -> 6 строк.\\n\",\n        \"Если вы после этого сделаете `SUM(orders.delivery_cost)`, стоимость доставки посчитается **дважды для каждого заказа**!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"# Запрос с правильным подсчетом уникальных заказов и суммы без задвоения\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    c.acquisition_channel,\\n\",\n        \"    COUNT(DISTINCT c.customer_id) AS unique_customers,\\n\",\n        \"    COUNT(DISTINCT o.order_id) AS total_orders,\\n\",\n        \"    ROUND(SUM(oi.total_amount), 2) AS total_revenue,\\n\",\n        \"    ROUND(SUM(oi.total_amount) / COUNT(DISTINCT o.order_id), 2) AS real_aov\\n\",\n        \"FROM customers c\\n\",\n        \"LEFT JOIN orders o ON c.customer_id = o.customer_id AND o.status = 'Completed'\\n\",\n        \"LEFT JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"GROUP BY c.acquisition_channel\\n\",\n        \"ORDER BY total_revenue DESC;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"АККУРАТНЫЙ РАСЧЕТ БЕЗ ДУБЛИРОВАНИЯ МЕТРИК:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 2. Урок 3: Все виды JOIN и защита от Cartesian Explosion (Задвоения данных)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_03_joins_deep_dive.ipynb)\n\n---\n\n## 1. Опасность дублирования строк при JOIN\n\nСамая частая ошибка, из-за которой компании увольняют аналитиков: **случайное размножение строк при связи «один-ко-многим»**.\n\nЕсли у одного клиента 3 заказа, а у каждого заказа по 2 товара:\n- `customers` JOIN `orders` -> 3 строки;\n- `orders` JOIN `order_items` -> 6 строк.\nЕсли вы после этого сделаете `SUM(orders.delivery_cost)`, стоимость доставки посчитается **дважды для каждого заказа**!\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Запрос с правильным подсчетом уникальных заказов и суммы без задвоения\nquery = \"\"\"\nSELECT \n    c.acquisition_channel,\n    COUNT(DISTINCT c.customer_id) AS unique_customers,\n    COUNT(DISTINCT o.order_id) AS total_orders,\n    ROUND(SUM(oi.total_amount), 2) AS total_revenue,\n    ROUND(SUM(oi.total_amount) / COUNT(DISTINCT o.order_id), 2) AS real_aov\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id AND o.status = 'Completed'\nLEFT JOIN order_items oi ON o.order_id = oi.order_id\nGROUP BY c.acquisition_channel\nORDER BY total_revenue DESC;\n\"\"\"\n\nprint(\"АККУРАТНЫЙ РАСЧЕТ БЕЗ ДУБЛИРОВАНИЯ МЕТРИК:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_04_subqueries_and_cte.ipynb", "rel_path": "course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧱 Модуль 2. Урок 4: Чистая архитектура SQL через CTE (WITH)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Принцип модульности: Common Table Expressions (CTE)\\n\",\n        \"\\n\",\n        \"В реальной работе запросы на 200 строк с 5 уровнями вложенных подзапросов невозможно поддерживать.\\n\",\n        \"Конструкция `WITH` превращает спагетти-код в последовательный пайплайн:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"-- Шаг 1: Агрегация на уровне клиента\\n\",\n        \"WITH customer_stats AS (\\n\",\n        \"    SELECT \\n\",\n        \"        customer_id,\\n\",\n        \"        COUNT(DISTINCT order_id) AS orders_count,\\n\",\n        \"        SUM(total_amount) AS total_spent\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY customer_id\\n\",\n        \"),\\n\",\n        \"-- Шаг 2: Расчет порогов для сегментации\\n\",\n        \"benchmark AS (\\n\",\n        \"    SELECT \\n\",\n        \"        AVG(total_spent) AS avg_ltv,\\n\",\n        \"        AVG(orders_count) AS avg_orders\\n\",\n        \"    FROM customer_stats\\n\",\n        \")\\n\",\n        \"-- Шаг 3: Финальный отчет с присвоением бизнес-сегментов\\n\",\n        \"SELECT \\n\",\n        \"    cs.customer_id,\\n\",\n        \"    cs.orders_count,\\n\",\n        \"    ROUND(cs.total_spent, 2) AS total_spent,\\n\",\n        \"    CASE \\n\",\n        \"        WHEN cs.total_spent > b.avg_ltv * 2 THEN 'VIP Client'\\n\",\n        \"        WHEN cs.orders_count > b.avg_orders THEN 'Loyal Client'\\n\",\n        \"        ELSE 'Regular Client'\\n\",\n        \"    END AS segment\\n\",\n        \"FROM customer_stats cs\\n\",\n        \"CROSS JOIN benchmark b\\n\",\n        \"ORDER BY cs.total_spent DESC\\n\",\n        \"LIMIT 8;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"КЛИЕНТСКАЯ СЕГМЕНТАЦИЯ ЧЕРЕЗ CTE:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧱 Модуль 2. Урок 4: Чистая архитектура SQL через CTE (WITH)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb)\n\n---\n\n## 1. Принцип модульности: Common Table Expressions (CTE)\n\nВ реальной работе запросы на 200 строк с 5 уровнями вложенных подзапросов невозможно поддерживать.\nКонструкция `WITH` превращает спагетти-код в последовательный пайплайн:\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\n-- Шаг 1: Агрегация на уровне клиента\nWITH customer_stats AS (\n    SELECT \n        customer_id,\n        COUNT(DISTINCT order_id) AS orders_count,\n        SUM(total_amount) AS total_spent\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY customer_id\n),\n-- Шаг 2: Расчет порогов для сегментации\nbenchmark AS (\n    SELECT \n        AVG(total_spent) AS avg_ltv,\n        AVG(orders_count) AS avg_orders\n    FROM customer_stats\n)\n-- Шаг 3: Финальный отчет с присвоением бизнес-сегментов\nSELECT \n    cs.customer_id,\n    cs.orders_count,\n    ROUND(cs.total_spent, 2) AS total_spent,\n    CASE \n        WHEN cs.total_spent > b.avg_ltv * 2 THEN 'VIP Client'\n        WHEN cs.orders_count > b.avg_orders THEN 'Loyal Client'\n        ELSE 'Regular Client'\n    END AS segment\nFROM customer_stats cs\nCROSS JOIN benchmark b\nORDER BY cs.total_spent DESC\nLIMIT 8;\n\"\"\"\n\nprint(\"КЛИЕНТСКАЯ СЕГМЕНТАЦИЯ ЧЕРЕЗ CTE:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🪟 Модуль 2. Урок 5: Оконные функции (Window Functions) в деталях\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Главные оконные функции аналитика данных\\n\",\n        \"\\n\",\n        \"1. `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Уникальная нумерация строк внутри группы (идеально для дедупликации).\\n\",\n        \"2. `DENSE_RANK() OVER (...)`: Ранжирование без пропусков (Топ-3 товара в каждой категории).\\n\",\n        \"3. `LAG(col, 1) OVER (...)` и `LEAD(col, 1) OVER (...)`: Доступ к предыдущей или следующей строке (расчет темпов роста MoM / YoY).\\n\",\n        \"4. `SUM(col) OVER (ORDER BY ...)`: Расчет нарастающего итога (Cumulative Revenue).\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"WITH monthly_revenue AS (\\n\",\n        \"    SELECT \\n\",\n        \"        SUBSTR(o.order_date, 1, 7) AS ym,\\n\",\n        \"        ROUND(SUM(oi.total_amount), 2) AS revenue\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY ym\\n\",\n        \")\\n\",\n        \"SELECT \\n\",\n        \"    ym,\\n\",\n        \"    revenue,\\n\",\n        \"    -- Нарастающий итог с начала года\\n\",\n        \"    ROUND(SUM(revenue) OVER (ORDER BY ym), 2) AS running_total,\\n\",\n        \"    -- Доход за предыдущий месяц\\n\",\n        \"    LAG(revenue, 1) OVER (ORDER BY ym) AS prev_month,\\n\",\n        \"    -- Относительный прирост месяц-к-месяцу (MoM %)\\n\",\n        \"    ROUND((revenue - LAG(revenue, 1) OVER (ORDER BY ym)) * 100.0 / \\n\",\n        \"          LAG(revenue, 1) OVER (ORDER BY ym), 2) AS mom_growth_pct\\n\",\n        \"FROM monthly_revenue\\n\",\n        \"ORDER BY ym;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"ФИНАНСОВАЯ АНАЛИТИКА ЧЕРЕЗ ОКОННЫЕ ФУНКЦИИ:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🪟 Модуль 2. Урок 5: Оконные функции (Window Functions) в деталях\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\n\n---\n\n## 1. Главные оконные функции аналитика данных\n\n1. `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Уникальная нумерация строк внутри группы (идеально для дедупликации).\n2. `DENSE_RANK() OVER (...)`: Ранжирование без пропусков (Топ-3 товара в каждой категории).\n3. `LAG(col, 1) OVER (...)` и `LEAD(col, 1) OVER (...)`: Доступ к предыдущей или следующей строке (расчет темпов роста MoM / YoY).\n4. `SUM(col) OVER (ORDER BY ...)`: Расчет нарастающего итога (Cumulative Revenue).\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH monthly_revenue AS (\n    SELECT \n        SUBSTR(o.order_date, 1, 7) AS ym,\n        ROUND(SUM(oi.total_amount), 2) AS revenue\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY ym\n)\nSELECT \n    ym,\n    revenue,\n    -- Нарастающий итог с начала года\n    ROUND(SUM(revenue) OVER (ORDER BY ym), 2) AS running_total,\n    -- Доход за предыдущий месяц\n    LAG(revenue, 1) OVER (ORDER BY ym) AS prev_month,\n    -- Относительный прирост месяц-к-месяцу (MoM %)\n    ROUND((revenue - LAG(revenue, 1) OVER (ORDER BY ym)) * 100.0 / \n          LAG(revenue, 1) OVER (ORDER BY ym), 2) AS mom_growth_pct\nFROM monthly_revenue\nORDER BY ym;\n\"\"\"\n\nprint(\"ФИНАНСОВАЯ АНАЛИТИКА ЧЕРЕЗ ОКОННЫЕ ФУНКЦИИ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔄 Модуль 2. Урок 6: Паттерны продуктовой аналитики: Воронки и Когорты на SQL\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Помесячный когортный анализ Retention Rate на чистом SQL\\n\",\n        \"\\n\",\n        \"Когортный анализ отвечает на ключевой вопрос: *«Удерживаем ли мы клиентов, привлеченных в разные месяцы, или они разово покупают и исчезают?»*\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query = \\\"\\\"\\\"\\n\",\n        \"WITH cohorts AS (\\n\",\n        \"    SELECT \\n\",\n        \"        customer_id,\\n\",\n        \"        MIN(SUBSTR(order_date, 1, 7)) AS first_order_month\\n\",\n        \"    FROM orders\\n\",\n        \"    WHERE status = 'Completed'\\n\",\n        \"    GROUP BY customer_id\\n\",\n        \"),\\n\",\n        \"activities AS (\\n\",\n        \"    SELECT \\n\",\n        \"        o.customer_id,\\n\",\n        \"        c.first_order_month,\\n\",\n        \"        SUBSTR(o.order_date, 1, 7) AS order_month\\n\",\n        \"    FROM orders o\\n\",\n        \"    JOIN cohorts c ON o.customer_id = c.customer_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \")\\n\",\n        \"SELECT \\n\",\n        \"    first_order_month AS cohort,\\n\",\n        \"    COUNT(DISTINCT customer_id) AS cohort_size,\\n\",\n        \"    COUNT(DISTINCT CASE WHEN order_month = first_order_month THEN customer_id END) AS m0_active,\\n\",\n        \"    COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) AS repeat_buyers,\\n\",\n        \"    ROUND(COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) * 100.0 / \\n\",\n        \"          COUNT(DISTINCT customer_id), 1) AS repeat_buyer_pct\\n\",\n        \"FROM activities\\n\",\n        \"GROUP BY first_order_month\\n\",\n        \"ORDER BY first_order_month\\n\",\n        \"LIMIT 6;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"print(\\\"КОГОРТНАЯ МАТРИЦА УДЕРЖАНИЯ:\\\")\\n\",\n        \"print(pd.read_sql(query, conn))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 2. Урок 6: Паттерны продуктовой аналитики: Воронки и Когорты на SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\n\n---\n\n## 1. Помесячный когортный анализ Retention Rate на чистом SQL\n\nКогортный анализ отвечает на ключевой вопрос: *«Удерживаем ли мы клиентов, привлеченных в разные месяцы, или они разово покупают и исчезают?»*\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH cohorts AS (\n    SELECT \n        customer_id,\n        MIN(SUBSTR(order_date, 1, 7)) AS first_order_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\nactivities AS (\n    SELECT \n        o.customer_id,\n        c.first_order_month,\n        SUBSTR(o.order_date, 1, 7) AS order_month\n    FROM orders o\n    JOIN cohorts c ON o.customer_id = c.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    first_order_month AS cohort,\n    COUNT(DISTINCT customer_id) AS cohort_size,\n    COUNT(DISTINCT CASE WHEN order_month = first_order_month THEN customer_id END) AS m0_active,\n    COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) AS repeat_buyers,\n    ROUND(COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) * 100.0 / \n          COUNT(DISTINCT customer_id), 1) AS repeat_buyer_pct\nFROM activities\nGROUP BY first_order_month\nORDER BY first_order_month\nLIMIT 6;\n\"\"\"\n\nprint(\"КОГОРТНАЯ МАТРИЦА УДЕРЖАНИЯ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🛡️ Модуль 2. Урок 7: Text-to-SQL промптинг и строгий чеклист валидации\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Архитектура надежного промпта для Text-to-SQL\\n\",\n        \"\\n\",\n        \"Когда вы просите нейросеть написать SQL, передавайте ей:\\n\",\n        \"1. **Диалект СУБД** (PostgreSQL / SQLite / BigQuery / ClickHouse — у всех разный синтаксис работы с датами и строками).\\n\",\n        \"2. **Точные DDL схемы таблиц** с первичными и внешними ключами.\\n\",\n        \"3. **Бизнес-правила фильтрации** («Всегда отсекай статус != Completed»).\\n\",\n        \"\\n\",\n        \"### Чеклист проверки SQL-кода от нейросети:\\n\",\n        \"- [ ] Не использовал ли ИИ агрегат внутри WHERE?\\n\",\n        \"- [ ] Все ли неагрегированные поля из SELECT попали в GROUP BY?\\n\",\n        \"- [ ] Проверено ли деление на ноль через `NULLIF(..., 0)`?\\n\",\n        \"- [ ] Проверена ли уникальность ключей при JOIN во избежание декартова произведения?\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛡️ Модуль 2. Урок 7: Text-to-SQL промптинг и строгий чеклист валидации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\n\n---\n\n## 1. Архитектура надежного промпта для Text-to-SQL\n\nКогда вы просите нейросеть написать SQL, передавайте ей:\n1. **Диалект СУБД** (PostgreSQL / SQLite / BigQuery / ClickHouse — у всех разный синтаксис работы с датами и строками).\n2. **Точные DDL схемы таблиц** с первичными и внешними ключами.\n3. **Бизнес-правила фильтрации** («Всегда отсекай статус != Completed»).\n\n### Чеклист проверки SQL-кода от нейросети:\n- [ ] Не использовал ли ИИ агрегат внутри WHERE?\n- [ ] Все ли неагрегированные поля из SELECT попали в GROUP BY?\n- [ ] Проверено ли деление на ноль через `NULLIF(..., 0)`?\n- [ ] Проверена ли уникальность ключей при JOIN во избежание декартова произведения?\n"}]}]}, {"id": "module_03_python", "title": "Модуль 3. Python и Pandas с AI напарником", "category": "Хард база", "badge": "Python", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`), объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python & Pandas)\n\n---\n\n### Вопрос 1\nПочему в Pandas категорически рекомендуется использовать векторизованные операции вместо циклов `for`?\n- [ ] Циклы for запрещены создателями Python.\n- [x] Векторизованные операции транслируются в оптимизированный C-код и выполняются в десятки и сотни раз быстрее.\n- [ ] Векторизованные операции не расходуют память.\n*Объяснение*: Pandas оперирует низкоуровневыми массивами C через NumPy, выполняя расчеты над всей колонкой единым блоком инструкций процессора (SIMD).\n\n---\n\n### Вопрос 2\nВ чем заключается ошибка при расчете общего CR компании через `df['conversion_rate'].mean()`?\n- [ ] Ошибки нет, среднее всегда корректно.\n- [x] Это математическая ошибка усреднения процентов без учета разницы в объемах трафика между филиалами/сегментами.\n- [ ] Метод .mean() не умеет работать с числами с плавающей точкой.\n*Объяснение*: Чтобы получить истинную конверсию, необходимо разделить суммарное число целевых действий на суммарный трафик (`total_actions / total_traffic`).\n\n---\n\n### Вопрос 3\nКакой результат вернет операция `df.loc[0:2]` vs `df.iloc[0:2]`?\n- [ ] Одинаковый результат.\n- [x] `.loc[0:2]` включит строки с метками 0, 1 и 2 (включая правый конец), а `.iloc[0:2]` вернет строго первые 2 строки с индексами 0 и 1 (не включая правый конец).\n- [ ] Выдаст ошибку синтаксиса.\n*Объяснение*: В `.loc` правая граница включается, так как поиск идет по именам/меткам. В `.iloc` правая граница исключается по стандартному правилу срезов Python.\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🐍 Модуль 3. Урок 1: Как аналитик пишет код на Python в 2027 году\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Концепция: Векторизация против циклов for\\n\",\n        \"\\n\",\n        \"Главная ментальная модель Python для данных: **мы никогда не перебираем строки таблицы циклом `for`**.\\n\",\n        \"Векторизованные операции Pandas выполняются на оптимизированном коде C/C++ в сотни раз быстрее обычного цикла Python.\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"┌─────────────────────────────────┬─────────────────────────────────┐\\n\",\n        \"│     ПЛОХОЙ МЕДЛЕННЫЙ КОД        │      ВЕКТОРИЗОВАННЫЙ PANDAS     │\\n\",\n        \"├─────────────────────────────────┼─────────────────────────────────┤\\n\",\n        \"│ for i in range(len(df)):        │ df['total'] =                   │\\n\",\n        \"│     df.loc[i, 'total'] =        │     df['price'] * df['qty']     │\\n\",\n        \"│         df.loc[i, 'price'] * ...│                                 │\\n\",\n        \"│ (Работает 45 секунд)            │ (Работает 0.02 секунды)         │\\n\",\n        \"└─────────────────────────────────┴─────────────────────────────────┘\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Практическое сравнение скорости: Векторизация vs Цикл for\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"import time\\n\",\n        \"\\n\",\n        \"n = 200_000\\n\",\n        \"prices = np.random.uniform(100, 5000, n)\\n\",\n        \"quantities = np.random.randint(1, 10, n)\\n\",\n        \"df_perf = pd.DataFrame({'price': prices, 'quantity': quantities})\\n\",\n        \"\\n\",\n        \"# 1. Векторизованный расчет\\n\",\n        \"t0 = time.time()\\n\",\n        \"df_perf['amount_vectorized'] = df_perf['price'] * df_perf['quantity']\\n\",\n        \"t_vec = time.time() - t0\\n\",\n        \"\\n\",\n        \"print(f\\\"Векторизованный расчет на {n:,} строк занял: {t_vec:.4f} сек\\\")\\n\",\n        \"print(\\\"Это фундаментальный принцип высокопроизводительного анализа данных!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🐍 Модуль 3. Урок 1: Как аналитик пишет код на Python в 2027 году\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\n\n---\n\n## 1. Концепция: Векторизация против циклов for\n\nГлавная ментальная модель Python для данных: **мы никогда не перебираем строки таблицы циклом `for`**.\nВекторизованные операции Pandas выполняются на оптимизированном коде C/C++ в сотни раз быстрее обычного цикла Python.\n\n```\n┌─────────────────────────────────┬─────────────────────────────────┐\n│     ПЛОХОЙ МЕДЛЕННЫЙ КОД        │      ВЕКТОРИЗОВАННЫЙ PANDAS     │\n├─────────────────────────────────┼─────────────────────────────────┤\n│ for i in range(len(df)):        │ df['total'] =                   │\n│     df.loc[i, 'total'] =        │     df['price'] * df['qty']     │\n│         df.loc[i, 'price'] * ...│                                 │\n│ (Работает 45 секунд)            │ (Работает 0.02 секунды)         │\n└─────────────────────────────────┴─────────────────────────────────┘\n```\n"}, {"type": "code", "content": "# Практическое сравнение скорости: Векторизация vs Цикл for\nimport pandas as pd\nimport numpy as np\nimport time\n\nn = 200_000\nprices = np.random.uniform(100, 5000, n)\nquantities = np.random.randint(1, 10, n)\ndf_perf = pd.DataFrame({'price': prices, 'quantity': quantities})\n\n# 1. Векторизованный расчет\nt0 = time.time()\ndf_perf['amount_vectorized'] = df_perf['price'] * df_perf['quantity']\nt_vec = time.time() - t0\n\nprint(f\"Векторизованный расчет на {n:,} строк занял: {t_vec:.4f} сек\")\nprint(\"Это фундаментальный принцип высокопроизводительного анализа данных!\")\n"}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 3. Урок 2: Анатомия DataFrame: Индексация, срезы и фильтрация\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Разница между `.loc[]` и `.iloc[]`\\n\",\n        \"\\n\",\n        \"- `.loc[label_indexer]` — обращение по **именам** (меткам) строк и названиям столбцов.\\n\",\n        \"- `.iloc[position_indexer]` — обращение строго по **целочисленным номерам** позиций (0, 1, 2...).\\n\",\n        \"\\n\",\n        \"### Булева фильтрация с несколькими условиями:\\n\",\n        \"- `&` (логическое И), `|` (логическое ИЛИ), `~` (логическое НЕ).\\n\",\n        \"- **Обязательно оборачивать каждое условие в круглые скобки**: `(df['A'] > 10) & (df['B'] == 'X')`!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Загружаем реальный датасет клиентов курса\\n\",\n        \"df_cust = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customers.csv\\\")\\n\",\n        \"\\n\",\n        \"# Сложная сегментация: Мобильные пользователи из городов-миллионников, пришедшие с платной рекламы\\n\",\n        \"target_segment = df_cust[\\n\",\n        \"    (df_cust['city'].isin(['Moscow', 'Saint Petersburg', 'Kazan'])) &\\n\",\n        \"    (df_cust['device'].str.contains('Mobile')) &\\n\",\n        \"    (df_cust['acquisition_channel'] == 'Paid Ads')\\n\",\n        \"]\\n\",\n        \"\\n\",\n        \"print(f\\\"Всего пользователей: {len(df_cust)}\\\")\\n\",\n        \"print(f\\\"Пользователей в целевом сегменте: {len(target_segment)} ({len(target_segment)/len(df_cust)*100:.1f}%)\\\")\\n\",\n        \"print(target_segment[['customer_id', 'first_name', 'city', 'device']].head(4))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 3. Урок 2: Анатомия DataFrame: Индексация, срезы и фильтрация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\n\n---\n\n## 1. Разница между `.loc[]` и `.iloc[]`\n\n- `.loc[label_indexer]` — обращение по **именам** (меткам) строк и названиям столбцов.\n- `.iloc[position_indexer]` — обращение строго по **целочисленным номерам** позиций (0, 1, 2...).\n\n### Булева фильтрация с несколькими условиями:\n- `&` (логическое И), `|` (логическое ИЛИ), `~` (логическое НЕ).\n- **Обязательно оборачивать каждое условие в круглые скобки**: `(df['A'] > 10) & (df['B'] == 'X')`!\n"}, {"type": "code", "content": "import pandas as pd\n\n# Загружаем реальный датасет клиентов курса\ndf_cust = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\n# Сложная сегментация: Мобильные пользователи из городов-миллионников, пришедшие с платной рекламы\ntarget_segment = df_cust[\n    (df_cust['city'].isin(['Moscow', 'Saint Petersburg', 'Kazan'])) &\n    (df_cust['device'].str.contains('Mobile')) &\n    (df_cust['acquisition_channel'] == 'Paid Ads')\n]\n\nprint(f\"Всего пользователей: {len(df_cust)}\")\nprint(f\"Пользователей в целевом сегменте: {len(target_segment)} ({len(target_segment)/len(df_cust)*100:.1f}%)\")\nprint(target_segment[['customer_id', 'first_name', 'city', 'device']].head(4))\n"}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧩 Модуль 3. Урок 3: Агрегации, группировки и слияния таблиц (Merge / Concat)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Реальный бизнес-кейс: Юнит-экономика товарных категорий\\n\",\n        \"\\n\",\n        \"Объединяем продажи, себестоимость и данные клиентов для расчета чистой прибыли по категориям.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"products = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\products.csv\\\")\\n\",\n        \"\\n\",\n        \"# Сквозной merge\\n\",\n        \"full_df = items.merge(orders, on='order_id').merge(products, on='product_id')\\n\",\n        \"full_df = full_df[full_df['status'] == 'Completed']\\n\",\n        \"\\n\",\n        \"# Расчет валовой прибыли\\n\",\n        \"full_df['gross_profit'] = full_df['total_amount'] - (full_df['cost'] * full_df['quantity'])\\n\",\n        \"\\n\",\n        \"# Группировка с несколькими метриками\\n\",\n        \"cat_pnl = full_df.groupby('category').agg(\\n\",\n        \"    revenue=('total_amount', 'sum'),\\n\",\n        \"    gross_profit=('gross_profit', 'sum'),\\n\",\n        \"    orders_count=('order_id', 'nunique'),\\n\",\n        \"    avg_order_value=('total_amount', 'mean')\\n\",\n        \").reset_index()\\n\",\n        \"\\n\",\n        \"cat_pnl['margin_pct'] = (cat_pnl['gross_profit'] / cat_pnl['revenue'] * 100).round(1)\\n\",\n        \"print(\\\"UNIT-ЭКОНОМИКА КАТЕГОРИЙ:\\\")\\n\",\n        \"print(cat_pnl.sort_values(by='revenue', ascending=False))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧩 Модуль 3. Урок 3: Агрегации, группировки и слияния таблиц (Merge / Concat)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\n\n---\n\n## 1. Реальный бизнес-кейс: Юнит-экономика товарных категорий\n\nОбъединяем продажи, себестоимость и данные клиентов для расчета чистой прибыли по категориям.\n"}, {"type": "code", "content": "import pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\n\n# Сквозной merge\nfull_df = items.merge(orders, on='order_id').merge(products, on='product_id')\nfull_df = full_df[full_df['status'] == 'Completed']\n\n# Расчет валовой прибыли\nfull_df['gross_profit'] = full_df['total_amount'] - (full_df['cost'] * full_df['quantity'])\n\n# Группировка с несколькими метриками\ncat_pnl = full_df.groupby('category').agg(\n    revenue=('total_amount', 'sum'),\n    gross_profit=('gross_profit', 'sum'),\n    orders_count=('order_id', 'nunique'),\n    avg_order_value=('total_amount', 'mean')\n).reset_index()\n\ncat_pnl['margin_pct'] = (cat_pnl['gross_profit'] / cat_pnl['revenue'] * 100).round(1)\nprint(\"UNIT-ЭКОНОМИКА КАТЕГОРИЙ:\")\nprint(cat_pnl.sort_values(by='revenue', ascending=False))\n"}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 3. Урок 4: Визуализация данных в Python (Matplotlib & Seaborn)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Когда какой график использовать в бизнесе?\\n\",\n        \"\\n\",\n        \"- **Boxplot (Ящик с усами)**: Сравнение медианы и разброса метрики между сегментами (выявление аномалий).\\n\",\n        \"- **Lineplot (Линия)**: Динамика во времени, сезонность.\\n\",\n        \"- **Barplot (Столбцы)**: Сравнение дискретных категорий.\\n\",\n        \"- **Heatmap (Тепловая карта)**: Корреляционная матрица, когортные сетки.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import seaborn as sns\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"plt.figure(figsize=(10, 5))\\n\",\n        \"sns.violinplot(data=saas, x='plan', y='nps_score', hue='is_churned', split=True, palette='Blues_r')\\n\",\n        \"plt.title('Распределение NPS по тарифам и факту оттока клиентов', fontsize=13, pad=12)\\n\",\n        \"plt.xlabel('Тарифный план')\\n\",\n        \"plt.ylabel('Оценка NPS')\\n\",\n        \"plt.grid(axis='y', alpha=0.3)\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 3. Урок 4: Визуализация данных в Python (Matplotlib & Seaborn)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\n\n---\n\n## 1. Когда какой график использовать в бизнесе?\n\n- **Boxplot (Ящик с усами)**: Сравнение медианы и разброса метрики между сегментами (выявление аномалий).\n- **Lineplot (Линия)**: Динамика во времени, сезонность.\n- **Barplot (Столбцы)**: Сравнение дискретных категорий.\n- **Heatmap (Тепловая карта)**: Корреляционная матрица, когортные сетки.\n"}, {"type": "code", "content": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\nplt.figure(figsize=(10, 5))\nsns.violinplot(data=saas, x='plan', y='nps_score', hue='is_churned', split=True, palette='Blues_r')\nplt.title('Распределение NPS по тарифам и факту оттока клиентов', fontsize=13, pad=12)\nplt.xlabel('Тарифный план')\nplt.ylabel('Оценка NPS')\nplt.grid(axis='y', alpha=0.3)\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🕵️ Модуль 3. Урок 5: Code Review кода от ИИ: Поиск скрытых математических багов\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Классические галлюцинации LLM при написании аналитического кода\\n\",\n        \"\\n\",\n        \"1. **Среднее от процентов (Averaging Averages)**: ИИ берет конверсию филиала 1 (10%) и филиала 2 (2%) и считает: `(10 + 2) / 2 = 6%`. Но в филиале 1 было 10 посетителей, а в филиале 2 — 10 000! Реальная конверсия будет около 2.01%, а не 6%!\\n\",\n        \"2. **Утечка будущего (Data Leakage)**: Использование данных из будущего при фильтрации когорт.\\n\",\n        \"3. **Замена NaN на 0 без предупреждения**: Искажает медиану и стандартное отклонение.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация критической ошибки \\\"Среднее от процентов\\\"\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"branch_data = pd.DataFrame({\\n\",\n        \"    'Филиал': ['Точка А (Маленькая)', 'Точка Б (Флагман)'],\\n\",\n        \"    'Посетители': [10, 10000],\\n\",\n        \"    'Покупки': [1, 200]\\n\",\n        \"})\\n\",\n        \"branch_data['CR'] = branch_data['Покупки'] / branch_data['Посетители']\\n\",\n        \"\\n\",\n        \"# ОШИБКА НЕЙРОСЕТИ:\\n\",\n        \"bad_cr = branch_data['CR'].mean()\\n\",\n        \"\\n\",\n        \"# ПРАВИЛЬНЫЙ РАСЧЕТ АНАЛИТИКА:\\n\",\n        \"true_cr = branch_data['Покупки'].sum() / branch_data['Посетители'].sum()\\n\",\n        \"\\n\",\n        \"print(f\\\"Ошибка ИИ (Среднее от процентов): {bad_cr*100:.2f}% (ОШИБКА В 3 РАЗА!)\\\")\\n\",\n        \"print(f\\\"Истинная сквозная конверсия: {true_cr*100:.2f}%\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🕵️ Модуль 3. Урок 5: Code Review кода от ИИ: Поиск скрытых математических багов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\n\n---\n\n## 1. Классические галлюцинации LLM при написании аналитического кода\n\n1. **Среднее от процентов (Averaging Averages)**: ИИ берет конверсию филиала 1 (10%) и филиала 2 (2%) и считает: `(10 + 2) / 2 = 6%`. Но в филиале 1 было 10 посетителей, а в филиале 2 — 10 000! Реальная конверсия будет около 2.01%, а не 6%!\n2. **Утечка будущего (Data Leakage)**: Использование данных из будущего при фильтрации когорт.\n3. **Замена NaN на 0 без предупреждения**: Искажает медиану и стандартное отклонение.\n"}, {"type": "code", "content": "# Демонстрация критической ошибки \"Среднее от процентов\"\nimport pandas as pd\n\nbranch_data = pd.DataFrame({\n    'Филиал': ['Точка А (Маленькая)', 'Точка Б (Флагман)'],\n    'Посетители': [10, 10000],\n    'Покупки': [1, 200]\n})\nbranch_data['CR'] = branch_data['Покупки'] / branch_data['Посетители']\n\n# ОШИБКА НЕЙРОСЕТИ:\nbad_cr = branch_data['CR'].mean()\n\n# ПРАВИЛЬНЫЙ РАСЧЕТ АНАЛИТИКА:\ntrue_cr = branch_data['Покупки'].sum() / branch_data['Посетители'].sum()\n\nprint(f\"Ошибка ИИ (Среднее от процентов): {bad_cr*100:.2f}% (ОШИБКА В 3 РАЗА!)\")\nprint(f\"Истинная сквозная конверсия: {true_cr*100:.2f}%\")\n"}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4. Очистка данных и Data Quality", "category": "Хард база", "badge": "Качество", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Очистка и качество данных)\n\n---\n\n### Вопрос 1\nЧто означает пропуск типа MNAR (Missing Not at Random)?\n- [ ] Данные потерялись из-за случайного обрыва связи Wi-Fi.\n- [x] Вероятность отсутствия значения напрямую связана с самим этим скрытым значением (например, люди с очень низким доходом отказываются его называть).\n- [ ] Ошибка в формате даты.\n*Объяснение*: При MNAR нельзя просто удалять строки или заменять их на среднее, так как это системно исказит распределение.\n\n---\n\n### Вопрос 2\nЧто делать, если в транзакциях интернет-магазина обнаружен заказ на сумму в 50 раз выше среднего чека?\n- [ ] Немедленно удалить этот заказ как выброс.\n- [x] Проверить контекст: если это реальный оптовый покупатель, сохранить его в базе, но при расчете розничного среднего чека выделить в отдельный B2B-сегмент.\n- [ ] Заменить сумму на медиану.\n*Объяснение*: Выбросы в коммерческих данных часто представляют наиболее ценный сегмент клиентов (B2B, киты), который требует отдельного анализа.\n\n---\n\n### Вопрос 3\nКакое регулярное выражение (RegEx) извлечет только цифры из строки `Order #4592-A`?\n- [ ] `[A-Z]+`\n- [x] `\\d+`\n- [ ] `\\s+`\n*Объяснение*: `\\d` обозначает digit (любую цифру от 0 до 9), а квантификатор `+` означает одно или более вхождений.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧹 Модуль 4. Урок 1: Missing Values: MCAR, MAR, MNAR и приведение типов\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Теория пропусков в данных: Три типа Missing Values\\n\",\n        \"\\n\",\n        \"Нельзя просто так брать и заполнять все пропуски средним. В статистике выделяют 3 природы отсутствия данных:\\n\",\n        \"1. **MCAR (Missing Completely at Random)**: Пропуск абсолютно случаен (например, случайный сбой датчика сети). Удаление строк не смещает оценку.\\n\",\n        \"2. **MAR (Missing at Random)**: Вероятность пропуска зависит от других наблюдаемых полей (например, женщины реже указывают возраст в анкете, но чаще указывают образование).\\n\",\n        \"3. **MNAR (Missing Not at Random)**: Пропуск зависит от самого ненаблюдаемого значения (например, люди с экстремально высоким или нулевым доходом скрывают свой доход). Заполнение медианой приведет к катастрофическому смещению!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Реальный кейс: Обработка пропусков в зависимости от природы данных\\n\",\n        \"dirty_users = pd.DataFrame({\\n\",\n        \"    'user_id': range(1, 6),\\n\",\n        \"    'income': [50000, np.nan, 75000, np.nan, 120000],\\n\",\n        \"    'is_employed': [1, 0, 1, 0, 1], # Если человек не работает, доход пропущен осмысленно!\\n\",\n        \"    'age': [25, 42, np.nan, 31, 55]\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"print(\\\"СЫРЫЕ ДАННЫЕ С ПРОПУСКАМИ:\\\")\\n\",\n        \"print(dirty_users)\\n\",\n        \"\\n\",\n        \"# Умная импутация:\\n\",\n        \"# 1. Если не трудоустроен — ставим 0\\n\",\n        \"dirty_users.loc[dirty_users['is_employed'] == 0, 'income'] = dirty_users.loc[dirty_users['is_employed'] == 0, 'income'].fillna(0)\\n\",\n        \"# 2. Для возраста берем медиану\\n\",\n        \"dirty_users['age'] = dirty_users['age'].fillna(dirty_users['age'].median())\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\nОЧИЩЕННЫЕ ДАННЫЕ БЕЗ СМЕЩЕНИЯ ВЫБОРКИ:\\\")\\n\",\n        \"print(dirty_users)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧹 Модуль 4. Урок 1: Missing Values: MCAR, MAR, MNAR и приведение типов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\n\n---\n\n## 1. Теория пропусков в данных: Три типа Missing Values\n\nНельзя просто так брать и заполнять все пропуски средним. В статистике выделяют 3 природы отсутствия данных:\n1. **MCAR (Missing Completely at Random)**: Пропуск абсолютно случаен (например, случайный сбой датчика сети). Удаление строк не смещает оценку.\n2. **MAR (Missing at Random)**: Вероятность пропуска зависит от других наблюдаемых полей (например, женщины реже указывают возраст в анкете, но чаще указывают образование).\n3. **MNAR (Missing Not at Random)**: Пропуск зависит от самого ненаблюдаемого значения (например, люди с экстремально высоким или нулевым доходом скрывают свой доход). Заполнение медианой приведет к катастрофическому смещению!\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Реальный кейс: Обработка пропусков в зависимости от природы данных\ndirty_users = pd.DataFrame({\n    'user_id': range(1, 6),\n    'income': [50000, np.nan, 75000, np.nan, 120000],\n    'is_employed': [1, 0, 1, 0, 1], # Если человек не работает, доход пропущен осмысленно!\n    'age': [25, 42, np.nan, 31, 55]\n})\n\nprint(\"СЫРЫЕ ДАННЫЕ С ПРОПУСКАМИ:\")\nprint(dirty_users)\n\n# Умная импутация:\n# 1. Если не трудоустроен — ставим 0\ndirty_users.loc[dirty_users['is_employed'] == 0, 'income'] = dirty_users.loc[dirty_users['is_employed'] == 0, 'income'].fillna(0)\n# 2. Для возраста берем медиану\ndirty_users['age'] = dirty_users['age'].fillna(dirty_users['age'].median())\n\nprint(\"\\nОЧИЩЕННЫЕ ДАННЫЕ БЕЗ СМЕЩЕНИЯ ВЫБОРКИ:\")\nprint(dirty_users)\n"}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔤 Модуль 4. Урок 2: Дедупликация и нормализация текста с RegEx\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Регулярные выражения (RegEx) для аналитика\\n\",\n        \"\\n\",\n        \"Регулярные выражения — суперсила для очистки грязных телефонов, email, промокодов и артикулов:\\n\",\n        \"- `\\\\d+` — одна или более цифр.\\n\",\n        \"- `[A-Za-z]+` — латинские буквы.\\n\",\n        \"- `^...$` — начало и конец строки.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"raw_logistics = pd.DataFrame({\\n\",\n        \"    'tracking_number': ['RU-123456-X', 'ru_123456_x ', 'RU123456X', 'Order #999999-Y'],\\n\",\n        \"    'customer_phone': ['+7 (999) 123-45-67', '89991234567', '79991234567', '+7 999 123 45 67']\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"# Нормализуем трек-номера: удаляем пробелы, переводим в верхний регистр, убираем знаки препинания\\n\",\n        \"raw_logistics['tracking_clean'] = raw_logistics['tracking_number'].str.upper().str.replace(r'[^A-Z0-9]', '', regex=True)\\n\",\n        \"\\n\",\n        \"# Нормализуем телефон в стандартный формат E.164: +7XXXXXXXXXX\\n\",\n        \"digits = raw_logistics['customer_phone'].str.replace(r'\\\\D', '', regex=True)\\n\",\n        \"raw_logistics['phone_clean'] = digits.apply(lambda x: '+7' + x[1:] if x.startswith('8') else '+' + x)\\n\",\n        \"\\n\",\n        \"print(\\\"РЕЗУЛЬТАТ REGEX-ОЧИСТКИ:\\\")\\n\",\n        \"print(raw_logistics[['tracking_clean', 'phone_clean']])\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔤 Модуль 4. Урок 2: Дедупликация и нормализация текста с RegEx\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\n\n---\n\n## 1. Регулярные выражения (RegEx) для аналитика\n\nРегулярные выражения — суперсила для очистки грязных телефонов, email, промокодов и артикулов:\n- `\\d+` — одна или более цифр.\n- `[A-Za-z]+` — латинские буквы.\n- `^...$` — начало и конец строки.\n"}, {"type": "code", "content": "import pandas as pd\n\nraw_logistics = pd.DataFrame({\n    'tracking_number': ['RU-123456-X', 'ru_123456_x ', 'RU123456X', 'Order #999999-Y'],\n    'customer_phone': ['+7 (999) 123-45-67', '89991234567', '79991234567', '+7 999 123 45 67']\n})\n\n# Нормализуем трек-номера: удаляем пробелы, переводим в верхний регистр, убираем знаки препинания\nraw_logistics['tracking_clean'] = raw_logistics['tracking_number'].str.upper().str.replace(r'[^A-Z0-9]', '', regex=True)\n\n# Нормализуем телефон в стандартный формат E.164: +7XXXXXXXXXX\ndigits = raw_logistics['customer_phone'].str.replace(r'\\D', '', regex=True)\nraw_logistics['phone_clean'] = digits.apply(lambda x: '+7' + x[1:] if x.startswith('8') else '+' + x)\n\nprint(\"РЕЗУЛЬТАТ REGEX-ОЧИСТКИ:\")\nprint(raw_logistics[['tracking_clean', 'phone_clean']])\n"}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🚨 Модуль 4. Урок 3: Детекция аномалий и выбросов: IQR, Z-Score, Isolation\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Когда выброс — это ошибка, а когда — ключевой инсайт бизнеса?\\n\",\n        \"\\n\",\n        \"- **Выброс-ошибка**: Сумма заказа = -100 руб или возраст клиента = 200 лет. Удаляем или исправляем.\\n\",\n        \"- **Выброс-инсайт**: Заказ на 5 000 000 руб при среднем чеке 3 000 руб. Это оптовый B2B-клиент. Если вы просто удалите его из базы, вы исказите выручку на 30%!\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"\\n\",\n        \"# Расчет Z-score: z = (x - mean) / std\\n\",\n        \"mean_amt = items['total_amount'].mean()\\n\",\n        \"std_amt = items['total_amount'].std()\\n\",\n        \"items['z_score'] = (items['total_amount'] - mean_amt) / std_amt\\n\",\n        \"\\n\",\n        \"# Аномалии с Z-score > 3 (вероятность при нормальном распределении < 0.3%)\\n\",\n        \"anomalies = items[items['z_score'].abs() > 3]\\n\",\n        \"print(f\\\"Средняя сумма позиции: ${mean_amt:.2f} | Std: ${std_amt:.2f}\\\")\\n\",\n        \"print(f\\\"Обнаружено статистических аномалий (|z| > 3): {len(anomalies)} строк\\\")\\n\",\n        \"print(anomalies[['order_item_id', 'total_amount', 'z_score']].head(5))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🚨 Модуль 4. Урок 3: Детекция аномалий и выбросов: IQR, Z-Score, Isolation\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\n\n---\n\n## 1. Когда выброс — это ошибка, а когда — ключевой инсайт бизнеса?\n\n- **Выброс-ошибка**: Сумма заказа = -100 руб или возраст клиента = 200 лет. Удаляем или исправляем.\n- **Выброс-инсайт**: Заказ на 5 000 000 руб при среднем чеке 3 000 руб. Это оптовый B2B-клиент. Если вы просто удалите его из базы, вы исказите выручку на 30%!\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\n\n# Расчет Z-score: z = (x - mean) / std\nmean_amt = items['total_amount'].mean()\nstd_amt = items['total_amount'].std()\nitems['z_score'] = (items['total_amount'] - mean_amt) / std_amt\n\n# Аномалии с Z-score > 3 (вероятность при нормальном распределении < 0.3%)\nanomalies = items[items['z_score'].abs() > 3]\nprint(f\"Средняя сумма позиции: ${mean_amt:.2f} | Std: ${std_amt:.2f}\")\nprint(f\"Обнаружено статистических аномалий (|z| > 3): {len(anomalies)} строк\")\nprint(anomalies[['order_item_id', 'total_amount', 'z_score']].head(5))\n"}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚙️ Модуль 4. Урок 4: Построение продакшен-пайплайна валидации данных\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Концепция Data Contracts и Assert-валидации\\n\",\n        \"\\n\",\n        \"В зрелых командах аналитики пишут проверки-утверждения (`assert`), предотвращающие попадание битых данных в витрины.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"def validate_and_clean_orders(raw_df: pd.DataFrame) -> pd.DataFrame:\\n\",\n        \"    df = raw_df.copy()\\n\",\n        \"    \\n\",\n        \"    # Инвариант 1: Уникальность первичного ключа\\n\",\n        \"    assert df['order_id'].nunique() == len(df), \\\"КРИТИЧЕСКИЙ СБОЙ: Дубликаты в order_id!\\\"\\n\",\n        \"    \\n\",\n        \"    # Очистка\\n\",\n        \"    df = df.dropna(subset=['order_id', 'customer_id'])\\n\",\n        \"    df['order_date'] = pd.to_datetime(df['order_date'])\\n\",\n        \"    \\n\",\n        \"    # Инвариант 2: Статусы только из белого списка\\n\",\n        \"    valid_statuses = {'Completed', 'Refunded', 'Cancelled'}\\n\",\n        \"    df = df[df['status'].isin(valid_statuses)]\\n\",\n        \"    \\n\",\n        \"    return df\\n\",\n        \"\\n\",\n        \"orders_raw = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"orders_clean = validate_and_clean_orders(orders_raw)\\n\",\n        \"print(f\\\"Пайплайн валидации успешно пройден! Валидных заказов: {len(orders_clean):,}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚙️ Модуль 4. Урок 4: Построение продакшен-пайплайна валидации данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\n\n---\n\n## 1. Концепция Data Contracts и Assert-валидации\n\nВ зрелых командах аналитики пишут проверки-утверждения (`assert`), предотвращающие попадание битых данных в витрины.\n"}, {"type": "code", "content": "import pandas as pd\n\ndef validate_and_clean_orders(raw_df: pd.DataFrame) -> pd.DataFrame:\n    df = raw_df.copy()\n    \n    # Инвариант 1: Уникальность первичного ключа\n    assert df['order_id'].nunique() == len(df), \"КРИТИЧЕСКИЙ СБОЙ: Дубликаты в order_id!\"\n    \n    # Очистка\n    df = df.dropna(subset=['order_id', 'customer_id'])\n    df['order_date'] = pd.to_datetime(df['order_date'])\n    \n    # Инвариант 2: Статусы только из белого списка\n    valid_statuses = {'Completed', 'Refunded', 'Cancelled'}\n    df = df[df['status'].isin(valid_statuses)]\n    \n    return df\n\norders_raw = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\norders_clean = validate_and_clean_orders(orders_raw)\nprint(f\"Пайплайн валидации успешно пройден! Валидных заказов: {len(orders_clean):,}\")\n"}]}]}, {"id": "module_05_statistics", "title": "Модуль 5. Статистика и гипотезы", "category": "Математика", "badge": "Статистика", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `l
