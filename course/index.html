через `.cursorrules`\n\nВ современных командах аналитики не повторяют одни и те же правила в каждом чате.\nВ корне проекта создается файл `.cursorrules` (или системный промпт проекта):\n\n```markdown\n# Corporate Data Analytics Guidelines (2027)\n- Язык общения: Русский. Названия переменных, функций и колонок: Английский (snake_case).\n- СУБД: PostgreSQL 16. Всегда фильтровать `status = 'Completed'` при расчете выручки.\n- Векторизация: Никогда не использовать циклы for для строк DataFrame.\n- Защита от деления на ноль: Всегда использовать `NULLIF(denominator, 0)` в SQL и `div()` с `fill_value=0` в Pandas.\n- Формат дат: ISO-8601 (YYYY-MM-DD).\n```\n"}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚡ Модуль 9. Урок 2: Разведочный анализ (EDA) в Claude Code Interpreter за 10 минут\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Автоматический аудит нового датасета через AI\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"def run_ai_eda(df: pd.DataFrame):\\n\",\n        \"    print(\\\"=== АВТОМАТИЧЕСКИЙ ПРОФАЙЛИНГ ДАТАСЕТА ===\\\")\\n\",\n        \"    print(f\\\"Размер: {df.shape[0]} строк x {df.shape[1]} колонок\\\")\\n\",\n        \"    \\n\",\n        \"    # 1. Проверка уникальности\\n\",\n        \"    dups = df.duplicated().sum()\\n\",\n        \"    print(f\\\"Дубликатов строк: {dups}\\\")\\n\",\n        \"    \\n\",\n        \"    # 2. Пропуски\\n\",\n        \"    nulls = df.isnull().sum()\\n\",\n        \"    print(\\\"\\\\nКолонки с пропусками:\\\")\\n\",\n        \"    print(nulls[nulls > 0])\\n\",\n        \"    \\n\",\n        \"    # 3. Числовые распределения\\n\",\n        \"    print(\\\"\\\\nСводка по числовым метрикам:\\\")\\n\",\n        \"    print(df[['mrr', 'active_seats', 'nps_score', 'feature_a_usage']].describe().round(1))\\n\",\n        \"\\n\",\n        \"run_ai_eda(saas)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚡ Модуль 9. Урок 2: Разведочный анализ (EDA) в Claude Code Interpreter за 10 минут\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\n\n---\n\n## 1. Автоматический аудит нового датасета через AI\n"}, {"type": "code", "content": "import pandas as pd\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\ndef run_ai_eda(df: pd.DataFrame):\n    print(\"=== АВТОМАТИЧЕСКИЙ ПРОФАЙЛИНГ ДАТАСЕТА ===\")\n    print(f\"Размер: {df.shape[0]} строк x {df.shape[1]} колонок\")\n    \n    # 1. Проверка уникальности\n    dups = df.duplicated().sum()\n    print(f\"Дубликатов строк: {dups}\")\n    \n    # 2. Пропуски\n    nulls = df.isnull().sum()\n    print(\"\\nКолонки с пропусками:\")\n    print(nulls[nulls > 0])\n    \n    # 3. Числовые распределения\n    print(\"\\nСводка по числовым метрикам:\")\n    print(df[['mrr', 'active_seats', 'nps_score', 'feature_a_usage']].describe().round(1))\n\nrun_ai_eda(saas)\n"}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🛡️ Модуль 9. Урок 3: 5-уровневый фреймворк защиты от галлюцинаций ИИ\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Архитектура верификации кода AI (Zero Hallucination Protocol)\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"[1. Синтаксический уровень]   ─── Код выполняется без NameError, SyntaxError?\\n\",\n        \"             │\\n\",\n        \"[2. Размерность и типы]       ─── Не схлопнулись ли строки? Типы int/float/datetime корректны?\\n\",\n        \"             │\\n\",\n        \"[3. Бизнес-инварианты]        ─── Выручка >= 0? Конверсия <= 100%? Отток не отрицательный?\\n\",\n        \"             │\\n\",\n        \"[4. Сверка с бенчмарком]      ─── Сходится ли общая сумма выручки с официальным биллингом?\\n\",\n        \"             │\\n\",\n        \"[5. Краевые случаи (Edge)]    ─── Что произойдет при пустой таблице или делении на ноль?\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛡️ Модуль 9. Урок 3: 5-уровневый фреймворк защиты от галлюцинаций ИИ\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\n\n---\n\n## 1. Архитектура верификации кода AI (Zero Hallucination Protocol)\n\n```\n[1. Синтаксический уровень]   ─── Код выполняется без NameError, SyntaxError?\n             │\n[2. Размерность и типы]       ─── Не схлопнулись ли строки? Типы int/float/datetime корректны?\n             │\n[3. Бизнес-инварианты]        ─── Выручка >= 0? Конверсия <= 100%? Отток не отрицательный?\n             │\n[4. Сверка с бенчмарком]      ─── Сходится ли общая сумма выручки с официальным биллингом?\n             │\n[5. Краевые случаи (Edge)]    ─── Что произойдет при пустой таблице или делении на ноль?\n```\n"}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10. LLM API и неструктурированные данные", "category": "AI стек", "badge": "API", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API & Неструктурированные данные)\n\n---\n\n### Вопрос 1\nЗачем в аналитических пайплайнах обогащения данных использовать Structured Outputs (Pydantic / JSON Mode)?\n- [ ] Чтобы нейросеть писала более вежливые ответы.\n- [x] Чтобы модель гарантированно вернула валидный JSON строго заданной структуры с проверкой типов полей, исключая поломку ETL-пайплайна.\n- [ ] Чтобы снизить задержку сети.\n*Объяснение*: Structured Outputs принудительно направляет сэмплирование токенов согласно переданной JSON-схеме.\n\n---\n\n### Вопрос 2\nКакую температуру (`temperature`) следует указывать при вызове LLM для извлечения фактов и разметки тональности?\n- [ ] 1.5 (для максимального разнообразия).\n- [x] 0.0 (для максимальной детерминированности, воспроизводимости и строгого следования схеме).\n- [ ] 0.8.\n*Объяснение*: Для аналитических задач и классификации требуется нулевая случайность (greedy decoding).\n\n---\n\n### Вопрос 3\nСколько примерно стоит классификация 10 000 коротких отзывов клиентов через современные эффективные LLM (например, Gemini Flash / GPT-4o-mini)?\n- [ ] Около \\$500.\n- [x] Менее \\$1.00 (порядка 50-80 рублей).\n- [ ] Более \\$10 000.\n*Объяснение*: Цены на легковесные модели упали до \\$0.10–\\$0.15 за миллион токенов, делая автоматическую разметку текста невероятно дешевой.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔌 Модуль 10. Урок 1: Подключение и программный вызов LLM API из Python\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Универсальный интерфейс взаимодействия с LLM API\\n\",\n        \"\\n\",\n        \"Современные API (OpenAI, Anthropic, Gemini, DeepSeek) используют стандартизированный JSON-интерфейс:\\n\",\n        \"- `messages`: массив объектов с ролями `system`, `user`, `assistant`.\\n\",\n        \"- `temperature`: степень детерминированности ($0.0$ — максимальная точность для аналитики, $1.0$ — креативность).\\n\",\n        \"- `response_format`: принудительный возврат JSON объекта.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔌 Модуль 10. Урок 1: Подключение и программный вызов LLM API из Python\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\n\n---\n\n## 1. Универсальный интерфейс взаимодействия с LLM API\n\nСовременные API (OpenAI, Anthropic, Gemini, DeepSeek) используют стандартизированный JSON-интерфейс:\n- `messages`: массив объектов с ролями `system`, `user`, `assistant`.\n- `temperature`: степень детерминированности ($0.0$ — максимальная точность для аналитики, $1.0$ — креативность).\n- `response_format`: принудительный возврат JSON объекта.\n"}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📑 Модуль 10. Урок 2: Разметка неструктурированных отзывов и тикетов саппорта\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Реальный кейс: Автоматический аудит 800 жалоб клиентов e-commerce\\n\",\n        \"\\n\",\n        \"Работаем с реальным датасетом отзывов `customer_reviews.csv`.\\n\",\n        \"Извлекаем темы жалоб и тональность без ручного чтения.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"reviews = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customer_reviews.csv\\\")\\n\",\n        \"\\n\",\n        \"# Функция симуляции работы LLM по извлечению сущностей и тематик\\n\",\n        \"def analyze_review_with_llm(text: str) -> dict:\\n\",\n        \"    t = text.lower()\\n\",\n        \"    topics = []\\n\",\n        \"    if any(k in t for k in ['курьер', 'доставка', 'опоздал', 'доставили']):\\n\",\n        \"        topics.append('Логистика и доставка')\\n\",\n        \"    if any(k in t for k in ['списали', 'деньги', 'вернуть', 'цена', 'подписку']):\\n\",\n        \"        topics.append('Оплата и биллинг')\\n\",\n        \"    if any(k in t for k in ['баги', 'крашится', 'тормозит', 'crashes', 'не работает']):\\n\",\n        \"        topics.append('Баги приложения')\\n\",\n        \"    if any(k in t for k in ['поддержка', 'чат', 'саппорт', 'service']):\\n\",\n        \"        topics.append('Качество саппорта')\\n\",\n        \"        \\n\",\n        \"    return {\\n\",\n        \"        'topics': topics if topics else ['Прочее'],\\n\",\n        \"        'has_critical_issue': int(any(k in t for k in ['верните', 'претензию', 'списали', 'crashes']))\\n\",\n        \"    }\\n\",\n        \"\\n\",\n        \"# Применяем анализ к базе\\n\",\n        \"results = reviews['text'].apply(analyze_review_with_llm)\\n\",\n        \"reviews['topics'] = [r['topics'] for r in results]\\n\",\n        \"reviews['is_critical'] = [r['has_critical_issue'] for r in results]\\n\",\n        \"\\n\",\n        \"# Сводный отчет для операционного директора\\n\",\n        \"exploded = reviews.explode('topics')\\n\",\n        \"summary = exploded.groupby('topics').agg(\\n\",\n        \"    total_reviews=('review_id', 'count'),\\n\",\n        \"    critical_cases=('is_critical', 'sum')\\n\",\n        \").sort_values(by='critical_cases', ascending=False)\\n\",\n        \"\\n\",\n        \"print(\\\"=== РЕЗУЛЬТАТ АВТОМАТИЧЕСКОЙ КЛАССИФИКАЦИИ ЖАЛОБ ===\\\")\\n\",\n        \"print(summary)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📑 Модуль 10. Урок 2: Разметка неструктурированных отзывов и тикетов саппорта\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\n\n---\n\n## 1. Реальный кейс: Автоматический аудит 800 жалоб клиентов e-commerce\n\nРаботаем с реальным датасетом отзывов `customer_reviews.csv`.\nИзвлекаем темы жалоб и тональность без ручного чтения.\n"}, {"type": "code", "content": "import pandas as pd\n\nreviews = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\n\n# Функция симуляции работы LLM по извлечению сущностей и тематик\ndef analyze_review_with_llm(text: str) -> dict:\n    t = text.lower()\n    topics = []\n    if any(k in t for k in ['курьер', 'доставка', 'опоздал', 'доставили']):\n        topics.append('Логистика и доставка')\n    if any(k in t for k in ['списали', 'деньги', 'вернуть', 'цена', 'подписку']):\n        topics.append('Оплата и биллинг')\n    if any(k in t for k in ['баги', 'крашится', 'тормозит', 'crashes', 'не работает']):\n        topics.append('Баги приложения')\n    if any(k in t for k in ['поддержка', 'чат', 'саппорт', 'service']):\n        topics.append('Качество саппорта')\n        \n    return {\n        'topics': topics if topics else ['Прочее'],\n        'has_critical_issue': int(any(k in t for k in ['верните', 'претензию', 'списали', 'crashes']))\n    }\n\n# Применяем анализ к базе\nresults = reviews['text'].apply(analyze_review_with_llm)\nreviews['topics'] = [r['topics'] for r in results]\nreviews['is_critical'] = [r['has_critical_issue'] for r in results]\n\n# Сводный отчет для операционного директора\nexploded = reviews.explode('topics')\nsummary = exploded.groupby('topics').agg(\n    total_reviews=('review_id', 'count'),\n    critical_cases=('is_critical', 'sum')\n).sort_values(by='critical_cases', ascending=False)\n\nprint(\"=== РЕЗУЛЬТАТ АВТОМАТИЧЕСКОЙ КЛАССИФИКАЦИИ ЖАЛОБ ===\")\nprint(summary)\n"}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📦 Модуль 10. Урок 3: Structured Outputs и валидация через Pydantic\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Схема Pydantic для гарантированной типизации\\n\",\n        \"\\n\",\n        \"Никаких неструктурированных ответов от LLM в проде. Только жестко валидированный JSON:\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"from pydantic import BaseModel, Field\\n\",\n        \"from typing import List, Literal\\n\",\n        \"\\n\",\n        \"class FeedbackExtractionSchema(BaseModel):\\n\",\n        \"    sentiment: Literal['Positive', 'Negative', 'Neutral']\\n\",\n        \"    urgency_level: Literal['Low', 'Medium', 'High', 'Critical']\\n\",\n        \"    identified_categories: List[str]\\n\",\n        \"    satisfaction_score: int = Field(ge=1, le=5)\\n\",\n        \"\\n\",\n        \"# Демонстрация валидации\\n\",\n        \"valid_sample = {\\n\",\n        \"    \\\"sentiment\\\": \\\"Negative\\\",\\n\",\n        \"    \\\"urgency_level\\\": \\\"Critical\\\",\\n\",\n        \"    \\\"identified_categories\\\": [\\\"Billing\\\", \\\"Mobile App\\\"],\\n\",\n        \"    \\\"satisfaction_score\\\": 1\\n\",\n        \"}\\n\",\n        \"\\n\",\n        \"validated_obj = FeedbackExtractionSchema(**valid_sample)\\n\",\n        \"print(\\\" Схема валидна! Объект Pydantic готов к загрузке в БД:\\\")\\n\",\n        \"print(validated_obj.model_dump_json(indent=2))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📦 Модуль 10. Урок 3: Structured Outputs и валидация через Pydantic\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\n\n---\n\n## 1. Схема Pydantic для гарантированной типизации\n\nНикаких неструктурированных ответов от LLM в проде. Только жестко валидированный JSON:\n"}, {"type": "code", "content": "from pydantic import BaseModel, Field\nfrom typing import List, Literal\n\nclass FeedbackExtractionSchema(BaseModel):\n    sentiment: Literal['Positive', 'Negative', 'Neutral']\n    urgency_level: Literal['Low', 'Medium', 'High', 'Critical']\n    identified_categories: List[str]\n    satisfaction_score: int = Field(ge=1, le=5)\n\n# Демонстрация валидации\nvalid_sample = {\n    \"sentiment\": \"Negative\",\n    \"urgency_level\": \"Critical\",\n    \"identified_categories\": [\"Billing\", \"Mobile App\"],\n    \"satisfaction_score\": 1\n}\n\nvalidated_obj = FeedbackExtractionSchema(**valid_sample)\nprint(\" Схема валидна! Объект Pydantic готов к загрузке в БД:\")\nprint(validated_obj.model_dump_json(indent=2))\n"}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 💰 Модуль 10. Урок 4: Экономика токенов (Token Economics) и батчевая обработка\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Калькулятор стоимости пайплайна разметки данных\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Калькулятор стоимости обработки массива текстов через современные модели\\n\",\n        \"def estimate_llm_cost(num_documents, avg_words_per_doc, input_price_per_m=0.15, output_price_per_m=0.60):\\n\",\n        \"    # В среднем 1 слово = 1.3 токена\\n\",\n        \"    input_tokens = num_documents * (avg_words_per_doc * 1.3 + 100) # +100 токенов промпта\\n\",\n        \"    output_tokens = num_documents * 50 # JSON ответ около 50 токенов\\n\",\n        \"    \\n\",\n        \"    cost_in = (input_tokens / 1_000_000) * input_price_per_m\\n\",\n        \"    cost_out = (output_tokens / 1_000_000) * output_price_per_m\\n\",\n        \"    total = cost_in + cost_out\\n\",\n        \"    \\n\",\n        \"    print(f\\\"Обработка {num_documents:,} документов:\\\")\\n\",\n        \"    print(f\\\"- Входные токены : {input_tokens:,.0f} (${cost_in:.3f})\\\")\\n\",\n        \"    print(f\\\"- Выходные токены: {output_tokens:,.0f} (${cost_out:.3f})\\\")\\n\",\n        \"    print(f\\\"- ИТОГОВАЯ ЦЕНА  : ${total:.2f} (~{total * 95:.1f} руб)\\\")\\n\",\n        \"\\n\",\n        \"estimate_llm_cost(num_documents=50_000, avg_words_per_doc=40)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 💰 Модуль 10. Урок 4: Экономика токенов (Token Economics) и батчевая обработка\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\n\n---\n\n## 1. Калькулятор стоимости пайплайна разметки данных\n"}, {"type": "code", "content": "# Калькулятор стоимости обработки массива текстов через современные модели\ndef estimate_llm_cost(num_documents, avg_words_per_doc, input_price_per_m=0.15, output_price_per_m=0.60):\n    # В среднем 1 слово = 1.3 токена\n    input_tokens = num_documents * (avg_words_per_doc * 1.3 + 100) # +100 токенов промпта\n    output_tokens = num_documents * 50 # JSON ответ около 50 токенов\n    \n    cost_in = (input_tokens / 1_000_000) * input_price_per_m\n    cost_out = (output_tokens / 1_000_000) * output_price_per_m\n    total = cost_in + cost_out\n    \n    print(f\"Обработка {num_documents:,} документов:\")\n    print(f\"- Входные токены : {input_tokens:,.0f} (${cost_in:.3f})\")\n    print(f\"- Выходные токены: {output_tokens:,.0f} (${cost_out:.3f})\")\n    print(f\"- ИТОГОВАЯ ЦЕНА  : ${total:.2f} (~{total * 95:.1f} руб)\")\n\nestimate_llm_cost(num_documents=50_000, avg_words_per_doc=40)\n"}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11. RAG и векторные базы данных", "category": "AI стек", "badge": "RAG", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG & Векторные базы данных)\n\n---\n\n### Вопрос 1\nВ чем заключается главное преимущество архитектуры RAG перед файнтюнингом (дообучением) модели на данных компании?\n- [ ] RAG работает без использования электричества.\n- [x] RAG позволяет обращаться к постоянно обновляемым корпоративным документам в реальном времени без дорогостоящего переобучения нейросети и дает ссылки на точные источники.\n- [ ] RAG используется только для картинок.\n*Объяснение*: При изменении регламента или добавлении данных достаточно обновить индекс в векторной БД, не меняя веса модели.\n\n---\n\n### Вопрос 2\nЧто показывает косинусное сходство (Cosine Similarity) между двумя эмбеддингами?\n- [ ] Разницу в количестве букв в тексте.\n- [x] Косинус угла между векторами в многомерном пространстве (от 1.0 — полное совпадение смысла, до 0.0 — отсутствие семантической связи).\n- [ ] Скорость загрузки страницы.\n*Объяснение*: Чем ближе угол векторов к нулю (косинус к 1.0), тем ближе смысловое значение текстов.\n\n---\n\n### Вопрос 3\nКак RAG помогает масштабировать Text-to-SQL в компании с сотнями таблиц в базе данных?\n- [ ] Сжимает таблицы в zip-архив.\n- [x] Динамически находит по смыслу запроса только 2-4 релевантные таблицы и передает в контекст промпта только их схемы, не перегружая лимит контекста.\n- [ ] Удаляет старые таблицы из базы.\n*Объяснение*: Семантический поиск по метаданным оставляет в промпте только нужные фрагменты схемы.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🌐 Модуль 11. Урок 1: Векторные эмбеддинги и семантический поиск: Cosine Similarity\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Геометрия смыслов: Как компьютер понимает синонимы\\n\",\n        \"\\n\",\n        \"Традиционный поиск по базе ищет точное совпадение букв: `WHERE text LIKE '%отток%'`. Если пользователь спросил *«клиенты уходят»*, поиск ничего не найдет.\\n\",\n        \"**Векторный эмбеддинг** преобразует текст в многомерный вектор чисел ($d = 768$ или $1536$).\\n\",\n        \"Фразы со схожим смыслом имеют близкое направление векторов.\\n\",\n        \"\\n\",\n        \"Формула косинусного сходства (Cosine Similarity):\\n\",\n        \"$$\\\\cos(\\\\theta) = \\\\frac{\\\\mathbf{A} \\\\cdot \\\\mathbf{B}}{\\\\|\\\\mathbf{A}\\\\| \\\\|\\\\mathbf{B}\\\\|}$$\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Симуляция 3-мерного пространства смыслов\\n\",\n        \"# Ось 1: Продуктовые метрики, Ось 2: Негатив/Уход, Ось 3: Еда/Кухня\\n\",\n        \"emb_churn = np.array([0.9, 0.8, 0.05])       # \\\"Отток клиентов\\\"\\n\",\n        \"emb_leave = np.array([0.85, 0.82, 0.08])     # \\\"Пользователи закрывают подписку\\\"\\n\",\n        \"emb_burger = np.array([0.02, 0.1, 0.98])     # \\\"Чизбургер с картошкой\\\"\\n\",\n        \"\\n\",\n        \"def cosine_sim(v1, v2):\\n\",\n        \"    return np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2))\\n\",\n        \"\\n\",\n        \"print(f\\\"Сходство 'Отток' и 'Пользователи уходят': {cosine_sim(emb_churn, emb_leave):.4f} (Близкие синонимы!)\\\")\\n\",\n        \"print(f\\\"Сходство 'Отток' и 'Чизбургер'          : {cosine_sim(emb_churn, emb_burger):.4f} (Нет семантической связи)\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🌐 Модуль 11. Урок 1: Векторные эмбеддинги и семантический поиск: Cosine Similarity\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\n\n---\n\n## 1. Геометрия смыслов: Как компьютер понимает синонимы\n\nТрадиционный поиск по базе ищет точное совпадение букв: `WHERE text LIKE '%отток%'`. Если пользователь спросил *«клиенты уходят»*, поиск ничего не найдет.\n**Векторный эмбеддинг** преобразует текст в многомерный вектор чисел ($d = 768$ или $1536$).\nФразы со схожим смыслом имеют близкое направление векторов.\n\nФормула косинусного сходства (Cosine Similarity):\n$$\\cos(\\theta) = \\frac{\\mathbf{A} \\cdot \\mathbf{B}}{\\|\\mathbf{A}\\| \\|\\mathbf{B}\\|}$$\n"}, {"type": "code", "content": "import numpy as np\n\n# Симуляция 3-мерного пространства смыслов\n# Ось 1: Продуктовые метрики, Ось 2: Негатив/Уход, Ось 3: Еда/Кухня\nemb_churn = np.array([0.9, 0.8, 0.05])       # \"Отток клиентов\"\nemb_leave = np.array([0.85, 0.82, 0.08])     # \"Пользователи закрывают подписку\"\nemb_burger = np.array([0.02, 0.1, 0.98])     # \"Чизбургер с картошкой\"\n\ndef cosine_sim(v1, v2):\n    return np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2))\n\nprint(f\"Сходство 'Отток' и 'Пользователи уходят': {cosine_sim(emb_churn, emb_leave):.4f} (Близкие синонимы!)\")\nprint(f\"Сходство 'Отток' и 'Чизбургер'          : {cosine_sim(emb_churn, emb_burger):.4f} (Нет семантической связи)\")\n"}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🗄️ Модуль 11. Урок 2: Векторная база ChromaDB для базы знаний аналитика\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Индексация словаря корпоративных терминов и регламентов\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация локальной коллекции ChromaDB в памяти\\n\",\n        \"metrics_catalog = [\\n\",\n        \"    {\\\"id\\\": \\\"m1\\\", \\\"title\\\": \\\"LTV\\\", \\\"content\\\": \\\"Lifetime Value — общая чистая прибыль от пользователя за всю историю. Формула: ARPU * Lifetime.\\\"},\\n\",\n        \"    {\\\"id\\\": \\\"m2\\\", \\\"title\\\": \\\"Churn Rate\\\", \\\"content\\\": \\\"Процент ушедших клиентов за период: (Клиенты_конец - Новые) / Клиенты_начало.\\\"},\\n\",\n        \"    {\\\"id\\\": \\\"m3\\\", \\\"title\\\": \\\"CAC\\\", \\\"content\\\": \\\"Customer Acquisition Cost — стоимость привлечения платящего пользователя: Расходы / Новые_покупатели.\\\"},\\n\",\n        \"    {\\\"id\\\": \\\"m4\\\", \\\"title\\\": \\\"AOV\\\", \\\"content\\\": \\\"Average Order Value — средний чек: Общая выручка / Количество успешных заказов.\\\"}\\n\",\n        \"]\\n\",\n        \"\\n\",\n        \"print(\\\"БАЗА ЗНАНИЙ ДЛЯ ВЕКТОРНОГО ПОИСКА RAG ГОТОВА:\\\")\\n\",\n        \"for m in metrics_catalog:\\n\",\n        \"    print(f\\\"- [{m['title']}]: {m['content']}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🗄️ Модуль 11. Урок 2: Векторная база ChromaDB для базы знаний аналитика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\n\n---\n\n## 1. Индексация словаря корпоративных терминов и регламентов\n"}, {"type": "code", "content": "# Демонстрация локальной коллекции ChromaDB в памяти\nmetrics_catalog = [\n    {\"id\": \"m1\", \"title\": \"LTV\", \"content\": \"Lifetime Value — общая чистая прибыль от пользователя за всю историю. Формула: ARPU * Lifetime.\"},\n    {\"id\": \"m2\", \"title\": \"Churn Rate\", \"content\": \"Процент ушедших клиентов за период: (Клиенты_конец - Новые) / Клиенты_начало.\"},\n    {\"id\": \"m3\", \"title\": \"CAC\", \"content\": \"Customer Acquisition Cost — стоимость привлечения платящего пользователя: Расходы / Новые_покупатели.\"},\n    {\"id\": \"m4\", \"title\": \"AOV\", \"content\": \"Average Order Value — средний чек: Общая выручка / Количество успешных заказов.\"}\n]\n\nprint(\"БАЗА ЗНАНИЙ ДЛЯ ВЕКТОРНОГО ПОИСКА RAG ГОТОВА:\")\nfor m in metrics_catalog:\n    print(f\"- [{m['title']}]: {m['content']}\")\n"}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔄 Модуль 11. Урок 3: Сквозной пайплайн RAG (Chunking -> Retrieval -> Generation)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Схема работы RAG для отчетов компании\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"[Вопрос руководителя: \\\"Как мы рассчитываем LTV в B2B тарифах?\\\"]\\n\",\n        \"                               │\\n\",\n        \"            (Семантический поиск в векторной базе)\\n\",\n        \"                               │\\n\",\n        \"       [Найден релевантный фрагмент регламента №42]\\n\",\n        \"                               │\\n\",\n        \"               (Генерация ответа в LLM)\\n\",\n        \"      \\\"Ответь на вопрос, основываясь ИСКЛЮЧИТЕЛЬНО на документе №42\\\"\\n\",\n        \"                               │\\n\",\n        \"[Точный ответ без галлюцинаций с указанием источника и формулы]\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 11. Урок 3: Сквозной пайплайн RAG (Chunking -> Retrieval -> Generation)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\n\n---\n\n## 1. Схема работы RAG для отчетов компании\n\n```\n[Вопрос руководителя: \"Как мы рассчитываем LTV в B2B тарифах?\"]\n                               │\n            (Семантический поиск в векторной базе)\n                               │\n       [Найден релевантный фрагмент регламента №42]\n                               │\n               (Генерация ответа в LLM)\n      \"Ответь на вопрос, основываясь ИСКЛЮЧИТЕЛЬНО на документе №42\"\n                               │\n[Точный ответ без галлюцинаций с указанием источника и формулы]\n```\n"}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 💬 Модуль 11. Урок 4: Архитектура \\\"Умного BI-ассистента\\\" (Text-to-SQL + RAG)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Проблема больших корпоративных баз\\n\",\n        \"\\n\",\n        \"В реальном корпоративном Data Warehouse (DWH) могут быть 1 500 таблиц и 20 000 колонок.\\n\",\n        \"Их невозможно передать в промпт целиком.\\n\",\n        \"**Решение — RAG по метаданным**:\\n\",\n        \"1. В векторную базу индексируются описания таблиц и колонок.\\n\",\n        \"2. По запросу пользователя («Покажи топ продаж ноутбуков в Казани») векторный поиск находит только таблицы `products`, `orders`, `customers`.\\n\",\n        \"3. Модель получает схему только этих 3 таблиц и генерирует быстрый и точный SQL-запрос.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 💬 Модуль 11. Урок 4: Архитектура \"Умного BI-ассистента\" (Text-to-SQL + RAG)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\n\n---\n\n## 1. Проблема больших корпоративных баз\n\nВ реальном корпоративном Data Warehouse (DWH) могут быть 1 500 таблиц и 20 000 колонок.\nИх невозможно передать в промпт целиком.\n**Решение — RAG по метаданным**:\n1. В векторную базу индексируются описания таблиц и колонок.\n2. По запросу пользователя («Покажи топ продаж ноутбуков в Казани») векторный поиск находит только таблицы `products`, `orders`, `customers`.\n3. Модель получает схему только этих 3 таблиц и генерирует быстрый и точный SQL-запрос.\n"}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12. AI агенты и мониторинг качества", "category": "AI стек", "badge": "Агенты", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты & LLM Evaluation)\n\n---\n\n### Вопрос 1\nЧто лежит в основе паттерна ReAct для автономных агентов?\n- [ ] Однократный ответ без проверки.\n- [x] Цикл: рассуждение (Thought) -> выбор инструмента и действие (Action) -> наблюдение за результатом (Observation) -> корректировка дальнейших шагов.\n- [ ] Перезагрузка базы данных.\n*Объяснение*: ReAct позволяет агенту динамически адаптировать свой план при получении промежуточных данных.\n\n---\n\n### Вопрос 2\nЧто означает метрика Faithfulness во фреймворках тестирования LLM (Ragas / DeepEval)?\n- [ ] Скорость генерации ответа в токенах за секунду.\n- [x] Доля утверждений в сгенерированном ответе, которые строго подтверждаются контекстом переданных данных (отсутствие галлюцинаций).\n- [ ] Количество положительных отзывов пользователей.\n*Объяснение*: Faithfulness гарантирует, что ИИ не додумал цифры от себя.\n\n---\n\n### Вопрос 3\nКакую роль выполняет LLM-as-a-Judge в индустрии 2027 года?\n- [ ] Вынесение юридических приговоров.\n- [x] Использование сильной LLM для автоматической оценки качества, корректности и точности работы других прикладных моделей и пайплайнов на тестовых датасетах.\n- [ ] Блокировка спама.\n*Объяснение*: LLM-as-a-Judge масштабирует проверку качества аналитики без необходимости вручную вычитывать тысячи ответов.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🤖 Модуль 12. Урок 1: Архитектура автономных агентов: ReAct, Tools и Память\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Парадигма ReAct: Reasoning + Acting\\n\",\n        \"\\n\",\n        \"Агент — это не просто чат-бот, это программа с циклом принятия решений:\\n\",\n        \"1. **Thought**: Агент анализирует текущее состояние задачи.\\n\",\n        \"2. **Action**: Агент вызывает внешний инструмент (SQL-запрос, выполнение Python-кода, поиск в API).\\n\",\n        \"3. **Observation**: Агент получает результат вызова инструмента.\\n\",\n        \"4. **Reflection**: Агент оценивает, достигнута ли цель, и планирует следующий шаг.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 12. Урок 1: Архитектура автономных агентов: ReAct, Tools и Память\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\n\n---\n\n## 1. Парадигма ReAct: Reasoning + Acting\n\nАгент — это не просто чат-бот, это программа с циклом принятия решений:\n1. **Thought**: Агент анализирует текущее состояние задачи.\n2. **Action**: Агент вызывает внешний инструмент (SQL-запрос, выполнение Python-кода, поиск в API).\n3. **Observation**: Агент получает результат вызова инструмента.\n4. **Reflection**: Агент оценивает, достигнута ли цель, и планирует следующий шаг.\n"}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔗 Модуль 12. Урок 2: LangChain и LlamaIndex для автоматизации аналитических задач\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Создание агента с инструментом исполнения кода (Code Execution Tool)\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Пример архитектуры аналитического агента с Tool Registry\\n\",\n        \"class AnalyticsAgent:\\n\",\n        \"    def __init__(self):\\n\",\n        \"        self.tools = {\\n\",\n        \"            'query_sales': lambda cat: f\\\"Продажи категории {cat}: 1 450 000 руб, рост +12%\\\",\\n\",\n        \"            'check_inventory': lambda cat: f\\\"Остаток на складе для {cat}: 230 шт (норма)\\\",\\n\",\n        \"        }\\n\",\n        \"        \\n\",\n        \"    def run_goal(self, goal: str):\\n\",\n        \"        print(f\\\" Цель агента: '{goal}'\\\")\\n\",\n        \"        print(\\\" [Thought]: Для ответа на вопрос нужно проверить выручку и остатки на складе.\\\")\\n\",\n        \"        \\n\",\n        \"        # Вызов инструментов\\n\",\n        \"        res_sales = self.tools['query_sales']('Electronics')\\n\",\n        \"        print(f\\\" [Action]: query_sales('Electronics') -> {res_sales}\\\")\\n\",\n        \"        \\n\",\n        \"        res_stock = self.tools['check_inventory']('Electronics')\\n\",\n        \"        print(f\\\" [Action]: check_inventory('Electronics') -> {res_stock}\\\")\\n\",\n        \"        \\n\",\n        \"        print(\\\" [Final Answer]: Выручка категории Electronics в норме, дефицита на складе нет.\\\")\\n\",\n        \"\\n\",\n        \"agent = AnalyticsAgent()\\n\",\n        \"agent.run_goal(\\\"Проверь статус продаж электроники\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 12. Урок 2: LangChain и LlamaIndex для автоматизации аналитических задач\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\n\n---\n\n## 1. Создание агента с инструментом исполнения кода (Code Execution Tool)\n"}, {"type": "code", "content": "# Пример архитектуры аналитического агента с Tool Registry\nclass AnalyticsAgent:\n    def __init__(self):\n        self.tools = {\n            'query_sales': lambda cat: f\"Продажи категории {cat}: 1 450 000 руб, рост +12%\",\n            'check_inventory': lambda cat: f\"Остаток на складе для {cat}: 230 шт (норма)\",\n        }\n        \n    def run_goal(self, goal: str):\n        print(f\" Цель агента: '{goal}'\")\n        print(\" [Thought]: Для ответа на вопрос нужно проверить выручку и остатки на складе.\")\n        \n        # Вызов инструментов\n        res_sales = self.tools['query_sales']('Electronics')\n        print(f\" [Action]: query_sales('Electronics') -> {res_sales}\")\n        \n        res_stock = self.tools['check_inventory']('Electronics')\n        print(f\" [Action]: check_inventory('Electronics') -> {res_stock}\")\n        \n        print(\" [Final Answer]: Выручка категории Electronics в норме, дефицита на складе нет.\")\n\nagent = AnalyticsAgent()\nagent.run_goal(\"Проверь статус продаж электроники\")\n"}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔄 Модуль 12. Урок 3: Автономный агент регулярного мониторинга витрин данных\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Сценарий: Утренний алерт-агент в Telegram/Slack\\n\",\n        \"\\n\",\n        \"Каждое утро в 08:30 агент:\\n\",\n        \"1. Запускает SQL-запрос за вчерашний день.\\n\",\n        \"2. Сравнивает выручку с 30-дневной скользящей медианой.\\n\",\n        \"3. Если зафиксировано отклонение более $2.5\\\\sigma$, агент формирует факторный анализ причин и отправляет алерт команде.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 12. Урок 3: Автономный агент регулярного мониторинга витрин данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\n\n---\n\n## 1. Сценарий: Утренний алерт-агент в Telegram/Slack\n\nКаждое утро в 08:30 агент:\n1. Запускает SQL-запрос за вчерашний день.\n2. Сравнивает выручку с 30-дневной скользящей медианой.\n3. Если зафиксировано отклонение более $2.5\\sigma$, агент формирует факторный анализ причин и отправляет алерт команде.\n"}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 12. Урок 4: LLM Evaluation: Оценка качества генерации (Ragas, DeepEval)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Ключевые метрики LLM Evaluation в вакансиях 2027\\n\",\n        \"\\n\",\n        \"- **Faithfulness (Фактологическая верность)**: Процент фактов в ответе, которые строго подтверждаются переданными данными (защита от галлюцинаций).\\n\",\n        \"- **Answer Relevance (Релевантность)**: Соответствует ли сгенерированный инсайт исходному вопросу стейкхолдера.\\n\",\n        \"- **Context Precision / Recall**: Насколько точно векторный поиск извлек нужные таблицы.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 12. Урок 4: LLM Evaluation: Оценка качества генерации (Ragas, DeepEval)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\n\n---\n\n## 1. Ключевые метрики LLM Evaluation в вакансиях 2027\n\n- **Faithfulness (Фактологическая верность)**: Процент фактов в ответе, которые строго подтверждаются переданными данными (защита от галлюцинаций).\n- **Answer Relevance (Релевантность)**: Соответствует ли сгенерированный инсайт исходному вопросу стейкхолдера.\n- **Context Precision / Recall**: Насколько точно векторный поиск извлек нужные таблицы.\n"}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13. Soft Skills и Data Storytelling", "category": "Бизнес", "badge": "Soft Skills", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n---\n\n### Вопрос 1\nКакое отношение LTV / CAC считается эталонным стандартом для устойчивого масштабирования бизнеса?\n- [ ] Ровно 1.0x (работа в ноль).\n- [x] От 3.0x и выше при сроке окупаемости (Payback) до 12 месяцев.\n- [ ] Менее 0.5x.\n*Объяснение*: Соотношение $\\ge 3$ компенсирует операционные расходы, налоги и оставляет чистую прибыль на развитие.\n\n---\n\n### Вопрос 2\nВ чем заключается принцип Пирамиды Минто при защите отчета перед топ-менеджментом?\n- [ ] Начинать презентацию с подробного описания процесса парсинга и очистки данных.\n- [x] Начинать сразу с ключевого вывода и рекомендуемого решения (Answer First), а затем подкреплять его аргументами и цифрами.\n- [ ] Не показывать цифры вообще.\n*Объяснение*: Руководители принимают решения; им в первую очередь нужен ответ на вопрос: «Что делать и какой экономический эффект?».\n\n---\n\n### Вопрос 3\nЧто такое Problem Framing в работе аналитика?\n- [ ] Оформление дашборда в корпоративные рамки.\n- [x] Процесс перевода абстрактной жалобы или идеи бизнеса в строго проверяемую систему метрик, гипотез и аналитических задач.\n- [ ] Установка Python библиотек.\n*Объяснение*: Problem Framing гарантирует, что аналитик решает настоящую корневую проблему, а не симптомы.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 💼 Модуль 13. Урок 1: Юнит-экономика: LTV, CAC, Retention, Churn и Payback Period\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Фундаментальные законы юнит-экономики\\n\",\n        \"\\n\",\n        \"- **CAC (Customer Acquisition Cost)**: $\\\\text{CAC} = \\\\frac{\\\\text{Маркетинговые расходы}}{\\\\text{Число новых клиентов}}$.\\n\",\n        \"- **LTV (Lifetime Value)**: $\\\\text{LTV} = \\\\text{ARPU} \\\\times \\\\text{Lifetime} = \\\\frac{\\\\text{ARPU}}{\\\\text{Monthly Churn}}$.\\n\",\n        \"- **Золотое правило масштабирования**:\\n\",\n        \"  $$\\\\frac{\\\\text{LTV}}{\\\\text{CAC}} \\\\ge 3.0$$\\n\",\n        \"  - Если $< 1.0$: Бизнес сжигает деньги на каждом привлеченном юзере.\\n\",\n        \"  - Если $1.0 - 2.9$: Бизнес неустойчив, маржа съедается накладными расходами.\\n\",\n        \"  - Если $\\\\ge 3.0$: Здоровая машина роста.\\n\",\n        \"  - Если $> 6.0$: Компания недоинвестирует в маркетинг и медленно захватывает рынок.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Калькулятор финансовой устойчивости компании\\n\",\n        \"def audit_unit_economics(cac, arpu, monthly_churn):\\n\",\n        \"    ltv = arpu / monthly_churn if monthly_churn > 0 else 0\\n\",\n        \"    ratio = ltv / cac if cac > 0 else 0\\n\",\n        \"    payback_months = cac / arpu if arpu > 0 else 0\\n\",\n        \"    \\n\",\n        \"    print(\\\"=== АУДИТ ЮНИТ-ЭКОНОМИКИ ДЛЯ ИНВЕСТОРОВ ===\\\")\\n\",\n        \"    print(f\\\"CAC (Стоимость привлечения) : {cac:,.0f} руб\\\")\\n\",\n        \"    print(f\\\"LTV (Жизненный цикл клиента): {ltv:,.0f} руб\\\")\\n\",\n        \"    print(f\\\"LTV / CAC Ratio             : {ratio:.2f}x\\\")\\n\",\n        \"    print(f\\\"Срок окупаемости (Payback)  : {payback_months:.1f} мес\\\")\\n\",\n        \"    \\n\",\n        \"    if ratio >= 3.0 and payback_months <= 12:\\n\",\n        \"        print(\\\" ВЕРДИКТ: Бизнес масштабируем! Инвестиции рекомендуются.\\\")\\n\",\n        \"    else:\\n\",\n        \"        print(\\\" ВЕРДИКТ: Бизнес сжигает деньги или окупается слишком долго. Требуется оптимизация оттока.\\\")\\n\",\n        \"\\n\",\n        \"audit_unit_economics(cac=3500, arpu=950, monthly_churn=0.06)\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 💼 Модуль 13. Урок 1: Юнит-экономика: LTV, CAC, Retention, Churn и Payback Period\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\n\n---\n\n## 1. Фундаментальные законы юнит-экономики\n\n- **CAC (Customer Acquisition Cost)**: $\\text{CAC} = \\frac{\\text{Маркетинговые расходы}}{\\text{Число новых клиентов}}$.\n- **LTV (Lifetime Value)**: $\\text{LTV} = \\text{ARPU} \\times \\text{Lifetime} = \\frac{\\text{ARPU}}{\\text{Monthly Churn}}$.\n- **Золотое правило масштабирования**:\n  $$\\frac{\\text{LTV}}{\\text{CAC}} \\ge 3.0$$\n  - Если $< 1.0$: Бизнес сжигает деньги на каждом привлеченном юзере.\n  - Если $1.0 - 2.9$: Бизнес неустойчив, маржа съедается накладными расходами.\n  - Если $\\ge 3.0$: Здоровая машина роста.\n  - Если $> 6.0$: Компания недоинвестирует в маркетинг и медленно захватывает рынок.\n"}, {"type": "code", "content": "# Калькулятор финансовой устойчивости компании\ndef audit_unit_economics(cac, arpu, monthly_churn):\n    ltv = arpu / monthly_churn if monthly_churn > 0 else 0\n    ratio = ltv / cac if cac > 0 else 0\n    payback_months = cac / arpu if arpu > 0 else 0\n    \n    print(\"=== АУДИТ ЮНИТ-ЭКОНОМИКИ ДЛЯ ИНВЕСТОРОВ ===\")\n    print(f\"CAC (Стоимость привлечения) : {cac:,.0f} руб\")\n    print(f\"LTV (Жизненный цикл клиента): {ltv:,.0f} руб\")\n    print(f\"LTV / CAC Ratio             : {ratio:.2f}x\")\n    print(f\"Срок окупаемости (Payback)  : {payback_months:.1f} мес\")\n    \n    if ratio >= 3.0 and payback_months <= 12:\n        print(\" ВЕРДИКТ: Бизнес масштабируем! Инвестиции рекомендуются.\")\n    else:\n        print(\" ВЕРДИКТ: Бизнес сжигает деньги или окупается слишком долго. Требуется оптимизация оттока.\")\n\naudit_unit_economics(cac=3500, arpu=950, monthly_churn=0.06)\n"}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🎯 Модуль 13. Урок 2: Problem Framing: Перевод абстрактных болей бизнеса в ТЗ\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Фреймворк декомпозиции боли бизнеса\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"[Боль бизнеса: \\\"У нас дорожают лиды, продажи буксуют!\\\"]\\n\",\n        \"                         │\\n\",\n        \"        (Вопрос аналитика: \\\"Что является узким горлышком?\\\")\\n\",\n        \"                         │\\n\",\n        \"      ┌──────────────────┴──────────────────┐\\n\",\n        \"[Метрика Top-of-Funnel]              [Метрика Middle-of-Funnel]\\n\",\n        \"CAC вырос на 20%?                    Конверсия из заявки в оплату упала?\\n\",\n        \"      │                                     │\\n\",\n        \"(Смотрим каналы)                     (Смотрим работу отдела продаж)\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🎯 Модуль 13. Урок 2: Problem Framing: Перевод абстрактных болей бизнеса в ТЗ\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\n\n---\n\n## 1. Фреймворк декомпозиции боли бизнеса\n\n```\n[Боль бизнеса: \"У нас дорожают лиды, продажи буксуют!\"]\n                         │\n        (Вопрос аналитика: \"Что является узким горлышком?\")\n                         │\n      ┌──────────────────┴──────────────────┐\n[Метрика Top-of-Funnel]              [Метрика Middle-of-Funnel]\nCAC вырос на 20%?                    Конверсия из заявки в оплату упала?\n      │                                     │\n(Смотрим каналы)                     (Смотрим работу отдела продаж)\n```\n"}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🏛️ Модуль 13. Урок 3: Пирамида Минто: Как презентовать выводы Совету Директоров\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Принцип Top-Down коммуникации (Answer First)\\n\",\n        \"\\n\",\n        \"У топ-менеджеров нет времени слушать 40 минут о том, как вы чистили пропуски в Pandas.\\n\",\n        \"**Структура Минто**:\\n\",\n        \"1. **Главный вывод / Решение (The Core Recommendation)**: Сразу в первом предложении («Нужно остановить рекламу в канале Яндекс.Директ для категории Дом и сэкономить 4.2 млн руб в квартал»).\\n\",\n        \"2. **Ключевые аргументы (Key Drivers)**: Три доказательства (CAC вырос в 3 раза, окупаемость > 24 месяцев, LTV/CAC = 0.7).\\n\",\n        \"3. **Факты и цифры (Data Support)**: Графики когорт и таблицы (в приложении / по запросу).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🏛️ Модуль 13. Урок 3: Пирамида Минто: Как презентовать выводы Совету Директоров\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\n\n---\n\n## 1. Принцип Top-Down коммуникации (Answer First)\n\nУ топ-менеджеров нет времени слушать 40 минут о том, как вы чистили пропуски в Pandas.\n**Структура Минто**:\n1. **Главный вывод / Решение (The Core Recommendation)**: Сразу в первом предложении («Нужно остановить рекламу в канале Яндекс.Директ для категории Дом и сэкономить 4.2 млн руб в квартал»).\n2. **Ключевые аргументы (Key Drivers)**: Три доказательства (CAC вырос в 3 раза, окупаемость > 24 месяцев, LTV/CAC = 0.7).\n3. **Факты и цифры (Data Support)**: Графики когорт и таблицы (в приложении / по запросу).\n"}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📖 Модуль 13. Урок 4: Сквозной кейс: От скучной таблицы к бизнес-эффекту на 10 млн рублей\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Как превратить данные в действие\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📖 Модуль 13. Урок 4: Сквозной кейс: От скучной таблицы к бизнес-эффекту на 10 млн рублей\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\n\n---\n\n## 1. Как превратить данные в действие\n"}]}]}, {"id": "module_14_portfolio_project_1", "title": "Проект 1. E Commerce 360 аудит", "category": "Портфолио", "badge": "Проект", "readme": "# 🛒 Портфолио-проект 1: Сквозная E-Commerce аналитика 360°\n\n## 📌 Описание проекта\nПолноценный аудит интернет-магазина на основе реальной базы заказов (15 000+ позиций, база `ecommerce.db`):\n1. **SQL Витрина**: Расчет LTV, среднего чека, маржинальности.\n2. **Pandas & Python**: Когортный анализ удержания (Retention Rate Matrix) и RFM-сегментация клиентов.\n3. **Looker Studio**: Создание интерактивного дашборда для коммерческого директора.\n4. **Бизнес-отчет**: Аналитическая записка с точками роста выручки.\n\n## 📁 Файлы\n- `project_1_ecommerce_analytics.ipynb` — Полный рабочий ноутбук выполнения проекта от SQL до визуализации.\n", "quiz": "# 🧠 Quiz: Защита Проекта 1 (E-Commerce 360°)\n\n---\n\n### Вопрос 1\nЧто показывает RFM-сегментация клиентской базы?\n- [ ] Скорость загрузки карточек товаров на сайте.\n- [x] Сегментацию клиентов по трем измерениям: давность последней покупки (Recency), частота заказов (Frequency) и общая сумма затрат (Monetary).\n- [ ] Ошибки в артикулах товаров на складе.\n*Объяснение*: RFM позволяет точечно адресовать маркетинг: удерживать VIP-клиентов и реактивировать уходящих.\n\n---\n\n### Вопрос 2\nКакое главное действие должен предпринять отдел маркетинга для сегмента «At Risk» (высокая частота в прошлом, но давно не покупали)?\n- [ ] Не беспокоить их, чтобы не раздражать.\n- [x] Запустить персональную триггерную реактивацию со скидкой или бонусами, пока клиент окончательно не ушел к конкурентам.\n- [ ] Удалить их контакты из базы.\n*Объяснение*: Клиенты «At Risk» уже знакомы с брендом и имеют высокий LTV; их реактивация гораздо дешевле привлечения нового холодного трафика.\n", "cheatsheet": "", "notebooks": [{"filename": "project_1_ecommerce_analytics.ipynb", "rel_path": "course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🛒 Выпускной проект 1: Сквозной аудит интернет-магазина (E-Commerce 360°)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 📌 Паспорт проекта\\n\",\n        \"- **Бизнес-заказчик**: Коммерческий директор маркетплейса.\\n\",\n        \"- **Источник данных**: Реальная база транзакций `ecommerce.db` (2 282 заказа, 1 200 клиентов, 3 734 товарных позиции).\\n\",\n        \"- **Стек**: SQL (SQLite/PostgreSQL), Python (Pandas, Seaborn), Looker Studio.\\n\",\n        \"- **Цель**: Выявить причины падения повторных продаж, провести RFM-сегментацию и подготовить витрину для BI-дашборда.\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## Шаг 1: SQL-аналитика когорт и жизненного цикла\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import seaborn as sns\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"# 1. SQL-запрос для построения RFM витрины\\n\",\n        \"query_rfm = \\\"\\\"\\\"\\n\",\n        \"WITH customer_orders AS (\\n\",\n        \"    SELECT \\n\",\n        \"        c.customer_id,\\n\",\n        \"        c.city,\\n\",\n        \"        c.acquisition_channel,\\n\",\n        \"        MAX(o.order_date) AS last_order,\\n\",\n        \"        COUNT(DISTINCT o.order_id) AS frequency,\\n\",\n        \"        ROUND(SUM(oi.total_amount), 2) AS monetary\\n\",\n        \"    FROM customers c\\n\",\n        \"    JOIN orders o ON c.customer_id = o.customer_id\\n\",\n        \"    JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"    WHERE o.status = 'Completed'\\n\",\n        \"    GROUP BY c.customer_id\\n\",\n        \")\\n\",\n        \"SELECT * FROM customer_orders;\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"rfm = pd.read_sql(query_rfm, conn)\\n\",\n        \"rfm['last_order'] = pd.to_datetime(rfm['last_order'])\\n\",\n        \"now = pd.to_datetime('2026-10-01')\\n\",\n        \"rfm['recency_days'] = (now - rfm['last_order']).dt.days\\n\",\n        \"\\n\",\n        \"# Расчет RFM-баллов (1-4)\\n\",\n        \"rfm['R'] = pd.qcut(rfm['recency_days'], q=4, labels=[4, 3, 2, 1])\\n\",\n        \"rfm['F'] = pd.qcut(rfm['frequency'].rank(method='first'), q=4, labels=[1, 2, 3, 4])\\n\",\n        \"rfm['M'] = pd.qcut(rfm['monetary'], q=4, labels=[1, 2, 3, 4])\\n\",\n        \"\\n\",\n        \"# Сегментация\\n\",\n        \"def segment_customer(row):\\n\",\n        \"    r, f = int(row['R']), int(row['F'])\\n\",\n        \"    if r >= 3 and f >= 3:\\n\",\n        \"        return 'Champions (VIP)'\\n\",\n        \"    elif r >= 3 and f < 3:\\n\",\n        \"        return 'New Potential'\\n\",\n        \"    elif r < 2 and f >= 3:\\n\",\n        \"        return 'At Risk (Уходящие лояльные)'\\n\",\n        \"    else:\\n\",\n        \"        return 'Lost (Уснувшие)'\\n\",\n        \"\\n\",\n        \"rfm['Segment'] = rfm.apply(segment_customer, axis=1)\\n\",\n        \"\\n\",\n        \"print(\\\"=== РЕЗУЛЬТАТ RFM-СЕГМЕНТАЦИИ КЛИЕНТСКОЙ БАЗЫ ===\\\")\\n\",\n        \"print(rfm['Segment'].value_counts())\\n\",\n        \"print(\\\"\\\\nСредний чек по сегментам:\\\")\\n\",\n        \"print(rfm.groupby('Segment')['monetary'].agg(['count', 'mean', 'sum']).round(1))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛒 Выпускной проект 1: Сквозной аудит интернет-магазина (E-Commerce 360°)\n\n[![Open In Col
