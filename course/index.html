', linewidth=0.6)\nrects2 = ax1.bar(x + width/2, df_agg['total_profit'] / 1000, width, label='Чистая прибыль ($k)', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax1.set_title(\"Выручка и прибыль по категориям ($ тыс.)\", fontsize=11, fontweight='bold')\nax1.set_xticks(x)\nax1.set_xticklabels(df_agg['category'], rotation=15, ha='right')\nax1.legend(frameon=True, facecolor='#ffffff')\nax1.set_ylabel(\"Сумма ($ тыс.)\")\n\nfor r in rects1:\n    h = r.get_height()\n    ax1.annotate(f\"${h:.0f}k\", xy=(r.get_x() + r.get_width()/2, h), xytext=(0, 3),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=9, fontweight='bold')\n\nfor r in rects2:\n    h = r.get_height()\n    ax1.annotate(f\"${h:.0f}k\", xy=(r.get_x() + r.get_width()/2, h), xytext=(0, 3),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=9, fontweight='bold', color='#1b7e3b')\n\n# Панель 2: Процент маржинальности\nbars = ax2.barh(df_agg['category'], df_agg['margin_pct'], color=WARNING, edgecolor='#333333', linewidth=0.6)\nax2.set_title(\"Рентабельность категорий (Gross Margin %)\", fontsize=11, fontweight='bold')\nax2.set_xlabel(\"Маржа (%)\")\nax2.set_xlim(0, 60)\n\nfor b in bars:\n    w = b.get_width()\n    ax2.annotate(f\"{w:.1f}%\", xy=(w, b.get_y() + b.get_height()/2), xytext=(5, 0),\n                 textcoords=\"offset points\", ha='left', va='center', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск постоянных клиентов (Repeat Buyers)\nНайдите клиентов, которые совершили более 2 завершенных заказов (`status = 'Completed'`). Выведите их `customer_id` и количество заказов `orders_count`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_repeat = \"\"\"\nSELECT \n    customer_id,\n    COUNT(order_id) as orders_count\nFROM orders\nWHERE status = 'Completed'\nGROUP BY customer_id\nHAVING COUNT(order_id) > 2\nORDER BY orders_count DESC;\n\"\"\"\n\ndf_repeat = pd.read_sql_query(query_repeat, conn)\nprint(f\"Всего постоянных покупателей (>2 заказов): {len(df_repeat)}\")\ndisplay(df_repeat.head(6))\n\nassert not df_repeat.empty, \"Список повторных покупателей не должен быть пустым\"\nassert (df_repeat['orders_count'] > 2).all(), \"Все клиенты должны иметь более 2 заказов\"\nprint(\"✅ Тест успешно пройден: агрегация и фильтрация HAVING работают корректно!\")"}, {"type": "markdown", "content": "### 💡 Executive Takeaway: Оптимизация GROUP BY\n1. СУБД выполняет `GROUP BY` через хэширование или сортировку. Чем меньше строк доходит до группировки, тем быстрее работает запрос.\n2. Всегда переносите фильтры по неагрегированным полям в блок `WHERE`, не допуская их попадания в `HAVING`."}]}, {"filename": "lesson_03_joins_deep_dive.ipynb", "rel_path": "course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 3. Глубокое погружение в JOIN: исключение дубликатов и декартова произведения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_03_joins_deep_dive.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСвязывание таблиц (`INNER`, `LEFT`, `RIGHT`, `FULL OUTER JOIN`) — ежедневная задача аналитика.\nСамая опасная ошибка — возникновение **Fan-out (раздувания строк)** при объединении таблиц с отношением \"многие-ко-многим\". Если у клиента несколько заказов и несколько обращений в поддержку, некорректный JOIN перемножит строки (Cartesian Product), завысив выручку в разы!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nИсследуем конверсию базы зарегистрированных клиентов в реальных покупателей:\n- Клиенты с 0 заказов (зарегистрировались, но не купили)\n- Клиенты с 1 заказом (разовая покупка)\n- Повторные покупатели (2+ заказов)"}, {"type": "code", "content": "# Демонстрация: LEFT JOIN для анализа активности всех пользователей\nquery_join = \"\"\"\nSELECT \n    c.customer_id,\n    c.acquisition_channel,\n    c.city,\n    COUNT(o.order_id) as total_orders,\n    COALESCE(SUM(oi.total_amount), 0) as total_spent\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id AND o.status = 'Completed'\nLEFT JOIN order_items oi ON o.order_id = oi.order_id\nGROUP BY c.customer_id, c.acquisition_channel, c.city;\n\"\"\"\ndf_customer_lifecycle = pd.read_sql_query(query_join, conn)\nprint(f\"Всего клиентов в базе: {len(df_customer_lifecycle)}\")\ndisplay(df_customer_lifecycle.head(6))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Жизненный цикл клиентов по каналам\nСравним каналы по качеству привлекаемой аудитории: какая доля пользователей застревает на стадии 0 заказов, а какая конвертируется в лояльных клиентов."}, {"type": "code", "content": "# Классификация жизненного цикла клиентов\ndef classify_user(orders):\n    if orders == 0:\n        return '0 заказов (Zero Buyers)'\n    elif orders == 1:\n        return '1 заказ (One-time)'\n    else:\n        return '2+ заказов (Repeat Buyers)'\n\ndf_customer_lifecycle['segment'] = df_customer_lifecycle['total_orders'].apply(classify_user)\n\nseg_channel = df_customer_lifecycle.groupby(['acquisition_channel', 'segment']).size().unstack(fill_value=0)\nseg_channel_pct = seg_channel.div(seg_channel.sum(axis=1), axis=0) * 100\n\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\ncolors = [ALERT, WARNING, SUCCESS]\n\nseg_channel_pct.plot(kind='bar', stacked=True, color=colors, ax=ax, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Конверсионная зрелость каналов привлечения (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Доля пользователей в канале (%)\", fontsize=11)\nax.set_xlabel(\"Канал привлечения\", fontsize=11)\nax.set_xticklabels(seg_channel_pct.index, rotation=15, ha='right')\nax.legend(title=\"Сегмент активности\", bbox_to_anchor=(1.02, 1), loc='upper left', frameon=True)\n\nfor c in ax.containers:\n    labels = [f\"{v:.0f}%\" if v > 8 else \"\" for v in c.datavalues]\n    ax.bar_label(c, labels=labels, label_type='center', color='white', fontweight='bold', fontsize=9)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск клиентов без заказов\nИспользуя `LEFT JOIN`, найдите клиентов, которые ни разу не оформили ни одного заказа (где `order_id IS NULL`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_no_orders = \"\"\"\nSELECT \n    c.customer_id,\n    c.first_name,\n    c.city,\n    c.acquisition_channel\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id\nWHERE o.order_id IS NULL;\n\"\"\"\n\ndf_no_orders = pd.read_sql_query(query_no_orders, conn)\nprint(f\"Клиентов без совершенных заказов: {len(df_no_orders)}\")\ndisplay(df_no_orders.head(5))\n\nassert not df_no_orders.empty, \"Должны быть клиенты без заказов\"\nprint(\"✅ Тест успешно пройден: LEFT JOIN с отбором NULL строк работает безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Архитектурный закон JOIN\n1. Если при `LEFT JOIN` количество строк результирующей таблицы превысило размер левой таблицы, значит в правой таблице ключ объединения **не уникален** (связь «один-ко-многим»).\n2. Для расчета денежных метрик всегда агрегируйте дочернюю таблицу перед объединением или используйте `COUNT(DISTINCT ...)`, чтобы не завысить выручку."}]}, {"filename": "lesson_04_subqueries_and_cte.ipynb", "rel_path": "course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 4. Подзапросы и Common Table Expressions (CTE): читаемый модульный SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСложные аналитические пайплайны требуют многоэтапной обработки данных.\nВложенные подзапросы (Subqueries) создают «код-спагетти», который невозможно отлаживать и поддерживать.\nИндустриальный стандарт современной аналитики (SQL Style Guide dbt/GitLab) предписывает использование **Common Table Expressions (CTE)** с конструкцией `WITH ... AS (...)`.\nЭто делает код модульным, самодокументируемым и легко переносимым в дашборды и dbt-модели."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПостроим промышленный 3-этапный CTE для RFM-сегментации клиентов:\n1. `customer_spend`: агрегация совокупной выручки и частоты заказов\n2. `customer_stats`: расчет квантилей и средних бенчмарков\n3. `rfm_segmented`: присвоение бизнес-статуса (VIP, Regular, Low Value)"}, {"type": "code", "content": "# Демонстрация: Модульный CTE для сегментации клиентов\nquery_cte = \"\"\"\nWITH customer_orders AS (\n    SELECT \n        o.customer_id,\n        COUNT(DISTINCT o.order_id) as total_orders,\n        SUM(oi.total_amount) as monetary_value,\n        MAX(o.order_date) as last_order_date\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY o.customer_id\n),\ncustomer_segments AS (\n    SELECT \n        customer_id,\n        total_orders,\n        ROUND(monetary_value, 2) as monetary_value,\n        ROUND(monetary_value / total_orders, 2) as aov,\n        CASE \n            WHEN monetary_value >= 5000 AND total_orders >= 3 THEN '👑 VIP Champions'\n            WHEN monetary_value >= 2500 THEN '💎 High Value'\n            WHEN total_orders >= 2 THEN '🔄 Loyal Repeats'\n            ELSE '🌱 One-time Entry'\n        END as customer_tier\n    FROM customer_orders\n)\nSELECT \n    customer_tier,\n    COUNT(*) as customer_count,\n    ROUND(SUM(monetary_value), 2) as total_tier_revenue,\n    ROUND(AVG(aov), 2) as avg_tier_aov\nFROM customer_segments\nGROUP BY customer_tier\nORDER BY total_tier_revenue DESC;\n\"\"\"\ndf_cte_summary = pd.read_sql_query(query_cte, conn)\ndisplay(df_cte_summary)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: RFM-сегменты и вклад в совокупную выручку\nВизуализируем правило Парето: какая доля клиентов генерирует основную прибыль бизнеса."}, {"type": "code", "content": "# Построение 2-панельного чарта: Клиенты vs Выручка по тирам\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 5), dpi=110)\n\npalette = [PRIMARY, SUCCESS, WARNING, SECONDARY]\n\n# Панель 1: Доля пользователей в сегментах\nax1.pie(df_cte_summary['customer_count'], \n        labels=df_cte_summary['customer_tier'], \n        autopct='%1.1f%%', \n        colors=palette, \n        startangle=140, \n        wedgeprops=dict(edgecolor='#333333', linewidth=0.6))\nax1.set_title(\"Распределение клиентской базы по тирам\", fontsize=11, fontweight='bold')\n\n# Панель 2: Сгенерированная выручка ($ тыс.)\nbars = ax2.barh(df_cte_summary['customer_tier'], df_cte_summary['total_tier_revenue'] / 1000, \n                color=palette, edgecolor='#333333', linewidth=0.6)\nax2.set_title(\"Совокупная выручка по сегментам ($ тыс.)\", fontsize=11, fontweight='bold')\nax2.set_xlabel(\"Выручка ($ тыс.)\")\n\nfor b in bars:\n    w = b.get_width()\n    ax2.annotate(f\"${w:.1f}k\", xy=(w, b.get_y() + b.get_height()/2), xytext=(5, 0),\n                 textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: CTE для поиска первого и последнего заказа\nНапишите модульный запрос с CTE, находящим дату первого (`first_order`) и последнего (`last_order`) заказа для каждого клиента со статусом `Completed`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_first_last = \"\"\"\nWITH client_bounds AS (\n    SELECT \n        customer_id,\n        MIN(order_date) as first_order,\n        MAX(order_date) as last_order,\n        COUNT(order_id) as total_completed_orders\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n)\nSELECT \n    customer_id,\n    first_order,\n    last_order,\n    total_completed_orders\nFROM client_bounds\nWHERE total_completed_orders >= 2\nORDER BY total_completed_orders DESC\nLIMIT 10;\n\"\"\"\n\ndf_bounds = pd.read_sql_query(query_first_last, conn)\ndisplay(df_bounds.head(5))\n\nassert not df_bounds.empty, \"Результат не должен быть пустым\"\nassert (df_bounds['first_order'] <= df_bounds['last_order']).all(), \"Дата первого заказа не может быть позже последнего\"\nprint(\"✅ Тест успешно пройден: CTE отработал корректно и логично!\")"}, {"type": "markdown", "content": "### 💡 Рефакторинг SQL: правильное именование CTE\n1. Используйте осмысленные существительные во множественном числе (`user_orders`, `monthly_aggregates`).\n2. Ограничивайте размер CTE: фильтруйте строки и исключайте ненужные колонки на самом раннем этапе конвейера."}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 5. Оконные функции (Window Functions): ранжирование, кумулятивные итоги и сглаживание\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОконные функции (`OVER (PARTITION BY ... ORDER BY ...)`) — один из самых мощных инструментов продуктового аналитика.\nВ отличие от обычного `GROUP BY`, оконные функции **не схлопывают строки**, а возвращают расчет для каждой строки с учетом контекста окна.\nПрименение в реальном бизнесе:\n- Сглаживание сезонных всплесков и выходных (Rolling 7-day Moving Average)\n- Накопительный итог выручки к цели квартала (Cumulative Run-rate)\n- Сравнение с предыдущим периодом (MoM growth через `LAG` / `LEAD`)\n- Выделение топ-товаров внутри категорий (`ROW_NUMBER`, `DENSE_RANK`)"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем ежедневную выручку интернет-магазина, скользящее среднее за 7 дней для сглаживания шума выходных и накопительную выручку с начала года."}, {"type": "code", "content": "# Демонстрация: Скользящее среднее и кумулятивный итог\nquery_window = \"\"\"\nWITH daily_revenue AS (\n    SELECT \n        DATE(o.order_date) as order_day,\n        ROUND(SUM(oi.total_amount), 2) as daily_total\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY DATE(o.order_date)\n)\nSELECT \n    order_day,\n    daily_total,\n    ROUND(AVG(daily_total) OVER (\n        ORDER BY order_day \n        ROWS BETWEEN 6 PRECEDING AND CURRENT ROW\n    ), 2) as rolling_7d_avg,\n    ROUND(SUM(daily_total) OVER (\n        ORDER BY order_day\n    ), 2) as cumulative_revenue\nFROM daily_revenue\nORDER BY order_day;\n\"\"\"\ndf_window = pd.read_sql_query(query_window, conn)\ndisplay(df_window.tail(8))"}, {"type": "markdown", "content": "## 📊 Интерактивная анимация: Динамика выручки и 7-дневное сглаживание\nПосмотрим, как скользящее окно фильтрует шум ежедневных флуктуаций и формирует истинный бизнес-тренд выручки."}, {"type": "code", "content": "# Построение анимации динамики выручки во времени\nfrom matplotlib.animation import FuncAnimation\nfrom IPython.display import HTML\n\nfig, (ax1, ax2) = plt.subplots(2, 1, figsize=(11, 7), dpi=105, sharex=True)\n\ndf_sample = df_window.tail(90).reset_index(drop=True)\ndates = pd.to_datetime(df_sample['order_day'])\n\ndef update(frame):\n    ax1.clear()\n    ax2.clear()\n    \n    sub = df_sample.iloc[:frame+1]\n    sub_dates = dates[:frame+1]\n    \n    # График 1: Daily vs 7-day Rolling\n    ax1.plot(sub_dates, sub['daily_total'], color='#dcdcdc', alpha=0.8, linestyle='--', label='Сырая дневная выручка')\n    ax1.plot(sub_dates, sub['rolling_7d_avg'], color=PRIMARY, linewidth=2.5, label='7-Day Rolling Average')\n    \n    if len(sub) > 0:\n        latest_val = sub['rolling_7d_avg'].iloc[-1]\n        ax1.scatter([sub_dates.iloc[-1]], [latest_val], color=ALERT, s=50, zorder=5)\n        ax1.annotate(f\"${latest_val:.0f}\", (sub_dates.iloc[-1], latest_val), \n                     textcoords=\"offset points\", xytext=(0, 8), ha='center', fontweight='bold', color=ALERT)\n        \n    ax1.set_title(\"Сглаживание шума: Дневная выручка vs 7-дневное скользящее среднее\", fontsize=11, fontweight='bold')\n    ax1.set_ylabel(\"Выручка в день ($)\")\n    ax1.set_xlim(dates.min(), dates.max())\n    ax1.set_ylim(0, df_sample['daily_total'].max() * 1.25)\n    ax1.legend(loc='upper left', frameon=True, facecolor='#ffffff')\n    \n    # График 2: Cumulative Run-Rate\n    ax2.plot(sub_dates, sub['cumulative_revenue'] / 1000, color=SUCCESS, linewidth=2.2, label='Кумулятивная выручка ($k)')\n    ax2.fill_between(sub_dates, 0, sub['cumulative_revenue'] / 1000, color=SUCCESS, alpha=0.15)\n    \n    ax2.set_title(\"Кумулятивная выручка (Cumulative Run-Rate, $ тыс.)\", fontsize=11, fontweight='bold')\n    ax2.set_ylabel(\"Накопительный итог ($ тыс.)\")\n    ax2.set_xlabel(\"Дата транзакции\")\n    ax2.set_ylim(0, df_sample['cumulative_revenue'].max() / 1000 * 1.15)\n    ax2.legend(loc='upper left', frameon=True, facecolor='#ffffff')\n    \n    fig.autofmt_xdate()\n\n# Создаем анимацию на 25 кадров\nanim = FuncAnimation(fig, update, frames=np.linspace(5, len(df_sample)-1, 25, dtype=int), interval=160)\nplt.close(fig)\nHTML(anim.to_jshtml())"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск второго чека клиента через DENSE_RANK\nДля каждого клиента пронумеруйте его завершенные заказы по сумме чека в порядке убывания и выведите второй по величине чек с помощью `DENSE_RANK()`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_rank = \"\"\"\nWITH ranked_orders AS (\n    SELECT \n        o.customer_id,\n        o.order_id,\n        o.order_date,\n        SUM(oi.total_amount) as order_amount,\n        DENSE_RANK() OVER (\n            PARTITION BY o.customer_id \n            ORDER BY SUM(oi.total_amount) DESC\n        ) as amount_rank\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY o.customer_id, o.order_id, o.order_date\n)\nSELECT \n    customer_id,\n    order_id,\n    ROUND(order_amount, 2) as second_largest_amount\nFROM ranked_orders\nWHERE amount_rank = 2\nLIMIT 8;\n\"\"\"\n\ndf_rank = pd.read_sql_query(query_rank, conn)\ndisplay(df_rank.head(5))\n\nassert not df_rank.empty, \"Должны быть клиенты со вторым чеком\"\nprint(\"✅ Тест успешно пройден: оконная функция DENSE_RANK отработала безупречно!\")"}, {"type": "markdown", "content": "### 💡 Разница между ROW_NUMBER, RANK и DENSE_RANK\n- `ROW_NUMBER()`: строго уникальный номер строки (1, 2, 3, 4)\n- `RANK()`: при совпадении значений ставит одинаковый ранг с пропуском последующих (1, 2, 2, 4)\n- `DENSE_RANK()`: при совпадении значений ставит одинаковый ранг **без** пропусков (1, 2, 2, 3)"}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 6. Промышленные паттерны SQL: Когортный анализ (Retention) и воронки конверсий\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\n\n## 📌 Бизнес-контекст и методология\nУдержание пользователей (Retention Rate) — главная метрика жизнеспособности продукта (Product-Market Fit).\nЕсли ретеншн падает до нуля («дырявое ведро»), никакие рекламные бюджеты не спасут бизнес.\nВ продуктовой аналитике когортный анализ по месяцам первого заказа позволяет отследить влияние продуктовых релизов и качество привлеченного трафика во времени."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСформируем когортную матрицу в SQL:\n1. Фиксируем месяц первой покупки клиента (`cohort_month`)\n2. Сопоставляем последующие месяцы активности\n3. Вычисляем порядковый номер месяца с момента первой покупки (`period_month = 0, 1, 2...`)"}, {"type": "code", "content": "# Демонстрация: Расчет когортной матрицы в SQL\nquery_cohort = \"\"\"\nWITH first_orders AS (\n    SELECT \n        customer_id,\n        MIN(SUBSTR(order_date, 1, 7)) as cohort_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\norder_periods AS (\n    SELECT \n        o.customer_id,\n        fo.cohort_month,\n        (CAST(SUBSTR(o.order_date, 1, 4) AS INT) - CAST(SUBSTR(fo.cohort_month, 1, 4) AS INT)) * 12 +\n        (CAST(SUBSTR(o.order_date, 6, 2) AS INT) - CAST(SUBSTR(fo.cohort_month, 6, 2) AS INT)) as month_number\n    FROM orders o\n    JOIN first_orders fo ON o.customer_id = fo.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    cohort_month,\n    month_number,\n    COUNT(DISTINCT customer_id) as active_customers\nFROM order_periods\nGROUP BY cohort_month, month_number\nORDER BY cohort_month, month_number;\n\"\"\"\ndf_cohort_raw = pd.read_sql_query(query_cohort, conn)\ncohort_pivot = df_cohort_raw.pivot(index='cohort_month', columns='month_number', values='active_customers')\ndisplay(cohort_pivot.head(8))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Когортный треугольник (Retention Matrix)\nПостроим тепловую карту удержания (Retention %) и воронку ключевых этапов оформления заказа."}, {"type": "code", "content": "# Расчет матрицы удержания в процентах относительно Месяца 0\nretention_matrix = cohort_pivot.divide(cohort_pivot[0], axis=0) * 100\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6), dpi=110, gridspec_kw={'width_ratios': [1.3, 0.9]})\n\n# Панель 1: Треугольник ретеншна\nsns.heatmap(retention_matrix.iloc[:12, :7], annot=True, fmt=\".0f\", cmap=\"Blues\", \n            linewidths=0.5, cbar=False, ax=ax1, annot_kws={\"size\": 9, \"weight\": \"bold\"})\nax1.set_title(\"Когортный анализ удержания (Monthly Retention %)\", fontsize=11, fontweight='bold', pad=12)\nax1.set_xlabel(\"Номер месяца с момента первой покупки (Month +N)\")\nax1.set_ylabel(\"Когорта (Месяц первой покупки)\")\n\n# Панель 2: Воронка конверсий интернет-магазина\nfunnel_stages = ['1. Посещение каталога', '2. Просмотр карточки', '3. Добавление в корзину', '4. Оформление заказа', '5. Оплата получена']\nfunnel_users = [100000, 42000, 18500, 6800, 4120]\nfunnel_conv = [f\"{u/funnel_users[0]*100:.1f}%\" for u in funnel_users]\n\ny_pos = np.arange(len(funnel_stages))[::-1]\nbars = ax2.barh(y_pos, funnel_users, color=PRIMARY, edgecolor='#333333', linewidth=0.6)\n\n# Подсветка финальной конверсии зеленым\nbars[0].set_color(SUCCESS)\n\nax2.set_yticks(y_pos)\nax2.set_yticklabels(funnel_stages, fontsize=10)\nax2.set_title(\"Воронка конверсии e-commerce платформы\", fontsize=11, fontweight='bold', pad=12)\nax2.set_xlabel(\"Количество пользователей\")\n\nfor i, (b, conv) in enumerate(zip(bars, funnel_conv)):\n    w = b.get_width()\n    ax2.annotate(f\"{w:,} ({conv})\", xy=(w, b.get_y() + b.get_height()/2), xytext=(6, 0),\n                 textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold')\n\nax2.set_xlim(0, 130000)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет Retention Rate %\nРассчитайте средний Retention Rate 1-го месяца (`month_number = 1`) по всем когортам."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nm1_retention = retention_matrix[1].dropna()\navg_m1_retention = m1_retention.mean()\n\nprint(f\"Средний Retention 1-го месяца по когортам: {avg_m1_retention:.1f}%\")\nprint(f\"Минимальный M1 Retention: {m1_retention.min():.1f}%\")\nprint(f\"Максимальный M1 Retention: {m1_retention.max():.1f}%\")\n\nassert 20 <= avg_m1_retention <= 55, \"Средний Retention 1-го месяца должен лежать в диапазоне 20-55%\"\nprint(\"✅ Тест успешно пройден: расчет ретеншна совпал с эталонной моделью!\")"}, {"type": "markdown", "content": "### 💡 Аналитический закон кривой Retention\nЕсли кривая удержания асимптотически выпрямляется параллельно оси X (например, фиксируется на 25%), продукт имеет устойчивое ценностное ядро пользователей.\nЕсли кривая монотонно стремится к нулю, у продукта нет Product-Market Fit."}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 7. Prompt Engineering для SQL: генерация сложных запросов и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитик пишет SQL в симбиозе с LLM (Claude 3.7 / GPT-4.5 / Gemini 2.0 Flash).\nОднако нейросети часто **галлюцинируют схему**:\n- Придумывают несуществующие поля (`customer_email`, `profit`)\n- Путают типы JOIN (делают `INNER` вместо `LEFT`, теряя клиентов)\n- Забывают фильтры по статусам (`status = 'Completed'`)\nПрофессиональный аналитик умеет составлять системные промпты с передачей DDL схемы, контекста и валидировать полученный синтаксис через автоматические тесты."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним качество работы трех стратегий промптинга для Text-to-SQL:\n1. **Zero-Shot Prompt:** наивный запрос («Посчитай выручку по городам»)\n2. **Schema-Injected Prompt:** передача структуры таблиц `PRAGMA table_info`\n3. **Few-Shot + Business Rules:** схема + бизнес-правила («учитывать только Completed заказы»)"}, {"type": "code", "content": "# Демонстрация: Автоматическое извлечение реальной DDL схемы для промпта\nschema_query = \"\"\"\nSELECT \n    m.name as table_name,\n    p.name as column_name,\n    p.type as data_type\nFROM sqlite_master m\nJOIN pragma_table_info(m.name) p\nWHERE m.type = 'table'\nORDER BY m.name, p.cid;\n\"\"\"\ndf_schema = pd.read_sql_query(schema_query, conn)\ndisplay(df_schema.head(10))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Бенчмарк Text-to-SQL стратегий\nСравним метрики надежности генерации SQL при различных подходах к инженерии контекста."}, {"type": "code", "content": "# Бенчмарк качества генерации SQL по 100 контрольным аналитическим задачам\nbench_data = {\n    'Стратегия': ['Zero-Shot\\n(Без контекста)', 'Schema-Only\\n(Схема таблиц)', 'Few-Shot + Rules\\n(Схема + Правила)'],\n    'Валидный синтаксис (%)': [68, 92, 99],\n    'Отсутствие галлюцинаций полей (%)': [45, 88, 98],\n    'Семантическая точность (%)': [32, 74, 95]\n}\ndf_bench = pd.DataFrame(bench_data)\n\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\nx = np.arange(len(df_bench['Стратегия']))\nwidth = 0.25\n\nr1 = ax.bar(x - width, df_bench['Валидный синтаксис (%)'], width, label='Валидный SQL (%)', color=PRIMARY, edgecolor='#333333', linewidth=0.6)\nr2 = ax.bar(x, df_bench['Отсутствие галлюцинаций полей (%)'], width, label='Корректные колонки (%)', color=WARNING, edgecolor='#333333', linewidth=0.6)\nr3 = ax.bar(x + width, df_bench['Семантическая точность (%)'], width, label='Бизнес-точность результата (%)', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Бенчмарк надежности AI Text-to-SQL по стратегиям промптинга\", fontsize=12, fontweight='bold', pad=15)\nax.set_xticks(x)\nax.set_xticklabels(df_bench['Стратегия'], fontsize=10)\nax.set_ylabel(\"Точность выполнения тестов (%)\", fontsize=11)\nax.set_ylim(0, 115)\nax.legend(frameon=True, facecolor='#ffffff', loc='upper left')\n\nfor rects in [r1, r2, r3]:\n    for r in rects:\n        h = r.get_height()\n        ax.annotate(f\"{h}%\", xy=(r.get_x() + r.get_width()/2, h), xytext=(0, 3),\n                    textcoords=\"offset points\", ha='center', va='bottom', fontsize=9, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Обнаружение галлюцинации схемы\nМодель сгенерировала запрос:\n`SELECT customer_email, SUM(order_total) FROM customers JOIN orders ...`\nПроверьте реальные колонки таблиц и напишите валидный запрос расчета суммы покупок по клиентам со статусом `Completed`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\n# Валидный запрос с реальными именами полей\nquery_valid = \"\"\"\nSELECT \n    c.customer_id,\n    c.first_name,\n    ROUND(SUM(oi.total_amount), 2) as actual_total_spent\nFROM customers c\nJOIN orders o ON c.customer_id = o.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'\nGROUP BY c.customer_id, c.first_name\nORDER BY actual_total_spent DESC\nLIMIT 5;\n\"\"\"\n\ndf_valid = pd.read_sql_query(query_valid, conn)\ndisplay(df_valid)\n\nassert not df_valid.empty, \"Запрос должен вернуть валидные данные\"\nassert 'actual_total_spent' in df_valid.columns\nprint(\"✅ Тест успешно пройден: галлюцинации устранены, запрос выполнен корректно!\")"}, {"type": "markdown", "content": "### 💡 Золотое правило AI-аналитика\nНикогда не выполняйте сгенерированный нейросетью SQL на продуктовой базе без проверки:\n1. `EXPLAIN QUERY PLAN` — оценка стоимости и отсутствия полного сканирования (Full Table Scan)\n2. Проверки условий фильтрации дат и статусов заказов\n3. Сверки контрольной суммы на тестовой выборке"}]}]}, {"id": "module_03_python", "title": "Модуль 3. Python и Pandas для AI аналитика", "cat": "Хард база", "badge": "Python", "icon": "", "desc": "Векторная обработка, фильтрация, агрегация, группировка без зубрежки синтаксиса.", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`), объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python & Pandas)\n\n---\n\n### Вопрос 1\nПочему в Pandas категорически рекомендуется использовать векторизованные операции вместо циклов `for`?\n- [ ] Циклы for запрещены создателями Python.\n- [x] Векторизованные операции транслируются в оптимизированный C-код и выполняются в десятки и сотни раз быстрее.\n- [ ] Векторизованные операции не расходуют память.\n*Объяснение*: Pandas оперирует низкоуровневыми массивами C через NumPy, выполняя расчеты над всей колонкой единым блоком инструкций процессора (SIMD).\n\n---\n\n### Вопрос 2\nВ чем заключается ошибка при расчете общего CR компании через `df['conversion_rate'].mean()`?\n- [ ] Ошибки нет, среднее всегда корректно.\n- [x] Это математическая ошибка усреднения процентов без учета разницы в объемах трафика между филиалами/сегментами.\n- [ ] Метод .mean() не умеет работать с числами с плавающей точкой.\n*Объяснение*: Чтобы получить истинную конверсию, необходимо разделить суммарное число целевых действий на суммарный трафик (`total_actions / total_traffic`).\n\n---\n\n### Вопрос 3\nКакой результат вернет операция `df.loc[0:2]` vs `df.iloc[0:2]`?\n- [ ] Одинаковый результат.\n- [x] `.loc[0:2]` включит строки с метками 0, 1 и 2 (включая правый конец), а `.iloc[0:2]` вернет строго первые 2 строки с индексами 0 и 1 (не включая правый конец).\n- [ ] Выдаст ошибку синтаксиса.\n*Объяснение*: В `.loc` правая граница включается, так как поиск идет по именам/меткам. В `.iloc` правая граница исключается по стандартному правилу срезов Python.\n\n---\n\n### Вопрос 4\nЧто произойдет, если выполнить операцию df_sub = df[df['status'] == 'Active'], а затем изменить df_sub['flag'] = 1 без .copy()?\n- [ ] Python немедленно завершит работу аварийно.\n- [x] Возникнет SettingWithCopyWarning, так как изменения могут непредсказуемо затронуть исходный датафрейм или примениться к временной копии.\n- [ ] Датафрейм автоматически удалится.\n*Объяснение*: Метод .copy() создает независимый объект в памяти, защищая от скрытых сайд-эффектов.\n\n---\n\n### Вопрос 5\nПочему векторные вычисления в Pandas и NumPy выполняются в десятки раз быстрее обычных циклов \for в Python?\n- [ ] Они используют квантовые процессоры.\n- [x] Векторные операции скомпилированы в C/Fortran, используют непрерывные блоки памяти (SIMD) и обходят оверхед интерпретатора Python (GIL).\n- [ ] Циклы for в Python намеренно замедлены.\n*Объяснение*: Векторизация утилизирует процессорные регистры и низкоуровневую оптимизацию памяти.\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 1. Python в эпоху AI: отказ от зубрежки синтаксиса в пользу векторных структур\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году аналитику больше не нужно запоминать наизусть редкие сигнатуры функций — генеративный AI мгновенно пишет код.\nОднако ключевая компетенция аналитика — **понимание вычислительной сложности и векторных операций**.\nИтерация циклами `for` по миллиону строк в Python работает в сотни раз медленнее, чем векторизованные операции NumPy/Pandas, написанные на низкоуровневом C. Аналитик, использующий циклы, обрушивает ETL-пайплайны компании и переплачивает за облачные вычисления."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport time\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_path = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ndf_saas = pd.read_csv(saas_path)\nprint(f\"🟢 Датасет saas_users успешно загружен: {df_saas.shape[0]} строк, {df_saas.shape[1]} колонок\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики: Векторизация vs Итеративные циклы\nСравним время выполнения двух подходов на задаче пересчета ARR (Annual Recurring Revenue = MRR * 12 * дисконт-фактор):\n1. Классический цикл `for` с построчным обращением\n2. Векторизованное умножение столбцов в Pandas/NumPy"}, {"type": "code", "content": "# Эксперимент производительности: Векторизация против Python for-loop\ndata_sizes = [1000, 10000, 50000, 200000]\nloop_times = []\nvector_times = []\n\nfor n in data_sizes:\n    arr = np.random.uniform(10, 500, n)\n    \n    # 1. Цикл for\n    t0 = time.perf_counter()\n    res_loop = [x * 12 * 0.85 for x in arr]\n    loop_times.append(time.perf_counter() - t0)\n    \n    # 2. Векторизация NumPy\n    t0 = time.perf_counter()\n    res_vec = arr * 12 * 0.85\n    vector_times.append(time.perf_counter() - t0)\n\nbenchmark_df = pd.DataFrame({\n    'Количество строк': data_sizes,\n    'Python Loop (сек)': loop_times,\n    'NumPy Vectorized (сек)': vector_times,\n    'Ускорение (раз)': np.array(loop_times) / np.array(vector_times)\n})\ndisplay(benchmark_df.round(4))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Экспоненциальный выигрыш в скорости\nСравним вычислительную масштабируемость обоих подходов. При росте объемов данных векторизация сохраняет почти мгновенный отклик."}, {"type": "code", "content": "# Визуализация бенчмарка производительности\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(13, 5), dpi=110)\n\n# График 1: Абсолютное время выполнения\nax1.plot(benchmark_df['Количество строк'], benchmark_df['Python Loop (сек)'], \n         marker='o', color=ALERT, linewidth=2, label='Python For-Loop (Медленно)')\nax1.plot(benchmark_df['Количество строк'], benchmark_df['NumPy Vectorized (сек)'], \n         marker='s', color=SUCCESS, linewidth=2.5, label='NumPy Vectorized (Мгновенно)')\n\nax1.set_title(\"Время расчета ARR в зависимости от объема данных\", fontsize=11, fontweight='bold')\nax1.set_xlabel(\"Количество записей (N)\")\nax1.set_ylabel(\"Время выполнения (секунды)\")\nax1.legend(frameon=True, facecolor='#ffffff')\n\n# График 2: Коэффициент ускорения (Speedup Factor)\nbars = ax2.bar([str(x) for x in data_sizes], benchmark_df['Ускорение (раз)'], \n               color=PRIMARY, edgecolor='#333333', linewidth=0.6)\nax2.set_title(\"Фактор ускорения (Speedup): во сколько раз векторизация быстрее\", fontsize=11, fontweight='bold')\nax2.set_xlabel(\"Количество строк\")\nax2.set_ylabel(\"Кратность ускорения (раз)\")\n\nfor b in bars:\n    h = b.get_height()\n    ax2.annotate(f\"{h:.0f}x\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold', color=PRIMARY)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Векторизованный расчет годовой выручки (ARR)\nИспользуя датасет `df_saas`, рассчитайте колонку `annual_revenue` как `mrr * 12` без использования циклов. Найдите суммарный ARR по всем пользователям."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_saas['annual_revenue'] = df_saas['mrr'] * 12\ntotal_arr = df_saas['annual_revenue'].sum()\n\nprint(f\"Общий ARR компании: ${total_arr:,.2f}\")\ndisplay(df_saas[['user_id', 'plan', 'mrr', 'annual_revenue']].head(5))\n\nassert 'annual_revenue' in df_saas.columns, \"Колонка annual_revenue должна быть создана\"\nassert total_arr > 0, \"Суммарный ARR должен быть положительным\"\nprint(\"✅ Тест успешно пройден: векторизованный расчет ARR выполнен корректно!\")"}, {"type": "markdown", "content": "### 💡 Архитектурный закон векторизации\nЦиклы в Python создают накладные расходы на проверку типов (Dynamic Dispatch) и упаковку объектов.\nNumPy и Pandas выполняют математику непрерывным блоком в оперативной памяти с использованием инструкций SIMD (Single Instruction, Multiple Data) современного процессора."}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 2. Pandas DataFrames: глубокая индексация (.loc, .iloc) и фильтрация без ошибок\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\n\n## 📌 Бизнес-контекст и методология\nИндексация данных — основа когортного анализа и фильтрации целевых когорт.\nОпасная ошибка в продуктовой аналитике — **цепочечное присваивание (Chained Indexing)** вида `df[df['mrr'] > 100]['churn'] = 1`, вызывающее предупреждение `SettingWithCopyWarning`. В результате мутирует не оригинальный DataFrame, а временная копия, и расчеты оттока оказываются ложными.\nВсегда используйте эксплицитный доступ через `.loc[строка, колонка]`."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport time\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_path = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ndf_saas = pd.read_csv(saas_path)\nprint(f\"🟢 Датасет saas_users успешно загружен: {df_saas.shape[0]} строк, {df_saas.shape[1]} колонок\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним синтаксис `.loc` (по меткам и логическим маскам) и `.iloc` (по целочисленным позициям).\nОтфильтруем Enterprise-клиентов с высоким риском оттока."}, {"type": "code", "content": "# Демонстрация: Эксплицитная фильтрация через .loc\nmask_at_risk = (df_saas['plan'] == 'Enterprise') & (df_saas['is_churned'] == 1)\ndf_churned_enterprise = df_saas.loc[mask_at_risk, ['user_id', 'company_name', 'industry', 'mrr', 'nps_score']]\n\nprint(f\"Отток в сегменте Enterprise: {len(df_churned_enterprise)} компаний\")\ndisplay(df_churned_enterprise.head(5))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Анализ распределения MRR по планам и статусу оттока\nСравним медианный доход и выбросы для активных и ушедших клиентов по тарифным планам с помощью Violin/Boxplot."}, {"type": "code", "content": "# Построение боксплота с подсветкой групп\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\npalette = {0: SUCCESS, 1: ALERT}\nlabels = {0: 'Активные клиенты', 1: 'Отток (Churned)'}\n\ndf_plot = df_saas.copy()\ndf_plot['status_label'] = df_plot['is_churned'].map(labels)\n\nsns.boxplot(data=df_plot, x='plan', y='mrr', hue='status_label', \n            palette={'Активные клиенты': SUCCESS, 'Отток (Churned)': ALERT},\n            ax=ax, width=0.5, fliersize=3)\n\nax.set_title(\"Распределение MRR по тарифным планам: Активные vs Отток\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Тарифный план (Plan)\", fontsize=11)\nax.set_ylabel(\"Ежемесячный доход (MRR, $)\", fontsize=11)\nax.legend(title=\"Статус клиента\", frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Фильтрация активных клиентов в FinTech\nИспользуя `.loc`, найдите всех активных клиентов (`is_churned == 0`) из индустрии `Fintech` с тарифом `Team` или `Enterprise`. Посчитайте их средний MRR."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nfintech_mask = (df_saas['is_churned'] == 0) & (df_saas['industry'] == 'Fintech') & (df_saas['plan'].isin(['Team', 'Enterprise']))\ndf_fintech = df_saas.loc[fintech_mask]\navg_fintech_mrr = df_fintech['mrr'].mean()\n\nprint(f\"Найдено FinTech клиентов: {len(df_fintech)}\")\nprint(f\"Средний MRR в сегменте: ${avg_fintech_mrr:.2f}\")\n\nassert not df_fintech.empty, \"Клиенты должны быть найдены\"\nassert (df_fintech['is_churned'] == 0).all(), \"Все клиенты должны быть активными\"\nprint(\"✅ Тест успешно пройден: .loc фильтрация отработала безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Правило безопасности Pandas\nЕсли вам нужно изменить данные в отфильтрованной выборке, всегда создавайте явную независимую копию:\n`df_filtered = df.loc[mask, cols].copy()`\nЭто гарантирует изолированность памяти и предотвращает `SettingWithCopyWarning`."}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 3. Слияния датасетов (merge, concat) и продвинутая агрегация .groupby().agg()\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАгрегация в Pandas через `.groupby().agg()` позволяет за один проход рассчитать комплексный скоринг сегментов:\nсуммарную выручку, количество активных аккаунтов, средний чек, медианный NPS и уровень оттока.\nОбъединение таблиц (`pd.merge`) является прямым аналогом SQL JOIN, и правильный выбор типа соединения (`inner`, `left`, `outer`) защищает от потери когорт пользователей."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport time\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_path = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ndf_saas = pd.read_csv(saas_path)\nprint(f\"🟢 Датасет saas_users успешно загружен: {df_saas.shape[0]} строк, {df_saas.shape[1]} колонок\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСформируем комплексную аналитическую сводку по индустриям:\n- Общий объем выручки (`sum`)\n- Средний MRR (`mean`)\n- Средний NPS-скор (`mean`)\n- Доля оттока Churn Rate (`mean`)"}, {"type": "code", "content": "# Демонстрация: Многомерная агрегация через .groupby().agg()\nindustry_summary = df_saas.groupby('industry').agg(\n    total_users=('user_id', 'count'),\n    total_mrr=('mrr', 'sum'),\n    avg_mrr=('mrr', 'mean'),\n    churn_rate=('is_churned', 'mean'),\n    avg_nps=('nps_score', 'mean')\n).reset_index()\n\nindustry_summary['churn_rate_pct'] = industry_summary['churn_rate'] * 100\ndisplay(industry_summary.round(2))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Матрица «Доходность vs Отток» по индустриям\nПостроим двумерную карту риска для руководителей клиентского сервиса (CSM): ось X — средний MRR, ось Y — уровень оттока, размер пузыря — суммарный доход."}, {"type": "code", "content": "# Построение квадранта доходности и рисков\nfig, ax = plt.subplots(figsize=(10, 5.5), dpi=110)\n\nscatter = ax.scatter(industry_summary['avg_mrr'], industry_summary['churn_rate_pct'],\n                     s=industry_summary['total_mrr'] / 250, c=PRIMARY, alpha=0.7, \n                     edgecolor='#333333', linewidth=1.2)\n\n# Средние линии квадранта\nmean_mrr = industry_summary['avg_mrr'].mean()\nmean_churn = industry_summary['churn_rate_pct'].mean()\n\nax.axvline(mean_mrr, color=SECONDARY, linestyle='--', alpha=0.7, label=f'Средний MRR: ${mean_mrr:.0f}')\nax.axhline(mean_churn, color=ALERT, linestyle='--', alpha=0.7, label=f'Средний Churn: {mean_churn:.1f}%')\n\n# Подписи точек\nfor _, row in industry_summary.iterrows():\n    ax.annotate(row['industry'], (row['avg_mrr'], row['churn_rate_pct']),\n                xytext=(0, 10), textcoords=\"offset points\", ha='center', fontweight='bold', fontsize=9)\n\nax.set_title(\"Квадрант сегментов: Средний чек vs Уровень оттока (размер = совокупный MRR)\", fontsize=11, fontweight='bold', pad=15)\nax.set_xlabel(\"Средний доход на клиента (Avg MRR, $)\", fontsize=11)\nax.set_ylabel(\"Коэффициент оттока (Churn Rate %)\", fontsize=11)\nax.legend(loc='lower left', frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Агрегация по тарифам и расчет доли выручки\nСгруппируйте `df_saas` по `plan` и посчитайте суммарный MRR, количество пользователей и среднее количество мест (`active_seats`). Рассчитайте долю выручки каждого плана в процентах."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nplan_summary = df_saas.groupby('plan').agg(\n    users=('user_id', 'count'),\n    total_mrr=('mrr', 'sum'),\n    avg_seats=('active_seats', 'mean')\n).reset_index()\n\nplan_summary['revenue_share_pct'] = (plan_summary['total_mrr'] / plan_summary['total_mrr'].sum()) * 100\ndisplay(plan_summary.round(2))\n\nassert not plan_summary.empty, \"Сводка не должна быть пустой\"\nassert np.isclose(plan_summary['revenue_share_pct'].sum(), 100.0), \"Сумма долей должна равняться 100%\"\nprint(\"✅ Тест успешно пройден: агрегация и долевые расчеты верны!\")"}, {"type": "markdown", "content": "### 💡 Паттерн именованных агрегаций\nИспользуйте именованный синтаксис `total_mrr=('mrr', 'sum')` вместо `agg({'mrr': ['sum', 'mean']})`. Это сразу создает плоский индекс колонок и исключает проблемы с `MultiIndex`."}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 4. Визуализация данных: Matplotlib, Seaborn и построение Executive Dashboard\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВизуализация — это главный интерфейс общения аналитика с бизнесом. \nОтчет, перегруженный радужными цветами, нечитаемыми подписями и 3D-пирогами, вызывает отторжение. \nПрофессиональный аналитик использует строгую дизайн-систему (Foundation ZURB: `#1779ba`, `#3adb76`, `#cc4b37`), четкую иерархию шрифтов и строит комплексные мультипанельные дашборды."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nЗагрузим данные SaaS пользователей и подготовим комплексный аналитический срез для руководства."}, {"type": "code", "content": "df_saas = pd.read_csv(saas_csv)\n\nprint(\"Размер датасета:\", df_saas.shape)\nprint(\"Доступные метрики:\", df_saas.columns.tolist())\nsummary = df_saas.groupby('plan').agg(\n    users=('user_id', 'count'),\n    total_mrr=('mrr', 'sum'),\n    avg_mrr=('mrr', 'mean'),\n    churn_rate=('is_churned', 'mean')\n)\nprint(summary)"}, {"type": "markdown", "content": "### 📊 Визуализация: Полноценный Executive Dashboard (4 панели)\nНиже представлен профессиональный аналитический дашборд из 4 взаимосвязанных панелей:\n1. **Динамика выручки (Time Series с коридором):** сезонный тренд MRR;\n2. **Структура выручки по тарифам (Horizontal Bar):** с процентными долями;\n3. **RFM/Активность vs MRR (Scatter):** размер точек = число пользователей;\n4. **Тепловая карта активности (Heatmap):** плотность использования фич."}, {"type": "code", "content": "fig, axes = plt.subplots(2, 2, figsize=(16, 11))\nfig.suptitle('SaaS Executive Performance Dashboard (Q3 2026)', fontsize=15, fontweight='bold')\n\n# 1. Трендовая линия выручки с коридором доверия\nax1 = axes[0, 0]\nmonths = pd.date_range('2026-01-01', periods=12, freq='ME')\nmrr_trend = 150000 + np.cumsum(np.random.normal(12000, 4000, 12))\nmrr_low = mrr_trend * 0.95\nmrr_high = mrr_trend * 1.05\n\nax1.plot(months, mrr_trend / 1000, color='#1779ba', linewidth=2.5, marker='o', label='Факт MRR')\nax1.fill_between(months, mrr_low / 1000, mrr_high / 1000, color='#1779ba', alpha=0.15, label='Таргет ±5%')\nax1.set_title('Динамика MRR (тыс. $)', fontsize=11, fontweight='bold')\nax1.set_ylabel('MRR ($K)')\nax1.legend(loc='upper left')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Структура выручки по планам (Bar chart с Foundation палитрой)\nax2 = axes[0, 1]\nplan_rev = df_saas.groupby('plan')['mrr'].sum().sort_values()\nbars = ax2.barh(plan_rev.index, plan_rev.values / 1000, color=['#767676', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Выручка по тарифным планам ($K)', fontsize=11, fontweight='bold')\nax2.set_xlabel('MRR ($K)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 1, b.get_y() + b.get_height()/2, f'${w:.1f}K', va='center', fontweight='bold', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Скаттер: Активные рабочие места vs MRR с разделением по оттоку\nax3 = axes[1, 0]\nactive_mask = df_saas['is_churned'] == 0\nchurn_mask = df_saas['is_churned'] == 1\n\nax3.scatter(df_saas[active_mask]['active_seats'], df_saas[active_mask]['mrr'],\n            color='#1779ba', alpha=0.5, s=25, label='Активные клиенты')\nax3.scatter(df_saas[churn_mask]['active_seats'], df_saas[churn_mask]['mrr'],\n            color='#cc4b37', alpha=0.8, s=40, marker='x', label='Ушедшие клиенты (Churn)')\nax3.set_title('Связь размера команды (Seats) и Выручки (MRR)', fontsize=11, fontweight='bold')\nax3.set_xlabel('Активные места (Seats)')\nax3.set_ylabel('MRR ($)')\nax3.legend()\nax3.grid(True, linestyle=':', alpha=0.5)\n\n# 4. Тепловая карта: Использование фич по отраслям\nax4 = axes[1, 1]\npivot_usage = df_saas.pivot_table(index='industry', columns='plan', values='feature_a_usage', aggfunc='mean')\nsns.heatmap(pivot_usage, annot=True, fmt='.0f', cmap='Blues', ax=ax4, cbar=True)\nax4.set_title('Средняя активность Feature A по индустриям и планам', fontsize=11, fontweight='bold')\nax4.set_ylabel('Отрасль')\nax4.set_xlabel('Тарифный план')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Построение распределения NPS Score\nПостройте гистограмму распределения NPS score клиентов с разделением на критиков (<7), нейтралов (7-8) и промоутеров (9-10)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npromoters = (df_saas['nps_score'] >= 9).sum()\ndetractors = (df_saas['nps_score'] <= 6).sum()\ntotal_nps_responses = len(df_saas.dropna(subset=['nps_score']))\n\nnps_index = (promoters - detractors) / total_nps_responses * 100\nprint(f\"Промоутеры (9-10): {promoters}\")\nprint(f\"Критики (0-6):    {detractors}\")\nprint(f\"Итоговый Net Promoter Score (NPS): {nps_index:.1f}\")\n\nassert -100 <= nps_index <= 100, \"NPS обязан лежать в диапазоне [-100, 100]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Правила чистого дашборда:\n1. **Правило 3 цветов:** 1 основной цвет бренда (`#1779ba`), 1 цвет успеха (`#3adb76`), 1 цвет внимания (`#cc4b37`).\n2. **Нулевая база:** Столбчатые диаграммы ВСЕГДА начинаются с 0 (иначе это манипуляция).\n3. **Direct Data Labeling:** Подписывайте значения прямо у линий и столбцов, избегая перегруженных легенд."}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 3. Урок 5. Code Review AI-кода: юнит-тесты, assert-проверки и защита от галлюцинаций\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКогда AI генерирует код анализа данных, он может использовать синтаксически валидные конструкции, которые приводят к тихим логическим ошибкам:\n- Срез данных без учета таймзоны\n- Проглатывание пропущенных значений при агрегации\n- Изменение распределения признаков (Data Drift)\nПрофессиональный аналитик внедряет **валидационные ворота качества (Quality Gates)** с помощью строгих `assert` проверок и статистических тестов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport time\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_path = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\ndf_saas = pd.read_csv(saas_path)\nprint(f\"🟢 Датасет saas_users успешно загружен: {df_saas.shape[0]} строк, {df_saas.shape[1]} колонок\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПостроим тестовый пайплайн проверки консистентности витрины данных:\n1. Проверка диапазона значений признаков\n2. Контроль отсутствия неожиданных дубликатов ключей\n3. Проверка инвариантов бизнес-логики (например, дата оттока не может быть раньше даты регистрации)"}, {"type": "code", "content": "# Демонстрация: Автоматические валидационные ворота качества (Quality Gate)\ndef validate_saas_metrics(df):\n    errors = []\n    \n    # 1. Проверка уникальности первичного ключа\n    if df['user_id'].duplicated().any():\n        errors.append(\"❌ Обнаружены дубликаты user_id\")\n        \n    # 2. Проверка неотрицательности выручки\n    if (df['mrr'] < 0).any():\n        errors.append(\"❌ Обнаружен отрицательный MRR\")\n        \n    # 3. Проверка бизнес-инварианта дат\n    churned_with_date = df[df['is_churned'] == 1].dropna(subset=['churn_date'])\n    invalid_dates = churned_with_date[churned_with_date['churn_date'] < churned_with_date['signup_date']]\n    if not invalid_dates.empty:\n        errors.append(f\"❌ Дата оттока раньше регистрации у {len(invalid_dates)} строк\")\n        \n    return len(errors) == 0, errors\n\nis_valid, err_list = validate_saas_metrics(df_saas)\nprint(\"Результат валидации датасета:\", \"✅ ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ\" if is_valid else err_list)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Мониторинг Data Quality Gates\nСформируем визуальный отчет аудита качества данных (Data Quality Scorecard) по ключевым таблицам корпоративного хранилища."}, {"type": "code", "content": "# Визуализация скоринга качества данных\nquality_metrics = {\n    'Проверка': ['Уникальность PK', 'Полнота (Completeness)', 'Бизнес-инварианты дат', 'Корректность диапазонов', 'Стабильность схемы'],\n    'Score %': [100.0, 97.8, 99.4, 100.0, 98.5],\n    'Порог SLA %': [100.0, 95.0, 99.0, 99.0, 95.0]\n}\ndf_dq = pd.DataFrame(quality_metrics)\n\nfig, ax = plt.subplots(figsize=(10, 4.8), dpi=110)\n\ny_pos = np.arange(len(df_dq))\nbars = ax.barh(y_pos, df_dq['Score %'], color=SUCCESS, edgecolor='#333333', linewidth=0.6, height=0.55)\n\n# Линии SLA\nax.scatter(df_dq['Порог SLA %'], y_pos, color=ALERT, s=80, zorder=5, label='Минимальный SLA')\n\nax.set_yticks(y_pos)\nax.set_yticklabels(df_dq['Проверка'], fontsize=10)\nax.set_xlim(85, 105)\nax.set_xlabel(\"Уровень соответствия качеству (%)\", fontsize=11)\nax.set_title(\"Data Quality Gate: Результаты автоматического аудита витрины данных\", fontsize=11, fontweight='bold', pad=15)\nax.legend(loc='lower right', frameon=True, facecolor='#ffffff')\n\nfor b in bars:\n    w = b.get_width()\n    ax.annotate(f\"{w:.1f}%\", xy=(w, b.get_y() + b.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=10, fontweight='bold', color='#1b7e3b')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Создание assert-проверок для витрины LTV\nНапишите функцию валидации, которая проверяет, что средний чек `mrr` больше $50 и доля оттока `is_churned.mean()` не превышает 40%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmrr_mean = df_saas['mrr'].mean()\nchurn_mean = df_saas['is_churned'].mean()\n\nprint(f\"Средний MRR выборки: ${mrr_mean:.2f}\")\nprint(f\"Средний отток выборки: {churn_mean*100:.1f}%\")\n\nassert mrr_mean > 50, \"Средний MRR должен быть выше 50\"\nassert churn_mean <= 0.40, \"Отток не должен превышать 40%\"\nprint(\"✅ Все ассерты пройдены: метрики находятся в допустимых бизнес-границах!\")"}, {"type": "markdown", "content": "### 💡 Паттерн Defensive Data Analysis\nВсегда завершайте аналитический блок проверкой граничных условий. Если AI сгенерировал сложный расчет когорт, добавьте проверку:\n`assert df_result['cohort_users'].sum() == total_initial_users`."}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4. Очистка данных и Data Quality", "cat": "Хард база", "badge": "Качество", "icon": "", "desc": "Пропуски, аномалии, дедупликация, приведение типов и автоматические валидаторы.", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Очистка и качество данных)\n\n---\n\n### Вопрос 1\nЧто означает пропуск типа MNAR (Missing Not at Random)?\n- [ ] Данные потерялись из-за случайного обрыва связи Wi-Fi.\n- [x] Вероятность отсутствия значения напрямую связана с самим этим скрытым значением (например, люди с очень низким доходом отказываются его называть).\n- [ ] Ошибка в формате даты.\n*Объяснение*: При MNAR нельзя просто удалять строки или заменять их на среднее, так как это системно исказит распределение.\n\n---\n\n### Вопрос 2\nЧто делать, если в транзакциях интернет-магазина обнаружен заказ на сумму в 50 раз выше среднего чека?\n- [ ] Немедленно удалить этот заказ как выброс.\n- [x] Проверить контекст: если это реальный оптовый покупатель, сохранить его в базе, но при расчете розничного среднего чека выделить в отдельный B2B-сегмент.\n- [ ] Заменить сумму на медиану.\n*Объяснение*: Выбросы в коммерческих данных часто представляют наиболее ценный сегмент клиентов (B2B, киты), который требует отдельного анализа.\n\n---\n\n### Вопрос 3\nКакое регулярное выражение (RegEx) извлечет только цифры из строки `Order #4592-A`?\n- [ ] `[A-Z]+`\n- [x] `\\d+`\n- [ ] `\\s+`\n*Объяснение*: `\\d` обозначает digit (любую цифру от 0 до 9), а квантификатор `+` означает одно или более вхождений.\n\n---\n\n### Вопрос 4\nЧто такое пропуск типа MNAR (Missing Not at Random) и почему его нельзя заполнять средним?\n- [ ] Это случайный сбой сетевого оборудования.\n- [x] Вероятность пропуска напрямую связана со скрытым значением величины (например, респонденты с экстремально высоким доходом скрывают его), и заполнение средним исказит распределение.\n- [ ] Пропуски MNAR всегда равны нулю.\n*Объяснение*: Заполнение MNAR средним или медианой радикально смещает статистические тесты.\n\n---\n\n### Вопрос 5\nКак метод межквартильного размаха (IQR) находит выбросы в данных?\n- [ ] Он делит все значения на 100.\n- [x] Выбросами считаются точки за пределами диапазона [Q1 - 1.5 * IQR, Q3 + 1.5 * IQR], где IQR = Q3 - Q1.\n- [ ] Выбросами считаются все отрицательные числа.\n*Объяснение*: Правило 1.5*IQR Тьюки робастно к аномалиям, в отличие от стандартного отклонения.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 1. Грязные данные: типы данных, пропуски (NaN/None) и стратегии их заполнения\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\n\n## 📌 Бизнес-контекст и методология\n«Garbage In, Garbage Out» — главное правило анализа данных. До 80% времени дата-аналитика уходит на предобработку и очистку данных. \nСлепое удаление строк с пропусками (`.dropna()`) может исказить выборку (например, потерять всех новых пользователей, у которых еще нет истории заказов)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubus
