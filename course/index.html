    const courseData = [{"id": "module_00_onboarding", "title": "Модуль 0. Онбординг и мышление аналитика", "category": "Фундамент", "badge": "Старт", "readme": "# 🚀 Модуль 0: Онбординг и мышление Data Analyst 2027\n\n## 📌 О модуле\nДобро пожаловать в профессию! Аналитика данных образца 2027 года фундаментально отличается от того, что было 5 лет назад. Рутинный синтаксис SQL и Python берет на себя искусственный интеллект, а от аналитика требуются **Problem Framing**, архитектурное понимание данных, формулирование ТЗ для AI и глубокое бизнес-видение.\n\n## 🎯 Learning Outcomes (Таксономия Блума)\n- **Remember**: Терминология (Data Analyst vs Data Scientist, CRISP-DM, EDA, KPI, Pipeline).\n- **Understand**: Отличия роли аналитика до и после AI-революции; архитектуру современного стека данных.\n- **Apply**: Развертывание рабочего окружения в Google Colab, подключение AI-ассистентов, создание первого репозитория на GitHub.\n- **Analyze**: Декомпозиция сырой проблемы бизнеса в систему метрик и аналитических задач.\n\n## 📚 Содержание уроков\n1. `lesson_01_role_data_analyst_2027.ipynb` — Профессия аналитика в эпоху AI: ландшафт рынка, карта компетенций, день из жизни.\n2. `lesson_02_environment_setup_colab_ai.ipynb` — Среда разработки: Google Colab, VS Code, Git, настройка Copilot/Cursor/Claude.\n3. `lesson_03_analytical_thinking_crisp_dm.ipynb` — Аналитическое мышление: методология CRISP-DM, перевод бизнес-боли в метрики.\n4. `quiz.md` — Тест для самопроверки (Active Recall).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 0 (Онбординг & Аналитическое мышление)\n\n---\n\n### Вопрос 1\nВ чем заключается фундаментальное отличие роли Data Analyst 2027 года от роли 2020 года?\n- [ ] В 2027 году аналитики больше не используют базы данных и SQL.\n- [x] В 2027 году рутинное написание кода автоматизировано AI, а фокус сместился на Problem Framing, постановку ТЗ для LLM, фактчекинг и Data Storytelling.\n- [ ] В 2027 году аналитик обязан обучать собственные нейросети на суперкомпьютере.\n*Объяснение*: Рутинный синтаксис генерируют LLM. Главная ценность человека — перевод бизнес-проблем в метрики, критический аудит кода и коммуникация решений с топ-менеджментом.\n\n---\n\n### Вопрос 2\nРуководство компании жалуется: *«В этом месяце выручка упала на 10%, срочно удвойте расходы на маркетинг»*. Каково первое действие профессионального аналитика?\n- [ ] Сразу согласовать бюджет и запустить рекламу.\n- [x] Декомпозировать выручку на метрики Traffic * CR * AOV, сегментировать данные по платформам/каналам и локализовать причину падения.\n- [ ] Построить круговую диаграмму продаж.\n*Объяснение*: Если просадка вызвана техническим багом в чекауте или падением среднего чека, заливка нового рекламного трафика лишь сожжет деньги компании без роста продаж.\n\n---\n\n### Вопрос 3\nКакой этап методологии CRISP-DM является первым и самым важным для успеха проекта?\n- [ ] Data Preparation (Очистка данных).\n- [ ] Modeling (Построение моделей).\n- [x] Business Understanding (Понимание бизнес-контекста и целей).\n*Объяснение*: Не поняв экономический смысл задачи и решение, которое будет приниматься, аналитик рискует построить идеальный технический отчет, который окажется бесполезен бизнесу.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_role_data_analyst_2027.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 0. Урок 1: Профессия Data Analyst в эпоху генеративного ИИ (2027)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Фундаментальный сдвиг роли: от «SQL-машиниста» к Архитектору решений\\n\",\n        \"\\n\",\n        \"В 2018–2022 годах 80% рабочего времени аналитика данных уходило на техническую рутину:\\n\",\n        \"- Написание однотипных запросов `SELECT ... JOIN ... GROUP BY`;\\n\",\n        \"- Ручная замена точек на запятые в Excel;\\n\",\n        \"- Бесконечный поиск синтаксиса Pandas на StackOverflow;\\n\",\n        \"- Построение простых графиков по просьбе менеджеров («построй мне диаграмму продаж по регионам к обеду»).\\n\",\n        \"\\n\",\n        \"**К осени 2026 — 2027 года этот рынок закрылся.** Модели уровня Claude 3.7 Sonnet, OpenAI o3 и Gemini 2.5 генерируют идеальный синтаксический код за секунды. Классический «джуниор», знавший только базовый SQL и пару функций Pandas, стал экономически нецелесообразен для найма.\\n\",\n        \"\\n\",\n        \"### Кем стал Data Analyst нового поколения?\\n\",\n        \"Современный аналитик — это **переводчик между болью бизнеса и данными**:\\n\",\n        \"1. **Problem Framing (Постановка задачи)**: Бизнес приходит с туманной фразой: *«Кажется, у нас что-то не то с мобильным приложением»*. Аналитик переводит это в дерево измеримых метрик, формулирует проверяемые гипотезы и ставит техническое задание AI-ассистентам.\\n\",\n        \"2. **AI Orchestration (Управление ансамблем инструментов)**: Написание точных системных промптов для генерации пайплайнов, использование Cursor и Copilot для мгновенного прототипирования.\\n\",\n        \"3. **Data Verification & Zero Hallucination (Валидация и защита от ошибок)**: Нейросеть не несет финансовой ответственности за галлюцинацию в отчете. Аналитик владеет чеклистами верификации математических инвариантов и логики агрегаций.\\n\",\n        \"4. **Data Storytelling & Influence (Влияние на бизнес)**: Цифры сами по себе не имеют ценности. Ценность имеет решение CEO/CPO, принятое на их основе.\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"┌─────────────────────────────────────────────────────────────────────────────┐\\n\",\n        \"│                       АНАТОМИЯ СТОИМОСТИ АНАЛИТИКА 2027                     │\\n\",\n        \"├─────────────────────────────────────────────────────────────────────────────┤\\n\",\n        \"│  5%   │ Синтаксис (написание базового кода вручную)                          │\\n\",\n        \"│  25%  │ AI-оркестрация и архитектура витрин данных                          │\\n\",\n        \"│  30%  │ Валидация, фактчекинг и защита от галлюцинаций                       │\\n\",\n        \"│  40%  │ Data Storytelling, юнит-экономика и защита решений перед бизнесом    │\\n\",\n        \"└─────────────────────────────────────────────────────────────────────────────┘\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 2. Реальный бизнес-кейс: \\\"Загадочное падение продаж в Black Friday\\\"\\n\",\n        \"\\n\",\n        \"### Контекст компании\\n\",\n        \"Крупный омниканальный ритейлер электроники (500 000 MAU). В Черную пятницу коммерческий директор в панике: *«Выручка на 15% ниже прогноза, хотя бюджет на рекламу удвоен! Маркетологи говорят, что трафик рекордный. Разберитесь!»*\\n\",\n        \"\\n\",\n        \"### Как действует слабый аналитик (подход 2020 года):\\n\",\n        \"- Строит график выручки по часам.\\n\",\n        \"- Пишет в чат: *«Да, действительно, выручка упала на 15%. Вот график»*.\\n\",\n        \"- Тратит 2 дня на ручное ковыряние логов, бизнес теряет миллионы рублей прямо сейчас.\\n\",\n        \"\\n\",\n        \"### Как действует современный аналитик (AI-Assisted Workflow):\\n\",\n        \"1. Мгновенно раскладывает выручку на множители верхнего уровня:\\n\",\n        \"   $$\\\\text{Revenue} = \\\\text{Traffic} \\\\times \\\\text{CR (Conversion Rate)} \\\\times \\\\text{AOV (Average Order Value)}$$\\n\",\n        \"2. Пишет короткое ТЗ для AI: *«Сгенерируй скрипт для расчета динамики Traffic, CR и AOV по 15-минутным интервалам с разбивкой по платформам (iOS, Android, Web) и платежным шлюзам»*.\\n\",\n        \"3. Валидирует код и запускает.\\n\",\n        \"4. Обнаруживает: трафик вырос на 45%, AOV стабилен, но **конверсия на iOS версии 18.2 упала с 3.8% до 0.2%** из-за сбоя авторизации в SDK СБП (Системы быстрых платежей).\\n\",\n        \"5. Через 12 минут после запроса баг передан разработчикам, хотфикс выкачен, компания спасла 28 млн рублей выручки.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Практическая симуляция кейса Black Friday: декомпозиция сбоя\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"# Симулируем 15-минутные интервалы Черной пятницы\\n\",\n        \"np.random.seed(42)\\n\",\n        \"time_slots = pd.date_range(\\\"2026-11-27 08:00\\\", \\\"2026-11-27 14:00\\\", freq=\\\"15min\\\")\\n\",\n        \"\\n\",\n        \"data = []\\n\",\n        \"for t in time_slots:\\n\",\n        \"    # Базовый трафик растет к полудню\\n\",\n        \"    traffic_web = np.random.randint(1200, 1800)\\n\",\n        \"    traffic_android = np.random.randint(2000, 2600)\\n\",\n        \"    traffic_ios = np.random.randint(2500, 3200)\\n\",\n        \"    \\n\",\n        \"    # Нормальная конверсия 3.5%\\n\",\n        \"    cr_web = np.random.normal(0.035, 0.002)\\n\",\n        \"    cr_android = np.random.normal(0.036, 0.002)\\n\",\n        \"    \\n\",\n        \"    # В 10:15 на iOS выкатили сбойный билд SDK платежей!\\n\",\n        \"    if t >= pd.Timestamp(\\\"2026-11-27 10:15\\\"):\\n\",\n        \"        cr_ios = np.random.normal(0.003, 0.001) # Просадка в 10 раз!\\n\",\n        \"    else:\\n\",\n        \"        cr_ios = np.random.normal(0.038, 0.002)\\n\",\n        \"        \\n\",\n        \"    data.append({'timestamp': t, 'platform': 'Desktop Web', 'traffic': traffic_web, 'cr': cr_web, 'aov': 4200})\\n\",\n        \"    data.append({'timestamp': t, 'platform': 'Android App', 'traffic': traffic_android, 'cr': cr_android, 'aov': 3900})\\n\",\n        \"    data.append({'timestamp': t, 'platform': 'iOS App', 'traffic': traffic_ios, 'cr': cr_ios, 'aov': 4800})\\n\",\n        \"\\n\",\n        \"df_incident = pd.DataFrame(data)\\n\",\n        \"df_incident['orders'] = (df_incident['traffic'] * df_incident['cr']).round(0)\\n\",\n        \"df_incident['revenue'] = df_incident['orders'] * df_incident['aov']\\n\",\n        \"\\n\",\n        \"# Сводный анализ по платформам до и после 10:15\\n\",\n        \"df_incident['incident_phase'] = np.where(df_incident['timestamp'] < '2026-11-27 10:15', 'До инцидента', 'Во время инцидента')\\n\",\n        \"\\n\",\n        \"summary = df_incident.groupby(['incident_phase', 'platform']).agg(\\n\",\n        \"    avg_cr=('cr', lambda x: f\\\"{x.mean()*100:.2f}%\\\"),\\n\",\n        \"    total_revenue=('revenue', lambda x: f\\\"{x.sum():,.0f} руб\\\")\\n\",\n        \").unstack(level=0)\\n\",\n        \"\\n\",\n        \"print(\\\"=== РЕЗУЛЬТАТ ЛОКАЛИЗАЦИИ ПРОБЛЕМЫ АНАЛИТИКОМ ===\\\")\\n\",\n        \"print(summary)\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## 3. Типичные ловушки новичков (Red Flags)\\n\",\n        \"1. **Ловушка агрегированных данных**: Смотреть на среднюю конверсию по всей компании. В общем котле просадка iOS выглядит как «легкое колебание», но внутри сегмента — катастрофа. Всегда сегментируйте!\\n\",\n        \"2. **Синдром курьера**: Принести график без ответа на вопрос: *«И что нам с этим делать?»*. Аналитик всегда должен давать **Action Item** (рекомендацию к действию).\\n\",\n        \"3. **Слепая вера коду AI**: Попросить ИИ посчитать среднюю конверсию, не проверив, посчитал ли он среднее от процентов (математическая ошибка!) или разделил сумму заказов на сумму сессий.\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 4. Практическое задание (Hands-on Practice)\\n\",\n        \"1. Измените в коде выше время начала инцидента на 11:30.\\n\",\n        \"2. Добавьте проверку: сколько недополученной выручки (Lost Revenue) принес сбой за время инцидента по сравнению с базовым сценарием?\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 0. Урок 1: Профессия Data Analyst в эпоху генеративного ИИ (2027)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb)\n\n---\n\n## 1. Фундаментальный сдвиг роли: от «SQL-машиниста» к Архитектору решений\n\nВ 2018–2022 годах 80% рабочего времени аналитика данных уходило на техническую рутину:\n- Написание однотипных запросов `SELECT ... JOIN ... GROUP BY`;\n- Ручная замена точек на запятые в Excel;\n- Бесконечный поиск синтаксиса Pandas на StackOverflow;\n- Построение простых графиков по просьбе менеджеров («построй мне диаграмму продаж по регионам к обеду»).\n\n**К осени 2026 — 2027 года этот рынок закрылся.** Модели уровня Claude 3.7 Sonnet, OpenAI o3 и Gemini 2.5 генерируют идеальный синтаксический код за секунды. Классический «джуниор», знавший только базовый SQL и пару функций Pandas, стал экономически нецелесообразен для найма.\n\n### Кем стал Data Analyst нового поколения?\nСовременный аналитик — это **переводчик между болью бизнеса и данными**:\n1. **Problem Framing (Постановка задачи)**: Бизнес приходит с туманной фразой: *«Кажется, у нас что-то не то с мобильным приложением»*. Аналитик переводит это в дерево измеримых метрик, формулирует проверяемые гипотезы и ставит техническое задание AI-ассистентам.\n2. **AI Orchestration (Управление ансамблем инструментов)**: Написание точных системных промптов для генерации пайплайнов, использование Cursor и Copilot для мгновенного прототипирования.\n3. **Data Verification & Zero Hallucination (Валидация и защита от ошибок)**: Нейросеть не несет финансовой ответственности за галлюцинацию в отчете. Аналитик владеет чеклистами верификации математических инвариантов и логики агрегаций.\n4. **Data Storytelling & Influence (Влияние на бизнес)**: Цифры сами по себе не имеют ценности. Ценность имеет решение CEO/CPO, принятое на их основе.\n\n```\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                       АНАТОМИЯ СТОИМОСТИ АНАЛИТИКА 2027                     │\n├─────────────────────────────────────────────────────────────────────────────┤\n│  5%   │ Синтаксис (написание базового кода вручную)                          │\n│  25%  │ AI-оркестрация и архитектура витрин данных                          │\n│  30%  │ Валидация, фактчекинг и защита от галлюцинаций                       │\n│  40%  │ Data Storytelling, юнит-экономика и защита решений перед бизнесом    │\n└─────────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Загадочное падение продаж в Black Friday\"\n\n### Контекст компании\nКрупный омниканальный ритейлер электроники (500 000 MAU). В Черную пятницу коммерческий директор в панике: *«Выручка на 15% ниже прогноза, хотя бюджет на рекламу удвоен! Маркетологи говорят, что трафик рекордный. Разберитесь!»*\n\n### Как действует слабый аналитик (подход 2020 года):\n- Строит график выручки по часам.\n- Пишет в чат: *«Да, действительно, выручка упала на 15%. Вот график»*.\n- Тратит 2 дня на ручное ковыряние логов, бизнес теряет миллионы рублей прямо сейчас.\n\n### Как действует современный аналитик (AI-Assisted Workflow):\n1. Мгновенно раскладывает выручку на множители верхнего уровня:\n   $$\\text{Revenue} = \\text{Traffic} \\times \\text{CR (Conversion Rate)} \\times \\text{AOV (Average Order Value)}$$\n2. Пишет короткое ТЗ для AI: *«Сгенерируй скрипт для расчета динамики Traffic, CR и AOV по 15-минутным интервалам с разбивкой по платформам (iOS, Android, Web) и платежным шлюзам»*.\n3. Валидирует код и запускает.\n4. Обнаруживает: трафик вырос на 45%, AOV стабилен, но **конверсия на iOS версии 18.2 упала с 3.8% до 0.2%** из-за сбоя авторизации в SDK СБП (Системы быстрых платежей).\n5. Через 12 минут после запроса баг передан разработчикам, хотфикс выкачен, компания спасла 28 млн рублей выручки.\n"}, {"type": "code", "content": "# Практическая симуляция кейса Black Friday: декомпозиция сбоя\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# Симулируем 15-минутные интервалы Черной пятницы\nnp.random.seed(42)\ntime_slots = pd.date_range(\"2026-11-27 08:00\", \"2026-11-27 14:00\", freq=\"15min\")\n\ndata = []\nfor t in time_slots:\n    # Базовый трафик растет к полудню\n    traffic_web = np.random.randint(1200, 1800)\n    traffic_android = np.random.randint(2000, 2600)\n    traffic_ios = np.random.randint(2500, 3200)\n    \n    # Нормальная конверсия 3.5%\n    cr_web = np.random.normal(0.035, 0.002)\n    cr_android = np.random.normal(0.036, 0.002)\n    \n    # В 10:15 на iOS выкатили сбойный билд SDK платежей!\n    if t >= pd.Timestamp(\"2026-11-27 10:15\"):\n        cr_ios = np.random.normal(0.003, 0.001) # Просадка в 10 раз!\n    else:\n        cr_ios = np.random.normal(0.038, 0.002)\n        \n    data.append({'timestamp': t, 'platform': 'Desktop Web', 'traffic': traffic_web, 'cr': cr_web, 'aov': 4200})\n    data.append({'timestamp': t, 'platform': 'Android App', 'traffic': traffic_android, 'cr': cr_android, 'aov': 3900})\n    data.append({'timestamp': t, 'platform': 'iOS App', 'traffic': traffic_ios, 'cr': cr_ios, 'aov': 4800})\n\ndf_incident = pd.DataFrame(data)\ndf_incident['orders'] = (df_incident['traffic'] * df_incident['cr']).round(0)\ndf_incident['revenue'] = df_incident['orders'] * df_incident['aov']\n\n# Сводный анализ по платформам до и после 10:15\ndf_incident['incident_phase'] = np.where(df_incident['timestamp'] < '2026-11-27 10:15', 'До инцидента', 'Во время инцидента')\n\nsummary = df_incident.groupby(['incident_phase', 'platform']).agg(\n    avg_cr=('cr', lambda x: f\"{x.mean()*100:.2f}%\"),\n    total_revenue=('revenue', lambda x: f\"{x.sum():,.0f} руб\")\n).unstack(level=0)\n\nprint(\"=== РЕЗУЛЬТАТ ЛОКАЛИЗАЦИИ ПРОБЛЕМЫ АНАЛИТИКОМ ===\")\nprint(summary)\n"}, {"type": "markdown", "content": "## 3. Типичные ловушки новичков (Red Flags)\n1. **Ловушка агрегированных данных**: Смотреть на среднюю конверсию по всей компании. В общем котле просадка iOS выглядит как «легкое колебание», но внутри сегмента — катастрофа. Всегда сегментируйте!\n2. **Синдром курьера**: Принести график без ответа на вопрос: *«И что нам с этим делать?»*. Аналитик всегда должен давать **Action Item** (рекомендацию к действию).\n3. **Слепая вера коду AI**: Попросить ИИ посчитать среднюю конверсию, не проверив, посчитал ли он среднее от процентов (математическая ошибка!) или разделил сумму заказов на сумму сессий.\n\n---\n\n## 4. Практическое задание (Hands-on Practice)\n1. Измените в коде выше время начала инцидента на 11:30.\n2. Добавьте проверку: сколько недополученной выручки (Lost Revenue) принес сбой за время инцидента по сравнению с базовым сценарием?\n"}]}, {"filename": "lesson_01_what_is_data_analyst.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"id\": \"cbab311d\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"# 📊 Урок 1: Кто такой Data Analyst в 2027 году\\n\",\n        \"\\n\",\n        \"**Модуль 0: Стартовая площадка** | Время: ~45 минут\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"> *«Данные — это новая нефть, а аналитик — тот, кто умеет её перерабатывать в бензин для бизнеса»*\\n\",\n        \"\\n\",\n        \"## 🎯 Цели урока\\n\",\n        \"\\n\",\n        \"После этого урока вы сможете:\\n\",\n        \"- ✅ Объяснить, кто такой Data Analyst и чем он занимается\\n\",\n        \"- ✅ Понять, чем аналитик 2027 года отличается от аналитика 2020 года\\n\",\n        \"- ✅ Перечислить ключевые навыки: Hard Skills, Soft Skills, AI Skills\\n\",\n        \"- ✅ Различать типы аналитиков: продуктовый, маркетинговый, финансовый, BI\\n\",\n        \"- ✅ Понять карьерный путь и уровни зарплат\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"d169cb04\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Кто такой Data Analyst? 🤔\\n\",\n        \"\\n\",\n        \"### Аналогия: Аналитик — это «переводчик» между данными и бизнесом\\n\",\n        \"\\n\",\n        \"Представьте ситуацию: у вашей компании есть огромный склад с коробками. В каждой коробке — числа, даты, имена, суммы покупок, клики на сайте. **Сами по себе эти коробки бесполезны.** Никто не знает, что с ними делать.\\n\",\n        \"\\n\",\n        \"**Data Analyst** — это человек, который:\\n\",\n        \"1. 📦 **Открывает коробки** (собирает и чистит данные)\\n\",\n        \"2. 🔍 **Находит паттерны** (анализирует, что происходит)\\n\",\n        \"3. 📝 **Пишет историю** (визуализирует и объясняет результаты)\\n\",\n        \"4. 💡 **Даёт рекомендации** (помогает бизнесу принять решение)\\n\",\n        \"\\n\",\n        \"### Простой пример\\n\",\n        \"\\n\",\n        \"Менеджер спрашивает: *«Почему у нас упали продажи в марте?»*\\n\",\n        \"\\n\",\n        \"Аналитик:\\n\",\n        \"- Достаёт данные о продажах за последний год\\n\",\n        \"- Смотрит, какие товары «просели»\\n\",\n        \"- Находит, что скидки конкурента совпали с падением\\n\",\n        \"- Показывает это на графике\\n\",\n        \"- Рекомендует: «Давайте запустим акцию на топ-3 товара»\\n\",\n        \"\\n\",\n        \"**Без аналитика** менеджер бы гадал наугад. **С аналитиком** — принимает решение на основе фактов.\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"7d168388\",\n      \"cell_type\": \"markdown\",\n      \"source\": [\n        \"---\\n\",\n        \"\\n\",\n        \"## 2. Аналитик 2020 vs Аналитик 2027 🕰️ → 🚀\\n\",\n        \"\\n\",\n        \"Профессия аналитика радикально изменилась. Вот ключевые отличия:\\n\",\n        \"\\n\",\n        \"| Аспект | Аналитик 2020 | Аналитик 2027 |\\n\",\n        \"|--------|--------------|---------------|\\n\",\n        \"| **Основная работа** | Писать SQL-запросы, строить графики в Excel | Формулировать правильные вопросы, интерпретировать результаты AI |\\n\",\n        \"| **Рутина** | 60-70% времени на чистку данных | AI автоматизирует 80% чистки, аналитик проверяет результат |\\n\",\n        \"| **Инструменты** | Excel, SQL, Tableau | Python + AI-ассистенты, SQL, BI-платформы |\\n\",\n        \"| **Роль AI** | Почти не использовался | Ежедневный инструмент: генерация кода, EDA, визуализации |\\n\",\n        \"| **Коммуникация** | Отчёт раз в неделю | Real-time дашборды + storytelling с данными |\\n\",\n        \"| **Ценность** | «Человек, который делает отчёты» | «Человек, который находит инсайты и влияет на решения» |\\n\",\n        \"| **Скорость** | Неделя на анализ | Часы на анализ (с помощью AI) |\\n\",\n        \"\\n\",\n        \"### Главный сдвиг\\n\",\n        \"\\n\",\n        \"> **2020:** Аналитик ценился за то, что *умел писать сложные запросы*.\\n\",\n        \">\\n\",\n        \"> **2027:** Аналитик ценится за то, что *умеет задавать правильные вопросы* и *превращать данные в действия*.\\n\",\n        \"\\n\",\n        \"Это не значит, что технические навыки не нужны — наоборот! Но теперь вы можете использовать AI как «второго пилота», который помогает с кодом, пока вы фокусируетесь на **смысле данных**.\"\n      ],\n      \"metadata\": {}\n    },\n    {\n      \"id\": \"71ab4872\",\n      \"cell_type\": \"code\",\n      \"source\": [\n        \"# 🎯 Давайте визуализируем, как изменилось распределение времени аналитика\\n\",\n        \"\\n\",\n        \"# Это ваш первый код! Не бойтесь — просто нажмите ▶️ (Play) слева от ячейки\\n\",\n        \"\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import matplotlib\\n\",\n        \"matplotlib.rcParams['font.size'] = 12\\n\",\n        \"\\n\",\n        \"# --- Аналитик 2020 ---\\n\",\n        \"tasks_2020 = ['Сбор и\\\\nчистка данных', 'Написание\\\\nзапросов/кода', 'Анализ и\\\\nвизуализация', 'Коммуникация\\\\nс бизнесом']\\n\",\n        \"time_2020 = [40, 25, 20, 15]\\n\",\n        \"colors_2020 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\\n\",\n        \"\\n\",\n        \"# --- Аналитик 2027 ---\\n\",\n        \"tasks_2027 = ['Проверка данных\\\\n(AI делает чистку)', 'Промптинг AI +\\\\nпроверка кода', 'Глубокий анализ\\\\nи инсайты', 'Storytelling и\\\\nбизнес-решения']\\n\",\n        \"time_2027 = [15, 20, 30, 35]\\n\",\n        \"colors_2027 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\\n\",\n        \"\\n\",\n        \"fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6))\\n\",\n        \"\\n\",\n        \"# Круговая диаграмма 2020\\n\",\n        \"ax1.pie(time_2020, labels=tasks_2020, autopct='%1.0f%%', colors=colors_2020,\\n\",\n        \"        startangle=90, textprops={'fontsize': 10})\\n\",\n        \"ax1.set_title('⏰ Рабочий день аналитика 2020', fontsize=14, fontweight='bold')\\n\",\n        \"\\n\",\n        \"# Круговая диаграмма 2027\\n\",\n        \"ax2.pie(time_2027, labels=tasks_2027, autopct='%1.0f%%', colors=colors_2027,\\n\",\n        \"        startangle=90, textprops={'fontsize': 10})\\n\",\n        \"ax2.set_title('🚀 Рабочий день аналитика 2027', fontsize=14, fontweight='bold')\\n\",\n        \"\\n\",\n        \"plt.suptitle('Как AI изменил работу аналитика', fontsize=16, fontweight='bold', y=1.02)\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\\n\",\n        \"print(\\\"📊 Обратите внимание: в 2027 году аналитик тратит БОЛЬШЕ времени на анализ и коммуникацию,\\\")\\n\",\n        \"print(\\\"   а AI берёт на себя рутину сбора и чистки данных!\\\")\"\n      ],\n      \"metadata\": {},\n      \"execution_count\": null,\n      \"outputs\": []\n    }\n  ],\n  \"metadata\": {\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"language\": \"python\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 5\n}\n", "cells": [{"type": "markdown", "content": "# 📊 Урок 1: Кто такой Data Analyst в 2027 году\n\n**Модуль 0: Стартовая площадка** | Время: ~45 минут\n\n---\n\n> *«Данные — это новая нефть, а аналитик — тот, кто умеет её перерабатывать в бензин для бизнеса»*\n\n## 🎯 Цели урока\n\nПосле этого урока вы сможете:\n- ✅ Объяснить, кто такой Data Analyst и чем он занимается\n- ✅ Понять, чем аналитик 2027 года отличается от аналитика 2020 года\n- ✅ Перечислить ключевые навыки: Hard Skills, Soft Skills, AI Skills\n- ✅ Различать типы аналитиков: продуктовый, маркетинговый, финансовый, BI\n- ✅ Понять карьерный путь и уровни зарплат"}, {"type": "markdown", "content": "---\n\n## 1. Кто такой Data Analyst? 🤔\n\n### Аналогия: Аналитик — это «переводчик» между данными и бизнесом\n\nПредставьте ситуацию: у вашей компании есть огромный склад с коробками. В каждой коробке — числа, даты, имена, суммы покупок, клики на сайте. **Сами по себе эти коробки бесполезны.** Никто не знает, что с ними делать.\n\n**Data Analyst** — это человек, который:\n1. 📦 **Открывает коробки** (собирает и чистит данные)\n2. 🔍 **Находит паттерны** (анализирует, что происходит)\n3. 📝 **Пишет историю** (визуализирует и объясняет результаты)\n4. 💡 **Даёт рекомендации** (помогает бизнесу принять решение)\n\n### Простой пример\n\nМенеджер спрашивает: *«Почему у нас упали продажи в марте?»*\n\nАналитик:\n- Достаёт данные о продажах за последний год\n- Смотрит, какие товары «просели»\n- Находит, что скидки конкурента совпали с падением\n- Показывает это на графике\n- Рекомендует: «Давайте запустим акцию на топ-3 товара»\n\n**Без аналитика** менеджер бы гадал наугад. **С аналитиком** — принимает решение на основе фактов."}, {"type": "markdown", "content": "---\n\n## 2. Аналитик 2020 vs Аналитик 2027 🕰️ → 🚀\n\nПрофессия аналитика радикально изменилась. Вот ключевые отличия:\n\n| Аспект | Аналитик 2020 | Аналитик 2027 |\n|--------|--------------|---------------|\n| **Основная работа** | Писать SQL-запросы, строить графики в Excel | Формулировать правильные вопросы, интерпретировать результаты AI |\n| **Рутина** | 60-70% времени на чистку данных | AI автоматизирует 80% чистки, аналитик проверяет результат |\n| **Инструменты** | Excel, SQL, Tableau | Python + AI-ассистенты, SQL, BI-платформы |\n| **Роль AI** | Почти не использовался | Ежедневный инструмент: генерация кода, EDA, визуализации |\n| **Коммуникация** | Отчёт раз в неделю | Real-time дашборды + storytelling с данными |\n| **Ценность** | «Человек, который делает отчёты» | «Человек, который находит инсайты и влияет на решения» |\n| **Скорость** | Неделя на анализ | Часы на анализ (с помощью AI) |\n\n### Главный сдвиг\n\n> **2020:** Аналитик ценился за то, что *умел писать сложные запросы*.\n>\n> **2027:** Аналитик ценится за то, что *умеет задавать правильные вопросы* и *превращать данные в действия*.\n\nЭто не значит, что технические навыки не нужны — наоборот! Но теперь вы можете использовать AI как «второго пилота», который помогает с кодом, пока вы фокусируетесь на **смысле данных**."}, {"type": "code", "content": "# 🎯 Давайте визуализируем, как изменилось распределение времени аналитика\n\n# Это ваш первый код! Не бойтесь — просто нажмите ▶️ (Play) слева от ячейки\n\nimport matplotlib.pyplot as plt\nimport matplotlib\nmatplotlib.rcParams['font.size'] = 12\n\n# --- Аналитик 2020 ---\ntasks_2020 = ['Сбор и\\nчистка данных', 'Написание\\nзапросов/кода', 'Анализ и\\nвизуализация', 'Коммуникация\\nс бизнесом']\ntime_2020 = [40, 25, 20, 15]\ncolors_2020 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\n# --- Аналитик 2027 ---\ntasks_2027 = ['Проверка данных\\n(AI делает чистку)', 'Промптинг AI +\\nпроверка кода', 'Глубокий анализ\\nи инсайты', 'Storytelling и\\nбизнес-решения']\ntime_2027 = [15, 20, 30, 35]\ncolors_2027 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6))\n\n# Круговая диаграмма 2020\nax1.pie(time_2020, labels=tasks_2020, autopct='%1.0f%%', colors=colors_2020,\n        startangle=90, textprops={'fontsize': 10})\nax1.set_title('⏰ Рабочий день аналитика 2020', fontsize=14, fontweight='bold')\n\n# Круговая диаграмма 2027\nax2.pie(time_2027, labels=tasks_2027, autopct='%1.0f%%', colors=colors_2027,\n        startangle=90, textprops={'fontsize': 10})\nax2.set_title('🚀 Рабочий день аналитика 2027', fontsize=14, fontweight='bold')\n\nplt.suptitle('Как AI изменил работу аналитика', fontsize=16, fontweight='bold', y=1.02)\nplt.tight_layout()\nplt.show()\n\nprint(\"📊 Обратите внимание: в 2027 году аналитик тратит БОЛЬШЕ времени на анализ и коммуникацию,\")\nprint(\"   а AI берёт на себя рутину сбора и чистки данных!\")"}]}, {"filename": "lesson_02_environment_setup_colab_ai.ipynb", "rel_path": "course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \" \\n\",\n        \"- Партнер фонда открывает ноутбук: падает ошибка `FileNotFoundError: C:/Users/Vasya/Downloads/data_final_v2_NEW.csv`, версии Pandas не совпадают, функции устарели.\\n\",\n        \"- Сделка под угрозой: инвесторы сомневаются в технической зрелости команды.\\n\",\n        \"\\n\",\n        \"### Стандарт индустрии 2027:\\n\",\n        \"1. Ноутбук должен открываться в **1 клик в Google Colab**.\\n\",\n        \"2. Данные загружаются либо из облачного хранилища, либо генерируются/выгружаются скриптом автоматически.\\n\",\n        \"3. В начале каждого файла — блок фиксации версий зависимостей (`requirements.txt`).\\n\",\n        \"4. Все выводы сформулированы в Markdown-ячейках с четкой структурой.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация полностью автономного и воспроизводимого блока данных\\n\",\n        \"import sys\\n\",\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Проверка версий\\n\",\n        \"assert sys.version_info >= (3, 9), \\\"Требуется Python 3.9 или выше\\\"\\n\",\n        \"\\n\",\n        \"print(\\\" Среда верифицирована:\\\")\\n\",\n        \"print(f\\\"- Python: {sys.version.split()[0]}\\\")\\n\",\n        \"print(f\\\"- Pandas: {pd.__version__}\\\")\\n\",\n        \"print(f\\\"- NumPy : {np.__version__}\\\")\\n\",\n        \"\\n\",\n        \"# Создание демо-когорты, не зависящей от локального диска\\n\",\n        \"dates = pd.date_range('2026-01-01', periods=12, freq='ME')\\n\",\n        \"cohort_mock = pd.DataFrame({\\n\",\n        \"    'Cohort': [d.strftime('%Y-%m') for d in dates],\\n\",\n        \"    'New_Users': np.random.randint(1500, 3000, 12),\\n\",\n        \"    'Month_1_Retention': np.random.uniform(0.35, 0.45, 12).round(3),\\n\",\n        \"    'Month_3_Retention': np.random.uniform(0.20, 0.28, 12).round(3)\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\nПример воспроизводимого артефакта когорт:\\\")\\n\",\n        \"print(cohort_mock.head(4))\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## 3. Чеклист готовности рабочего окружения\\n\",\n        \"- [ ] Аккаунт в Google (для Google Colab и Looker Studio).\\n\",\n        \"- [ ] Аккаунт на GitHub (для портфолио и контроля версий).\\n\",\n        \"- [ ] Настроенный редактор (Cursor или VS Code).\\n\",\n        \"- [ ] Доступ к LLM-ассистенту (ChatGPT Plus / Claude Pro / Cursor Agent).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛠️ Модуль 0. Урок 2: Развертывание рабочего окружения и AI-стека аналитика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb)\n\n---\n\n## 1. Архитектура рабочего места 2027: Cloud First + Local AI IDE\n\nСовременный специалист использует гибридную инфраструктуру:\n\n```\n┌────────────────────────────────────────────────────────────────────────┐\n│                        РАБОЧАЯ СРЕДА АНАЛИТИКА                         │\n├──────────────────────────────────┬─────────────────────────────────────┤\n│      ОБЛАЧНАЯ СРЕДА (CLOUD)      │     ЛОКАЛЬНАЯ СРЕДА (LOCAL IDE)     │\n├──────────────────────────────────┼─────────────────────────────────────┤\n│ • Google Colab (Zero Config)     │ • Cursor IDE (AI-native редактор)   │\n│ • Облачные GPU/TPU при нужде     │ • VS Code + GitHub Copilot          │\n│ • Google Drive / BigQuery        │ • Git + GitHub (версионирование)    │\n│ • Looker Studio (BI)             │ • Локальный SQLite / DuckDB         │\n└──────────────────────────────────┴─────────────────────────────────────┘\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Воспроизводимость отчета для инвесторов\"\n\n### Ситуация\nСтартап закрывает раунд финансирования Series A на \\$5 млн. Венчурный фонд просит предоставить когортный анализ за 2 года с кодом расчета Retention Rate.\n- Аналитик отправляет Jupyter ноутбук, сохраненный локально.\n- Партнер фонда открывает ноутбук: падает ошибка `FileNotFoundError: C:/Users/Vasya/Downloads/data_final_v2_NEW.csv`, версии Pandas не совпадают, функции устарели.\n- Сделка под угрозой: инвесторы сомневаются в технической зрелости команды.\n\n### Стандарт индустрии 2027:\n1. Ноутбук должен открываться в **1 клик в Google Colab**.\n2. Данные загружаются либо из облачного хранилища, либо генерируются/выгружаются скриптом автоматически.\n3. В начале каждого файла — блок фиксации версий зависимостей (`requirements.txt`).\n4. Все выводы сформулированы в Markdown-ячейках с четкой структурой.\n"}, {"type": "code", "content": "# Демонстрация полностью автономного и воспроизводимого блока данных\nimport sys\nimport pandas as pd\nimport numpy as np\n\n# Проверка версий\nassert sys.version_info >= (3, 9), \"Требуется Python 3.9 или выше\"\n\nprint(\" Среда верифицирована:\")\nprint(f\"- Python: {sys.version.split()[0]}\")\nprint(f\"- Pandas: {pd.__version__}\")\nprint(f\"- NumPy : {np.__version__}\")\n\n# Создание демо-когорты, не зависящей от локального диска\ndates = pd.date_range('2026-01-01', periods=12, freq='ME')\ncohort_mock = pd.DataFrame({\n    'Cohort': [d.strftime('%Y-%m') for d in dates],\n    'New_Users': np.random.randint(1500, 3000, 12),\n    'Month_1_Retention': np.random.uniform(0.35, 0.45, 12).round(3),\n    'Month_3_Retention': np.random.uniform(0.20, 0.28, 12).round(3)\n})\n\nprint(\"\\nПример воспроизводимого артефакта когорт:\")\nprint(cohort_mock.head(4))\n"}, {"type": "markdown", "content": "## 3. Чеклист готовности рабочего окружения\n- [ ] Аккаунт в Google (для Google Colab и Looker Studio).\n- [ ] Аккаунт на GitHub (для портфолио и контроля версий).\n- [ ] Настроенный редактор (Cursor или VS Code).\n- [ ] Доступ к LLM-ассистенту (ChatGPT Plus / Claude Pro / Cursor Agent).\n"}]}, {"filename": "lesson_03_analytical_thinking_crisp_dm.ipynb", "rel_path": "course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧠 Модуль 0. Урок 3: Аналитическое мышление и индустриальный стандарт CRISP-DM\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Методология CRISP-DM в деталях\\n\",\n        \"\\n\",\n        \"CRISP-DM (*Cross-Industry Standard Process for Data Mining*) — главный международный стандарт жизненного цикла работы с данными:\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"[1. Business Understanding] ─── \\\"Какую проблему бизнеса мы решаем и сколько денег это принесет?\\\"\\n\",\n        \"           │\\n\",\n        \"[2. Data Understanding]     ─── \\\"Какие данные есть, где они лежат, насколько они полны и достоверны?\\\"\\n\",\n        \"           │\\n\",\n        \"[3. Data Preparation]       ─── \\\"Очистка, джойны, обработка пропусков, фильтрация выбросов\\\"\\n\",\n        \"           │\\n\",\n        \"[4. Modeling & Analysis]    ─── \\\"Построение срезов, когорт, статтестов, регрессий или прогнозов\\\"\\n\",\n        \"           │\\n\",\n        \"[5. Evaluation]             ─── \\\"Ответил ли анализ на бизнес-вопрос? Нет ли ошибки в данных?\\\"\\n\",\n        \"           │\\n\",\n        \"[6. Deployment & Action]    ─── \\\"Внедрение дашборда, принятие решения о раскатке фичи, регламент\\\"\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 2. Реальный бизнес-кейс: \\\"Сеть кофеен у дома: почему падает повторная посещаемость?\\\"\\n\",\n        \"\\n\",\n        \"### Business Understanding\\n\",\n        \"Сеть из 45 кофеен фиксирует падение выручки со второго квартала на 12%. Руководство считает, что «надо запустить рекламу у блогеров».\\n\",\n        \"Аналитик проводит Problem Framing:\\n\",\n        \"- **Целевая бизнес-метрика**: 30-Day Repeat Purchase Rate (доля гостей, вернувшихся в течение 30 дней).\\n\",\n        \"- **Гипотеза бизнеса**: «О нас мало знают новые клиенты».\\n\",\n        \"- **Контргипотеза аналитика**: «Мы теряем уже пришедших клиентов из-за падения качества сервиса или вкуса кофе».\\n\",\n        \"\\n\",\n        \"### Data Understanding & Preparation\\n\",\n        \"Аналитик объединяет кассовые чеки с данными программы лояльности и отзывами на картах (Яндекс Карты, 2ГИС).\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Симуляция исследования сети кофеен\\n\",\n        \"np.random.seed(10)\\n\",\n        \"locations = [f\\\"Кофейня_{i}\\\" for i in range(1, 11)]\\n\",\n        \"\\n\",\n        \"coffee_data = []\\n\",\n        \"for loc in locations:\\n\",\n        \"    guests = np.random.randint(800, 1500)\\n\",\n        \"    repeat_rate = np.random.uniform(0.18, 0.48)\\n\",\n        \"    avg_speed_sec = np.random.randint(90, 320) # Время ожидания кофе\\n\",\n        \"    complaints = int(guests * np.random.uniform(0.01, 0.08))\\n\",\n        \"    \\n\",\n        \"    coffee_data.append({\\n\",\n        \"        'location': loc,\\n\",\n        \"        'monthly_guests': guests,\\n\",\n        \"        'repeat_rate': repeat_rate,\\n\",\n        \"        'avg_wait_seconds': avg_speed_sec,\\n\",\n        \"        'complaints_count': complaints\\n\",\n        \"    })\\n\",\n        \"\\n\",\n        \"df_coffee = pd.DataFrame(coffee_data)\\n\",\n        \"\\n\",\n        \"# Считаем корреляцию между скоростью отдачи кофе и повторными визитами\\n\",\n        \"corr_wait = df_coffee['avg_wait_seconds'].corr(df_coffee['repeat_rate'])\\n\",\n        \"print(f\\\"Корреляция между временем ожидания и Retention гостей: {corr_wait:.3f}\\\")\\n\",\n        \"print(\\\"Вывод: Сильная отрицательная связь! Чем дольше гость ждет напиток, тем ниже вероятность возврата.\\\")\\n\",\n        \"\\n\",\n        \"# Топ-3 проблемные точки\\n\",\n        \"worst_locations = df_coffee.sort_values(by='avg_wait_seconds', ascending=False).head(3)\\n\",\n        \"print(\\\"\\\\nТОП-3 ТОЧКИ С КРИТИЧЕСКИМ ВРЕМЕНЕМ ОЖИДАНИЯ:\\\")\\n\",\n        \"print(worst_locations[['location', 'avg_wait_seconds', 'repeat_rate', 'complaints_count']])\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"## 3. Бизнес-решение (Deployment / Action)\\n\",\n        \"Вместо слива 3 000 000 рублей на блогеров:\\n\",\n        \"1. Выявлена реальная причина: на точках с ожиданием > 4 минут гости уходят в кофейни конкурентов за углом.\\n\",\n        \"2. Закуплены скоростные темперы и настроен дополнительный бариста в утренний час-пик.\\n\",\n        \"3. Время ожидания снизилось до 110 секунд, возвратность гостей выросла на 7 п.п., выручка восстановилась за 3 недели.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧠 Модуль 0. Урок 3: Аналитическое мышление и индустриальный стандарт CRISP-DM\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb)\n\n---\n\n## 1. Методология CRISP-DM в деталях\n\nCRISP-DM (*Cross-Industry Standard Process for Data Mining*) — главный международный стандарт жизненного цикла работы с данными:\n\n```\n[1. Business Understanding] ─── \"Какую проблему бизнеса мы решаем и сколько денег это принесет?\"\n           │\n[2. Data Understanding]     ─── \"Какие данные есть, где они лежат, насколько они полны и достоверны?\"\n           │\n[3. Data Preparation]       ─── \"Очистка, джойны, обработка пропусков, фильтрация выбросов\"\n           │\n[4. Modeling & Analysis]    ─── \"Построение срезов, когорт, статтестов, регрессий или прогнозов\"\n           │\n[5. Evaluation]             ─── \"Ответил ли анализ на бизнес-вопрос? Нет ли ошибки в данных?\"\n           │\n[6. Deployment & Action]    ─── \"Внедрение дашборда, принятие решения о раскатке фичи, регламент\"\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Сеть кофеен у дома: почему падает повторная посещаемость?\"\n\n### Business Understanding\nСеть из 45 кофеен фиксирует падение выручки со второго квартала на 12%. Руководство считает, что «надо запустить рекламу у блогеров».\nАналитик проводит Problem Framing:\n- **Целевая бизнес-метрика**: 30-Day Repeat Purchase Rate (доля гостей, вернувшихся в течение 30 дней).\n- **Гипотеза бизнеса**: «О нас мало знают новые клиенты».\n- **Контргипотеза аналитика**: «Мы теряем уже пришедших клиентов из-за падения качества сервиса или вкуса кофе».\n\n### Data Understanding & Preparation\nАналитик объединяет кассовые чеки с данными программы лояльности и отзывами на картах (Яндекс Карты, 2ГИС).\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Симуляция исследования сети кофеен\nnp.random.seed(10)\nlocations = [f\"Кофейня_{i}\" for i in range(1, 11)]\n\ncoffee_data = []\nfor loc in locations:\n    guests = np.random.randint(800, 1500)\n    repeat_rate = np.random.uniform(0.18, 0.48)\n    avg_speed_sec = np.random.randint(90, 320) # Время ожидания кофе\n    complaints = int(guests * np.random.uniform(0.01, 0.08))\n    \n    coffee_data.append({\n        'location': loc,\n        'monthly_guests': guests,\n        'repeat_rate': repeat_rate,\n        'avg_wait_seconds': avg_speed_sec,\n        'complaints_count': complaints\n    })\n\ndf_coffee = pd.DataFrame(coffee_data)\n\n# Считаем корреляцию между скоростью отдачи кофе и повторными визитами\ncorr_wait = df_coffee['avg_wait_seconds'].corr(df_coffee['repeat_rate'])\nprint(f\"Корреляция между временем ожидания и Retention гостей: {corr_wait:.3f}\")\nprint(\"Вывод: Сильная отрицательная связь! Чем дольше гость ждет напиток, тем ниже вероятность возврата.\")\n\n# Топ-3 проблемные точки\nworst_locations = df_coffee.sort_values(by='avg_wait_seconds', ascending=False).head(3)\nprint(\"\\nТОП-3 ТОЧКИ С КРИТИЧЕСКИМ ВРЕМЕНЕМ ОЖИДАНИЯ:\")\nprint(worst_locations[['location', 'avg_wait_seconds', 'repeat_rate', 'complaints_count']])\n"}, {"type": "markdown", "content": "## 3. Бизнес-решение (Deployment / Action)\nВместо слива 3 000 000 рублей на блогеров:\n1. Выявлена реальная причина: на точках с ожиданием > 4 минут гости уходят в кофейни конкурентов за углом.\n2. Закуплены скоростные темперы и настроен дополнительный бариста в утренний час-пик.\n3. Время ожидания снизилось до 110 секунд, возвратность гостей выросла на 7 п.п., выручка восстановилась за 3 недели.\n"}]}]}, {"id": "module_01_excel", "title": "Модуль 1. Excel и Google Sheets", "category": "Хард база", "badge": "Таблицы", "readme": "# 📊 Модуль 1: Excel и Google Sheets — Фундамент работы с данными\n\n## 📌 О модуле\nExcel и Google Sheets остаются главным языком коммуникации бизнеса. Топ-менеджеры, финансисты и маркетологи думают таблицами. Аналитик обязан уметь быстро рассчитывать срезы, собирать сводные таблицы и формулировать промпты для генерации сложных формул в Copilot.\n\n## 🎯 Learning Outcomes\n- **Understand**: Структуру плоских таблиц (tidy data), принципы адресации ($A$1 vs A1).\n- **Apply**: Функции `SUMIFS`, `COUNTIFS`, `XLOOKUP`, `INDEX+MATCH`, вложенные условия.\n- **Analyze**: Сводные таблицы (Pivot Tables), вычисляемые поля, когортные группировки.\n- **Create**: Интерактивные отчеты с визуализацией и срезами (Slicers); формулы через AI Copilot.\n\n## 📚 Уроки\n1. `lesson_01_interface_basics_formatting.ipynb` — Интерфейс, горячие клавиши, типы данных, условное форматирование.\n2. `lesson_02_formulas_functions_xlookup.ipynb` — Библиотека формул: математика, логика, текст, даты, современный XLOOKUP.\n3. `lesson_03_pivot_tables_aggregations.ipynb` — Сводные таблицы: многоуровневая группировка, % от общего, срезы.\n4. `lesson_04_visualization_data_story.ipynb` — Построение диаграмм по стандартам Тафти (Tufte): устранение визуального шума.\n5. `lesson_05_ai_copilot_excel_formulas.ipynb` — Промпт-инжиниринг для формул Excel, генерация Google Apps Script, валидация.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Справочник главных формул.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 1 (Excel)\n\n### Вопрос 1\nВ чем ключевое преимущество `XLOOKUP` перед `VLOOKUP`?\n- [ ] XLOOKUP работает быстрее ровно в 10 раз\n- [x] Искомый столбец может находиться левее возвращаемого, формула не ломается при добавлении столбцов\n- [ ] XLOOKUP работает только с числами\n\n### Вопрос 2\nЧто произойдет при копировании формулы `=A$1 + 10` вниз на 5 строк?\n- [ ] Ссылка сместится на A6\n- [x] Номер строки зафиксирован знаком $, ссылка останется на ячейку A1\n- [ ] Выдаст ошибку #REF!\n\n### Вопрос 3\nПочему в профессиональных отчетах избегают 3D круговых диаграмм (Pie Charts)?\n- [ ] Они занимают слишком много памяти на компьютере\n- [x] Они искажают пропорции восприятия долей и перегружают внимание визуальным мусором\n- [ ] Их не поддерживает Excel\n", "cheatsheet": "# 📋 Excel & Sheets Cheatsheet\n\n| Задача | Формула |\n|---|---|\n| Поиск значения | `=XLOOKUP(F2, A:A, C:C, \"Не найдено\")` |\n| Сумма с условием | `=SUMIFS(D:D, A:A, \"Completed\", B:B, \">=\"&DATE(2026,1,1))` |\n| Количество уникальных | `=COUNTA(UNIQUE(FILTER(B:B, A:A=\"Completed\")))` |\n| Безопасный расчет | `=IFERROR(A2 / B2, 0)` |\n| Склейка текста | `=TEXTJOIN(\" - \", TRUE, A2, B2)` |\n", "notebooks": [{"filename": "lesson_01_interface_basics_formatting.ipynb", "rel_path": "course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 1. Урок 1: Архитектура таблиц и принципы Tidy Data в Excel / Sheets\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Ментальная модель: Почему 90% таблиц в бизнесе \\\"сломаны\\\"?\\n\",\n        \"\\n\",\n        \"В корпоративном мире финансисты и менеджеры часто создают таблицы для **человеческих глаз**, а не для машинного анализа:\\n\",\n        \"- Объединенные ячейки (Merged Cells) — злейший враг аналитика;\\n\",\n        \"- Итоги посреди данных;\\n\",\n        \"- Пустые строки для «красоты»;\\n\",\n        \"- Даты, размазанные по столбцам вправо.\\n\",\n        \"\\n\",\n        \"### Стандарт Хэдли Уикхема: Tidy Data (Аккуратные данные)\\n\",\n        \"1. **Каждая переменная образует столбец**.\\n\",\n        \"2. **Каждое наблюдение образует строку**.\\n\",\n        \"3. **Каждый тип сущности образует отдельную таблицу**.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация трансформации плохой сводки в Tidy Data\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Типичный \\\"директорский\\\" отчет (Wide format с объединенными смыслами)\\n\",\n        \"ugly_report = pd.DataFrame({\\n\",\n        \"    'Менеджер': ['Алексей', 'Мария', 'Иван'],\\n\",\n        \"    'Янв_План': [100000, 150000, 120000],\\n\",\n        \"    'Янв_Факт': [95000, 160000, 110000],\\n\",\n        \"    'Фев_План': [110000, 150000, 130000],\\n\",\n        \"    'Фев_Факт': [115000, 140000, 135000]\\n\",\n        \"})\\n\",\n        \"\\n\",\n        \"print(\\\"СЫРОЙ ВИД (Не пригоден для SQL и BI):\\\")\\n\",\n        \"print(ugly_report)\\n\",\n        \"\\n\",\n        \"# Переводим в Tidy формат через Pandas (в Excel это делается через Power Query Unpivot)\\n\",\n        \"tidy_df = pd.melt(\\n\",\n        \"    ugly_report, \\n\",\n        \"    id_vars=['Менеджер'], \\n\",\n        \"    var_name='Период_Метрика', \\n\",\n        \"    value_name='Сумма'\\n\",\n        \")\\n\",\n        \"tidy_df[['Месяц', 'Тип']] = tidy_df['Период_Метрика'].str.split('_', expand=True)\\n\",\n        \"tidy_df = tidy_df.drop(columns=['Период_Метрика'])\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\nИДЕАЛЬНЫЙ TIDY DATA ВИД (Готов для сводных таблиц, SQL и Looker Studio):\\\")\\n\",\n        \"print(tidy_df.head(6))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 1. Урок 1: Архитектура таблиц и принципы Tidy Data в Excel / Sheets\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb)\n\n---\n\n## 1. Ментальная модель: Почему 90% таблиц в бизнесе \"сломаны\"?\n\nВ корпоративном мире финансисты и менеджеры часто создают таблицы для **человеческих глаз**, а не для машинного анализа:\n- Объединенные ячейки (Merged Cells) — злейший враг аналитика;\n- Итоги посреди данных;\n- Пустые строки для «красоты»;\n- Даты, размазанные по столбцам вправо.\n\n### Стандарт Хэдли Уикхема: Tidy Data (Аккуратные данные)\n1. **Каждая переменная образует столбец**.\n2. **Каждое наблюдение образует строку**.\n3. **Каждый тип сущности образует отдельную таблицу**.\n"}, {"type": "code", "content": "# Демонстрация трансформации плохой сводки в Tidy Data\nimport pandas as pd\n\n# Типичный \"директорский\" отчет (Wide format с объединенными смыслами)\nugly_report = pd.DataFrame({\n    'Менеджер': ['Алексей', 'Мария', 'Иван'],\n    'Янв_План': [100000, 150000, 120000],\n    'Янв_Факт': [95000, 160000, 110000],\n    'Фев_План': [110000, 150000, 130000],\n    'Фев_Факт': [115000, 140000, 135000]\n})\n\nprint(\"СЫРОЙ ВИД (Не пригоден для SQL и BI):\")\nprint(ugly_report)\n\n# Переводим в Tidy формат через Pandas (в Excel это делается через Power Query Unpivot)\ntidy_df = pd.melt(\n    ugly_report, \n    id_vars=['Менеджер'], \n    var_name='Период_Метрика', \n    value_name='Сумма'\n)\ntidy_df[['Месяц', 'Тип']] = tidy_df['Период_Метрика'].str.split('_', expand=True)\ntidy_df = tidy_df.drop(columns=['Период_Метрика'])\n\nprint(\"\\nИДЕАЛЬНЫЙ TIDY DATA ВИД (Готов для сводных таблиц, SQL и Looker Studio):\")\nprint(tidy_df.head(6))\n"}]}, {"filename": "lesson_02_formulas_functions_xlookup.ipynb", "rel_path": "course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧮 Модуль 1. Урок 2: Библиотека формул: от агрегаций до XLOOKUP\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Смерть VLOOKUP: Почему в 2027 году используют XLOOKUP?\\n\",\n        \"\\n\",\n        \"Классический `VLOOKUP` (ВПР) имел 3 фатальных недостатка:\\n\",\n        \"1. **Жесткий номер столбца**: Если коллега вставил столбец в середину справочника — формула с номерами столбцов выдает неверные данные.\\n\",\n        \"2. **Поиск только вправо**: Нельзя искать значение, если ключ находится правее возвращаемого результата.\\n\",\n        \"3. **Медленная работа**: На таблицах от 50 000 строк VLOOKUP зависает.\\n\",\n        \"\\n\",\n        \"### Синтаксис XLOOKUP:\\n\",\n        \"```excel\\n\",\n        \"=XLOOKUP(искомое_значение; диапазон_поиска; возвращаемый_диапазон; [если_не_найдено]; [режим_сопоставления])\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Практический кейс: Склейка транзакций с себестоимостью через аналог XLOOKUP\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"# Загружаем реальные датасеты курса\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\").head(10)\\n\",\n        \"products = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\products.csv\\\")\\n\",\n        \"\\n\",\n        \"# В Excel: =XLOOKUP(orders!C2; products!A:A; products!E:E; 0)\\n\",\n        \"merged = orders.merge(products[['product_id', 'product_name', 'cost', 'category']], on='product_id', how='left')\\n\",\n        \"merged['profit'] = merged['total_amount'] - (merged['cost'] * merged['quantity'])\\n\",\n        \"\\n\",\n        \"print(\\\"РЕЗУЛЬТАТ РАСЧЕТА МАРЖИ С ПОМОЩЬЮ XLOOKUP-ЛОГИКИ:\\\")\\n\",\n        \"print(merged[['order_id', 'product_name', 'quantity', 'unit_price', 'cost', 'total_amount', 'profit']])\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧮 Модуль 1. Урок 2: Библиотека формул: от агрегаций до XLOOKUP\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb)\n\n---\n\n## 1. Смерть VLOOKUP: Почему в 2027 году используют XLOOKUP?\n\nКлассический `VLOOKUP` (ВПР) имел 3 фатальных недостатка:\n1. **Жесткий номер столбца**: Если коллега вставил столбец в середину справочника — формула с номерами столбцов выдает неверные данные.\n2. **Поиск только вправо**: Нельзя искать значение, если ключ находится правее возвращаемого результата.\n3. **Медленная работа**: На таблицах от 50 000 строк VLOOKUP зависает.\n\n### Синтаксис XLOOKUP:\n```excel\n=XLOOKUP(искомое_значение; диапазон_поиска; возвращаемый_диапазон; [если_не_найдено]; [режим_сопоставления])\n```\n"}, {"type": "code", "content": "# Практический кейс: Склейка транзакций с себестоимостью через аналог XLOOKUP\nimport pandas as pd\n\n# Загружаем реальные датасеты курса\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\").head(10)\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\n\n# В Excel: =XLOOKUP(orders!C2; products!A:A; products!E:E; 0)\nmerged = orders.merge(products[['product_id', 'product_name', 'cost', 'category']], on='product_id', how='left')\nmerged['profit'] = merged['total_amount'] - (merged['cost'] * merged['quantity'])\n\nprint(\"РЕЗУЛЬТАТ РАСЧЕТА МАРЖИ С ПОМОЩЬЮ XLOOKUP-ЛОГИКИ:\")\nprint(merged[['order_id', 'product_name', 'quantity', 'unit_price', 'cost', 'total_amount', 'profit']])\n"}]}, {"filename": "lesson_03_pivot_tables_aggregations.ipynb", "rel_path": "course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📑 Модуль 1. Урок 3: Сводные таблицы (Pivot Tables) и срезы данных\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Анатомия многомерного анализа без кода\\n\",\n        \"\\n\",\n        \"Сводная таблица (Pivot Table) агрегирует тысячи строк сырых логов за доли секунды.\\n\",\n        \"Ключевые приемы профессионалов:\\n\",\n        \"- **Вычисляемые поля (Calculated Fields)**: Расчет среднего чека и маржи прямо внутри сводной таблицы.\\n\",\n        \"- **Отображение значений как % от строки / % от столбца**: Мгновенное выявление структуры продаж.\\n\",\n        \"- **Группировка дат**: Схлопывание ежедневных записей по Месяцам, Кварталам и Годам.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Построение сложной сводной таблицы по реальной базе e-commerce\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"orders = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\orders.csv\\\")\\n\",\n        \"items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"customers = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customers.csv\\\")\\n\",\n        \"\\n\",\n        \"df = items.merge(orders, on='order_id').merge(customers, on='customer_id')\\n\",\n        \"df = df[df['status'] == 'Completed']\\n\",\n        \"\\n\",\n        \"# Сводный отчет: Город x Канал привлечения с суммами и средними\\n\",\n        \"pivot = pd.pivot_table(\\n\",\n        \"    df,\\n\",\n        \"    values='total_amount',\\n\",\n        \"    index='city',\\n\",\n        \"    columns='acquisition_channel',\\n\",\n        \"    aggfunc=['sum', 'count'],\\n\",\n        \"    fill_value=0\\n\",\n        \")\\n\",\n        \"\\n\",\n        \"print(\\\"СВОДНЫЙ ОТЧЕТ ПО ВЫРУЧКЕ И ЗАКАЗАМ:\\\")\\n\",\n        \"print(pivot['sum'].round(0).astype(int))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📑 Модуль 1. Урок 3: Сводные таблицы (Pivot Tables) и срезы данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb)\n\n---\n\n## 1. Анатомия многомерного анализа без кода\n\nСводная таблица (Pivot Table) агрегирует тысячи строк сырых логов за доли секунды.\nКлючевые приемы профессионалов:\n- **Вычисляемые поля (Calculated Fields)**: Расчет среднего чека и маржи прямо внутри сводной таблицы.\n- **Отображение значений как % от строки / % от столбца**: Мгновенное выявление структуры продаж.\n- **Группировка дат**: Схлопывание ежедневных записей по Месяцам, Кварталам и Годам.\n"}, {"type": "code", "content": "# Построение сложной сводной таблицы по реальной базе e-commerce\nimport pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\ncustomers = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\ndf = items.merge(orders, on='order_id').merge(customers, on='customer_id')\ndf = df[df['status'] == 'Completed']\n\n# Сводный отчет: Город x Канал привлечения с суммами и средними\npivot = pd.pivot_table(\n    df,\n    values='total_amount',\n    index='city',\n    columns='acquisition_channel',\n    aggfunc=['sum', 'count'],\n    fill_value=0\n)\n\nprint(\"СВОДНЫЙ ОТЧЕТ ПО ВЫРУЧКЕ И ЗАКАЗАМ:\")\nprint(pivot['sum'].round(0).astype(int))\n"}]}, {"filename": "lesson_04_visualization_data_story.ipynb", "rel_path": "course/module_01_excel/lesson_04_visualization_data_story.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_04_visualization_data_story.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📈 Модуль 1. Урок 4: Визуализация данных и принципы Эдварда Тафти\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_04_visualization_data_story.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Принцип Data-Ink Ratio\\n\",\n        \"\\n\",\n        \"Эдвард Тафти, классик теории визуализации данных, сформулировал закон:\\n\",\n        \"$$\\\\text{Data-Ink Ratio} = \\\\frac{\\\\text{Чернила, отображающие данные}}{\\\\text{Все использованные чернила на графике}} \\\\to 1.0$$\\n\",\n        \"\\n\",\n        \"### Что нужно нещадно удалять с диаграмм:\\n\",\n        \"- Тяжелые фоновые сетки темных цветов;\\n\",\n        \"- 3D-эффекты и тени;\\n\",\n        \"- Повторяющиеся подписи осей;\\n\",\n        \"- Круговые диаграммы с более чем 3 сегментами (человеческий мозг плохо оценивает соотношение площадей и углов).\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Демонстрация принципа минимализма Тафти на реальных данных\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"items = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\order_items.csv\\\")\\n\",\n        \"products = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\products.csv\\\")\\n\",\n        \"df = items.merge(products, on='product_id')\\n\",\n        \"\\n\",\n        \"sales_by_cat = df.groupby('category')['total_amount'].sum().sort_values(ascending=True)\\n\",\n        \"\\n\",\n        \"fig, ax = plt.subplots(figsize=(9, 4))\\n\",\n        \"bars = ax.barh(sales_by_cat.index, sales_by_cat.values, color='#0284c7', height=0.55)\\n\",\n        \"\\n\",\n        \"# Убираем рамки\\n\",\n        \"for s in ['top', 'right', 'left']:\\n\",\n        \"    ax.spines[s].set_visible(False)\\n\",\n        \"ax.spines['bottom'].set_color('#94a3b8')\\n\",\n        \"\\n\",\n        \"# Добавляем подписи данных прямо к столбцам\\n\",\n        \"for bar in bars:\\n\",\n        \"    w = bar.get_width()\\n\",\n        \"    ax.text(w + 2000, bar.get_y() + bar.get_height()/2, f\\\"${w:,.0f}\\\", va='center', fontsize=10, color='#0f172a', weight='600')\\n\",\n        \"\\n\",\n        \"ax.set_title('Выручка по категориям за отчетный период (Tufte Clean Style)', fontsize=12, pad=15, loc='left')\\n\",\n        \"ax.xaxis.grid(True, linestyle='--', alpha=0.4, color='#cbd5e1')\\n\",\n        \"plt.tight_layout()\\n\",\n        \"plt.show()\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📈 Модуль 1. Урок 4: Визуализация данных и принципы Эдварда Тафти\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_04_visualization_data_story.ipynb)\n\n---\n\n## 1. Принцип Data-Ink Ratio\n\nЭдвард Тафти, классик теории визуализации данных, сформулировал закон:\n$$\\text{Data-Ink Ratio} = \\frac{\\text{Чернила, отображающие данные}}{\\text{Все использованные чернила на графике}} \\to 1.0$$\n\n### Что нужно нещадно удалять с диаграмм:\n- Тяжелые фоновые сетки темных цветов;\n- 3D-эффекты и тени;\n- Повторяющиеся подписи осей;\n- Круговые диаграммы с более чем 3 сегментами (человеческий мозг плохо оценивает соотношение площадей и углов).\n"}, {"type": "code", "content": "# Демонстрация принципа минимализма Тафти на реальных данных\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\ndf = items.merge(products, on='product_id')\n\nsales_by_cat = df.groupby('category')['total_amount'].sum().sort_values(ascending=True)\n\nfig, ax = plt.subplots(figsize=(9, 4))\nbars = ax.barh(sales_by_cat.index, sales_by_cat.values, color='#0284c7', height=0.55)\n\n# Убираем рамки\nfor s in ['top', 'right', 'left']:\n    ax.spines[s].set_visible(False)\nax.spines['bottom'].set_color('#94a3b8')\n\n# Добавляем подписи данных прямо к столбцам\nfor bar in bars:\n    w = bar.get_width()\n    ax.text(w + 2000, bar.get_y() + bar.get_height()/2, f\"${w:,.0f}\", va='center', fontsize=10, color='#0f172a', weight='600')\n\nax.set_title('Выручка по категориям за отчетный период (Tufte Clean Style)', fontsize=12, pad=15, loc='left')\nax.xaxis.grid(True, linestyle='--', alpha=0.4, color='#cbd5e1')\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_ai_copilot_excel_formulas.ipynb", "rel_path": "course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🤖 Модуль 1. Урок 5: Генерация сложных формул и макросов через AI Copilot\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Промпт-инжиниринг для Excel / Google Sheets\\n\",\n        \"\\n\",\n        \"Чтобы нейросеть написала формулу без ошибок, используйте архитектуру **T-C-O (Task, Context, Output)**:\\n\",\n        \"1. **Context**: «Таблица 'Sales', колонка A — Order_Date (YYYY-MM-DD), колонка B — Customer_ID, колонка C — Status ('Done', 'Cancelled'), колонка D — Revenue (число)».\\n\",\n        \"2. **Task**: «Посчитай сумму выручки только для повторных клиентов (у которых больше 1 заказа со статусом 'Done') за последние 90 дней».\\n\",\n        \"3. **Output**: «Напиши формулу для Google Sheets. Учти деление на ноль и русскую локаль (разделитель точка с запятой ;)».\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 2. Чеклист валидации формул от нейросети\\n\",\n        \"- [ ] **Локализация разделителей**: US-локаль использует запятую `,`, европейская/российская — точку с запятой `;`.\\n\",\n        \"- [ ] **Фиксация диапазонов**: Проставлены ли знаки доллара `$A$2:$A$1000`, чтобы формула не съехала при протяжке.\\n\",\n        \"- [ ] **Обработка ошибок**: Обернута ли формула в `IFERROR(..., 0)`?\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 1. Урок 5: Генерация сложных формул и макросов через AI Copilot\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb)\n\n---\n\n## 1. Промпт-инжиниринг для Excel / Google Sheets\n\nЧтобы нейросеть написала формулу без ошибок, используйте архитектуру **T-C-O (Task, Context, Output)**:\n1. **Context**: «Таблица 'Sales', колонка A — Order_Date (YYYY-MM-DD), колонка B — Customer_ID, колонка C — Status ('Done', 'Cancelled'), колонка D — Revenue (число)».\n2. **Task**: «Посчитай сумму выручки только для повторных клиентов (у которых больше 1 заказа со статусом 'Done') за последние 90 дней».\n3. **Output**: «Напиши формулу для Google Sheets. Учти деление на ноль и русскую локаль (разделитель точка с запятой ;)».\n\n---\n\n## 2. Чеклист валидации формул от нейросети\n- [ ] **Локализация разделителей**: US-локаль использует запятую `,`, европейская/российская — точку с запятой `;`.\n- [ ] **Фиксация диапазонов**: Проставлены ли знаки доллара `$A$2:$A$1000`, чтобы формула не съехала при протяжке.\n- [ ] **Обработка ошибок**: Обернута ли формула в `IFERROR(..., 0)`?\n"}]}]}, {"id": "module_02_sql", "title": "Модуль 2. SQL Master от SELECT до оконных функций", "category": "Хард база", "badge": "SQL", "readme": "# 🗃️ Модуль 2: SQL — От первых запросов до аналитических оконных функций\n\n## 📌 О модуле\nSQL (Structured Query Language) — главный фундамент data-стека. LLM пишут синтаксис, но только аналитик понимает структуру реляционной модели, видит дублирование при JOIN и умеет оптимизировать тяжелые запросы. В этом модуле мы работаем с реальной SQLite базой e-commerce на 15 000+ записей.\n\n## 🎯 Learning Outcomes\n- **Apply**: Составление сложных запросов (`SELECT`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`).\n- **Analyze**: Все виды `JOIN` (INNER, LEFT, FULL, CROSS, SELF), борьба с декартовым произведением строк.\n- **Evaluate**: Использование CTE (Common Table Expressions) для структурирования запросов вместо спагетти-подзапросов.\n- **Create**: Аналитические оконные функции (`ROW_NUMBER`, `DENSE_RANK`, `LAG`, `LEAD`, `SUM OVER (PARTITION BY ...)`).\n- **AI Orchestration**: Промптинг для генерации SQL, проверка EXPLAIN QUERY PLAN, защита от галлюцинаций агрегаций.\n\n## 📚 Уроки\n1. `lesson_01_db_intro_select_filtering.ipynb` — Подключение к базе, анатомия SQL, SELECT, WHERE, LIKE, IN.\n2. `lesson_02_aggregations_group_by_having.ipynb` — Агрегатные функции, группировка, разница WHERE vs HAVING.\n3. `lesson_03_joins_deep_dive.ipynb` — Реляционная связь, виды JOIN, поиск потерянных строк.\n4. `lesson_04_subqueries_and_cte.ipynb` — Чистый код через CTE (`WITH`), многоуровневая аналитика.\n5. `lesson_05_window_functions_advanced.ipynb` — Оконные функции: ранги, нарастающий итог, темпы роста (MoM / YoY).\n6. `lesson_06_sql_patterns_retention_funnels.ipynb` — Паттерны продуктовой аналитики: когорты, воронки на чистом SQL.\n7. `lesson_07_prompt_engineering_for_sql_and_validation.ipynb` — Генерация SQL через нейросети и строгий чеклист валидации.\n8. `quiz.md` — 15 вопросов со скринингов.\n9. `cheatsheet.md` — Справочник SQL конструкций.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 2 (SQL)\n\n### Вопрос 1\nВ чем разница между `RANK()` и `DENSE_RANK()`?\n- [ ] Разницы нет\n- [x] При одинаковых значениях RANK оставляет пропуски в нумерации (1, 2, 2, 4), а DENSE_RANK нумерует без пробелов (1, 2, 2, 3)\n- [ ] DENSE_RANK работает только в PostgreSQL\n\n### Вопрос 2\nЗачем нужна конструкция `WITH` (CTE)?\n- [ ] Она ускоряет любой запрос в 100 раз\n- [x] Она позволяет разбить сложный запрос на логические читаемые блоки и использовать их повторно\n- [ ] Без нее нельзя соединять таблицы\n\n### Вопрос 3\nКакой результат вернет `COUNT(*)` vs `COUNT(column_name)` если в колонке есть NULL?\n- [ ] Одинаковый\n- [x] `COUNT(*)` считает все строки, а `COUNT(column_name)` игнорирует строки с NULL\n- [ ] Вернет ошибку базы данных\n", "cheatsheet": "# 📋 SQL Cheatsheet\n\n```sql\n-- Оконная функция: прирост к предыдущему значению\nLAG(metric, 1) OVER (PARTITION BY user_id ORDER BY event_date)\n\n-- Оконная функция: доля строки в разрезе группы\nmetric * 100.0 / SUM(metric) OVER (PARTITION BY category)\n\n-- Безопасный расчет конверсии\nROUND(COUNT(DISTINCT converted_users) * 1.0 / NULLIF(COUNT(DISTINCT total_users), 0), 4)\n```\n", "notebooks": [{"filename": "lesson_01_db_intro_select_filtering.ipynb", "rel_path": "course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🗃️ Модуль 2. Урок 1: Реляционная модель данных и логический порядок выполнения SQL\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Главный секрет SQL: Порядок написания vs Порядок выполнения\\n\",\n        \"\\n\",\n        \"Почему новички пишут неработающие запросы? Потому что SQL **пишется** в одном порядке, а СУБД **выполняет** его совершенно в другом!\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"┌─────────────────────────────────┬─────────────────────────────────┐\\n\",\n        \"│     КАК ВЫ ПИШЕТЕ ЗАПРОС        │      КАК ЕГО ВЫПОЛНЯЕТ СУБД     │\\n\",\n        \"├─────────────────────────────────┼─────────────────────────────────┤\\n\",\n        \"│ 1. SELECT                       │ 1. FROM (откуда берем данные)   │\\n\",\n        \"│ 2. FROM                         │ 2. ON / JOIN (как связываем)    │\\n\",\n        \"│ 3. WHERE                        │ 3. WHERE (фильтруем сырые строки)│\\n\",\n        \"│ 4. GROUP BY                     │ 4. GROUP BY (схлопываем группы) │\\n\",\n        \"│ 5. HAVING                       │ 5. HAVING (фильтруем группы)    │\\n\",\n        \"│ 6. ORDER BY                     │ 6. SELECT (выбираем поля/алиас
