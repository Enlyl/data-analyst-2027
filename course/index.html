0\npct_explained = (explained_sum / initial_discrepancy) * 100\n\nprint(f\"Локализовано расхождения: {pct_explained:.1f}%\")\n\nassert 98 <= pct_explained <= 100, \"Должно быть объяснено более 98% расхождения\"\nprint(\"✅ Тест успешно пройден: корневые причины инцидента полностью выявлены!\")"}, {"type": "markdown", "content": "### 💡 Формула отчета об инциденте\nОтправляя отчет стейкхолдерам, всегда используйте структуру:\n1. Финансовый масштаб расхождения ($)\n2. Локализованные корневые причины с разбивкой сумм\n3. Корректирующие действия для предотвращения рецидива"}]}]}, {"id": "module_09_ai_tools_daily", "title": "Модуль 9. AI инструменты в ежедневной работе", "cat": "AI стек", "badge": "Workflow", "icon": "", "desc": "Cursor, Copilot, валидация AI-галлюцинаций и автоматизация рутинных пайплайнов.", "readme": "# 🛠️ Модуль 9: AI в ежедневной работе аналитика (Cursor, Copilot, ChatGPT)\n\n## 📌 О модуле\nРазница между джуном и мидлом в 2027 году: джун пишет скрипт 3 дня, а специалист новой формации решает ту же задачу за 2 часа с помощью AI-инструментов, гарантируя нулевой процент галлюцинаций.\n\n## 🎯 Learning Outcomes\n- **Apply**: Использование Cursor IDE и GitHub Copilot для парного программирования.\n- **Analyze**: Code Interpreter (Advanced Data Analysis) для быстрого разведочного анализа (EDA).\n- **Evaluate**: 5-уровневый фреймворк валидации ответов ИИ: от синтаксиса до краевых бизнес-кейсов.\n\n## 📚 Уроки\n1. `lesson_01_cursor_vs_copilot_workflows.ipynb` — Настройка рабочего места: Cursor, Copilot, индексация кодовой базы.\n2. `lesson_02_claude_chatgpt_data_interpreter.ipynb` — Работа с веб-ассистентами (Claude 3.7 / ChatGPT): быстрый EDA, генерация гипотез.\n3. `lesson_03_ai_validation_framework_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n---\n\n### Вопрос 1\nЗачем в проектах аналитики используется файл `.cursorrules`?\n- [ ] Для ускорения интернета.\n- [x] Для автоматической передачи AI-ассистенту корпоративных стандартов кода, схемы баз данных и бизнес-правил компании.\n- [ ] Для компиляции Python в бинарный файл.\n*Объяснение*: Файл `.cursorrules` автоматически подмешивается в системный контекст каждого запроса в IDE.\n\n---\n\n### Вопрос 2\nЧто такое проверка бизнес-инвариантов при аудите кода нейросети?\n- [ ] Проверка орфографии комментариев.\n- [x] Проверка фундаментальных ограничений предметной области (например: сумма заказов не может быть отрицательной, а LTV не может быть ниже нуля).\n- [ ] Измерение скорости процессора.\n*Объяснение*: Если синтаксически корректный код от ИИ выдал отрицательный отток или конверсию 140%, нарушен бизнес-инвариант.\n\n---\n\n### Вопрос 3\nКакой инструмент лучше всего подходит для мгновенного разведочного анализа (EDA) сырого CSV-файла?\n- [ ] Ручной ввод данных в калькулятор.\n- [x] Advanced Data Analysis / Code Interpreter (встроенный запуск Python с визуализацией в реальном времени).\n- [ ] Отрисовка графиков на бумаге.\n*Объяснение*: Code Interpreter выполняет код в изолированной песочнице, строя графики и считая квантили за секунды.\n\n---\n\n### Вопрос 4\nКакой подход наиболее эффективен при отладке сложного Python-скрипта через AI в IDE?\n- [ ] Скопировать в чат весь проект целиком без пояснений.\n- [x] Предоставить минимальный воспроизводимый пример (MRE), полный стектрейс ошибки и схему первых 3 строк входных данных.\n- [ ] Попросить AI переписать проект на C++.\n*Объяснение*: Точный локализованный контекст предотвращает генерацию галлюцинаций и экономит контекстное окно.\n\n---\n\n### Вопрос 5\nЗачем нужен файл .cursorrules или AGENTS.md в корне проекта аналитика?\n- [ ] Это системный файл Windows.\n- [x] Он задает постоянный системный контекст для AI-ассистентов: стек технологий, соглашения об именовании колонок и бизнес-инварианты проекта.\n- [ ] Чтобы запретить AI читать файлы проекта.\n*Объяснение*: Постоянный контекст избавляет от необходимости повторять правила форматирования в каждом промпте.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 1. AI-инструменты в ежедневной работе: Cursor, GitHub Copilot и AI IDE\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСреда разработки аналитика эволюционировала от простых блокнотов к специализированным AI IDE (Cursor, Windsurf).\nКлючевые сценарии продуктивности:\n- **Multi-file Context Editing:** одновременное изменение SQL-модели и связанного Python-скрипта валидации\n- **Docs Indexing:** индексация локальной документации репозитория через `@docs`\n- **Fast Tab Autocomplete:** предиктивное автодополнение длинных названий колонок и агрегаций"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Сравнение инструментов разработки аналитика\nСравним скорость выполнения комплексных аналитических задач при разных инструментальных сетапах."}, {"type": "code", "content": "# Демонстрация: Скорость разработки аналитического пайплайна\ntools_comp = pd.DataFrame({\n    'Инструмент': ['Классический VS Code / Jupyter', 'GitHub Copilot в IDE', 'Cursor AI (Agent Mode)'],\n    'Создание ETL скрипта (мин)': [45, 20, 8],\n    'Отладка и тесты (мин)': [30, 15, 5],\n    'Оформление документации (мин)': [25, 10, 2]\n})\ntools_comp['Общее время (мин)'] = tools_comp.sum(axis=1, numeric_only=True)\ndisplay(tools_comp)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Ускорение разработки аналитических пайплайнов\nПостроим сравнение затрат времени по этапам разработки."}, {"type": "code", "content": "# Визуализация продуктивности AI IDE\nfig, ax = plt.subplots(figsize=(9, 4.8), dpi=110)\n\ntools = tools_comp['Инструмент']\ntotal_times = tools_comp['Общее время (мин)']\n\nbars = ax.bar(tools, total_times, color=[SECONDARY, PRIMARY, SUCCESS], edgecolor='#333333', linewidth=0.6, width=0.5)\n\nax.set_title(\"Суммарное время создания аналитического пайплайна (минуты)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Затраченное время (мин)\", fontsize=11)\nax.set_ylim(0, 120)\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"{h} мин\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет кратности ускорения\nВо сколько раз Cursor AI ускоряет разработку по сравнению с классическим подходом?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nclassic_time = tools_comp.loc[0, 'Общее время (мин)']\ncursor_time = tools_comp.loc[2, 'Общее время (мин)']\nspeedup = classic_time / cursor_time\n\nprint(f\"Кратность ускорения разработки: {speedup:.1f}x!\")\n\nassert speedup > 5, \"Ускорение должно превышать 5 раз\"\nprint(\"✅ Тест успешно пройден: эффект внедрения современного AI-стека очевиден!\")"}, {"type": "markdown", "content": "### 💡 Инженерный лайфхак\nСоздайте файл `.cursorrules` в корне вашего репозитория и укажите предпочитаемый стек: `Pandas 2.x, DuckDB, Foundation colors, PEP-8`. Cursor будет следовать этим правилам автоматически."}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 2. Claude Artifacts и ChatGPT Advanced Data Analysis: быстрый EDA\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПесочницы выполнения кода (Code Interpreter / Advanced Data Analysis) позволяют за 60 секунд провести экспресс-разведку сырого CSV файла.\nАналитик загружает файл объемом до сотен мегабайт и получает интерактивные артефакты, проверку распределений и автоматический аудит пропусков.\nОднако песочницы изолированы и имеют ограничения по оперативной памяти (обычно до 2 GB), поэтому для больших данных требуется DuckDB или SQL-хранилище."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Экспресс-EDA и детектирование аномалий\nСмоделируем сценарий экспресс-разведки качества данных в песочнице."}, {"type": "code", "content": "# Демонстрация: Автоматический аудит пропусков и типов данных\neda_profile = pd.DataFrame({\n    'Колонка': ['user_id', 'mrr', 'signup_date', 'is_churned', 'nps_score'],\n    'Тип данных': ['int64', 'float64', 'datetime', 'int64', 'float64'],\n    'Пропуски (%)': [0.0, 0.2, 0.0, 0.0, 14.5],\n    'Аномалии / Выбросы': ['Нет', '2 значения > $15,000', 'Нет', 'Нет', '3 значения < 0']\n})\ndisplay(eda_profile)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Профиль пропущенных значений в датасете\nПостроим наглядную карту полноты данных (Data Completeness)."}, {"type": "code", "content": "# Визуализация полноты колонок\nfig, ax = plt.subplots(figsize=(8, 4), dpi=110)\n\ncompleteness = 100 - eda_profile['Пропуски (%)']\nbars = ax.barh(eda_profile['Колонка'], completeness, color=PRIMARY, edgecolor='#333333', linewidth=0.6)\n\n# Подсветка проблемной колонки\nbars[4].set_color(WARNING)\n\nax.set_title(\"Полнота данных по колонкам (Data Completeness %)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Полнота заполнения (%)\", fontsize=11)\nax.set_xlim(70, 105)\n\nfor b in bars:\n    w = b.get_width()\n    ax.annotate(f\"{w:.1f}%\", xy=(w, b.get_y() + b.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=9.5, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск колонки с максимальным процентом пропусков\nОпределите имя колонки с наибольшей долей пропущенных значений."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nworst_col = eda_profile.sort_values(by='Пропуски (%)', ascending=False).iloc[0]['Колонка']\nprint(f\"Колонка с максимальными пропусками: {worst_col}\")\n\nassert worst_col == 'nps_score', \"Колонка с наибольшим числом пропусков должна быть nps_score\"\nprint(\"✅ Тест успешно пройден: экспресс-EDA корректно выявил проблемное поле!\")"}, {"type": "markdown", "content": "### 💡 Безопасность данных в облачных песочницах\nНикогда не загружайте в веб-интерфейсы ChatGPT/Claude персональные данные клиентов (PII: ФИО, email, телефоны). Всегда анонимизируйте или хэшируйте чувствительные поля перед отправкой."}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 9. Урок 3. Фреймворк валидации AI-ответов: защита от галлюцинаций и смещений\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДоверие к данным — главная валюта аналитика. Если вы покажете совету директоров график с AI-галлюцинацией, доверие к вашей экспертизе будет подорвано навсегда.\nКлассификация рисков AI-генерации:\n1. **Schema Hallucination:** выдуманные поля и таблицы\n2. **Aggregation Bias:** агрегация уже сагрегированных метрик (например, среднее от средних)\n3. **Survivorship Bias:** игнорирование оттока при фильтрации\n4. **Data Leakage:** заглядывание в будущее при разделении обучающей и тестовой выборок"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Внедрение автоматического цензора кода (AI Linter)\nСмоделируем автоматический чеклист проверки сгенерированного скрипта перед отправкой в прод."}, {"type": "code", "content": "# Демонстрация: Чеклист валидации аналитического скрипта\nvalidation_checklist = pd.DataFrame({\n    'Тип проверки': ['1. Контрольная сумма строк (Row Count)', '2. Неотрицательность метрик (Revenue >= 0)', '3. Отсутствие скрытого Chained Indexing', '4. Защита от деления на 0 (ZeroDivisionError)', '5. Сверка с эталонным бенчмарком'],\n    'Статус проверки': ['PASSED', 'PASSED', 'PASSED', 'PASSED', 'PASSED'],\n    'Критичность': ['Блокирующий', 'Блокирующий', 'Предупреждение', 'Блокирующий', 'Блокирующий']\n})\ndisplay(validation_checklist)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Устранение дефектов в AI-пайплайне\nСравним количество критических дефектов в аналитических отчетах до и после внедрения валидационных ворот (Quality Gates)."}, {"type": "code", "content": "# Построение графика снижения дефектов\nmonths = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн']\ndefects_before_gates = [18, 22, 19, 25, 21, 24]\ndefects_after_gates = [18, 22, 19, 6, 2, 1]\n\nfig, ax = plt.subplots(figsize=(9, 4.5), dpi=110)\n\nax.plot(months, defects_before_gates, marker='o', color=ALERT, linewidth=2, linestyle='--', label='Без валидационного шлюза')\nax.plot(months, defects_after_gates, marker='s', color=SUCCESS, linewidth=2.5, label='С Quality Gates (Asserts)')\n\nax.set_title(\"Динамика критических ошибок в отчетах аналитиков\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Месяц\", fontsize=11)\nax.set_ylabel(\"Количество инцидентов\", fontsize=11)\nax.axvline('Мар', color=WARNING, linestyle=':', label='Внедрение автоматических проверок')\nax.legend(frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет снижения инцидентов\nОпределите, на сколько процентов снизилось количество инцидентов в июне по сравнению с мартом."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmarch_val = defects_after_gates[2]\njune_val = defects_after_gates[5]\npct_drop = ((march_val - june_val) / march_val) * 100\n\nprint(f\"Снижение количества дефектов: {pct_drop:.1f}%!\")\n\nassert pct_drop > 90, \"Снижение должно превышать 90%\"\nprint(\"✅ Тест успешно пройден: валидационные шлюзы радикально повышают надежность!\")"}, {"type": "markdown", "content": "### 💡 Принцип «Доверяй, но проверяй»\nЛюбой результат, выданный AI, считается гипотезой до тех пор, пока он не подтвержден независимым SQL-запросом и тестами `assert`."}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10. LLM API и неструктурированные данные", "cat": "AI стек", "badge": "API", "icon": "", "desc": "Парсинг отзывов, классификация клиентских обращений, NER и извлечение JSON из текста.", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API & Неструктурированные данные)\n\n---\n\n### Вопрос 1\nЗачем в аналитических пайплайнах обогащения данных использовать Structured Outputs (Pydantic / JSON Mode)?\n- [ ] Чтобы нейросеть писала более вежливые ответы.\n- [x] Чтобы модель гарантированно вернула валидный JSON строго заданной структуры с проверкой типов полей, исключая поломку ETL-пайплайна.\n- [ ] Чтобы снизить задержку сети.\n*Объяснение*: Structured Outputs принудительно направляет сэмплирование токенов согласно переданной JSON-схеме.\n\n---\n\n### Вопрос 2\nКакую температуру (`temperature`) следует указывать при вызове LLM для извлечения фактов и разметки тональности?\n- [ ] 1.5 (для максимального разнообразия).\n- [x] 0.0 (для максимальной детерминированности, воспроизводимости и строгого следования схеме).\n- [ ] 0.8.\n*Объяснение*: Для аналитических задач и классификации требуется нулевая случайность (greedy decoding).\n\n---\n\n### Вопрос 3\nСколько примерно стоит классификация 10 000 коротких отзывов клиентов через современные эффективные LLM (например, Gemini Flash / GPT-4o-mini)?\n- [ ] Около \\$500.\n- [x] Менее \\$1.00 (порядка 50-80 рублей).\n- [ ] Более \\$10 000.\n*Объяснение*: Цены на легковесные модели упали до \\$0.10–\\$0.15 за миллион токенов, делая автоматическую разметку текста невероятно дешевой.\n\n---\n\n### Вопрос 4\nЧто такое Prompt Caching и какую экономию он дает в ETL-пайплайнах?\n- [ ] Сохранение ответов в файл Excel.\n- [x] Кэширование неизменяемого системного префикса промпта на стороне провайдера API, снижающее стоимость входных токенов на 75-90%.\n- [ ] Отключение платных запросов.\n*Объяснение*: При обработке миллионов строк кэширование схемы и инструкций сокращает расходы компании в разы.\n\n---\n\n### Вопрос 5\nПочему параметр temperature при аналитической обработке данных через LLM API выставляют строго в 0.0?\n- [ ] При температуре 0 процессор не нагревается.\n- [x] Температура 0.0 обеспечивает максимальную детерминированность и воспроизводимость извлечения фактов и классификации.\n- [ ] Значения выше 0 запрещены правилами API.\n*Объяснение*: Стохастический шум недопустим в задачах точной разметки финансовых и продуктовых данных.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 1. Работа с LLM API в Python: Anthropic Claude, OpenAI и Gemini\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПрограммный вызов LLM через API позволяет встраивать интеллектуальный анализ непосредственно в корпоративные ETL/ELT конвейеры (Airflow, Dagster, Prefect).\nАналитик обязан оптимизировать компромисс между:\n- **Качеством рассуждений** (Frontier reasoning)\n- **Задержкой отклика** (Time to First Token — TTFT)\n- **Стоимостью инференса** (Цена за 1M входных и выходных токенов)\nДля поточной классификации 100,000 отзывов используется сверхбыстрая и дешевая Flash/Haiku модель, а для генерации сложных SQL-архитектур — флагманские модели."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Экономика LLM API и выбор модели\nСравним ключевые семейства моделей 2027 года по стоимости и скорости обработки."}, {"type": "code", "content": "# Демонстрация: Сравнительный профиль моделей\nmodel_profiles = pd.DataFrame({\n    'Модель': ['Claude 3.7 Sonnet', 'GPT-4.5 Omni', 'Gemini 2.0 Flash', 'Claude 3.5 Haiku'],\n    'Стоимость 1M Input ($)': [3.0, 2.5, 0.10, 0.80],\n    'Стоимость 1M Output ($)': [15.0, 10.0, 0.40, 4.0],\n    'Скорость (токенов/сек)': [85, 95, 240, 160],\n    'Reasoning Score (0-100)': [98, 96, 88, 82]\n})\ndisplay(model_profiles)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Карта моделей «Цена vs Качество»\nПостроим двумерную карту компромиссов для выбора оптимальной модели под аналитическую задачу."}, {"type": "code", "content": "# Построение карты моделей\nfig, ax = plt.subplots(figsize=(9, 5), dpi=110)\n\nx = model_profiles['Стоимость 1M Input ($)']\ny = model_profiles['Reasoning Score (0-100)']\nsizes = model_profiles['Скорость (токенов/сек)'] * 3\n\nscatter = ax.scatter(x, y, s=sizes, c=[PRIMARY, ALERT, SUCCESS, WARNING], \n                     edgecolors='#333333', linewidth=1.2, alpha=0.85)\n\nfor _, row in model_profiles.iterrows():\n    ax.annotate(f\"{row['Модель']}\\n({row['Скорость (токенов/сек)']} tok/s)\", \n                (row['Стоимость 1M Input ($)'], row['Reasoning Score (0-100)']),\n                xytext=(0, 12), textcoords=\"offset points\", ha='center', fontweight='bold', fontsize=9.5)\n\nax.set_title(\"Ландшафт LLM API: Стоимость vs Аналитическое качество (размер = скорость)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Стоимость 1M Input токенов ($)\", fontsize=11)\nax.set_ylabel(\"Reasoning Score (Качество логики)\", fontsize=11)\nax.set_ylim(75, 105)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет стоимости классификации 100k обращений\nПри среднем размере отзыва 150 токенов (вход) и ответе 20 токенов (выход), рассчитайте стоимость обработки 100,000 отзывов на `Gemini 2.0 Flash`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_input_tokens = 100000 * 150\ntotal_output_tokens = 100000 * 20\n\ncost_input = (total_input_tokens / 1000000) * 0.10\ncost_output = (total_output_tokens / 1000000) * 0.40\ntotal_cost = cost_input + cost_output\n\nprint(f\"Стоимость разметки 100k отзывов: ${total_cost:.2f}!\")\n\nassert total_cost < 3.0, \"Стоимость должна быть меньше $3\"\nprint(\"✅ Тест успешно пройден: микроэкономика API подтверждает гигантскую рентабельность Flash-моделей!\")"}, {"type": "markdown", "content": "### 💡 Паттерн Model Routing\nНикогда не используйте одну флагманскую модель для всех задач. Настройте шлюз (Router): 90% типовых задач классификации направляйте на Flash/Haiku, а на Sonnet/GPT-4 — только запросы с аномалиями и сложными расчетами."}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 2. Извлечение сущностей и парсинг неструктурированных данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДо 80% ценной информации в корпорациях погребено в неструктурированном виде:\nPDF-счета контрагентов, клиентские отзывы, транскрипты звонков в колл-центр, тикеты технической поддержки.\nLLM выполняет роль **универсального парсера сущностей (Entity Extractor)**, преобразуя хаотичный сырой текст в строгие реляционные строки базы данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Извлечение структурированных атрибутов из отзывов\nСмоделируем извлечение тональности, категории проблемы и критичности из текстовых комментариев."}, {"type": "code", "content": "# Демонстрация: Преобразование неструктурированного текста в витрину\nraw_reviews = [\n    \"Приложение крашнулось при оплате на iOS, деньги списались, заказ не оформился!\",\n    \"Отличная быстрая доставка, курьер был вежлив, спасибо большое!\",\n    \"Не могу найти в каталоге зимнюю резину 17 радиуса, поиск выдает ошибку\"\n]\n\nparsed_data = pd.DataFrame({\n    'Исходный текст': raw_reviews,\n    'Категория': ['Checkout / Payments', 'Logistics / Delivery', 'Catalog / Search'],\n    'Тональность': ['Negative', 'Positive', 'Neutral'],\n    'Критичность (1-5)': [5, 1, 3],\n    'Churn Risk': ['High', 'Low', 'Medium']\n})\ndisplay(parsed_data)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Распределение критичности тикетов поддержки\nПостроим распределение извлеченных инцидентов по категориям и уровню риска оттока."}, {"type": "code", "content": "# Визуализация критичности обращений\nfig, ax = plt.subplots(figsize=(8, 4), dpi=110)\n\ncolors = [ALERT, SUCCESS, WARNING]\nbars = ax.bar(parsed_data['Категория'], parsed_data['Критичность (1-5)'], color=colors, edgecolor='#333333', linewidth=0.6, width=0.45)\n\nax.set_title(\"Критичность клиентских инцидентов по категориям (1-5)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Уровень критичности (Severity)\", fontsize=11)\nax.set_ylim(0, 6)\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"Уровень {h}\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск инцидентов с максимальным риском оттока\nНайдите строки в `parsed_data`, где `Churn Risk == 'High'`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nhigh_risk = parsed_data[parsed_data['Churn Risk'] == 'High']\nprint(\"Количество критических инцидентов:\", len(high_risk))\ndisplay(high_risk[['Категория', 'Тональность', 'Churn Risk']])\n\nassert len(high_risk) == 1, \"Должен быть ровно один инцидент высокого риска\"\nprint(\"✅ Тест успешно пройден: извлечение сущностей позволяет моментально локализовать аварию!\")"}, {"type": "markdown", "content": "### 💡 Инженерное правило парсинга\nПри извлечении данных передавайте модели жесткий `Enum` допустимых значений (например, `Категория: [Payments, Logistics, Catalog, Other]`). Это исключит появление синонимов и облегчит группировку в SQL."}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 3. Structured Outputs: Pydantic схемы и гарантия валидного JSON\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\n\n## 📌 Бизнес-контекст и методология\nИсторически парсинг JSON из ответов LLM был кошмаром дата-инженера: модель могла забыть закрыть скобку, добавить лишний текст перед JSON или изменить регистр ключей.\nСовременный стандарт — **Structured Outputs (Constrained Decoding / Pydantic)**.\nДвижок генерации на уровне выбора токенов принудительно маскирует недопустимые символы по грамматике JSON-схемы.\nЭто дает **100% математическую гарантию** соответствия формата, делая код безопасным для продакшна."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Structured Outputs vs Традиционный парсинг\nСравним надежность извлечения данных на выборке из 10,000 аналитических карточек."}, {"type": "code", "content": "# Демонстрация: Сравнение отказоустойчивости парсинга\njson_reliability = pd.DataFrame({\n    'Подход к извлечению': ['Промпт: \"Ответь строго в JSON\"', 'JSON Mode (без схемы)', 'Structured Outputs (Pydantic / CFG)'],\n    'Валидный JSON (%)': [82.4, 94.1, 100.0],\n    'Соответствие типам полей (%)': [71.2, 88.5, 100.0],\n    'Отсутствие лишних ключей (%)': [64.0, 83.2, 100.0]\n})\ndisplay(json_reliability)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Устранение сбоев конвейера данных\nПостроим наглядное сравнение надежности структурированной генерации."}, {"type": "code", "content": "# Визуализация надежности Structured Outputs\nfig, ax = plt.subplots(figsize=(9, 4.8), dpi=110)\n\nbars = ax.bar(json_reliability['Подход к извлечению'], json_reliability['Валидный JSON (%)'],\n              color=[ALERT, WARNING, SUCCESS], edgecolor='#333333', linewidth=0.6, width=0.5)\n\nax.set_title(\"Надежность генерации JSON для автоматических пайплайнов (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Валидность синтаксиса (%)\", fontsize=11)\nax.set_ylim(70, 108)\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"{h:.1f}%\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка 100% надежности схемы\nУбедитесь, что показатель валидности для `Structured Outputs` равен строго 100.0%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nso_validity = json_reliability.loc[2, 'Валидный JSON (%)']\nprint(f\"Показатель надежности Pydantic/CFG: {so_validity}%\")\n\nassert so_validity == 100.0, \"Structured Outputs должен давать строго 100% валидность\"\nprint(\"✅ Тест успешно пройден: Structured Outputs гарантирует нулевой процент сбоев в ETL!\")"}, {"type": "markdown", "content": "### 💡 Паттерн Pydantic\nВсегда описывайте целевые витрины через классы `pydantic.BaseModel` с типизацией (`int, float, Literal, Field(description=...)`). Описания полей служат дополнительными инструкциями для LLM."}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 10. Урок 4. Batch Processing и оптимизация затрат на LLM: скидка 50% и асинхронность\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ аналитических задачах 90% обработки данных не требует синхронного ответа за доли секунды (например, ночной пересчет эмбеддингов, еженедельная классификация отзывов).\nВсе провайдеры (OpenAI, Anthropic, Google) предоставляют **Batch API (пакетная обработка)**:\n- **Скидка 50%** на все токены\n- Отдельные повышенные квоты (Rate Limits), исключающие ошибку `429 Too Many Requests`\n- Гарантия выполнения в течение 24 часов"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Экономия бюджета при переходе на Batch API\nСравним годовые расходы компании на обогащение витрин данных при использовании Sync API vs Batch API."}, {"type": "code", "content": "# Демонстрация: Финансовая модель экономии на Batch API\nmonthly_tokens_m = 500 # 500 млн токенов в месяц\nsync_cost_per_m = 3.0\nbatch_cost_per_m = 1.5\n\nmonths = np.arange(1, 13)\ncum_sync = months * monthly_tokens_m * sync_cost_per_m\ncum_batch = months * monthly_tokens_m * batch_cost_per_m\ncum_savings = cum_sync - cum_batch\n\ndf_cost_savings = pd.DataFrame({\n    'Месяц': months,\n    'Sync API ($)': cum_sync,\n    'Batch API ($)': cum_batch,\n    'Чистая экономия ($)': cum_savings\n})\ndisplay(df_cost_savings.tail(4))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Кумулятивная экономия на инфраструктуре\nПостроим накопительный график разницы затрат за год."}, {"type": "code", "content": "# Визуализация кумулятивной экономии\nfig, ax = plt.subplots(figsize=(9, 4.8), dpi=110)\n\nax.plot(months, cum_sync / 1000, color=ALERT, marker='o', linewidth=2, label='Sync API ($ тыс.)')\nax.plot(months, cum_batch / 1000, color=SUCCESS, marker='s', linewidth=2.5, label='Batch API (-50% скидка, $ тыс.)')\nax.fill_between(months, cum_batch / 1000, cum_sync / 1000, color=SUCCESS, alpha=0.15, label='Экономия бюджета компании')\n\nax.set_title(\"Годовые затраты на LLM инференс: Sync vs Batch API\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Месяц года\", fontsize=11)\nax.set_ylabel(\"Кумулятивные затраты ($ тыс.)\", fontsize=11)\nax.legend(frameon=True, facecolor='#ffffff')\n\nlatest_saving = cum_savings[-1] / 1000\nax.annotate(f\"Экономия: ${latest_saving:.0f}k / год\", xy=(12, cum_batch[-1]/1000), \n            xytext=(-40, 40), textcoords=\"offset points\", fontweight='bold', color=SUCCESS, fontsize=10,\n            arrowprops=dict(arrowstyle=\"->\", color=SUCCESS, lw=1.5))\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет совокупной годовой экономии\nОпределите, сколько долларов сэкономит компания за 12 месяцев благодаря использованию Batch API."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nannual_savings = cum_savings[-1]\nprint(f\"Чистая годовая экономия бюджета: ${annual_savings:,.2f}\")\n\nassert annual_savings == 9000.0, \"Экономия должна составлять $9,000\"\nprint(\"✅ Тест успешно пройден: переход на Batch API экономит компании тысячи долларов!\")"}, {"type": "markdown", "content": "### 💡 Архитектурное правило Batch API\nРазделяйте пайплайны на два класса: Interactive (дашборды для людей — Sync) и Asynchronous (ночные витрины dbt — строго Batch API). Это сокращает облачный счет компании вдвое."}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11. RAG и векторные базы данных", "cat": "AI стек", "badge": "RAG", "icon": "", "desc": "ChromaDB, семантический поиск, эмбеддинги и вопросно-ответные системы по документам.", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG & Векторные базы данных)\n\n---\n\n### Вопрос 1\nВ чем заключается главное преимущество архитектуры RAG перед файнтюнингом (дообучением) модели на данных компании?\n- [ ] RAG работает без использования электричества.\n- [x] RAG позволяет обращаться к постоянно обновляемым корпоративным документам в реальном времени без дорогостоящего переобучения нейросети и дает ссылки на точные источники.\n- [ ] RAG используется только для картинок.\n*Объяснение*: При изменении регламента или добавлении данных достаточно обновить индекс в векторной БД, не меняя веса модели.\n\n---\n\n### Вопрос 2\nЧто показывает косинусное сходство (Cosine Similarity) между двумя эмбеддингами?\n- [ ] Разницу в количестве букв в тексте.\n- [x] Косинус угла между векторами в многомерном пространстве (от 1.0 — полное совпадение смысла, до 0.0 — отсутствие семантической связи).\n- [ ] Скорость загрузки страницы.\n*Объяснение*: Чем ближе угол векторов к нулю (косинус к 1.0), тем ближе смысловое значение текстов.\n\n---\n\n### Вопрос 3\nКак RAG помогает масштабировать Text-to-SQL в компании с сотнями таблиц в базе данных?\n- [ ] Сжимает таблицы в zip-архив.\n- [x] Динамически находит по смыслу запроса только 2-4 релевантные таблицы и передает в контекст промпта только их схемы, не перегружая лимит контекста.\n- [ ] Удаляет старые таблицы из базы.\n*Объяснение*: Семантический поиск по метаданным оставляет в промпте только нужные фрагменты схемы.\n\n---\n\n### Вопрос 4\nЧто такое косинусное сходство (Cosine Similarity) между векторами эмбеддингов?\n- [ ] Разность длин двух векторов.\n- [x] Косинус угла между ними: отношение скалярного произведения к произведению норм, измеряющее смысловую близость независимо от длины текста.\n- [ ] Количество общих слов в текстах.\n*Объяснение*: Нормализация по длине делает косинус идеальной метрикой для текстов разного объема.\n\n---\n\n### Вопрос 5\nЧто такое Chunking (нарезка текста на фрагменты) в RAG-системах и почему размер чанка критичен?\n- [ ] Удаление знаков препинания.\n- [x] Разбиение длинных документов на логические блоки; слишком мелкий чанк теряет контекст, а слишком крупный размывает семантический вектор в эмбеддинге.\n- [ ] Сжатие файлов архиватором.\n*Объяснение*: Оптимальный размер чанка (обычно 250-500 токенов с перекрытием) обеспечивает баланс точности и полноты поиска.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 1. Эмбеддинги и векторное пространство: геометрия семантического поиска\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭмбеддинг — это перевод смысла текста в многомерный вектор чисел (например, 1536 измерений в OpenAI text-embedding-3). \nБлизкие по смыслу фразы («где посмотреть выручку за май» и «покажи продажи в прошлом месяце») имеют косинусное сходство (Cosine Similarity) близкое к 1.0, даже если не содержат ни одного общего слова!"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем косинусное сходство между векторами запросов пользователей к аналитической системе."}, {"type": "code", "content": "def cosine_sim(a, b):\n    return np.dot(a, b) / (np.linalg.norm(a) * np.linalg.norm(b))\n\n# Синтетические эмбеддинги 3 запросов\n# v1: \"выручка за месяц\"\n# v2: \"продажи за май\" (синоним v1)\n# v3: \"как сбросить пароль\" (технический саппорт)\nnp.random.seed(42)\nbase_sales = np.random.normal(1.0, 0.1, 10)\nbase_auth = np.random.normal(-1.0, 0.1, 10)\n\nv1 = base_sales + np.random.normal(0, 0.05, 10)\nv2 = base_sales + np.random.normal(0, 0.05, 10)\nv3 = base_auth + np.random.normal(0, 0.05, 10)\n\nprint(f\"Сходство 'Выручка' <-> 'Продажи': {cosine_sim(v1, v2):.4f} (Высокое сходство!)\")\nprint(f\"Сходство 'Выручка' <-> 'Пароль':  {cosine_sim(v1, v3):.4f} (Полная противоположность)\")"}, {"type": "markdown", "content": "### 📊 Визуализация: 2D Проекция векторного пространства запросов (PCA)\nГрафик ниже демонстрирует, как алгоритмы RAG группируют запросы аналитиков, жалобы клиентов и технические тикеты в отдельные семантические острова."}, {"type": "code", "content": "from sklearn.decomposition import PCA\nimport matplotlib.pyplot as plt\n\nnp.random.seed(42)\n# Создаем 3 кластера запросов: 1) Финансы, 2) Продукт/Фичи, 3) Жалобы на доставку\nfin_queries = [f'Финансовый запрос #{i}' for i in range(1, 11)]\nprod_queries = [f'Вопрос по продукту #{i}' for i in range(1, 11)]\ndelivery_queries = [f'Жалоба на курьера #{i}' for i in range(1, 11)]\n\nfin_vectors = np.random.normal(loc=[3, 3], scale=0.6, size=(10, 2))\nprod_vectors = np.random.normal(loc=[-2, 4], scale=0.6, size=(10, 2))\ndelivery_vectors = np.random.normal(loc=[0, -3], scale=0.6, size=(10, 2))\n\nfig, ax = plt.subplots(figsize=(10, 6))\n\nax.scatter(fin_vectors[:, 0], fin_vectors[:, 1], color='#1779ba', s=90, label='Аналитика и Выручка', zorder=5)\nax.scatter(prod_vectors[:, 0], prod_vectors[:, 1], color='#3adb76', s=90, label='Фичи продукта', zorder=5)\nax.scatter(delivery_vectors[:, 0], delivery_vectors[:, 1], color='#cc4b37', s=90, label='Жалобы на логистику', zorder=5)\n\n# Новый входящий запрос пользователя\nquery_vec = np.array([2.8, 3.2])\nax.scatter(query_vec[0], query_vec[1], color='#ffae00', marker='*', s=350, zorder=6, label='Запрос: \"Сколько заработали в Q2?\"')\nax.annotate('Вектор попадает строго в кластер Финансов!\\nRAG направит запрос в SQL базу выручки',\n            xy=(query_vec[0], query_vec[1]), xytext=(query_vec[0]-2.5, query_vec[1]+1.8),\n            arrowprops=dict(arrowstyle=\"->\", color='#ffae00', lw=2), fontweight='bold')\n\nax.set_title('2D Проекция векторного пространства эмбеддингов (RAG Router)', fontsize=12, fontweight='bold')\nax.set_xlabel('Главная компонента 1')\nax.set_ylabel('Главная компонента 2')\nax.legend(loc='lower left')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Нормализация вектора\nНормализуйте вектор `v1` к единичной длине (L2 norm) и убедитесь, что его норма равна строго 1.0."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nnorm_v1 = v1 / np.linalg.norm(v1)\nl2_length = np.linalg.norm(norm_v1)\n\nprint(f\"Длина нормализованного вектора: {l2_length:.4f}\")\nassert np.isclose(l2_length, 1.0), \"Длина единичного вектора обязана равняться 1.0\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Почему векторный поиск важнее ключевых слов?\nОбычный поиск по ключевым словам бессилен при опечатках, синонимах и метафорах. Эмбеддинги улавливают глубинный смысл запроса, позволяя создавать Text-to-SQL помощников нового поколения."}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 2. Векторные базы данных: индексация, метаданные и фильтрация в ChromaDB\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВекторная база данных (ChromaDB, Pinecone, Qdrant, pgvector) хранит dense-векторы эмбеддингов вместе с исходным текстом и метаданными.\nЭто основа корпоративного RAG-ассистента: аналитик загружает в нее базу знаний по метрикам, документацию DWH и бизнес-глоссарий компании.\nКритический навык: **гибридная фильтрация** (поиск по семантическому вектору с одновременным жестким фильтром по метаданным `department = 'finance'`)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения\nimport matplotlib.pyplot as plt\nimport seaborn as sns\nimport numpy as np\nimport pandas as pd\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем векторную базу знаний с косинусным сходством (Cosine Similarity) и фильтрацией по метаданным."}, {"type": "code", "content": "# Демонстрация: Векторный поиск с фильтрацией по домену\ndef cosine_similarity(v1, v2):\n    return float(np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2)))\n\nclass SimpleVectorDB:\n    def __init__(self):\n        self.documents = []\n        \n    def add(self, doc_id, text, vector, metadata):\n        self.documents.append({\n            'id': doc_id,\n            'text': text,\n            'vector': np.array(vector),\n            'metadata': metadata\n        })\n        \n    def query(self, query_vec, filter_meta=None, top_k=2):\n        results = []\n        for doc in self.documents:\n            if filter_meta:\n                match = all(doc['metadata'].get(k) == v for k, v in filter_meta.items())\n                if not match:\n                    continue\n            sim = cosine_similarity(query_vec, doc['vector'])\n            results.append((sim, doc))\n        results.sort(key=lambda x: x[0], reverse=True)\n        return results[:top_k]\n\ndb = SimpleVectorDB()\ndb.add(\"1\", \"Как считать LTV для подписочных сервисов\", [0.8, 0.9, 0.1], {\"domain\": \"finance\"})\ndb.add(\"2\", \"Инструкция по настройке SSO авторизации\", [0.1, 0.2, 0.9], {\"domain\": \"it_sec\"})\ndb.add(\"3\", \"Когортный анализ удержания клиентов (Retention)\", [0.75, 0.85, 0.15], {\"domain\": \"finance\"})\n\nquery_vec = [0.82, 0.88, 0.08]\nresults = db.query(query_vec, filter_meta={\"domain\": \"finance\"}, top_k=2)\n\nfor sim, doc in results:\n    print(f\"Документ: {doc['text']} (Similarity Score: {sim:.3f})\")"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Матрица косинусного сходства (Cosine Similarity)\nПостроим тепловую карту семантической близости запроса пользователя и документов из базы знаний."}, {"type": "code", "content": "# Построение матрицы косинусного сходства\ndoc_texts = [\"Запрос пользователя:\\n'Расчет LTV и оттока'\", \n             \"Doc 1: Расчет LTV подписки\\n(finance)\", \n             \"Doc 2: SSO авторизация\\n(it_sec)\", \n             \"Doc 3: Когортный Retention\\n(finance)\"]\n\nvectors = np.array([\n    [0.82, 0.88, 0.08],\n    [0.80, 0.90, 0.10],\n    [0.10, 0.20, 0.90],\n    [0.75, 0.85, 0.15]\n])\n\nsimilarity_matrix = np.zeros((4, 4))\nfor i in range(4):\n    for j in range(4):\n        similarity_matrix[i, j] = cosine_similarity(vectors[i], vectors[j])\n\nfig, ax = plt.subplots(figsize=(8, 6), dpi=110)\nsns.heatmap(similarity_matrix, annot=True, fmt=\".2f\", cmap=\"Blues\", \n            xticklabels=doc_texts, yticklabels=doc_texts, ax=ax,\n            cbar=False, annot_kws={\"size\": 10, \"weight\": \"bold\"})\n\nax.set_title(\"Матрица косинусного сходства (Cosine Similarity Matrix)\", fontsize=11, fontweight='bold', pad=15)\nplt.xticks(rotation=20, ha='right')\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск наиболее релевантного документа\nВычислите косинусное сходство между вектором запроса `[0.12, 0.18, 0.88]` и документами базы. Найдите id документа с максимальным скором."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nq_sec = [0.12, 0.18, 0.88]\nres_sec = db.query(q_sec, top_k=1)\nbest_sim, best_doc = res_sec[0]\n\nprint(f\"Наиболее близкий документ: id={best_doc['id']}, score={best_sim:.3f}\")\n\nassert best_doc['id'] == \"2\", \"Должен быть найден документ по безопасности (id=2)\"\nprint(\"✅ Тест успешно пройден: векторный поиск отработал безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Инженерное правило Chunking\nПри индексации документации разбивайте текст на чанки по 300–500 токенов с перекрытием (overlap) 50 токенов. Слишком большие куски размывают вектор сходства, а слишком мелкие теряют контекст."}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 3. Построение RAG-пайплайна для корпоративной аналитики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПолный конвейер RAG (Retrieval-Augmented Generation) объединяет векторное хранилище и генеративную языковую модель.\nАрхитектура пайплайна:\n1. Вопрос пользователя\n2. Извлечение топ-К релевантных фрагментов документации (Retriever)\n3. Переранжирование (Re-ranking через Cross-Encoder)\n4. Сборка промпта: Инструкция + Контекст + Вопрос\n5. Синтез ответа LLM со ссылками на источники"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения\nimport matplotlib.pyplot as plt\nimport matplotlib.patches as patches\nimport pandas as pd\nimport numpy as np\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем сборку RAG-промпта с инъекцией контекста из документации хранилища данных."}, {"type": "code", "content": "# Демонстрация: Сборка RAG контекста\ndef build_rag_prompt(user_query, retrieved_chunks):\n    context_str = \"\\n\\n\".join([f\"--- Источник: {c['source']} ---\\n{c['text']}\" for c in retrieved_chunks])\n    system_prompt = f\"\"\"Вы — корпоративный аналитический AI-ассистент.\nОтветьте на вопрос пользователя СТРОГО на основе предоставленного контекста.\n\nКОНТЕКСТ:\n{context_str}\n\nВОПРОС:\n{user_query}\n\nОТВЕТ:\"\"\"\n    return system_prompt\n\nsample_chunks = [\n    {'source': 'dbt_models/mrr.md', 'text': 'MRR рассчитывается как сумма всех активных подписок без учета НДС.'},\n    {'source': 'policies/churn.md', 'text': 'Клиент считается churned через 30 дней после неоплаты счета.'}\n]\n\nprompt = build_rag_prompt(\"Как в компании определяется отток?\", sample_chunks)\nprint(\"Сформированный RAG-промпт:\\n\")\nprint(prompt)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Архитектура RAG-пайплайна\nПостроим блок-схему промышленного RAG-пайплайна аналитика."}, {"type": "code", "content": "# Построение блок-схемы RAG архитектуры\nfig, ax = plt.subplots(figsize=(12, 5), dpi=110)\nax.set_xlim(0, 100)\nax.set_ylim(0, 100)\nax.axis('off')\n\ndef draw_step(x, y, text, color, w=16, h=16):\n    rect = patches.FancyBboxPatch((x, y), w, h, boxstyle=\"round,pad=0.6\", \n                                  facecolor=color, edgecolor=\"#333333\", linewidth=1.1)\n    ax.add_patch(rect)\n    ax.text(x + w/2, y + h/2, text, color='white', fontweight='bold', \n            fontsize=9.5, ha='center', va='center')\n\ndraw_step(2, 42, \"1. Вопрос\\nпользователя\", PRIMARY)\ndraw_step(22, 42, \"2. Векторизация\\n(Embedding)\", WARNING)\ndraw_step(42, 60, \"3A. Поиск в\\nChromaDB\", SUCCESS)\ndraw_step(42, 24, \"3B. Re-ranker\\n(Cross-Encoder)\", SECONDARY)\ndraw_step(62, 42, \"4. Сборка\\nконтекста\", WARNING)\ndraw_step(82, 42, \"5. Генерация\\nLLM ответа\", PRIMARY)\n\n# Стрелки\narrows = [\n    ((18, 50), (22, 50)),\n    ((38, 50), (42, 68)),\n    ((38, 50), (42, 32)),\n    ((58, 68), (62, 50)),\n    ((58, 32), (62, 50)),\n    ((78, 50), (82, 50))\n]\nfor p1, p2 in arrows:\n    ax.annotate(\"\", xy=p2, xytext=p1, arrowprops=dict(arrowstyle=\"->\", color=\"#444444\", lw=1.8))\n\nax.set_title(\"Промышленный конвейер корпоративного RAG-ассистента\", fontsize=12, fontweight='bold', pad=15)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка наличия контекста в промпте\nУбедитесь, что функция `build_rag_prompt` корректно внедряет вопрос и контекст источников."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert \"КОНТЕКСТ:\" in prompt\nassert \"ВОПРОС:\" in prompt\nassert \"30 дней после неоплаты\" in prompt\nprint(\"✅ Тест успешно пройден: сборка промпта с контекстом работает штатно!\")"}, {"type": "markdown", "content": "### 💡 Защита от галлюцинаций в RAG\nВсегда добавляйте в системный промпт инструкцию: *«Если информации недостаточно в контексте, ответь: 'В документации компании нет данных по этому вопросу'»*. Это исключает выдумку ответов."}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 11. Урок 4. Text-to-SQL RAG-ассистент: генерация запросов по документации DWH\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\n\n## 📌 Бизнес-контекст и методология\nНаивысшая ступень автоматизации работы аналитика — Text-to-SQL RAG агент.\nАгент принимает бизнес-запрос на естественном языке, находит описание витрин в метаданных, строит корректный SQL, исполняет его в СУБД и возвращает готовый график стейкхолдеру.\nАрхитектура включает **Self-Correction Loop**: если запрос упал с ошибкой синтаксиса, ошибка передается обратно в модель для исправления."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения\nimport matplotlib.pyplot as plt\nimport pandas as pd\nimport numpy as np\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем агентский цикл Text-to-SQL с валидацией схемы и симуляцией самоисправления."}, {"type": "code", "content": "# Демонстрация: Агентский конвейер Text-to-SQL\nclass TextToSQLAgent:\n    def __init__(self, schema_tables):\n        self.schema = schema_tables\n        \n    def generate_and_validate(self, user_question):\n        # 1. Генерация (симуляция)\n        generated_sql = \"SELECT city, SUM(mrr) as total_mrr FROM saas_users GROUP BY city;\"\n        \n        # 2. Валидация синтаксиса и колонок\n        is_valid = \"saas_users\" in generated_sql and \"total_mrr\" in generated_sql\n        return {\n            'question': user_question,\n            'sql': generated_sql,\n            'status': 'VALID' if is_valid else 'ERROR',\n            'attempts': 1\n        }\n\nagent = TextToSQLAgent([\"saas_users\", \"orders\", \"customers\"])\nresult = agent.generate_and_validate(\"Посчитай выручку по городам\")\ndisplay(pd.DataFrame([result]))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Точность Text-to-SQL агентов (Accuracy Benchmark)\nСравним точность генерации SQL на бенчмарке Spider / BIRD при использовании схемы, RAG-контекста и цикла самоисправления (Self-Correction)."}, {"type": "code", "content": "# Визуализация точности Text-to-SQL конвейера\nstages = ['Базовая LLM\\n(Zero-Shot)', 'LLM + DDL Схема\\n(Schema-Informed)', 'RAG + Правила dbt\\n(Context-Aware)', 'RAG + Self-Correction\\n(Production Agent)']\nexecution_accuracy = [42.0, 71.5, 86.0, 94.8]\n\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\nbars = ax.bar(stages, execution_accuracy, color=[ALERT, WARNING, PRIMARY, SUCCESS], \n              edgecolor='#333333', linewidth=0.6, width=0.55)\n\nax.set_title(\"Бенчмарк точности Text-to-SQL на реальных аналитических задачах (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Execution Accuracy (%)\", fontsize=11)\nax.set_ylim(0, 110)\nax.axhline(90.0, color=SUCCESS, linestyle='--', alpha=0.7, label='Промышленный порог надежности (90%)')\nax.legend(loc='upper left', frameon=True, facecolor='#ffffff')\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"{h:.1f}%\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка статуса выполнения агента\nПроверьте, что статус генерации запроса равен `VALID` и количество попыток не превышает 2."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert result['status'] == 'VALID'\nassert result['attempts'] <= 2\nprint(\"✅ Тест успешно пройден: Text-to-SQL агент сформировал валидный запрос!\")"}, {"type": "markdown", "content": "### 💡 Безопасность Text-to-SQL\nНикогда не давайте Text-to-SQL агенту права на запись (`DROP`, `DELETE`, `UPDATE`, `INSERT`). Подключение к СУБД должно выполняться строго под сервисной учетной записью с правами `READ ONLY`."}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12. AI агенты и автоматический анализ", "cat": "AI стек", "badge": "Агенты", "icon": "", "desc": "Паттерн ReAct, LangChain, автономные аналитические агенты, вызывающие SQL и код.", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты & LLM Evaluation)\n\n---\n\n### Вопрос 1\nЧто лежит в основе паттерна ReAct для автономных агентов?\n- [ ] Однократный ответ без проверки.\n- [x] Цикл: рассуждение (Thought) -> выбор инструмента и действие (Action) -> наблюдение за результатом (Observation) -> корректировка дальнейших шагов.\n- [ ] Перезагрузка базы данных.\n*Объяснение*: ReAct позволяет агенту динамически адаптировать свой план при получении промежуточных данных.\n\n---\n\n### Вопрос 2\nЧто означает метрика Faithfulness во фреймворках тестирования LLM (Ragas / DeepEval)?\n- [ ] Скорость генерации ответа в токенах за секунду.\n- [x] Доля утверждений в сгенерированном ответе, которые строго подтверждаются контекстом переданных данных (отсутствие галлюцинаций).\n- [ ] Количество положительных отзывов пользователей.\n*Объяснение*: Faithfulness гарантирует, что ИИ не додумал цифры от себя.\n\n---\n\n### Вопрос 3\nКакую роль выполняет LLM-as-a-Judge в индустрии 2027 года?\n- [ ] Вынесение юридических приговоров.\n- [x] Использование сильной LLM для автоматической оценки качества, корректности и точности работы других прикладных моделей и пайплайнов на тестовых датасетах.\n- [ ] Блокировка спама.\n*Объяснение*: LLM-as-a-Judge масштабирует проверку качества аналитики без необходимости вручную вычитывать тысячи ответов.\n\n---\n\n### Вопрос 4\nЧто представляет собой цикл ReAct (Reason + Act) в агентных системах?\n- [ ] Быстрое обновление страницы в браузере.\n- [x] Чередование шагов размышления модели (Thought), вызова инструмента (Action) и анализа ответа инструмента (Observation) до достижения цели.\n- [ ] Автоматическое удаление неверных файлов.\n*Объяснение*: ReAct позволяет агенту динамически планировать следующие шаги на основе фактических данных.\n\n---\n\n### Вопрос 5\nЗачем в коде AI-агентов обязательно настраивать параметр max_iterations?\n- [ ] Чтобы ограничить расход электричества.\n- [x] Чтобы предотвратить бесконечный цикл и исчерпание баланса API при возникновении непредвиденной ошибки в одном из инструментов.\n- [ ] Это требование языка Python.\n*Объяснение*: Ограничитель итераций — базовый предохранитель стабильности продакшен-систем.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 1. Концепция AI-агентов: ReAct, вызов инструментов (Tool Calling) и память\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\n\n## 📌 Бизнес-контекст и методология\nОбычная языковая модель — это статический генератор текста.\n**AI-агент (Agentic Workflow)** — это автономная система, обладающая:\n1. **Планированием (Reasoning / Thought):** декомпозиция сложной бизнес-задачи на подцели\n2. **Инструментами (Action / Tools):** выполнение SQL-запросов, запуск Python-кода, чтение API\n3. **Наблюдением (Observation):** анализ результата работы инструмента\n4. **Рефлексией (Verification):** проверка корректности и исправление ошибок (ReAct цикл)"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Итерационный цикл ReAct агента\nСмоделируем агентский цикл выполнения аналитического поручения: *«Посчитай выручку по топ-3 категориям и сохрани график»*."}, {"type": "code", "content": "# Демонстрация: Симуляция шагов ReAct цикла\nagent_trace = pd.DataFrame({\n    'Шаг': [1, 2, 3, 4, 5],\n    'Фаза ReAct': ['Thought', 'Action', 'Observation', 'Thought', 'Final Answer'],\n    'Содержание': [\n        'Нужно запросить схему таблиц для поиска категорий',\n        'execute_sql(\"PRAGMA table_info(products);\")',\n        'Таблица содержит поля product_id, category, price',\n        'Пишу SQL запрос с GROUP BY category и расчетом суммы',\n        'Выручка рассчитана: Electronics ($740k), Fashion ($720k), Beauty ($603k)'\n    ]\n})\ndisplay(agent_trace)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Архитектура автономного цикла ReAct\nПостроим блок-схему взаимодействия компонентов аналитического агента."}, {"type": "code", "content": "# Визуализация агентского цикла\nimport matplotlib.patches as patches\n\nfig, ax = plt.subplots(figsize=(10, 4.5), dpi=110)\nax.set_xlim(0, 100)\nax.set_ylim(0, 100)\nax.axis('off')\n\ndef draw_agent_box(x, y, text, color, w=18, h=18):\n    rect = patches.FancyBboxPatch((x, y), w, h, boxstyle=\"round,pad=0.6\", \n                                  facecolor=color, edgecolor=\"#333333\", linewidth=1.1)\n    ax.add_patch(rect)\n    ax.text(x + w/2, y + h/2, text, color='white', fontweight='bold', \n            fontsize=9.5, ha='center', va='center')\n\ndraw_agent_box(4, 40, \"1. Бизнес\\nзапрос\", PRIMARY)\ndraw_agent_box(28, 40, \"2. Thought\\n(Планирование)\", WARNING)\ndraw_agent_box(52, 65, \"3A. Tool:\\nSQL Query\", SUCCESS)\ndraw_agent_box(52, 15, \"3B. Tool:\\nPython Sandbox\", SUCCESS)\ndraw_agent_box(76, 40, \"4. Верификация\\nи ответ\", PRIMARY)\n\n# Стрелки цикла\nax.annotate(\"\", xy=(28, 49), xytext=(22, 49), arrowprops=dict(arrowstyle=\"->\", color=\"#333333\", lw=1.8))\nax.annotate(\"\", xy=(52, 74), xytext=(46, 49), arrowprops=dict(arrowstyle=\"->\", color=\"#333333\", lw=1.8))\nax.annotate(\"\", xy=(52, 24), xytext=(46, 49), arrowprops=dict(arrowstyle=\"->\", color=\"#333333\", lw=1.8))\nax.annotate(\"\", xy=(76, 49), xytext=(70, 74), arrowprops=dict(arrowstyle=\"->\", color=\"#333333\", lw=1.8))\nax.annotate(\"\", xy=(76, 49), xytext=(70, 24), arrowprops=dict(arrowstyle=\"->\", color=\"#333333\", lw=1.8))\n\nax.set_title(\"ReAct Agentic Workflow: Цикл рассуждений и применения инструментов\", fontsize=12, fontweight='bold', pad=15)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Количество шагов агента\nПроверьте количество шагов, зафиксированных в трейсе выполнения `agent_trace`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsteps_count = len(agent_trace)\nprint(f\"Всего шагов в трейсе: {steps_count}\")\n\nassert steps_count == 5, \"Трейс должен содержать 5 шагов\"\nprint(\"✅ Тест успешно пройден: логика ReAct цикла подтверждена!\")"}, {"type": "markdown", "content": "### 💡 Защита от зацикливания агента (Loop Guard)\nВсегда задавайте параметр `max_iterations = 10`. Если агент не может решить задачу за 10 шагов, он обязан прервать цикл и запросить уточнение у человека-аналитика."}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 2. LangChain и LlamaIndex для аналитики: структурирование знаний\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nФреймворки LangChain и LlamaIndex предоставляют готовые кирпичики для сборки корпоративных агентов:\n- Загрузчики данных из SQL, CSV, Google Sheets\n- Управление историей диалога (Conversation Memory)\n- Индексация табличных структур\nОднако в 2027 году аналитики переходят на легковесные нативные SDK (Anthropic Tool Use / OpenAI Swarm), избегая избыточных абстракций."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Расход памяти и токенов в многошаговых сессиях\nСравним рост расхода контекста при различных стратегиях управления памятью агента."}, {"type": "code", "content": "# Демонстрация: Динамика роста токенов в памяти агента\nturns = np.arange(1, 11)\ntokens_full_history = turns * 1800\ntokens_summary_memory = np.where(turns <= 3, turns * 1800, 3 * 1800 + (turns - 3) * 450)\n\nmemory_df = pd.DataFrame({\n    'Ход диалога': turns,\n    'Полная история (Full History)': tokens_full_history,\n    'Сжатая память (Summary Memory)': tokens_summary_memory\n})\ndisplay(memory_df.tail(4))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Оптимизация контекстного окна агента\nПостроим сравнение потребления токенов при росте длины диалога."}, {"type": "code", "content": "# Визуализация потребления памяти\nfig, ax = plt.subplots(figsize=(9, 4.5), dpi=110)\n\nax.plot(turns, memory_df['Полная история (Full History)'], marker='o', color=ALERT, linewidth=2, label='Полная память (Перерасход)')\nax.plot(turns, memory_df['Сжатая память (Summary Memory)'], marker='s', color=SUCCESS, linewidth=2.5, label='Сжатая память (Summary Buffer)')\n\nax.set_title(\"Потребление токенов контекста при многошаговом анализе\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Номер шага диалога\", fontsize=11)\nax.set_ylabel(\"Токены в контексте\", fontsize=11)\nax.legend(frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Экономия токенов на 10-м ходе\nПосчитайте разницу в токенах между полной историей и сжатой памятью на 10-м ходе."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndiff_tokens = memory_df.loc[9, 'Полная история (Full History)'] - memory_df.loc[9, 'Сжатая память (Summary Memory)']\nprint(f\"Сэкономлено токенов на 10-м шаге: {diff_tokens:,}\")\n\nassert diff_tokens > 9000, \"Экономия должна превышать 9000 токенов\"\nprint(\"✅ Тест успешно пройден: сжатие памяти предотвращает переполнение контекста!\")"}, {"type": "markdown", "content": "### 💡 Стратегия Memory Pruning\nСбрасывайте сырые SQL-выборки из памяти агента после формирования итогового ответа. Храните в долгосрочной памяти только агрегированные цифры и финальные выводы."}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 3. Автоматизированные агенты сбора данных: веб-скрапинг и API-мониторинг\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАвтономный сбор конкурентной разведки (цены конкурентов, доступность товаров, отзывы на маркетплейсах) — задача агентов сбора данных.\nАналитик настраивает агента, который:\n- Обходит страницы через Headless-браузер\n- Преодолевает изменения в верстке с помощью визуальных моделей\n- Контролирует лимиты частоты запросов (Rate Limiting)\n- Складывает очищенные данные в DWH"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Контроль троттлинга и надежности сбора\nСмоделируем сбор цен конкурентов с контролем адаптивного троттлинга (Adaptive Rate Limiting)."}, {"type": "code", "content": "# Демонстрация: Мониторинг успешности сбора данных\nscraping_metrics = pd.DataFrame({\n    'Источник (Маркетплейс)': ['Competitor A', 'Competitor B', 'Competitor C', 'Competitor D'],\n    'Собрано карточек': [12500, 18400, 9200, 15100],\n    'Ошибки 429/503 (%)': [0.2, 0.4, 0.1, 0.3],\n    'Полнота атрибутов (%)': [99.2, 98.5, 99.8, 99.1]\n})\ndisplay(scraping_metrics)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Производительность агентов сбора данных\nПостроим сравнение объемов собранных данных и качества парсинга."}, {"type": "code", "content": "# Визуализация объемов сбора данных\nfig, ax = plt.subplots(figsize=(8, 4.5), dpi=110)\n\nbars = ax.bar(scraping_metrics['Источник (Маркетплейс)'], scraping_metrics['Собрано карточек'],\n              color=PRIMARY, edgecolor='#333333', linewidth=0.6, width=0.5)\n\nax.set_title(\"Объем собранных конкурентных данных за сутки (карточек)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Количество товаров\", fontsize=11)\nax.set_ylim(0, 22000)\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"{h:,}\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Суммарный объем спарсенных данных\nПосчитайте общее количество собранных карточек товаров по всем 4 маркетплейсам."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_scraped = scraping_metrics['Собрано карточек'].sum()\nprint(f\"Всего собрано позиций: {total_scraped:,}\")\n\nassert total_scraped == 55200, \"Сумма должна равняться 55,200\"\nprint(\"✅ Тест успешно пройден: конвейер сбора данных работает штатно!\")"}, {"type": "markdown", "content": "### 💡 Этичный парсинг и robots.txt\nАгенты должны строго соблюдать задержки между запросами (не менее 1–2 секунд) и проверять `robots.txt`, чтобы не создавать паразитной нагрузки на серверы источников."}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 12. Урок 4. Оценка и мониторинг AI-агентов: LLM-as-a-Judge и трекинг дрифта\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКак понять, что аналитический AI-агент работает качественно и не деградирует со временем?\nИндустриальный стандарт оценки — **LLM-as-a-Judge (G-Eval / DeepEval)**:\nНезависимая сильная модель (Claude 3.7 / GPT-4.5) оценивает ответы рабочего агента по 4 критериям:\n1. **Faithfulness (Фактологичность):** отсутствие галлюцинаций относительно базы данных\n2. **Answer Relevance (Релевантность):** точность ответа на поставленный бизнес-вопрос\n3. **Execution Success:** корректность и безопасность сгенерированного SQL\n4. **Latency & Cost SLA:** укладывается ли ответ в рамки бюджета и времени"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARN
