st['city'].isin(['Moscow', 'Saint Petersburg', 'Kazan'])) &\n    (df_cust['device'].str.contains('Mobile')) &\n    (df_cust['acquisition_channel'] == 'Paid Ads')\n]\n\nprint(f\"Всего пользователей: {len(df_cust)}\")\nprint(f\"Пользователей в целевом сегменте: {len(target_segment)} ({len(target_segment)/len(df_cust)*100:.1f}%)\")\nprint(target_segment[['customer_id', 'first_name', 'city', 'device']].head(4))\n"}]}, {"filename": "lesson_03_pandas_aggregations_merge.ipynb", "rel_path": "course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb", "cells": [{"type": "markdown", "content": "# 🧩 Модуль 3. Урок 3: Агрегации, группировки и слияния таблиц (Merge / Concat)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_03_pandas_aggregations_merge.ipynb)\n\n---\n\n## 1. Реальный бизнес-кейс: Юнит-экономика товарных категорий\n\nОбъединяем продажи, себестоимость и данные клиентов для расчета чистой прибыли по категориям.\n"}, {"type": "code", "content": "import pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\n\n# Сквозной merge\nfull_df = items.merge(orders, on='order_id').merge(products, on='product_id')\nfull_df = full_df[full_df['status'] == 'Completed']\n\n# Расчет валовой прибыли\nfull_df['gross_profit'] = full_df['total_amount'] - (full_df['cost'] * full_df['quantity'])\n\n# Группировка с несколькими метриками\ncat_pnl = full_df.groupby('category').agg(\n    revenue=('total_amount', 'sum'),\n    gross_profit=('gross_profit', 'sum'),\n    orders_count=('order_id', 'nunique'),\n    avg_order_value=('total_amount', 'mean')\n).reset_index()\n\ncat_pnl['margin_pct'] = (cat_pnl['gross_profit'] / cat_pnl['revenue'] * 100).round(1)\nprint(\"UNIT-ЭКОНОМИКА КАТЕГОРИЙ:\")\nprint(cat_pnl.sort_values(by='revenue', ascending=False))\n"}]}, {"filename": "lesson_04_visualization_seaborn_matplotlib.ipynb", "rel_path": "course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 3. Урок 4: Визуализация данных в Python (Matplotlib & Seaborn)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_04_visualization_seaborn_matplotlib.ipynb)\n\n---\n\n## 1. Когда какой график использовать в бизнесе?\n\n- **Boxplot (Ящик с усами)**: Сравнение медианы и разброса метрики между сегментами (выявление аномалий).\n- **Lineplot (Линия)**: Динамика во времени, сезонность.\n- **Barplot (Столбцы)**: Сравнение дискретных категорий.\n- **Heatmap (Тепловая карта)**: Корреляционная матрица, когортные сетки.\n"}, {"type": "code", "content": "import pandas as pd\nimport seaborn as sns\nimport matplotlib.pyplot as plt\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\nplt.figure(figsize=(10, 5))\nsns.violinplot(data=saas, x='plan', y='nps_score', hue='is_churned', split=True, palette='Blues_r')\nplt.title('Распределение NPS по тарифам и факту оттока клиентов', fontsize=13, pad=12)\nplt.xlabel('Тарифный план')\nplt.ylabel('Оценка NPS')\nplt.grid(axis='y', alpha=0.3)\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_code_review_ai_validation.ipynb", "rel_path": "course/module_03_python/lesson_05_code_review_ai_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🕵️ Модуль 3. Урок 5: Code Review кода от ИИ: Поиск скрытых математических багов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_05_code_review_ai_validation.ipynb)\n\n---\n\n## 1. Классические галлюцинации LLM при написании аналитического кода\n\n1. **Среднее от процентов (Averaging Averages)**: ИИ берет конверсию филиала 1 (10%) и филиала 2 (2%) и считает: `(10 + 2) / 2 = 6%`. Но в филиале 1 было 10 посетителей, а в филиале 2 — 10 000! Реальная конверсия будет около 2.01%, а не 6%!\n2. **Утечка будущего (Data Leakage)**: Использование данных из будущего при фильтрации когорт.\n3. **Замена NaN на 0 без предупреждения**: Искажает медиану и стандартное отклонение.\n"}, {"type": "code", "content": "# Демонстрация критической ошибки \"Среднее от процентов\"\nimport pandas as pd\n\nbranch_data = pd.DataFrame({\n    'Филиал': ['Точка А (Маленькая)', 'Точка Б (Флагман)'],\n    'Посетители': [10, 10000],\n    'Покупки': [1, 200]\n})\nbranch_data['CR'] = branch_data['Покупки'] / branch_data['Посетители']\n\n# ОШИБКА НЕЙРОСЕТИ:\nbad_cr = branch_data['CR'].mean()\n\n# ПРАВИЛЬНЫЙ РАСЧЕТ АНАЛИТИКА:\ntrue_cr = branch_data['Покупки'].sum() / branch_data['Посетители'].sum()\n\nprint(f\"Ошибка ИИ (Среднее от процентов): {bad_cr*100:.2f}% (ОШИБКА В 3 РАЗА!)\")\nprint(f\"Истинная сквозная конверсия: {true_cr*100:.2f}%\")\n"}]}]}, {"id": "module_04_data_cleaning", "title": "Модуль 4. Очистка данных и Data Quality", "cat": "Хард база", "badge": "Качество", "icon": "🧹", "desc": "Пропуски, аномалии, дедупликация, приведение типов и автоматические валидаторы.", "readme": "# 🧹 Модуль 4: Очистка и трансформация данных (Data Cleaning)\n\n## 📌 О модуле\n«Garbage In — Garbage Out». Если данные грязные, любая нейросеть, дашборд или статистический тест дадут ложный результат. В этом модуле мы учимся автоматизировать обнаружение пропусков, выбросов, невалидных форматов и дублей.\n\n## 🎯 Learning Outcomes\n- **Understand**: Причины появления грязных данных (человеческий фактор, сетевые сбои, миграции БД).\n- **Apply**: Методы заполнения пропусков (Forward Fill, медиана, моделирование), удаление дублей.\n- **Analyze**: Детекция аномалий (Z-score, метод межквартильного размаха IQR).\n- **Create**: Воспроизводимый пайплайн предобработки сырых данных на Python.\n\n## 📚 Уроки\n1. `lesson_01_dirty_data_types_missing_values.ipynb` — Работа с Missing Values (MCAR, MAR, MNAR) и приведение типов.\n2. `lesson_02_duplicates_string_cleaning_regex.ipynb` — Нормализация строк, дедупликация, регулярные выражения (RegEx).\n3. `lesson_03_outliers_anomaly_detection.ipynb` — Выбросы: когда их удалять, а когда исследовать как инсайт.\n4. `lesson_04_automated_cleaning_pipelines.ipynb` — Построение автоматического пайплайна очистки сырого датасета.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 4 (Очистка и качество данных)\n\n---\n\n### Вопрос 1\nЧто означает пропуск типа MNAR (Missing Not at Random)?\n- [ ] Данные потерялись из-за случайного обрыва связи Wi-Fi.\n- [x] Вероятность отсутствия значения напрямую связана с самим этим скрытым значением (например, люди с очень низким доходом отказываются его называть).\n- [ ] Ошибка в формате даты.\n*Объяснение*: При MNAR нельзя просто удалять строки или заменять их на среднее, так как это системно исказит распределение.\n\n---\n\n### Вопрос 2\nЧто делать, если в транзакциях интернет-магазина обнаружен заказ на сумму в 50 раз выше среднего чека?\n- [ ] Немедленно удалить этот заказ как выброс.\n- [x] Проверить контекст: если это реальный оптовый покупатель, сохранить его в базе, но при расчете розничного среднего чека выделить в отдельный B2B-сегмент.\n- [ ] Заменить сумму на медиану.\n*Объяснение*: Выбросы в коммерческих данных часто представляют наиболее ценный сегмент клиентов (B2B, киты), который требует отдельного анализа.\n\n---\n\n### Вопрос 3\nКакое регулярное выражение (RegEx) извлечет только цифры из строки `Order #4592-A`?\n- [ ] `[A-Z]+`\n- [x] `\\d+`\n- [ ] `\\s+`\n*Объяснение*: `\\d` обозначает digit (любую цифру от 0 до 9), а квантификатор `+` означает одно или более вхождений.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_dirty_data_types_missing_values.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb", "cells": [{"type": "markdown", "content": "# 🧹 Модуль 4. Урок 1: Missing Values: MCAR, MAR, MNAR и приведение типов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_01_dirty_data_types_missing_values.ipynb)\n\n---\n\n## 1. Теория пропусков в данных: Три типа Missing Values\n\nНельзя просто так брать и заполнять все пропуски средним. В статистике выделяют 3 природы отсутствия данных:\n1. **MCAR (Missing Completely at Random)**: Пропуск абсолютно случаен (например, случайный сбой датчика сети). Удаление строк не смещает оценку.\n2. **MAR (Missing at Random)**: Вероятность пропуска зависит от других наблюдаемых полей (например, женщины реже указывают возраст в анкете, но чаще указывают образование).\n3. **MNAR (Missing Not at Random)**: Пропуск зависит от самого ненаблюдаемого значения (например, люди с экстремально высоким или нулевым доходом скрывают свой доход). Заполнение медианой приведет к катастрофическому смещению!\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Реальный кейс: Обработка пропусков в зависимости от природы данных\ndirty_users = pd.DataFrame({\n    'user_id': range(1, 6),\n    'income': [50000, np.nan, 75000, np.nan, 120000],\n    'is_employed': [1, 0, 1, 0, 1], # Если человек не работает, доход пропущен осмысленно!\n    'age': [25, 42, np.nan, 31, 55]\n})\n\nprint(\"СЫРЫЕ ДАННЫЕ С ПРОПУСКАМИ:\")\nprint(dirty_users)\n\n# Умная импутация:\n# 1. Если не трудоустроен — ставим 0\ndirty_users.loc[dirty_users['is_employed'] == 0, 'income'] = dirty_users.loc[dirty_users['is_employed'] == 0, 'income'].fillna(0)\n# 2. Для возраста берем медиану\ndirty_users['age'] = dirty_users['age'].fillna(dirty_users['age'].median())\n\nprint(\"\\nОЧИЩЕННЫЕ ДАННЫЕ БЕЗ СМЕЩЕНИЯ ВЫБОРКИ:\")\nprint(dirty_users)\n"}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "cells": [{"type": "markdown", "content": "# 🔤 Модуль 4. Урок 2: Дедупликация и нормализация текста с RegEx\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\n\n---\n\n## 1. Регулярные выражения (RegEx) для аналитика\n\nРегулярные выражения — суперсила для очистки грязных телефонов, email, промокодов и артикулов:\n- `\\d+` — одна или более цифр.\n- `[A-Za-z]+` — латинские буквы.\n- `^...$` — начало и конец строки.\n"}, {"type": "code", "content": "import pandas as pd\n\nraw_logistics = pd.DataFrame({\n    'tracking_number': ['RU-123456-X', 'ru_123456_x ', 'RU123456X', 'Order #999999-Y'],\n    'customer_phone': ['+7 (999) 123-45-67', '89991234567', '79991234567', '+7 999 123 45 67']\n})\n\n# Нормализуем трек-номера: удаляем пробелы, переводим в верхний регистр, убираем знаки препинания\nraw_logistics['tracking_clean'] = raw_logistics['tracking_number'].str.upper().str.replace(r'[^A-Z0-9]', '', regex=True)\n\n# Нормализуем телефон в стандартный формат E.164: +7XXXXXXXXXX\ndigits = raw_logistics['customer_phone'].str.replace(r'\\D', '', regex=True)\nraw_logistics['phone_clean'] = digits.apply(lambda x: '+7' + x[1:] if x.startswith('8') else '+' + x)\n\nprint(\"РЕЗУЛЬТАТ REGEX-ОЧИСТКИ:\")\nprint(raw_logistics[['tracking_clean', 'phone_clean']])\n"}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "cells": [{"type": "markdown", "content": "# 🚨 Модуль 4. Урок 3: Детекция аномалий и выбросов: IQR, Z-Score, Isolation\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\n\n---\n\n## 1. Когда выброс — это ошибка, а когда — ключевой инсайт бизнеса?\n\n- **Выброс-ошибка**: Сумма заказа = -100 руб или возраст клиента = 200 лет. Удаляем или исправляем.\n- **Выброс-инсайт**: Заказ на 5 000 000 руб при среднем чеке 3 000 руб. Это оптовый B2B-клиент. Если вы просто удалите его из базы, вы исказите выручку на 30%!\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\n\n# Расчет Z-score: z = (x - mean) / std\nmean_amt = items['total_amount'].mean()\nstd_amt = items['total_amount'].std()\nitems['z_score'] = (items['total_amount'] - mean_amt) / std_amt\n\n# Аномалии с Z-score > 3 (вероятность при нормальном распределении < 0.3%)\nanomalies = items[items['z_score'].abs() > 3]\nprint(f\"Средняя сумма позиции: ${mean_amt:.2f} | Std: ${std_amt:.2f}\")\nprint(f\"Обнаружено статистических аномалий (|z| > 3): {len(anomalies)} строк\")\nprint(anomalies[['order_item_id', 'total_amount', 'z_score']].head(5))\n"}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "cells": [{"type": "markdown", "content": "# ⚙️ Модуль 4. Урок 4: Построение продакшен-пайплайна валидации данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\n\n---\n\n## 1. Концепция Data Contracts и Assert-валидации\n\nВ зрелых командах аналитики пишут проверки-утверждения (`assert`), предотвращающие попадание битых данных в витрины.\n"}, {"type": "code", "content": "import pandas as pd\n\ndef validate_and_clean_orders(raw_df: pd.DataFrame) -> pd.DataFrame:\n    df = raw_df.copy()\n    \n    # Инвариант 1: Уникальность первичного ключа\n    assert df['order_id'].nunique() == len(df), \"КРИТИЧЕСКИЙ СБОЙ: Дубликаты в order_id!\"\n    \n    # Очистка\n    df = df.dropna(subset=['order_id', 'customer_id'])\n    df['order_date'] = pd.to_datetime(df['order_date'])\n    \n    # Инвариант 2: Статусы только из белого списка\n    valid_statuses = {'Completed', 'Refunded', 'Cancelled'}\n    df = df[df['status'].isin(valid_statuses)]\n    \n    return df\n\norders_raw = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\norders_clean = validate_and_clean_orders(orders_raw)\nprint(f\"Пайплайн валидации успешно пройден! Валидных заказов: {len(orders_clean):,}\")\n"}]}]}, {"id": "module_05_statistics", "title": "Модуль 5. Статистика и проверка гипотез", "cat": "Аналитика", "badge": "Статы", "icon": "📈", "desc": "ЦПТ, p-value, t-тест Стьюдента, Манн-Уитни, бутстреп и доверительные интервалы.", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика & Гипотезы)\n\n---\n\n### Вопрос 1\nЧто в строгом математическом смысле показывает $p\\text{-value} = 0.02$?\n- [ ] Вероятность того, что альтернативная гипотеза верна, равна 98%.\n- [x] Вероятность получить такое же или еще более сильное различие случайно, если нулевая гипотеза (об отсутствии эффекта) на самом деле верна, составляет 2%.\n- [ ] Ошибка в расчете доверительного интервала.\n*Объяснение*: $p$-value — это условная вероятность наблюдаемых данных при истинности нулевой гипотезы $P(\\text{Data} | H_0)$.\n\n---\n\n### Вопрос 2\nВ каких случаях следует отдать предпочтение U-критерию Манна-Уитни перед t-тестом Стьюдента?\n- [ ] Когда выборка идеально подчиняется нормальному распределению Гаусса.\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты и не подчиняются нормальному распределению (например, доходы или чеки).\n- [ ] Когда сравниваются доли конверсий.\n*Объяснение*: Манна-Уитни — непараметрический ранговый критерий, он сравнивает распределение рангов и устойчив к экстремальным выбросам.\n\n---\n\n### Вопрос 3\nЧто описывает Парадокс Симпсона?\n- [ ] Ошибку округления при делении на ноль.\n- [x] Ситуацию, когда тренд, наблюдаемый в отдельных подгруппах данных, полностью исчезает или меняет знак на противоположный при объединении этих групп.\n- [ ] Корреляцию двух не связанных случайных величин.\n*Объяснение*: Парадокс возникает из-за неравномерного распределения скрытой переменной (confounding variable), например, перекоса трафика между десктопом и мобайлом.\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "cells": [{"type": "markdown", "content": "# 📐 Модуль 5. Урок 1: Описательная статистика: Мода, Медиана, Дисперсия и Квартили\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\n\n---\n\n## 1. Почему среднее врет в 80% задач бизнеса?\n\nВ реальной жизни большинство продуктовых и финансовых метрик (чеки, зарплаты, время сессии в приложении) подчиняются **скошенным распределениям с тяжелыми правыми хвостами** (Log-normal, Pareto).\n\n- **Среднее (Mean)**: Чувствительно к единичным крупным выбросам.\n- **Медиана (Median, 50-й перцентиль)**: Робастная метрика, делящая выборку ровно пополам.\n"}, {"type": "code", "content": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n# Симулируем распределение доходов пользователей (Парето)\nnp.random.seed(42)\nincomes = np.random.pareto(a=2.5, size=5000) * 40000 + 25000\n\nmean_val = np.mean(incomes)\nmedian_val = np.median(incomes)\nq75 = np.percentile(incomes, 75)\nq90 = np.percentile(incomes, 90)\n\nprint(f\"Средний доход: {mean_val:,.0f} руб (Искажен длинным хвостом)\")\nprint(f\"Медианный доход: {median_val:,.0f} руб (Отражает реальный средний класс)\")\nprint(f\"75% пользователей зарабатывают меньше: {q75:,.0f} руб\")\nprint(f\"90% пользователей зарабатывают меньше: {q90:,.0f} руб\")\n"}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "cells": [{"type": "markdown", "content": "# 🎲 Модуль 5. Урок 2: Теория вероятностей и Теорема Байеса в Финтехе\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\n\n---\n\n## 1. Реальный кейс Банка: Антифрод-система и Базовая ставка (Base Rate Fallacy)\n\nФормула Байеса связывает априорную вероятность с новыми свидетельствами:\n$$P(\\text{Fraud} | \\text{Alert}) = \\frac{P(\\text{Alert} | \\text{Fraud}) \\cdot P(\\text{Fraud})}{P(\\text{Alert})}$$\n"}, {"type": "code", "content": "# Кейс: Модель антифрода с точностью 98%\n# P(Fraud) = 0.005 (0.5% транзакций мошеннические)\n# Sensitivity = 0.98 (поймает 98% мошенников)\n# False Positive Rate = 0.02 (на 2% честных операций ложно сработает)\n\np_fraud = 0.005\np_clean = 0.995\np_alert_fraud = 0.98\np_alert_clean = 0.02\n\n# Полная вероятность срабатывания алерта\np_alert = (p_alert_fraud * p_fraud) + (p_alert_clean * p_clean)\n\n# Истинная вероятность фрода при сработавшем алерте\np_true_fraud = (p_alert_fraud * p_fraud) / p_alert\n\nprint(f\"Вероятность того, что заблокированный платеж реально мошеннический: {p_true_fraud*100:.1f}%\")\nprint(\"ШОК-ВЫВОД ДЛЯ РУКОВОДСТВА: Почти 80% заблокированных операций — ЧЕСТНЫЕ КЛИЕНТЫ!\")\n"}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "cells": [{"type": "markdown", "content": "# 🔔 Модуль 5. Урок 3: Центральная предельная теорема (ЦПТ) и 95% Доверительные интервалы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\n\n---\n\n## 1. Смысл 95% Доверительного интервала (Confidence Interval)\n\nФормула для среднего значения:\n$$CI = \\bar{X} \\pm 1.96 \\cdot \\frac{\\sigma}{\\sqrt{n}}$$\n\n> **Что это значит простыми словами?** Если мы повторим наш эксперимент 100 раз и построим 100 интервалов, ровно 95 из них накроют истинное среднее генеральной совокупности.\n"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\nnp.random.seed(42)\nsample_checks = np.random.exponential(scale=2500, size=400) # 400 чеков клиентов\n\nmean = np.mean(sample_checks)\nsem = stats.sem(sample_checks) # Стандартная ошибка среднего\nci = stats.t.interval(0.95, df=len(sample_checks)-1, loc=mean, scale=sem)\n\nprint(f\"Выборочное среднее: {mean:.2f} руб\")\nprint(f\"95% Доверительный интервал: [{ci[0]:.2f}, {ci[1]:.2f}] руб\")\nprint(f\"Бизнес-интерпретация: Мы на 95% уверены, что истинный средний чек бизнеса лежит в диапазоне от {ci[0]:.0f} до {ci[1]:.0f} руб.\")\n"}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "cells": [{"type": "markdown", "content": "# ⚖️ Модуль 5. Урок 4: Проверка гипотез: $p$-value, t-тест Стьюдента и критерий Манна-Уитни\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\n\n---\n\n## 1. Решающее дерево выбора статистического критерия\n\n```\n                          [Какая метрика?]\n                                 │\n           ┌─────────────────────┴─────────────────────┐\n     [Качественная (Доли / CR)]              [Количественная (Чеки, Время)]\n           │                                           │\n  Z-test пропорций / Хи-квадрат            [Нормальное распределение?]\n                                                       │\n                                   ┌───────────────────┴───────────────────┐\n                                 [ДА]                                    [НЕТ]\n                             t-тест Стьюдента                   U-тест Манна-Уитни / Бутстрап\n```\n"}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\n# Сравнение времени загрузки двух версий приложения\nnp.random.seed(101)\ntime_v1 = np.random.normal(loc=1.8, scale=0.4, size=300) # Старая версия\ntime_v2 = np.random.normal(loc=1.65, scale=0.38, size=300) # Новая оптимизированная версия\n\n# Двухвыборочный t-тест (H0: разницы нет, H1: время отличается)\nt_stat, p_val = stats.ttest_ind(time_v1, time_v2)\n\nprint(f\"Среднее время V1: {time_v1.mean():.3f} сек\")\nprint(f\"Среднее время V2: {time_v2.mean():.3f} сек (Ускорение на 150 мс)\")\nprint(f\"p-value: {p_val:.6f}\")\n\nif p_val < 0.05:\n    print(\" Результат статистически значим (p < 0.05)! Новая версия приложения реально быстрее.\")\n"}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "cells": [{"type": "markdown", "content": "# 📈 Модуль 5. Урок 5: Корреляция vs Причинность и Регрессионный анализ (OLS)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\n\n---\n\n## 1. Уравнение множественной линейной регрессии\n\n$$Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\dots + \\epsilon$$\n\n### Главные метрики качества модели:\n- **$R^2$ (Коэффициент детерминации)**: Какую долю дисперсии целевой переменной объясняет наша модель ($0.0 \\dots 1.0$).\n- **p-value коэффициента $\\beta_i$**: Если $p > 0.05$, фактор статистически незначим и должен быть исключен.\n"}, {"type": "code", "content": "import pandas as pd\nimport statsmodels.api as sm\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\n# Исследуем, какие факторы влияют на отток (MRR компании)\nX = saas[['active_seats', 'feature_a_usage', 'nps_score']]\nX = sm.add_constant(X)\ny = saas['mrr']\n\nmodel = sm.OLS(y, X).fit()\nprint(\"РЕЗУЛЬТАТЫ РЕГРЕССИОННОГО АНАЛИЗА:\")\nprint(f\"R-squared: {model.rsquared:.3f}\")\nprint(\"\\nКоэффициенты модели:\")\nprint(model.params.round(3))\nprint(\"\\np-values факторов:\")\nprint(model.pvalues.apply(lambda x: f\"{x:.4f}\"))\n"}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "cells": [{"type": "markdown", "content": "# ⚠️ Модуль 5. Урок 6: Статистические ловушки бизнеса: Парадокс Симпсона и Ошибка выжившего\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\n\n---\n\n## 1. Классические когнитивные искажения при анализе данных\n\n1. **Парадокс Симпсона**: Направление тренда меняется на противоположное при объединении групп. Решение: Всегда исследовать данные в срезах!\n2. **Ошибка выжившего (Survivorship Bias)**: Анализ только тех клиентов, кто остался в сервисе 6 месяцев, полностью игнорируя 80% отвалившихся в первую неделю.\n3. **Регрессия к среднему (Regression to the Mean)**: Экстремальный всплеск продаж в понедельник естественным образом сменится спадом во вторник без всякого вмешательства менеджмента.\n"}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6. BI дашборды в Looker Studio", "cat": "BI", "badge": "BI", "icon": "📉", "desc": "Моделирование данных, интерактивные фильтры, executive-дашборды для бизнеса.", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio & BI)\n\n---\n\n### Вопрос 1\nКак правильно рассчитать конверсию (Conversion Rate) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Purchases / Sessions)`\n- [x] `SUM(Purchases) / SUM(Sessions)`\n- [ ] `Purchases / Sessions`\n*Объяснение*: Нельзя усреднять частные (`AVG(...)`). Необходимо вычислить отношение суммы всех покупок к сумме всех сессий.\n\n---\n\n### Вопрос 2\nЧто такое Granularity Mismatch при Data Blending?\n- [ ] Ошибка в названии столбца.\n- [x] Несоответствие уровня детализации таблиц (например, расходы сгруппированы по дням, а продажи — по конкретным секундам чеков), приводящее к задвоению метрик.\n- [ ] Нехватка оперативной памяти в браузере.\n*Объяснение*: Для корректного соединения обе таблицы должны быть приведены к одинаковому составному ключу группировки.\n\n---\n\n### Вопрос 3\nКаково правило «5 секунд» в дизайне бизнес-дашбордов?\n- [ ] Дашборд должен загружаться не более 5 секунд.\n- [x] Руководитель должен за 5 секунд понять текущий статус ключевых KPI и наличие отклонений от плана.\n- [ ] Графики должны обновляться каждые 5 секунд.\n*Объяснение*: Главные карточки метрик с индикаторами отклонения должны считываться моментально в верхнем левом углу.\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 6. Урок 1: Подключение источников данных и архитектура витрин в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\n\n---\n\n## 1. Ментальная модель BI: Измерения (Dimensions) vs Показатели (Metrics)\n\nВ Looker Studio и любом современном BI-инструменте данные жестко разделяются:\n- **Dimensions (Зеленые поля)**: Категориальные срезы, по которым данные группируются (Город, Категория, Дата, Канал привлечения).\n- **Metrics (Синие поля)**: Числовые агрегируемые величины (Выручка, Количество клиентов, Средний чек).\n\n### Золотое правило витрины данных для BI:\nНикогда не подключайте «сырые» ненормализованные логи напрямую в отчеты, если в них миллионы строк. Сначала подготовьте денормализованную витрину (Data Mart) на уровне SQL/Python.\n"}, {"type": "code", "content": "# Экспорт оптимизированной витрины для Looker Studio\nimport sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery_bi = \"\"\"\nSELECT \n    SUBSTR(o.order_date, 1, 10) AS order_date,\n    c.city,\n    c.acquisition_channel,\n    c.device,\n    p.category,\n    p.product_name,\n    oi.quantity,\n    oi.unit_price,\n    oi.total_amount AS revenue,\n    (oi.total_amount - (p.cost * oi.quantity)) AS gross_profit\nFROM orders o\nJOIN customers c ON o.customer_id = c.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nJOIN products p ON oi.product_id = p.product_id\nWHERE o.status = 'Completed';\n\"\"\"\n\nbi_data = pd.read_sql(query_bi, conn)\nbi_data.to_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\processed\\looker_studio_source.csv\", index=False)\nprint(\" ВИТРИНА ДЛЯ LOOKER STUDIO ГОТОВА:\")\nprint(f\"Строк: {len(bi_data):,} | Колонок: {len(bi_data.columns)}\")\nprint(bi_data.head(3))\n"}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "cells": [{"type": "markdown", "content": "# ⚙️ Модуль 6. Урок 2: Вычисляемые поля и логика CASE WHEN в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\n\n---\n\n## 1. Топ-3 формулы в Looker Studio\n\n### 1. Маржинальность бизнеса (% Margin):\n```sql\nSUM(gross_profit) / SUM(revenue)\n```\n*(Ошибочно писать: `AVG(gross_profit / revenue)` — это усреднит проценты без весов).*\n\n### 2. Динамическая сегментация чека:\n```sql\nCASE \n  WHEN revenue >= 15000 THEN '1. Крупный чек (>15k)'\n  WHEN revenue >= 5000 THEN '2. Средний чек (5k-15k)'\n  ELSE '3. Малый чек (<5k)'\nEND\n```\n\n### 3. Нормализация каналов рекламы:\n```sql\nCASE \n  WHEN REGEXP_MATCH(acquisition_channel, '.*(Paid|Ads).*') THEN 'Платный трафик'\n  ELSE 'Органический трафик'\nEND\n```\n"}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 6. Урок 3: Data Blending: Склейка фактов разных уровней гранулярности\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\n\n---\n\n## 1. Проблема разных уровней детализации (Granularity Mismatch)\n\nКейс:\n- **Таблица 1 (Маркетинг)**: Расходы по дням и рекламным кампаниям (Google Sheets, 1 строка на день).\n- **Таблица 2 (Продажи)**: Транзакции по каждому отдельному чеку (База данных, 500 строк на день).\nЕсли вы наивно соедините их в BI без предварительной агрегации, рекламный бюджет дня продублируется 500 раз!\n\n### Правило безопасного Blending:\nПеред объединением в Looker Studio агрегируйте обе таблицы к **единому ключу** (например: `Дата` + `Канал`).\n"}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "cells": [{"type": "markdown", "content": "# 📱 Модуль 6. Урок 4: UI/UX дизайн дашбордов для C-Level руководителей\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\n\n---\n\n## 1. Принцип Actionable Dashboard: Ответ за 5 секунд\n\nТоп-менеджер не должен разгадывать дашборд как ребус.\nЭкран делится на 3 смысловых яруса:\n1. **Верхний ярус (Карточки Scorecard)**: Выручка, Количество заказов, Средний чек, LTV/CAC с динамикой к прошлому периоду ($\\Delta\\%$).\n2. **Средний ярус (Тренды)**: Линейный график динамики за 90 дней и столбчатая диаграмма структуры по категориям.\n3. **Нижний ярус (Детализация)**: Таблица лидеров и аутсайдеров с условным цветовым форматированием (Heatmap).\n"}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "cells": [{"type": "markdown", "content": "# 🎛️ Модуль 6. Урок 5: Интерактивные фильтры, параметры и Drill-down\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\n\n---\n\n## 1. Превращение статического отчета в инструмент исследователя\n\n- **Cross-filtering (Кросс-фильтрация)**: Клик по столбцу категории на одной диаграмме мгновенно пересчитывает все остальные графики страницы.\n- **Drill-down**: Иерархия уровней (`Год -> Квартал -> Месяц -> День`).\n- **Срезы по устройствам (Device Slicers)**: Выбор Desktop / Mobile.\n"}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7. A/B тестирование и эксперименты", "cat": "Аналитика", "badge": "A/B", "icon": "🧪", "desc": "Расчет размера выборки, MDE, ловушка подглядывания (Peeking), SRM и множественные тесты.", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B-тестирование)\n\n---\n\n### Вопрос 1\nЧто происходит с реальным уровнем ошибки I рода ($\\alpha$), если аналитик каждый день проверяет тест и останавливает его при первом $p < 0.05$ (Peeking Problem)?\n- [ ] Ошибка остается строго 5%.\n- [x] Реальная вероятность ложноположительного результата подскакивает до 30-40%, фиксируя случайный шум.\n- [ ] Ошибка уменьшается до нуля.\n*Объяснение*: Непрерывный мониторинг накапливает вероятность случайного пересечения порога 0.05.\n\n---\n\n### Вопрос 2\nЧто показывает Sample Ratio Mismatch (SRM)?\n- [ ] Разницу в конверсиях между группами.\n- [x] Нарушение запланированного соотношения объемов трафика в группах (например, 48/52 вместо 50/50), указывающее на технический сбой рандомизатора.\n- [ ] Ошибку в расчете выручки.\n*Объяснение*: При наличии SRM результаты сравнения метрик между группами математически невалидны.\n\n---\n\n### Вопрос 3\nЗачем нужны Guardrail-метрики в эксперименте?\n- [ ] Чтобы ускорить расчет p-value.\n- [x] Чтобы предотвратить раскатку фичи, которая вырастила локальную метрику за счет разрушения глобального здоровья бизнеса (например, рост кликов ценой падения выручки).\n- [ ] Для шифрования данных.\n*Объяснение*: Guardrail-метрики защищают ключевые бизнес-показатели от деградации.\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "cells": [{"type": "markdown", "content": "# 🧪 Модуль 7. Урок 1: Дизайн эксперимента: Метрики OEC, Sample Size и MDE\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\n\n---\n\n## 1. Математика планирования A/B-эксперимента\n\nНикогда не запускайте тест со словами: *«Покрутим пару дней, а там посмотрим»*.\nДо запуска теста аналитик обязан рассчитать **минимальный размер выборки (Sample Size)**.\n\nФормула необходимого размера выборки на группу:\n$$n = \\frac{2 \\cdot (Z_{\\alpha/2} + Z_{\\beta})^2 \\cdot p(1-p)}{MDE^2}$$\n\nГде:\n- $\\alpha = 0.05$ (Ошибка I рода, вероятность ложной тревоги 5%);\n- $\\beta = 0.20$ (Ошибка II рода, мощность $1 - \\beta = 80\\%$);\n- $MDE$ (Minimum Detectable Effect) — минимальный эффект, который экономически имеет смысл обнаружить.\n"}, {"type": "code", "content": "import statsmodels.stats.api as sms\n\n# Расчет выборки для интернет-магазина\nbaseline_cr = 0.082  # Текущая конверсия 8.2%\ntarget_cr = 0.095    # Ожидаемый рост до 9.5% (MDE = +1.3% абс.)\n\neffect_size = sms.proportion_effectsize(baseline_cr, target_cr)\nrequired_n = sms.NormalIndPower().solve_power(\n    effect_size=effect_size,\n    power=0.80,\n    alpha=0.05,\n    ratio=1\n)\n\nprint(f\"Базовая конверсия: {baseline_cr*100:.1f}% | Целевая: {target_cr*100:.1f}%\")\nprint(f\"Необходимо пользователей В КАЖДОЙ группе: {int(round(required_n)):,}\")\nprint(f\"Всего пользователей в тесте: {int(round(required_n))*2:,}\")\n"}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "cells": [{"type": "markdown", "content": "# ⚖️ Модуль 7. Урок 2: Проверка честности сплитования: Sample Ratio Mismatch (SRM)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\n\n---\n\n## 1. Sample Ratio Mismatch (SRM) — Убийца A/B-тестов\n\nЕсли вы планировали тест 50/50, а в группу А пришло 5 200 пользователей, а в группу B — 4 800 пользователей:\n- Это не «случайная погрешность».\n- Это технический сбой системы сплитования (например, на iOS вариант B не загружался и пользователи отваливались до попадания в лог).\n- **Результаты такого теста нельзя анализировать! Они полностью невалидны.**\n"}, {"type": "code", "content": "import pandas as pd\nfrom scipy.stats import chisquare\n\n# Загружаем реальный датасет эксперимента чекаута\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\ncounts = ab_df['test_group'].value_counts()\nprint(\"ФАКТИЧЕСКИЙ СПЛИТ ПОЛЬЗОВАТЕЛЕЙ:\")\nprint(counts)\n\n# Проверка критерием Хи-квадрат\nobs = [counts['A_Control'], counts['B_Variant']]\nexp = [len(ab_df)/2, len(ab_df)/2]\nstat, p_val = chisquare(obs, exp)\n\nprint(f\"\\nChi2-statistic: {stat:.4f}, p-value: {p_val:.4f}\")\nif p_val < 0.01:\n    print(\" АВАРИЯ: Обнаружен SRM! Тест бракованный.\")\nelse:\n    print(\" SRM не обнаружен! Сплитование 50/50 корректно.\")\n"}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 7. Урок 3: Полный статистический анализ A/B-теста на Python\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\n\n---\n\n## 1. Z-test для конверсий и оценка Uplift\n"}, {"type": "code", "content": "import pandas as pd\nfrom statsmodels.stats.proportion import proportions_ztest\n\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\n\na = ab_df[ab_df['test_group'] == 'A_Control']\nb = ab_df[ab_df['test_group'] == 'B_Variant']\n\ncr_a = a['converted'].mean()\ncr_b = b['converted'].mean()\nuplift = (cr_b - cr_a) / cr_a * 100\n\ncount = [b['converted'].sum(), a['converted'].sum()]\nnobs = [len(b), len(a)]\nz_stat, p_val = proportions_ztest(count, nobs)\n\nprint(f\"Контроль (A): CR = {cr_a*100:.2f}% | Вариант (B): CR = {cr_b*100:.2f}%\")\nprint(f\"Относительный прирост (Uplift): +{uplift:.2f}%\")\nprint(f\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\")\n\nif p_val < 0.05:\n    print(\" РЕШЕНИЕ: Изменение статистически значимо! Выкатываем вариант B на 100% аудитории.\")\n"}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "cells": [{"type": "markdown", "content": "# 🛑 Модуль 7. Урок 4: Peeking Problem и p-hacking: Почему нельзя подглядывать в результаты\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\n\n---\n\n## 1. Механика ложного срабатывания при Peeking\n\nЕсли вы каждый день заглядываете в дашборд теста и решаете остановить его в первый момент, когда $p < 0.05$, вероятность ложноположительного результата (**False Positive**) возрастает с нормальных $5\\%$ до $35-40\\%$!\nВы гарантированно выкатите на прод бесполезную или вредную фичу, приняв случайное колебание за победу.\n"}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 5: Принятие бизнес-решения о раскатке: Guardrail метрики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\n\n---\n\n## 1. Guardrail Metrics (Защитные метрики)\n\nДаже если целевая метрика (CR) статистически значимо выросла на 15%, тест **нельзя** раскатывать, если:\n1. Выросло число возвратов товаров (Refund Rate);\n2. Упал средний чек (AOV);\n3. Увеличилось время ответа саппорта или выросла нагрузка на серверы.\n"}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8. Prompt Engineering для аналитиков", "cat": "AI стек", "badge": "Промпты", "icon": "💬", "desc": "Few-shot, Chain-of-Thought, Structured Outputs, генерация чистого SQL и Python кода.", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n---\n\n### Вопрос 1\nЧто дает добавление инструкции «Рассуждай по шагам» (Chain-of-Thought) в промпте для аналитика?\n- [ ] Уменьшает количество затраченных токенов.\n- [x] Позволяет модели сформировать промежуточные логические выводы перед финальным расчетом, резко снижая процент математических ошибок.\n- [ ] Переводит код на язык C++.\n*Объяснение*: CoT принуждает LLM использовать контекст генерируемых токенов как рабочую память.\n\n---\n\n### Вопрос 2\nВ чем заключается техника Few-Shot Prompting?\n- [ ] Однократный запрос без контекста.\n- [x] Предоставление модели в тексте промпта 1-3 готовых примеров «входные данные -> ожидаемый результат» перед постановкой основной задачи.\n- [ ] Написание кода без использования библиотек.\n*Объяснение*: Few-Shot задает точный шаблон структуры ответа и логики рассуждений.\n\n---\n\n### Вопрос 3\nКакой компонент фреймворка RTCE отвечает за формат и ограничения вывода?\n- [ ] R (Role).\n- [ ] T (Task).\n- [x] E (Expectation).\n*Объяснение*: В Expectation задаются ограничения (например, «только валидный JSON без пояснений», «обработать деление на ноль»).\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 8. Урок 1: Архитектурные фреймворки промптинга: RTCE и Few-Shot\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\n\n---\n\n## 1. Фреймворк RTCE в аналитике\n\n1. **R (Role)**: «Ты Principal Database Architect в FinTech компании с 15-летним опытом оптимизации PostgreSQL».\n2. **T (Task)**: «Напиши запрос для расчета 30-дневного скользящего среднего Retention Rate».\n3. **C (Context)**: Схема таблицы, типы полей, объем (50 млн строк, нужны индексы).\n4. **E (Expectation)**: «Используй только стандартный SQL, CTE и оконные функции. Добавь пояснения логики».\n"}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🧠 Модуль 8. Урок 2: Метод Chain-of-Thought (Рассуждение по шагам)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\n\n---\n\n## 1. Почему нейросети ошибаются в математике без CoT?\n\nLLM — это авторегрессионные языковые модели. Они не вычисляют формулу в скрытом процессоре, они предсказывают следующее слово (токен).\nЕсли заставить модель сразу выдать число — шанс ошибки велик.\nЕсли заставить модель расписать каждый шаг формулы вслух — вероятность правильного ответа превышает 98%.\n"}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "cells": [{"type": "markdown", "content": "# 💻 Модуль 8. Урок 3: Промпты для генерации сложного SQL и Pandas пайплайнов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb)\n\n---\n\n## 1. Шаблоны промптов для когортного анализа и воронок\n"}]}, {"filename": "lesson_04_debugging_and_root_cause_prompts.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "cells": [{"type": "markdown", "content": "# 🔍 Модуль 8. Урок 4: Поиск багов, оптимизация планов запросов (EXPLAIN) и аудит кода\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb)\n\n---\n\n## 1. Промпт для анализа EXPLAIN QUERY PLAN\n"}]}]}, {"id": "module_09_ai_tools_daily", "title": "Модуль 9. AI инструменты в ежедневной работе", "cat": "AI стек", "badge": "Workflow", "icon": "🤖", "desc": "Cursor, Copilot, валидация AI-галлюцинаций и автоматизация рутинных пайплайнов.", "readme": "# 🛠️ Модуль 9: AI в ежедневной работе аналитика (Cursor, Copilot, ChatGPT)\n\n## 📌 О модуле\nРазница между джуном и мидлом в 2027 году: джун пишет скрипт 3 дня, а специалист новой формации решает ту же задачу за 2 часа с помощью AI-инструментов, гарантируя нулевой процент галлюцинаций.\n\n## 🎯 Learning Outcomes\n- **Apply**: Использование Cursor IDE и GitHub Copilot для парного программирования.\n- **Analyze**: Code Interpreter (Advanced Data Analysis) для быстрого разведочного анализа (EDA).\n- **Evaluate**: 5-уровневый фреймворк валидации ответов ИИ: от синтаксиса до краевых бизнес-кейсов.\n\n## 📚 Уроки\n1. `lesson_01_cursor_vs_copilot_workflows.ipynb` — Настройка рабочего места: Cursor, Copilot, индексация кодовой базы.\n2. `lesson_02_claude_chatgpt_data_interpreter.ipynb` — Работа с веб-ассистентами (Claude 3.7 / ChatGPT): быстрый EDA, генерация гипотез.\n3. `lesson_03_ai_validation_framework_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n---\n\n### Вопрос 1\nЗачем в проектах аналитики используется файл `.cursorrules`?\n- [ ] Для ускорения интернета.\n- [x] Для автоматической передачи AI-ассистенту корпоративных стандартов кода, схемы баз данных и бизнес-правил компании.\n- [ ] Для компиляции Python в бинарный файл.\n*Объяснение*: Файл `.cursorrules` автоматически подмешивается в системный контекст каждого запроса в IDE.\n\n---\n\n### Вопрос 2\nЧто такое проверка бизнес-инвариантов при аудите кода нейросети?\n- [ ] Проверка орфографии комментариев.\n- [x] Проверка фундаментальных ограничений предметной области (например: сумма заказов не может быть отрицательной, а LTV не может быть ниже нуля).\n- [ ] Измерение скорости процессора.\n*Объяснение*: Если синтаксически корректный код от ИИ выдал отрицательный отток или конверсию 140%, нарушен бизнес-инвариант.\n\n---\n\n### Вопрос 3\nКакой инструмент лучше всего подходит для мгновенного разведочного анализа (EDA) сырого CSV-файла?\n- [ ] Ручной ввод данных в калькулятор.\n- [x] Advanced Data Analysis / Code Interpreter (встроенный запуск Python с визуализацией в реальном времени).\n- [ ] Отрисовка графиков на бумаге.\n*Объяснение*: Code Interpreter выполняет код в изолированной песочнице, строя графики и считая квантили за секунды.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "cells": [{"type": "markdown", "content": "# 🛠️ Модуль 9. Урок 1: AI-ассистенты в редакторе: Cursor IDE, Copilot и `.cursorrules`\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\n\n---\n\n## 1. Конфигурация аналитического проекта через `.cursorrules`\n\nВ современных командах аналитики не повторяют одни и те же правила в каждом чате.\nВ корне проекта создается файл `.cursorrules` (или системный промпт проекта):\n\n```markdown\n# Corporate Data Analytics Guidelines (2027)\n- Язык общения: Русский. Названия переменных, функций и колонок: Английский (snake_case).\n- СУБД: PostgreSQL 16. Всегда фильтровать `status = 'Completed'` при расчете выручки.\n- Векторизация: Никогда не использовать циклы for для строк DataFrame.\n- Защита от деления на ноль: Всегда использовать `NULLIF(denominator, 0)` в SQL и `div()` с `fill_value=0` в Pandas.\n- Формат дат: ISO-8601 (YYYY-MM-DD).\n```\n"}]}, {"filename": "lesson_02_claude_chatgpt_data_interpreter.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb", "cells": [{"type": "markdown", "content": "# ⚡ Модуль 9. Урок 2: Разведочный анализ (EDA) в Claude Code Interpreter за 10 минут\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_02_claude_chatgpt_data_interpreter.ipynb)\n\n---\n\n## 1. Автоматический аудит нового датасета через AI\n"}, {"type": "code", "content": "import pandas as pd\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\ndef run_ai_eda(df: pd.DataFrame):\n    print(\"=== АВТОМАТИЧЕСКИЙ ПРОФАЙЛИНГ ДАТАСЕТА ===\")\n    print(f\"Размер: {df.shape[0]} строк x {df.shape[1]} колонок\")\n    \n    # 1. Проверка уникальности\n    dups = df.duplicated().sum()\n    print(f\"Дубликатов строк: {dups}\")\n    \n    # 2. Пропуски\n    nulls = df.isnull().sum()\n    print(\"\\nКолонки с пропусками:\")\n    print(nulls[nulls > 0])\n    \n    # 3. Числовые распределения\n    print(\"\\nСводка по числовым метрикам:\")\n    print(df[['mrr', 'active_seats', 'nps_score', 'feature_a_usage']].describe().round(1))\n\nrun_ai_eda(saas)\n"}]}, {"filename": "lesson_03_ai_validation_framework_hallucinations.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb", "cells": [{"type": "markdown", "content": "# 🛡️ Модуль 9. Урок 3: 5-уровневый фреймворк защиты от галлюцинаций ИИ\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_03_ai_validation_framework_hallucinations.ipynb)\n\n---\n\n## 1. Архитектура верификации кода AI (Zero Hallucination Protocol)\n\n```\n[1. Синтаксический уровень]   ─── Код выполняется без NameError, SyntaxError?\n             │\n[2. Размерность и типы]       ─── Не схлопнулись ли строки? Типы int/float/datetime корректны?\n             │\n[3. Бизнес-инварианты]        ─── Выручка >= 0? Конверсия <= 100%? Отток не отрицательный?\n             │\n[4. Сверка с бенчмарком]      ─── Сходится ли общая сумма выручки с официальным биллингом?\n             │\n[5. Краевые случаи (Edge)]    ─── Что произойдет при пустой таблице или делении на ноль?\n```\n"}]}]}, {"id": "module_10_llm_api", "title": "Модуль 10. LLM API и неструктурированные данные", "cat": "AI стек", "badge": "API", "icon": "🔌", "desc": "Парсинг отзывов, классификация клиентских обращений, NER и извлечение JSON из текста.", "readme": "# 🧠 Модуль 10: Работа с LLM API и анализ неструктурированных данных\n\n## 📌 О модуле\nДо 80% данных компании — неструктурированные: отзывы клиентов, переписки в саппорте, тикеты, расшифровки звонков, договоры. Классический SQL бессилен перед текстом. Аналитик 2027 года подключает LLM API (OpenAI, Anthropic, Gemini, локальные модели), чтобы извлекать сущности, оценивать сентимент и формировать структурированные витрины.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы вызова LLM API (temperature, max_tokens, system vs user messages).\n- **Apply**: Автоматическая разметка текста: Sentiment Analysis, определение тем тикетов, извлечение именованных сущностей (NER).\n- **Create**: Использование Structured Outputs (Pydantic / JSON Mode) для надежного получения гарантированной схемы JSON без сбоев.\n- **Analyze**: Расчет стоимости API (Token Economics), оптимизация батчами и кэширование.\n\n## 📚 Уроки\n1. `lesson_01_calling_llm_apis_python.ipynb` — Подключение и первые вызовы современных LLM API из Python.\n2. `lesson_02_parsing_unstructured_data.ipynb` — Анализ реального датасета отзывов клиентов (`customer_reviews.csv`).\n3. `lesson_03_structured_outputs_pydantic_json.ipynb` — Гарантированный JSON и валидация через Pydantic.\n4. `lesson_04_batch_processing_and_costs.ipynb` — Пакетная обработка 10 000 строк: Rate Limits, ретраи, контроль бюджета.\n5. `quiz.md` — Тест для закрепления.\n6. `cheatsheet.md` — Шаблоны Python-кода для работы с LLM API.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 10 (LLM API & Неструктурированные данные)\n\n---\n\n### Вопрос 1\nЗачем в аналитических пайплайнах обогащения данных использовать Structured Outputs (Pydantic / JSON Mode)?\n- [ ] Чтобы нейросеть писала более вежливые ответы.\n- [x] Чтобы модель гарантированно вернула валидный JSON строго заданной структуры с проверкой типов полей, исключая поломку ETL-пайплайна.\n- [ ] Чтобы снизить задержку сети.\n*Объяснение*: Structured Outputs принудительно направляет сэмплирование токенов согласно переданной JSON-схеме.\n\n---\n\n### Вопрос 2\nКакую температуру (`temperature`) следует указывать при вызове LLM для извлечения фактов и разметки тональности?\n- [ ] 1.5 (для максимального разнообразия).\n- [x] 0.0 (для максимальной детерминированности, воспроизводимости и строгого следования схеме).\n- [ ] 0.8.\n*Объяснение*: Для аналитических задач и классификации требуется нулевая случайность (greedy decoding).\n\n---\n\n### Вопрос 3\nСколько примерно стоит классификация 10 000 коротких отзывов клиентов через современные эффективные LLM (например, Gemini Flash / GPT-4o-mini)?\n- [ ] Около \\$500.\n- [x] Менее \\$1.00 (порядка 50-80 рублей).\n- [ ] Более \\$10 000.\n*Объяснение*: Цены на легковесные модели упали до \\$0.10–\\$0.15 за миллион токенов, делая автоматическую разметку текста невероятно дешевой.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_calling_llm_apis_python.ipynb", "rel_path": "course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb", "cells": [{"type": "markdown", "content": "# 🔌 Модуль 10. Урок 1: Подключение и программный вызов LLM API из Python\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_01_calling_llm_apis_python.ipynb)\n\n---\n\n## 1. Универсальный интерфейс взаимодействия с LLM API\n\nСовременные API (OpenAI, Anthropic, Gemini, DeepSeek) используют стандартизированный JSON-интерфейс:\n- `messages`: массив объектов с ролями `system`, `user`, `assistant`.\n- `temperature`: степень детерминированности ($0.0$ — максимальная точность для аналитики, $1.0$ — креативность).\n- `response_format`: принудительный возврат JSON объекта.\n"}]}, {"filename": "lesson_02_parsing_unstructured_data.ipynb", "rel_path": "course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb", "cells": [{"type": "markdown", "content": "# 📑 Модуль 10. Урок 2: Разметка неструктурированных отзывов и тикетов саппорта\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_02_parsing_unstructured_data.ipynb)\n\n---\n\n## 1. Реальный кейс: Автоматический аудит 800 жалоб клиентов e-commerce\n\nРаботаем с реальным датасетом отзывов `customer_reviews.csv`.\nИзвлекаем темы жалоб и тональность без ручного чтения.\n"}, {"type": "code", "content": "import pandas as pd\n\nreviews = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\n\n# Функция симуляции работы LLM по извлечению сущностей и тематик\ndef analyze_review_with_llm(text: str) -> dict:\n    t = text.lower()\n    topics = []\n    if any(k in t for k in ['курьер', 'доставка', 'опоздал', 'доставили']):\n        topics.append('Логистика и доставка')\n    if any(k in t for k in ['списали', 'деньги', 'вернуть', 'цена', 'подписку']):\n        topics.append('Оплата и биллинг')\n    if any(k in t for k in ['баги', 'крашится', 'тормозит', 'crashes', 'не работает']):\n        topics.append('Баги приложения')\n    if any(k in t for k in ['поддержка', 'чат', 'саппорт', 'service']):\n        topics.append('Качество саппорта')\n        \n    return {\n        'topics': topics if topics else ['Прочее'],\n        'has_critical_issue': int(any(k in t for k in ['верните', 'претензию', 'списали', 'crashes']))\n    }\n\n# Применяем анализ к базе\nresults = reviews['text'].apply(analyze_review_with_llm)\nreviews['topics'] = [r['topics'] for r in results]\nreviews['is_critical'] = [r['has_critical_issue'] for r in results]\n\n# Сводный отчет для операционного директора\nexploded = reviews.explode('topics')\nsummary = exploded.groupby('topics').agg(\n    total_reviews=('review_id', 'count'),\n    critical_cases=('is_critical', 'sum')\n).sort_values(by='critical_cases', ascending=False)\n\nprint(\"=== РЕЗУЛЬТАТ АВТОМАТИЧЕСКОЙ КЛАССИФИКАЦИИ ЖАЛОБ ===\")\nprint(summary)\n"}]}, {"filename": "lesson_03_structured_outputs_pydantic_json.ipynb", "rel_path": "course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb", "cells": [{"type": "markdown", "content": "# 📦 Модуль 10. Урок 3: Structured Outputs и валидация через Pydantic\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_03_structured_outputs_pydantic_json.ipynb)\n\n---\n\n## 1. Схема Pydantic для гарантированной типизации\n\nНикаких неструктурированных ответов от LLM в проде. Только жестко валидированный JSON:\n"}, {"type": "code", "content": "from pydantic import BaseModel, Field\nfrom typing import List, Literal\n\nclass FeedbackExtractionSchema(BaseModel):\n    sentiment: Literal['Positive', 'Negative', 'Neutral']\n    urgency_level: Literal['Low', 'Medium', 'High', 'Critical']\n    identified_categories: List[str]\n    satisfaction_score: int = Field(ge=1, le=5)\n\n# Демонстрация валидации\nvalid_sample = {\n    \"sentiment\": \"Negative\",\n    \"urgency_level\": \"Critical\",\n    \"identified_categories\": [\"Billing\", \"Mobile App\"],\n    \"satisfaction_score\": 1\n}\n\nvalidated_obj = FeedbackExtractionSchema(**valid_sample)\nprint(\" Схема валидна! Объект Pydantic готов к загрузке в БД:\")\nprint(validated_obj.model_dump_json(indent=2))\n"}]}, {"filename": "lesson_04_batch_processing_and_costs.ipynb", "rel_path": "course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb", "cells": [{"type": "markdown", "content": "# 💰 Модуль 10. Урок 4: Экономика токенов (Token Economics) и батчевая обработка\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_10_llm_api/lesson_04_batch_processing_and_costs.ipynb)\n\n---\n\n## 1. Калькулятор стоимости пайплайна разметки данных\n"}, {"type": "code", "content": "# Калькулятор стоимости обработки массива текстов через современные модели\ndef estimate_llm_cost(num_documents, avg_words_per_doc, input_price_per_m=0.15, output_price_per_m=0.60):\n    # В среднем 1 слово = 1.3 токена\n    input_tokens = num_documents * (avg_words_per_doc * 1.3 + 100) # +100 токенов промпта\n    output_tokens = num_documents * 50 # JSON ответ около 50 токенов\n    \n    cost_in = (input_tokens / 1_000_000) * input_price_per_m\n    cost_out = (output_tokens / 1_000_000) * output_price_per_m\n    total = cost_in + cost_out\n    \n    print(f\"Обработка {num_documents:,} документов:\")\n    print(f\"- Входные токены : {input_tokens:,.0f} (${cost_in:.3f})\")\n    print(f\"- Выходные токены: {output_tokens:,.0f} (${cost_out:.3f})\")\n    print(f\"- ИТОГОВАЯ ЦЕНА  : ${total:.2f} (~{total * 95:.1f} руб)\")\n\nestimate_llm_cost(num_documents=50_000, avg_words_per_doc=40)\n"}]}]}, {"id": "module_11_rag_vector_db", "title": "Модуль 11. RAG и векторные базы данных", "cat": "AI стек", "badge": "RAG", "icon": "🔍", "desc": "ChromaDB, семантический поиск, эмбеддинги и вопросно-ответные системы по документам.", "readme": "# 🔍 Модуль 11: RAG и векторные базы данных — Умные BI-ассистенты\n\n## 📌 О модуле\nRAG (Retrieval-Augmented Generation) — архитектура, которая связывает генеративные возможности LLM с закрытыми корпоративными данными компании (вики, документация по метрикам, схемы БД, отчеты прошлых лет). Это основа интеллектуальных чатов в современном BI.\n\n## 🎯 Learning Outcomes\n- **Understand**: Векторные эмбеддинги (Embeddings), семантическое пространство, косинусная близость (Cosine Similarity).\n- **Apply**: Развертывание локальной векторной БД ChromaDB, индексация корпоративных документов.\n- **Create**: Рабочий RAG-пайплайн: вопрос аналитика -> поиск релевантных кусков документации -> формирование промпта -> ответ с источниками.\n- **Analyze**: Text-to-SQL с RAG-обогащением (модель получает точную схему таблиц из базы знаний).\n\n## 📚 Уроки\n1. `lesson_01_embeddings_and_vector_space.ipynb` — Что такое эмбеддинги: перевод текста в векторы чисел, расчет сходства.\n2. `lesson_02_vector_databases_chromadb.ipynb` — Практика с ChromaDB: коллекции, метаданные, семантический поиск.\n3. `lesson_03_building_rag_pipeline_analyst.ipynb` — Сборка сквозного RAG-пайплайна по регламентам компании.\n4. `lesson_04_text_to_sql_rag_assistant.ipynb` — Архитектура \"Умного BI-ассистента\": Text-to-SQL по метаданным.\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 11 (RAG & Векторные базы данных)\n\n---\n\n### Вопрос 1\nВ чем заключается главное преимущество архитектуры RAG перед файнтюнингом (дообучением) модели на данных компании?\n- [ ] RAG работает без использования электричества.\n- [x] RAG позволяет обращаться к постоянно обновляемым корпоративным документам в реальном времени без дорогостоящего переобучения нейросети и дает ссылки на точные источники.\n- [ ] RAG используется только для картинок.\n*Объяснение*: При изменении регламента или добавлении данных достаточно обновить индекс в векторной БД, не меняя веса модели.\n\n---\n\n### Вопрос 2\nЧто показывает косинусное сходство (Cosine Similarity) между двумя эмбеддингами?\n- [ ] Разницу в количестве букв в тексте.\n- [x] Косинус угла между векторами в многомерном пространстве (от 1.0 — полное совпадение смысла, до 0.0 — отсутствие семантической связи).\n- [ ] Скорость загрузки страницы.\n*Объяснение*: Чем ближе угол векторов к нулю (косинус к 1.0), тем ближе смысловое значение текстов.\n\n---\n\n### Вопрос 3\nКак RAG помогает масштабировать Text-to-SQL в компании с сотнями таблиц в базе данных?\n- [ ] Сжимает таблицы в zip-архив.\n- [x] Динамически находит по смыслу запроса только 2-4 релевантные таблицы и передает в контекст промпта только их схемы, не перегружая лимит контекста.\n- [ ] Удаляет старые таблицы из базы.\n*Объяснение*: Семантический поиск по метаданным оставляет в промпте только нужные фрагменты схемы.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_embeddings_and_vector_space.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb", "cells": [{"type": "markdown", "content": "# 🌐 Модуль 11. Урок 1: Векторные эмбеддинги и семантический поиск: Cosine Similarity\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_01_embeddings_and_vector_space.ipynb)\n\n---\n\n## 1. Геометрия смыслов: Как компьютер понимает синонимы\n\nТрадиционный поиск по базе ищет точное совпадение букв: `WHERE text LIKE '%отток%'`. Если пользователь спросил *«клиенты уходят»*, поиск ничего не найдет.\n**Векторный эмбеддинг** преобразует текст в многомерный вектор чисел ($d = 768$ или $1536$).\nФразы со схожим смыслом имеют близкое направление векторов.\n\nФормула косинусного сходства (Cosine Similarity):\n$$\\cos(\\theta) = \\frac{\\mathbf{A} \\cdot \\mathbf{B}}{\\|\\mathbf{A}\\| \\|\\mathbf{B}\\|}$$\n"}, {"type": "code", "content": "import numpy as np\n\n# Симуляция 3-мерного пространства смыслов\n# Ось 1: Продуктовые метрики, Ось 2: Негатив/Уход, Ось 3: Еда/Кухня\nemb_churn = np.array([0.9, 0.8, 0.05])       # \"Отток клиентов\"\nemb_leave = np.array([0.85, 0.82, 0.08])     # \"Пользователи закрывают подписку\"\nemb_burger = np.array([0.02, 0.1, 0.98])     # \"Чизбургер с картошкой\"\n\ndef cosine_sim(v1, v2):\n    return np.dot(v1, v2) / (np.linalg.norm(v1) * np.linalg.norm(v2))\n\nprint(f\"Сходство 'Отток' и 'Пользователи уходят': {cosine_sim(emb_churn, emb_leave):.4f} (Близкие синонимы!)\")\nprint(f\"Сходство 'Отток' и 'Чизбургер'          : {cosine_sim(emb_churn, emb_burger):.4f} (Нет семантической связи)\")\n"}]}, {"filename": "lesson_02_vector_databases_chromadb.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb", "cells": [{"type": "markdown", "content": "# 🗄️ Модуль 11. Урок 2: Векторная база ChromaDB для базы знаний аналитика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_02_vector_databases_chromadb.ipynb)\n\n---\n\n## 1. Индексация словаря корпоративных терминов и регламентов\n"}, {"type": "code", "content": "# Демонстрация локальной коллекции ChromaDB в памяти\nmetrics_catalog = [\n    {\"id\": \"m1\", \"title\": \"LTV\", \"content\": \"Lifetime Value — общая чистая прибыль от пользователя за всю историю. Формула: ARPU * Lifetime.\"},\n    {\"id\": \"m2\", \"title\": \"Churn Rate\", \"content\": \"Процент ушедших клиентов за период: (Клиенты_конец - Новые) / Клиенты_начало.\"},\n    {\"id\": \"m3\", \"title\": \"CAC\", \"content\": \"Customer Acquisition Cost — стоимость привлечения платящего пользователя: Расходы / Новые_покупатели.\"},\n    {\"id\": \"m4\", \"title\": \"AOV\", \"content\": \"Average Order Value — средний чек: Общая выручка / Количество успешных заказов.\"}\n]\n\nprint(\"БАЗА ЗНАНИЙ ДЛЯ ВЕКТОРНОГО ПОИСКА RAG ГОТОВА:\")\nfor m in metrics_catalog:\n    print(f\"- [{m['title']}]: {m['content']}\")\n"}]}, {"filename": "lesson_03_building_rag_pipeline_analyst.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 11. Урок 3: Сквозной пайплайн RAG (Chunking -> Retrieval -> Generation)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_03_building_rag_pipeline_analyst.ipynb)\n\n---\n\n## 1. Схема работы RAG для отчетов компании\n\n```\n[Вопрос руководителя: \"Как мы рассчитываем LTV в B2B тарифах?\"]\n                               │\n            (Семантический поиск в векторной базе)\n                               │\n       [Найден релевантный фрагмент регламента №42]\n                               │\n               (Генерация ответа в LLM)\n      \"Ответь на вопрос, основываясь ИСКЛЮЧИТЕЛЬНО на документе №42\"\n                               │\n[Точный ответ без галлюцинаций с указанием источника и формулы]\n```\n"}]}, {"filename": "lesson_04_text_to_sql_rag_assistant.ipynb", "rel_path": "course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb", "cells": [{"type": "markdown", "content": "# 💬 Модуль 11. Урок 4: Архитектура \"Умного BI-ассистента\" (Text-to-SQL + RAG)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_11_rag_vector_db/lesson_04_text_to_sql_rag_assistant.ipynb)\n\n---\n\n## 1. Проблема больших корпоративных баз\n\nВ реальном корпоративном Data Warehouse (DWH) могут быть 1 500 таблиц и 20 000 колонок.\nИх невозможно передать в промпт целиком.\n**Решение — RAG по метаданным**:\n1. В векторную базу индексируются описания таблиц и колонок.\n2. По запросу пользователя («Покажи топ продаж ноутбуков в Казани») векторный поиск находит только таблицы `products`, `orders`, `customers`.\n3. Модель получает схему только этих 3 таблиц и генерирует быстрый и точный SQL-запрос.\n"}]}]}, {"id": "module_12_ai_agents", "title": "Модуль 12. AI агенты и автоматический анализ", "cat": "AI стек", "badge": "Агенты", "icon": "🕹️", "desc": "Паттерн ReAct, LangChain, автономные аналитические агенты, вызывающие SQL и код.", "readme": "# 🤖 Модуль 12: AI-агенты (Agentic Workflows) и мониторинг качества LLM\n\n## 📌 О модуле\nВысший пилотаж специалиста 2027 года: создание автономных аналитических цепочек (AI Agents), способных самостоятельно планировать шаги, запускать код, обращаться к базам данных и проверять результаты своего труда.\n\n## 🎯 Learning Outcomes\n- **Understand**: Фреймворк ReAct (Reasoning + Acting), концепцию инструментов (Tools) и памяти агента.\n- **Apply**: Инструменты LangChain / LlamaIndex для автоматизации многоэтапного сбора и подготовки данных.\n- **Evaluate**: LLM Evaluation — метрики оценки качества генерации (Faithfulness, Answer Relevance, Hallucination Rate).\n- **Create**: Автономный аналитический агент, получающий сырую задачу и генерирующий проверенный отчет.\n\n## 📚 Уроки\n1. `lesson_01_agentic_workflows_concept.ipynb` — Концепция автономных агентов: ReAct, инструменты, циклы исполнения.\n2. `lesson_02_langchain_llamaindex_for_analytics.ipynb` — LangChain и LlamaIndex: агент с доступом к SQLite и Python REPL.\n3. `lesson_03_automated_data_collection_agent.ipynb` — Автономный пайплайн сбора, трансформации и валидации данных.\n4. `lesson_04_llm_evaluation_and_monitoring.ipynb` — LLM Evaluation: фреймворки оценки надежности (Ragas, DeepEval).\n5. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 12 (AI-агенты & LLM Evaluation)\n\n---\n\n### Вопрос 1\nЧто лежит в основе паттерна ReAct для автономных агентов?\n- [ ] Однократный ответ без проверки.\n- [x] Цикл: рассуждение (Thought) -> выбор инструмента и действие (Action) -> наблюдение за результатом (Observation) -> корректировка дальнейших шагов.\n- [ ] Перезагрузка базы данных.\n*Объяснение*: ReAct позволяет агенту динамически адаптировать свой план при получении промежуточных данных.\n\n---\n\n### Вопрос 2\nЧто означ
