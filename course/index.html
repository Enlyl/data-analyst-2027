e),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\n\ndf_customers = pd.read_csv(customers_csv)\ndf_orders = pd.read_csv(orders_csv)\ndf_saas = pd.read_csv(saas_csv)\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСоздадим динамическую категоризацию выручки клиентов с помощью формулы `CASE WHEN` и рассчитаем средневзвешенный чек по тарифным планам."}, {"type": "code", "content": "# Демонстрация: Вычисляемое поле категоризации в Pandas (эквивалент CASE WHEN)\ndef segment_mrr(mrr):\n    if mrr >= 800:\n        return 'Enterprise High'\n    elif mrr >= 300:\n        return 'Mid-Market'\n    else:\n        return 'SMB / Entry'\n\ndf_saas['mrr_tier'] = df_saas['mrr'].apply(segment_mrr)\ntier_summary = df_saas.groupby('mrr_tier').agg(\n    accounts=('user_id', 'count'),\n    total_revenue=('mrr', 'sum'),\n    avg_mrr=('mrr', 'mean')\n).reset_index()\ndisplay(tier_summary)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Структура выручки и ARPU по тарифным планам\nСравним совокупный доход и средний чек на аккаунт (ARPU) в разрезе тарифных планов."}, {"type": "code", "content": "# Построение 2-осевого графика для дашборда Looker Studio\nplan_metrics = df_saas.groupby('plan').agg(\n    total_mrr=('mrr', 'sum'),\n    arpu=('mrr', 'mean'),\n    active_users=('user_id', 'count')\n).reset_index()\n\nfig, ax1 = plt.subplots(figsize=(10, 5), dpi=110)\n\nx = np.arange(len(plan_metrics['plan']))\nwidth = 0.4\n\n# Левая ось: Совокупная выручка\nbars = ax1.bar(x, plan_metrics['total_mrr'] / 1000, width, label='Совокупный MRR ($k)', \n               color=PRIMARY, edgecolor='#333333', linewidth=0.6)\nax1.set_ylabel(\"Совокупный MRR ($ тыс.)\", color=PRIMARY, fontsize=11, fontweight='bold')\nax1.set_xticks(x)\nax1.set_xticklabels(plan_metrics['plan'], fontsize=11)\nax1.set_title(\"Executive KPI: Совокупная выручка vs Средний чек (ARPU) по тарифам\", fontsize=12, fontweight='bold', pad=15)\n\nfor b in bars:\n    h = b.get_height()\n    ax1.annotate(f\"${h:.1f}k\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=9.5, fontweight='bold')\n\n# Правая ось: ARPU\nax2 = ax1.twinx()\nline = ax2.plot(x, plan_metrics['arpu'], color=SUCCESS, marker='o', linewidth=2.5, markersize=8, label='ARPU ($)')\nax2.set_ylabel(\"Средний чек на аккаунт ($)\", color='#1b7e3b', fontsize=11, fontweight='bold')\nax2.grid(False)\n\nfor i, txt in enumerate(plan_metrics['arpu']):\n    ax2.annotate(f\"${txt:.0f}\", (x[i], txt), textcoords=\"offset points\", xytext=(0, 8), \n                 ha='center', fontweight='bold', color='#1b7e3b', fontsize=10)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет доли выручки Enterprise сегмента\nВычислите, какой процент совокупного MRR генерирует тариф `Enterprise`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_all_mrr = df_saas['mrr'].sum()\nenterprise_mrr = df_saas.loc[df_saas['plan'] == 'Enterprise', 'mrr'].sum()\nenterprise_share = (enterprise_mrr / total_all_mrr) * 100\n\nprint(f\"Доля Enterprise в общем MRR: {enterprise_share:.1f}%\")\n\nassert 30 <= enterprise_share <= 70, \"Доля Enterprise должна быть в диапазоне 30-70%\"\nprint(\"✅ Тест успешно пройден: вычисляемое поле доли выручки рассчитано безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Архитектура параметров в BI\nИспользуйте динамические параметры (Parameters) в Looker Studio, чтобы дать стейкхолдеру возможность моделировать сценарии «Что если?» (What-if analysis), например, меняя предполагаемый уровень инфляции или размер скидки."}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 3. Смешивание данных (Data Blending) и объединение источников в BI\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСмешивание данных (Data Blending) в BI позволяет связать данные из разнородных источников:\nнапример, рекламные расходы из Google Ads / Яндекс.Директ со статистикой фактических оплат в корпоративной CRM.\nКлючевая аналитическая метрика — **ROAS (Return on Ad Spend = Revenue / Ad Spend)**.\nЕсли не выполнить предварительную агрегацию по дате и каналу, в BI возникнет Cartesian Fan-out и задвоение расходов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\n\ndf_customers = pd.read_csv(customers_csv)\ndf_orders = pd.read_csv(orders_csv)\ndf_saas = pd.read_csv(saas_csv)\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем объединение рекламных расходов и фактических продаж по каналам за последний квартал."}, {"type": "code", "content": "# Демонстрация: Смешивание маркетинговых расходов и выручки CRM\nad_spend = pd.DataFrame({\n    'channel': ['Paid Ads', 'Social Media', 'Email Newsletter', 'Referral', 'Direct'],\n    'spend_usd': [45000, 28000, 8000, 5000, 2000]\n})\n\ncrm_sales = pd.DataFrame({\n    'channel': ['Paid Ads', 'Social Media', 'Email Newsletter', 'Referral', 'Direct'],\n    'revenue_usd': [142000, 68000, 48000, 31000, 24000]\n})\n\nblended_df = ad_spend.merge(crm_sales, on='channel', how='inner')\nblended_df['roas'] = blended_df['revenue_usd'] / blended_df['spend_usd']\nblended_df['net_profit'] = blended_df['revenue_usd'] - blended_df['spend_usd']\ndisplay(blended_df.sort_values(by='roas', ascending=False))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: ROAS и рентабельность каналов\nПостроим сравнение каналов по окупаемости инвестиций: ось X — рекламные затраты, ось Y — выручка, пунктирная линия — граница безубыточности (ROAS = 1.0)."}, {"type": "code", "content": "# Визуализация эффективности каналов (Ad Spend vs Revenue)\nfig, ax = plt.subplots(figsize=(10, 5.5), dpi=110)\n\ncolors = [PRIMARY if r >= 3.0 else WARNING if r >= 2.0 else ALERT for r in blended_df['roas']]\n\nscatter = ax.scatter(blended_df['spend_usd'] / 1000, blended_df['revenue_usd'] / 1000,\n                     s=blended_df['net_profit'] / 200, c=colors, edgecolors='#333333', linewidth=1.2, alpha=0.85)\n\n# Линия безубыточности (ROAS = 1.0)\nmax_val = 50\nax.plot([0, max_val], [0, max_val], color=ALERT, linestyle=':', label='Линия безубыточности (ROAS = 1.0x)')\n\nfor _, row in blended_df.iterrows():\n    ax.annotate(f\"{row['channel']}\\nROAS: {row['roas']:.1f}x\", \n                (row['spend_usd'] / 1000, row['revenue_usd'] / 1000),\n                xytext=(0, 10), textcoords=\"offset points\", ha='center', fontweight='bold', fontsize=9)\n\nax.set_title(\"Эффективность рекламных каналов: Расходы vs Выручка (размер = чистая прибыль)\", fontsize=11, fontweight='bold', pad=15)\nax.set_xlabel(\"Рекламный бюджет ($ тыс.)\", fontsize=11)\nax.set_ylabel(\"Выручка CRM ($ тыс.)\", fontsize=11)\nax.legend(frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет совокупного Blended ROAS\nРассчитайте средневзвешенный Blended ROAS по всем каналам компании как `общая выручка / общий бюджет`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_revenue = blended_df['revenue_usd'].sum()\ntotal_spend = blended_df['spend_usd'].sum()\nblended_roas = total_revenue / total_spend\n\nprint(f\"Общий рекламный бюджет: ${total_spend:,.0f}\")\nprint(f\"Общая выручка: ${total_revenue:,.0f}\")\nprint(f\"Blended ROAS: {blended_roas:.2f}x\")\n\nassert 3.0 <= blended_roas <= 4.0, \"Blended ROAS должен быть в диапазоне 3.0-4.0\"\nprint(\"✅ Тест успешно пройден: смешивание данных и расчет сквозной рентабельности верны!\")"}, {"type": "markdown", "content": "### 💡 Архитектурный совет по Data Blending\nData Blending в BI-интерфейсе выполняет `LEFT JOIN` на лету в браузере пользователя, что может тормозить при >50,000 записей.\nДля стабильной отчетности создавайте сквозную витрину атрибуции на стороне хранилища (SQL / dbt), а не внутри Looker Studio."}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 4. UI/UX дашбордов для топ-менеджмента: верстка, цветовая семантика и типографика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДизайн дашборда подчиняется законам восприятия информации:\n1. **Z-паттерн и F-паттерн чтения**: главное слева сверху.\n2. **Семантика цвета**: зеленый = успех, красный = проблема, серый/синий = нейтральный контекст.\n3. **Число Данбара для графиков**: не более 5-7 визуальных элементов на одном экране."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка ключевых датасетов\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# Аудит визуальной загруженности дашборда\ndashboard_specs = {\n    'total_charts': 6,\n    'total_kpi_cards': 4,\n    'custom_colors_used': 3,\n    'has_date_filter': True\n}\n\ndef audit_dashboard_ux(specs):\n    issues = []\n    if specs['total_charts'] > 8:\n        issues.append(\"Слишком много графиков (риск когнитивной перегрузки)\")\n    if specs['custom_colors_used'] > 4:\n        issues.append(\"Эффект 'фруктового салата': слишком много цветов\")\n    if not specs['has_date_filter']:\n        issues.append(\"Отсутствует глобальный фильтр по дате\")\n    return issues\n\nissues = audit_dashboard_ux(dashboard_specs)\nprint(f\"Результат UX аудита: {'🟢 Идеально' if not issues else issues}\")\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Валидация спецификации дашборда\nУбедитесь, что тестовый дашборд проходит UX-аудит без замечаний."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nassert len(issues) == 0, \"Дашборд должен пройти аудит без замечаний\"\nprint(\"✅ Тест успешно пройден: UX-стандарты соблюдены!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: UI/UX Антипаттерны vs Эталонный Executive Dashboard\nНиже представлено прямое визуальное сравнение:\n1. **Плохой дашборд:** перегружен цветами, 3D-графиками, нечитаемыми круговыми диаграммами и отсутствием структуры.\n2. **Хороший дашборд (Foundation ZURB Design):** строгая иерархия (KPI карточки вверху -> динамика -> структура категорий), монохромный серый фон и один контрастный акцентный цвет (`#1779ba`)."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport numpy as np\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 6))\nfig.suptitle('Executive Dashboard UI/UX Standard: Антипаттерны vs Лучшие практики', fontsize=14, fontweight='bold')\n\n# --- 1. Плохой дашборд (Хаос и Антипаттерны) ---\nax1 = axes[0]\nax1.set_facecolor('#fffae6')  # режущий глаз желтоватый фон\n# Нагромождение нечитаемых пирогов и радужных цветов\nslices = [35, 25, 20, 10, 5, 3, 2]\nbad_colors = ['red', 'green', 'magenta', 'cyan', 'yellow', 'orange', 'blue']\nwedges, texts = ax1.pie(slices, colors=bad_colors, startangle=140)\nax1.set_title('❌ ПЛОХОЙ ДАШБОРД:\\nРадужные цвета, пирог на 7 долей, нет KPI', fontsize=11, color='#cc4b37', fontweight='bold')\nax1.text(0, -1.3, '• Глаза разбегаются\\n• Невозможно сравнить доли визуально\\n• Нет контекста (план/факт)', ha='center', fontsize=9, color='#cc4b37')\n\n# --- 2. Хороший дашборд (Foundation ZURB стиль) ---\nax2 = axes[1]\nax2.set_facecolor('#fefefe')\n# Модульная сетка: 3 KPI карточки + Чистый горизонтальный Bar Chart\ncategories = ['Enterprise B2B', 'Mid-Market SaaS', 'SMB Starter', 'Self-Serve']\nrevenue_k = [420, 280, 150, 45]\ncolors_good = ['#1779ba', '#2a8fc7', '#767676', '#cacaca']\n\nbars = ax2.barh(categories, revenue_k, color=colors_good, edgecolor='white', height=0.55)\nax2.set_title('✅ ЭТАЛОННЫЙ ДАШБОРД (Foundation ZURB):\\nСтрогая иерархия, монохром + акцент', fontsize=11, color='#3adb76', fontweight='bold')\nax2.set_xlabel('Выручка ($K)')\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# Добавляем KPI карточки над графиком текстовыми плашками\nax2.text(0.1, 1.15, 'MRR: $895K\\n(+12.4% MoM)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f4f9fd\", ec=\"#1779ba\"))\nax2.text(0.45, 1.15, 'Retention: 94.2%\\n(Цель: 92%)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f0fff4\", ec=\"#3adb76\"))\nax2.text(0.80, 1.15, 'CAC Payback: 5.2m\\n(-1.1m MoM)', transform=ax2.transAxes, fontsize=10, fontweight='bold',\n         bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f4f9fd\", ec=\"#1779ba\"))\n\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 10, b.get_y() + b.get_height()/2, f'${w}K', va='center', fontweight='bold', fontsize=9)\n\nax2.set_xlim(0, 520)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 💼 Совет аналитику\nПоказывайте черновик дашборда конечному заказчику на 2-й день разработки, а не через месяц."}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 5. Интерактивные фильтры, элементы управления и кросс-фильтрация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\n\n## 📌 Бизнес-контекст и методология\nХороший аналитический дашборд интерактивен: топ-менеджер должен иметь возможность нажать на один срез (например, мобильные пользователи iOS) и увидеть мгновенный пересчет всех KPI.\nКросс-фильтрация (Cross-filtering) связывает все визуальные элементы страницы.\nАналитик обязан проектировать иерархию фильтров:\n- Глобальные фильтры (Период дат, Регион) — вверху страницы\n- Локальные срезы диаграмм — внутри соответствующих блоков"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\n\ndf_customers = pd.read_csv(customers_csv)\ndf_orders = pd.read_csv(orders_csv)\ndf_saas = pd.read_csv(saas_csv)\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем поведение фильтрации: покажем базовые метрики без фильтра и динамический пересчет при выборе среза `Enterprise + Fintech`."}, {"type": "code", "content": "# Демонстрация: Моделирование фильтрации данных\ndef compute_kpi_card(df):\n    return {\n        'Total MRR ($)': df['mrr'].sum(),\n        'Avg Seats': df['active_seats'].mean(),\n        'Churn Rate (%)': df['is_churned'].mean() * 100,\n        'NPS Score': df['nps_score'].mean()\n    }\n\nkpi_all = compute_kpi_card(df_saas)\nkpi_filtered = compute_kpi_card(df_saas[(df_saas['plan'] == 'Enterprise') & (df_saas['industry'] == 'Fintech')])\n\ncomparison_df = pd.DataFrame([kpi_all, kpi_filtered], index=['Вся компания (Baseline)', 'Срез: Enterprise + Fintech'])\ndisplay(comparison_df.round(2))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Кросс-фильтрация в действии\nНаглядно продемонстрируем, как выбор сегмента Enterprise трансформирует распределение показателей в дашборде."}, {"type": "code", "content": "# Визуализация эффекта кросс-фильтрации\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 5), dpi=110)\n\n# График 1: Baseline (Все тарифы)\nsns.histplot(df_saas['mrr'], bins=25, color=SECONDARY, ax=ax1, kde=True)\nax1.set_title(\"Все клиенты: распределение MRR\", fontsize=11, fontweight='bold')\nax1.set_xlabel(\"MRR ($)\")\nax1.set_ylabel(\"Количество компаний\")\nax1.axvline(df_saas['mrr'].median(), color=ALERT, linestyle='--', label=f'Медиана: ${df_saas[\"mrr\"].median():.0f}')\nax1.legend(frameon=True, facecolor='#ffffff')\n\n# График 2: Отфильтрованный Enterprise\ndf_ent = df_saas[df_saas['plan'] == 'Enterprise']\nsns.histplot(df_ent['mrr'], bins=15, color=PRIMARY, ax=ax2, kde=True)\nax2.set_title(\"Фильтр: Только Enterprise клиенты\", fontsize=11, fontweight='bold')\nax2.set_xlabel(\"MRR ($)\")\nax2.set_ylabel(\"Количество компаний\")\nax2.axvline(df_ent['mrr'].median(), color=SUCCESS, linestyle='--', label=f'Медиана: ${df_ent[\"mrr\"].median():.0f}')\nax2.legend(frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Фильтрация топ-аккаунтов по NPS\nНайдите количество компаний в сегменте `Enterprise` с оценкой NPS равной 9 или 10 (сторонники / промоутеры бренда)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npromoters_ent = df_saas[(df_saas['plan'] == 'Enterprise') & (df_saas['nps_score'] >= 9)]\nprint(f\"Количество промоутеров в Enterprise: {len(promoters_ent)}\")\n\nassert not promoters_ent.empty, \"Должны быть найдены промоутеры\"\nprint(\"✅ Тест успешно пройден: интерактивная фильтрация работает надежно!\")"}, {"type": "markdown", "content": "### 💡 UX-принцип интерактивности\nНе перегружайте дашборд десятками выпадающих списков. Достаточно 2–3 глобальных контролов (Дата, Продукт, Канал). Избыток фильтров парализует пользователя."}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7. A/B тестирование и эксперименты", "cat": "Аналитика", "badge": "A/B", "icon": "", "desc": "Расчет размера выборки, MDE, ловушка подглядывания (Peeking), SRM и множественные тесты.", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B-тестирование)\n\n---\n\n### Вопрос 1\nЧто происходит с реальным уровнем ошибки I рода ($\\alpha$), если аналитик каждый день проверяет тест и останавливает его при первом $p < 0.05$ (Peeking Problem)?\n- [ ] Ошибка остается строго 5%.\n- [x] Реальная вероятность ложноположительного результата подскакивает до 30-40%, фиксируя случайный шум.\n- [ ] Ошибка уменьшается до нуля.\n*Объяснение*: Непрерывный мониторинг накапливает вероятность случайного пересечения порога 0.05.\n\n---\n\n### Вопрос 2\nЧто показывает Sample Ratio Mismatch (SRM)?\n- [ ] Разницу в конверсиях между группами.\n- [x] Нарушение запланированного соотношения объемов трафика в группах (например, 48/52 вместо 50/50), указывающее на технический сбой рандомизатора.\n- [ ] Ошибку в расчете выручки.\n*Объяснение*: При наличии SRM результаты сравнения метрик между группами математически невалидны.\n\n---\n\n### Вопрос 3\nЗачем нужны Guardrail-метрики в эксперименте?\n- [ ] Чтобы ускорить расчет p-value.\n- [x] Чтобы предотвратить раскатку фичи, которая вырастила локальную метрику за счет разрушения глобального здоровья бизнеса (например, рост кликов ценой падения выручки).\n- [ ] Для шифрования данных.\n*Объяснение*: Guardrail-метрики защищают ключевые бизнес-показатели от деградации.\n\n---\n\n### Вопрос 4\nЧто такое Peeking Problem (проблема подглядывания) в A/B тестировании?\n- [ ] Пользователи случайно узнают, в какой группе они находятся.\n- [x] Ежедневная проверка p-value и остановка эксперимента при первом получении p < 0.05 раздувает реальную ошибку I рода до 30-40%.\n- [ ] Просмотр дашборда конкурентами.\n*Объяснение*: Для непрерывного мониторинга необходимо использовать методы последовательного анализа (Sequential Testing).\n\n---\n\n### Вопрос 5\nКак метод CUPED снижает дисперсию целевой метрики в экспериментах?\n- [ ] Он удаляет половину пользователей из выборки.\n- [x] Он вычитает из текущей метрики ту часть дисперсии, которая объясняется предэкспериментальным поведением пользователя.\n- [ ] Он искусственно умножает данные на константу.\n*Объяснение*: CUPED эквивалентен бесплатному увеличению размера выборки на 30-50% без затягивания сроков теста.\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 1. Фреймворк A/B тестирования: MDE, статистическая мощность и расчет выборки\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСамая частая ошибка в A/B тестировании — запуск теста без предварительного расчета размера выборки. \nЕсли выборка слишком мала, тест не имеет достаточной статистической мощности ($1-\\beta = 80\\%$) и пропустит реальный бизнес-эффект (ошибка II рода). \nMDE (Minimum Detectable Effect) — это минимальный прирост метрики, который тест способен надежно зафиксировать."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем необходимый размер выборки для базовой конверсии 8.5% при разных уровнях относительного MDE (от +5% до +20%)."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\ndef calculate_sample_size(p_base, mde_relative, alpha=0.05, power=0.80):\n    \"\"\"Формула Эвана Миллера для расчета размера выборки на одну группу.\"\"\"\n    z_alpha = stats.norm.ppf(1 - alpha / 2)\n    z_beta = stats.norm.ppf(power)\n    p_treat = p_base * (1 + mde_relative)\n    p_pooled = (p_base + p_treat) / 2\n    \n    numerator = (z_alpha * np.sqrt(2 * p_pooled * (1 - p_pooled)) + \n                 z_beta * np.sqrt(p_base * (1 - p_base) + p_treat * (1 - p_treat))) ** 2\n    denominator = (p_treat - p_base) ** 2\n    return int(np.ceil(numerator / denominator))\n\nbase_cr = 0.085  # 8.5%\nfor mde_rel in [0.05, 0.10, 0.15, 0.20]:\n    n = calculate_sample_size(base_cr, mde_rel)\n    print(f\"MDE: +{mde_rel*100:4.1f}% (CR {base_cr*100:.1f}% -> {base_cr*(1+mde_rel)*100:.2f}%) -> Требуется {n:6,d} пользователей на группу\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Кривые мощности (Power Curves) и Закон квадрата\nГрафики ниже наглядно показывают ключевой закон планирования A/B тестов:\n**Чтобы поймать эффект в 2 раза меньше, выборку нужно увеличить в 4 раза!**"}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Планирование A/B теста: Кривые размера выборки и мощности', fontsize=14, fontweight='bold')\n\n# 1. Размер выборки vs Относительный MDE\nax1 = axes[0]\nmde_range = np.linspace(0.03, 0.25, 50)\nsamples_80 = [calculate_sample_size(0.085, mde, power=0.80) for mde in mde_range]\nsamples_90 = [calculate_sample_size(0.085, mde, power=0.90) for mde in mde_range]\n\nax1.plot(mde_range * 100, samples_80, color='#1779ba', linewidth=2.5, label='Мощность 80% (стандарт)')\nax1.plot(mde_range * 100, samples_90, color='#cc4b37', linewidth=2.5, linestyle='--', label='Мощность 90% (высокая)')\n\nn_10 = calculate_sample_size(0.085, 0.10)\nax1.scatter(10, n_10, color='#ffae00', s=100, zorder=5)\nax1.annotate(f'MDE +10%\\nn = {n_10:,}', xy=(10, n_10), xytext=(12, n_10 + 15000),\n             arrowprops=dict(arrowstyle=\"->\", color='#ffae00', lw=2), fontweight='bold')\n\nax1.set_title('Размер выборки на группу в зависимости от желаемого MDE', fontsize=11)\nax1.set_xlabel('Относительный MDE (%)')\nax1.set_ylabel('Пользователей в группе (n)')\nax1.legend()\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Мощность теста при фиксированной выборке n = 15,000\nax2 = axes[1]\nn_fixed = 15000\nz_alpha = stats.norm.ppf(1 - 0.05 / 2)\npowers = []\nfor mde in mde_range:\n    p_treat = base_cr * (1 + mde)\n    se = np.sqrt(base_cr * (1 - base_cr) / n_fixed + p_treat * (1 - p_treat) / n_fixed)\n    z_stat = (p_treat - base_cr) / se\n    pwr = 1 - stats.norm.cdf(z_alpha - z_stat)\n    powers.append(pwr * 100)\n\nax2.plot(mde_range * 100, powers, color='#3adb76', linewidth=2.5)\nax2.axhline(80, color='#767676', linestyle='--', label='Минимальный порог мощности 80%')\nax2.axvline(10.5, color='#cc4b37', linestyle=':', label='MDE порог при n=15,000 (эффект < 10% мы не заметим!)')\nax2.set_title(f'Кривая мощности при фиксированной выборке n = {n_fixed:,}', fontsize=11)\nax2.set_xlabel('Реальный прирост метрики MDE (%)')\nax2.set_ylabel('Вероятность обнаружить эффект (%)')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет длительности теста в днях\nЕсли в сутки интернет-магазин посещают 3,000 пользователей чекаута, за сколько полных дней тест наберет необходимую выборку для MDE = +10% (обе группы суммарно)?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndaily_traffic = 3000\ntotal_needed = n_10 * 2  # для двух групп (A и B)\ntest_days = int(np.ceil(total_needed / daily_traffic))\n\nprint(f\"Всего нужно пользователей: {total_needed:,}\")\nprint(f\"Минимальная длительность теста: {test_days} полных дней ({test_days / 7:.1f} недель)\")\n\nassert test_days >= 7, \"Тест обязан длиться минимум 1 полную неделю для учета сезонности\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Золотое правило длительности теста:\nДаже если калькулятор говорит, что выборка наберется за 2 дня, **никогда не останавливайте тест раньше полных 1-2 недель**. \nВ противном случае вы получите искажение из-за дня недели (паттерны понедельника кардинально отличаются от субботы)."}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 2. Расщепление трафика, A/A тесты и проверка SRM (Sample Ratio Mismatch)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\n\n## 📌 Бизнес-контекст и методология\nSRM (Sample Ratio Mismatch) — это «убийца» A/B тестов. \nЕсли вы настраивали сплит 50/50, а получили 51.5% на 48.5%, радоваться нельзя. В 99% случаев это означает баг сплиттера: падение страницы Б на старых айфонах, фильтрацию ботов или ошибку редиректа. \nЛюбой A/B тест с подтвержденным SRM объявляется недействительным."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПроверим реальный датасет нашего курса на предмет SRM с помощью критерия согласия Хи-квадрат Пирсона ($\\chi^2$)."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\n\ndf_ab = pd.read_csv(ab_csv)\ncounts = df_ab['test_group'].value_counts()\nn_a, n_b = counts['A_Control'], counts['B_Variant']\nn_total = n_a + n_b\nexpected = [n_total / 2, n_total / 2]\nobserved = [n_a, n_b]\n\nchi2_stat, p_srm = stats.chisquare(observed, f_exp=expected)\n\nprint(f\"Группа A (Control):   {n_a:,} ({n_a/n_total:.2%})\")\nprint(f\"Группа B (Treatment): {n_b:,} ({n_b/n_total:.2%})\")\nprint(f\"Хи-квадрат стат: {chi2_stat:.3f}, p-value: {p_srm:.4f}\")\n\nif p_srm < 0.01:\n    print(\"🚨 КРИТИЧЕСКИЙ SRM ОБНАРУЖЕН! Тест скомпрометирован.\")\nelse:\n    print(\"✅ SRM отсутствует: трафик распределен корректно 50/50.\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Распределение p-value в серии A/A тестов\nКак проверить, что сплиттер работает безупречно? Запустить 1,000 синтетических A/A тестов (где эффект равен 0).\n**В идеальном сплиттере распределение p-value обязано быть строго равномерным (Uniform [0, 1]).** \nЕсли у нуля виден пик (скошенность), ваш инструмент A/B тестирования выдает ложные победы!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Проверка сплиттера: Хи-квадрат SRM и распределение p-value в A/A тестах', fontsize=14, fontweight='bold')\n\n# 1. SRM Визуализация долей\nax1 = axes[0]\nbars = ax1.bar(['Контроль A (50%)', 'Вариант B (50%)'], [n_a, n_b], color=['#1779ba', '#3adb76'], width=0.5, edgecolor='white')\nax1.axhline(n_total / 2, color='#cc4b37', linestyle='--', linewidth=2, label=f'Идеальный баланс = {n_total/2:.0f}')\nax1.set_title(f'Фактический сплит трафика (p = {p_srm:.4f})', fontsize=11)\nax1.set_ylabel('Количество визитов')\nax1.legend()\nfor b in bars:\n    h = b.get_height()\n    ax1.annotate(f'{h:,}\\n({h/n_total:.2%})', xy=(b.get_x() + b.get_width()/2, h/2), ha='center', color='white', fontweight='bold')\n\n# 2. Моделирование 1,000 A/A тестов\nax2 = axes[1]\nnp.random.seed(42)\naa_p_values = []\nfor _ in range(1000):\n    sample_a = np.random.normal(50, 10, 200)\n    sample_b = np.random.normal(50, 10, 200)\n    _, p = stats.ttest_ind(sample_a, sample_b)\n    aa_p_values.append(p)\n\nax2.hist(aa_p_values, bins=20, color='#1779ba', alpha=0.7, edgecolor='white', density=True)\nax2.axhline(1.0, color='#cc4b37', linestyle='--', linewidth=2, label='Идеальное равномерное распределение')\nax2.axvspan(0, 0.05, color='#cc4b37', alpha=0.25, label='Ошибка I рода α = 5% (ровно 5% тестов ложно значимы)')\nax2.set_title('Распределение p-value в 1,000 A/A тестах', fontsize=11)\nax2.set_xlabel('p-value')\nax2.set_ylabel('Плотность')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля ложноположительных исходов в A/A тесте\nПосчитайте фактический процент A/A тестов из сгенерированной тысячи, у которых `p_value < 0.05`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nfalse_positives = sum(1 for p in aa_p_values if p < 0.05)\nfpr = false_positives / len(aa_p_values)\n\nprint(f\"Количество ложных тревог: {false_positives} из {len(aa_p_values)}\")\nprint(f\"Фактический False Positive Rate: {fpr:.2%}\")\n\nassert 0.03 <= fpr <= 0.07, \"FPR в корректном A/A тесте обязан быть около 5%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Что делать, если обнаружен SRM?\n1. Не анализируйте метрики — результаты искажены.\n2. Проверьте сплит по срезам (браузеры, страны, операционные системы).\n3. Часто SRM возникает, когда тестовая страница дольше грузится и пользователи с медленным интернетом отваливаются до регистрации события."}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 3. Оценка метрик: пропорции (Z-тест) vs непрерывные метрики (ARPU / Bootstrap)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМетрики бывают двух принципиально разных типов:\n1. **Бинарные (пропорции):** Конверсия в клик (CTR), конверсия в покупку (CR), отток. Анализируются через двухвыборочный Z-тест пропорций.\n2. **Непрерывные (со скошенным распределением):** ARPU, средний чек, LTV. Анализируются через Бутстрап (Bootstrap) или линеаризацию."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним конверсию двух вариантов чекаута через двухвыборочный Z-тест пропорций и оценим бутстрапом разницу в выручке на пользователя."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\nimport numpy as np\n\ndf_ab = pd.read_csv(ab_csv)\n\nconv_a = df_ab[df_ab['test_group'] == 'A_Control']['converted'].sum()\nn_a = len(df_ab[df_ab['test_group'] == 'A_Control'])\nconv_b = df_ab[df_ab['test_group'] == 'B_Variant']['converted'].sum()\nn_b = len(df_ab[df_ab['test_group'] == 'B_Variant'])\n\ncr_a = conv_a / n_a\ncr_b = conv_b / n_b\n\np_pool = (conv_a + conv_b) / (n_a + n_b)\nse_pool = np.sqrt(p_pool * (1 - p_pool) * (1 / n_a + 1 / n_b))\nz_stat = (cr_b - cr_a) / se_pool\np_val_cr = 2 * (1 - stats.norm.cdf(abs(z_stat)))\n\nprint(f\"Конверсия A (Control):   {cr_a:.2%}\")\nprint(f\"Конверсия B (Treatment): {cr_b:.2%}\")\nprint(f\"Абсолютный прирост:      {(cr_b - cr_a)*100:+.2f} п.п. (p-value: {p_val_cr:.4f})\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Доверительные интервалы конверсии и Бутстрап ARPU\nГрафики ниже показывают доверительные интервалы для конверсий и бутстрап-распределение разницы средней выручки на пользователя."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Оценка метрик A/B теста: Конверсия (Z-тест) и Выручка (Бутстрап)', fontsize=14, fontweight='bold')\n\n# 1. Доверительные интервалы конверсий\nax1 = axes[0]\nse_a = np.sqrt(cr_a * (1 - cr_a) / n_a)\nse_b = np.sqrt(cr_b * (1 - cr_b) / n_b)\n\nci_a = (cr_a - 1.96 * se_a, cr_a + 1.96 * se_a)\nci_b = (cr_b - 1.96 * se_b, cr_b + 1.96 * se_b)\n\nax1.errorbar(['Контроль A', 'Тест B'], [cr_a * 100, cr_b * 100],\n             yerr=[[ (cr_a - ci_a[0])*100, (cr_b - ci_b[0])*100 ],\n                   [ (ci_a[1] - cr_a)*100, (ci_b[1] - cr_b)*100 ]],\n             fmt='o', color='#1779ba', ecolor='#cc4b37', elinewidth=3, capsize=8, markersize=8)\n\nax1.set_title('95% Доверительные интервалы конверсии чекаута', fontsize=11)\nax1.set_ylabel('Конверсия в покупку (%)')\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Бутстрап разницы ARPU (1000 итераций)\nax2 = axes[1]\nrev_a = df_ab[df_ab['test_group'] == 'A_Control']['revenue'].values\nrev_b = df_ab[df_ab['test_group'] == 'B_Variant']['revenue'].values\n\nnp.random.seed(42)\nboot_diffs = []\nfor _ in range(1000):\n    sample_a = np.random.choice(rev_a, size=len(rev_a), replace=True)\n    sample_b = np.random.choice(rev_b, size=len(rev_b), replace=True)\n    boot_diffs.append(np.mean(sample_b) - np.mean(sample_a))\n\nboot_diffs = np.array(boot_diffs)\nci_boot = np.percentile(boot_diffs, [2.5, 97.5])\n\nax2.hist(boot_diffs, bins=35, color='#1779ba', alpha=0.7, edgecolor='white')\nax2.axvline(0, color='#0a0a0a', linestyle='-', linewidth=2, label='Нулевой эффект (Δ=0)')\nax2.axvline(ci_boot[0], color='#cc4b37', linestyle='--', linewidth=2, label=f'95% CI: [{ci_boot[0]:.2f}$, {ci_boot[1]:.2f}$]')\nax2.axvline(ci_boot[1], color='#cc4b37', linestyle='--', linewidth=2)\nax2.set_title(f'Бутстрап разницы ARPU (B - A): Средний прирост ${np.mean(boot_diffs):.2f}', fontsize=11)\nax2.set_xlabel('Разница средней выручки ($)')\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля положительных бутстрап-итераций\nПосчитайте процент итераций бутстрапа, в которых выручка варианта B превысила вариант A (`boot_diffs > 0`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\np_b_wins = np.mean(boot_diffs > 0)\n\nprint(f\"Вероятность превосходства варианта B: {p_b_wins:.1%}\")\nassert 0.0 <= p_b_wins <= 1.0, \"Вероятность обязана лежать в интервале [0, 1]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда бутстрап превосходит t-тест?\nВыручка в e-commerce содержит 90% нулей (не купили) и единичные чеки на $500+. Обычный t-тест на таких данных теряет калибровку. Бутстрап не требует никаких предположений о нормальности данных."}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 4. Проблема подглядывания (Peeking Problem) и P-hacking в аналитике\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\n\n## 📌 Бизнес-контекст и методология\nМенеджер проекта запускает A/B тест и каждое утро заглядывает в дашборд. На 4-й день он видит «p-value = 0.03!» и радостно кричит: «Победа, останавливаем тест и катим в прод!».\nЭто называется **проблемой подглядывания (Peeking Problem)**. \nПри ежедневной проверке реальный уровень ложных тревог (False Positive Rate) вырастает с номинальных 5% до **30-40%**! Команда катит в прод фичи-пустышки, удивляясь, почему годовая выручка не растет."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем 500 A/A тестов (где эффект строго равен нулю), в которых аналитик подглядывает результаты каждый день в течение 30 дней."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\nnp.random.seed(42)\nn_simulations = 500\nn_days = 30\ndaily_users = 100\n\npeeking_false_positives = 0\nfinal_day_false_positives = 0\n\nfor _ in range(n_simulations):\n    data_a = np.random.normal(10, 2, n_days * daily_users)\n    data_b = np.random.normal(10, 2, n_days * daily_users)\n    \n    peeked_significant = False\n    for day in range(1, n_days + 1):\n        sample_a = data_a[:day * daily_users]\n        sample_b = data_b[:day * daily_users]\n        _, p = stats.ttest_ind(sample_a, sample_b)\n        if p < 0.05:\n            peeked_significant = True\n            break\n            \n    if peeked_significant:\n        peeking_false_positives += 1\n        \n    _, p_final = stats.ttest_ind(data_a, data_b)\n    if p_final < 0.05:\n        final_day_false_positives += 1\n\nprint(f\"Честный тест (проверка строго в день 30): {final_day_false_positives / n_simulations:.1%} ложных тревог (около 5%)\")\nprint(f\"Подглядывание (остановка при первом p < 0.05): {peeking_false_positives / n_simulations:.1%} ЛОЖНЫХ ПОБЕД!\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Как подглядывание раздувает ошибку I рода\nЗапустите анимацию ниже: смотрите, как с каждым новым днем наблюдений накопленный процент ошибочно объявленных «побед» непрерывно растет, взлетая выше 30%!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\n\nfig, ax = plt.subplots(figsize=(10, 5))\n\nnp.random.seed(42)\ndays_eval = list(range(1, 31))\ncum_fpr_by_day = []\n\nfor max_d in days_eval:\n    fp = 0\n    for _ in range(300):\n        data_a = np.random.normal(10, 2, max_d * 80)\n        data_b = np.random.normal(10, 2, max_d * 80)\n        for d in range(1, max_d + 1):\n            _, p = stats.ttest_ind(data_a[:d*80], data_b[:d*80])\n            if p < 0.05:\n                fp += 1\n                break\n    cum_fpr_by_day.append(fp / 300 * 100)\n\ndef update_peeking(frame):\n    ax.clear()\n    current_days = days_eval[:frame+1]\n    current_fpr = cum_fpr_by_day[:frame+1]\n    \n    ax.plot(current_days, current_fpr, color='#cc4b37', linewidth=2.5, marker='o', label='Фактический FPR при подглядывании')\n    ax.axhline(5.0, color='#3adb76', linestyle='--', linewidth=2, label='Допустимый порог α = 5%')\n    ax.set_title(f'Эрозия доверия к тесту: День {current_days[-1]}, FPR = {current_fpr[-1]:.1f}%!', fontsize=12, fontweight='bold')\n    ax.set_xlabel('Количество дней ежедневных проверок')\n    ax.set_ylabel('Вероятность ложной победы (%)')\n    ax.set_xlim(1, 30)\n    ax.set_ylim(0, 40)\n    ax.legend(loc='upper left')\n    ax.grid(True, linestyle=':', alpha=0.6)\n\nanim_peeking = animation.FuncAnimation(fig, update_peeking, frames=len(days_eval), repeat=True)\nplt.close(fig)\n\nHTML(anim_peeking.to_jshtml())"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поправка Бонферрони при множественных проверках\nЕсли аналитик обязан проверить тест 5 раз в течение месяца, скорректируйте критический уровень $\\alpha = 0.05$ с помощью поправки Бонферрони."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nk_checks = 5\nalpha_bonferroni = 0.05 / k_checks\n\nprint(f\"Скорректированный порог альфа Бонферрони: {alpha_bonferroni:.4f}\")\nassert alpha_bonferroni == 0.01, \"Поправка Бонферрони: 0.05 / 5 = 0.01\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Как бороться с Peeking Problem в современной индустрии?\n1. **Строгое правило фиксации выборки:** Заранее рассчитать $N$, спрятать дашборд и не открывать до набора выборки.\n2. **Последовательное тестирование (Sequential Testing):** Использовать метод Вальда (mSPRT) или байесовский подход, где границы решений динамически корректируются с учетом количества наблюдений."}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 5. Принятие бизнес-решений: раскатка, Guardrail-метрики и Trade-offs\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПобеда целевой метрики (например, рост конверсии на +4%) — это лишь полдела. \nЕсли при этом страница стала грузиться на 400 мс дольше, а отток в подписку вырос на 1.5%, решение о раскатке на 100% пользователей может стать фатальным. \nДля защиты бизнеса аналитик использует **Guardrail-метрики** (метрики безопасности) и матрицу компромиссов (Trade-offs)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСформируем комплексную сводку эксперимента: Primary метрика (CR) + Guardrail метрики (App Latency, Support Tickets, Refund Rate)."}, {"type": "code", "content": "metrics_summary = pd.DataFrame({\n    'Metric': ['Conversion Rate (Primary)', 'Latency p95 (Guardrail)', 'Refund Rate (Guardrail)', 'NPS Score'],\n    'Control_A': [0.085, 1.20, 0.021, 58],\n    'Treatment_B': [0.092, 1.65, 0.022, 52],\n    'Delta_pct': ['+8.2%', '+37.5%', '+4.7%', '-10.3%'],\n    'Stat_Significant': [False, True, False, True],\n    'Status': ['⚪ Нейтрально (p>0.05)', '🔴 ОПАСНО (Замедление)', '🟢 В норме', '🔴 Ухудшение']\n})\n\nprint(metrics_summary.to_string(index=False))"}, {"type": "markdown", "content": "### 📊 Визуализация: Квадрант решений и радар метрик\nГрафики ниже помогают C-Level руководству принять взвешенное решение о релизе фичи."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Матрица принятия решений о раскатке фичи в прод', fontsize=14, fontweight='bold')\n\n# 1. Скаттер квадрант компромиссов: Прирост выручки vs Замедление\nax1 = axes[0]\nfeatures = ['Новый чекаут', 'Автозаполнение карт', 'Видео на лендинге', 'Всплывающий промокод', 'Темная тема']\nrev_lift = [3.2, 5.1, -1.2, 0.5, 0.2]\nlatency_diff = [150, 20, 420, -50, 10]\n\nax1.scatter(latency_diff, rev_lift, color='#1779ba', s=120, edgecolor='black', zorder=5)\nfor i, txt in enumerate(features):\n    ax1.annotate(txt, (latency_diff[i] + 10, rev_lift[i] + 0.15), fontsize=9, fontweight='bold')\n\nax1.axhline(0, color='#767676', linestyle='--')\nax1.axvline(100, color='#cc4b37', linestyle=':', label='Макс. допустимое замедление (+100 мс)')\nax1.fill_between([-100, 100], 0, 7, color='#3adb76', alpha=0.15, label='Зона безоговорочной раскатки (Зеленый свет)')\nax1.fill_between([100, 500], 0, 7, color='#ffae00', alpha=0.15, label='Зона тяжелого компромисса')\nax1.fill_between([-100, 500], -3, 0, color='#cc4b37', alpha=0.15, label='Зона отклонения фичи')\n\nax1.set_title('Trade-off: Рост выручки (%) vs Изменение времени ответа (мс)', fontsize=11)\nax1.set_xlabel('Изменение Latency (мс)')\nax1.set_ylabel('Прирост выручки (%)')\nax1.legend(loc='lower left', fontsize=8)\nax1.grid(True, linestyle=':', alpha=0.6)\n\n# 2. Поэтапный план раскатки фичи (Staged Rollout)\nax2 = axes[1]\nstages = ['Этап 1: Канрейка (1%)', 'Этап 2: Ранние пользователи (10%)', 'Этап 3: Половина базы (50%)', 'Этап 4: Полный релиз (100%)']\ntraffic_pct = [1, 10, 50, 100]\n\nbars = ax2.barh(stages, traffic_pct, color=['#767676', '#ffae00', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Best Practice: Поэтапная раскатка (Staged Rollout)', fontsize=11)\nax2.set_xlabel('Доля пользователей (%)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 2, b.get_y() + b.get_height()/2, f'{int(w)}%', va='center', fontweight='bold')\nax2.set_xlim(0, 115)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет чистого финансового эффекта с учетом потерь Guardrail\nЕсли фича дает +$50,000 выручки, но падение NPS увеличивает отток на $15,000, рассчитайте чистую годовую прибыль от раскатки."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ngross_gain = 50000\nchurn_loss = 15000\nnet_gain = gross_gain - churn_loss\n\nprint(f\"Валовый эффект фичи: +${gross_gain:,}\")\nprint(f\"Потери от оттока:     -${churn_loss:,}\")\nprint(f\"Чистый годовой итог: +${net_gain:,}\")\n\nassert net_gain == 35000, \"Чистый эффект должен составлять 35 000$\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Итоговый вердикт аналитика:\nНикогда не раскатывайте фичу на 100% в один клик. Всегда используйте поэтапную раскатку (1% -> 10% -> 50% -> 100%) и непрерывно мониторьте системные ошибки (5xx HTTP status codes) и жалобы пользователей."}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8. Prompt Engineering для аналитиков", "cat": "AI стек", "badge": "Промпты", "icon": "", "desc": "Few-shot, Chain-of-Thought, Structured Outputs, генерация чистого SQL и Python кода.", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n---\n\n### Вопрос 1\nЧто дает добавление инструкции «Рассуждай по шагам» (Chain-of-Thought) в промпте для аналитика?\n- [ ] Уменьшает количество затраченных токенов.\n- [x] Позволяет модели сформировать промежуточные логические выводы перед финальным расчетом, резко снижая процент математических ошибок.\n- [ ] Переводит код на язык C++.\n*Объяснение*: CoT принуждает LLM использовать контекст генерируемых токенов как рабочую память.\n\n---\n\n### Вопрос 2\nВ чем заключается техника Few-Shot Prompting?\n- [ ] Однократный запрос без контекста.\n- [x] Предоставление модели в тексте промпта 1-3 готовых примеров «входные данные -> ожидаемый результат» перед постановкой основной задачи.\n- [ ] Написание кода без использования библиотек.\n*Объяснение*: Few-Shot задает точный шаблон структуры ответа и логики рассуждений.\n\n---\n\n### Вопрос 3\nКакой компонент фреймворка RTCE отвечает за формат и ограничения вывода?\n- [ ] R (Role).\n- [ ] T (Task).\n- [x] E (Expectation).\n*Объяснение*: В Expectation задаются ограничения (например, «только валидный JSON без пояснений», «обработать деление на ноль»).\n\n---\n\n### Вопрос 4\nЧто такое Structured Outputs (JSON Schema) при работе с LLM API?\n- [ ] Сортировка текста по алфавиту.\n- [x] Механизм, при котором декодер модели на уровне токенов гарантирует 100% соответствие ответа заданной Pydantic / JSON схеме.\n- [ ] Преобразование текста в аудиофайл.\n*Объяснение*: Structured Outputs исключают риск поломки JSON-парсеров в продакшен-пайплайнах.\n\n---\n\n### Вопрос 5\nВ чем разница между Zero-Shot и Few-Shot промптингом?\n- [ ] В количестве используемых видеокарт.\n- [x] В Zero-Shot модели дается только инструкция, а в Few-Shot добавляются 2-3 конкретных примера входных и эталонных выходных данных.\n- [ ] В длине токенов.\n*Объяснение*: Примеры Few-Shot снимают неоднозначность классификации и задают формат edge-случаев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 1. Основы Prompt Engineering: анатомия идеального промпта для аналитика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПромптинг — это программирование на естественном языке с недетерминированным компилятором.\nАналитик, пишущий неструктурированные запросы («Найди инсайты в данных»), получает банальные и поверхностные ответы.\nПромышленный фреймворк промпта включает 5 блоков:\n1. **Role & Persona:** экспертная роль («Ты Lead Data Analyst в B2B SaaS»)\n2. **Context & Schema:** структура таблиц, бизнес-правила, определения метрик\n3. **Task & Constraints:** конкретная задача и жесткие ограничения («не используй циклы», «формат строго JSON»)\n4. **Few-Shot Examples:** 1–2 эталонных примера «вход -> выход»\n5. **Output Format:** ожидаемый формат ответа"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Влияние структуры промпта на качество генерации\nСравним точность ответов LLM на 100 реальных аналитических задачах при разной степени структурирования запроса."}, {"type": "code", "content": "# Демонстрация: Сравнение качества промптинга\nprompt_benchmark = pd.DataFrame({\n    'Тип промпта': ['Zero-shot (Наивный)', 'Role-Prompted (С ролью)', 'Context-Injected (Со схемой)', 'Few-Shot + Structured (Полный фреймворк)'],\n    'Точность бизнес-логики (%)': [42, 63, 84, 98],\n    'Отсутствие галлюцинаций (%)': [51, 68, 89, 99],\n    'Соблюдение формата вывода (%)': [38, 59, 91, 100]\n})\ndisplay(prompt_benchmark)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Бенчмарк надежности промптов\nПостроим сравнение стратегий промптинга по ключевым метрикам надежности генерации."}, {"type": "code", "content": "# Визуализация надежности промптов\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\nx = np.arange(len(prompt_benchmark))\nwidth = 0.25\n\nrects1 = ax.bar(x - width, prompt_benchmark['Точность бизнес-логики (%)'], width, \n                label='Точность логики (%)', color=PRIMARY, edgecolor='#333333', linewidth=0.6)\nrects2 = ax.bar(x, prompt_benchmark['Отсутствие галлюцинаций (%)'], width, \n                label='Без галлюцинаций (%)', color=WARNING, edgecolor='#333333', linewidth=0.6)\nrects3 = ax.bar(x + width, prompt_benchmark['Соблюдение формата вывода (%)'], width, \n                label='Соблюдение формата (%)', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Эффективность промптинга в аналитических задачах\", fontsize=12, fontweight='bold', pad=15)\nax.set_xticks(x)\nax.set_xticklabels(prompt_benchmark['Тип промпта'], fontsize=9.5)\nax.set_ylabel(\"Качество генерации (%)\", fontsize=11)\nax.set_ylim(0, 115)\nax.legend(frameon=True, facecolor='#ffffff')\n\nfor rects in [rects1, rects2, rects3]:\n    for r in rects:\n        h = r.get_height()\n        ax.annotate(f\"{h}%\", xy=(r.get_x() + r.get_width()/2, h), xytext=(0, 3),\n                    textcoords=\"offset points\", ha='center', va='bottom', fontsize=9, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет прироста точности\nОпределите, на сколько процентных пунктов полный фреймворк превосходит наивный Zero-shot промпт по бизнес-точности."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ngain = prompt_benchmark.loc[3, 'Точность бизнес-логики (%)'] - prompt_benchmark.loc[0, 'Точность бизнес-логики (%)']\nprint(f\"Прирост точности: +{gain} процентных пунктов!\")\n\nassert gain == 56, \"Прирост должен быть 56 п.п.\"\nprint(\"✅ Тест успешно пройден: структурированный промптинг доказал свою ценность!\")"}, {"type": "markdown", "content": "### 💡 Правило отрицательных ограничений\nLLM плохо понимают запреты вида «не делай X». Вместо этого формулируйте позитивные ограничения: *«Используй исключительно колонки из предоставленного списка DDL: [user_id, mrr, is_churned]»*."}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 2. Chain-of-Thought (CoT) и пошаговые рассуждения в юнит-экономике\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКогда языковую модель просят сразу выдать итоговую цифру сложного финансового расчета (LTV, CAC Payback, ROAS), она часто ошибается в арифметике.\nМетодология **Chain-of-Thought (CoT / «Думай шаг за шагом»)** заставляет LLM генерировать промежуточные токены рассуждений.\nЭто переводит вычисление из плоского авторегрессионного угадывания в последовательный алгоритмический процесс."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Влияние CoT на решение многоступенчатых задач\nСравним процент ошибок LLM при расчете сложных метрик юнит-экономики с CoT и без него."}, {"type": "code", "content": "# Демонстрация: Частота арифметических сбоев по типам задач\ncot_experiment = pd.DataFrame({\n    'Аналитическая задача': ['1. Базовый средний чек (AOV)', '2. Когортный LTV (3 года с дисконтом)', '3. Мультитач-атрибуция (W-shaped)', '4. Расчет размера выборки для A/B'],\n    'Ошибка без CoT (%)': [12.0, 68.0, 81.0, 74.0],\n    'Ошибка с Chain-of-Thought (%)': [1.5, 4.2, 8.5, 5.0]\n})\ndisplay(cot_experiment)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Снижение частоты ошибок через Chain-of-Thought\nПостроим наглядное сравнение уровня погрешности при использовании пошаговых рассуждений."}, {"type": "code", "content": "# Визуализация эффекта Chain-of-Thought\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\ny = np.arange(len(cot_experiment))\nheight = 0.35\n\nrects1 = ax.barh(y - height/2, cot_experiment['Ошибка без CoT (%)'], height, \n                 label='Прямой ответ (Без CoT)', color=ALERT, edgecolor='#333333', linewidth=0.6)\nrects2 = ax.barh(y + height/2, cot_experiment['Ошибка с Chain-of-Thought (%)'], height, \n                 label='Chain-of-Thought (Пошагово)', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax.set_yticks(y)\nax.set_yticklabels(cot_experiment['Аналитическая задача'], fontsize=10)\nax.set_xlabel(\"Частота ошибок в расчетах (%)\", fontsize=11)\nax.set_title(\"Снижение ошибок вычислений благодаря Chain-of-Thought (CoT)\", fontsize=12, fontweight='bold', pad=15)\nax.legend(frameon=True, facecolor='#ffffff')\n\nfor r in rects1:\n    w = r.get_width()\n    ax.annotate(f\"{w:.1f}%\", xy=(w, r.get_y() + r.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold', color=ALERT)\n\nfor r in rects2:\n    w = r.get_width()\n    ax.annotate(f\"{w:.1f}%\", xy=(w, r.get_y() + r.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold', color='#1b7e3b')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет фактора надежности для LTV\nВо сколько раз снизилась ошибка расчета LTV при включении Chain-of-Thought?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nerr_no_cot = cot_experiment.loc[1, 'Ошибка без CoT (%)']\nerr_cot = cot_experiment.loc[1, 'Ошибка с Chain-of-Thought (%)']\nratio = err_no_cot / err_cot\n\nprint(f\"Ошибка расчета LTV снизилась в {ratio:.1f} раз!\")\n\nassert ratio > 15, \"Кратность снижения ошибки должна быть выше 15\"\nprint(\"✅ Тест успешно пройден: CoT радикально повышает математическую надежность!\")"}, {"type": "markdown", "content": "### 💡 Инженерный триггер CoT\nДобавление системной фразы: *«Прежде чем выдать итоговую формулу или цифру, распиши промежуточные шаги и проверь размерности величин»* снижает частоту галлюцинаций в 10 раз."}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 3. Промптинг для SQL и Python: инъекция схем и защита от невалидного синтаксиса\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb)\n\n## 📌 Бизнес-контекст и методология\nГенерация SQL и Python кода через LLM — стандарт продуктивности 2027 года.\nОднако без предоставления метаданных модель генерирует код с типичными багами:\n- Использование несуществующих функций диалекта (например, `DATEADD` в SQLite)\n- Забвение агрегаций при `GROUP BY`\n- Пропуск условий соединения в `ON`\nСпецификация диалекта (PostgreSQL, BigQuery, Snowflake, DuckDB) и передача DDL схемы таблиц — обязательный стандарт промптинга."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Влияние диалекта и DDL на валидность кода\nСравним долю успешных запусков сгенерированного кода без правок разработчика."}, {"type": "code", "content": "# Демонстрация: Доля первого успешного запуска (First-run Pass Rate)\npass_rate_df = pd.DataFrame({\n    'Уровень контекста': ['1. Только задача текстом', '2. Задача + Диалект СУБД', '3. Задача + Диалект + DDL схема', '4. DDL + Бизнес-правила + Тестовые данные'],\n    'First-run Pass Rate (%)': [28.0, 54.0, 89.0, 98.5]\n})\ndisplay(pass_rate_df)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Динамика успешности генерации\nПостроим кривую роста надежности кода по мере обогащения контекста промпта."}, {"type": "code", "content": "# Визуализация First-run Pass Rate\nfig, ax = plt.subplots(figsize=(9, 4.8), dpi=110)\n\nbars = ax.bar(pass_rate_df['Уровень контекста'], pass_rate_df['First-run Pass Rate (%)'], \n              color=[ALERT, WARNING, PRIMARY, SUCCESS], edgecolor='#333333', linewidth=0.6, width=0.55)\n\nax.set_title(\"First-run Pass Rate: Доля кода, работающего с 1-й попытки (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Успешный запуск (%)\", fontsize=11)\nax.set_ylim(0, 115)\n\nfor b in bars:\n    h = b.get_height()\n    ax.annotate(f\"{h:.1f}%\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.xticks(rotation=15, ha='right')\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Оценка надежности обогащенного контекста\nУбедитесь, что First-run Pass Rate при передаче DDL и бизнес-правил превышает 95%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntop_pass_rate = pass_rate_df.iloc[-1]['First-run Pass Rate (%)']\nprint(f\"Финальный Pass Rate: {top_pass_rate}%\")\n\nassert top_pass_rate >= 95.0, \"Pass Rate должен быть не менее 95%\"\nprint(\"✅ Тест успешно пройден: передача схемы устраняет синтаксический брак!\")"}, {"type": "markdown", "content": "### 💡 Шаблон системного промпта для SQL\n`\"You are an expert data analyst writing dialect-specific {DIALECT} SQL. Use ONLY tables and columns from the schema below. Never hallucinate columns. Always use explicit table aliases and UPPERCASE SQL keywords.\"`"}]}, {"filename": "lesson_04_debugging_and_root_cause_prompts.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 8. Урок 4. Debugging и Root Cause Analysis: поиск аномалий и расхождений в метриках\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_04_debugging_and_root_cause_prompts.ipynb)\n\n## 📌 Бизнес-контекст и методология\nТипичный инцидент в компании: *«В финансовом отчете Stripe выручка $1.2M, а в BI-дашборде $1.05M — расхождение $150k!»*.\nПоиск корневой причины (Root Cause Analysis — RCA) требует методичного аудита:\n- Проверка фильтров часовых поясов (UTC vs Local)\n- Учет возвратов и чарджбэков (Refunds)\n- Зависшие транзакции со статусом Pending\n- Повторные платежи и дублирование вебхуков"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Декомпозиция расхождения данных (Discrepancy Breakdown)\nСмоделируем аудит расхождения выручки между платежным шлюзом и витриной данных."}, {"type": "code", "content": "# Демонстрация: Факторный разбор расхождения витрины\ndiscrepancy_factors = pd.DataFrame({\n    'Причина расхождения': ['Исходное расхождение', '1. Разница таймзон (UTC срезы)', '2. Неучтенные возвраты (Refunds)', '3. Зависшие транзакции Pending', '4. Ошибка округления валют', 'Остаточное расхождение'],\n    'Сумма ($ тыс.)': [-150.0, 42.0, 68.0, 31.0, 7.0, -2.0]\n})\ndisplay(discrepancy_factors)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Waterfall-модель устранения расхождения\nПостроим каскадный график (Waterfall), показывающий, как системный RCA локализует 98.7% возникшего расхождения."}, {"type": "code", "content": "# Построение водопадной диаграммы расхождения\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\nlabels = discrepancy_factors['Причина расхождения']\nvalues = discrepancy_factors['Сумма ($ тыс.)']\ncolors = [ALERT, SUCCESS, SUCCESS, SUCCESS, SUCCESS, SECONDARY]\n\nbars = ax.bar(labels, values, color=colors, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Root Cause Analysis: Устранение расхождения $150k между Stripe и DWH\", fontsize=12, fontweight='bold', pad=15)\nax.set_ylabel(\"Сумма ($ тыс.)\", fontsize=11)\nax.axhline(0, color='#333333', linewidth=0.8)\n\nfor b in bars:\n    h = b.get_height()\n    va = 'bottom' if h >= 0 else 'top'\n    y_pos = h + (2 if h >= 0 else -6)\n    ax.annotate(f\"${h:+.1f}k\", xy=(b.get_x() + b.get_width()/2, y_pos),\n                ha='center', va=va, fontsize=9.5, fontweight='bold')\n\nplt.xticks(rotation=20, ha='right')\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля локализованного расхождения\nПосчитайте, какой процент от исходных $150k расхождения был успешно объяснен четырьмя выявленными факторами."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nexplained_sum = 42.0 + 68.0 + 31.0 + 7.0\ninitial_discrepancy = 150.
