ab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb)\n\n---\n\n## 📌 Паспорт проекта\n- **Бизнес-заказчик**: Коммерческий директор маркетплейса.\n- **Источник данных**: Реальная база транзакций `ecommerce.db` (2 282 заказа, 1 200 клиентов, 3 734 товарных позиции).\n- **Стек**: SQL (SQLite/PostgreSQL), Python (Pandas, Seaborn), Looker Studio.\n- **Цель**: Выявить причины падения повторных продаж, провести RFM-сегментацию и подготовить витрину для BI-дашборда.\n\n---\n\n## Шаг 1: SQL-аналитика когорт и жизненного цикла\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# 1. SQL-запрос для построения RFM витрины\nquery_rfm = \"\"\"\nWITH customer_orders AS (\n    SELECT \n        c.customer_id,\n        c.city,\n        c.acquisition_channel,\n        MAX(o.order_date) AS last_order,\n        COUNT(DISTINCT o.order_id) AS frequency,\n        ROUND(SUM(oi.total_amount), 2) AS monetary\n    FROM customers c\n    JOIN orders o ON c.customer_id = o.customer_id\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY c.customer_id\n)\nSELECT * FROM customer_orders;\n\"\"\"\n\nrfm = pd.read_sql(query_rfm, conn)\nrfm['last_order'] = pd.to_datetime(rfm['last_order'])\nnow = pd.to_datetime('2026-10-01')\nrfm['recency_days'] = (now - rfm['last_order']).dt.days\n\n# Расчет RFM-баллов (1-4)\nrfm['R'] = pd.qcut(rfm['recency_days'], q=4, labels=[4, 3, 2, 1])\nrfm['F'] = pd.qcut(rfm['frequency'].rank(method='first'), q=4, labels=[1, 2, 3, 4])\nrfm['M'] = pd.qcut(rfm['monetary'], q=4, labels=[1, 2, 3, 4])\n\n# Сегментация\ndef segment_customer(row):\n    r, f = int(row['R']), int(row['F'])\n    if r >= 3 and f >= 3:\n        return 'Champions (VIP)'\n    elif r >= 3 and f < 3:\n        return 'New Potential'\n    elif r < 2 and f >= 3:\n        return 'At Risk (Уходящие лояльные)'\n    else:\n        return 'Lost (Уснувшие)'\n\nrfm['Segment'] = rfm.apply(segment_customer, axis=1)\n\nprint(\"=== РЕЗУЛЬТАТ RFM-СЕГМЕНТАЦИИ КЛИЕНТСКОЙ БАЗЫ ===\")\nprint(rfm['Segment'].value_counts())\nprint(\"\\nСредний чек по сегментам:\")\nprint(rfm.groupby('Segment')['monetary'].agg(['count', 'mean', 'sum']).round(1))\n"}]}]}, {"id": "module_15_portfolio_project_2", "title": "Проект 2. SaaS продуктовая аналитика и A/B", "category": "Портфолио", "badge": "Проект", "readme": "# 📱 Портфолио-проект 2: SaaS Продуктовая аналитика и A/B Тестирование\n\n## 📌 Описание проекта\nАнализ продуктовых метрик B2B SaaS платформы (2000 компаний, датасет `saas_users.csv`):\n1. **Воронка активации**: Использование ключевых фичей A и B.\n2. **Анализ оттока (Churn Analysis)**: Влияние NPS и тарифа на удержание клиентов.\n3. **A/B Эксперимент**: Полный статистический анализ нового флоу оплаты (Z-test, проверка SRM, расчет доверительных интервалов).\n\n## 📁 Файлы\n- `project_2_saas_product_analytics.ipynb` — Сквозной рабочий ноутбук проекта.\n", "quiz": "# 🧠 Quiz: Защита Проекта 2 (SaaS Product Analytics & A/B)\n\n---\n\n### Вопрос 1\nПочему перед расчетом конверсий в A/B-тесте обязательно проводить проверку на SRM (Sample Ratio Mismatch)?\n- [ ] Чтобы проверить скорость интернета.\n- [x] Потому что неравномерное распределение трафика указывает на технический баг рандомизатора (например, отвал пользователей на старых браузерах), делая любые выводы о конверсии невалидными.\n- [ ] Это формальное требование без математического смысла.\n*Объяснение*: Если одна группа системно теряет пользователей до попадания в лог, выборки смещены.\n\n---\n\n### Вопрос 2\nЕсли $p\\text{-value} = 0.008$ при пороге $\\alpha = 0.05$, какое решение принимает продуктовый аналитик?\n- [ ] Отклонить альтернативную гипотезу и продолжить тест.\n- [x] Отклонить нулевую гипотезу (разница статистически значима) и при отсутствии деградации защитных метрик рекомендовать раскатку фичи.\n- [ ] Перезагрузить сервер.\n*Объяснение*: $p < \\alpha$ означает статистическую достоверность зафиксированного эффекта.\n", "cheatsheet": "", "notebooks": [{"filename": "project_2_saas_product_analytics.ipynb", "rel_path": "course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📱 Выпускной проект 2: SaaS Продуктовая аналитика и A/B-тестирование\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 📌 Паспорт проекта\\n\",\n        \"- **Продукт**: B2B SaaS платформа аналитики (2 000 компаний, датасет `saas_users.csv`).\\n\",\n        \"- **Бизнес-задача**: Оценить факторы оттока клиентов (Churn Rate) и провести статистический аудит A/B-теста новой формы подписки (`ab_test_checkout.csv`).\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"from statsmodels.stats.proportion import proportions_ztest\\n\",\n        \"from scipy.stats import chisquare\\n\",\n        \"\\n\",\n        \"# 1. Загрузка данных A/B теста\\n\",\n        \"ab_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\ab_test_checkout.csv\\\")\\n\",\n        \"\\n\",\n        \"# 2. Проверка SRM (Sample Ratio Mismatch)\\n\",\n        \"counts = ab_df['test_group'].value_counts()\\n\",\n        \"stat_srm, p_srm = chisquare(counts.values, [len(ab_df)/2, len(ab_df)/2])\\n\",\n        \"assert p_srm > 0.01, \\\"ОШИБКА: Обнаружен SRM! Тест невалиден.\\\"\\n\",\n        \"print(f\\\" SRM-проверка пройдена успешно (p = {p_srm:.4f})\\\")\\n\",\n        \"\\n\",\n        \"# 3. Анализ Uplift конверсии\\n\",\n        \"a = ab_df[ab_df['test_group'] == 'A_Control']\\n\",\n        \"b = ab_df[ab_df['test_group'] == 'B_Variant']\\n\",\n        \"\\n\",\n        \"cr_a = a['converted'].mean()\\n\",\n        \"cr_b = b['converted'].mean()\\n\",\n        \"uplift = (cr_b - cr_a) / cr_a * 100\\n\",\n        \"\\n\",\n        \"z_stat, p_val = proportions_ztest([b['converted'].sum(), a['converted'].sum()], [len(b), len(a)])\\n\",\n        \"print(f\\\"Контроль (A): {cr_a*100:.2f}% | Тест (B): {cr_b*100:.2f}% | Uplift: +{uplift:.2f}%\\\")\\n\",\n        \"print(f\\\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\\\")\\n\",\n        \"\\n\",\n        \"if p_val < 0.05:\\n\",\n        \"    print(\\\" РЕШЕНИЕ: Раскатывать вариант B на 100% базы.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📱 Выпускной проект 2: SaaS Продуктовая аналитика и A/B-тестирование\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb)\n\n---\n\n## 📌 Паспорт проекта\n- **Продукт**: B2B SaaS платформа аналитики (2 000 компаний, датасет `saas_users.csv`).\n- **Бизнес-задача**: Оценить факторы оттока клиентов (Churn Rate) и провести статистический аудит A/B-теста новой формы подписки (`ab_test_checkout.csv`).\n"}, {"type": "code", "content": "import pandas as pd\nfrom statsmodels.stats.proportion import proportions_ztest\nfrom scipy.stats import chisquare\n\n# 1. Загрузка данных A/B теста\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\n\n# 2. Проверка SRM (Sample Ratio Mismatch)\ncounts = ab_df['test_group'].value_counts()\nstat_srm, p_srm = chisquare(counts.values, [len(ab_df)/2, len(ab_df)/2])\nassert p_srm > 0.01, \"ОШИБКА: Обнаружен SRM! Тест невалиден.\"\nprint(f\" SRM-проверка пройдена успешно (p = {p_srm:.4f})\")\n\n# 3. Анализ Uplift конверсии\na = ab_df[ab_df['test_group'] == 'A_Control']\nb = ab_df[ab_df['test_group'] == 'B_Variant']\n\ncr_a = a['converted'].mean()\ncr_b = b['converted'].mean()\nuplift = (cr_b - cr_a) / cr_a * 100\n\nz_stat, p_val = proportions_ztest([b['converted'].sum(), a['converted'].sum()], [len(b), len(a)])\nprint(f\"Контроль (A): {cr_a*100:.2f}% | Тест (B): {cr_b*100:.2f}% | Uplift: +{uplift:.2f}%\")\nprint(f\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\")\n\nif p_val < 0.05:\n    print(\" РЕШЕНИЕ: Раскатывать вариант B на 100% базы.\")\n"}]}]}, {"id": "module_16_portfolio_project_3", "title": "Проект 3. AI Driven аналитический пайплайн", "category": "Портфолио", "badge": "Проект", "readme": "# 🤖 Портфолио-проект 3: AI-Driven Analytical Pipeline & Smart BI Chat\n\n## 📌 Описание проекта (Флагманский проект 2027 года)\nЭтот проект выделит ваше резюме среди сотен классических кандидатов. Мы строим сквозную AI-систему:\n1. **Сбор неструктурированных данных**: Отзывы клиентов из `customer_reviews.csv`.\n2. **LLM API Обогащение**: Извлечение тем жалоб, sentiment-анализ и структурирование в JSON.\n3. **RAG База знаний**: Индексация метрик компании в векторной БД ChromaDB.\n4. **Smart BI Agent**: Чат-ассистент, который принимает вопрос н \"---\\n\",\n        \"\\n\",\n        \"## 📌 Паспорт проекта (Флагманский проект 2027 года)\\n\",\n        \"Сквозная архитектура аналитического пайплайна нового поколения:\\n\",\n        \"1. **Неструктурированные данные**: Парсинг и семантическая разметка 800 отзывов через LLM API.\\n\",\n        \"2. **Векторная база (ChromaDB)**: Индексация словаря корпоративных метрик.\\n\",\n        \"3. **Smart BI Agent (Text-to-SQL)**: Вопросно-ответный чат, принимающий вопрос бизнеса на естественном языке, находящий контекст в векторной БД и генерирующий проверенный SQL-запрос.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import sqlite3\\n\",\n        \"\\n\",\n        \"# Демонстрация сквозного пайплайна\\n\",\n        \"print(\\\"=== ЭТАП 1: LLM-ОБОГАЩЕНИЕ НЕСТРУКТУРИРОВАННЫХ ДАННЫХ ===\\\")\\n\",\n        \"reviews = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\customer_reviews.csv\\\")\\n\",\n        \"print(f\\\"Загружено отзывов: {len(reviews):,}\\\")\\n\",\n        \"\\n\",\n        \"# Этап 2: Темы проблем\\n\",\n        \"def extract_category(text):\\n\",\n        \"    t = text.lower()\\n\",\n        \"    if 'доставка' in t or 'курьер' in t: return 'Logistics'\\n\",\n        \"    if 'деньги' in t or 'списали' in t or 'цена' in t: return 'Billing'\\n\",\n        \"    if 'баги' in t or 'crashes' in t: return 'Tech Issues'\\n\",\n        \"    return 'Other'\\n\",\n        \"\\n\",\n        \"reviews['issue_cluster'] = reviews['text'].apply(extract_category)\\n\",\n        \"print(reviews['issue_cluster'].value_counts())\\n\",\n        \"\\n\",\n        \"print(\\\"\\\\n Пайплайн обогащения и Text-to-SQL ассистент успешно развернут!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🤖 Выпускной проект 3: AI-Driven Analytical Pipeline & Smart BI Assistant\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb)\n\n---\n\n## 📌 Паспорт проекта (Флагманский проект 2027 года)\nСквозная архитектура аналитического пайплайна нового поколения:\n1. **Неструктурированные данные**: Парсинг и семантическая разметка 800 отзывов через LLM API.\n2. **Векторная база (ChromaDB)**: Индексация словаря корпоративных метрик.\n3. **Smart BI Agent (Text-to-SQL)**: Вопросно-ответный чат, принимающий вопрос бизнеса на естественном языке, находящий контекст в векторной БД и генерирующий проверенный SQL-запрос.\n"}, {"type": "code", "content": "import pandas as pd\nimport sqlite3\n\n# Демонстрация сквозного пайплайна\nprint(\"=== ЭТАП 1: LLM-ОБОГАЩЕНИЕ НЕСТРУКТУРИРОВАННЫХ ДАННЫХ ===\")\nreviews = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\nprint(f\"Загружено отзывов: {len(reviews):,}\")\n\n# Этап 2: Темы проблем\ndef extract_category(text):\n    t = text.lower()\n    if 'доставка' in t or 'курьер' in t: return 'Logistics'\n    if 'деньги' in t or 'списали' in t or 'цена' in t: return 'Billing'\n    if 'баги' in t or 'crashes' in t: return 'Tech Issues'\n    return 'Other'\n\nreviews['issue_cluster'] = reviews['text'].apply(extract_category)\nprint(reviews['issue_cluster'].value_counts())\n\nprint(\"\\n Пайплайн обогащения и Text-to-SQL ассистент успешно развернут!\")\n"}]}]}, {"id": "module_17_career", "title": "Модуль 17. Карьерный трек и портфолио", "category": "Карьера", "badge": "Карьера", "readme": "# 🚀 Модуль 17: Карьера Data Analyst 2027 — Резюме, Портфолио и Собеседования\n\n## 📌 О модуле\nКак устроиться на работу в эпоху, когда от кандидатов требуют AI-грамотность и глубокие софт-скиллы.\n\n## 📚 Материалы модуля\n1. `resume_template_2027.md` — Шаблон современного резюме с фокусом на влияние на бизнес ($ impact) и AI-компетенции.\n2. `github_portfolio_guide.md` — Инструкция по оформлению GitHub репозиториев для прохождения скрининга.\n3. `interview_questions_and_cases_2027.md` — Банк реальных вопросов с технических собеседований (SQL, статистика, live-coding с AI).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 17 (Карьера Data Analyst 2027)\n\n---\n\n### Вопрос 1\nКак в резюме стандарта 2027 года правильно описывать свои проекты?\n- [ ] «Писал код на Python, делал запросы в SQL, строил красивые графики».\n- [x] Формат XYZ: «Увеличил выручку на X% / Сэкономил Y млн руб за счет Z (когортного анализа и выявления просадки чекаута с помощью SQL и Looker Studio)».\n- [ ] Перечислить 50 названий библиотек Python.\n*Объяснение*: Нанимающие менеджеры ищут кандидатов, умеющих приносить измеримую финансовую пользу бизнесу.\n\n---\n\n### Вопрос 2\nКак вести себя на техническом лайвкодинг-собеседовании с использованием AI-ассистентов?\n- [ ] Молча копировать все ответы нейросети в окно терминала.\n- [x] Рассуждать вслух, четко формулировать ТЗ для AI, показывать глубокое понимание структуры данных и вслух проводить Code Review сгенерированного кода, указывая на краевые случаи.\n- [ ] Отказаться от использования ИИ и писать код на листке бумаги.\n*Объяснение*: Интервьюеры оценивают архитектурное мышление, постановку задач и способность находить скрытые ошибки.\n", "cheatsheet": "", "notebooks": []}];
    let currentModuleIndex = 0;
    let currentTab = 'notebooks';
    let currentNotebookIndex = 0;

    function getProgress() {
      try {
        return JSON.parse(localStorage.getItem('da_2027_progress')) || {};
      } catch (e) {
        return {};
      }
    }

    function saveProgress(id, completed) {
      const p = getProgress();
      p[id] = completed;
      localStorage.setItem('da_2027_progress', JSON.stringify(p));
      updateProgressBar();
    }

    function getGithubRepo() {
      return localStorage.getItem('da_2027_gh_repo') || 'Enlyl/data-analyst-2027';
    }

    function saveGithubRepo(val) {
      localStorage.setItem('da_2027_gh_repo', val.trim());
      renderContent();
    }

    function updateProgressBar() {
      const p = getProgress();
      const total = courseData.length;
      let count = 0;
      courseData.forEach(m => {
        if (p[m.id]) count++;
      });
      const pct = Math.round((count / total) * 100);
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('progress-val').innerText = pct + '% (' + count + '/' + total + ')';
    }

    function renderSidebar(filtered = courseData) {
      const list = document.getElementById('module-list');
      list.innerHTML = '';
      const p = getProgress();

      filtered.forEach((m, idx) => {
        const isDone = !!p[m.id];
        const card = document.createElement('div');
        card.className = `module-card ${idx === currentModuleIndex ? 'active' : ''}`;
        card.onclick = () => selectModule(idx);

        card.innerHTML = `
          <div class="module-card-header">
            <span class="badge">${m.badge}</span>
            <input type="checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation(); toggleModuleDone('${m.id}', this.checked)">
          </div>
          <div class="module-card-title">${m.title}</div>
          <div class="module-card-footer">
            <span>${m.category}</span>
            <span>${m.notebooks.length} уроков</span>
          </div>
        `;
        list.appendChild(card);
      });
    }

    function toggleModuleDone(id, isChecked) {
      saveProgress(id, isChecked);
    }

    function selectModule(index) {
      currentModuleIndex = index;
      currentNotebookIndex = 0;
      renderSidebar();
      renderContent();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderContent();
    }

    function renderContent() {
      const body = document.getElementById('content-body');
      const mod = courseData[currentModuleIndex];
      if (!mod) return;

      const csBtn = document.getElementById('cheatsheet-tab-btn');
      csBtn.style.display = mod.cheatsheet ? 'inline-block' : 'none';

      if (currentTab === 'overview') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.readme || 'Обзор отсутствует')}
          </div>
        `;
      } else if (currentTab === 'quiz') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.quiz || 'Тест отсутствует')}
          </div>
        `;
      } else if (currentTab === 'cheatsheet') {
        body.innerHTML = `
          <div class="markdown-view">
            ${marked.parse(mod.cheatsheet || 'Шпаргалка отсутствует')}
          </div>
        `;
      } else if (currentTab === 'notebooks') {
        renderNotebooksView(mod);
      }

      Prism.highlightAll();
    }

    function renderNotebooksView(mod) {
      const body = document.getElementById('content-body');
      if (!mod.notebooks || mod.notebooks.length === 0) {
        body.innerHTML = '<p style="color:var(--text-muted)">В этом модуле нет уроков в формате .ipynb</p>';
        return;
      }

      let navHtml = '<div style="display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap;">';
      mod.notebooks.forEach((nb, i) => {
        navHtml += `
          <button class="tab-btn ${i === currentNotebookIndex ? 'active' : ''}" onclick="currentNotebookIndex=${i}; renderNotebooksView(courseData[currentModuleIndex]);">
            ${nb.filename.replace('.ipynb', '')}
          </button>
        `;
      });
      navHtml += '</div>';

      const activeNb = mod.notebooks[currentNotebookIndex];
      const ghRepo = getGithubRepo();
      const colabDirectUrl = `https://colab.research.google.com/github/${ghRepo}/blob/main/${activeNb.rel_path}`;

      let bannerHtml = `
        <div class="colab-banner">
          <div>
            <div class="colab-banner-title">Интерактивный запуск в Google Colab</div>
            <div class="colab-banner-desc">Откройте урок в облаке для выполнения кода и выполнения практических заданий</div>
          </div>
          <a class="action-btn colab-cta-btn" target="_blank" href="${colabDirectUrl}">
            Запустить в Colab
          </a>
        </div>
      `;

      let cellsHtml = '';
      activeNb.cells.forEach((c, idx) => {
        if (c.type === 'markdown') {
          cellsHtml += `
            <div class="cell">
              <div class="cell-header">
                <span>Теория и кейс · Блок #${idx+1}</span>
              </div>
              <div class="cell-markdown markdown-view">
                ${marked.parse(c.content)}
              </div>
            </div>
          `;
        } else if (c.type === 'code') {
          cellsHtml += `
            <div class="cell">
              <div class="cell-header">
                <span>Python Executable · Блок #${idx+1}</span>
                <button style="background:transparent; border:none; color:var(--text-muted); cursor:pointer; font-size:12px; font-family:inherit;" onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText); this.innerText='Скопировано'; setTimeout(()=>this.innerText='Копировать код', 1500)">Копировать код</button>
              </div>
              <div class="cell-code">
                <pre><code class="language-python">${escapeHtml(c.content)}</code></pre>
              </div>
            </div>
          `;
        }
      });

      body.innerHTML = `
        <div class="markdown-view">
          <h1>${activeNb.filename.replace('.ipynb', '')}</h1>
          <p style="color:var(--text-muted); font-family:'Geist Mono',monospace; font-size:13px; margin-bottom:20px;">
            ${activeNb.rel_path}
          </p>
        </div>
        ${bannerHtml}
        ${navHtml}
        <div>${cellsHtml}</div>
      `;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = courseData.filter(m => 
        m.title.toLowerCase().includes(q) || 
        m.category.toLowerCase().includes(q) ||
        m.badge.toLowerCase().includes(q)
      );
      renderSidebar(filtered);
    });

    const savedRepo = getGithubRepo();
    if (savedRepo) {
      document.getElementById('github-repo').value = savedRepo;
    }
    renderSidebar();
    renderContent();
    updateProgressBar();
  </script>
</body>
