<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analyst 2027</title>

  <!-- Foundation (ZURB) Design System Typography: Helvetica Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Favicon -->

  <!-- Marked + Prism -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <style>
    /* ===== FOUNDATION (ZURB) DESIGN SYSTEM TOKENS ===== */
    :root {
      /* Foundation Palette */
      --foundation-primary: #1779ba;
      --foundation-primary-hover: #126195;
      --foundation-secondary: #767676;
      --foundation-success: #3adb76;
      --foundation-warning: #ffae00;
      --foundation-alert: #cc4b37;
      --foundation-black: #0a0a0a;
      --foundation-white: #fefefe;
      --foundation-medium-gray: #cacaca;
      --foundation-light-gray: #f4f4f4;
      --foundation-subtle-blue: #eef6fb;

      /* Semantic Mappings */
      --bg-base: #f4f4f4;
      --bg-surface: #fefefe;
      --bg-card: #fefefe;
      --bg-card-hover: #f0f7fb;
      --bg-deep: #e6e6e6;
      --border: #cacaca;
      --border-focus: #1779ba;
      --text-main: #0a0a0a;
      --text-secondary: #333333;
      --text-muted: #767676;
      --text-dim: #8a8a8a;
      --accent: #1779ba;
      --accent-hover: #126195;
      --success: #3adb76;
      --error: #cc4b37;
      --warning: #ffae00;
      --code-bg: #1e1e1e;
      --code-text: #fefefe;

      /* Typography */
      --font-body: 'Helvetica Neue', Helvetica, Roboto, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;

      /* Type Scale (Foundation Spec) */
      --text-h1: 48px;
      --line-h1: 62px;
      --text-h2: 40px;
      --line-h2: 52px;
      --text-h3: 31px;
      --line-h3: 40px;
      --text-body: 16px;
      --line-body: 24px;

      /* Spacing rhythm */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;

      /* Radius: Foundation default is strictly 3px */
      --radius-default: 3px;
      --radius-pill: 3px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ===== RESET ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--foundation-primary);
    }

    .brand svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* Progress */
    .progress-wrap { margin-top: 16px; }
    .progress-bar {
      background: var(--bg-deep);
      border-radius: var(--radius-default);
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--foundation-primary);
      height: 100%;
      width: 0%;
      transition: width 400ms var(--ease);
      border-radius: var(--radius-default);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Search */
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .search-input {
      width: 100%;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 8px 12px 8px 36px;
      font-size: 14px;
      color: var(--text-main);
      font-family: var(--font-body);
      outline: none;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .search-input:focus {
      border-color: var(--foundation-primary);
      box-shadow: 0 0 4px rgba(23, 121, 186, 0.35);
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    /* Module list */
    .module-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-surface);
    }
    .module-list::-webkit-scrollbar { width: 5px; }
    .module-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cat-group { margin-bottom: 4px; }
    .cat-label {
      padding: 12px 20px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--foundation-secondary);
    }

    .mod-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 150ms var(--ease);
      border-left: 3px solid transparent;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .mod-item:hover {
      background: var(--bg-card-hover);
    }
    .mod-item.active {
      background: var(--foundation-subtle-blue);
      border-left-color: var(--foundation-primary);
      color: var(--foundation-primary);
      font-weight: 600;
    }
    .mod-item .mod-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .mod-item .mod-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-default);
      background: var(--bg-deep);
      color: var(--text-secondary);
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid #d4d4d4;
    }
    .mod-item.active .mod-badge {
      background: #dbebf6;
      color: var(--foundation-primary);
      border-color: #bcd9ee;
    }
    .mod-item .check-done {
      color: var(--foundation-success);
      font-size: 14px;
      margin-left: 4px;
      font-weight: bold;
    }

    /* ===== MAIN CONTENT ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Top bar (Foundation Top-Bar Style) */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      min-height: 56px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.04);
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--foundation-black);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      padding: 0 32px;
    }
    .tab {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
      white-space: nowrap;
    }
    .tab:hover { color: var(--foundation-primary); }
    .tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
    }

    /* Content area */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-base);
    }
    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== HERO (Foundation Style) ===== */
    .hero {
      text-align: center;
      padding: 64px 32px 48px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: var(--radius-default);
      border: 1px solid var(--border);
      background: var(--foundation-subtle-blue);
      font-size: 12px;
      font-weight: 700;
      color: var(--foundation-primary);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: var(--text-h1);
      line-height: var(--line-h1);
      font-weight: 700;
      max-width: 720px;
      margin: 0 auto 20px;
      color: var(--foundation-black);
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: 18px;
      line-height: 28px;
      color: var(--foundation-secondary);
      max-width: 680px;
      margin: 0 auto 36px;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .hero-stat {
      text-align: center;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 16px 28px;
      min-width: 160px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.05);
    }
    .hero-stat-num {
      font-size: var(--text-h2);
      line-height: var(--line-h2);
      font-weight: 700;
      color: var(--foundation-primary);
      font-family: var(--font-body);
    }
    .hero-stat-label {
      font-size: 13px;
      line-height: 18px;
      color: var(--foundation-secondary);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ===== NOTEBOOK LESSON VIEW ===== */
    .lesson-header {
      margin-bottom: 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .lesson-header h2 {
      font-size: var(--text-h3);
      line-height: var(--line-h3);
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--foundation-black);
    }
    .lesson-header .lesson-desc {
      font-size: 16px;
      line-height: 24px;
      color: var(--foundation-secondary);
    }

    /* Foundation Button */
    .colab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--foundation-primary);
      border: 1px solid var(--foundation-primary-hover);
      border-radius: var(--radius-default);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      text-decoration: none;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.1);
    }
    .colab-btn:hover {
      background: var(--foundation-primary-hover);
      border-color: #0e4c75;
      color: #ffffff;
    }
    .colab-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Notebook sub-tabs */
    .nb-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nb-tab {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      border-radius: var(--radius-default) var(--radius-default) 0 0;
      transition: color 150ms var(--ease), background 150ms var(--ease);
      font-family: var(--font-body);
      white-space: nowrap;
    }
    .nb-tab:hover {
      color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }
    .nb-tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }

    /* Cell rendering */
    .cell {
      margin-bottom: 16px;
      border-radius: var(--radius-default);
      overflow: hidden;
    }
    .cell-md {
      padding: 20px 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      font-size: 16px;
      line-height: 24px;
      color: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.03);
    }
    .cell-md h1, .cell-md h2, .cell-md h3, .cell-md h4 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .cell-md h1 { font-size: 30px; line-height: 38px; }
    .cell-md h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .cell-md h3 { font-size: 20px; line-height: 28px; }
    .cell-md h4 { font-size: 17px; line-height: 24px; }
    .cell-md p { margin-bottom: 12px; }
    .cell-md ul, .cell-md ol { padding-left: 24px; margin-bottom: 12px; }
    .cell-md li { margin-bottom: 4px; }
    .cell-md code {
      background: var(--bg-deep);
      color: var(--foundation-black);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .cell-md pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 12px;
      border: 1px solid #333333;
    }
    .cell-md pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .cell-md blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .cell-md table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background: var(--foundation-white);
    }
    .cell-md th, .cell-md td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
    }
    .cell-md th {
      background: var(--bg-deep);
      font-weight: 700;
      color: var(--foundation-black);
    }
    .cell-md strong { color: var(--foundation-black); font-weight: 700; }
    .cell-md a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .cell-md a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }

    .cell-code {
      position: relative;
      background: var(--code-bg);
      border: 1px solid #333333;
      border-radius: var(--radius-default);
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.12);
    }
    .cell-code-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #999999;
      border-bottom: 1px solid #333333;
      background: #181818;
      font-family: var(--font-mono);
      border-radius: var(--radius-default) var(--radius-default) 0 0;
    }
    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #444444;
      border-radius: var(--radius-default);
      color: #cccccc;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }
    .copy-btn:hover { color: #ffffff; background: #3a3a3a; border-color: #666666; }
    .cell-code pre {
      padding: 16px;
      overflow-x: auto;
      margin: 0;
      font-size: 14px;
      line-height: 22px;
      color: #fefefe;
    }
    .cell-code code {
      font-family: var(--font-mono);
    }

    /* ===== README / QUIZ / CHEATSHEET views ===== */
    .md-view {
      max-width: 860px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 28px 32px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .md-view h1, .md-view h2, .md-view h3 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .md-view h1 { font-size: 30px; line-height: 38px; }
    .md-view h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md-view h3 { font-size: 20px; line-height: 28px; }
    .md-view p { margin-bottom: 12px; color: var(--text-secondary); font-size: 16px; line-height: 24px; }
    .md-view ul, .md-view ol { padding-left: 24px; margin-bottom: 12px; color: var(--text-secondary); }
    .md-view li { margin-bottom: 6px; font-size: 16px; line-height: 24px; }
    .md-view code {
      background: var(--bg-deep);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .md-view pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
      border: 1px solid #333333;
    }
    .md-view pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .md-view blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .md-view strong { color: var(--foundation-black); font-weight: 700; }
    .md-view a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .md-view a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }
    .md-view table { width: 100%; border-collapse: collapse; margin: 14px 0; }
    .md-view th, .md-view td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
    .md-view th { background: var(--bg-deep); font-weight: 700; color: var(--foundation-black); }
    .md-view hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ===== QUIZ INTERACTIVE ===== */
    .quiz-question {
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .quiz-question h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--foundation-black);
    }
    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-default);
      cursor: pointer;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: var(--foundation-white);
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      border-color: var(--foundation-primary);

const GITHUB_BASE = "https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main";
const COURSE = [{"id": "module_00_onboarding", "title": "Модуль 0. Онбординг и мышление аналитика", "cat": "Фундамент", "badge": "Старт", "icon": "", "desc": "Инструменты, майндсет AI-эры, постановка ТЗ и первая тетрадь в Colab.", "readme": "# 🚀 Модуль 0: Онбординг и мышление Data Analyst 2027\n\n## 📌 О модуле\nДобро пожаловать в профессию! Аналитика данных образца 2027 года фундаментально отличается от того, что было 5 лет назад. Рутинный синтаксис SQL и Python берет на себя искусственный интеллект, а от аналитика требуются **Problem Framing**, архитектурное понимание данных, формулирование ТЗ для AI и глубокое бизнес-видение.\n\n## 🎯 Learning Outcomes (Таксономия Блума)\n- **Remember**: Терминология (Data Analyst vs Data Scientist, CRISP-DM, EDA, KPI, Pipeline).\n- **Understand**: Отличия роли аналитика до и после AI-революции; архитектуру современного стека данных.\n- **Apply**: Развертывание рабочего окружения в Google Colab, подключение AI-ассистентов, создание первого репозитория на GitHub.\n- **Analyze**: Декомпозиция сырой проблемы бизнеса в систему метрик и аналитических задач.\n\n## 📚 Содержание уроков\n1. `lesson_01_role_data_analyst_2027.ipynb` — Профессия аналитика в эпоху AI: ландшафт рынка, карта компетенций, день из жизни.\n2. `lesson_02_environment_setup_colab_ai.ipynb` — Среда разработки: Google Colab, VS Code, Git, настройка Copilot/Cursor/Claude.\n3. `lesson_03_analytical_thinking_crisp_dm.ipynb` — Аналитическое мышление: методология CRISP-DM, перевод бизнес-боли в метрики.\n4. `quiz.md` — Тест для самопроверки (Active Recall).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 0 (Онбординг & Аналитическое мышление)\n\n---\n\n### Вопрос 1\nВ чем заключается фундаментальное отличие роли Data Analyst 2027 года от роли 2020 года?\n- [ ] В 2027 году аналитики больше не используют базы данных и SQL.\n- [x] В 2027 году рутинное написание кода автоматизировано AI, а фокус сместился на Problem Framing, постановку ТЗ для LLM, фактчекинг и Data Storytelling.\n- [ ] В 2027 году аналитик обязан обучать собственные нейросети на суперкомпьютере.\n*Объяснение*: Рутинный синтаксис генерируют LLM. Главная ценность человека — перевод бизнес-проблем в метрики, критический аудит кода и коммуникация решений с топ-менеджментом.\n\n---\n\n### Вопрос 2\nРуководство компании жалуется: *«В этом месяце выручка упала на 10%, срочно удвойте расходы на маркетинг»*. Каково первое действие профессионального аналитика?\n- [ ] Сразу согласовать бюджет и запустить рекламу.\n- [x] Декомпозировать выручку на метрики Traffic * CR * AOV, сегментировать данные по платформам/каналам и локализовать причину падения.\n- [ ] Построить круговую диаграмму продаж.\n*Объяснение*: Если просадка вызвана техническим багом в чекауте или падением среднего чека, заливка нового рекламного трафика лишь сожжет деньги компании без роста продаж.\n\n---\n\n### Вопрос 3\nКакой этап методологии CRISP-DM является первым и самым важным для успеха проекта?\n- [ ] Data Preparation (Очистка данных).\n- [ ] Modeling (Построение моделей).\n- [x] Business Understanding (Понимание бизнес-контекста и целей).\n*Объяснение*: Не поняв экономический смысл задачи и решение, которое будет приниматься, аналитик рискует построить идеальный технический отчет, который окажется бесполезен бизнесу.\n\n---\n\n### Вопрос 4\nВ чем главная опасность слепого доверия AI-ассистентам при формулировании аналитических выводов?\n- [ ] Модели работают слишком медленно.\n- [x] AI может выдать правдоподобно звучащую, но математически ложную семантическую галлюцинацию (неверный знаменатель дроби, игнорирование фильтра).\n- [ ] AI требует слишком много электроэнергии.\n*Объяснение*: Аналитик несет персональную ответственность перед бизнесом; любые расчеты AI требуют валидации инвариантов.\n\n---\n\n### Вопрос 5\nЧто такое 'Business Understanding' в цикле анализа данных?\n- [ ] Заучивание имен топ-менеджеров компании.\n- [x] Понимание бизнес-модели компании, ключевых метрик выручки и того, какое конкретно управленческое решение будет принято по результатам исследования.\n- [ ] Установка офисных программ.\n*Объяснение*: Без понимания сути бизнеса даже идеальный с технической точки зрения дашборд окажется бесполезным.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_what_is_data_analyst.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 0. Урок 1. Кто такой Data Analyst в эпоху AI: роли, грейды и скиллсет 2027\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ 2027 году рутинное написание типовых запросов и форматирование таблиц полностью автоматизировано большими языковыми моделями.\nРоль аналитика трансформировалась: от простого «экстрактора цифр» к **AI-нативному бизнес-партнеру (AI Analytics Engineer)**.\nАналитик 2027 года:\n1. Понимает бизнес-модель и формулирует проблему до строчки кода\n2. Управляет агентскими AI-инструментами\n3. Проводит статистически безупречные эксперименты и A/B-тесты\n4. Превращает разрозненные терабайты сырых логов в решения топ-менеджмента"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Сравнение профилей компетенций\nСравним три архетипа аналитиков на рынке труда:\n- **Classic BI Analyst:** базовый SQL, дашборды, ручная отчетность\n- **Product Analyst:** A/B тесты, когортный анализ, воронки\n- **AI Analytics Engineer (2027):** симбиоз глубокой статистики, dbt, RAG-ассистентов и продуктовой инженерии"}, {"type": "code", "content": "# Демонстрация: Матрица компетенций грейдов аналитиков\nskills_matrix = pd.DataFrame({\n    'Навык': ['Бизнес-мышление (Problem Framing)', 'SQL & DWH Моделирование', 'Python & Векторизация', 'Статистика & A/B тесты', 'AI & Prompt Engineering', 'C-Level Презентации'],\n    'Classic BI (2020)': [60, 70, 30, 40, 10, 50],\n    'Product Analyst': [80, 85, 70, 90, 40, 75],\n    'AI Analytics Engineer (2027)': [95, 95, 85, 95, 95, 90]\n})\ndisplay(skills_matrix)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Радар компетенций Data Analyst 2027\nПостроим полярную диаграмму (Radar Chart), визуализирующую качественный скачок в профиле компетенций современного аналитика данных."}, {"type": "code", "content": "# Построение радарной диаграммы скиллов\ncategories = list(skills_matrix['Навык'])\nN = len(categories)\nangles = [n / float(N) * 2 * np.pi for n in range(N)]\nangles += angles[:1]\n\nfig, ax = plt.subplots(figsize=(8, 7), subplot_kw=dict(polar=True), dpi=110)\n\ndef add_radar_trace(data, color, label, lw=2):\n    vals = list(data)\n    vals += vals[:1]\n    ax.plot(angles, vals, color=color, linewidth=lw, label=label)\n    ax.fill(angles, vals, color=color, alpha=0.15)\n\nadd_radar_trace(skills_matrix['Classic BI (2020)'], SECONDARY, 'Classic BI (2020)', lw=1.5)\nadd_radar_trace(skills_matrix['Product Analyst'], WARNING, 'Product Analyst', lw=2)\nadd_radar_trace(skills_matrix['AI Analytics Engineer (2027)'], PRIMARY, 'AI Analytics Engineer (2027)', lw=2.5)\n\nax.set_theta_offset(np.pi / 2)\nax.set_theta_direction(-1)\nax.set_xticks(angles[:-1])\nax.set_xticklabels(categories, fontsize=9, fontweight='bold')\nax.set_ylim(0, 100)\nax.set_title(\"Эволюция профиля компетенций аналитика данных (2020 -> 2027)\", fontsize=12, fontweight='bold', pad=20)\nax.legend(loc='upper right', bbox_to_anchor=(1.25, 1.1), frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет суммарного индекса компетенций\nВычислите средний балл компетенций для профиля `AI Analytics Engineer (2027)` и сравните его с `Classic BI (2020)`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nscore_2027 = skills_matrix['AI Analytics Engineer (2027)'].mean()\nscore_2020 = skills_matrix['Classic BI (2020)'].mean()\ndiff = score_2027 - score_2020\n\nprint(f\"Средний балл AI Analyst 2027: {score_2027:.1f} / 100\")\nprint(f\"Превышение над классическим профилем: +{diff:.1f} пунктов\")\n\nassert score_2027 > 90, \"Балл профиля 2027 года должен превышать 90\"\nprint(\"✅ Тест успешно пройден: профиль аналитика нового поколения подтвержден цифрами!\")"}, {"type": "markdown", "content": "### 💡 Стратегия карьеры\nAI не заменит аналитика. Но аналитик, виртуозно использующий AI и глубокую статистику, неизбежно вытеснит того, кто работает по шаблонам прошлого десятилетия."}]}, {"filename": "lesson_02_environment_setup_colab_ai.ipynb", "rel_path": "course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 0. Урок 2. Настройка продуктовой среды: Google Colab, Cursor IDE и AI-ассистенты\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСкорость аналитика напрямую зависит от эргономики его рабочего места.\nВ индустрии 2027 года стандарт рабочего контура включает:\n1. **Google Colab / JupyterLab** — для прототипирования, исследовательского EDA и шеринга результатов\n2. **Cursor / VS Code с AI-агентами** — для разработки dbt-пайплайнов, написания SQL-скриптов и оркестрации\n3. **Облачные хранилища** — подключение к витринам данных напрямую через безопасные сервисные ключи"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Архитектура современного стека аналитика\nСравним скорость решения типовых задач при традиционном ручном кодинге и в связке с AI-ассистентом."}, {"type": "code", "content": "# Демонстрация: Экономия времени на типовых этапах исследования\nworkflow_time = pd.DataFrame({\n    'Этап пайплайна': ['1. Исследование схемы БД', '2. Написание сложного SQL', '3. Очистка и предобработка', '4. Оформление графиков', '5. Подготовка выводов C-Level'],\n    'Ручной подход (часы)': [3.0, 5.0, 4.0, 2.5, 3.5],\n    'Связка с AI-ассистентом (часы)': [0.5, 1.0, 0.8, 0.5, 0.7]\n})\nworkflow_time['Экономия (раз)'] = workflow_time['Ручной подход (часы)'] / workflow_time['Связка с AI-ассистентом (часы)']\ndisplay(workflow_time)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Сокращение Time-to-Insight\nНаглядно продемонстрируем, как AI-инструменты сокращают общее время от бизнес-вопроса до готового решения в 4.5 раза."}, {"type": "code", "content": "# Построение графика экономии времени\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\n\ny = np.arange(len(workflow_time))\nheight = 0.35\n\nrects1 = ax.barh(y - height/2, workflow_time['Ручной подход (часы)'], height, \n                 label='Традиционный подход (Ручной)', color=SECONDARY, edgecolor='#333333', linewidth=0.6)\nrects2 = ax.barh(y + height/2, workflow_time['Связка с AI-ассистентом (часы)'], height, \n                 label='AI-First аналитик (Cursor + Claude)', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax.set_yticks(y)\nax.set_yticklabels(workflow_time['Этап пайплайна'], fontsize=10)\nax.set_xlabel(\"Затраченное время (часы)\", fontsize=11)\nax.set_title(\"Time-to-Insight: Затраты времени по этапам аналитического исследования\", fontsize=12, fontweight='bold', pad=15)\nax.legend(frameon=True, facecolor='#ffffff')\n\nfor r in rects1:\n    w = r.get_width()\n    ax.annotate(f\"{w:.1f} ч\", xy=(w, r.get_y() + r.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold')\n\nfor r in rects2:\n    w = r.get_width()\n    ax.annotate(f\"{w:.1f} ч\", xy=(w, r.get_y() + r.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=9, fontweight='bold', color='#1b7e3b')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет совокупного выигрыша по времени\nПосчитайте общее количество сэкономленных часов за спринт при переходе на AI-First инструментарий."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_manual = workflow_time['Ручной подход (часы)'].sum()\ntotal_ai = workflow_time['Связка с AI-ассистентом (часы)'].sum()\nsaved_hours = total_manual - total_ai\n\nprint(f\"Суммарное время ручного подхода: {total_manual:.1f} ч\")\nprint(f\"Суммарное время AI подхода: {total_ai:.1f} ч\")\nprint(f\"Чистая экономия времени: {saved_hours:.1f} часов за спринт!\")\n\nassert saved_hours > 10, \"Экономия должна превышать 10 часов\"\nprint(\"✅ Тест успешно пройден: производительность подтверждена метриками!\")"}, {"type": "markdown", "content": "### 💡 Инженерный совет по AI-окружению\nИспользуйте сочетание клавиш `Ctrl+K` в Cursor для генерации фрагментов кода прямо в редакторе и настройте `.cursorrules` для автоинъекции корпоративного код-стайла."}]}, {"filename": "lesson_03_analytical_thinking_crisp_dm.ipynb", "rel_path": "course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 0. Урок 3. Аналитическое мышление и методология CRISP-DM в реальных проектах\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАнализ данных без методологии превращается в хаотичное исследование таблиц.\nМировой индустриальный стандарт **CRISP-DM (Cross-Industry Standard Process for Data Mining)** описывает жизненный цикл аналитического проекта:\n1. **Business Understanding:** понимание бизнес-цели и финансовых ограничений\n2. **Data Understanding:** первичная разведка данных, оценка полноты\n3. **Data Preparation:** очистка, валидация, создание витрин\n4. **Modeling / Analysis:** расчет статистических тестов, сегментация\n5. **Evaluation:** проверка гипотез и сопоставление с бизнес-целью\n6. **Deployment:** внедрение в дашборды, презентация стейкхолдерам"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Итерационный цикл CRISP-DM\nCRISP-DM — это не водопадная модель (waterfall), а **итеративный цикл**.\nЕсли на этапе Evaluation выясняется, что модель не отвечает бизнес-требованиям, аналитик возвращается на этап Business или Data Understanding."}, {"type": "code", "content": "# Демонстрация: Оценка распределения ресурсов проекта по этапам CRISP-DM\ncrisp_phases = pd.DataFrame({\n    'Фаза CRISP-DM': ['1. Business Understanding', '2. Data Understanding', '3. Data Preparation', '4. Modeling & Analytics', '5. Evaluation', '6. Deployment'],\n    'Доля времени (%)': [15, 20, 35, 15, 10, 5],\n    'Критический артефакт': ['Бизнес-бриф и метрики успеха', 'EDA отчет и словарь данных', 'Очищенная dbt-витрина', 'Статистические выводы / модель', 'A/B отчет и оценка эффекта', 'Интерактивный BI дашборд']\n})\ndisplay(crisp_phases)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Цикл CRISP-DM\nПостроим циклическую диаграмму методологии CRISP-DM с отображением обратных связей."}, {"type": "code", "content": "# Визуализация циклического процесса CRISP-DM\nfig, ax = plt.subplots(figsize=(10, 6), dpi=110)\n\ncolors_crisp = [PRIMARY, PRIMARY, ALERT, WARNING, SUCCESS, PRIMARY]\nbars = ax.barh(crisp_phases['Фаза CRISP-DM'], crisp_phases['Доля времени (%)'], \n               color=colors_crisp, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Распределение трудозатрат аналитика по этапам CRISP-DM (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Доля времени в проекте (%)\", fontsize=11)\nax.set_xlim(0, 45)\n\nfor b in bars:\n    w = b.get_width()\n    ax.annotate(f\"{w}%\", xy=(w, b.get_y() + b.get_height()/2), xytext=(5, 0),\n                textcoords=\"offset points\", ha='left', va='center', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля работы с данными (Data Prep + Understanding)\nПосчитайте совокупную долю времени, приходящуюся на этапы разведки и подготовки данных."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndata_work_share = crisp_phases.loc[crisp_phases['Фаза CRISP-DM'].isin(['2. Data Understanding', '3. Data Preparation']), 'Доля времени (%)'].sum()\nprint(f\"Совокупная доля работы с данными: {data_work_share}%\")\n\nassert data_work_share >= 50, \"Работа с данными должна занимать не менее 50% времени\"\nprint(\"✅ Тест успешно пройден: правило '80% времени уходит на данные' подтверждено!\")"}, {"type": "markdown", "content": "### 💡 Золотое правило CRISP-DM\nНикогда не переходите к этапу моделирования, пока не согласованы критерии успеха на этапе Business Understanding. Если стейкхолдер не знает, как измерить успех, проект обречен."}]}]}, {"id": "module_01_excel", "title": "Модуль 1. Excel и Google Sheets", "cat": "Хард база", "badge": "Таблицы", "icon": "", "desc": "ВПР, XLOOKUP, сводные таблицы, формулы массивов и аудит вычислений.", "readme": "# 📊 Модуль 1: Excel и Google Sheets — Фундамент работы с данными\n\n## 📌 О модуле\nExcel и Google Sheets остаются главным языком коммуникации бизнеса. Топ-менеджеры, финансисты и маркетологи думают таблицами. Аналитик обязан уметь быстро рассчитывать срезы, собирать сводные таблицы и формулировать промпты для генерации сложных формул в Copilot.\n\n## 🎯 Learning Outcomes\n- **Understand**: Структуру плоских таблиц (tidy data), принципы адресации ($A$1 vs A1).\n- **Apply**: Функции `SUMIFS`, `COUNTIFS`, `XLOOKUP`, `INDEX+MATCH`, вложенные условия.\n- **Analyze**: Сводные таблицы (Pivot Tables), вычисляемые поля, когортные группировки.\n- **Create**: Интерактивные отчеты с визуализацией и срезами (Slicers); формулы через AI Copilot.\n\n## 📚 Уроки\n1. `lesson_01_interface_basics_formatting.ipynb` — Интерфейс, горячие клавиши, типы данных, условное форматирование.\n2. `lesson_02_formulas_functions_xlookup.ipynb` — Библиотека формул: математика, логика, текст, даты, современный XLOOKUP.\n3. `lesson_03_pivot_tables_aggregations.ipynb` — Сводные таблицы: многоуровневая группировка, % от общего, срезы.\n4. `lesson_04_visualization_data_story.ipynb` — Построение диаграмм по стандартам Тафти (Tufte): устранение визуального шума.\n5. `lesson_05_ai_copilot_excel_formulas.ipynb` — Промпт-инжиниринг для формул Excel, генерация Google Apps Script, валидация.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Справочник главных формул.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 1 (Excel)\n\n### Вопрос 1\nВ чем ключевое преимущество `XLOOKUP` перед `VLOOKUP`?\n- [ ] XLOOKUP работает быстрее ровно в 10 раз\n- [x] Искомый столбец может находиться левее возвращаемого, формула не ломается при добавлении столбцов\n- [ ] XLOOKUP работает только с числами\n\n### Вопрос 2\nЧто произойдет при копировании формулы `=A$1 + 10` вниз на 5 строк?\n- [ ] Ссылка сместится на A6\n- [x] Номер строки зафиксирован знаком $, ссылка останется на ячейку A1\n- [ ] Выдаст ошибку #REF!\n\n### Вопрос 3\nПочему в профессиональных отчетах избегают 3D круговых диаграмм (Pie Charts)?\n- [ ] Они занимают слишком много памяти на компьютере\n- [x] Они искажают пропорции восприятия долей и перегружают внимание визуальным мусором\n- [ ] Их не поддерживает Excel\n\n---\n\n### Вопрос 4\nВ чем преимущество функции XLOOKUP (ПРОСМОТРX) перед классическим VLOOKUP (ВПР)?\n- [ ] XLOOKUP работает только с числами.\n- [x] XLOOKUP может искать влево, не ломается при вставке/удалении промежуточных колонок и имеет встроенную обработку ошибок (if_not_found).\n- [ ] VLOOKUP больше не поддерживается в Excel.\n*Объяснение*: XLOOKUP устойчив к структурным изменениям таблицы и более интуитивен по аргументам.\n\n---\n\n### Вопрос 5\nПочему при расчете среднего чека в сводной таблице опасно брать 'Среднее по столбцу Total'?\n- [ ] Excel округляет средние до целых чисел.\n- [x] Если в строках таблицы содержатся товарные позиции заказа (order items), а не уникальные чеки, расчет усреднит стоимость позиций, а не средний чек заказа.\n- [ ] Сводные таблицы не умеют вычислять среднее.\n*Объяснение*: Уровень детализации (гранулярность) таблицы определяет корректность агрегации.\n", "cheatsheet": "# 📋 Excel & Sheets Cheatsheet\n\n| Задача | Формула |\n|---|---|\n| Поиск значения | `=XLOOKUP(F2, A:A, C:C, \"Не найдено\")` |\n| Сумма с условием | `=SUMIFS(D:D, A:A, \"Completed\", B:B, \">=\"&DATE(2026,1,1))` |\n| Количество уникальных | `=COUNTA(UNIQUE(FILTER(B:B, A:A=\"Completed\")))` |\n| Безопасный расчет | `=IFERROR(A2 / B2, 0)` |\n| Склейка текста | `=TEXTJOIN(\" - \", TRUE, A2, B2)` |\n", "notebooks": [{"filename": "lesson_01_interface_basics_formatting.ipynb", "rel_path": "course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 1. Основы Excel: архитектура таблиц, форматирование и культура формул\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb)\n\n## 📌 Бизнес-контекст и методология\nExcel / Google Sheets остаются основным языком финансового моделирования и оперативной коммуникации в бизнесе.\nГлавный грех неопытного аналитика — создание «визуальной каши» (неоновые цвета, объединение ячеек `Merge & Center`, жестко зашитые константы в формулах).\nПрофессиональный финансовый отчет строится по принципам Foundation Design System: нейтральная сетка, сдержанные акценты, явное разделение входящих параметров (Inputs) и расчетных формул (Calculations)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Моделирование SaaS P&L отчета\nПостроим отчет о прибылях и убытках (P&L) SaaS компании с расчетом валовой маржи и EBITDA."}, {"type": "code", "content": "# Демонстрация: Моделирование P&L структуры в Pandas (аналог Excel)\npnl_data = pd.DataFrame({\n    'Статья P&L': ['1. Выручка (ARR)', '2. Себестоимость (COGS)', '3. Валовая прибыль (Gross Profit)', '4. Расходы на маркетинг (CAC)', '5. Расходы на R&D (Разработка)', '6. Операционная прибыль (EBITDA)'],\n    'Q1 ($k)': [1000, -250, 750, -350, -200, 200],\n    'Q2 ($k)': [1200, -280, 920, -390, -220, 310],\n    'Q3 ($k)': [1450, -320, 1130, -440, -240, 450],\n    'Q4 ($k)': [1750, -360, 1390, -500, -260, 630]\n})\ndisplay(pnl_data)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Динамика маржинальности P&L\nПостроим динамику роста выручки и расширения EBITDA маржи по кварталам."}, {"type": "code", "content": "# Построение 2-осевого финансового отчета\nquarters = ['Q1', 'Q2', 'Q3', 'Q4']\nrevenue = [1000, 1200, 1450, 1750]\nebitda = [200, 310, 450, 630]\nebitda_margin = [e / r * 100 for e, r in zip(ebitda, revenue)]\n\nfig, ax1 = plt.subplots(figsize=(10, 5), dpi=110)\n\nbars = ax1.bar(quarters, revenue, color=PRIMARY, width=0.45, label='Выручка ($k)', edgecolor='#333333', linewidth=0.6)\nax1.set_ylabel(\"Выручка ($ тыс.)\", color=PRIMARY, fontsize=11, fontweight='bold')\nax1.set_ylim(0, 2200)\n\nfor b in bars:\n    h = b.get_height()\n    ax1.annotate(f\"${h}k\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nax2 = ax1.twinx()\nline = ax2.plot(quarters, ebitda_margin, color=SUCCESS, marker='o', linewidth=2.5, markersize=8, label='EBITDA Margin %')\nax2.set_ylabel(\"Рентабельность по EBITDA (%)\", color='#1b7e3b', fontsize=11, fontweight='bold')\nax2.set_ylim(10, 45)\nax2.grid(False)\n\nfor i, txt in enumerate(ebitda_margin):\n    ax2.annotate(f\"{txt:.1f}%\", (quarters[i], txt), textcoords=\"offset points\", xytext=(0, 8), \n                 ha='center', fontweight='bold', color='#1b7e3b', fontsize=10)\n\nax1.set_title(\"Финансовая динамика SaaS: Рост выручки и рентабельности EBITDA\", fontsize=12, fontweight='bold', pad=15)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет совокупного годового ARR\nНайдите сумму выручки за все 4 квартала в `pnl_data`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntotal_annual_revenue = sum(revenue)\nprint(f\"Совокупная годовая выручка: ${total_annual_revenue:,.0f}k\")\n\nassert total_annual_revenue == 5400, \"Годовая выручка должна быть равна 5400k\"\nprint(\"✅ Тест успешно пройден: финансовые показатели сошлись!\")"}, {"type": "markdown", "content": "### 💡 Правило моделирования Fast\nФинансовые аналитики следуют стандарту FAST: Flexible, Appropriate, Structured, Transparent. Никогда не объединяйте ячейки (Merge cells) — это ломает автоматические формулы и сортировку."}]}, {"filename": "lesson_02_formulas_functions_xlookup.ipynb", "rel_path": "course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 2. Формулы и функции поиска: от устаревшего VLOOKUP к современному XLOOKUP\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСвязывание таблиц справочников — основа работы с данными в электронных таблицах.\nИсторическая функция `VLOOKUP` обладала фатальными недостатками:\n- Ломалась при добавлении новой колонки внутрь таблицы\n- Не умела искать справа налево\n- По умолчанию выполняла приблизительный поиск (True), приводя к тихим ошибкам\nСовременная функция **`XLOOKUP`** (а также связка `INDEX/MATCH`) полностью вытеснила VLOOKUP, обеспечив отказоустойчивость формул."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Сравнение производительности и надежности\nСмоделируем работу справочника клиентов и заказов с помощью векторного сопоставления."}, {"type": "code", "content": "# Демонстрация: Сопоставление таблиц через merge (эквивалент XLOOKUP)\norders = pd.DataFrame({\n    'order_id': [101, 102, 103, 104],\n    'customer_id': ['C1', 'C3', 'C2', 'C1'],\n    'amount': [250, 480, 150, 320]\n})\n\ncustomers = pd.DataFrame({\n    'customer_id': ['C1', 'C2', 'C3'],\n    'name': ['Alice Corp', 'Bob LLC', 'Charlie Inc'],\n    'tier': ['VIP', 'Standard', 'VIP']\n})\n\n# XLOOKUP эквивалент: связывание по ключу\nenriched_orders = orders.merge(customers[['customer_id', 'name', 'tier']], on='customer_id', how='left')\ndisplay(enriched_orders)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Частота ошибок VLOOKUP vs XLOOKUP\nСравним устойчивость формул к структурным изменениям витрин данных."}, {"type": "code", "content": "# Визуализация сравнения функций поиска\nscenarios = ['Вставка новой\\nколонки в середину', 'Поиск значения\\nслева от ключа', 'Обработка отсутствия\\nзначения (#N/A)', 'Скорость расчета\\nна 100k строк']\nvlookup_success = [0, 0, 30, 45]\nxlookup_success = [100, 100, 100, 95]\n\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\nx = np.arange(len(scenarios))\nwidth = 0.35\n\nrects1 = ax.bar(x - width/2, vlookup_success, width, label='Устаревший VLOOKUP', color=ALERT, edgecolor='#333333', linewidth=0.6)\nrects2 = ax.bar(x + width/2, xlookup_success, width, label='Современный XLOOKUP', color=SUCCESS, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Сравнение отказоустойчивости функций поиска в таблицах (%)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xticks(x)\nax.set_xticklabels(scenarios, fontsize=10)\nax.set_ylabel(\"Успешность выполнения сценария (%)\", fontsize=11)\nax.set_ylim(0, 120)\nax.legend(frameon=True, facecolor='#ffffff')\n\nfor r in rects2:\n    h = r.get_height()\n    ax.annotate(f\"{h}%\", xy=(r.get_x() + r.get_width()/2, h), xytext=(0, 4),\n                textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск клиента по заказу\nИспользуя `enriched_orders`, найдите имя клиента для заказа с `order_id == 102`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nclient_name = enriched_orders.loc[enriched_orders['order_id'] == 102, 'name'].iloc[0]\nprint(f\"Клиент заказа 102: {client_name}\")\n\nassert client_name == 'Charlie Inc', \"Имя клиента должно быть Charlie Inc\"\nprint(\"✅ Тест успешно пройден: поиск XLOOKUP отработал безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Формула XLOOKUP\nСинтаксис: `=XLOOKUP(искомое_значение; диапазон_поиска; диапазон_возврата; [если_не_найдено]; [режим_сопоставления])`. Всегда заполняйте аргумент `[если_не_найдено]`, чтобы избавиться от ошибок `#N/A`."}]}, {"filename": "lesson_03_pivot_tables_aggregations.ipynb", "rel_path": "course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 3. Сводные таблицы (Pivot Tables) и многомерная агрегация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСводные таблицы (Pivot Tables) — самый быстрый инструмент разведочного анализа данных в Excel.\nОни позволяют мгновенно перегруппировать миллионы строк сырых транзакций по срезам регионов, продуктовых линеек и каналов продаж, формируя понятные кросс-таблицы для руководства."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Построение кросс-таблицы\nСформируем сводную таблицу продаж по продуктовым категориям и кварталам."}, {"type": "code", "content": "# Демонстрация: Создание Pivot Table в Pandas (аналог Excel Pivot)\nsales_data = pd.DataFrame({\n    'Регион': ['Москва', 'СПб', 'Казань', 'Москва', 'СПб', 'Казань', 'Москва', 'СПб'],\n    'Категория': ['Электроника', 'Электроника', 'Электроника', 'Одежда', 'Одежда', 'Одежда', 'Дом', 'Дом'],\n    'Выручка ($k)': [450, 320, 180, 290, 210, 140, 190, 160]\n})\n\npivot_tbl = sales_data.pivot_table(index='Регион', columns='Категория', values='Выручка ($k)', aggfunc='sum', fill_value=0)\ndisplay(pivot_tbl)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Тепловая карта сводной таблицы\nПостроим тепловую карту (Heatmap), визуализирующую концентрацию выручки по регионам и товарным матрицам."}, {"type": "code", "content": "# Построение тепловой карты сводных продаж\nfig, ax = plt.subplots(figsize=(8, 4.5), dpi=110)\n\nsns.heatmap(pivot_tbl, annot=True, fmt=\".0f\", cmap=\"Blues\", ax=ax, \n            cbar=True, annot_kws={\"size\": 11, \"weight\": \"bold\"}, linewidths=0.8)\n\nax.set_title(\"Сводная выручка по регионам и категориям ($ тыс.)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"Категория товара\", fontsize=11)\nax.set_ylabel(\"Регион продаж\", fontsize=11)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск региона-лидера\nНайдите регион с максимальной суммарной выручкой по всем категориям."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntop_region = pivot_tbl.sum(axis=1).idxmax()\nprint(f\"Регион с максимальной выручкой: {top_region}\")\n\nassert top_region == 'Москва', \"Регионом-лидером должна быть Москва\"\nprint(\"✅ Тест успешно пройден: агрегация Pivot Table отработала корректно!\")"}, {"type": "markdown", "content": "### 💡 Инженерный совет по Pivot Tables\nВ Excel всегда форматируйте исходные данные как «Умную таблицу» (`Ctrl+T` / `Format as Table`). В этом случае при добавлении новых строк сводная таблица автоматически включит их в область расчета при нажатии кнопки `Refresh`."}]}, {"filename": "lesson_04_visualization_data_story.ipynb", "rel_path": "course/module_01_excel/lesson_04_visualization_data_story.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 4. Визуализация в таблицах и ликвидация Chart Junk\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_04_visualization_data_story.ipynb)\n\n## 📌 Бизнес-контекст и методология\nЭдвард Тафти ввел понятие **Chart Junk** — визуальный мусор, который отвлекает от сути данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nitems_path = ensure_dataset(\"order_items.csv\", subfolder=\"raw\")\norders_path = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\n\nitems = pd.read_csv(items_path)\norders = pd.read_csv(orders_path)\ndf = items.merge(orders, on=\"order_id\")\ndf['order_date'] = pd.to_datetime(df['order_date'])\n\nmonthly_trend = df.set_index('order_date').resample('ME')['total_amount'].sum()\n\nplt.figure(figsize=(9, 4), facecolor='#fefefe')\nax = plt.subplot(111)\nax.set_facecolor('#fefefe')\nplt.plot(monthly_trend.index, monthly_trend.values, color='#1779ba', linewidth=2.5, marker='o')\nplt.title(\"Динамика выручки по месяцам (руб.)\", fontsize=14, fontweight='bold', pad=15, color='#0a0a0a')\nplt.grid(True, linestyle='--', alpha=0.4, color='#cacaca')\nfor spine in ['top', 'right']:\n    ax.spines[spine].set_visible(False)\nplt.tight_layout()\nplt.show()\n"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Добавление расчетных меток MoM\nРассчитайте изменение выручки месяц к месяцу (MoM Growth %)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmom_growth = monthly_trend.pct_change() * 100\nworst_month = mom_growth.idxmin()\nworst_drop = mom_growth.min()\n\nprint(f\"Наибольшая просадка зафиксирована в {worst_month.strftime('%Y-%m')}: {worst_drop:.1f}%\")\nassert not mom_growth.empty, \"Ряд не должен быть пустым\"\nprint(\"✅ Тест успешно пройден!\")\n"}, {"type": "markdown", "content": "### 💡 Чек-лист чистоты бизнес-графика\n1. Заголовок содержит ключевой инсайт.\n2. Числа отформатированы с разделителями тысяч.\n3. Акцентный цвет выделяет только ключевые точки."}]}, {"filename": "lesson_05_ai_copilot_excel_formulas.ipynb", "rel_path": "course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 1. Урок 5. AI Copilot в Excel: генерация сложных формул и автоматизация отчетов\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb)\n\n## 📌 Бизнес-контекст и методология\nMicrosoft 365 Copilot и Google Duet AI кардинально изменили работу с таблицами.\nБольше не нужно мучительно конструировать вложенные формулы из 5 уровней скобок (`INDEX(MATCH(IF(...)))`).\nАналитик описывает задачу на естественном языке, а AI формирует формулу, валидирует граничные условия и объясняет механику расчета."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: AI Промпты для генерации формул Excel\nСравним скорость и качество генерации сложных расчетов."}, {"type": "code", "content": "# Демонстрация: Автоматическая генерация аналитических признаков\n# Задача промпта: \"Пометить клиентов с покупками >$500 и датой заказа в текущем квартале как 'Priority VIP'\"\ndf_customers_sample = pd.DataFrame({\n    'client_id': [1, 2, 3, 4],\n    'spent': [650, 320, 890, 150],\n    'days_ago': [12, 45, 80, 5]\n})\n\ndf_customers_sample['status'] = np.where(\n    (df_customers_sample['spent'] > 500) & (df_customers_sample['days_ago'] <= 30),\n    'Priority VIP', 'Standard'\n)\ndisplay(df_customers_sample)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Скорость разработки формул с Copilot\nСравним затраты времени аналитика на написание формул разной степени сложности."}, {"type": "code", "content": "# Построение графика бенчмарка продуктивности\ncomplexity = ['Базовые агрегации\\n(SUMIFS, COUNTIFS)', 'Многокритериальный\\nпоиск (XLOOKUP)', 'Массивы и фильтры\\n(FILTER, UNIQUE, SORT)', 'Сложные вложенные\\nмакро-формулы']\nmanual_min = [3, 8, 15, 35]\ncopilot_min = [0.5, 1.0, 1.5, 2.5]\n\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\nx = np.arange(len(complexity))\nwidth = 0.35\n\nax.bar(x - width/2, manual_min, width, label='Ручной подбор синтаксиса', color=SECONDARY, edgecolor='#333333', linewidth=0.6)\nax.bar(x + width/2, copilot_min, width, label='С генеративным AI Copilot', color=PRIMARY, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Время разработки формул Excel в зависимости от сложности (минуты)\", fontsize=12, fontweight='bold', pad=15)\nax.set_xticks(x)\nax.set_xticklabels(complexity, fontsize=10)\nax.set_ylabel(\"Время разработки (минуты)\", fontsize=11)\nax.legend(frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка количества Priority VIP\nПосчитайте количество клиентов со статусом `Priority VIP` в `df_customers_sample`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nvip_count = (df_customers_sample['status'] == 'Priority VIP').sum()\nprint(f\"Количество Priority VIP: {vip_count}\")\n\nassert vip_count == 1, \"Должен быть ровно 1 Priority VIP клиент\"\nprint(\"✅ Тест успешно пройден: логика формулы подтверждена!\")"}, {"type": "markdown", "content": "### 💡 Формула идеального промпта для Excel Copilot\nУказывайте в промпте: 1) Целевую колонку, 2) Формат исходных данных, 3) Условия фильтрации, 4) Желаемое поведение при ошибке (например, `ЕСЛИОШИБКА`)."}]}]}, {"id": "module_02_sql", "title": "Модуль 2. SQL Master: от SELECT до оконных функций", "cat": "Хард база", "badge": "SQL", "icon": "", "desc": "CTE, оконные агрегаты, партиционирование, когорты и оптимизация запросов.", "readme": "# 🗃️ Модуль 2: SQL — От первых запросов до аналитических оконных функций\n\n## 📌 О модуле\nSQL (Structured Query Language) — главный фундамент data-стека. LLM пишут синтаксис, но только аналитик понимает структуру реляционной модели, видит дублирование при JOIN и умеет оптимизировать тяжелые запросы. В этом модуле мы работаем с реальной SQLite базой e-commerce на 15 000+ записей.\n\n## 🎯 Learning Outcomes\n- **Apply**: Составление сложных запросов (`SELECT`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`).\n- **Analyze**: Все виды `JOIN` (INNER, LEFT, FULL, CROSS, SELF), борьба с декартовым произведением строк.\n- **Evaluate**: Использование CTE (Common Table Expressions) для структурирования запросов вместо спагетти-подзапросов.\n- **Create**: Аналитические оконные функции (`ROW_NUMBER`, `DENSE_RANK`, `LAG`, `LEAD`, `SUM OVER (PARTITION BY ...)`).\n- **AI Orchestration**: Промптинг для генерации SQL, проверка EXPLAIN QUERY PLAN, защита от галлюцинаций агрегаций.\n\n## 📚 Уроки\n1. `lesson_01_db_intro_select_filtering.ipynb` — Подключение к базе, анатомия SQL, SELECT, WHERE, LIKE, IN.\n2. `lesson_02_aggregations_group_by_having.ipynb` — Агрегатные функции, группировка, разница WHERE vs HAVING.\n3. `lesson_03_joins_deep_dive.ipynb` — Реляционная связь, виды JOIN, поиск потерянных строк.\n4. `lesson_04_subqueries_and_cte.ipynb` — Чистый код через CTE (`WITH`), многоуровневая аналитика.\n5. `lesson_05_window_functions_advanced.ipynb` — Оконные функции: ранги, нарастающий итог, темпы роста (MoM / YoY).\n6. `lesson_06_sql_patterns_retention_funnels.ipynb` — Паттерны продуктовой аналитики: когорты, воронки на чистом SQL.\n7. `lesson_07_prompt_engineering_for_sql_and_validation.ipynb` — Генерация SQL через нейросети и строгий чеклист валидации.\n8. `quiz.md` — 15 вопросов со скринингов.\n9. `cheatsheet.md` — Справочник SQL конструкций.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 2 (SQL)\n\n### Вопрос 1\nВ чем разница между `RANK()` и `DENSE_RANK()`?\n- [ ] Разницы нет\n- [x] При одинаковых значениях RANK оставляет пропуски в нумерации (1, 2, 2, 4), а DENSE_RANK нумерует без пробелов (1, 2, 2, 3)\n- [ ] DENSE_RANK работает только в PostgreSQL\n\n### Вопрос 2\nЗачем нужна конструкция `WITH` (CTE)?\n- [ ] Она ускоряет любой запрос в 100 раз\n- [x] Она позволяет разбить сложный запрос на логические читаемые блоки и использовать их повторно\n- [ ] Без нее нельзя соединять таблицы\n\n### Вопрос 3\nКакой результат вернет `COUNT(*)` vs `COUNT(column_name)` если в колонке есть NULL?\n- [ ] Одинаковый\n- [x] `COUNT(*)` считает все строки, а `COUNT(column_name)` игнорирует строки с NULL\n- [ ] Вернет ошибку базы данных\n\n---\n\n### Вопрос 4\nВ чем ключевое отличие оконной функции DENSE_RANK() от RANK()?\n- [ ] DENSE_RANK работает только в PostgreSQL.\n- [x] DENSE_RANK не оставляет пропусков в нумерации рангов при наличии одинаковых значений (например: 1, 2, 2, 3 вместо 1, 2, 2, 4 у RANK).\n- [ ] RANK нумерует строки в обратном порядке.\n*Объяснение*: DENSE_RANK плотно нумерует ранги без скачков при дубликатах.\n\n---\n\n### Вопрос 5\nПочему CTE (Common Table Expressions, блок WITH) предпочтительнее глубоко вложенных подзапросов в SELECT?\n- [ ] CTE всегда выполняется быстрее оптимизатором.\n- [x] CTE делает код модульным, легко читаемым человеком и AI, упрощает дебаг и повторное переиспользование промежуточных выборок.\n- [ ] Вложенные подзапросы запрещены в стандарте SQL 2026.\n*Объяснение*: Чистота и поддерживаемость кода снижают количество ошибок при передаче запросов между аналитиками.\n", "cheatsheet": "# 📋 SQL Cheatsheet\n\n```sql\n-- Оконная функция: прирост к предыдущему значению\nLAG(metric, 1) OVER (PARTITION BY user_id ORDER BY event_date)\n\n-- Оконная функция: доля строки в разрезе группы\nmetric * 100.0 / SUM(metric) OVER (PARTITION BY category)\n\n-- Безопасный расчет конверсии\nROUND(COUNT(DISTINCT converted_users) * 1.0 / NULLIF(COUNT(DISTINCT total_users), 0), 4)\n```\n", "notebooks": [{"filename": "lesson_01_db_intro_select_filtering.ipynb", "rel_path": "course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 1. Реляционные базы данных и фильтрация данных (SELECT, WHERE, NULL)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb)\n\n## 📌 Бизнес-контекст и методология\nSQL — фундаментальный язык продуктового и бизнес-аналитика. В реляционной СУБД (PostgreSQL, SQLite, BigQuery, Snowflake) данные нормализованы, что исключает дублирование записей.\nНавык прецизионной фильтрации через `WHERE` критичен: ошибка в логических предикатах (`AND` vs `OR`, неверная обработка `NULL`) приводит к искажению маркетинговых воронок, задвоению выручки и неверным решениям менеджмента."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПорядок логического выполнения SQL запроса отличается от синтаксического написания:\n1. `FROM` & `JOIN` — выбор и связывание таблиц\n2. `WHERE` — строчная фильтрация записей (до агрегации!)\n3. `SELECT` — выборка и расчет проекций колонок\n4. `ORDER BY` — финальная сортировка\n5. `LIMIT` — отсечение объема вывода"}, {"type": "code", "content": "# Демонстрация: фильтрация премиальных клиентов из ключевых хабов\nquery_demo = \"\"\"\nSELECT \n    customer_id,\n    first_name,\n    city,\n    acquisition_channel,\n    device,\n    registration_date\nFROM customers\nWHERE city IN ('Moscow', 'Saint Petersburg')\n  AND registration_date >= '2025-06-01'\n  AND acquisition_channel != 'Referral'\nORDER BY registration_date DESC\nLIMIT 8;\n\"\"\"\ndf_demo = pd.read_sql_query(query_demo, conn)\ndisplay(df_demo)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Структура каналов привлечения по устройствам\nОценим распределение аудитории по каналам привлечения (`acquisition_channel`) в разрезе платформ (`device`). Это позволяет CMO оптимизировать сплит рекламного бюджета."}, {"type": "code", "content": "# SQL запрос: кросс-таблица каналов и устройств\nquery_channels = \"\"\"\nSELECT \n    acquisition_channel,\n    device,\n    COUNT(*) as user_count\nFROM customers\nGROUP BY acquisition_channel, device;\n\"\"\"\ndf_channels = pd.read_sql_query(query_channels, conn)\npivot_ch = df_channels.pivot(index='acquisition_channel', columns='device', values='user_count').fillna(0)\n\n# Построение визуализации в стиле Foundation\nfig, ax = plt.subplots(figsize=(10, 5), dpi=110)\ncolors = [PRIMARY, SUCCESS, WARNING]\n\npivot_ch.plot(kind='barh', stacked=True, color=colors, ax=ax, edgecolor='#333333', linewidth=0.6)\n\nax.set_title(\"Структура базы пользователей: Каналы привлечения vs Устройства\", fontsize=13, fontweight='bold', pad=15)\nax.set_xlabel(\"Количество зарегистрированных клиентов\", fontsize=11, labelpad=8)\nax.set_ylabel(\"Канал привлечения (Acquisition Channel)\", fontsize=11)\nax.legend(title=\"Платформа\", frameon=True, facecolor='#ffffff', edgecolor='#dcdcdc')\n\n# Подписи долей прямо внутри баров\nfor c in ax.containers:\n    labels = [f\"{int(v)}\" if v > 15 else \"\" for v in c.datavalues]\n    ax.bar_label(c, labels=labels, label_type='center', color='white', fontweight='bold', fontsize=9)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Поиск завершенных заказов через Apple/Mir Pay\nНайдите все завершенные заказы со статусом `Completed` и методом оплаты, содержащим `Apple Pay` или `Mir Pay`. Отберите первые 10 строк."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nquery_pay = \"\"\"\nSELECT \n    order_id,\n    customer_id,\n    order_date,\n    status,\n    payment_method\nFROM orders\nWHERE status = 'Completed'\n  AND (payment_method LIKE '%Apple Pay%' OR payment_method LIKE '%Mir Pay%')\nLIMIT 10;\n\"\"\"\n\ndf_pay = pd.read_sql_query(query_pay, conn)\nprint(\"Найдено записей:\", len(df_pay))\ndisplay(df_pay.head(5))\n\nassert not df_pay.empty, \"Заказы должны быть найдены\"\nassert (df_pay['status'] == 'Completed').all(), \"Статус должен быть Completed\"\nprint(\"✅ Тест успешно пройден: фильтрация отработала безошибочно!\")"}, {"type": "markdown", "content": "### 💡 Трехзначная логика SQL и работа с NULL\nВ реляционных базах используется трёхзначная логика (`TRUE`, `FALSE`, `UNKNOWN`). Любая операция сравнения с `NULL` (например, `status = NULL` или `status != NULL`) возвращает `UNKNOWN`, из-за чего строка отсекается предикатом `WHERE`.\nВсегда используйте синтаксис `IS NULL` или `IS NOT NULL`, либо функцию `COALESCE(column, default_value)`."}]}, {"filename": "lesson_02_aggregations_group_by_having.ipynb", "rel_path": "course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 2. Урок 2. Агрегация данных, GROUP BY и разница с HAVING\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАгрегация данных — ядро формирования продуктовых метрик: выручки (Revenue), среднего чека (AOV), объема продаж (GMV) и маржинальности (Gross Margin).\nКлючевая ошибка начинающих аналитиков — непонимание различия между `WHERE` и `HAVING`:\n- `WHERE` фильтрует сырые транзакции **ДО** объединения в группы\n- `HAVING` фильтрует рассчитанные агрегированные метрики **ПОСЛЕ** выполнения `GROUP BY`"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ndb_path = ensure_dataset(\"ecommerce.db\")\nconn = sqlite3.connect(db_path)\nprint(f\"🟢 Подключение к базе данных успешно установлено: {db_path}\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем ключевые показатели эффективности (KPI) по категориям товаров: совокупную выручку, валовую прибыль и средний чек позиции."}, {"type": "code", "content": "# Демонстрация: Агрегация продаж по категориям товаров\nquery_agg = \"\"\"\nSELECT \n    p.category,\n    COUNT(DISTINCT o.order_id) as total_orders,\n    ROUND(SUM(oi.total_amount), 2) as total_revenue,\n    ROUND(SUM(oi.total_amount - (p.cost * oi.quantity)), 2) as total_profit,\n    ROUND(AVG(oi.total_amount), 2) as avg_item_revenue\nFROM order_items oi\nJOIN products p ON oi.product_id = p.product_id\nJOIN orders o ON oi.order_id = o.order_id\nWHERE o.status = 'Completed'\nGROUP BY p.category\nHAVING total_revenue > 500000\nORDER BY total_revenue DESC;\n\"\"\"\ndf_agg = pd.read_sql_query(query_agg, conn)\ndisplay(df_agg)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Выручка vs Маржинальная прибыль по категориям\nСравним категории товаров по объему сгенерированной выручки и валовой маржи (Gross Margin %), выделив самые прибыльные драйверы бизнеса."}, {"type": "code", "content": "# Расчет маржинальности и построение 2-панельного дашборда\ndf_agg['margin_pct'] = (df_agg['total_profit'] / df_agg['total_revenue']) * 100\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(13, 5), dpi=110)\n\n# Панель 1: Выручка и Прибыль (в тыс. $)\nx = np.arange(len(df_agg['category']))\nwidth = 0.35\n\nrects1 = ax1.bar(x - width/2, df_agg['total_revenue'] / 1000, width, label='Выручка ($k)', color=PRIMARY, edgecolor='#333333
