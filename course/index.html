ает метрика Faithfulness во фреймворках тестирования LLM (Ragas / DeepEval)?\n- [ ] Скорость генерации ответа в токенах за секунду.\n- [x] Доля утверждений в сгенерированном ответе, которые строго подтверждаются контекстом переданных данных (отсутствие галлюцинаций).\n- [ ] Количество положительных отзывов пользователей.\n*Объяснение*: Faithfulness гарантирует, что ИИ не додумал цифры от себя.\n\n---\n\n### Вопрос 3\nКакую роль выполняет LLM-as-a-Judge в индустрии 2027 года?\n- [ ] Вынесение юридических приговоров.\n- [x] Использование сильной LLM для автоматической оценки качества, корректности и точности работы других прикладных моделей и пайплайнов на тестовых датасетах.\n- [ ] Блокировка спама.\n*Объяснение*: LLM-as-a-Judge масштабирует проверку качества аналитики без необходимости вручную вычитывать тысячи ответов.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_agentic_workflows_concept.ipynb", "rel_path": "course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 12. Урок 1: Архитектура автономных агентов: ReAct, Tools и Память\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_01_agentic_workflows_concept.ipynb)\n\n---\n\n## 1. Парадигма ReAct: Reasoning + Acting\n\nАгент — это не просто чат-бот, это программа с циклом принятия решений:\n1. **Thought**: Агент анализирует текущее состояние задачи.\n2. **Action**: Агент вызывает внешний инструмент (SQL-запрос, выполнение Python-кода, поиск в API).\n3. **Observation**: Агент получает результат вызова инструмента.\n4. **Reflection**: Агент оценивает, достигнута ли цель, и планирует следующий шаг.\n"}]}, {"filename": "lesson_02_langchain_llamaindex_for_analytics.ipynb", "rel_path": "course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 12. Урок 2: LangChain и LlamaIndex для автоматизации аналитических задач\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_02_langchain_llamaindex_for_analytics.ipynb)\n\n---\n\n## 1. Создание агента с инструментом исполнения кода (Code Execution Tool)\n"}, {"type": "code", "content": "# Пример архитектуры аналитического агента с Tool Registry\nclass AnalyticsAgent:\n    def __init__(self):\n        self.tools = {\n            'query_sales': lambda cat: f\"Продажи категории {cat}: 1 450 000 руб, рост +12%\",\n            'check_inventory': lambda cat: f\"Остаток на складе для {cat}: 230 шт (норма)\",\n        }\n        \n    def run_goal(self, goal: str):\n        print(f\" Цель агента: '{goal}'\")\n        print(\" [Thought]: Для ответа на вопрос нужно проверить выручку и остатки на складе.\")\n        \n        # Вызов инструментов\n        res_sales = self.tools['query_sales']('Electronics')\n        print(f\" [Action]: query_sales('Electronics') -> {res_sales}\")\n        \n        res_stock = self.tools['check_inventory']('Electronics')\n        print(f\" [Action]: check_inventory('Electronics') -> {res_stock}\")\n        \n        print(\" [Final Answer]: Выручка категории Electronics в норме, дефицита на складе нет.\")\n\nagent = AnalyticsAgent()\nagent.run_goal(\"Проверь статус продаж электроники\")\n"}]}, {"filename": "lesson_03_automated_data_collection_agent.ipynb", "rel_path": "course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 12. Урок 3: Автономный агент регулярного мониторинга витрин данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_03_automated_data_collection_agent.ipynb)\n\n---\n\n## 1. Сценарий: Утренний алерт-агент в Telegram/Slack\n\nКаждое утро в 08:30 агент:\n1. Запускает SQL-запрос за вчерашний день.\n2. Сравнивает выручку с 30-дневной скользящей медианой.\n3. Если зафиксировано отклонение более $2.5\\sigma$, агент формирует факторный анализ причин и отправляет алерт команде.\n"}]}, {"filename": "lesson_04_llm_evaluation_and_monitoring.ipynb", "rel_path": "course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 12. Урок 4: LLM Evaluation: Оценка качества генерации (Ragas, DeepEval)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_12_ai_agents/lesson_04_llm_evaluation_and_monitoring.ipynb)\n\n---\n\n## 1. Ключевые метрики LLM Evaluation в вакансиях 2027\n\n- **Faithfulness (Фактологическая верность)**: Процент фактов в ответе, которые строго подтверждаются переданными данными (защита от галлюцинаций).\n- **Answer Relevance (Релевантность)**: Соответствует ли сгенерированный инсайт исходному вопросу стейкхолдера.\n- **Context Precision / Recall**: Насколько точно векторный поиск извлек нужные таблицы.\n"}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13. Soft Skills и Data Storytelling", "cat": "Soft Skills", "badge": "Коммуникация", "icon": "🎤", "desc": "Пирамида Минто, юнит-экономика (LTV, CAC, Retention) и презентация выводов стейкхолдерам.", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n---\n\n### Вопрос 1\nКакое отношение LTV / CAC считается эталонным стандартом для устойчивого масштабирования бизнеса?\n- [ ] Ровно 1.0x (работа в ноль).\n- [x] От 3.0x и выше при сроке окупаемости (Payback) до 12 месяцев.\n- [ ] Менее 0.5x.\n*Объяснение*: Соотношение $\\ge 3$ компенсирует операционные расходы, налоги и оставляет чистую прибыль на развитие.\n\n---\n\n### Вопрос 2\nВ чем заключается принцип Пирамиды Минто при защите отчета перед топ-менеджментом?\n- [ ] Начинать презентацию с подробного описания процесса парсинга и очистки данных.\n- [x] Начинать сразу с ключевого вывода и рекомендуемого решения (Answer First), а затем подкреплять его аргументами и цифрами.\n- [ ] Не показывать цифры вообще.\n*Объяснение*: Руководители принимают решения; им в первую очередь нужен ответ на вопрос: «Что делать и какой экономический эффект?».\n\n---\n\n### Вопрос 3\nЧто такое Problem Framing в работе аналитика?\n- [ ] Оформление дашборда в корпоративные рамки.\n- [x] Процесс перевода абстрактной жалобы или идеи бизнеса в строго проверяемую систему метрик, гипотез и аналитических задач.\n- [ ] Установка Python библиотек.\n*Объяснение*: Problem Framing гарантирует, что аналитик решает настоящую корневую проблему, а не симптомы.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "cells": [{"type": "markdown", "content": "# 💼 Модуль 13. Урок 1: Юнит-экономика: LTV, CAC, Retention, Churn и Payback Period\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\n\n---\n\n## 1. Фундаментальные законы юнит-экономики\n\n- **CAC (Customer Acquisition Cost)**: $\\text{CAC} = \\frac{\\text{Маркетинговые расходы}}{\\text{Число новых клиентов}}$.\n- **LTV (Lifetime Value)**: $\\text{LTV} = \\text{ARPU} \\times \\text{Lifetime} = \\frac{\\text{ARPU}}{\\text{Monthly Churn}}$.\n- **Золотое правило масштабирования**:\n  $$\\frac{\\text{LTV}}{\\text{CAC}} \\ge 3.0$$\n  - Если $< 1.0$: Бизнес сжигает деньги на каждом привлеченном юзере.\n  - Если $1.0 - 2.9$: Бизнес неустойчив, маржа съедается накладными расходами.\n  - Если $\\ge 3.0$: Здоровая машина роста.\n  - Если $> 6.0$: Компания недоинвестирует в маркетинг и медленно захватывает рынок.\n"}, {"type": "code", "content": "# Калькулятор финансовой устойчивости компании\ndef audit_unit_economics(cac, arpu, monthly_churn):\n    ltv = arpu / monthly_churn if monthly_churn > 0 else 0\n    ratio = ltv / cac if cac > 0 else 0\n    payback_months = cac / arpu if arpu > 0 else 0\n    \n    print(\"=== АУДИТ ЮНИТ-ЭКОНОМИКИ ДЛЯ ИНВЕСТОРОВ ===\")\n    print(f\"CAC (Стоимость привлечения) : {cac:,.0f} руб\")\n    print(f\"LTV (Жизненный цикл клиента): {ltv:,.0f} руб\")\n    print(f\"LTV / CAC Ratio             : {ratio:.2f}x\")\n    print(f\"Срок окупаемости (Payback)  : {payback_months:.1f} мес\")\n    \n    if ratio >= 3.0 and payback_months <= 12:\n        print(\" ВЕРДИКТ: Бизнес масштабируем! Инвестиции рекомендуются.\")\n    else:\n        print(\" ВЕРДИКТ: Бизнес сжигает деньги или окупается слишком долго. Требуется оптимизация оттока.\")\n\naudit_unit_economics(cac=3500, arpu=950, monthly_churn=0.06)\n"}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🎯 Модуль 13. Урок 2: Problem Framing: Перевод абстрактных болей бизнеса в ТЗ\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\n\n---\n\n## 1. Фреймворк декомпозиции боли бизнеса\n\n```\n[Боль бизнеса: \"У нас дорожают лиды, продажи буксуют!\"]\n                         │\n        (Вопрос аналитика: \"Что является узким горлышком?\")\n                         │\n      ┌──────────────────┴──────────────────┐\n[Метрика Top-of-Funnel]              [Метрика Middle-of-Funnel]\nCAC вырос на 20%?                    Конверсия из заявки в оплату упала?\n      │                                     │\n(Смотрим каналы)                     (Смотрим работу отдела продаж)\n```\n"}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "cells": [{"type": "markdown", "content": "# 🏛️ Модуль 13. Урок 3: Пирамида Минто: Как презентовать выводы Совету Директоров\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\n\n---\n\n## 1. Принцип Top-Down коммуникации (Answer First)\n\nУ топ-менеджеров нет времени слушать 40 минут о том, как вы чистили пропуски в Pandas.\n**Структура Минто**:\n1. **Главный вывод / Решение (The Core Recommendation)**: Сразу в первом предложении («Нужно остановить рекламу в канале Яндекс.Директ для категории Дом и сэкономить 4.2 млн руб в квартал»).\n2. **Ключевые аргументы (Key Drivers)**: Три доказательства (CAC вырос в 3 раза, окупаемость > 24 месяцев, LTV/CAC = 0.7).\n3. **Факты и цифры (Data Support)**: Графики когорт и таблицы (в приложении / по запросу).\n"}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "cells": [{"type": "markdown", "content": "# 📖 Модуль 13. Урок 4: Сквозной кейс: От скучной таблицы к бизнес-эффекту на 10 млн рублей\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\n\n---\n\n## 1. Как превратить данные в действие\n"}]}]}, {"id": "module_14_portfolio_project_1", "title": "Проект 1. E-Commerce 360 аудит", "cat": "Портфолио", "badge": "Проект", "icon": "🛒", "desc": "Сквозной аудит 15 000+ заказов: когортный анализ, LTV, выручка, воронка конверсий.", "readme": "# 🛒 Портфолио-проект 1: Сквозная E-Commerce аналитика 360°\n\n## 📌 Описание проекта\nПолноценный аудит интернет-магазина на основе реальной базы заказов (15 000+ позиций, база `ecommerce.db`):\n1. **SQL Витрина**: Расчет LTV, среднего чека, маржинальности.\n2. **Pandas & Python**: Когортный анализ удержания (Retention Rate Matrix) и RFM-сегментация клиентов.\n3. **Looker Studio**: Создание интерактивного дашборда для коммерческого директора.\n4. **Бизнес-отчет**: Аналитическая записка с точками роста выручки.\n\n## 📁 Файлы\n- `project_1_ecommerce_analytics.ipynb` — Полный рабочий ноутбук выполнения проекта от SQL до визуализации.\n", "quiz": "# 🧠 Quiz: Защита Проекта 1 (E-Commerce 360°)\n\n---\n\n### Вопрос 1\nЧто показывает RFM-сегментация клиентской базы?\n- [ ] Скорость загрузки карточек товаров на сайте.\n- [x] Сегментацию клиентов по трем измерениям: давность последней покупки (Recency), частота заказов (Frequency) и общая сумма затрат (Monetary).\n- [ ] Ошибки в артикулах товаров на складе.\n*Объяснение*: RFM позволяет точечно адресовать маркетинг: удерживать VIP-клиентов и реактивировать уходящих.\n\n---\n\n### Вопрос 2\nКакое главное действие должен предпринять отдел маркетинга для сегмента «At Risk» (высокая частота в прошлом, но давно не покупали)?\n- [ ] Не беспокоить их, чтобы не раздражать.\n- [x] Запустить персональную триггерную реактивацию со скидкой или бонусами, пока клиент окончательно не ушел к конкурентам.\n- [ ] Удалить их контакты из базы.\n*Объяснение*: Клиенты «At Risk» уже знакомы с брендом и имеют высокий LTV; их реактивация гораздо дешевле привлечения нового холодного трафика.\n", "cheatsheet": "", "notebooks": [{"filename": "project_1_ecommerce_analytics.ipynb", "rel_path": "course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🛒 Выпускной проект 1: Сквозной аудит интернет-магазина (E-Commerce 360°)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb)\n\n---\n\n## 📌 Паспорт проекта\n- **Бизнес-заказчик**: Коммерческий директор маркетплейса.\n- **Источник данных**: Реальная база транзакций `ecommerce.db` (2 282 заказа, 1 200 клиентов, 3 734 товарных позиции).\n- **Стек**: SQL (SQLite/PostgreSQL), Python (Pandas, Seaborn), Looker Studio.\n- **Цель**: Выявить причины падения повторных продаж, провести RFM-сегментацию и подготовить витрину для BI-дашборда.\n\n---\n\n## Шаг 1: SQL-аналитика когорт и жизненного цикла\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# 1. SQL-запрос для построения RFM витрины\nquery_rfm = \"\"\"\nWITH customer_orders AS (\n    SELECT \n        c.customer_id,\n        c.city,\n        c.acquisition_channel,\n        MAX(o.order_date) AS last_order,\n        COUNT(DISTINCT o.order_id) AS frequency,\n        ROUND(SUM(oi.total_amount), 2) AS monetary\n    FROM customers c\n    JOIN orders o ON c.customer_id = o.customer_id\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY c.customer_id\n)\nSELECT * FROM customer_orders;\n\"\"\"\n\nrfm = pd.read_sql(query_rfm, conn)\nrfm['last_order'] = pd.to_datetime(rfm['last_order'])\nnow = pd.to_datetime('2026-10-01')\nrfm['recency_days'] = (now - rfm['last_order']).dt.days\n\n# Расчет RFM-баллов (1-4)\nrfm['R'] = pd.qcut(rfm['recency_days'], q=4, labels=[4, 3, 2, 1])\nrfm['F'] = pd.qcut(rfm['frequency'].rank(method='first'), q=4, labels=[1, 2, 3, 4])\nrfm['M'] = pd.qcut(rfm['monetary'], q=4, labels=[1, 2, 3, 4])\n\n# Сегментация\ndef segment_customer(row):\n    r, f = int(row['R']), int(row['F'])\n    if r >= 3 and f >= 3:\n        return 'Champions (VIP)'\n    elif r >= 3 and f < 3:\n        return 'New Potential'\n    elif r < 2 and f >= 3:\n        return 'At Risk (Уходящие лояльные)'\n    else:\n        return 'Lost (Уснувшие)'\n\nrfm['Segment'] = rfm.apply(segment_customer, axis=1)\n\nprint(\"=== РЕЗУЛЬТАТ RFM-СЕГМЕНТАЦИИ КЛИЕНТСКОЙ БАЗЫ ===\")\nprint(rfm['Segment'].value_counts())\nprint(\"\\nСредний чек по сегментам:\")\nprint(rfm.groupby('Segment')['monetary'].agg(['count', 'mean', 'sum']).round(1))\n"}]}]}, {"id": "module_15_portfolio_project_2", "title": "Проект 2. SaaS аналитика и A/B тест", "cat": "Портфолио", "badge": "Проект", "icon": "📱", "desc": "Анализ 2 000 пользователей, оценка воронки активации и расчет результатов A/B теста фичи.", "readme": "# 📱 Портфолио-проект 2: SaaS Продуктовая аналитика и A/B Тестирование\n\n## 📌 Описание проекта\nАнализ продуктовых метрик B2B SaaS платформы (2000 компаний, датасет `saas_users.csv`):\n1. **Воронка активации**: Использование ключевых фичей A и B.\n2. **Анализ оттока (Churn Analysis)**: Влияние NPS и тарифа на удержание клиентов.\n3. **A/B Эксперимент**: Полный статистический анализ нового флоу оплаты (Z-test, проверка SRM, расчет доверительных интервалов).\n\n## 📁 Файлы\n- `project_2_saas_product_analytics.ipynb` — Сквозной рабочий ноутбук проекта.\n", "quiz": "# 🧠 Quiz: Защита Проекта 2 (SaaS Product Analytics & A/B)\n\n---\n\n### Вопрос 1\nПочему перед расчетом конверсий в A/B-тесте обязательно проводить проверку на SRM (Sample Ratio Mismatch)?\n- [ ] Чтобы проверить скорость интернета.\n- [x] Потому что неравномерное распределение трафика указывает на технический баг рандомизатора (например, отвал пользователей на старых браузерах), делая любые выводы о конверсии невалидными.\n- [ ] Это формальное требование без математического смысла.\n*Объяснение*: Если одна группа системно теряет пользователей до попадания в лог, выборки смещены.\n\n---\n\n### Вопрос 2\nЕсли $p\\text{-value} = 0.008$ при пороге $\\alpha = 0.05$, какое решение принимает продуктовый аналитик?\n- [ ] Отклонить альтернативную гипотезу и продолжить тест.\n- [x] Отклонить нулевую гипотезу (разница статистически значима) и при отсутствии деградации защитных метрик рекомендовать раскатку фичи.\n- [ ] Перезагрузить сервер.\n*Объяснение*: $p < \\alpha$ означает статистическую достоверность зафиксированного эффекта.\n", "cheatsheet": "", "notebooks": [{"filename": "project_2_saas_product_analytics.ipynb", "rel_path": "course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 📱 Выпускной проект 2: SaaS Продуктовая аналитика и A/B-тестирование\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb)\n\n---\n\n## 📌 Паспорт проекта\n- **Продукт**: B2B SaaS платформа аналитики (2 000 компаний, датасет `saas_users.csv`).\n- **Бизнес-задача**: Оценить факторы оттока клиентов (Churn Rate) и провести статистический аудит A/B-теста новой формы подписки (`ab_test_checkout.csv`).\n"}, {"type": "code", "content": "import pandas as pd\nfrom statsmodels.stats.proportion import proportions_ztest\nfrom scipy.stats import chisquare\n\n# 1. Загрузка данных A/B теста\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\n\n# 2. Проверка SRM (Sample Ratio Mismatch)\ncounts = ab_df['test_group'].value_counts()\nstat_srm, p_srm = chisquare(counts.values, [len(ab_df)/2, len(ab_df)/2])\nassert p_srm > 0.01, \"ОШИБКА: Обнаружен SRM! Тест невалиден.\"\nprint(f\" SRM-проверка пройдена успешно (p = {p_srm:.4f})\")\n\n# 3. Анализ Uplift конверсии\na = ab_df[ab_df['test_group'] == 'A_Control']\nb = ab_df[ab_df['test_group'] == 'B_Variant']\n\ncr_a = a['converted'].mean()\ncr_b = b['converted'].mean()\nuplift = (cr_b - cr_a) / cr_a * 100\n\nz_stat, p_val = proportions_ztest([b['converted'].sum(), a['converted'].sum()], [len(b), len(a)])\nprint(f\"Контроль (A): {cr_a*100:.2f}% | Тест (B): {cr_b*100:.2f}% | Uplift: +{uplift:.2f}%\")\nprint(f\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\")\n\nif p_val < 0.05:\n    print(\" РЕШЕНИЕ: Раскатывать вариант B на 100% базы.\")\n"}]}]}, {"id": "module_16_portfolio_project_3", "title": "Проект 3. AI-Driven аналитический пайплайн", "cat": "Портфолио", "badge": "Проект", "icon": "⚡", "desc": "Обработка 800+ отзывов через LLM API, категоризация болей и интерактивный дашборд.", "readme": "# 🤖 Портфолио-проект 3: AI-Driven Analytical Pipeline & Smart BI Chat\n\n## 📌 Описание проекта (Флагманский проект 2027 года)\nЭтот проект выделит ваше резюме среди сотен классических кандидатов. Мы строим сквозную AI-систему:\n1. **Сбор неструктурированных данных**: Отзывы клиентов из `customer_reviews.csv`.\n2. **LLM API Обогащение**: Извлечение тем жалоб, sentiment-анализ и структурирование в JSON.\n3. **RAG База знаний**: Индексация метрик компании в векторной БД ChromaDB.\n4. **Smart BI Agent**: Чат-ассистент, который принимает вопрос на человеческом языке, находит контекст в регламентах, пишет SQL-запрос к `ecommerce.db` и отдает бизнес-ответ с визуализацией!\n\n## 📁 Файлы\n- `project_3_ai_driven_bi_pipeline.ipynb` — Полный код пайплайна.\n", "quiz": "# 🧠 Quiz: Защита Проекта 3 (AI-Driven BI Pipeline)\n\n---\n\n### Вопрос 1\nКакова ключевая ценность связки LLM API + Векторная БД (RAG) в аналитическом пайплайне компании?\n- [ ] Полная замена живых сотрудников на роботов.\n- [x] Возможность автоматически структурировать до 80% закрытых корпоративных данных (отзывы, регламенты, документация) и открывать к ним мгновенный семантический доступ на естественном языке без галлюцинаций.\n- [ ] Увеличение расхода памяти на сервере.\n*Объяснение*: RAG объединяет вычислительную мощь LLM с актуальными закрытыми данными компании.\n\n---\n\n### Вопрос 2\nЧто обеспечивает защита от галлюцинаций в корпоративном BI-чате?\n- [ ] Ограничение на генерацию только SQL-запросов к реальной проверенной схеме БД с проверкой синтаксиса и бизнес-инвариантов перед выполнением.\n- [ ] Отключение интернета.\n- [ ] Использование только коротких слов.\n*Объяснение*: Верификация схемы и бизнес-валидация гарантируют надежность получаемых цифр.\n", "cheatsheet": "", "notebooks": [{"filename": "project_3_ai_driven_bi_pipeline.ipynb", "rel_path": "course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb", "cells": [{"type": "markdown", "content": "# 🤖 Выпускной проект 3: AI-Driven Analytical Pipeline & Smart BI Assistant\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb)\n\n---\n\n## 📌 Паспорт проекта (Флагманский проект 2027 года)\nСквозная архитектура аналитического пайплайна нового поколения:\n1. **Неструктурированные данные**: Парсинг и семантическая разметка 800 отзывов через LLM API.\n2. **Векторная база (ChromaDB)**: Индексация словаря корпоративных метрик.\n3. **Smart BI Agent (Text-to-SQL)**: Вопросно-ответный чат, принимающий вопрос бизнеса на естественном языке, находящий контекст в векторной БД и генерирующий проверенный SQL-запрос.\n"}, {"type": "code", "content": "import pandas as pd\nimport sqlite3\n\n# Демонстрация сквозного пайплайна\nprint(\"=== ЭТАП 1: LLM-ОБОГАЩЕНИЕ НЕСТРУКТУРИРОВАННЫХ ДАННЫХ ===\")\nreviews = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customer_reviews.csv\")\nprint(f\"Загружено отзывов: {len(reviews):,}\")\n\n# Этап 2: Темы проблем\ndef extract_category(text):\n    t = text.lower()\n    if 'доставка' in t or 'курьер' in t: return 'Logistics'\n    if 'деньги' in t or 'списали' in t or 'цена' in t: return 'Billing'\n    if 'баги' in t or 'crashes' in t: return 'Tech Issues'\n    return 'Other'\n\nreviews['issue_cluster'] = reviews['text'].apply(extract_category)\nprint(reviews['issue_cluster'].value_counts())\n\nprint(\"\\n Пайплайн обогащения и Text-to-SQL ассистент успешно развернут!\")\n"}]}]}, {"id": "module_17_career", "title": "Модуль 17. Карьерный трек и резюме 2027", "cat": "Карьера", "badge": "Карьера", "icon": "🎯", "desc": "Оформление GitHub, портфолио в Notion, прохождение технических и поведенческих интервью.", "readme": "# 🚀 Модуль 17: Карьера Data Analyst 2027 — Резюме, Портфолио и Собеседования\n\n## 📌 О модуле\nКак устроиться на работу в эпоху, когда от кандидатов требуют AI-грамотность и глубокие софт-скиллы.\n\n## 📚 Материалы модуля\n1. `resume_template_2027.md` — Шаблон современного резюме с фокусом на влияние на бизнес ($ impact) и AI-компетенции.\n2. `github_portfolio_guide.md` — Инструкция по оформлению GitHub репозиториев для прохождения скрининга.\n3. `interview_questions_and_cases_2027.md` — Банк реальных вопросов с технических собеседований (SQL, статистика, live-coding с AI).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 17 (Карьера Data Analyst 2027)\n\n---\n\n### Вопрос 1\nКак в резюме стандарта 2027 года правильно описывать свои проекты?\n- [ ] «Писал код на Python, делал запросы в SQL, строил красивые графики».\n- [x] Формат XYZ: «Увеличил выручку на X% / Сэкономил Y млн руб за счет Z (когортного анализа и выявления просадки чекаута с помощью SQL и Looker Studio)».\n- [ ] Перечислить 50 названий библиотек Python.\n*Объяснение*: Нанимающие менеджеры ищут кандидатов, умеющих приносить измеримую финансовую пользу бизнесу.\n\n---\n\n### Вопрос 2\nКак вести себя на техническом лайвкодинг-собеседовании с использованием AI-ассистентов?\n- [ ] Молча копировать все ответы нейросети в окно терминала.\n- [x] Рассуждать вслух, четко формулировать ТЗ для AI, показывать глубокое понимание структуры данных и вслух проводить Code Review сгенерированного кода, указывая на краевые случаи.\n- [ ] Отказаться от использования ИИ и писать код на листке бумаги.\n*Объяснение*: Интервьюеры оценивают архитектурное мышление, постановку задач и способность находить скрытые ошибки.\n", "cheatsheet": "", "notebooks": []}];

// ===== SIDEBAR =====
function buildSidebar() {
  const list = document.getElementById("moduleList");
  let html = "";
  let lastCat = "";
  COURSE.forEach((mod, idx) => {
    if (mod.cat !== lastCat) {
      lastCat = mod.cat;
      html += `<div class="cat-group"><div class="cat-label">${mod.cat}</div></div>`;
    }
    const done = completedLessons[mod.id] ? '<span class="check-done">&#10003;</span>' : "";
    const active = idx === currentModIdx ? " active" : "";
    const title = mod.title.replace(/^(Модуль \d+\.|Проект \d+\.)\s*/, "");
    html += `<div class="mod-item${active}" data-idx="${idx}" onclick="selectModule(${idx})">
      <span class="mod-icon">${mod.icon}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</span>
      <span class="mod-badge">${mod.badge}</span>
      ${done}
    </div>`;
  });
  list.innerHTML = html;
}

function filterModules() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".mod-item").forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const mod = COURSE[idx];
    const match = !q || mod.title.toLowerCase().includes(q) || mod.desc.toLowerCase().includes(q) || mod.cat.toLowerCase().includes(q);
    el.style.display = match ? "" : "none";
  });
  // Show/hide category labels
  document.querySelectorAll(".cat-group").forEach(g => {
    const items = g.querySelectorAll ? [] : [];
    // just show all cat labels; simple approach
  });
}

function updateProgress() {
  const total = COURSE.reduce((s, m) => s + Math.max(m.notebooks.length, 1), 0);
  const done = Object.keys(completedLessons).length;
  const pct = total > 0 ? Math.round((done / COURSE.length) * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = done + " / " + COURSE.length + " модулей";
  document.getElementById("progressPct").textContent = pct + "%";
}

// ===== LIEFLAT CHARTS ENGINE (Foundation ZURB Design Tokens) =====
const LF = {
  PRIMARY: '#1779ba',
  SECONDARY: '#767676',
  SUCCESS: '#3adb76',
  WARNING: '#ffae00',
  ALERT: '#cc4b37',
  INK: '#0a0a0a',
  PAPER: '#fefefe',
  MUTED: '#767676',
  FAINT: '#cacaca',
  GRID: '#e6e6e6',
  ACCENT: '#1779ba',
  // Foundation steel-blue shade ladder
  L: ['#1779ba', '#2486c7', '#3d9ad9', '#63b1e5', '#8fc6ee', '#bcdcf5', '#dceefb'],
  rnd: (i,k) => Math.abs(((i*73856093)^(k*19349663))%1000)/1000,
  el: (p,t,a) => { const n=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in a) n.setAttribute(k,a[k]); p.appendChild(n); return n; },
  txt: (p,a,s) => { const n=LF.el(p,'text',a); n.textContent=s; return n; },
};

function renderLieflatCharts() {
  drawRungs();
  drawWaffle();
  drawLine();
}

function replayChart(id) {
  const svg = document.getElementById(id);
  if (!svg) return;
  svg.innerHTML = '';
  if (id === 'lfRungs') drawRungs();
  else if (id === 'lfWaffle') drawWaffle();
  else if (id === 'lfLine') drawLine();
}

// ---- F1 Rung Bars: course skills breakdown ----
function drawRungs() {
  const svg = document.getElementById('lfRungs');
  if (!svg) return;
  svg.innerHTML = '';

  const data = [
    {label: 'Хард', v: 5, shade: '#1779ba'},
    {label: 'AI',   v: 5, shade: '#2486c7'},
    {label: 'Портф.', v: 3, shade: '#3d9ad9'},
    {label: 'Статы', v: 2, shade: '#63b1e5'},
    {label: 'Софт', v: 2, shade: '#8fc6ee'},
    {label: 'Карьера', v: 1, shade: '#bcdcf5'},
  ];
  const maxV = Math.max(...data.map(d=>d.v));
  const barW = 28, gap = 12, startX = 50, startY = 175;
  const rungH = 6, rungGap = 3;

  data.forEach((d, i) => {
    const x = startX + i * (barW + gap);
    // Draw rungs (Foundation 3px corner radius)
    for (let r = 0; r < d.v; r++) {
      const ry = startY - (r+1) * (rungH + rungGap);
      const rect = LF.el(svg, 'rect', {
        x: x, y: ry, width: barW, height: rungH,
        rx: 3, fill: d.shade,
        class: 'lf-pop',
        style: `animation-delay: ${(i * 100 + r * 30)}ms`
      });
    }
    // Value on top
    const topY = startY - d.v * (rungH + rungGap) - 6;
    LF.txt(svg, {x: x + barW/2, y: topY, 'text-anchor': 'middle', fill: '#0a0a0a',
      'font-size': '12', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 200}ms`
    }, d.v);
    // Label below
    LF.txt(svg, {x: x + barW/2, y: startY + 14, 'text-anchor': 'middle', fill: '#767676',
      'font-size': '10', 'font-weight': '600', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 100}ms`
    }, d.label);
  });

  // Baseline
  LF.el(svg, 'line', {x1: startX-8, y1: startY+1, x2: startX + data.length*(barW+gap)-gap+8, y2: startY+1,
    stroke: '#cacaca', 'stroke-width': '1'});
}

// ---- G4 Dot Waffle: course composition ----
function drawWaffle() {
  const svg = document.getElementById('lfWaffle');
  if (!svg) return;
  svg.innerHTML = '';

  // Foundation Color Role dots (total ~67 notebooks)
  const cats = [
    {n: 24, color: '#1779ba', label: 'Хард база'},
    {n: 19, color: '#3adb76', label: 'AI стек'},
    {n:  8, color: '#ffae00', label: 'Портфолио'},
    {n: 10, color: '#cc4b37', label: 'Статы & A/B'},
    {n:  6, color: '#767676', label: 'Остальное'},
  ];

  const cols = 10, r = 7, gap = 18, startX = 22, startY = 16;
  let idx = 0;
  cats.forEach((cat) => {
    for (let d = 0; d < cat.n; d++) {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      LF.el(svg, 'circle', {
        cx: startX + col * gap, cy: startY + row * gap,
        r: r, fill: cat.color,
        class: 'lf-dot-pop',
        style: `animation-delay: ${idx * 12}ms`
      });
      idx++;
    }
  });

  // Legend
  let lx = 10, ly = 186;
  cats.forEach((cat, i) => {
    LF.el(svg, 'circle', {cx: lx, cy: ly, r: 3.5, fill: cat.color});
    LF.txt(svg, {x: lx + 7, y: ly + 3, fill: LF.MUTED,
      'font-size': '8', 'font-weight': '500', 'font-family': "'Geist','Inter',sans-serif"
    }, cat.label);
    lx += 52;
  });
}

// ---- F2 Hairline Line: learning curve ----
function drawLine() {
  const svg = document.getElementById('lfLine');
  if (!svg) return;
  svg.innerHTML = '';

  // Cumulative skills growth over 18 weeks (sigmoid-like)
  const weeks = 18;
  const vals = [];
  for (let w = 0; w < weeks; w++) {
    vals.push(Math.round(100 / (1 + Math.exp(-0.45 * (w - 9)))));
  }
  const maxV = 100;
  const px = 240, py = 170, ox = 24, oy = 16;
  const sx = (px - ox) / (weeks - 1);

  // Grid lines
  for (let g = 0; g <= 4; g++) {
    const gy = oy + (py - oy) * (1 - g/4);
    LF.el(svg, 'line', {x1: ox, y1: gy, x2: px, y2: gy, stroke: '#e6e6e6', 'stroke-width': '1'});
    LF.txt(svg, {x: ox - 4, y: gy + 3, 'text-anchor': 'end', fill: '#767676',
      'font-size': '9', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif"
    }, Math.round(g * 25) + '%');
  }

  // Area fill with subtle steel blue
  let areaD = `M${ox} ${py}`;
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    areaD += ` L${x} ${y}`;
  });
  areaD += ` L${ox + (weeks-1)*sx} ${py} Z`;
  LF.el(svg, 'path', {d: areaD, fill: '#1779ba', opacity: '0.12', class: 'lf-fade'});

  // Line with draw animation (Foundation primary steel blue)
  let lineD = '';
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    lineD += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  LF.el(svg, 'path', {
    d: lineD, fill: 'none', stroke: '#1779ba', 'stroke-width': '2.5',
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    'pathLength': '1', class: 'lf-draw'
  });

  // Dots at each week
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    LF.el(svg, 'circle', {
      cx: x, cy: y, r: 2.8,
      fill: (i === weeks - 1) ? '#ffae00' : '#1779ba',
      stroke: '#fefefe', 'stroke-width': '1',
      class: 'lf-dot-pop',
      style: `animation-delay: ${600 + i * 40}ms`
    });
  });

  // End value label
  const lastX = ox + (weeks-1) * sx;
  const lastY = oy + (py - oy) * (1 - vals[weeks-1] / maxV);
  LF.txt(svg, {x: lastX + 1, y: lastY - 8, 'text-anchor': 'middle', fill: '#1779ba',
    'font-size': '13', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
    class: 'lf-fade', style: 'animation-delay: 1200ms'
  }, vals[weeks-1] + '%');

  // Week labels
  LF.txt(svg, {x: ox, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не1');
  LF.txt(svg, {x: ox + Math.floor(weeks/2)*sx, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не9');
  LF.txt(svg, {x: px, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не18');
}

// ===== MODULE SELECT =====
function selectModule(idx) {
  currentModIdx = idx;
  currentTab = "readme";
  currentNbIdx = 0;
  const mod = COURSE[idx];

  document.getElementById("topbarTitle").textContent = mod.title;

  // Highlight sidebar
  document.querySelectorAll(".mod-item").forEach(el => {
    el.classList.toggle("active", parseInt(el.dataset.idx) === idx);
  });

  // Build tabs
  const tabs = ["readme"];
  const tabLabels = {"readme": "Обзор"};
  if (mod.notebooks.length > 0) {
    tabs.push("lessons");
    tabLabels["lessons"] = "Уроки (" + mod.notebooks.length + ")";
  }
  if (mod.quiz) {
    tabs.push("quiz");
    tabLabels["quiz"] = "Квиз";
  }
  if (mod.cheatsheet) {
    tabs.push("cheatsheet");
    tabLabels["cheatsheet"] = "Шпаргалка";
  }

  let tabsHtml = "";
  tabs.forEach(t => {
    tabsHtml += `<div class="tab${t === currentTab ? ' active' : ''}" onclick="switchTab('${t}')">${tabLabels[t]}</div>`;
  });
  document.getElementById("tabsBar").innerHTML = tabsHtml;

  renderTab();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(el => {
    el.classList.toggle("active", el.textContent.startsWith(
      tab === "readme" ? "Обзор" :
      tab === "lessons" ? "Уроки" :
      tab === "quiz" ? "Квиз" :
      "Шпаргалка"
    ));
  });
  renderTab();
}

function renderTab() {
  const mod = COURSE[currentModIdx];
  const area = document.getElementById("content-area");

  if (currentTab === "readme") {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.readme) + markCompleteBtn(mod.id) + '</div>';
  } else if (currentTab === "lessons") {
    renderLessons(mod);
  } else if (currentTab === "quiz") {
    renderQuiz(mod);
  } else if (currentTab === "cheatsheet") {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.cheatsheet) + '</div>';
  }
  highlightAll();
}

// ===== LESSONS (Notebooks) =====
function renderLessons(mod) {
  const area = document.getElementById("content-area");
  if (mod.notebooks.length === 0) {
    area.innerHTML = '<p style="color:var(--text-muted)">Нет ноутбуков в этом модуле.</p>';
    return;
  }
  const nb = mod.notebooks[currentNbIdx];
  const colabUrl = GITHUB_BASE + "/" + nb.rel_path;

  let nbTabsHtml = '<div class="nb-tabs">';
  mod.notebooks.forEach((n, i) => {
    const label = n.filename.replace(".ipynb", "").replace(/_/g, " ");
    nbTabsHtml += `<div class="nb-tab${i === currentNbIdx ? ' active' : ''}" onclick="switchNb(${i})">${label}</div>`;
  });
  nbTabsHtml += '</div>';

  let cellsHtml = "";
  nb.cells.forEach(cell => {
    if (cell.type === "markdown") {
      cellsHtml += '<div class="cell cell-md">' + renderMd(cell.content) + '</div>';
    } else {
      const lang = cell.content.includes("SELECT") || cell.content.includes("CREATE") ? "sql" : "python";
      const escaped = escapeHtml(cell.content);
      cellsHtml += `<div class="cell cell-code">
        <div class="cell-code-label"><span>Python</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
        <pre><code class="language-${lang}">${escaped}</code></pre>
      </div>`;
    }
  });

  area.innerHTML = `
    <div class="lesson-header">
      <a href="${colabUrl}" target="_blank" rel="noopener" class="colab-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        Запустить в Colab
      </a>
      ${nbTabsHtml}
    </div>
    ${cellsHtml}
    ${markCompleteBtn(mod.id)}
  `;
}

function switchNb(i) {
  currentNbIdx = i;
  renderLessons(COURSE[currentModIdx]);
  highlightAll();
}

// ===== QUIZ =====
function renderQuiz(mod) {
  const area = document.getElementById("content-area");
  const questions = parseQuiz(mod.quiz);

  if (questions.length === 0) {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.quiz) + '</div>';
    return;
  }

  let html = '<div class="quiz-score"><div class="quiz-score-num" id="quizScore">0/' + questions.length + '</div><div class="quiz-score-label">Правильных ответов</div></div>';

  questions.forEach((q, qi) => {
    html += `<div class="quiz-question" id="q${qi}">
      <h3>Вопрос ${qi + 1}: ${escapeHtml(q.question)}</h3>`;
    q.options.forEach((opt, oi) => {
      html += `<div class="quiz-option" data-q="${qi}" data-o="${oi}" data-correct="${opt.correct}" onclick="answerQuiz(this)">
        <div class="radio"></div>
        <span>${escapeHtml(opt.text)}</span>
      </div>`;
    });
    if (q.explanation) {
      html += `<div class="quiz-explanation" id="expl${qi}">${escapeHtml(q.explanation)}</div>`;
    }
    html += '</div>';
  });

  area.innerHTML = html;
}

let quizAnswered = {};
function answerQuiz(el) {
  const qi = el.dataset.q;
  if (quizAnswered[qi]) return;
  quizAnswered[qi] = true;
  const isCorrect = el.dataset.correct === "true";

  // Mark all options in this question
  document.querySelectorAll(`.quiz-option[data-q="${qi}"]`).forEach(opt => {
    if (opt.dataset.correct === "true") opt.classList.add("correct");
    else if (opt === el) opt.classList.add("wrong");
    opt.style.pointerEvents = "none";
  });

  // Show explanation
  const expl = document.getElementById("expl" + qi);
  if (expl) expl.classList.add("show");

  // Update score
  const total = document.querySelectorAll(".quiz-question").length;
  const correct = document.querySelectorAll(".quiz-option.correct").length;
  // Count unique correct answers
  const answered = Object.keys(quizAnswered).length;
  let score = 0;
  Object.keys(quizAnswered).forEach(k => {
    const chosen = document.querySelector(`.quiz-option[data-q="${k}"].correct`);
    // Check if user clicked the correct one
    const userClicked = document.querySelector(`.quiz-option[data-q="${k}"].wrong`);
    if (chosen && !userClicked) score++;
    else if (chosen) {
      // correct was highlighted but user may have clicked wrong
      const userEl = document.querySelector(`.quiz-option[data-q="${k}"].wrong`);
      if (!userEl) score++;
    }
  });
  document.getElementById("quizScore").textContent = score + "/" + total;
}

function parseQuiz(text) {
  const questions = [];
  const blocks = text.split(/###\s*Вопрос\s*\d+/i);
  blocks.shift(); // remove header
  blocks.forEach(block => {
    const lines = block.trim().split("\n");
    let question = "";
    let options = [];
    let explanation = "";

    // First non-empty line is the question
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i < lines.length) { question = lines[i].trim(); i++; }

    for (; i < lines.length; i++) {
      const line = lines[i].trim();
      const optMatch = line.match(/^-\s*\[(x| )\]\s*(.+)/i);
      if (optMatch) {
        options.push({ text: optMatch[2].trim(), correct: optMatch[1].toLowerCase() === "x" });
      }
      if (line.startsWith("*Объяснение*") || line.startsWith("**Объяснение**")) {
        explanation = line.replace(/^\*+Объяснение\*+:?\s*/, "").trim();
      }
    }

    if (question && options.length > 0) {
      questions.push({ question, options, explanation });
    }
  });
  return questions;
}

// ===== HELPERS =====
function renderMd(text) {
  if (!text) return '<p style="color:var(--text-muted)">Нет содержимого.</p>';
  if (typeof marked !== "undefined") {
    return marked.parse(text);
  }
  return '<pre>' + escapeHtml(text) + '</pre>';
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function highlightAll() {
  if (typeof Prism !== "undefined") {
    setTimeout(() => Prism.highlightAll(), 50);
  }
}

function copyCode(btn) {
  const code = btn.closest(".cell-code").querySelector("code");
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy", 2000);
  });
}

function markCompleteBtn(modId) {
  const isDone = completedLessons[modId];
  return `<button class="complete-btn${isDone ? ' done' : ''}" onclick="toggleComplete('${modId}', this)">
    ${isDone ? '&#10003; Пройдено' : 'Отметить как пройденное'}
  </button>`;
}

function toggleComplete(modId, btn) {
  if (completedLessons[modId]) {
    delete completedLessons[modId];
    btn.classList.remove("done");
    btn.innerHTML = "Отметить как пройденное";
  } else {
    completedLessons[modId] = true;
    btn.classList.add("done");
    btn.innerHTML = "&#10003; Пройдено";
  }
  localStorage.setItem("da2027_completed", JSON.stringify(completedLessons));
  updateProgress();
  buildSidebar();
}
