ING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Мониторинг качества агента за 30 дней\nСмоделируем дашборд мониторинга здоровья аналитического агента."}, {"type": "code", "content": "# Демонстрация: Метрики оценки качества LLM-as-a-Judge\ndays = np.arange(1, 31)\nfaithfulness = 95 + np.random.normal(0, 1.2, 30).clip(-3, 3)\nrelevance = 92 + np.random.normal(0, 1.5, 30).clip(-4, 4)\n\nagent_health_df = pd.DataFrame({\n    'День': days,\n    'Faithfulness (%)': faithfulness,\n    'Relevance (%)': relevance\n})\ndisplay(agent_health_df.tail(4).round(1))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Дашборд надежности AI-агента\nПостроим контрольную карту шухарта для отслеживания деградации качества агента."}, {"type": "code", "content": "# Визуализация мониторинга агента\nfig, ax = plt.subplots(figsize=(10, 4.8), dpi=110)\n\nax.plot(days, agent_health_df['Faithfulness (%)'], color=PRIMARY, linewidth=2, label='Faithfulness (Фактологичность %)')\nax.plot(days, agent_health_df['Relevance (%)'], color=SUCCESS, linewidth=2, label='Relevance (Релевантность %)')\n\nax.axhline(90.0, color=ALERT, linestyle='--', label='Критический порог SLA (90%)')\n\nax.set_title(\"Мониторинг качества аналитического AI-агента за 30 дней\", fontsize=12, fontweight='bold', pad=15)\nax.set_xlabel(\"День месяца\", fontsize=11)\nax.set_ylabel(\"Оценка качества (%)\", fontsize=11)\nax.set_ylim(85, 100)\nax.legend(loc='lower left', frameon=True, facecolor='#ffffff')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Проверка соблюдения SLA\nУбедитесь, что средний показатель Faithfulness за месяц превышает 90%."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmean_faith = agent_health_df['Faithfulness (%)'].mean()\nprint(f\"Средняя фактологичность агента: {mean_faith:.1f}%\")\n\nassert mean_faith >= 90.0, \"Средняя фактологичность должна быть выше 90%\"\nprint(\"✅ Тест успешно пройден: аналитический агент надежно соответствует SLA!\")"}, {"type": "markdown", "content": "### 💡 Непрерывный цикл улучшений (Quality Flywheel)\nЛогируйте 100% диалогов агента. Раз в неделю отбирайте сессии с низкой оценкой пользователя (Thumbs Down) и добавляйте их в тестовый бенчмарк (Golden Dataset) для предотвращения регрессий при обновлении промптов."}]}]}, {"id": "module_13_soft_skills_storytelling", "title": "Модуль 13. Soft Skills и Data Storytelling", "cat": "Soft Skills", "badge": "Коммуникация", "icon": "", "desc": "Пирамида Минто, юнит-экономика (LTV, CAC, Retention) и презентация выводов стейкхолдерам.", "readme": "# 💼 Модуль 13: Soft Skills, Юнит-экономика и Data Storytelling\n\n## 📌 О модуле\nСофт-скиллы — главный защитник аналитика от автоматизации. Написать код может нейросеть за 5 секунд. Но понять реальную боль бизнеса, договориться со стейкхолдерами, задать правильные вопросы и защитить инвестиции перед Советом Директоров может только человек с развитым критическим мышлением и эмпатией.\n\n## 🎯 Learning Outcomes\n- **Understand**: Систему продуктовых и финансовых метрик (LTV, CAC, Retention, Churn, ROI, Payback Period).\n- **Apply**: Методологию Problem Framing — перевод невнятной жалобы руководства в измеримую аналитическую гипотезу.\n- **Create**: Структуру презентации по Пирамиде Минто (Minto Pyramid Principle: вывод -> ключевые аргументы -> подтверждающие данные).\n- **Evaluate**: Оценка бизнес-эффекта и предотвращение ложных решений.\n\n## 📚 Уроки\n1. `lesson_01_business_metrics_unit_economics.ipynb` — Карта метрик бизнеса и формулы юнит-экономики.\n2. `lesson_02_problem_framing_for_ai.ipynb` — Problem Framing: как правильно задавать вопросы стейкхолдерам и ставить ТЗ.\n3. `lesson_03_minto_pyramid_and_c_level_presentations.ipynb` — Пирамида Минто и защита инсайтов перед C-level топ-менеджментом.\n4. `lesson_04_data_storytelling_case_study.ipynb` — Практикум Data Storytelling: превращаем скучную таблицу в экшн-план компании.\n5. `quiz.md` — Тест для закрепления.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 13 (Soft Skills & Storytelling)\n\n---\n\n### Вопрос 1\nКакое отношение LTV / CAC считается эталонным стандартом для устойчивого масштабирования бизнеса?\n- [ ] Ровно 1.0x (работа в ноль).\n- [x] От 3.0x и выше при сроке окупаемости (Payback) до 12 месяцев.\n- [ ] Менее 0.5x.\n*Объяснение*: Соотношение $\\ge 3$ компенсирует операционные расходы, налоги и оставляет чистую прибыль на развитие.\n\n---\n\n### Вопрос 2\nВ чем заключается принцип Пирамиды Минто при защите отчета перед топ-менеджментом?\n- [ ] Начинать презентацию с подробного описания процесса парсинга и очистки данных.\n- [x] Начинать сразу с ключевого вывода и рекомендуемого решения (Answer First), а затем подкреплять его аргументами и цифрами.\n- [ ] Не показывать цифры вообще.\n*Объяснение*: Руководители принимают решения; им в первую очередь нужен ответ на вопрос: «Что делать и какой экономический эффект?».\n\n---\n\n### Вопрос 3\nЧто такое Problem Framing в работе аналитика?\n- [ ] Оформление дашборда в корпоративные рамки.\n- [x] Процесс перевода абстрактной жалобы или идеи бизнеса в строго проверяемую систему метрик, гипотез и аналитических задач.\n- [ ] Установка Python библиотек.\n*Объяснение*: Problem Framing гарантирует, что аналитик решает настоящую корневую проблему, а не симптомы.\n\n---\n\n### Вопрос 4\nВ чем суть принципа Answer First в пирамиде Минто?\n- [ ] Отвечать на письма клиентов быстрее чем за 1 минуту.\n- [x] Начинать презентацию сразу с главного управленческого вывода или рекомендации, а затем подкреплять его логическими аргументами и деталями.\n- [ ] Никогда не показывать графики руководству.\n*Объяснение*: Руководители высшего звена мыслят решениями; подход Answer First экономит их время и фокусирует дискуссию.\n\n---\n\n### Вопрос 5\nЧто показывает метрика Payback Period (Срок окупаемости CAC) в юнит-экономике?\n- [ ] Время работы службы поддержки.\n- [x] Количество месяцев, за которое валовая прибыль от привлеченного клиента полностью покрывает затраты на его привлечение (CAC).\n- [ ] Срок действия банковской карты клиента.\n*Объяснение*: Здоровый Payback Period в B2B SaaS составляет менее 12 месяцев.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_business_metrics_unit_economics.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 1. Бизнес-метрики и Unit-экономика: CAC, LTV, Retention и маржинальность\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_01_business_metrics_unit_economics.ipynb)\n\n## 📌 Бизнес-контекст и методология\nАналитик, считающий только среднее и p-value, бесполезен бизнесу. \nГлавный язык общения с топ-менеджментом и инвесторами — **Unit-экономика**. \nОна отвечает на вопрос: «Зарабатывает ли компания на одном конкретном клиенте (юните), или каждый новый пользователь увеличивает чистый убыток?». \nЗолотое правило масштабирования стартапа: $LTV / CAC \\ge 3.0$ при сроке окупаемости (Payback Period) $< 12$ месяцев."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем Unit-экономику когорты: стоимость привлечения (CAC), валовую маржу, средний чек и итоговый LTV."}, {"type": "code", "content": "# Параметры Unit-экономики B2B SaaS продукта\ncac = 450.0            # Стоимость привлечения клиента ($)\narpu_month = 95.0      # Выручка в месяц ($)\ngross_margin = 0.82    # Валовая маржинальность (82%)\nchurn_rate_month = 0.04 # Месячный отток (4%)\n\nlifetime_months = 1 / churn_rate_month  # 25 месяцев\nltv = arpu_month * gross_margin * lifetime_months  # $1,947.50\nltv_cac_ratio = ltv / cac\npayback_months = cac / (arpu_month * gross_margin)\n\nprint(f\"LTV (Lifetime Value):   ${ltv:,.2f}\")\nprint(f\"CAC (Acquisition Cost): ${cac:,.2f}\")\nprint(f\"LTV / CAC отношение:    {ltv_cac_ratio:.2f}x (Здоровый бизнес > 3.0x)\")\nprint(f\"Срок окупаемости (Payback): {payback_months:.1f} мес.\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Водопад Unit-экономики (Waterfall Chart)\nВодопадная диаграмма ниже раскладывает валовую выручку на составляющие: от CAC и себестоимости серверов до чистой прибыли на клиента."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анатомия Unit-экономики клиента (LTV vs CAC)', fontsize=14, fontweight='bold')\n\n# 1. Водопад формирования чистой прибыли на юнит\nax1 = axes[0]\nstages = ['LTV (Выручка)', 'COGS (Серверы)', 'Поддержка', 'Маркетинг (CAC)', 'Чистый доход']\nvalues = [ltv, -ltv*(1-gross_margin), -120, -cac, 0]\nvalues[-1] = sum(values[:-1])\n\nbottoms = [0, ltv - ltv*(1-gross_margin), ltv - ltv*(1-gross_margin) - 120, ltv - ltv*(1-gross_margin) - 120 - cac, 0]\ncolors = ['#1779ba', '#cc4b37', '#cc4b37', '#ffae00', '#3adb76']\n\nbars = ax1.bar(stages, [abs(v) for v in values], bottom=bottoms, color=colors, edgecolor='white', width=0.55)\nax1.set_title(f'Waterfall прибыли: LTV/CAC = {ltv_cac_ratio:.1f}x', fontsize=11)\nax1.set_ylabel('Сумма на одного клиента ($)')\nax1.set_xticklabels(stages, rotation=25, ha='right', fontsize=9)\nax1.grid(True, linestyle=':', alpha=0.5)\n\nfor i, b in enumerate(bars):\n    val = values[i]\n    y_pos = bottoms[i] + b.get_height() / 2\n    sign = '+' if val > 0 else ''\n    ax1.text(b.get_x() + b.get_width()/2, y_pos, f'{sign}${val:,.0f}', ha='center', va='center',\n             color='white', fontweight='bold', fontsize=9)\n\n# 2. График окупаемости CAC во времени (Payback Curve)\nax2 = axes[1]\nmonths_timeline = np.arange(0, 37)\ncumulative_contribution = -cac + (arpu_month * gross_margin) * months_timeline\n\nax2.plot(months_timeline, cumulative_contribution, color='#1779ba', linewidth=2.5, label='Накопленный денежный поток')\nax2.axhline(0, color='#cc4b37', linestyle='--', linewidth=1.5, label='Точка безубыточности (0$)')\nax2.axvline(payback_months, color='#3adb76', linestyle=':', linewidth=2, label=f'Окупаемость = {payback_months:.1f} мес.')\nax2.fill_between(months_timeline, -cac, cumulative_contribution, where=(cumulative_contribution < 0), color='#cc4b37', alpha=0.15)\nax2.fill_between(months_timeline, 0, cumulative_contribution, where=(cumulative_contribution >= 0), color='#3adb76', alpha=0.15)\n\nax2.set_title('Кривая окупаемости привлечения клиента (Payback Timeline)', fontsize=11)\nax2.set_xlabel('Месяцев жизни клиента')\nax2.set_ylabel('Чистый финансовый итог ($)')\nax2.legend(loc='lower right')\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Влияние оттока на отношение LTV/CAC\nЕсли месячный отток вырастет с 4% до 7%, рассчитайте новое отношение LTV / CAC и определите, останется ли юнит-экономика здоровой (> 3.0x)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nnew_churn = 0.07\nnew_ltv = arpu_month * gross_margin * (1 / new_churn)\nnew_ratio = new_ltv / cac\n\nprint(f\"Новый LTV при оттоке 7%: ${new_ltv:,.2f}\")\nprint(f\"Новое отношение LTV/CAC:  {new_ratio:.2f}x\")\n\nassert new_ratio < ltv_cac_ratio, \"Рост оттока обязан снижать LTV/CAC\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главный урок Unit-экономики:\nСнижение оттока (Retention) влияет на LTV в разы сильнее, чем снижение стоимости привлечения (CAC). Удерживать старых клиентов всегда выгоднее, чем заливать дырявую воронку новым платным трафиком."}]}, {"filename": "lesson_02_problem_framing_for_ai.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 2. Problem Framing для AI: структурирование бизнес-проблем через Issue Trees\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_02_problem_framing_for_ai.ipynb)\n\n## 📌 Бизнес-контекст и методология\nГлавная причина провала аналитических проектов — ответ на «неправильно поставленный вопрос».\nБизнес-заказчик часто приходит с симптомом: *«У нас падают продажи в Q3, сделайте дашборд!»*.\nЕсли аналитик сразу бросается писать SQL, он тратит недели на бесполезные таблицы.\nФреймворк **Problem Framing (Issue Trees / MECE)** декомпозирует верхнеуровневую проблему на взаимоисключающие и исчерпывающие гипотезы."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения\nimport matplotlib.pyplot as plt\nimport matplotlib.patches as patches\nimport pandas as pd\nimport numpy as np\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: MECE Декомпозиция падения выручки\nВыручка ($Revenue$) математически раскладывается на независимые факторы:\n$$Revenue = Traffic \\times Conversion \\times AOV$$\nПадение может быть вызвано:\n1. Сокращением входящего трафика (маркетинг/SEO)\n2. Падением конверсии в покупку (UX баги, поломка платежного шлюза)\n3. Снижением среднего чека (изменение продуктового микса)"}, {"type": "code", "content": "# Демонстрация: Факторный анализ отклонения выручки (Waterfall / Factor Decomposition)\nfactors = {\n    'Фактор': ['План Q3', 'Трафик (-5%)', 'Конверсия (-12%)', 'Средний чек (+3%)', 'Факт Q3'],\n    'Влияние ($ тыс.)': [1000, -50, -114, 25, 861]\n}\ndf_factor = pd.DataFrame(factors)\ndisplay(df_factor)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Дерево гипотез (Issue Tree)\nПостроим структурированную диаграмму декомпозиции корневой причины падения выручки в стандарте McKinsey & Company."}, {"type": "code", "content": "# Построение визуальной карты Issue Tree\nfig, ax = plt.subplots(figsize=(12, 6), dpi=110)\nax.set_xlim(0, 100)\nax.set_ylim(0, 100)\nax.axis('off')\n\ndef draw_node(x, y, text, color, w=22, h=10, text_color='white'):\n    rect = patches.FancyBboxPatch((x, y), w, h, boxstyle=\"round,pad=0.8\", \n                                  edgecolor=\"#333333\", facecolor=color, linewidth=1.2)\n    ax.add_patch(rect)\n    ax.text(x + w/2, y + h/2, text, color=text_color, fontweight='bold', \n            fontsize=9.5, ha='center', va='center')\n\n# Уровень 1: Проблема\ndraw_node(2, 45, \"Проблема:\\nВыручка Q3 упала\\nна $139k (-13.9%)\", ALERT, w=22, h=14)\n\n# Уровень 2: Ветви MECE\ndraw_node(36, 75, \"Трафик (Traffic)\\nСнижение посещений\\n(-5.0% -> -$50k)\", SECONDARY, w=24, h=12)\ndraw_node(36, 46, \"Конверсия (CR)\\nСбой платежей iOS\\n(-12.0% -> -$114k)\", ALERT, w=24, h=12)\ndraw_node(36, 17, \"Средний чек (AOV)\\nСмена микса товаров\\n(+3.0% -> +$25k)\", SUCCESS, w=24, h=12)\n\n# Уровень 3: Корневые причины (Root Causes)\ndraw_node(72, 53, \"🚨 ROOT CAUSE:\\nБаг 3D-Secure\\nна iOS Safari\", ALERT, w=24, h=10)\ndraw_node(72, 39, \"Устаревшие промо-баннеры\\nв мобильной версии\", SECONDARY, w=24, h=9)\n\n# Соединительные линии\nlines = [\n    ((24, 52), (36, 81)),\n    ((24, 52), (36, 52)),\n    ((24, 52), (36, 23)),\n    ((60, 52), (72, 58)),\n    ((60, 52), (72, 43.5)),\n]\nfor p1, p2 in lines:\n    ax.annotate(\"\", xy=p2, xytext=p1, arrowprops=dict(arrowstyle=\"->\", color=\"#555555\", lw=1.8))\n\nax.set_title(\"MECE Issue Tree: Декомпозиция падения выручки интернет-магазина\", fontsize=13, fontweight='bold', pad=15)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет доли корневого фактора\nОпределите, какой процент от общего объема потерь ($164k негативных факторов) приходится на просадку конверсии."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nloss_traffic = 50\nloss_cr = 114\ntotal_loss = loss_traffic + loss_cr\n\ncr_loss_share = (loss_cr / total_loss) * 100\nprint(f\"Доля потерь от падения конверсии: {cr_loss_share:.1f}%\")\n\nassert 65 <= cr_loss_share <= 75, \"Доля конверсии должна составлять около 69.5%\"\nprint(\"✅ Тест успешно пройден: фокус внимания аналитика направлен на ключевой рычаг (конверсию)!\")"}, {"type": "markdown", "content": "### 💡 Принцип 80/20 в Problem Framing\nНикогда не проверяйте все гипотезы подряд. 80% падения метрики обычно обусловлено одной конкретной поломкой (в нашем кейсе — конверсия на iOS). Начинайте исследование с ветви с максимальным финансовым весом."}]}, {"filename": "lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 3. Пирамида Минто и презентации для C-Level: от данных к решениям\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_03_minto_pyramid_and_c_level_presentations.ipynb)\n\n## 📌 Бизнес-контекст и методология\nУ топ-менеджеров (CEO, CFO, CMO) нет времени слушать 40-минутный рассказ о том, как вы очищали данные в Pandas и настраивали гиперпараметры модели.\nКлассическая ошибка джуниор-аналитика — **хронологическая подача** («Сначала мы взяли данные, потом очистили, потом построили график, и вот в конце наш вывод...»).\nПринцип **Пирамиды Минто (Barbara Minto / McKinsey)** требует **инвертированной структуры подачи**:\n1. Главный вывод и рекомендация — в первые 30 секунд (The Lead / Bottom Line Up Front — BLUF)\n2. Ключевые аргументы поддержки (3 MECE пиллара)\n3. Детальные цифры и доказательства — только в приложении (Appendix)"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения\nimport matplotlib.pyplot as plt\nimport matplotlib.patches as patches\nimport pandas as pd\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\""}, {"type": "markdown", "content": "## 🔍 Разбор механики: Структура SCR (Situation -> Complication -> Resolution)\nФормула идеального введения к C-Level презентации:\n- **Situation (Ситуация):** Общеизвестный контекст бизнеса (*«В Q3 мы запустили редизайн чекаута»*)\n- **Complication (Осложнение):** Проблема, требующая решения (*«Конверсия на мобильных упала на 12%»*)\n- **Resolution (Решение):** Главная рекомендация с оцифрованным эффектом (*«Откат формы платежа вернет $114k выручки в месяц»*)"}, {"type": "code", "content": "# Демонстрация: Оцифровка бизнес-эффекта рекомендации для C-Level\nrecommendation_roi = pd.DataFrame({\n    'Стадия': ['Текущие потери в мес.', 'Стоимость исправления (Dev)', 'Чистый возврат за 12 мес. (Net ARR)'],\n    'Сумма ($ тыс.)': [-114, -15, 1353]\n})\ndisplay(recommendation_roi)"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Архитектура Пирамиды Минто\nНаглядная модель инвертированной пирамиды коммуникации для презентации руководству."}, {"type": "code", "content": "# Визуализация архитектуры Пирамиды Минто\nfig, ax = plt.subplots(figsize=(11, 6), dpi=110)\nax.set_xlim(0, 100)\nax.set_ylim(0, 100)\nax.axis('off')\n\n# Уровень 1: Главная мысль (BLUF)\nrect1 = patches.FancyBboxPatch((20, 72), 60, 18, boxstyle=\"round,pad=0.5\", \n                              facecolor=ALERT, edgecolor=\"#333333\", linewidth=1.2)\nax.add_patch(rect1)\nax.text(50, 81, \"1. ГЛАВНАЯ РЕКОМЕНДАЦИЯ (BLUF)\\nОткатить форму 3D-Secure на iOS Safari:\\nэто вернет +$114k в месяц при затратах $15k\", \n        color='white', fontweight='bold', fontsize=11, ha='center', va='center')\n\n# Уровень 2: 3 ключевых аргумента\nargs = [\n    (5, 42, 28, \"Аргумент 1 (Проблема)\\nСбой 3D-Secure\\nдает 69% всех потерь\", PRIMARY),\n    (36, 42, 28, \"Аргумент 2 (Финансы)\\nСтоимость фикса: $15k\\nROI: 9000% за год\", SUCCESS),\n    (67, 42, 28, \"Аргумент 3 (План)\\nHotfix готов\\nВыкатка займет 4 часа\", WARNING)\n]\nfor x, y, w, text, color in args:\n    rect = patches.FancyBboxPatch((x, y), w, 16, boxstyle=\"round,pad=0.5\", \n                                  facecolor=color, edgecolor=\"#333333\", linewidth=1.1)\n    ax.add_patch(rect)\n    ax.text(x + w/2, y + 8, text, color='white', fontweight='bold', fontsize=9, ha='center', va='center')\n\n# Уровень 3: База данных и доказательства\nrect3 = patches.FancyBboxPatch((5, 10), 90, 16, boxstyle=\"round,pad=0.5\", \n                              facecolor='#e8ecef', edgecolor=\"#767676\", linewidth=1)\nax.add_patch(rect3)\nax.text(50, 18, \"3. ДЕТАЛЬНЫЕ ДОКАЗАТЕЛЬСТВА (Appendix / Данные)\\nSQL логи транзакций, когортная воронка по устройствам, A/B тесты чекаута\", \n        color='#333333', fontweight='bold', fontsize=9.5, ha='center', va='center')\n\n# Стрелки иерархии\nfor x in [19, 50, 81]:\n    ax.annotate(\"\", xy=(x, 58), xytext=(50, 72), arrowprops=dict(arrowstyle=\"->\", color=\"#555555\", lw=1.8))\n    ax.annotate(\"\", xy=(x, 26), xytext=(x, 42), arrowprops=dict(arrowstyle=\"->\", color=\"#555555\", lw=1.5))\n\nax.set_title(\"Пирамида Минто: Индустриальный стандарт коммуникации с C-Level\", fontsize=13, fontweight='bold', pad=15)\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет срока окупаемости фикса (Payback Period)\nПри ежемесячных потерях $114k и затратах на исправление $15k, рассчитайте срок окупаемости в днях (при 30 днях в месяце)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ncost = 15000\ndaily_return = 114000 / 30\npayback_days = cost / daily_return\n\nprint(f\"Срок окупаемости хотфикса: {payback_days:.1f} дня!\")\n\nassert payback_days < 5, \"Окупаемость должна наступить быстрее чем за 5 дней\"\nprint(\"✅ Тест успешно пройден: сильнейший бизнес-аргумент для топ-менеджмента!\")"}, {"type": "markdown", "content": "### 💡 Правило одного слайда (The So What? Test)\nКаждый график на слайде для руководства должен содержать действие в заголовке.\nВместо *«Динамика конверсии по устройствам»* пишите: *«Конверсия на iOS упала на 12% из-за сбоя 3D-Secure — требуется срочный хотфикс»*."}]}, {"filename": "lesson_04_data_storytelling_case_study.ipynb", "rel_path": "course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 13. Урок 4. Сквозной кейс: Data Storytelling и структура «Что? Ну и что? Что делать?»\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_13_soft_skills_storytelling/lesson_04_data_storytelling_case_study.ipynb)\n\n## 📌 Бизнес-контекст и методология\nРуководители C-Level не хотят видеть сырой SQL или 20 разрозненных графиков без выводов. \nЭталонная подача аналитики строится по трехактной структуре McKinsey / Google:\n1. **Что произошло? (Fact):** Внезапное падение конверсии на 14% в июне.\n2. **Ну и что? (Impact & Root Cause):** Потери $120,000/мес; баг затронул только пользователей Safari на iOS 18.\n3. **Что делать? (Recommendation):** Срочный хотфикс платежного SDK + ретроспектива QA."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем временной ряд инцидента с конверсией и разложим его по браузерным сегментам."}, {"type": "code", "content": "np.random.seed(42)\ndates = pd.date_range('2026-06-01', periods=30, freq='D')\n\n# Нормальная конверсия 8.5%\nchrome_cr = 0.085 + np.random.normal(0, 0.003, 30)\n# Safari падает после релиза 12 июня\nsafari_cr = 0.085 + np.random.normal(0, 0.003, 30)\nsafari_cr[11:] -= 0.035  # обвал до 5.0%\n\ntotal_cr = 0.6 * chrome_cr + 0.4 * safari_cr\nprint(\"Средняя конверсия до 12 июня:   {:.2%}\".format(np.mean(total_cr[:11])))\nprint(\"Средняя конверсия после 12 июня: {:.2%}\".format(np.mean(total_cr[11:])))"}, {"type": "markdown", "content": "### 📊 Визуализация: Аннотированная нарративная диаграмма инцидента\nГрафик ниже оформлен в стиле The Economist и Financial Times: четкая аннотация момента релиза, подсветка корневой причины и стрелка решения."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(14, 6))\n\nax.plot(dates, chrome_cr * 100, color='#767676', linewidth=2, linestyle='--', label='Chrome (Стабилен 8.5%)')\nax.plot(dates, safari_cr * 100, color='#cc4b37', linewidth=2.5, label='Safari iOS (Обвал с 12 июня до 5.0%)')\nax.plot(dates, total_cr * 100, color='#1779ba', linewidth=3, label='Общая конверсия чекаута')\n\n# Аннотация инцидента\nrelease_date = dates[11]\nax.axvline(release_date, color='#cc4b37', linestyle=':', linewidth=2)\nax.scatter(release_date, safari_cr[11] * 100, color='#cc4b37', s=100, zorder=5)\n\nax.annotate('Релиз v2.4 (12 июня):\\nБаг верстки кнопки оплаты\\nна Safari iOS',\n            xy=(release_date, safari_cr[11] * 100),\n            xytext=(dates[13], 4.0),\n            arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=2),\n            fontweight='bold', color='#cc4b37', bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#fff2f0\", ec=\"#cc4b37\"))\n\n# Аннотация хотфикса\nax.annotate('Рекомендация:\\nОткат платежного SDK\\nвернет +$120K/мес',\n            xy=(dates[25], total_cr[25] * 100),\n            xytext=(dates[20], 8.8),\n            arrowprops=dict(arrowstyle=\"->\", color='#3adb76', lw=2),\n            fontweight='bold', color='#2d864e', bbox=dict(boxstyle=\"round,pad=0.4\", fc=\"#f0fff4\", ec=\"#3adb76\"))\n\nax.set_title('Data Storytelling: Что произошло с конверсией в июне и где источник проблемы?', fontsize=13, fontweight='bold')\nax.set_xlabel('Дата')\nax.set_ylabel('Конверсия в заказ (%)')\nax.set_ylim(3.0, 10.5)\nax.legend(loc='lower left')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет финансовых потерь от инцидента\nЕсли в день на чекаут заходят 10,000 пользователей, средний чек $45, а падение конверсии составило 1.4 п.п. (0.014), сколько компания теряет за 18 дней бага?"}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndaily_visitors = 10000\naov = 45.0\ncr_drop = 0.014\ndays_incident = 18\n\nlost_orders_daily = daily_visitors * cr_drop\ntotal_revenue_loss = lost_orders_daily * aov * days_incident\n\nprint(f\"Потеряно заказов в день: {int(lost_orders_daily)}\")\nprint(f\"Суммарные потери выручки: ${total_revenue_loss:,.0f}\")\n\nassert total_revenue_loss == 113400.0, \"Потери: 10000 * 0.014 * 45 * 18 = 113,400$\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Золотое правило C-Level презентации:\nВсегда завершайте аналитический отчет слайдом с конкретным планом действий (Action Items), ответственными лицами и ожидаемым финансовым эффектом в долларах."}]}]}, {"id": "module_14_portfolio_project_1", "title": "Проект 1. E-Commerce 360 аудит", "cat": "Портфолио", "badge": "Проект", "icon": "", "desc": "Сквозной аудит 15 000+ заказов: когортный анализ, LTV, выручка, воронка конверсий.", "readme": "# 🛒 Портфолио-проект 1: Сквозная E-Commerce аналитика 360°\n\n## 📌 Описание проекта\nПолноценный аудит интернет-магазина на основе реальной базы заказов (15 000+ позиций, база `ecommerce.db`):\n1. **SQL Витрина**: Расчет LTV, среднего чека, маржинальности.\n2. **Pandas & Python**: Когортный анализ удержания (Retention Rate Matrix) и RFM-сегментация клиентов.\n3. **Looker Studio**: Создание интерактивного дашборда для коммерческого директора.\n4. **Бизнес-отчет**: Аналитическая записка с точками роста выручки.\n\n## 📁 Файлы\n- `project_1_ecommerce_analytics.ipynb` — Полный рабочий ноутбук выполнения проекта от SQL до визуализации.\n", "quiz": "# 🧠 Quiz: Защита Проекта 1 (E-Commerce 360°)\n\n---\n\n### Вопрос 1\nЧто показывает RFM-сегментация клиентской базы?\n- [ ] Скорость загрузки карточек товаров на сайте.\n- [x] Сегментацию клиентов по трем измерениям: давность последней покупки (Recency), частота заказов (Frequency) и общая сумма затрат (Monetary).\n- [ ] Ошибки в артикулах товаров на складе.\n*Объяснение*: RFM позволяет точечно адресовать маркетинг: удерживать VIP-клиентов и реактивировать уходящих.\n\n---\n\n### Вопрос 2\nКакое главное действие должен предпринять отдел маркетинга для сегмента «At Risk» (высокая частота в прошлом, но давно не покупали)?\n- [ ] Не беспокоить их, чтобы не раздражать.\n- [x] Запустить персональную триггерную реактивацию со скидкой или бонусами, пока клиент окончательно не ушел к конкурентам.\n- [ ] Удалить их контакты из базы.\n*Объяснение*: Клиенты «At Risk» уже знакомы с брендом и имеют высокий LTV; их реактивация гораздо дешевле привлечения нового холодного трафика.\n\n---\n\n### Вопрос 3\nПочему при расчете когортного Retention важно группировать клиентов по месяцу первой покупки, а не по месяцу регистрации?\n- [ ] Месяц регистрации всегда совпадает с месяцем покупки.\n- [x] Аналитика интересует удержание платящих клиентов; регистрация без покупки не генерирует юнит-экономику.\n- [ ] Это требование стандарта SQL.\n*Объяснение*: Retention платящих пользователей показывает реальную ценность продукта (Product-Market Fit) и возврат инвестиций в привлечение (CAC).\n\n---\n\n### Вопрос 4\nВ таблице `orders` интернет-магазина статус заказа равен `'Refunded'`. Как учесть этот заказ при расчете чистой выручки (Net Revenue)?\n- [ ] Проигнорировать возврат, так как деньги поступили на счет.\n- [x] Исключить данный заказ из расчета чистой выручки либо вычесть сумму возврата из валового оборота.\n- [ ] Умножить сумму на два.\n*Объяснение*: Возвраты не являются выручкой и при искажении отчетности приведут к выплате незаработанных бонусов и неверному учету налогов.\n\n---\n\n### Вопрос 5\nПо результатам когортного анализа Retention 2-го месяца упал с 25% до 14%. Каково первое действие аналитика?\n- [ ] Немедленно переписать SQL-запрос.\n- [x] Сегментировать просевшую когорту по рекламным каналам, устройствам и категориям первого купленного товара.\n- [ ] Увеличить скидки на весь каталог.\n*Объяснение*: Локализация просадки позволяет понять истинную причину: приток нецелевого трафика из нового канала или баг в мобильном приложении.\n", "cheatsheet": "", "notebooks": [{"filename": "project_1_ecommerce_analytics.ipynb", "rel_path": "course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 🛒 Выпускной проект 1: Сквозной аудит интернет-магазина (E-Commerce 360° Audit)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_14_portfolio_project_1/project_1_ecommerce_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт флагманского проекта\n* **Заказчик**: Коммерческий директор маркетплейса (Retail & E-commerce).\n* **Проблема**: За последние два квартала темп роста выручки замедлился. Заказчик подозревает просадку повторных покупок (LTV) и неэффективность платных каналов привлечения.\n* **Стек**: SQL (SQLite/PostgreSQL), Python (Pandas, NumPy, Seaborn), RFM-сегментация, когортный анализ, Pyramid Principle.\n* **Цель**: Провести глубокий аудит клиентской базы, сегментировать клиентов по ценности (RFM), оценить Retention по когортам и составить Executive Presentation для C-Level с конкретным планом действий."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: SQL-аналитика когорт и жизненного цикла клиентов\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\nconn = sqlite3.connect(db_path)\n\n# SQL-запрос для извлечения витрины RFM (Recency, Frequency, Monetary)\nquery_rfm = \"\"\"\nWITH customer_aggregates AS (\n    SELECT \n        c.customer_id,\n        c.city,\n        c.acquisition_channel,\n        c.device,\n        MAX(o.order_date) AS last_order_date,\n        COUNT(DISTINCT o.order_id) AS total_orders,\n        ROUND(SUM(oi.total_amount), 2) AS total_monetary\n    FROM customers c\n    JOIN orders o ON c.customer_id = o.customer_id\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY c.customer_id\n)\nSELECT \n    customer_id,\n    city,\n    acquisition_channel,\n    device,\n    last_order_date,\n    total_orders,\n    total_monetary\nFROM customer_aggregates;\n\"\"\"\n\ndf_rfm_raw = pd.read_sql_query(query_rfm, conn)\nprint(f\"📊 Извлечено активных покупателей с завершенными заказами: {len(df_rfm_raw):,}\")\nprint(df_rfm_raw.head())\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Построение скоринга RFM и кластеризация клиентов\nРассчитайте:\n1. `recency_days`: количество дней с момента последней покупки клиента до максимальной даты базы (`2026-10-31`).\n2. Скоринг R, F, M по квантилям (от 1 до 4, где 4 — наилучший результат).\n3. Создайте сегмент `'Champions'` для клиентов с `R_score >= 3` и `M_score >= 3`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsnapshot_date = pd.to_datetime('2026-10-31')\ndf_rfm = df_rfm_raw.copy()\ndf_rfm['last_order_date'] = pd.to_datetime(df_rfm['last_order_date'])\ndf_rfm['recency_days'] = (snapshot_date - df_rfm['last_order_date']).dt.days\n\n# Расчет баллов RFM\ndf_rfm['r_score'] = pd.qcut(df_rfm['recency_days'], q=4, labels=[4, 3, 2, 1]).astype(int)\ndf_rfm['f_score'] = pd.qcut(df_rfm['total_orders'].rank(method='first'), q=4, labels=[1, 2, 3, 4]).astype(int)\ndf_rfm['m_score'] = pd.qcut(df_rfm['total_monetary'], q=4, labels=[1, 2, 3, 4]).astype(int)\n\ndf_rfm['segment'] = np.where(\n    (df_rfm['r_score'] >= 3) & (df_rfm['m_score'] >= 3),\n    'Champions',\n    np.where(df_rfm['r_score'] <= 2, 'At Risk / Churn', 'Regular')\n)\n\nsegment_stats = df_rfm.groupby('segment').agg(\n    users=('customer_id', 'count'),\n    revenue=('total_monetary', 'sum'),\n    avg_orders=('total_orders', 'mean')\n).reset_index()\n\nprint(\"📊 Результаты RFM-сегментации:\")\nprint(segment_stats)\n\nassert len(df_rfm[df_rfm['segment'] == 'Champions']) > 0, \"Сегмент Champions должен быть не пустым\"\nassert df_rfm['total_monetary'].sum() > 0, \"Сумма выручки должна быть положительной\"\nprint(\"✅ Тест успешно пройден: RFM-модель построена корректно!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: RFM-Сегментация клиентской базы и Выручка сегментов\nГрафики ниже представляют ключевой артефакт портфолио проекта:\n1. **RFM 2D Скаттер:** сегменты клиентов (Champions, Loyal, At Risk, Hibernating) по давности последнего заказа и чеку;\n2. **Вклад сегментов в общую выручку бизнеса ($).**"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport numpy as np\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('RFM Customer Segmentation & Revenue Contribution', fontsize=14, fontweight='bold')\n\n# 1. Скаттер Recency vs Monetary\nax1 = axes[0]\nnp.random.seed(42)\nn_cust = 300\nrecency = np.random.exponential(45, n_cust)\nmonetary = np.random.exponential(250, n_cust) + 20\n\n# Кластеризация по правилам RFM\nsegments = []\ncolors_seg = []\nfor r, m in zip(recency, monetary):\n    if r < 30 and m > 300:\n        segments.append('VIP / Champions')\n        colors_seg.append('#3adb76')\n    elif r < 60:\n        segments.append('Loyal Customers')\n        colors_seg.append('#1779ba')\n    elif m > 200:\n        segments.append('At Risk / Big Spenders')\n        colors_seg.append('#ffae00')\n    else:\n        segments.append('Lost / Hibernating')\n        colors_seg.append('#cc4b37')\n\nscatter = ax1.scatter(recency, monetary, c=colors_seg, alpha=0.7, s=40, edgecolor='white')\nax1.set_title('RFM Сегменты: Давность (Recency) vs Выручка (Monetary)', fontsize=11)\nax1.set_xlabel('Дней с последней покупки (Recency)')\nax1.set_ylabel('Общая сумма покупок ($)')\nax1.axvline(60, color='#767676', linestyle=':', label='Порог риска оттока (60 дней)')\nax1.legend(loc='upper right')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Выручка по сегментам\nax2 = axes[1]\nseg_series = pd.Series(segments)\nmon_series = pd.Series(monetary)\nrev_by_seg = mon_series.groupby(seg_series).sum().sort_values()\n\nbars = ax2.barh(rev_by_seg.index, rev_by_seg.values / 1000,\n                color=['#cc4b37', '#ffae00', '#1779ba', '#3adb76'], edgecolor='white', height=0.55)\nax2.set_title('Суммарная выручка по сегментам клиентов ($K)', fontsize=11)\nax2.set_xlabel('Выручка ($K)')\nfor b in bars:\n    w = b.get_width()\n    ax2.text(w + 0.5, b.get_y() + b.get_height()/2, f'${w:.1f}K', va='center', fontweight='bold', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 📌 ЭТАП 3: C-Level Executive Summary (Minto Pyramid)\n1. **Answer First**: Главный драйвер выручки — сегмент Champions (обеспечивает свыше 40% денежного оборота).\n2. **Key Action**: Запустить автоматические retention-рассылки для сегмента 'At Risk' через 30 дней после заказа.\n3. **Budget Impact**: Предотвращение оттока 15% рисковых клиентов сохранит 2.4 млн руб. выручки в следующем квартале."}]}]}, {"id": "module_15_portfolio_project_2", "title": "Проект 2. SaaS аналитика и A/B тест", "cat": "Портфолио", "badge": "Проект", "icon": "", "desc": "Анализ 2 000 пользователей, оценка воронки активации и расчет результатов A/B теста фичи.", "readme": "# 📱 Портфолио-проект 2: SaaS Продуктовая аналитика и A/B Тестирование\n\n## 📌 Описание проекта\nАнализ продуктовых метрик B2B SaaS платформы (2000 компаний, датасет `saas_users.csv`):\n1. **Воронка активации**: Использование ключевых фичей A и B.\n2. **Анализ оттока (Churn Analysis)**: Влияние NPS и тарифа на удержание клиентов.\n3. **A/B Эксперимент**: Полный статистический анализ нового флоу оплаты (Z-test, проверка SRM, расчет доверительных интервалов).\n\n## 📁 Файлы\n- `project_2_saas_product_analytics.ipynb` — Сквозной рабочий ноутбук проекта.\n", "quiz": "# 🧠 Quiz: Защита Проекта 2 (SaaS Product Analytics & A/B)\n\n---\n\n### Вопрос 1\nПочему перед расчетом конверсий в A/B-тесте обязательно проводить проверку на SRM (Sample Ratio Mismatch)?\n- [ ] Чтобы проверить скорость интернета.\n- [x] Потому что неравномерное распределение трафика указывает на технический баг рандомизатора (например, отвал пользователей на старых браузерах), делая любые выводы о конверсии невалидными.\n- [ ] Это формальное требование без математического смысла.\n*Объяснение*: Если одна группа системно теряет пользователей до попадания в лог, выборки смещены.\n\n---\n\n### Вопрос 2\nЕсли $p\\text{-value} = 0.008$ при пороге $\\alpha = 0.05$, какое решение принимает продуктовый аналитик?\n- [ ] Отклонить альтернативную гипотезу и продолжить тест.\n- [x] Отклонить нулевую гипотезу (разница статистически значима) и при отсутствии деградации защитных метрик рекомендовать раскатку фичи.\n- [ ] Перезагрузить сервер.\n*Объяснение*: $p < \\alpha$ означает статистическую достоверность зафиксированного эффекта.\n\n---\n\n### Вопрос 3\nA/B-тест показал рост конверсии в подписку на +12%, но защитная метрика Churn Rate 1-го месяца выросла на 4 п.п. Что должен рекомендовать аналитик?\n- [ ] Срочно раскатать новую форму на 100% пользователей.\n- [x] Заблокировать раскатку: рост кратковременной конверсии нивелируется ускоренным оттоком клиентов, снижая общий LTV.\n- [ ] Отключить мониторинг Churn Rate.\n*Объяснение*: Защитные метрики (Guardrail Metrics) страхуют бизнес от «токсичной оптимизации» локальных показателей в ущерб долгосрочной экономике.\n\n---\n\n### Вопрос 4\nЧто такое Net Revenue Retention (NRR) в B2B SaaS и почему инвесторы ставят его выше обычной выручки?\n- [ ] Процент пользователей, заходящих в приложение каждый день.\n- [x] Процент удержания выручки от существующей когорты клиентов с учетом апгрейдов, даунгрейдов и оттока (здоровый NRR > 110%).\n- [ ] Сумма налога на прибыль.\n*Объяснение*: NRR > 100% означает, что бизнес растет даже без привлечения новых клиентов за счет расширения существующих контрактов.\n\n---\n\n### Вопрос 5\nВ ходе A/B теста получено $p\\text{-value} = 0.18$ при наблюдаемом относительном приросте конверсии +8.9%. Каково корректное управленческое решение?\n- [ ] Объявить победу тестовой группы, так как +8.9% — это отличный рост.\n- [x] Заморозить раскатку: наблюдаемый прирост статистически не отличим от случайного шума на текущем размере выборки.\n- [ ] Удалить группу A.\n*Объяснение*: Раскатка фичи с $p > 0.05$ несет высокий риск внедрения пустышки, которая потратит ресурсы инженеров без реального бизнес-эффекта.\n", "cheatsheet": "", "notebooks": [{"filename": "project_2_saas_product_analytics.ipynb", "rel_path": "course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 📱 Выпускной проект 2: Продуктовая аналитика B2B SaaS и статистический A/B аудит\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_15_portfolio_project_2/project_2_saas_product_analytics.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт проекта\n* **Продукт**: Облачная платформа аналитики подписок (SaaS).\n* **Бизнес-задача**:\n  1. Выявить скрытые триггеры оттока (Churn Analysis) на базе поведения пользователей (`saas_users.csv`).\n  2. Провести сквозной статистический аудит A/B-эксперимента новой формы онбординга (`ab_test_checkout.csv`): проверка SRM, расчет Z-теста и бутстрэпа, экономическая оценка раскатки."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: Аудит факторов оттока (Churn Drivers)\nimport pandas as pd\nimport numpy as np\nfrom scipy import stats\n\ndf_saas = pd.read_csv(saas_csv)\n\n# Анализ зависимости оттока от использования фич (Feature Adoption)\nfeature_usage_churn = df_saas.groupby('is_churned').agg(\n    avg_nps=('nps_score', 'mean'),\n    avg_seats=('active_seats', 'mean'),\n    avg_feature_a=('feature_a_usage', 'mean'),\n    avg_feature_b=('feature_b_usage', 'mean'),\n    avg_mrr=('mrr', 'mean')\n).reset_index()\n\nprint(\"📊 Сравнение характеристик активных (0) и оттекших (1) клиентов:\")\nprint(feature_usage_churn)\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Статистический анализ A/B теста онбординга\n1. Проверьте A/B тест на Sample Ratio Mismatch (SRM) через `stats.chisquare`.\n2. Рассчитайте конверсию групп A (Control) и B (Variant).\n3. Проведите двусторонний Z-тест для разницы конверсий и сделайте вывод о значимости."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ndf_ab = pd.read_csv(ab_csv)\n\n# 1. SRM Check\ncounts = df_ab['test_group'].value_counts()\nstat_srm, p_srm = stats.chisquare(counts.values, [len(df_ab)/2, len(df_ab)/2])\nprint(f\"SRM Chi2: {stat_srm:.3f}, p-value: {p_srm:.4f}\")\nassert p_srm > 0.01, \"SRM не обнаружен, группы разделены честно\"\n\n# 2. Conversion Analysis\ncr_a = df_ab[df_ab['test_group'] == 'A_Control']['converted'].mean()\ncr_b = df_ab[df_ab['test_group'] == 'B_Variant']['converted'].mean()\nn_a = len(df_ab[df_ab['test_group'] == 'A_Control'])\nn_b = len(df_ab[df_ab['test_group'] == 'B_Variant'])\n\nuplift_rel = (cr_b - cr_a) / cr_a\npooled_p = (cr_a * n_a + cr_b * n_b) / (n_a + n_b)\nse = np.sqrt(pooled_p * (1 - pooled_p) * (1/n_a + 1/n_b))\nz_score = (cr_b - cr_a) / se\np_value = 2 * (1 - stats.norm.cdf(abs(z_score)))\n\nprint(f\"CR A: {cr_a:.2%}, CR B: {cr_b:.2%}, Относительный прирост: +{uplift_rel:.1%}\")\nprint(f\"Z-score: {z_score:.3f}, p-value: {p_value:.4e}\")\n\nis_significant = p_value < 0.05\nprint(f\"Статистическая значимость на уровне alpha=0.05: {is_significant}\")\n\nassert not is_significant, \"На текущей выборке различия не достигли порога alpha=0.05\"\nassert uplift_rel > 0, \"Наблюдаемый точечный uplift положителен, но статистически не подтвержден\"\nprint(\"✅ Тест успешно пройден: аналитик избежал ложноположительной ошибки (False Discovery)!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: Тепловая карта когортного удержания (Cohort Retention)\nЗолотой стандарт продуктовой аналитики B2B SaaS: удержание пользователей по когортам регистрации от Месяца 0 до Месяца 11."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport seaborn as sns\n\n# Моделирование матрицы когортного удержания (12 месяцев x 12 когорт)\ncohort_labels = [f'2025-{m:02d}' for m in range(1, 13)]\nn_cohorts = len(cohort_labels)\nretention_matrix = np.full((n_cohorts, n_cohorts), np.nan)\n\nfor i in range(n_cohorts):\n    base_ret = 1.0\n    for j in range(n_cohorts - i):\n        if j == 0:\n            retention_matrix[i, j] = 100.0\n        else:\n            # Логарифмический спад с выходом на плато\n            decay = 0.55 * np.exp(-0.35 * j) + 0.35\n            retention_matrix[i, j] = decay * 100.0 + np.random.normal(0, 1.2)\n\nfig, ax = plt.subplots(figsize=(14, 7))\nsns.heatmap(retention_matrix, annot=True, fmt='.0f', cmap='Blues', ax=ax,\n            xticklabels=[f'M+{m}' for m in range(n_cohorts)],\n            yticklabels=cohort_labels, cbar_kws={'label': 'Retention Rate (%)'})\n\nax.set_title('SaaS Cohort Retention Matrix (Плато удержания на уровне ~35%)', fontsize=13, fontweight='bold')\nax.set_xlabel('Месяцев с момента регистрации (Lifetime)')\nax.set_ylabel('Когорта регистрации')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 💼 ЭТАП 3: C-Level вердикт по эксперименту\n* Наблюдаемый прирост конверсии составляет +8.9%, однако $p = 0.18 > 0.05$.\n* Риск ошибки I рода (ложная тревога) превышает допустимый порог.\n* **Управленческое решение**: Раскатку на 100% заморозить до сбора расчетного Sample Size либо признать эффект статистическим шумом, сэкономив ресурсы разработки на поддержку сырой функциональности."}]}]}, {"id": "module_16_portfolio_project_3", "title": "Проект 3. AI-Driven аналитический пайплайн", "cat": "Портфолио", "badge": "Проект", "icon": "", "desc": "Обработка 800+ отзывов через LLM API, категоризация болей и интерактивный дашборд.", "readme": "# 🤖 Портфолио-проект 3: AI-Driven Analytical Pipeline & Smart BI Chat\n\n## 📌 Описание проекта (Флагманский проект 2027 года)\nЭтот проект выделит ваше резюме среди сотен классических кандидатов. Мы строим сквозную AI-систему:\n1. **Сбор неструктурированных данных**: Отзывы клиентов из `customer_reviews.csv`.\n2. **LLM API Обогащение**: Извлечение тем жалоб, sentiment-анализ и структурирование в JSON.\n3. **RAG База знаний**: Индексация метрик компании в векторной БД ChromaDB.\n4. **Smart BI Agent**: Чат-ассистент, который принимает вопрос на человеческом языке, находит контекст в регламентах, пишет SQL-запрос к `ecommerce.db` и отдает бизнес-ответ с визуализацией!\n\n## 📁 Файлы\n- `project_3_ai_driven_bi_pipeline.ipynb` — Полный код пайплайна.\n", "quiz": "# 🧠 Quiz: Защита Проекта 3 (AI-Driven BI Pipeline)\n\n---\n\n### Вопрос 1\nКакова ключевая ценность связки LLM API + Векторная БД (RAG) в аналитическом пайплайне компании?\n- [ ] Полная замена живых сотрудников на роботов.\n- [x] Возможность автоматически структурировать до 80% закрытых корпоративных данных (отзывы, регламенты, документация) и открывать к ним мгновенный семантический доступ на естественном языке без галлюцинаций.\n- [ ] Увеличение расхода памяти на сервере.\n*Объяснение*: RAG объединяет вычислительную мощь LLM с актуальными закрытыми данными компании.\n\n---\n\n### Вопрос 2\nЧто обеспечивает надежную защиту от галлюцинаций в корпоративном Text-to-SQL ассистенте?\n- [x] Ограничение генерации SQL к реальной DDL схеме БД, проверка через EXPLAIN/AST и запрет деструктивных операций (DROP/DELETE).\n- [ ] Отключение интернета.\n- [ ] Использование исключительно коротких вопросов от пользователей.\n*Объяснение*: Верификация схемы и AST-валидация гарантируют надежность получаемых цифр до передачи данных в BI.\n\n---\n\n### Вопрос 3\nЗачем при построении RAG-ассистента над метаданными хранилища использовать гибридный поиск (Keyword + Semantic Vector Search)?\n- [ ] Векторный поиск не умеет работать со строками.\n- [x] Векторный поиск находит контекстный смысл («выручка компании»), а ключевой поиск точно матчит технические идентификаторы колонок (`fct_mrr_v2`).\n- [ ] Это снижает объем оперативной памяти в 10 раз.\n*Объяснение*: Гибридный поиск дает наивысшую точность (Recall@K) при поиске по техническим схемам баз данных.\n\n---\n\n### Вопрос 4\nКакой механизм позволяет подавать на вход LLM API миллионы клиентских обращений без риска перерасхода бюджета компании?\n- [ ] Ручной ввод текстов в веб-интерфейс чат-бота.\n- [x] Использование асинхронного Batch API со скидкой 50% и Prompt Caching для системных инструкций.\n- [ ] Отказ от парсинга текста.\n*Объяснение*: Batch API и кэширование префиксов — ключевые инструменты FinOps для больших корпусов данных.\n\n---\n\n### Вопрос 5\nЧто такое Self-Correction Loop в агентных аналитических системах?\n- [ ] Автоматическое удаление неверных строк из исходной базы данных.\n- [x] Механизм, при котором агент перехватывает ошибку выполнения SQL-запроса, анализирует текст ошибки и автоматически генерирует исправленный запрос.\n- [ ] Перезагрузка виртуальной машины при сбое скрипта.\n*Объяснение*: ReAct цикл с самокоррекцией позволяет агенту устранять синтаксические опечатки без участия человека.\n", "cheatsheet": "", "notebooks": [{"filename": "project_3_ai_driven_bi_pipeline.ipynb", "rel_path": "course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 🤖 Выпускной проект 3: AI-Driven Analytical Pipeline & Smart BI Assistant\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_16_portfolio_project_3/project_3_ai_driven_bi_pipeline.ipynb)\n\n## 📌 Бизнес-контекст и методология\n### 📌 Паспорт флагманского AI-проекта 2027 года\n* **Миссия**: Построить сквозную систему умного анализа обратной связи клиентов и автоматической SQL-аналитики.\n* **Архитектура пайплайна**:\n  1. **Семантическая разметка отзывов**: автоматическая классификация проблем через кластеризацию и ключевые слова.\n  2. **Векторный поиск по метаданным метрик**: нахождение формул и таблиц корпоративного хранилища.\n  3. **Text-to-SQL движок с валидацией**: перевод бизнес-вопроса в проверенный SQL с защитой от галлюцинаций."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка базы данных e-commerce и csv файлов\ndb_path = ensure_dataset(\"ecommerce.db\", subfolder=\"\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение и все корпоративные датасеты готовы к анализу.\")\n"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных"}, {"type": "code", "content": "# ЭТАП 1: Обработка неструктурированных отзывов клиентов\nimport pandas as pd\nimport numpy as np\n\ndf_reviews = pd.read_csv(reviews_csv)\nprint(f\"Загружено отзывов клиентов: {len(df_reviews):,}\")\n\n# Функция семантической классификации обращений\ndef classify_support_ticket(text):\n    t = str(text).lower()\n    if any(w in t for w in ['доставк', 'курьер', 'опоздал', 'задержк']):\n        return 'Logistics_Delay'\n    elif any(w in t for w in ['списал', 'плат', 'деньг', 'чек', 'возврат']):\n        return 'Billing_Payment'\n    elif any(w in t for w in ['сломал', 'баг', 'ошибк', 'вылетает', 'кнопк']):\n        return 'Technical_Bug'\n    else:\n        return 'General_Feedback'\n\ndf_reviews['issue_category'] = df_reviews['text'].apply(classify_support_ticket)\nprint(\"📊 Распределение категорий обращений:\")\nprint(df_reviews['issue_category'].value_counts())\n"}, {"type": "markdown", "content": "### 🎯 ЭТАП 2: Построение Smart Text-to-SQL Assistant с AST-валидатором\nРеализуйте генератор SQL-запросов по бизнес-вопросу и функцию валидации синтаксиса через SQLite `EXPLAIN`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nimport sqlite3\n\ndef generate_and_validate_sql(user_query, conn):\n    \"\"\"Генерирует SQL и валидирует план выполнения через EXPLAIN.\"\"\"\n    # Имитация выбора шаблона на основе семантики запроса\n    q_lower = user_query.lower()\n    if \"выручк\" in q_lower or \"revenue\" in q_lower:\n        sql = \"\"\"\n        SELECT strftime('%Y-%m', o.order_date) AS month, ROUND(SUM(oi.total_amount), 2) AS monthly_revenue\n        FROM orders o\n        JOIN order_items oi ON o.order_id = oi.order_id\n        WHERE o.status = 'Completed'\n        GROUP BY month\n        ORDER BY month DESC\n        LIMIT 6;\n        \"\"\"\n    else:\n        sql = \"SELECT COUNT(*) AS total_customers FROM customers;\"\n        \n    # Проверка через EXPLAIN\n    cur = conn.cursor()\n    cur.execute(f\"EXPLAIN QUERY PLAN {sql}\")\n    plan = cur.fetchall()\n    \n    # Реальное выполнение\n    res_df = pd.read_sql_query(sql, conn)\n    return sql, res_df\n\nconn = sqlite3.connect(db_path)\ngenerated_sql, result_df = generate_and_validate_sql(\"Какова помесячная динамика выручки маркетплейса?\", conn)\n\nprint(\"🟢 Сгенерированный SQL валиден и выполнен успешно:\")\nprint(result_df)\n\nassert len(result_df) > 0, \"Результат запроса не должен быть пустым\"\nassert \"monthly_revenue\" in result_df.columns, \"Целевая метрика выручки должна присутствовать\"\nprint(\"✅ Тест успешно пройден: AI-ассистент сформировал валидный отчет!\")\n"}, {"type": "markdown", "content": "### 📊 Визуализация: Мониторинг AI-пайплайна и Тренды настроений клиентов\nНиже — аналитическая панель сквозного мониторинга: тональность отзывов по платформам и автоматический тренд с доверительным коридором."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('AI-Driven Pipeline Monitoring & Sentiment Breakdown', fontsize=14, fontweight='bold')\n\n# 1. Тональность отзывов по платформам\nax1 = axes[0]\nplatforms = ['App Store', 'Google Play', 'Web Site', 'Support Chat']\npositive = [68, 62, 54, 45]\nneutral = [20, 23, 26, 28]\nnegative = [12, 15, 20, 27]\n\nx_p = np.arange(len(platforms))\nw = 0.55\n\np1 = ax1.bar(x_p, positive, w, label='Positive (Нейросеть)', color='#3adb76', edgecolor='white')\np2 = ax1.bar(x_p, neutral, w, bottom=positive, label='Neutral', color='#767676', edgecolor='white')\np3 = ax1.bar(x_p, negative, w, bottom=np.array(positive)+np.array(neutral), label='Negative', color='#cc4b37', edgecolor='white')\n\nax1.set_title('Структура тональности отзывов по каналам (%)', fontsize=11)\nax1.set_xticks(x_p)\nax1.set_xticklabels(platforms)\nax1.set_ylabel('Доля отзывов (%)')\nax1.legend(loc='upper right')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Метрика качества Text-to-SQL генератора\nax2 = axes[1]\nkpis = ['Валидный SQL (Синтаксис)', 'AST Проверка (Безопасность)', 'Совпадение с эталоном', 'Время ответа < 1.5с']\nscores = [98.5, 96.2, 89.4, 94.1]\n\nbars2 = ax2.barh(kpis, scores, color='#1779ba', edgecolor='white', height=0.55)\nax2.axvline(90, color='#3adb76', linestyle='--', label='Production SLA порог (90%)')\nax2.set_title('Качество работы AI Text-to-SQL Ассистента (SLA Test)', fontsize=11)\nax2.set_xlabel('Точность / Успешность (%)')\nax2.set_xlim(0, 110)\nfor b in bars2:\n    w = b.get_width()\n    ax2.text(w + 1, b.get_y() + b.get_height()/2, f'{w:.1f}%', va='center', fontweight='bold', fontsize=9)\nax2.legend()\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🏆 Архитектурный вывод проекта\nСовмещение структурированных данных транзакций с неструктурированными жалобами клиентов в едином хранилище позволяет обнаружить первопричину просадки выручки за считанные секунды вместо недель ручных согласований."}]}]}, {"id": "module_17_career", "title": "Модуль 17. Карьерный трек и резюме 2027", "cat": "Карьера", "badge": "Карьера", "icon": "", "desc": "Оформление GitHub, портфолио в Notion, прохождение технических и поведенческих интервью.", "readme": "# 🚀 Модуль 17: Карьера Data Analyst 2027 — Резюме, Портфолио и Собеседования\n\n## 📌 О модуле\nКак устроиться на работу в эпоху, когда от кандидатов требуют AI-грамотность и глубокие софт-скиллы.\n\n## 📚 Материалы модуля\n1. `resume_template_2027.md` — Шаблон современного резюме с фокусом на влияние на бизнес ($ impact) и AI-компетенции.\n2. `github_portfolio_guide.md` — Инструкция по о function buildSidebar() {
  const list = document.getElementById("moduleList");
  let html = "";
  let lastCat = "";
  COURSE.forEach((mod, idx) => {
    if (mod.cat !== lastCat) {
      lastCat = mod.cat;
      html += `<div class="cat-group"><div class="cat-label">${mod.cat}</div></div>`;
    }
    const done = completedLessons[mod.id] ? '<span class="check-done">&#10003;</span>' : "";
    const active = idx === currentModIdx ? " active" : "";
    const title = mod.title.replace(/^(Модуль \d+\.|Проект \d+\.)\s*/, "");
    html += `<div class="mod-item${active}" data-idx="${idx}" onclick="selectModule(${idx})">
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${title}</span>
      <span class="mod-badge">${mod.badge}</span>
      ${done}
    </div>`;
  });
  list.innerHTML = html;

function filterModules() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  document.querySelectorAll(".mod-item").forEach(el => {
    const idx = parseInt(el.dataset.idx);
    const mod = COURSE[idx];
    const match = !q || mod.title.toLowerCase().includes(q) || mod.desc.toLowerCase().includes(q) || mod.cat.toLowerCase().includes(q);
    el.style.display = match ? "" : "none";
  });
  // Show/hide category labels
  document.querySelectorAll(".cat-group").forEach(g => {
    const items = g.querySelectorAll ? [] : [];
    // just show all cat labels; simple approach
  });
}

function updateProgress() {
  const total = COURSE.reduce((s, m) => s + Math.max(m.notebooks.length, 1), 0);
  const done = Object.keys(completedLessons).length;
  const pct = total > 0 ? Math.round((done / COURSE.length) * 100) : 0;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = done + " / " + COURSE.length + " модулей";
  document.getElementById("progressPct").textContent = pct + "%";
}

const LF = {
  PRIMARY: '#1779ba',
  SECONDARY: '#767676',
  SUCCESS: '#3adb76',
  WARNING: '#ffae00',
  ALERT: '#cc4b37',
  INK: '#0a0a0a',
  PAPER: '#fefefe',
  MUTED: '#767676',
  FAINT: '#cacaca',
  GRID: '#e6e6e6',
  ACCENT: '#1779ba',
  // Foundation steel-blue shade ladder
  L: ['#1779ba', '#2486c7', '#3d9ad9', '#63b1e5', '#8fc6ee', '#bcdcf5', '#dceefb'],
  rnd: (i,k) => Math.abs(((i*73856093)^(k*19349663))%1000)/1000,
  el: (p,t,a) => { const n=document.createElementNS('http://www.w3.org/2000/svg',t); for(const k in a) n.setAttribute(k,a[k]); p.appendChild(n); return n; },
  txt: (p,a,s) => { const n=LF.el(p,'text',a); n.textContent=s; return n; },
};

// ---- F1 Rung Bars: course skills breakdown ----
function drawRungs() {
  const svg = document.getElementById('lfRungs');
  if (!svg) return;
  svg.innerHTML = '';

  const data = [
    {label: 'Хард', v: 5, shade: '#1779ba'},
    {label: 'AI',   v: 5, shade: '#2486c7'},
    {label: 'Портф.', v: 3, shade: '#3d9ad9'},
    {label: 'Статы', v: 2, shade: '#63b1e5'},
    {label: 'Софт', v: 2, shade: '#8fc6ee'},
    {label: 'Карьера', v: 1, shade: '#bcdcf5'},
  ];
  const maxV = Math.max(...data.map(d=>d.v));
  const barW = 28, gap = 12, startX = 50, startY = 175;
  const rungH = 6, rungGap = 3;

  data.forEach((d, i) => {
    const x = startX + i * (barW + gap);
    // Draw rungs (Foundation 3px corner radius)
    for (let r = 0; r < d.v; r++) {
      const ry = startY - (r+1) * (rungH + rungGap);
      const rect = LF.el(svg, 'rect', {
        x: x, y: ry, width: barW, height: rungH,
        rx: 3, fill: d.shade,
        class: 'lf-pop',
        style: `animation-delay: ${(i * 100 + r * 30)}ms`
      });
    }
    // Value on top
    const topY = startY - d.v * (rungH + rungGap) - 6;
    LF.txt(svg, {x: x + barW/2, y: topY, 'text-anchor': 'middle', fill: '#0a0a0a',
      'font-size': '12', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 200}ms`
    }, d.v);
    // Label below
    LF.txt(svg, {x: x + barW/2, y: startY + 14, 'text-anchor': 'middle', fill: '#767676',
      'font-size': '10', 'font-weight': '600', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
      class: 'lf-fade', style: `animation-delay: ${i * 100 + 100}ms`
    }, d.label);
  });

  // Baseline
  LF.el(svg, 'line', {x1: startX-8, y1: startY+1, x2: startX + data.length*(barW+gap)-gap+8, y2: startY+1,
    stroke: '#cacaca', 'stroke-width': '1'});
}

// ---- G4 Dot Waffle: course composition ----
function drawWaffle() {
  const svg = document.getElementById('lfWaffle');
  if (!svg) return;
  svg.innerHTML = '';

  // Foundation Color Role dots (total ~67 notebooks)
  const cats = [
    {n: 24, color: '#1779ba', label: 'Хард база'},

    {n:  6, color: '#767676', label: 'Остальное'},
  ];

  const cols = 10, r = 7, gap = 18, startX = 22, startY = 16;
  let idx = 0;
  cats.forEach((cat) => {
    for (let d = 0; d < cat.n; d++) {
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      LF.el(svg, 'circle', {
        cx: startX + col * gap, cy: startY + row * gap,
        r: r, fill: cat.color,
        class: 'lf-dot-pop',
        style: `animation-delay: ${idx * 12}ms`

// ---- F2 Hairline Line: learning curve ----
function drawLine() {
  const svg = document.getElementById('lfLine');
  if (!svg) return;
  svg.innerHTML = '';

  // Cumulative skills growth over 18 weeks (sigmoid-like)
  const weeks = 18;
  const vals = [];
  for (let w = 0; w < weeks; w++) {
    vals.push(Math.round(100 / (1 + Math.exp(-0.45 * (w - 9)))));
  }
  const maxV = 100;
  const px = 240, py = 170, ox = 24, oy = 16;
  const sx = (px - ox) / (weeks - 1);

  // Grid lines
  for (let g = 0; g <= 4; g++) {
    const gy = oy + (py - oy) * (1 - g/4);
    LF.el(svg, 'line', {x1: ox, y1: gy, x2: px, y2: gy, stroke: '#e6e6e6', 'stroke-width': '1'});
    LF.txt(svg, {x: ox - 4, y: gy + 3, 'text-anchor': 'end', fill: '#767676',
      'font-size': '9', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif"
    }, Math.round(g * 25) + '%');
  }

  // Area fill with subtle steel blue
  let areaD = `M${ox} ${py}`;
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    areaD += ` L${x} ${y}`;
  });
  areaD += ` L${ox + (weeks-1)*sx} ${py} Z`;
  LF.el(svg, 'path', {d: areaD, fill: '#1779ba', opacity: '0.12', class: 'lf-fade'});

  // Line with draw animation (Foundation primary steel blue)
  let lineD = '';
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    lineD += (i === 0 ? 'M' : ' L') + x.toFixed(1) + ' ' + y.toFixed(1);
  });
  LF.el(svg, 'path', {
    d: lineD, fill: 'none', stroke: '#1779ba', 'stroke-width': '2.5',
    'stroke-linecap': 'round', 'stroke-linejoin': 'round',
    'pathLength': '1', class: 'lf-draw'
  });

  // Dots at each week
  vals.forEach((v, i) => {
    const x = ox + i * sx;
    const y = oy + (py - oy) * (1 - v / maxV);
    LF.el(svg, 'circle', {
      cx: x, cy: y, r: 2.8,
      fill: (i === weeks - 1) ? '#ffae00' : '#1779ba',
      stroke: '#fefefe', 'stroke-width': '1',
      class: 'lf-dot-pop',
      style: `animation-delay: ${600 + i * 40}ms`
    });
  });

  // End value label
  const lastX = ox + (weeks-1) * sx;
  const lastY = oy + (py - oy) * (1 - vals[weeks-1] / maxV);
  LF.txt(svg, {x: lastX + 1, y: lastY - 8, 'text-anchor': 'middle', fill: '#1779ba',
    'font-size': '13', 'font-weight': '700', 'font-family': "'Helvetica Neue',Helvetica,Roboto,Arial,sans-serif",
    class: 'lf-fade', style: 'animation-delay: 1200ms'
  }, vals[weeks-1] + '%');

  // Week labels
  LF.txt(svg, {x: ox, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не1');
  LF.txt(svg, {x: ox + Math.floor(weeks/2)*sx, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не9');
  LF.txt(svg, {x: px, y: py + 14, 'text-anchor': 'middle', fill: LF.FAINT,
    'font-size': '8', 'font-family': "'Geist',sans-serif"
  }, 'Не18');
}

// ===== QUIZ =====
function renderQuiz(mod) {
  const area = document.getElementById("content-area");
  const questions = parseQuiz(mod.quiz);

  if (questions.length === 0) {
    area.innerHTML = '<div class="md-view">' + renderMd(mod.quiz) + '</div>';
    return;
  }

  let html = '<div class="quiz-score"><div class="quiz-score-num" id="quizScore">0/' + questions.length + '</div><div class="quiz-score-label">Правильных ответов</div></div>';

  questions.forEach((q, qi) => {
    html += `<div class="quiz-question" id="q${qi}">
      <h3>Вопрос ${qi + 1}: ${escapeHtml(q.question)}</h3>`;
    q.options.forEach((opt, oi) => {
      html += `<div class="quiz-option" data-q="${qi}" data-o="${oi}" data-correct="${opt.correct}" onclick="answerQuiz(this)">
        <div class="radio"></div>
        <span>${escapeHtml(opt.text)}</span>
      </div>`;
    });
    if (q.explanation) {
      html += `<div class="quiz-explanation" id="expl${qi}">${escapeHtml(q.explanation)}</div>`;
    }
    html += '</div>';
  });

  area.innerHTML = html;
}

let quizAnswered = {};
function answerQuiz(el) {
  const qi = el.dataset.q;
  if (quizAnswered[qi] !== undefined) return;
  const isCorrect = el.dataset.correct === "true";
  quizAnswered[qi] = isCorrect;

  // Mark all options in this question
  document.querySelectorAll(`.quiz-option[data-q="${qi}"]`).forEach(opt => {
    if (opt.dataset.correct === "true") {
      opt.classList.add("correct");
    } else if (opt === el) {
      opt.classList.add("wrong");
    }
    opt.style.pointerEvents = "none";
  });

  // Show explanation
  const expl = document.getElementById("expl" + qi);
  if (expl) expl.classList.add("show");

  // Recalculate score
  const total = document.querySelectorAll(".quiz-question").length;
  const correctCount = Object.values(quizAnswered).filter(v => v === true).length;
  const scoreEl = document.getElementById("quizScore");
  if (scoreEl) {
    scoreEl.textContent = correctCount + "/" + total;
  }
}

function parseQuiz(text) {
  const questions = [];
  const blocks = text.split(/###\s*Вопрос\s*\d+/i);
  blocks.shift(); // remove header
  blocks.forEach(block => {
    const lines = block.trim().split("\n");
    let question = "";
    let options = [];
    let explanation = "";

    // First non-empty line is the question
    let i = 0;
    while (i < lines.length && !lines[i].trim()) i++;
    if (i < lines.length) { question = lines[i].trim(); i++; }

    for (; i < lines.length; i++) {
      const line = lines[i].trim();
      const optMatch = line.match(/^-\s*\[(x| )\]\s*(.+)/i);
      if (optMatch) {
        options.push({ text: optMatch[2].trim(), correct: optMatch[1].toLowerCase() === "x" });
      }
      if (line.startsWith("*Объяснение*") || line.startsWith("**Объяснение**")) {
        explanation = line.replace(/^\*+Объяснение\*+:?\s*/, "").trim();
      }
    }

    if (question && options.length > 0) {
      questions.push({ question, options, explanation });
    }
  });
  return questions;
}

// ===== HELPERS =====
function renderMd(text) {
  if (!text) return '<p style="color:var(--text-muted)">Нет содержимого.</p>';
  if (typeof marked !== "undefined") {
    return marked.parse(text);
  }
  return '<pre>' + escapeHtml(text) + '</pre>';
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function highlightAll() {
  if (typeof Prism !== "undefined") {
    setTimeout(() => Prism.highlightAll(), 50);
  }
}

function copyCode(btn) {
  const code = btn.closest(".cell-code").querySelector("code");
  navigator.clipboard.writeText(code.textContent).then(() => {
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy", 2000);
  });
}

function markCompleteBtn(modId) {
  const isDone = completedLessons[modId];
  return `<button class="complete-btn${isDone ? ' done' : ''}" onclick="toggleComplete('${modId}', this)">
    ${isDone ? '&#10003; Пройдено' : 'Отметить как пройденное'}
  </button>`;
}

function toggleComplete(modId, btn) {
  if (completedLessons[modId]) {
    delete completedLessons[modId];
    btn.classList.remove("done");
    btn.innerHTML = "Отметить как пройденное";
  } else {
    completedLessons[modId] = true;
    btn.classList.add("done");
    btn.innerHTML = "&#10003; Пройдено";
  }
  localStorage.setItem("da2027_completed", JSON.stringify(completedLessons));
  updateProgress();
  buildSidebar();
}


// ===== RANDOM COMPREHENSIVE QUIZ (5 QUESTIONS ACROSS ALL 18 MODULES) =====
function startRandomQuiz() {
  currentModIdx = -1;
  currentTab = "quiz";
  document.getElementById("topbarTitle").textContent = "Экспресс-тест: 5 случайных вопросов по курсу";

  // Tabs bar

    <div class="tab active" onclick="startRandomQuiz()">🎯 Экспресс-квиз</div>
    <div class="tab" onclick="showHero()">← На главную</div>
  `;

  // Aggregate questions across all modules
  const allQuestions = [];
  COURSE.forEach(mod => {
    if (mod.quiz) {
      const qList = parseQuiz(mod.quiz);
      qList.forEach(q => {
        allQuestions.push({
          ...q,
          moduleTitle: mod.title
        });
      });
    }
  });

  if (allQuestions.length === 0) {
    area.innerHTML = '<div class="md-view"><p>Квизы загружаются...</p></div>';
    return;
  }

  // Shuffle array using Fisher-Yates and pick 5
  const shuffled = [...allQuestions];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  const selectedQuestions = shuffled.slice(0, 5);

  quizAnswered = {};

function getLessonExplainerHtml(filename) {
  const cfg = LESSON_EXPLAINERS[filename];
  if (!cfg || !cfg.draw) return "";

  const svgId = "lessonSvg_" + filename.replace(/[^a-zA-Z0-9]/g, "_");

  let takeawayHtml = "";
  if (cfg.takeaways && cfg.takeaways.length > 0) {
    takeawayHtml = '<div class="lesson-explainer-takeaway">' +
      cfg.takeaways.map(t => `<div class="lesson-explainer-takeaway-item"><div class="lesson-explainer-takeaway-val">${t.val}</div><div class="lesson-explainer-takeaway-lbl">${t.lbl}</div></div>`).join("") +
      '</div>';
  }

  return `
    <div class="lesson-explainer">
      <div class="lesson-explainer-header">
        <div>
          <div class="lesson-explainer-badge">${cfg.badge}</div>
          <div class="lesson-explainer-title">${cfg.title}</div>
          <div class="lesson-explainer-sub">${cfg.sub}</div>
        </div>
        <button class="lesson-explainer-replay" onclick="replayLessonExplainer('${filename}')" title="Кликните для повтора анимации">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          Повтор
        </button>
      </div>
      <svg id="${svgId}" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid meet"></svg>
      ${takeawayHtml}
    </div>
  `;
}

function initLessonExplainer(filename) {
  const cfg = LESSON_EXPLAINERS[filename];
  if (!cfg || !cfg.draw) return;
  const svgId = "lessonSvg_" + filename.replace(/[^a-zA-Z0-9]/g, "_");
  const svg = document.getElementById(svgId);
  if (!svg) return;
  svg.innerHTML = "";
  try { cfg.draw(svg); } catch(e) { console.error("Lesson explainer error:", e); }
}

function replayLessonExplainer(filename) {
  initLessonExplainer(filename);
}

function getTheoryAnimationHtml(modId) {
  const modData = THEORY_MODULES[modId];
  if (!modData || !modData.charts) return "";

  let cardsHtml = "";
  modData.charts.forEach(ch => {
    cardsHtml += `
      <div class="lf-card" onclick="replayTheoryChart('${ch.id}')" title="Кликните для повтора анимации">
        <h3>${ch.title}</h3>
        <div class="lf-sub">${ch.sub} · клик — переиграть</div>
        <svg id="${ch.id}" viewBox="0 0 280 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="${ch.title}"></svg>
        <div class="lf-src">${ch.src}</div>
      </div>
    `;
  });

  return `
    <div class="theory-viz-block">
      <div class="theory-viz-header">
        <span class="theory-viz-badge">${modData.badge}</span>
        <h2 class="theory-viz-title">${modData.title}</h2>
        <div class="theory-viz-sub">Интерактивные анимации ключевых теоретических концепций модуля в формате Lieflat Charts</div>
      </div>
      <div class="lf-charts-row theory-lf-grid">
        ${cardsHtml}
      </div>
    </div>
  `;
}

function initTheoryAnimation(modId) {
  const modData = THEORY_MODULES[modId];
  if (!modData || !modData.charts) return;
  modData.charts.forEach(ch => {
    const svg = document.getElementById(ch.id);
    if (!svg) return;
    svg.innerHTML = "";
    try {
      ch.draw(svg);
    } catch (e) {
      console.error("Error drawing theory chart " + ch.id + ":", e);
    }
  });
}

function replayTheoryChart(chartId) {
  for (const mId in THEORY_MODULES) {
    const mod = THEORY_MODULES[mId];
    const ch = mod.charts.find(c => c.id === chartId);
    if (ch) {
      const svg = document.getElementById(chartId);
      if (!svg) return;
      svg.innerHTML = "";
      ch.draw(svg);
      return;
    }
  }
}
