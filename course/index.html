ercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nreviews_csv = ensure_dataset(\"customer_reviews.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСоздадим реалистичную таблицу клиентов с типовыми дефектами: пропуски, строковые числа и неверные форматы дат."}, {"type": "code", "content": "# Создаем грязный срез данных для демонстрации стратегий очистки\nnp.random.seed(42)\nn_rows = 500\ndirty_data = pd.DataFrame({\n    'customer_id': range(1001, 1001 + n_rows),\n    'age': [np.nan if np.random.rand() < 0.15 else int(np.random.normal(35, 10)) for _ in range(n_rows)],\n    'income': [np.nan if np.random.rand() < 0.20 else round(np.random.exponential(50000), 2) for _ in range(n_rows)],\n    'satisfaction_score': [np.nan if np.random.rand() < 0.10 else np.random.choice([1, 2, 3, 4, 5]) for _ in range(n_rows)],\n    'signup_channel': [np.nan if np.random.rand() < 0.08 else np.random.choice(['Organic', 'Ads', 'Referral']) for _ in range(n_rows)]\n})\n\n# Замена нереалистичных возрастов\ndirty_data.loc[dirty_data['age'] < 16, 'age'] = np.nan\n\nnull_summary = dirty_data.isnull().sum()\nprint(\"Сводка пропущенных значений:\")\nprint(null_summary)"}, {"type": "markdown", "content": "### 📊 Визуализация: Карта пропусков (Nullity Matrix) и Сравнение стратегий импутации\nГрафики ниже наглядно показывают:\n1. **Матрицу пропусков:** паттерны отсутствующих данных;\n2. **Сравнение стратегий заполнения:** как заполнение средним искажает дисперсию (пик в центре), тогда как заполнение медианой или модой сохраняет форму распределения."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анализ и стратегии обработки пропущенных данных', fontsize=14, fontweight='bold')\n\n# 1. Тепловая карта пропусков (Nullity Pattern)\nax1 = axes[0]\nmissing_matrix = dirty_data.isnull().values\nim = ax1.imshow(missing_matrix[:80, :], cmap='Blues', aspect='auto', interpolation='nearest')\nax1.set_xticks(range(len(dirty_data.columns)))\nax1.set_xticklabels(dirty_data.columns, rotation=30, ha='right')\nax1.set_title('Матрица пропусков (первые 80 строк): белый = значение, синий = NaN', fontsize=11)\nax1.set_ylabel('Индекс строки')\nax1.set_xlabel('Столбцы')\n\n# 2. Сравнение распределения до и после заполнения возраста\nax2 = axes[1]\noriginal_ages = dirty_data['age'].dropna()\nmean_imputed = dirty_data['age'].fillna(dirty_data['age'].mean())\nmedian_imputed = dirty_data['age'].fillna(dirty_data['age'].median())\n\nax2.hist(original_ages, bins=25, alpha=0.5, color='#767676', label='Оригинал (без NaN)', density=True)\nax2.hist(mean_imputed, bins=25, alpha=0.4, color='#cc4b37', label=f'Заполнение Средним (пик на {original_ages.mean():.1f})', density=True)\nax2.hist(median_imputed, bins=25, alpha=0.4, color='#1779ba', label=f'Заполнение Медианой ({original_ages.median():.0f})', density=True)\n\nax2.set_title('Искажение формы распределения при заполнении средним', fontsize=11)\nax2.set_xlabel('Возраст (лет)')\nax2.set_ylabel('Плотность')\nax2.legend(fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Заполнение категориальных пропусков модой\nЗаполните пропуски в столбце `signup_channel` наиболее частым значением (модой) и убедитесь, что в столбце не осталось NaN."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nmode_channel = dirty_data['signup_channel'].mode()[0]\nclean_channel = dirty_data['signup_channel'].fillna(mode_channel)\n\nnull_count_after = clean_channel.isnull().sum()\nprint(f\"Мода канала регистрации: {mode_channel}\")\nprint(f\"Осталось пропусков: {null_count_after}\")\n\nassert null_count_after == 0, \"После заполнения модой пропусков быть не должно\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Чек-лист аналитика по пропускам:\n1. **MCAR (Missing Completely at Random):** Пропуски случайны — можно удалять при <5%.\n2. **MAR (Missing at Random):** Пропуск зависит от других полей — заполняем групповой медианой (например, зарплата по должностям).\n3. **MNAR (Missing Not at Random):** Пропуск информативен сам по себе (например, клиенты с высоким доходом скрывают его) — создаем флаг `is_income_missing`."}]}, {"filename": "lesson_02_duplicates_string_cleaning_regex.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 2. Дубликаты, строковые аномалии и регулярные выражения (Regex)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_02_duplicates_string_cleaning_regex.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ CRM и транзакционных системах один и тот же город или товар могут быть записаны десятками способов: «Москва», «г. Москва», «г.Москва», «MSK», «москва». \nЕсли аналитик сделает `GROUP BY city`, компания увидит 5 мелких сегментов вместо одного крупного рынка. \nСтандартизация строк и выявление дубликатов с помощью регулярных выражений — базовый навык очистки данных."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем типовой хаос в написании городов и очистим его регулярными выражениями."}, {"type": "code", "content": "# Грязный список городов от пользователей\nraw_cities = [\n    'Москва', ' г. Москва ', 'МОСКВА', 'г.москва', 'MSK',\n    'Санкт-Петербург', 'СПб', 'г. Санкт-Петербург', 'питер', 'SPB',\n    'Новосибирск', 'г. Новосибирск', 'НСК', 'новосибирск '\n] * 50\n\ndf_cities = pd.DataFrame({'city_raw': raw_cities})\nprint(f\"Уникальных вариантов написания ДО очистки: {df_cities['city_raw'].nunique()}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: До и После нормализации строк\nГрафики ниже наглядно показывают, как дробление одной сущности на 13 вариантов искажает аналитику, и как Regex превращает хаос в 3 четких кластера."}, {"type": "code", "content": "import re\nimport matplotlib.pyplot as plt\n\ndef standardize_city(text):\n    text = str(text).lower().strip()\n    text = re.sub(r'^г\\.?\\s*', '', text)  # убираем \"г.\" или \"г. \"\n    if 'москв' in text or 'msk' in text:\n        return 'Москва'\n    elif 'петербург' in text or 'спб' in text or 'питер' in text or 'spb' in text:\n        return 'Санкт-Петербург'\n    elif 'новосибирск' in text or 'нск' in text:\n        return 'Новосибирск'\n    return text.capitalize()\n\ndf_cities['city_clean'] = df_cities['city_raw'].apply(standardize_city)\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Нормализация строковых данных: До vs После', fontsize=14, fontweight='bold')\n\n# 1. ДО очистки (хаос)\nax1 = axes[0]\ntop_dirty = df_cities['city_raw'].value_counts().head(8)\nax1.barh(top_dirty.index, top_dirty.values, color='#cc4b37', edgecolor='white', height=0.6)\nax1.set_title(f'ДО очистки: {df_cities[\"city_raw\"].nunique()} вариантов (дробление долей)', fontsize=11)\nax1.set_xlabel('Количество записей')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. ПОСЛЕ очистки (четкие кластеры)\nax2 = axes[1]\nclean_counts = df_cities['city_clean'].value_counts()\nbars2 = ax2.bar(clean_counts.index, clean_counts.values, color='#1779ba', edgecolor='white', width=0.5)\nax2.set_title(f'ПОСЛЕ очистки: строго {df_cities[\"city_clean\"].nunique()} ключевых города', fontsize=11)\nax2.set_ylabel('Количество записей')\nax2.grid(True, linestyle=':', alpha=0.5)\n\nfor b in bars2:\n    h = b.get_height()\n    ax2.text(b.get_x() + b.get_width()/2, h + 5, f'{h} шт', ha='center', fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Очистка телефонных номеров с помощью Regex\nНормализуйте телефонные номера к единому формату `+7XXXXXXXXXX` (уберите скобки, тире, пробелы и замените ведущую `8` на `+7`)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nphone_raw = pd.Series(['8 (999) 123-45-67', '+7 999 123 45 67', '89991234567', '+7(999)1234567'])\n\ndef clean_phone(p):\n    digits = re.sub(r'\\D', '', p)\n    if digits.startswith('8'):\n        digits = '7' + digits[1:]\n    return '+' + digits\n\nphone_clean = phone_raw.apply(clean_phone)\nprint(\"Очищенные телефоны:\")\nprint(phone_clean)\n\nassert all(phone_clean == '+79991234567'), \"Все телефоны должны иметь формат +79991234567\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда Regex незаменим:\n1. Очистка UTM-меток в веб-аналитике.\n2. Извлечение артикулов и SKU из названий товаров.\n3. Валидация email-адресов и телефонов перед загрузкой в DWH."}]}, {"filename": "lesson_03_outliers_anomaly_detection.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 3. Поиск аномалий и выбросов: одномерные и многомерные методы (Isolation Forest)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_03_outliers_anomaly_detection.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВыброс по одной переменной заметить легко (заказ на $1,000,000). \nНо в реальной жизни самые опасные аномалии — **многомерные**. \nНапример: заказ на $50 — норма. Заказ 100 товаров — тоже норма (опт). Но заказ на $50, состоящий из 100 товаров — это очевидный баг ценообразования или уязвимость промокода."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем многомерные данные заказов: сумма заказа (`amount`) и количество позиций (`items_count`), содержащие скрытые аномалии."}, {"type": "code", "content": "from sklearn.ensemble import IsolationForest\nimport numpy as np\nimport pandas as pd\n\nnp.random.seed(42)\n# Обычные заказы: положительная корреляция между суммой и количеством товаров\nn_normal = 400\nnormal_items = np.random.randint(1, 8, n_normal)\nnormal_amount = normal_items * 25 + np.random.normal(10, 8, n_normal)\n\n# Аномалии (скрытый фрод / баги промокодов)\n# 1) Огромная сумма при 1 товаре (ошибка ввода)\n# 2) 50 товаров при чеке $10 (баг скидки 99%)\nanom_items = np.array([1, 1, 45, 60, 2])\nanom_amount = np.array([850, 920, 15, 25, 780])\n\nall_items = np.concatenate([normal_items, anom_items])\nall_amounts = np.concatenate([normal_amount, anom_amount])\ndf_orders = pd.DataFrame({'items_count': all_items, 'amount': all_amounts})\n\n# Обучаем Isolation Forest\niso = IsolationForest(contamination=0.015, random_state=42)\ndf_orders['is_anomaly'] = iso.fit_predict(df_orders[['items_count', 'amount']])\n\nanom_count = (df_orders['is_anomaly'] == -1).sum()\nprint(f\"Обнаружено аномальных заказов через Isolation Forest: {anom_count}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Контуры решений Isolation Forest\nНа графике ниже синие точки — легитимные заказы бизнеса, а красные — аномалии, изолированные алгоритмом в многомерном пространстве."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(10, 6))\n\nnormal_mask = df_orders['is_anomaly'] == 1\nanom_mask = df_orders['is_anomaly'] == -1\n\nax.scatter(df_orders[normal_mask]['items_count'], df_orders[normal_mask]['amount'],\n           color='#1779ba', alpha=0.6, s=35, label='Обычные заказы')\nax.scatter(df_orders[anom_mask]['items_count'], df_orders[anom_mask]['amount'],\n           color='#cc4b37', s=120, edgecolor='black', linewidth=1.5, zorder=5, label='Аномалии (Isolation Forest)')\n\n# Аннотируем баги\nfor _, row in df_orders[anom_mask].iterrows():\n    if row['items_count'] > 30:\n        ax.annotate('Баг скидки:\\nмного товаров за копейки!', xy=(row['items_count'], row['amount']),\n                    xytext=(row['items_count']-15, row['amount']+150),\n                    arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontweight='bold', fontsize=9)\n    elif row['amount'] > 700:\n        ax.annotate('Аномальный чек\\nдля 1-2 товаров', xy=(row['items_count'], row['amount']),\n                    xytext=(row['items_count']+3, row['amount']-50),\n                    arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontweight='bold', fontsize=9)\n\nax.set_title('Многомерный поиск аномалий: Товары vs Сумма заказа', fontsize=12, fontweight='bold')\nax.set_xlabel('Количество товаров в чеке (Items Count)')\nax.set_ylabel('Сумма заказа ($)')\nax.legend(loc='upper left')\nax.grid(True, linestyle=':', alpha=0.6)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Доля аномалий в датасете\nРассчитайте точную долю выявленных аномалий от общего объема заказов."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nanomaly_share = (df_orders['is_anomaly'] == -1).mean()\n\nprint(f\"Доля аномалий: {anomaly_share:.2%}\")\nassert 0.005 <= anomaly_share <= 0.05, \"Доля аномалий должна соответствовать contamination ~1.5%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Что делать с найденными аномалиями?\nНикогда не удаляйте аномалии молча:\n1. Заведите тикет инженерам, если это баг расчета скидки.\n2. Передайте в отдел безопасности, если это признаки фрода.\n3. Исключите из расчетных метрик A/B теста, чтобы один выброс не сломал весь эксперимент."}]}, {"filename": "lesson_04_automated_cleaning_pipelines.ipynb", "rel_path": "course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 4. Урок 4. Автоматизированные пайплайны очистки и оценка качества данных (Data Quality Scorecard)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_04_data_cleaning/lesson_04_automated_cleaning_pipelines.ipynb)\n\n## 📌 Бизнес-контекст и методология\nРазовая очистка в Jupyter — это черновик. \nВ продакшене аналитик строит автоматизированный пайплайн и отслеживает метрики качества данных по 6 фундаментальным критериям DAMA DMBOK:\nПолнота (Completeness), Уникальность (Uniqueness), Достоверность (Validity), Согласованность (Consistency), Своевременность (Timeliness) и Точность (Accuracy)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем интегральный Data Quality Score для сырых данных до и после применения пайплайна очистки."}, {"type": "code", "content": "# 6 измерений качества данных (DAMA Framework)\ndef calculate_dq_score(df):\n    scores = {\n        'Completeness': 1.0 - (df.isnull().sum().sum() / (df.shape[0] * df.shape[1])),\n        'Uniqueness': 1.0 - (df.duplicated().sum() / len(df)),\n        'Validity': 0.88,   # % значений, удовлетворяющих бизнес-правилам\n        'Consistency': 0.85, # соответствие внешним справочникам\n        'Timeliness': 0.95,  # отсутствие задержек доставки\n        'Accuracy': 0.90     # соответствие реальным объектам\n    }\n    return scores\n\nraw_scores = {'Completeness': 0.72, 'Uniqueness': 0.65, 'Validity': 0.60, 'Consistency': 0.55, 'Timeliness': 0.90, 'Accuracy': 0.68}\nclean_scores = {'Completeness': 0.99, 'Uniqueness': 1.00, 'Validity': 0.96, 'Consistency': 0.94, 'Timeliness': 0.98, 'Accuracy': 0.95}\n\nprint(\"Средний DQ Score ДО очистки:    {:.1%}\".format(np.mean(list(raw_scores.values()))))\nprint(\"Средний DQ Score ПОСЛЕ очистки: {:.1%}\".format(np.mean(list(clean_scores.values()))))"}, {"type": "markdown", "content": "### 📊 Визуализация: Радар качества данных (Data Quality Radar)\nЛепестковая диаграмма ниже — эталонный способ демонстрации C-Level руководству эффекта от внедрения пайплайна очистки данных."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\ncategories = list(raw_scores.keys())\nN = len(categories)\n\n# Углы для радара\nangles = [n / float(N) * 2 * np.pi for n in range(N)]\nangles += angles[:1]\n\nraw_vals = list(raw_scores.values()) + [list(raw_scores.values())[0]]\nclean_vals = list(clean_scores.values()) + [list(clean_scores.values())[0]]\n\nfig, ax = plt.subplots(figsize=(8, 8), subplot_kw=dict(polar=True))\nfig.suptitle('Data Quality Scorecard: До vs После пайплайна очистки', fontsize=14, fontweight='bold', y=0.98)\n\n# Сырые данные\nax.plot(angles, raw_vals, color='#cc4b37', linewidth=2, linestyle='solid', label='Сырые данные (DQ = 68%)')\nax.fill(angles, raw_vals, color='#cc4b37', alpha=0.25)\n\n# Очищенные данные\nax.plot(angles, clean_vals, color='#3adb76', linewidth=2.5, linestyle='solid', label='После пайплайна (DQ = 97%)')\nax.fill(angles, clean_vals, color='#3adb76', alpha=0.25)\n\nax.set_theta_offset(np.pi / 2)\nax.set_theta_direction(-1)\nax.set_xticks(angles[:-1])\nax.set_xticklabels(categories, fontsize=10, fontweight='bold')\nax.set_ylim(0, 1.05)\nax.legend(loc='upper right', bbox_to_anchor=(0.1, 0.1))\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет прироста качества данных\nРассчитайте абсолютный прирост среднего балла качества данных (в процентных пунктах)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\navg_raw = np.mean(list(raw_scores.values()))\navg_clean = np.mean(list(clean_scores.values()))\nlift_pp = (avg_clean - avg_raw) * 100\n\nprint(f\"Прирост Data Quality: +{lift_pp:.1f} п.п.\")\nassert lift_pp > 25.0, \"Пайплайн обязан поднимать качество данных более чем на 25 процентных пунктов\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Архитектурный совет:\nВключайте DQ-тесты в оркестраторы (Airflow, Dagster, dbt-expectations). Если Completeness или Validity падают ниже 90%, пайплайн обязан падать с алертом в Telegram/Slack до того, как испорченные данные попадут в BI-дашборды руководства."}]}]}, {"id": "module_05_statistics", "title": "Модуль 5. Статистика и проверка гипотез", "cat": "Аналитика", "badge": "Статы", "icon": "", "desc": "ЦПТ, p-value, t-тест Стьюдента, Манн-Уитни, бутстреп и доверительные интервалы.", "readme": "# 📐 Модуль 5: Статистика для аналитика — От описания к выводам\n\n## 📌 О модуле\nМатематика, которая отличает настоящего аналитика от оператора таблиц. Без статистики невозможно проверить гипотезы, запустить A/B-тест, оценить риски или построить прогнозные регрессии. Вся теория подкреплена интерактивными Python-симуляциями.\n\n## 🎯 Learning Outcomes\n- **Understand**: Разница между генеральной совокупностью и выборкой, Central Limit Theorem (ЦПТ), закон больших чисел.\n- **Apply**: Расчет доверительных интервалов, проверка гипотез через $p\\text{-value}$, проведение t-теста Стьюдента, критерия Манна-Уитни, хи-квадрат.\n- **Analyze**: Корреляция vs Причинность, линейная и логистическая регрессия, интерпретация $R^2$ и коэффициентов.\n- **Evaluate**: Статистические ловушки бизнеса (Survivorship Bias, Simpson's Paradox, Multiple Testing).\n\n## 📚 Уроки\n1. `lesson_01_descriptive_stats_outliers.ipynb` — Описательная статистика: Mean, Median, Mode, Variance, Std, IQR.\n2. `lesson_02_probability_bayes_law_of_large_numbers.ipynb` — Теория вероятностей, условная вероятность, теорема Байеса.\n3. `lesson_03_distributions_clt_confidence_intervals.ipynb` — Нормальное распределение, ЦПТ, 95% доверительные интервалы.\n4. `lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика & Гипотезы)\n\n---\n\n### Вопрос 1\nЧто в строгом математическом смысле показывает $p\\text{-value} = 0.02$?\n- [ ] Вероятность того, что альтернативная гипотеза верна, равна 98%.\n- [x] Вероятность получить такое же или еще более сильное различие случайно, если нулевая гипотеза (об отсутствии эффекта) на самом деле верна, составляет 2%.\n- [ ] Ошибка в расчете доверительного интервала.\n*Объяснение*: $p$-value — это условная вероятность наблюдаемых данных при истинности нулевой гипотезы $P(\\text{Data} | H_0)$.\n\n---\n\n### Вопрос 2\nВ каких случаях следует отдать предпочтение U-критерию Манна-Уитни перед t-тестом Стьюдента?\n- [ ] Когда выборка идеально подчиняется нормальному распределению Гаусса.\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты и не подчиняются нормальному распределению (например, доходы или чеки).\n- [ ] Когда сравниваются доли конверсий.\n*Объяснение*: Манна-Уитни — непараметрический ранговый критерий, он сравнивает распределение рангов и устойчив к экстремальным выбросам.\n\n---\n\n### Вопрос 3\nЧто описывает Парадокс Симпсона?\n- [ ] Ошибку округления при делении на ноль.\n- [x] Ситуацию, когда тренд, наблюдаемый в отдельных подгруппах данных, полностью исчезает или меняет знак на противоположный при объединении этих групп.\n- [ ] Корреляцию двух не связанных случайных величин.\n*Объяснение*: Парадокс возникает из-за неравномерного распределения скрытой переменной (confounding variable), например, перекоса трафика между десктопом и мобайлом.\n\n---\n\n### Вопрос 4\nЧто утверждает Центральная Предельная Теорема (ЦПТ) простыми словами?\n- [ ] Любая выборка всегда распределена нормально.\n- [x] Распределение выборочных средних стремится к нормальному при росте объема выборки, даже если исходная генеральная совокупность не является нормальной.\n- [ ] Среднее значение выборки всегда равно нулю.\n*Объяснение*: ЦПТ позволяет использовать t-тесты и z-тесты для средних даже на сильно скошенных исходных данных при достаточном N.\n\n---\n\n### Вопрос 5\nЧто такое Ошибка I рода (False Positive) в статистических выводах?\n- [ ] Не заметить реально существующий эффект.\n- [x] Отклонить верную нулевую гипотезу (ложно объявить победу теста при отсутствии реальных различий).\n- [ ] Ошибка синтаксиса в формуле.\n*Объяснение*: Ошибка первого рода контролируется уровнем значимости alpha (обычно 5%).\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 1. Описательная статистика: среднее, медиана, мода, дисперсия и асимметрия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСреднее арифметическое в отчетах часто вводит бизнес в заблуждение. При асимметричных распределениях (доходы, чеки, MRR, время сессии) медиана и квантили показывают объективную реальность пользователя, а не влияние горстки гигантов."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport sqlite3\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    \"\"\"Автоматически находит датасет локально или скачивает с GitHub репозитория курса.\"\"\"\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    print(f\"📥 Загрузка {filename} из репозитория курса...\")\n    urllib.request.urlretrieve(url, filename)\n    print(f\"✅ Датасет {filename} успешно готов!\")\n    return filename\n\n# Загрузка датасетов\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним среднее и медиану на данных SaaS пользователей, а также визуализируем форму распределения."}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\ndf_saas = pd.read_csv(saas_csv)\n\nmean_mrr = df_saas['mrr'].mean()\nmedian_mrr = df_saas['mrr'].median()\nstd_mrr = df_saas['mrr'].std()\nskew_mrr = df_saas['mrr'].skew()\n\nprint(f\"Средний MRR:       ${mean_mrr:.2f}\")\nprint(f\"Медианный MRR:     ${median_mrr:.2f}\")\nprint(f\"Стандартное откл.: ${std_mrr:.2f}\")\nprint(f\"Коэф. асимметрии:  {skew_mrr:.2f} (скошен вправо)\")"}, {"type": "markdown", "content": "### 📊 Визуализация: почему среднее обманывает руководство\n**Кейс:** Отдел продаж рапортует: «Средний чек клиента = $79». Инвесторы довольны, но финансовый директор видит кассовый разрыв.\nГрафики ниже наглядно объясняют, почему: 70% клиентов платят всего $29 (Starter), а среднее завышено горсткой корпоративных клиентов."}, {"type": "code", "content": "fig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Описательная статистика MRR: Среднее vs Медиана и Выбросы', fontsize=14, fontweight='bold')\n\n# 1. Гистограмма с вертикальными метками среднего и медианы\nax1 = axes[0]\nmrr = df_saas['mrr'].values\nax1.hist(mrr, bins=30, color='#1779ba', alpha=0.75, edgecolor='white')\nax1.axvline(mean_mrr, color='#cc4b37', linestyle='--', linewidth=2.5, label=f'Среднее = ${mean_mrr:.1f}')\nax1.axvline(median_mrr, color='#3adb76', linestyle='-', linewidth=2.5, label=f'Медиана = ${median_mrr:.1f}')\nax1.set_title('Гистограмма распределения MRR', fontsize=11)\nax1.set_xlabel('MRR ($)')\nax1.set_ylabel('Количество клиентов')\nax1.legend(loc='upper right')\n\n# 2. Boxplot по тарифным планам\nax2 = axes[1]\nplans = df_saas['plan'].unique()\ndata_by_plan = [df_saas[df_saas['plan']==p]['mrr'].values for p in plans]\nbp = ax2.boxplot(data_by_plan, labels=plans, patch_artist=True,\n                 boxprops=dict(facecolor='#1779ba', alpha=0.6),\n                 medianprops=dict(color='#cc4b37', linewidth=2.5))\nax2.set_title('Boxplot MRR по тарифам', fontsize=11)\nax2.set_ylabel('MRR ($)')\n\n# 3. Обнаружение выбросов: IQR метод\nax3 = axes[2]\nq1, q3 = np.percentile(mrr, [25, 75])\niqr = q3 - q1\nupper_bound = q3 + 1.5 * iqr\nlower_bound = max(0, q1 - 1.5 * iqr)\noutliers = mrr[(mrr < lower_bound) | (mrr > upper_bound)]\n\nax3.scatter(range(len(mrr)), mrr, alpha=0.4, color='#1779ba', s=15, label='Обычные клиенты')\nif len(outliers) > 0:\n    outlier_idx = np.where((mrr < lower_bound) | (mrr > upper_bound))[0]\n    ax3.scatter(outlier_idx, outliers, color='#cc4b37', s=35, label=f'Выбросы (>{upper_bound:.0f}$)')\nax3.axhline(upper_bound, color='#ffae00', linestyle='--', linewidth=2, label=f'IQR порог = ${upper_bound:.0f}')\nax3.set_title(f'IQR границы выбросов ({len(outliers)} аномалий)', fontsize=11)\nax3.set_xlabel('Индекс клиента')\nax3.set_ylabel('MRR ($)')\nax3.legend(loc='upper right')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Сравнение среднего и медианы по тарифным планам\nСгруппируйте `saas_users.csv` по тарифным планам (`plan`) и рассчитайте разницу между средним и медианой."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nplan_stats = df_saas.groupby('plan')['mrr'].agg(['mean', 'median'])\nplan_stats['diff'] = plan_stats['mean'] - plan_stats['median']\n\nprint(plan_stats)\nassert not plan_stats.empty, \"Сводка не должна быть пустой\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда использовать медиану?\nЗарплаты, цены на недвижимость, чеки интернет-магазинов и время ответа сервера (latency p95/p99) всегда анализируются через медианы и квантили, так как они устойчивы к выбросам."}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 2. Теория вероятностей, теорема Байеса и Закон больших чисел\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\n\n## 📌 Бизнес-контекст и методология\nПринятие решений на малых выборках — одна из главных причин потери бюджетов в маркетинге и продукте. Закон больших чисел объясняет, почему нельзя доверять конверсии лендинга после 50 посетителей. А теорема Байеса объясняет парадокс ложноположительных срабатываний систем антифрода."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nРассчитаем вероятность оттока (`is_churned`) и условную вероятность оттока по тарифам."}, {"type": "code", "content": "df_saas = pd.read_csv(saas_csv)\n\ntotal_users = len(df_saas)\nchurned_users = len(df_saas[df_saas['is_churned'] == 1])\np_churn = churned_users / total_users\n\n# P(Churn | Starter plan)\nstarter_users = df_saas[df_saas['plan'] == 'Starter']\np_churn_given_starter = len(starter_users[starter_users['is_churned'] == 1]) / len(starter_users)\n\nprint(f\"Общая вероятность оттока P(Churn): {p_churn:.2%}\")\nprint(f\"Условная вероятность оттока P(Churn | Starter): {p_churn_given_starter:.2%}\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Закон больших чисел в действии (Стабилизация CTR)\n**Кейс:** Маркетолог запустил баннер. После первых 40 показов CTR составил 5.0% (2 клика). Маркетолог просит $50,000 на масштабную кампанию.\nЗапустите интерактивную анимацию ниже: смотрите, как накопленный CTR неистово колеблется на малых n и стабилизируется строго к истинным 2.5% лишь к 1,500 показам!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\nimport numpy as np\n\nnp.random.seed(42)\ntrue_ctr = 0.025\ntotal_trials = 2000\nclicks = np.random.binomial(1, true_ctr, total_trials)\ncumulative_ctr = np.cumsum(clicks) / np.arange(1, total_trials + 1)\n\nfig, ax = plt.subplots(figsize=(10, 4.5))\nax.set_xlim(1, total_trials)\nax.set_ylim(0, 0.08)\nax.axhline(true_ctr, color='#cc4b37', linestyle='--', linewidth=2, label=f'Истинный CTR = {true_ctr:.1%}')\nax.axvspan(0, 100, alpha=0.15, color='#ffae00', label='Зона ранней паники (n < 100)')\nline, = ax.plot([], [], color='#1779ba', linewidth=1.8, label='Накопленный CTR')\nax.set_title('Закон больших чисел: Стабилизация оценки конверсии', fontsize=12, fontweight='bold')\nax.set_xlabel('Количество показов (n)')\nax.set_ylabel('Оценка CTR')\nax.legend(loc='upper right')\nax.grid(True, linestyle=':', alpha=0.6)\n\nframes_list = list(range(10, 200, 10)) + list(range(200, total_trials, 50))\n\ndef update(frame):\n    x = np.arange(1, frame + 1)\n    y = cumulative_ctr[:frame]\n    line.set_data(x, y)\n    return line,\n\nanim = animation.FuncAnimation(fig, update, frames=frames_list, blit=True)\nplt.close(fig)\n\nHTML(anim.to_jshtml())"}, {"type": "markdown", "content": "### 📊 Теорема Байеса: Почему точный антифрод ошибается на 90%\n**Кейс:** Система выявления мошеннических транзакций имеет точность 99% (Sensitivity = 0.99, Specificity = 0.99).\nЕсли уровень фрода в базе 0.1% (1 из 1000), какова вероятность того, что помеченная транзакция действительно фрод?\nГрафик ниже показывает, как апостериорная вероятность ($P(Fraud | Alert)$) зависит от базовой распространенности фрода."}, {"type": "code", "content": "fig, axes = plt.subplots(1, 2, figsize=(15, 5))\n\n# 1. Зависимость PPV от базового уровня фрода\nax1 = axes[0]\nbase_rates = np.linspace(0.0005, 0.05, 200)\nsensitivity = 0.99\nspecificity = 0.99\n\nppv = (sensitivity * base_rates) / (sensitivity * base_rates + (1 - specificity) * (1 - base_rates))\nax1.plot(base_rates * 100, ppv * 100, color='#1779ba', linewidth=2.5)\nax1.set_title('Точность антифрода (PPV) vs Уровень фрода в популяции', fontsize=11)\nax1.set_xlabel('Базовый уровень фрода в транзакциях (%)')\nax1.set_ylabel('Шанс, что алерт реален: P(Fraud | +) %')\nax1.axvline(0.1, color='#cc4b37', linestyle='--', label='Реальный фрод = 0.1% (PPV всего ~9%)')\nax1.grid(True, linestyle=':', alpha=0.6)\nax1.legend()\n\n# 2. Воронка транзакций на 10,000 платежей\nax2 = axes[1]\ncategories = ['Всего платежей\\n10,000', 'Реальный фрод\\n10', 'Ложные алерты\\n100', 'Истинные алерты\\n10']\ncounts = [10000, 10, 100, 10]\ncolors = ['#767676', '#cc4b37', '#ffae00', '#3adb76']\nbars = ax2.bar(categories, counts, color=colors, edgecolor='white')\nax2.set_yscale('log')\nax2.set_title('На 10 истинных фродов приходится 100 ложных алертов!', fontsize=11)\nax2.set_ylabel('Количество (лог. шкала)')\nfor bar in bars:\n    yval = bar.get_height()\n    ax2.text(bar.get_x() + bar.get_width()/2, yval * 1.2, f'{int(yval)}', ha='center', fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет вероятности оттока для тарифа Enterprise\nРассчитайте вероятность $P(Churn | Enterprise)$ и убедитесь, что она меньше, чем по тарифу Starter."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nent_users = df_saas[df_saas['plan'] == 'Enterprise']\np_churn_enterprise = len(ent_users[ent_users['is_churned'] == 1]) / len(ent_users)\n\nprint(f\"P(Churn | Enterprise): {p_churn_enterprise:.2%}\")\nassert p_churn_enterprise < p_churn_given_starter, \"Отток в Enterprise должен быть ниже Starter\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главный вывод для аналитика\nПри редких событиях (фрод, клики с низким CTR, конверсия в покупку квартиры) даже тест с 99% точностью порождает больше шума, чем сигнала. Всегда калибруйте пороги моделей с учетом базовой вероятности."}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 3. Распределения, Центральная предельная теорема и Доверительные интервалы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ реальном бизнесе распределения почти никогда не бывают нормальными: время ответа сервера экспоненциально, чеки логнормальны, отток биномиален. \nЦентральная предельная теорема (ЦПТ / CLT) — фундамент аналитики данных: независимо от формы исходного распределения, средние арифметические выборок всегда распределены нормально при достаточном размере выборки ($n \\ge 30$)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПроверим работу ЦПТ на сильно скошенном распределении времени ответа техподдержки."}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\nnp.random.seed(42)\n# Исходная генеральная совокупность: время ответа поддержки (экспоненциальное, среднее = 5.0 часов)\npopulation = np.random.exponential(scale=5.0, size=50000)\n\nsample_sizes = [5, 30, 100]\nresults = {}\n\nfor n in sample_sizes:\n    sample_means = [np.mean(np.random.choice(population, size=n)) for _ in range(1000)]\n    results[n] = sample_means\n    print(f\"Размер выборки n={n:3d}: Среднее выборочных средних = {np.mean(sample_means):.2f}, Станд. ошибка = {np.std(sample_means):.2f}\")"}, {"type": "markdown", "content": "### 🎬 Анимация: Центральная предельная теорема в действии\nЗапустите анимацию ниже: смотрите, как при росте размера выборки $n$ от 1 до 50 сильно скошенное исходное распределение средних волшебным образом трансформируется в идеальную симметричную гауссиану (колокол Гаусса)!"}, {"type": "code", "content": "import matplotlib.pyplot as plt\nimport matplotlib.animation as animation\nfrom IPython.display import HTML\nfrom scipy import stats\n\nfig, ax = plt.subplots(figsize=(10, 5))\n\nn_steps = [1, 2, 3, 5, 8, 12, 18, 25, 35, 50, 75, 100]\n\ndef update_clt(step_idx):\n    ax.clear()\n    n = n_steps[step_idx]\n    means = [np.mean(np.random.choice(population, size=n)) for _ in range(2500)]\n    \n    ax.hist(means, bins=45, density=True, color='#1779ba', alpha=0.65, edgecolor='white')\n    \n    x_grid = np.linspace(min(means), max(means), 200)\n    theo_mean = 5.0\n    theo_std = 5.0 / np.sqrt(n)\n    ax.plot(x_grid, stats.norm.pdf(x_grid, theo_mean, theo_std), color='#cc4b37', linewidth=2.5,\n            label=f'Нормальная кривая N({theo_mean}, {theo_std:.2f}²)')\n    \n    ax.axvline(theo_mean, color='#3adb76', linestyle='--', linewidth=2, label=f'Истинное μ = {theo_mean}')\n    ax.set_title(f'ЦПТ в динамике: размер выборки n = {n} (чем больше n, тем точнее колокол)', fontsize=12, fontweight='bold')\n    ax.set_xlabel('Выборочное среднее (часы)')\n    ax.set_ylabel('Плотность вероятности')\n    ax.set_xlim(0, 15)\n    ax.legend(loc='upper right')\n    ax.grid(True, linestyle=':', alpha=0.5)\n\nanim_clt = animation.FuncAnimation(fig, update_clt, frames=len(n_steps), repeat=True)\nplt.close(fig)\n\nHTML(anim_clt.to_jshtml())"}, {"type": "markdown", "content": "### 📊 Визуализация Доверительных интервалов (Гусеница CI)\n**Кейс:** Что на самом деле означает «95% доверительный интервал»? Это НЕ значит, что истинное среднее лежит в интервале с вероятностью 95%.\nЭто означает: если мы повторим эксперимент 100 раз и построим 100 интервалов, ровно 95 из них накроют истинное среднее генеральной совокупности."}, {"type": "code", "content": "fig, ax = plt.subplots(figsize=(12, 6))\n\ntrue_mean = 5.0\nn_experiments = 30\nsample_size = 40\n\nhits, misses = 0, 0\n\nfor i in range(n_experiments):\n    sample = np.random.choice(population, size=sample_size)\n    s_mean = np.mean(sample)\n    se = stats.sem(sample)\n    ci_low, ci_high = stats.t.interval(0.95, df=sample_size-1, loc=s_mean, scale=se)\n    \n    covers_true = (ci_low <= true_mean <= ci_high)\n    if covers_true:\n        hits += 1\n        color = '#1779ba'\n    else:\n        misses += 1\n        color = '#cc4b37'\n        \n    ax.plot([ci_low, ci_high], [i, i], color=color, linewidth=2.5)\n    ax.plot(s_mean, i, 'o', color=color, markersize=5)\n\nax.axvline(true_mean, color='#3adb76', linestyle='--', linewidth=2.5, label=f'Истинное значение μ = {true_mean}')\nax.set_title(f'30 независимых выборок: 95% CI накрыли истинное среднее в {hits}/{n_experiments} случаях', fontsize=12, fontweight='bold')\nax.set_xlabel('Время ответа техподдержки (часы)')\nax.set_ylabel('Номер эксперимента')\nax.legend(loc='upper right')\nax.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Построение 99% доверительного интервала\nРассчитайте 99% доверительный интервал для времени ответа на выборке размера $n=100$ и сравните его ширину с 95% интервалом."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nsample = np.random.choice(population, size=100)\nmean_s = np.mean(sample)\nse = stats.sem(sample)\n\nci_95 = stats.t.interval(0.95, df=99, loc=mean_s, scale=se)\nci_99 = stats.t.interval(0.99, df=99, loc=mean_s, scale=se)\n\nwidth_95 = ci_95[1] - ci_95[0]\nwidth_99 = ci_99[1] - ci_99[0]\n\nprint(f\"95% CI ширина: {width_95:.3f}\")\nprint(f\"99% CI ширина: {width_99:.3f}\")\n\nassert width_99 > width_95, \"99% доверительный интервал обязан быть шире 95%\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда использовать доверительные интервалы?\nВсегда показывайте CI на графиках динамики метрик (Error Bars). Одиночная точка без доверительного интервала вводит руководство в иллюзию абсолютной точности."}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 4. Проверка статистических гипотез: p-value, t-тест и U-критерий Манна-Уитни\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\n\n## 📌 Бизнес-контекст и методология\nКаждый раз, когда продуктовая команда выкатывает фичу, возникает вопрос: «Рост метрики — это реальный эффект или случайность?». \nP-value дает ответ: какова вероятность получить такую или большую разницу при условии, что никакого эффекта на самом деле нет ($H_0$)."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nab_csv = ensure_dataset(\"ab_test_checkout.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним выручку на пользователя между контрольной (`A_Control`) и тестовой (`B_Variant`) группами с помощью t-теста Уэлча и U-критерия Манна-Уитни."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\n\ndf_ab = pd.read_csv(ab_csv)\n\ngroup_a = df_ab[df_ab['test_group'] == 'A_Control']['revenue']\ngroup_b = df_ab[df_ab['test_group'] == 'B_Variant']['revenue']\n\n# t-тест Уэлча\nt_stat, t_pval = stats.ttest_ind(group_a, group_b, equal_var=False)\n\n# U-критерий Манна-Уитни\nu_stat, u_pval = stats.mannwhitneyu(group_a, group_b)\n\nprint(f\"t-test:  t-statistic = {t_stat:.3f}, p-value = {t_pval:.4f}\")\nprint(f\"MWU-test: U-statistic = {u_stat:.1f}, p-value = {u_pval:.4f}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: Что такое p-value геометрически?\nP-value — это площадь хвоста распределения нулевой гипотезы $H_0$ правее (и левее) наблюдаемой t-статистики. \nЕсли наблюдаемое значение попадает в «красную зону» отвержения ($\\alpha = 0.05$), мы отвергаем $H_0$."}, {"type": "code", "content": "import matplotlib.pyplot as plt\nfrom scipy import stats\n\nfig, axes = plt.subplots(1, 2, figsize=(16, 5))\nfig.suptitle('Анатомия проверки гипотез: p-value и распределения групп', fontsize=14, fontweight='bold')\n\n# 1. Геометрический смысл p-value\nax1 = axes[0]\nx = np.linspace(-4, 4, 500)\ny = stats.norm.pdf(x)\nax1.plot(x, y, color='#0a0a0a', linewidth=2, label='Распределение H₀ (нет эффекта)')\n\nalpha_crit = 1.96\nax1.fill_between(x[x >= alpha_crit], y[x >= alpha_crit], color='#cc4b37', alpha=0.35, label='Критическая зона α=0.05')\nax1.fill_between(x[x <= -alpha_crit], y[x <= -alpha_crit], color='#cc4b37', alpha=0.35)\n\nt_obs = abs(t_stat)\nax1.axvline(t_obs, color='#1779ba', linewidth=2.5, linestyle='-', label=f'Наблюдаемая |t| = {t_obs:.2f}')\nax1.fill_between(x[x >= t_obs], y[x >= t_obs], color='#1779ba', alpha=0.6, label='p-value (площадь хвоста)')\n\nax1.set_title('Геометрия p-value на распределении Стьюдента', fontsize=11)\nax1.set_xlabel('t-значение')\nax1.set_ylabel('Плотность')\nax1.legend(loc='upper left', fontsize=9)\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Наложение распределений Группы А и Группы В\nax2 = axes[1]\nax2.hist(group_a, bins=30, alpha=0.55, color='#767676', label=f'Контроль A (Среднее=${group_a.mean():.1f})', density=True)\nax2.hist(group_b, bins=30, alpha=0.55, color='#1779ba', label=f'Тест B (Среднее=${group_b.mean():.1f})', density=True)\nax2.axvline(group_a.mean(), color='#767676', linestyle='--', linewidth=2)\nax2.axvline(group_b.mean(), color='#1779ba', linestyle='--', linewidth=2)\n\nstatus_text = \"Различие статистически значимо\" if t_pval < 0.05 else \"Различие НЕ значимо (шум)\"\nax2.set_title(f'Сравнение выборок: {status_text} (p={t_pval:.3f})', fontsize=11)\nax2.set_xlabel('Выручка на пользователя ($)')\nax2.set_ylabel('Плотность')\nax2.legend(loc='upper right', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Односторонний vs Двусторонний t-тест\nПроведите односторонний t-тест с альтернативой `alternative='greater'` (проверяем, что группа B строго лучше группы A)."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nt_stat_1s, t_pval_1s = stats.ttest_ind(group_b, group_a, alternative='greater', equal_var=False)\n\nprint(f\"Односторонний p-value: {t_pval_1s:.4f}\")\nassert t_pval_1s <= 1.0, \"p-value обязан быть в диапазоне [0, 1]\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Когда выбирать Манна-Уитни вместо t-теста?\nЕсли распределение сильно скошено (время сессий, количество кликов, чеки с редкими гигантскими выбросами), t-тест теряет мощность. U-критерий Манна-Уитни работает на рангах и устойчив к любым экстремальным выбросам."}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 5. Корреляция и регрессионный анализ: OLS и логистическая регрессия\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\n\n## 📌 Бизнес-контекст и методология\n«Корреляция не означает причинность» — золотое правило аналитика. Два показателя могут коррелировать из-за третьего скрытого фактора (Confounder). \nЛинейная регрессия (МНК / OLS) позволяет не только измерить силу связи, но и прогнозировать $Y$ по $X$, оценивая маржинальный эффект каждого вложенного доллара."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nПостроим регрессионную модель зависимости выручки от активности пользователя в приложении (`active_seats`)."}, {"type": "code", "content": "from scipy import stats\nimport pandas as pd\nimport numpy as np\n\ndf_saas = pd.read_csv(saas_csv)\n\nx = df_saas['active_seats'].values\ny = df_saas['mrr'].values\n\nslope, intercept, r_val, p_val, std_err = stats.linregress(x, y)\n\nprint(f\"Коэффициент наклона (Slope): ${slope:.2f} прибавки к MRR на каждое рабочее место\")\nprint(f\"Коэффициент корреляции Пирсона r: {r_val:.3f}\")\nprint(f\"Коэффициент детерминации R²:     {r_val**2:.3f}\")"}, {"type": "markdown", "content": "### 📊 Визуализация: OLS линия регрессии, Квартет Энскомба и Корреляционная матрица\nГрафик ниже демонстрирует:\n1. Линейную регрессию с доверительным интервалом предсказания;\n2. Почему нельзя слепо верить цифре $r$ без визуализации (Квартет Энскомба);\n3. Корреляционную тепловую карту ключевых продуктовых метрик."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Регрессионный анализ и опасности слепой корреляции', fontsize=14, fontweight='bold')\n\n# 1. Скаттер с OLS линией тренда и 95% доверительным интервалом\nax1 = axes[0]\nax1.scatter(x, y, alpha=0.3, color='#1779ba', s=20, label='Пользователи')\nx_line = np.linspace(min(x), max(x), 100)\ny_line = slope * x_line + intercept\nax1.plot(x_line, y_line, color='#cc4b37', linewidth=2.5, label=f'OLS: Y = {slope:.2f}X + {intercept:.1f}')\nax1.set_title(f'Связь Active Seats и Выручки (R²={r_val**2:.2f})', fontsize=11)\nax1.set_xlabel('Количество мест (Active Seats)')\nax1.set_ylabel('MRR ($)')\nax1.legend(loc='upper left')\nax1.grid(True, linestyle=':', alpha=0.5)\n\n# 2. Демонстрация: Одинаковый r, совершенно разные зависимости\nax2 = axes[1]\nx_demo = np.linspace(1, 10, 40)\ny_lin = 2 * x_demo + np.random.normal(0, 1, 40)\ny_curve = -(x_demo - 5)**2 + 25 + np.random.normal(0, 0.5, 40)\n\nax2.scatter(x_demo, y_lin, color='#1779ba', label='Линейная (r=0.91)', alpha=0.7)\nax2.scatter(x_demo, y_curve, color='#ffae00', label='Нелинейная парабола (r=0.05)', alpha=0.7)\nax2.set_title('Ловушка корреляции: Всегда смотрите на график!', fontsize=11)\nax2.set_xlabel('Предиктор X')\nax2.set_ylabel('Отклик Y')\nax2.legend(loc='lower center', fontsize=9)\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Корреляционная матрица метрик бизнеса\nax3 = axes[2]\nmetrics = ['Ad Spend', 'Visits', 'Bounce %', 'Conv %', 'Revenue']\ncorr_data = np.array([\n    [ 1.00,  0.88, -0.22,  0.41,  0.82],\n    [ 0.88,  1.00, -0.31,  0.35,  0.74],\n    [-0.22, -0.31,  1.00, -0.68, -0.45],\n    [ 0.41,  0.35, -0.68,  1.00,  0.79],\n    [ 0.82,  0.74, -0.45,  0.79,  1.00]\n])\nim = ax3.imshow(corr_data, cmap='coolwarm', vmin=-1, vmax=1)\nax3.set_xticks(range(len(metrics)))\nax3.set_yticks(range(len(metrics)))\nax3.set_xticklabels(metrics, rotation=45, ha='right', fontsize=9)\nax3.set_yticklabels(metrics, fontsize=9)\n\nfor i in range(len(metrics)):\n    for j in range(len(metrics)):\n        val = corr_data[i, j]\n        color = 'white' if abs(val) > 0.5 else 'black'\n        ax3.text(j, i, f'{val:.2f}', ha='center', va='center', color=color, fontweight='bold', fontsize=8)\n\nax3.set_title('Корреляционная матрица метрик', fontsize=11)\nplt.colorbar(im, ax=ax3, shrink=0.75)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Прогнозирование MRR для нового клиента\nИспользуя найденные коэффициенты регрессии (`slope` и `intercept`), сделайте прогноз MRR для клиента с `active_seats = 15`."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\npredicted_mrr = slope * 15 + intercept\n\nprint(f\"Прогнозируемый MRR для 15 active seats: ${predicted_mrr:.2f}\")\nassert predicted_mrr > 0, \"Прогноз MRR должен быть положительным числом\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Главное предостережение\nВысокий $R^2$ не гарантирует причинность. Перед тем как советовать отделу маркетинга раздувать бюджет на основе регрессии, запустите контролируемый A/B тест."}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 5. Урок 6. Статистические ловушки в бизнесе: парадокс Симпсона, ошибка выжившего и регрессия к среднему\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\n\n## 📌 Бизнес-контекст и методология\nДаже математически безупречные расчеты могут привести компанию к катастрофическим управленческим решениям, если аналитик попадает в классические статистические ловушки:\n1. **Парадокс Симпсона:** Агрегированные данные показывают тренд, противоположный тренду внутри каждой отдельной подгруппы.\n2. **Ошибка выжившего (Survivorship bias):** Анализ только успешных кейсов (победивших стартапов, активных клиентов) без учета «кладбища» ушедших.\n3. **Регрессия к среднему:** Экстремальные взлеты или падения метрик естественным образом откатываются назад без какого-либо вмешательства."}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСмоделируем реальный продуктовый кейс: новый дизайн лендинга побеждает на мобилках и побеждает на десктопе, но проигрывает в сумме."}, {"type": "code", "content": "# Пример парадокса Симпсона в A/B тесте конверсии\n# Сегмент 1: Mobile\nmobile_a_views, mobile_a_conv = 1000, 100  # 10.0%\nmobile_b_views, mobile_b_conv = 4000, 480  # 12.0% (B побеждает на +2%)\n\n# Сегмент 2: Desktop\ndesktop_a_views, desktop_a_conv = 4000, 800  # 20.0%\ndesktop_b_views, desktop_b_conv = 1000, 220  # 22.0% (B побеждает на +2%)\n\n# ИТОГО (агрегированно):\ntotal_a_views = mobile_a_views + desktop_a_views\ntotal_a_conv = mobile_a_conv + desktop_a_conv\ncr_a = total_a_conv / total_a_views  # 900 / 5000 = 18.0%\n\ntotal_b_views = mobile_b_views + desktop_b_views\ntotal_b_conv = mobile_b_conv + desktop_b_conv\ncr_b = total_b_conv / total_b_views  # 700 / 5000 = 14.0% (Агрегированно B \"проиграл\" 14% vs 18%!)\n\nprint(f\"Mobile:  CR(A)={mobile_a_conv/mobile_a_views:.1%}, CR(B)={mobile_b_conv/mobile_b_views:.1%} -> Вариант B ЛУЧШЕ (+2%)\")\nprint(f\"Desktop: CR(A)={desktop_a_conv/desktop_a_views:.1%}, CR(B)={desktop_b_conv/desktop_b_views:.1%} -> Вариант B ЛУЧШЕ (+2%)\")\nprint(f\"ИТОГО:   CR(A)={cr_a:.1%}, CR(B)={cr_b:.1%} -> Вариант B 'ХУЖЕ' на -4.0%?!\")"}, {"type": "markdown", "content": "### 📊 Визуализация: 3 главные ловушки аналитики\nНиже визуализированы:\n1. **Парадокс Симпсона:** почему смешивание разных долей мобильного и десктопного трафика вызвало оптический обман;\n2. **Ошибка выжившего:** реальное кладбище продуктов vs видимый успех;\n3. **Регрессия к среднему:** естественный откат аномального всплеска продаж."}, {"type": "code", "content": "import matplotlib.pyplot as plt\n\nfig, axes = plt.subplots(1, 3, figsize=(16, 5))\nfig.suptitle('Анатомия статистических ловушек в продуктовых решениях', fontsize=14, fontweight='bold')\n\n# 1. Парадокс Симпсона (Bar chart)\nax1 = axes[0]\nsegments = ['Mobile', 'Desktop', 'ИТОГО (Общий)']\ncr_a_vals = [mobile_a_conv/mobile_a_views * 100, desktop_a_conv/desktop_a_views * 100, cr_a * 100]\ncr_b_vals = [mobile_b_conv/mobile_b_views * 100, desktop_b_conv/desktop_b_views * 100, cr_b * 100]\n\nx_idx = np.arange(len(segments))\nwidth = 0.35\n\nrects1 = ax1.bar(x_idx - width/2, cr_a_vals, width, label='Вариант A (Контроль)', color='#767676')\nrects2 = ax1.bar(x_idx + width/2, cr_b_vals, width, label='Вариант B (Тест)', color='#1779ba')\n\nax1.set_title('Парадокс Симпсона: B лучше в группах, но хуже в сумме', fontsize=10, fontweight='bold')\nax1.set_ylabel('Конверсия (%)')\nax1.set_xticks(x_idx)\nax1.set_xticklabels(segments)\nax1.legend()\nax1.grid(True, linestyle=':', alpha=0.5)\n\nfor r in rects1 + rects2:\n    h = r.get_height()\n    ax1.annotate(f'{h:.1f}%', xy=(r.get_x() + r.get_width() / 2, h),\n                 xytext=(0, 3), textcoords=\"offset points\", ha='center', va='bottom', fontsize=9)\n\n# 2. Ошибка выжившего (Survivorship Bias)\nax2 = axes[1]\nyears = np.arange(1, 11)\nall_startups = 1000 * np.exp(-0.25 * years)\nprofitable = all_startups * (0.05 + 0.08 * years)\n\nax2.fill_between(years, 0, all_startups, color='#cc4b37', alpha=0.3, label='Закрывшиеся стартапы (90%)')\nax2.fill_between(years, 0, profitable, color='#3adb76', alpha=0.7, label='Выжившие единороги (10%)')\nax2.set_title('Ошибка выжившего: Мы изучаем только 10%', fontsize=11, fontweight='bold')\nax2.set_xlabel('Лет с основания компании')\nax2.set_ylabel('Количество компаний')\nax2.legend(loc='upper right')\nax2.grid(True, linestyle=':', alpha=0.5)\n\n# 3. Регрессия к среднему (Regression to the Mean)\nax3 = axes[2]\nnp.random.seed(42)\ndays = np.arange(1, 31)\ndaily_sales = 100 + np.random.normal(0, 10, 30)\ndaily_sales[14] = 155\n\nax3.plot(days, daily_sales, marker='o', markersize=4, color='#1779ba', label='Дневные продажи')\nax3.axhline(100, color='#767676', linestyle='--', label='Средний уровень (100 шт)')\nax3.scatter(15, 155, color='#cc4b37', s=80, zorder=5, label='Аномальный пик')\nax3.annotate('После пика спад неизбежен\\nБЕЗ всяких внешних причин!', xy=(15, 155), xytext=(17, 135),\n             arrowprops=dict(arrowstyle=\"->\", color='#cc4b37', lw=1.5), fontsize=9)\nax3.set_title('Регрессия к среднему: Пик сменяется откатом', fontsize=11, fontweight='bold')\nax3.set_xlabel('День месяца')\nax3.set_ylabel('Продажи (шт)')\nax3.legend(loc='upper left', fontsize=8)\nax3.grid(True, linestyle=':', alpha=0.5)\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет взвешенной конверсии по сегментам\nИспользуя стратифицированное взвешивание, рассчитайте корректную конверсию для вариантов A и B при равных долях трафика 50/50."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\nstratified_cr_a = 0.5 * (mobile_a_conv / mobile_a_views) + 0.5 * (desktop_a_conv / desktop_a_views)\nstratified_cr_b = 0.5 * (mobile_b_conv / mobile_b_views) + 0.5 * (desktop_b_conv / desktop_b_views)\n\nprint(f\"Взвешенная CR(A): {stratified_cr_a:.2%}\")\nprint(f\"Взвешенная CR(B): {stratified_cr_b:.2%}\")\n\nassert stratified_cr_b > stratified_cr_a, \"При равных весах вариант B обязан побеждать!\"\nprint(\"✅ Тест успешно пройден!\")"}, {"type": "markdown", "content": "### 💼 Чек-лист аналитика перед сдачей отчета:\n1. Сегментируйте метрики по ключевым срезам (устройства, страны, каналы).\n2. Проверяйте, не изменились ли пропорции трафика в группах.\n3. Не приписывайте изменения метрик новым фичам, если это просто регрессия к среднему."}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6. BI дашборды в Looker Studio", "cat": "BI", "badge": "BI", "icon": "", "desc": "Моделирование данных, интерактивные фильтры, executive-дашборды для бизнеса.", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio & BI)\n\n---\n\n### Вопрос 1\nКак правильно рассчитать конверсию (Conversion Rate) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Purchases / Sessions)`\n- [x] `SUM(Purchases) / SUM(Sessions)`\n- [ ] `Purchases / Sessions`\n*Объяснение*: Нельзя усреднять частные (`AVG(...)`). Необходимо вычислить отношение суммы всех покупок к сумме всех сессий.\n\n---\n\n### Вопрос 2\nЧто такое Granularity Mismatch при Data Blending?\n- [ ] Ошибка в названии столбца.\n- [x] Несоответствие уровня детализации таблиц (например, расходы сгруппированы по дням, а продажи — по конкретным секундам чеков), приводящее к задвоению метрик.\n- [ ] Нехватка оперативной памяти в браузере.\n*Объяснение*: Для корректного соединения обе таблицы должны быть приведены к одинаковому составному ключу группировки.\n\n---\n\n### Вопрос 3\nКаково правило «5 секунд» в дизайне бизнес-дашбордов?\n- [ ] Дашборд должен загружаться не более 5 секунд.\n- [x] Руководитель должен за 5 секунд понять текущий статус ключевых KPI и наличие отклонений от плана.\n- [ ] Графики должны обновляться каждые 5 секунд.\n*Объяснение*: Главные карточки метрик с индикаторами отклонения должны считываться моментально в верхнем левом углу.\n\n---\n\n### Вопрос 4\nПочему в BI-системах агрегированные метрики отношений (например, CTR или Конверсия) нельзя вычислять как среднее по строкам?\n- [ ] BI-инструменты зависают от таких формул.\n- [x] Среднее арифметическое от долей игнорирует вес каждой строки; корректная формула требует отношения сумм: SUM(кликов) / SUM(показов).\n- [ ] Это разрешено, если строк больше 1000.\n*Объяснение*: Неправильная агрегация приводит к парадоксу Симпсона и искажению отчетов.\n\n---\n\n### Вопрос 5\nВ чем преимущество выноса тяжелых JOIN-ов из Looker Studio в витрины данных BigQuery или ClickHouse?\n- [ ] В Looker Studio нельзя использовать JOIN.\n- [x] Предварительно рассчитанные плоские витрины ускоряют загрузку дашборда до долей секунды и экономят ресурсы браузера пользователя.\n- [ ] Это экономит бумагу при печати отчета.\n*Объяснение*: BI должен только визуализировать готовые данные, а не исполнять тяжелые вычисления на лету.\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 1. Архитектура BI и подключение источников данных в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\n\n## 📌 Бизнес-контекст и методология\nСовременный BI-дашборд — это вершина айсберга Modern Data Stack.\nЕсли аналитик подключает BI напрямую к операционной транзакционной базе (OLTP PostgreSQL/MySQL), он рискует заблокировать прод медленными аналитическими запросами.\nИндустриальный стандарт 2027 года:\n1. Выгрузка из источников через ELT (Airbyte / Fivetran)\n2. Хранилище данных (OLAP BigQuery / Snowflake / ClickHouse)\n3. Моделирование денормализованных плоских витрин (Data Marts через dbt)\n4. Подключение BI-инструмента (Looker Studio / Tableau / Power BI)"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filename),\n        os.path.join(\"..\", \"datasets\", filename),\n        os.path.join(\"..\", \"..\", \"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", subfolder, filename),\n        os.path.join(\"datasets\", filename),\n    ]\n    for c in candidates:\n        if os.path.exists(c):\n            return c\n    raw_base = \"https://raw.githubusercontent.com/Enlyl/data-analyst-2027/main/course/datasets\"\n    url = f\"{raw_base}/{subfolder}/{filename}\" if subfolder else f\"{raw_base}/{filename}\"\n    urllib.request.urlretrieve(url, filename)\n    return filename\n\ncustomers_csv = ensure_dataset(\"customers.csv\", subfolder=\"raw\")\norders_csv = ensure_dataset(\"orders.csv\", subfolder=\"raw\")\nsaas_csv = ensure_dataset(\"saas_users.csv\", subfolder=\"raw\")\n\ndf_customers = pd.read_csv(customers_csv)\ndf_orders = pd.read_csv(orders_csv)\ndf_saas = pd.read_csv(saas_csv)\nprint(\"🟢 Окружение готово к анализу данных.\")"}, {"type": "markdown", "content": "## 🔍 Разбор механики и демонстрация на реальных данных\nСравним скорость отклика и стоимость двух режимов подключения BI:\n- **Direct Query (Live Connection):** запрос отправляется в хранилище при каждом клике пользователя\n- **Extracted Extract (Кэширование):** сжатая витрина хранится в памяти BI-сервера и обновляется по расписанию"}, {"type": "code", "content": "# Демонстрация: Моделирование плоской денормализованной витрины для BI\ndf_mart = df_customers.merge(df_orders, on='customer_id', how='left')\nbi_kpis = df_mart.groupby('city').agg(\n    total_customers=('customer_id', 'nunique'),\n    total_orders=('order_id', 'count'),\n    active_ratio=('order_id', lambda x: x.notnull().mean())\n).reset_index()\n\nbi_kpis['active_ratio_pct'] = bi_kpis['active_ratio'] * 100\ndisplay(bi_kpis.sort_values(by='total_orders', ascending=False).head(5))"}, {"type": "markdown", "content": "## 📊 Визуализация бизнес-кейса: Архитектура Modern Data Stack & Задержки\nСравним производительность и затраты различных уровней архитектуры данных при масштабировании количества запросов к дашборду."}, {"type": "code", "content": "# Визуализация сравнения режимов подключения BI\nmodes = ['Direct Query\\n(Сырая OLTP БД)', 'BigQuery BI Engine\\n(Векторный кэш)', 'Looker Extract\\n(In-memory витрина)']\nquery_time_sec = [4.8, 0.45, 0.12]\ncost_per_10k_views = [120, 25, 2]\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(12, 5), dpi=110)\n\n# Панель 1: Задержка загрузки (Latency)\nbars1 = ax1.bar(modes, query_time_sec, color=[ALERT, WARNING, SUCCESS], edgecolor='#333333', linewidth=0.6)\nax1.set_title(\"Время отклика дашборда при фильтрации (сек)\", fontsize=11, fontweight='bold')\nax1.set_ylabel(\"Задержка (секунды)\")\nax1.axhline(1.0, color=SECONDARY, linestyle='--', label='Порог комфорта UX (1.0 сек)')\nax1.legend(frameon=True, facecolor='#ffffff')\n\nfor b in bars1:\n    h = b.get_height()\n    ax1.annotate(f\"{h:.2f} с\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\n# Панель 2: Затраты на инфраструктуру\nbars2 = ax2.bar(modes, cost_per_10k_views, color=[ALERT, WARNING, SUCCESS], edgecolor='#333333', linewidth=0.6)\nax2.set_title(\"Стоимость облачных вычислений ($ за 10k просмотров)\", fontsize=11, fontweight='bold')\nax2.set_ylabel(\"Стоимость ($)\")\n\nfor b in bars2:\n    h = b.get_height()\n    ax2.annotate(f\"${h}\", xy=(b.get_x() + b.get_width()/2, h), xytext=(0, 4),\n                 textcoords=\"offset points\", ha='center', va='bottom', fontsize=10, fontweight='bold')\n\nplt.tight_layout()\nplt.show()"}, {"type": "markdown", "content": "### 🎯 Практическое задание 1: Расчет процента конверсии витрины\nНайдите город с наибольшим процентом активных клиентов (`active_ratio_pct`) и выведите его показатели."}, {"type": "code", "content": "### ВАШ КОД ЗДЕСЬ\ntop_city = bi_kpis.sort_values(by='active_ratio_pct', ascending=False).iloc[0]\nprint(f\"Город-лидер конверсии: {top_city['city']} ({top_city['active_ratio_pct']:.1f}%)\")\n\nassert top_city['active_ratio_pct'] > 50, \"Процент активных должен быть выше 50%\"\nprint(\"✅ Тест успешно пройден: плоская витрина для BI агрегирована без ошибок!\")"}, {"type": "markdown", "content": "### 💡 Инженерное правило BI: 5-Second Rule\nЕсли дашборд загружается дольше 5 секунд, 60% топ-менеджеров закрывают вкладку и перестают им пользоваться. Всегда создавайте предварительно агрегированные витрины данных."}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 6. Урок 2. Вычисляемые поля и параметры: CASE WHEN и агрегированные метрики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\n\n## 📌 Бизнес-контекст и методология\nВ BI-системах (Looker Studio, Tableau) расчет производных метрик (Margin %, Churn Rate, LTV/CAC) выполняется через **Calculated Fields (Вычисляемые поля)**.\nОпаснейшая ошибка: расчет отношения сумм вместо суммы отношений.\n- ❌ Неверно: `AVG(Revenue / Cost)` — искажает среднее при разных масштабах заказов\n- ✅ Верно: `SUM(Revenue) / SUM(Cost)` — математически строгая средневзвешенная метрика"}, {"type": "code", "content": "# 🚀 Универсальная инициализация окружения и данных\nimport os\nimport urllib.request\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\nimport seaborn as sns\n\nplt.style.use('seaborn-v0_8-whitegrid' if 'seaborn-v0_8-whitegrid' in plt.style.available else 'default')\nplt.rcParams['font.sans-serif'] = ['DejaVu Sans', 'Arial', 'Helvetica']\nplt.rcParams['axes.edgecolor'] = '#e6e6e6'\nplt.rcParams['axes.linewidth'] = 0.8\n\nPRIMARY = \"#1779ba\"\nSUCCESS = \"#3adb76\"\nALERT = \"#cc4b37\"\nWARNING = \"#ffae00\"\nSECONDARY = \"#767676\"\n\ndef ensure_dataset(filename, subfolder=\"\"):\n    if os.path.exists(filename):\n        return filename\n    candidates = [\n        os.path.join(\"course\", \"datasets\", subfolder, filename),\n        os.path.join(\"course\", \"datasets\", filename),\n        os.path.join(\"..\", \"datasets\", subfolder, filenam
