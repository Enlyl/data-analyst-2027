<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Analyst 2027</title>

  <!-- Foundation (ZURB) Design System Typography: Helvetica Neue -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='28' cy='28' r='20' fill='%23181818' stroke='%23FFFFFF' stroke-width='3.5'/%3E%3Crect x='19' y='27' width='3.5' height='12' rx='1' fill='%239B9B9B'/%3E%3Crect x='26' y='21' width='3.5' height='18' rx='1' fill='%23FFFFFF'/%3E%3Crect x='33' y='16' width='3.5' height='23' rx='1' fill='%23F97316'/%3E%3Crect x='41' y='41' width='6' height='18' rx='3' transform='rotate(-45 41 41)' fill='%23FFFFFF'/%3E%3C/svg%3E">

  <!-- Marked + Prism -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

  <style>
    /* ===== FOUNDATION (ZURB) DESIGN SYSTEM TOKENS ===== */
    :root {
      /* Foundation Palette */
      --foundation-primary: #1779ba;
      --foundation-primary-hover: #126195;
      --foundation-secondary: #767676;
      --foundation-success: #3adb76;
      --foundation-warning: #ffae00;
      --foundation-alert: #cc4b37;
      --foundation-black: #0a0a0a;
      --foundation-white: #fefefe;
      --foundation-medium-gray: #cacaca;
      --foundation-light-gray: #f4f4f4;
      --foundation-subtle-blue: #eef6fb;

      /* Semantic Mappings */
      --bg-base: #f4f4f4;
      --bg-surface: #fefefe;
      --bg-card: #fefefe;
      --bg-card-hover: #f0f7fb;
      --bg-deep: #e6e6e6;
      --border: #cacaca;
      --border-focus: #1779ba;
      --text-main: #0a0a0a;
      --text-secondary: #333333;
      --text-muted: #767676;
      --text-dim: #8a8a8a;
      --accent: #1779ba;
      --accent-hover: #126195;
      --success: #3adb76;
      --error: #cc4b37;
      --warning: #ffae00;
      --code-bg: #1e1e1e;
      --code-text: #fefefe;

      /* Typography */
      --font-body: 'Helvetica Neue', Helvetica, Roboto, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, Menlo, monospace;

      /* Type Scale (Foundation Spec) */
      --text-h1: 48px;
      --line-h1: 62px;
      --text-h2: 40px;
      --line-h2: 52px;
      --text-h3: 31px;
      --line-h3: 40px;
      --text-body: 16px;
      --line-body: 24px;

      /* Spacing rhythm */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;

      /* Radius: Foundation default is strictly 3px */
      --radius-default: 3px;
      --radius-pill: 3px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* ===== RESET ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html { height: 100%; }

    body {
      font-family: var(--font-body);
      background: var(--bg-base);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 340px;
      min-width: 340px;
      background: var(--bg-surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--foundation-primary);
    }

    .brand svg { width: 26px; height: 26px; flex-shrink: 0; }

    /* Progress */
    .progress-wrap { margin-top: 16px; }
    .progress-bar {
      background: var(--bg-deep);
      border-radius: var(--radius-default);
      height: 6px;
      overflow: hidden;
    }
    .progress-fill {
      background: var(--foundation-primary);
      height: 100%;
      width: 0%;
      transition: width 400ms var(--ease);
      border-radius: var(--radius-default);
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      line-height: 16px;
      color: var(--text-muted);
      margin-top: 8px;
      font-weight: 500;
    }

    /* Search */
    .search-box {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .search-input {
      width: 100%;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 8px 12px 8px 36px;
      font-size: 14px;
      color: var(--text-main);
      font-family: var(--font-body);
      outline: none;
      transition: border-color 200ms var(--ease), box-shadow 200ms var(--ease);
    }
    .search-input:focus {
      border-color: var(--foundation-primary);
      box-shadow: 0 0 4px rgba(23, 121, 186, 0.35);
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-wrap {
      position: relative;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 16px;
      height: 16px;
    }

    /* Module list */
    .module-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-surface);
    }
    .module-list::-webkit-scrollbar { width: 5px; }
    .module-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .cat-group { margin-bottom: 4px; }
    .cat-label {
      padding: 12px 20px 4px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--foundation-secondary);
    }

    .mod-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 150ms var(--ease);
      border-left: 3px solid transparent;
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .mod-item:hover {
      background: var(--bg-card-hover);
    }
    .mod-item.active {
      background: var(--foundation-subtle-blue);
      border-left-color: var(--foundation-primary);
      color: var(--foundation-primary);
      font-weight: 600;
    }
    .mod-item .mod-icon { font-size: 16px; flex-shrink: 0; width: 20px; text-align: center; }
    .mod-item .mod-badge {
      margin-left: auto;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-default);
      background: var(--bg-deep);
      color: var(--text-secondary);
      font-weight: 600;
      flex-shrink: 0;
      border: 1px solid #d4d4d4;
    }
    .mod-item.active .mod-badge {
      background: #dbebf6;
      color: var(--foundation-primary);
      border-color: #bcd9ee;
    }
    .mod-item .check-done {
      color: var(--foundation-success);
      font-size: 14px;
      margin-left: 4px;
      font-weight: bold;
    }

    /* ===== MAIN CONTENT ===== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Top bar (Foundation Top-Bar Style) */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      min-height: 56px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.04);
    }
    .topbar-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--foundation-black);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
      background: var(--foundation-white);
      padding: 0 32px;
    }
    .tab {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: color 150ms var(--ease), border-color 150ms var(--ease);
      white-space: nowrap;
    }
    .tab:hover { color: var(--foundation-primary); }
    .tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
    }

    /* Content area */
    #content-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      background: var(--bg-base);
    }
    #content-area::-webkit-scrollbar { width: 6px; }
    #content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ===== HERO (Foundation Style) ===== */
    .hero {
      text-align: center;
      padding: 64px 32px 48px;
      max-width: 900px;
      margin: 0 auto;
    }
    .hero-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: var(--radius-default);
      border: 1px solid var(--border);
      background: var(--foundation-subtle-blue);
      font-size: 12px;
      font-weight: 700;
      color: var(--foundation-primary);
      margin-bottom: 24px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero h1 {
      font-size: var(--text-h1);
      line-height: var(--line-h1);
      font-weight: 700;
      max-width: 720px;
      margin: 0 auto 20px;
      color: var(--foundation-black);
      letter-spacing: -0.02em;
    }
    .hero p {
      font-size: 18px;
      line-height: 28px;
      color: var(--foundation-secondary);
      max-width: 680px;
      margin: 0 auto 36px;
    }
    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 32px;
      margin-top: 36px;
      flex-wrap: wrap;
    }
    .hero-stat {
      text-align: center;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 16px 28px;
      min-width: 160px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.05);
    }
    .hero-stat-num {
      font-size: var(--text-h2);
      line-height: var(--line-h2);
      font-weight: 700;
      color: var(--foundation-primary);
      font-family: var(--font-body);
    }
    .hero-stat-label {
      font-size: 13px;
      line-height: 18px;
      color: var(--foundation-secondary);
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* ===== NOTEBOOK LESSON VIEW ===== */
    .lesson-header {
      margin-bottom: 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .lesson-header h2 {
      font-size: var(--text-h3);
      line-height: var(--line-h3);
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--foundation-black);
    }
    .lesson-header .lesson-desc {
      font-size: 16px;
      line-height: 24px;
      color: var(--foundation-secondary);
    }

    /* Foundation Button */
    .colab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--foundation-primary);
      border: 1px solid var(--foundation-primary-hover);
      border-radius: var(--radius-default);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      text-decoration: none;
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      margin-bottom: 20px;
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.1);
    }
    .colab-btn:hover {
      background: var(--foundation-primary-hover);
      border-color: #0e4c75;
      color: #ffffff;
    }
    .colab-btn svg { width: 18px; height: 18px; fill: currentColor; }

    /* Notebook sub-tabs */
    .nb-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .nb-tab {
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--foundation-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      border-radius: var(--radius-default) var(--radius-default) 0 0;
      transition: color 150ms var(--ease), background 150ms var(--ease);
      font-family: var(--font-body);
      white-space: nowrap;
    }
    .nb-tab:hover {
      color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }
    .nb-tab.active {
      color: var(--foundation-primary);
      border-bottom-color: var(--foundation-primary);
      background: var(--foundation-subtle-blue);
    }

    /* Cell rendering */
    .cell {
      margin-bottom: 16px;
      border-radius: var(--radius-default);
      overflow: hidden;
    }
    .cell-md {
      padding: 20px 24px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      font-size: 16px;
      line-height: 24px;
      color: var(--text-secondary);
      box-shadow: 0 1px 2px rgba(10, 10, 10, 0.03);
    }
    .cell-md h1, .cell-md h2, .cell-md h3, .cell-md h4 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 10px;
      font-weight: 700;
    }
    .cell-md h1 { font-size: 30px; line-height: 38px; }
    .cell-md h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .cell-md h3 { font-size: 20px; line-height: 28px; }
    .cell-md h4 { font-size: 17px; line-height: 24px; }
    .cell-md p { margin-bottom: 12px; }
    .cell-md ul, .cell-md ol { padding-left: 24px; margin-bottom: 12px; }
    .cell-md li { margin-bottom: 4px; }
    .cell-md code {
      background: var(--bg-deep);
      color: var(--foundation-black);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .cell-md pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 12px;
      border: 1px solid #333333;
    }
    .cell-md pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .cell-md blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .cell-md table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0;
      background: var(--foundation-white);
    }
    .cell-md th, .cell-md td {
      padding: 10px 14px;
      border: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
    }
    .cell-md th {
      background: var(--bg-deep);
      font-weight: 700;
      color: var(--foundation-black);
    }
    .cell-md strong { color: var(--foundation-black); font-weight: 700; }
    .cell-md a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .cell-md a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }

    .cell-code {
      position: relative;
      background: var(--code-bg);
      border: 1px solid #333333;
      border-radius: var(--radius-default);
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.12);
    }
    .cell-code-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #999999;
      border-bottom: 1px solid #333333;
      background: #181818;
      font-family: var(--font-mono);
      border-radius: var(--radius-default) var(--radius-default) 0 0;
    }
    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #444444;
      border-radius: var(--radius-default);
      color: #cccccc;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font-body);
      transition: background 150ms var(--ease), color 150ms var(--ease);
    }
    .copy-btn:hover { color: #ffffff; background: #3a3a3a; border-color: #666666; }
    .cell-code pre {
      padding: 16px;
      overflow-x: auto;
      margin: 0;
      font-size: 14px;
      line-height: 22px;
      color: #fefefe;
    }
    .cell-code code {
      font-family: var(--font-mono);
    }

    /* ===== README / QUIZ / CHEATSHEET views ===== */
    .md-view {
      max-width: 860px;
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 28px 32px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .md-view h1, .md-view h2, .md-view h3 {
      color: var(--foundation-black);
      margin-top: 24px;
      margin-bottom: 12px;
      font-weight: 700;
    }
    .md-view h1 { font-size: 30px; line-height: 38px; }
    .md-view h2 { font-size: 24px; line-height: 32px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
    .md-view h3 { font-size: 20px; line-height: 28px; }
    .md-view p { margin-bottom: 12px; color: var(--text-secondary); font-size: 16px; line-height: 24px; }
    .md-view ul, .md-view ol { padding-left: 24px; margin-bottom: 12px; color: var(--text-secondary); }
    .md-view li { margin-bottom: 6px; font-size: 16px; line-height: 24px; }
    .md-view code {
      background: var(--bg-deep);
      padding: 2px 6px;
      border-radius: var(--radius-default);
      font-family: var(--font-mono);
      font-size: 14px;
      border: 1px solid #d4d4d4;
    }
    .md-view pre {
      background: var(--code-bg);
      color: var(--code-text);
      border-radius: var(--radius-default);
      padding: 16px;
      overflow-x: auto;
      margin-bottom: 16px;
      border: 1px solid #333333;
    }
    .md-view pre code { background: none; padding: 0; color: #fefefe; border: none; }
    .md-view blockquote {
      border-left: 4px solid var(--foundation-primary);
      background: var(--foundation-subtle-blue);
      padding: 12px 16px;
      color: var(--text-secondary);
      margin: 12px 0;
      border-radius: 0 var(--radius-default) var(--radius-default) 0;
    }
    .md-view strong { color: var(--foundation-black); font-weight: 700; }
    .md-view a { color: var(--foundation-primary); text-decoration: none; font-weight: 600; }
    .md-view a:hover { text-decoration: underline; color: var(--foundation-primary-hover); }
    .md-view table { width: 100%; border-collapse: collapse; margin: 14px 0; }
    .md-view th, .md-view td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; font-size: 14px; }
    .md-view th { background: var(--bg-deep); font-weight: 700; color: var(--foundation-black); }
    .md-view hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    /* ===== QUIZ INTERACTIVE ===== */
    .quiz-question {
      background: var(--foundation-white);
      border: 1px solid var(--border);
      border-radius: var(--radius-default);
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 1px 3px rgba(10, 10, 10, 0.04);
    }
    .quiz-question h3 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--foundation-black);
    }
    .quiz-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-default);
      cursor: pointer;
      margin-bottom: 8px;
      border: 1px solid var(--border);
      background: var(--foundation-white);
      transition: background 150ms var(--ease), border-color 150ms var(--ease);
      font-size: 14px;
      line-height: 20px;
      color: var(--text-main);
    }
    .quiz-option:hover {
      background: var(--bg-card-hover);
      border-color: var(--foundation-primary);
    }
    .quiz-option.correct {
      border-color: var(--foundation-success);
      background: rgba(58, 219, 118, 0.16);
      color: #0b612c;
      font-weight: 600;
    }
    .quiz-option.wrong {

<script>
// ===== DATA =====
const GITHUB_BASE = "https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main";
const COURSE = [{"id": "module_00_onboarding", "title": "Модуль 0. Онбординг и мышление аналитика", "cat": "Фундамент", "badge": "Старт", "icon": "🚀", "desc": "Инструменты, майндсет AI-эры, постановка ТЗ и первая тетрадь в Colab.", "readme": "# 🚀 Модуль 0: Онбординг и мышление Data Analyst 2027\n\n## 📌 О модуле\nДобро пожаловать в профессию! Аналитика данных образца 2027 года фундаментально отличается от того, что было 5 лет назад. Рутинный синтаксис SQL и Python берет на себя искусственный интеллект, а от аналитика требуются **Problem Framing**, архитектурное понимание данных, формулирование ТЗ для AI и глубокое бизнес-видение.\n\n## 🎯 Learning Outcomes (Таксономия Блума)\n- **Remember**: Терминология (Data Analyst vs Data Scientist, CRISP-DM, EDA, KPI, Pipeline).\n- **Understand**: Отличия роли аналитика до и после AI-революции; архитектуру современного стека данных.\n- **Apply**: Развертывание рабочего окружения в Google Colab, подключение AI-ассистентов, создание первого репозитория на GitHub.\n- **Analyze**: Декомпозиция сырой проблемы бизнеса в систему метрик и аналитических задач.\n\n## 📚 Содержание уроков\n1. `lesson_01_role_data_analyst_2027.ipynb` — Профессия аналитика в эпоху AI: ландшафт рынка, карта компетенций, день из жизни.\n2. `lesson_02_environment_setup_colab_ai.ipynb` — Среда разработки: Google Colab, VS Code, Git, настройка Copilot/Cursor/Claude.\n3. `lesson_03_analytical_thinking_crisp_dm.ipynb` — Аналитическое мышление: методология CRISP-DM, перевод бизнес-боли в метрики.\n4. `quiz.md` — Тест для самопроверки (Active Recall).\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 0 (Онбординг & Аналитическое мышление)\n\n---\n\n### Вопрос 1\nВ чем заключается фундаментальное отличие роли Data Analyst 2027 года от роли 2020 года?\n- [ ] В 2027 году аналитики больше не используют базы данных и SQL.\n- [x] В 2027 году рутинное написание кода автоматизировано AI, а фокус сместился на Problem Framing, постановку ТЗ для LLM, фактчекинг и Data Storytelling.\n- [ ] В 2027 году аналитик обязан обучать собственные нейросети на суперкомпьютере.\n*Объяснение*: Рутинный синтаксис генерируют LLM. Главная ценность человека — перевод бизнес-проблем в метрики, критический аудит кода и коммуникация решений с топ-менеджментом.\n\n---\n\n### Вопрос 2\nРуководство компании жалуется: *«В этом месяце выручка упала на 10%, срочно удвойте расходы на маркетинг»*. Каково первое действие профессионального аналитика?\n- [ ] Сразу согласовать бюджет и запустить рекламу.\n- [x] Декомпозировать выручку на метрики Traffic * CR * AOV, сегментировать данные по платформам/каналам и локализовать причину падения.\n- [ ] Построить круговую диаграмму продаж.\n*Объяснение*: Если просадка вызвана техническим багом в чекауте или падением среднего чека, заливка нового рекламного трафика лишь сожжет деньги компании без роста продаж.\n\n---\n\n### Вопрос 3\nКакой этап методологии CRISP-DM является первым и самым важным для успеха проекта?\n- [ ] Data Preparation (Очистка данных).\n- [ ] Modeling (Построение моделей).\n- [x] Business Understanding (Понимание бизнес-контекста и целей).\n*Объяснение*: Не поняв экономический смысл задачи и решение, которое будет приниматься, аналитик рискует построить идеальный технический отчет, который окажется бесполезен бизнесу.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_role_data_analyst_2027.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 0. Урок 1: Профессия Data Analyst в эпоху генеративного ИИ (2027)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_01_role_data_analyst_2027.ipynb)\n\n---\n\n## 1. Фундаментальный сдвиг роли: от «SQL-машиниста» к Архитектору решений\n\nВ 2018–2022 годах 80% рабочего времени аналитика данных уходило на техническую рутину:\n- Написание однотипных запросов `SELECT ... JOIN ... GROUP BY`;\n- Ручная замена точек на запятые в Excel;\n- Бесконечный поиск синтаксиса Pandas на StackOverflow;\n- Построение простых графиков по просьбе менеджеров («построй мне диаграмму продаж по регионам к обеду»).\n\n**К осени 2026 — 2027 года этот рынок закрылся.** Модели уровня Claude 3.7 Sonnet, OpenAI o3 и Gemini 2.5 генерируют идеальный синтаксический код за секунды. Классический «джуниор», знавший только базовый SQL и пару функций Pandas, стал экономически нецелесообразен для найма.\n\n### Кем стал Data Analyst нового поколения?\nСовременный аналитик — это **переводчик между болью бизнеса и данными**:\n1. **Problem Framing (Постановка задачи)**: Бизнес приходит с туманной фразой: *«Кажется, у нас что-то не то с мобильным приложением»*. Аналитик переводит это в дерево измеримых метрик, формулирует проверяемые гипотезы и ставит техническое задание AI-ассистентам.\n2. **AI Orchestration (Управление ансамблем инструментов)**: Написание точных системных промптов для генерации пайплайнов, использование Cursor и Copilot для мгновенного прототипирования.\n3. **Data Verification & Zero Hallucination (Валидация и защита от ошибок)**: Нейросеть не несет финансовой ответственности за галлюцинацию в отчете. Аналитик владеет чеклистами верификации математических инвариантов и логики агрегаций.\n4. **Data Storytelling & Influence (Влияние на бизнес)**: Цифры сами по себе не имеют ценности. Ценность имеет решение CEO/CPO, принятое на их основе.\n\n```\n┌─────────────────────────────────────────────────────────────────────────────┐\n│                       АНАТОМИЯ СТОИМОСТИ АНАЛИТИКА 2027                     │\n├─────────────────────────────────────────────────────────────────────────────┤\n│  5%   │ Синтаксис (написание базового кода вручную)                          │\n│  25%  │ AI-оркестрация и архитектура витрин данных                          │\n│  30%  │ Валидация, фактчекинг и защита от галлюцинаций                       │\n│  40%  │ Data Storytelling, юнит-экономика и защита решений перед бизнесом    │\n└─────────────────────────────────────────────────────────────────────────────┘\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Загадочное падение продаж в Black Friday\"\n\n### Контекст компании\nКрупный омниканальный ритейлер электроники (500 000 MAU). В Черную пятницу коммерческий директор в панике: *«Выручка на 15% ниже прогноза, хотя бюджет на рекламу удвоен! Маркетологи говорят, что трафик рекордный. Разберитесь!»*\n\n### Как действует слабый аналитик (подход 2020 года):\n- Строит график выручки по часам.\n- Пишет в чат: *«Да, действительно, выручка упала на 15%. Вот график»*.\n- Тратит 2 дня на ручное ковыряние логов, бизнес теряет миллионы рублей прямо сейчас.\n\n### Как действует современный аналитик (AI-Assisted Workflow):\n1. Мгновенно раскладывает выручку на множители верхнего уровня:\n   $$\\text{Revenue} = \\text{Traffic} \\times \\text{CR (Conversion Rate)} \\times \\text{AOV (Average Order Value)}$$\n2. Пишет короткое ТЗ для AI: *«Сгенерируй скрипт для расчета динамики Traffic, CR и AOV по 15-минутным интервалам с разбивкой по платформам (iOS, Android, Web) и платежным шлюзам»*.\n3. Валидирует код и запускает.\n4. Обнаруживает: трафик вырос на 45%, AOV стабилен, но **конверсия на iOS версии 18.2 упала с 3.8% до 0.2%** из-за сбоя авторизации в SDK СБП (Системы быстрых платежей).\n5. Через 12 минут после запроса баг передан разработчикам, хотфикс выкачен, компания спасла 28 млн рублей выручки.\n"}, {"type": "code", "content": "# Практическая симуляция кейса Black Friday: декомпозиция сбоя\nimport pandas as pd\nimport numpy as np\nimport matplotlib.pyplot as plt\n\n# Симулируем 15-минутные интервалы Черной пятницы\nnp.random.seed(42)\ntime_slots = pd.date_range(\"2026-11-27 08:00\", \"2026-11-27 14:00\", freq=\"15min\")\n\ndata = []\nfor t in time_slots:\n    # Базовый трафик растет к полудню\n    traffic_web = np.random.randint(1200, 1800)\n    traffic_android = np.random.randint(2000, 2600)\n    traffic_ios = np.random.randint(2500, 3200)\n    \n    # Нормальная конверсия 3.5%\n    cr_web = np.random.normal(0.035, 0.002)\n    cr_android = np.random.normal(0.036, 0.002)\n    \n    # В 10:15 на iOS выкатили сбойный билд SDK платежей!\n    if t >= pd.Timestamp(\"2026-11-27 10:15\"):\n        cr_ios = np.random.normal(0.003, 0.001) # Просадка в 10 раз!\n    else:\n        cr_ios = np.random.normal(0.038, 0.002)\n        \n    data.append({'timestamp': t, 'platform': 'Desktop Web', 'traffic': traffic_web, 'cr': cr_web, 'aov': 4200})\n    data.append({'timestamp': t, 'platform': 'Android App', 'traffic': traffic_android, 'cr': cr_android, 'aov': 3900})\n    data.append({'timestamp': t, 'platform': 'iOS App', 'traffic': traffic_ios, 'cr': cr_ios, 'aov': 4800})\n\ndf_incident = pd.DataFrame(data)\ndf_incident['orders'] = (df_incident['traffic'] * df_incident['cr']).round(0)\ndf_incident['revenue'] = df_incident['orders'] * df_incident['aov']\n\n# Сводный анализ по платформам до и после 10:15\ndf_incident['incident_phase'] = np.where(df_incident['timestamp'] < '2026-11-27 10:15', 'До инцидента', 'Во время инцидента')\n\nsummary = df_incident.groupby(['incident_phase', 'platform']).agg(\n    avg_cr=('cr', lambda x: f\"{x.mean()*100:.2f}%\"),\n    total_revenue=('revenue', lambda x: f\"{x.sum():,.0f} руб\")\n).unstack(level=0)\n\nprint(\"=== РЕЗУЛЬТАТ ЛОКАЛИЗАЦИИ ПРОБЛЕМЫ АНАЛИТИКОМ ===\")\nprint(summary)\n"}, {"type": "markdown", "content": "## 3. Типичные ловушки новичков (Red Flags)\n1. **Ловушка агрегированных данных**: Смотреть на среднюю конверсию по всей компании. В общем котле просадка iOS выглядит как «легкое колебание», но внутри сегмента — катастрофа. Всегда сегментируйте!\n2. **Синдром курьера**: Принести график без ответа на вопрос: *«И что нам с этим делать?»*. Аналитик всегда должен давать **Action Item** (рекомендацию к действию).\n3. **Слепая вера коду AI**: Попросить ИИ посчитать среднюю конверсию, не проверив, посчитал ли он среднее от процентов (математическая ошибка!) или разделил сумму заказов на сумму сессий.\n\n---\n\n## 4. Практическое задание (Hands-on Practice)\n1. Измените в коде выше время начала инцидента на 11:30.\n2. Добавьте проверку: сколько недополученной выручки (Lost Revenue) принес сбой за время инцидента по сравнению с базовым сценарием?\n"}]}, {"filename": "lesson_01_what_is_data_analyst.ipynb", "rel_path": "course/module_00_onboarding/lesson_01_what_is_data_analyst.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Урок 1: Кто такой Data Analyst в 2027 году\n\n**Модуль 0: Стартовая площадка** | Время: ~45 минут\n\n---\n\n> *«Данные — это новая нефть, а аналитик — тот, кто умеет её перерабатывать в бензин для бизнеса»*\n\n## 🎯 Цели урока\n\nПосле этого урока вы сможете:\n- ✅ Объяснить, кто такой Data Analyst и чем он занимается\n- ✅ Понять, чем аналитик 2027 года отличается от аналитика 2020 года\n- ✅ Перечислить ключевые навыки: Hard Skills, Soft Skills, AI Skills\n- ✅ Различать типы аналитиков: продуктовый, маркетинговый, финансовый, BI\n- ✅ Понять карьерный путь и уровни зарплат"}, {"type": "markdown", "content": "---\n\n## 1. Кто такой Data Analyst? 🤔\n\n### Аналогия: Аналитик — это «переводчик» между данными и бизнесом\n\nПредставьте ситуацию: у вашей компании есть огромный склад с коробками. В каждой коробке — числа, даты, имена, суммы покупок, клики на сайте. **Сами по себе эти коробки бесполезны.** Никто не знает, что с ними делать.\n\n**Data Analyst** — это человек, который:\n1. 📦 **Открывает коробки** (собирает и чистит данные)\n2. 🔍 **Находит паттерны** (анализирует, что происходит)\n3. 📝 **Пишет историю** (визуализирует и объясняет результаты)\n4. 💡 **Даёт рекомендации** (помогает бизнесу принять решение)\n\n### Простой пример\n\nМенеджер спрашивает: *«Почему у нас упали продажи в марте?»*\n\nАналитик:\n- Достаёт данные о продажах за последний год\n- Смотрит, какие товары «просели»\n- Находит, что скидки конкурента совпали с падением\n- Показывает это на графике\n- Рекомендует: «Давайте запустим акцию на топ-3 товара»\n\n**Без аналитика** менеджер бы гадал наугад. **С аналитиком** — принимает решение на основе фактов."}, {"type": "markdown", "content": "---\n\n## 2. Аналитик 2020 vs Аналитик 2027 🕰️ → 🚀\n\nПрофессия аналитика радикально изменилась. Вот ключевые отличия:\n\n| Аспект | Аналитик 2020 | Аналитик 2027 |\n|--------|--------------|---------------|\n| **Основная работа** | Писать SQL-запросы, строить графики в Excel | Формулировать правильные вопросы, интерпретировать результаты AI |\n| **Рутина** | 60-70% времени на чистку данных | AI автоматизирует 80% чистки, аналитик проверяет результат |\n| **Инструменты** | Excel, SQL, Tableau | Python + AI-ассистенты, SQL, BI-платформы |\n| **Роль AI** | Почти не использовался | Ежедневный инструмент: генерация кода, EDA, визуализации |\n| **Коммуникация** | Отчёт раз в неделю | Real-time дашборды + storytelling с данными |\n| **Ценность** | «Человек, который делает отчёты» | «Человек, который находит инсайты и влияет на решения» |\n| **Скорость** | Неделя на анализ | Часы на анализ (с помощью AI) |\n\n### Главный сдвиг\n\n> **2020:** Аналитик ценился за то, что *умел писать сложные запросы*.\n>\n> **2027:** Аналитик ценится за то, что *умеет задавать правильные вопросы* и *превращать данные в действия*.\n\nЭто не значит, что технические навыки не нужны — наоборот! Но теперь вы можете использовать AI как «второго пилота», который помогает с кодом, пока вы фокусируетесь на **смысле данных**."}, {"type": "code", "content": "# 🎯 Давайте визуализируем, как изменилось распределение времени аналитика\n\n# Это ваш первый код! Не бойтесь — просто нажмите ▶️ (Play) слева от ячейки\n\nimport matplotlib.pyplot as plt\nimport matplotlib\nmatplotlib.rcParams['font.size'] = 12\n\n# --- Аналитик 2020 ---\ntasks_2020 = ['Сбор и\\nчистка данных', 'Написание\\nзапросов/кода', 'Анализ и\\nвизуализация', 'Коммуникация\\nс бизнесом']\ntime_2020 = [40, 25, 20, 15]\ncolors_2020 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\n# --- Аналитик 2027 ---\ntasks_2027 = ['Проверка данных\\n(AI делает чистку)', 'Промптинг AI +\\nпроверка кода', 'Глубокий анализ\\nи инсайты', 'Storytelling и\\nбизнес-решения']\ntime_2027 = [15, 20, 30, 35]\ncolors_2027 = ['#ff6b6b', '#ffa94d', '#51cf66', '#339af0']\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(14, 6))\n\n# Круговая диаграмма 2020\nax1.pie(time_2020, labels=tasks_2020, autopct='%1.0f%%', colors=colors_2020,\n        startangle=90, textprops={'fontsize': 10})\nax1.set_title('⏰ Рабочий день аналитика 2020', fontsize=14, fontweight='bold')\n\n# Круговая диаграмма 2027\nax2.pie(time_2027, labels=tasks_2027, autopct='%1.0f%%', colors=colors_2027,\n        startangle=90, textprops={'fontsize': 10})\nax2.set_title('🚀 Рабочий день аналитика 2027', fontsize=14, fontweight='bold')\n\nplt.suptitle('Как AI изменил работу аналитика', fontsize=16, fontweight='bold', y=1.02)\nplt.tight_layout()\nplt.show()\n\nprint(\"📊 Обратите внимание: в 2027 году аналитик тратит БОЛЬШЕ времени на анализ и коммуникацию,\")\nprint(\"   а AI берёт на себя рутину сбора и чистки данных!\")"}]}, {"filename": "lesson_02_environment_setup_colab_ai.ipynb", "rel_path": "course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb", "cells": [{"type": "markdown", "content": "# 🛠️ Модуль 0. Урок 2: Развертывание рабочего окружения и AI-стека аналитика\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_02_environment_setup_colab_ai.ipynb)\n\n---\n\n## 1. Архитектура рабочего места 2027: Cloud First + Local AI IDE\n\nСовременный специалист использует гибридную инфраструктуру:\n\n```\n┌────────────────────────────────────────────────────────────────────────┐\n│                        РАБОЧАЯ СРЕДА АНАЛИТИКА                         │\n├──────────────────────────────────┬─────────────────────────────────────┤\n│      ОБЛАЧНАЯ СРЕДА (CLOUD)      │     ЛОКАЛЬНАЯ СРЕДА (LOCAL IDE)     │\n├──────────────────────────────────┼─────────────────────────────────────┤\n│ • Google Colab (Zero Config)     │ • Cursor IDE (AI-native редактор)   │\n│ • Облачные GPU/TPU при нужде     │ • VS Code + GitHub Copilot          │\n│ • Google Drive / BigQuery        │ • Git + GitHub (версионирование)    │\n│ • Looker Studio (BI)             │ • Локальный SQLite / DuckDB         │\n└──────────────────────────────────┴─────────────────────────────────────┘\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Воспроизводимость отчета для инвесторов\"\n\n### Ситуация\nСтартап закрывает раунд финансирования Series A на \\$5 млн. Венчурный фонд просит предоставить когортный анализ за 2 года с кодом расчета Retention Rate.\n- Аналитик отправляет Jupyter ноутбук, сохраненный локально.\n- Партнер фонда открывает ноутбук: падает ошибка `FileNotFoundError: C:/Users/Vasya/Downloads/data_final_v2_NEW.csv`, версии Pandas не совпадают, функции устарели.\n- Сделка под угрозой: инвесторы сомневаются в технической зрелости команды.\n\n### Стандарт индустрии 2027:\n1. Ноутбук должен открываться в **1 клик в Google Colab**.\n2. Данные загружаются либо из облачного хранилища, либо генерируются/выгружаются скриптом автоматически.\n3. В начале каждого файла — блок фиксации версий зависимостей (`requirements.txt`).\n4. Все выводы сформулированы в Markdown-ячейках с четкой структурой.\n"}, {"type": "code", "content": "# Демонстрация полностью автономного и воспроизводимого блока данных\nimport sys\nimport pandas as pd\nimport numpy as np\n\n# Проверка версий\nassert sys.version_info >= (3, 9), \"Требуется Python 3.9 или выше\"\n\nprint(\" Среда верифицирована:\")\nprint(f\"- Python: {sys.version.split()[0]}\")\nprint(f\"- Pandas: {pd.__version__}\")\nprint(f\"- NumPy : {np.__version__}\")\n\n# Создание демо-когорты, не зависящей от локального диска\ndates = pd.date_range('2026-01-01', periods=12, freq='ME')\ncohort_mock = pd.DataFrame({\n    'Cohort': [d.strftime('%Y-%m') for d in dates],\n    'New_Users': np.random.randint(1500, 3000, 12),\n    'Month_1_Retention': np.random.uniform(0.35, 0.45, 12).round(3),\n    'Month_3_Retention': np.random.uniform(0.20, 0.28, 12).round(3)\n})\n\nprint(\"\\nПример воспроизводимого артефакта когорт:\")\nprint(cohort_mock.head(4))\n"}, {"type": "markdown", "content": "## 3. Чеклист готовности рабочего окружения\n- [ ] Аккаунт в Google (для Google Colab и Looker Studio).\n- [ ] Аккаунт на GitHub (для портфолио и контроля версий).\n- [ ] Настроенный редактор (Cursor или VS Code).\n- [ ] Доступ к LLM-ассистенту (ChatGPT Plus / Claude Pro / Cursor Agent).\n"}]}, {"filename": "lesson_03_analytical_thinking_crisp_dm.ipynb", "rel_path": "course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb", "cells": [{"type": "markdown", "content": "# 🧠 Модуль 0. Урок 3: Аналитическое мышление и индустриальный стандарт CRISP-DM\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_00_onboarding/lesson_03_analytical_thinking_crisp_dm.ipynb)\n\n---\n\n## 1. Методология CRISP-DM в деталях\n\nCRISP-DM (*Cross-Industry Standard Process for Data Mining*) — главный международный стандарт жизненного цикла работы с данными:\n\n```\n[1. Business Understanding] ─── \"Какую проблему бизнеса мы решаем и сколько денег это принесет?\"\n           │\n[2. Data Understanding]     ─── \"Какие данные есть, где они лежат, насколько они полны и достоверны?\"\n           │\n[3. Data Preparation]       ─── \"Очистка, джойны, обработка пропусков, фильтрация выбросов\"\n           │\n[4. Modeling & Analysis]    ─── \"Построение срезов, когорт, статтестов, регрессий или прогнозов\"\n           │\n[5. Evaluation]             ─── \"Ответил ли анализ на бизнес-вопрос? Нет ли ошибки в данных?\"\n           │\n[6. Deployment & Action]    ─── \"Внедрение дашборда, принятие решения о раскатке фичи, регламент\"\n```\n\n---\n\n## 2. Реальный бизнес-кейс: \"Сеть кофеен у дома: почему падает повторная посещаемость?\"\n\n### Business Understanding\nСеть из 45 кофеен фиксирует падение выручки со второго квартала на 12%. Руководство считает, что «надо запустить рекламу у блогеров».\nАналитик проводит Problem Framing:\n- **Целевая бизнес-метрика**: 30-Day Repeat Purchase Rate (доля гостей, вернувшихся в течение 30 дней).\n- **Гипотеза бизнеса**: «О нас мало знают новые клиенты».\n- **Контргипотеза аналитика**: «Мы теряем уже пришедших клиентов из-за падения качества сервиса или вкуса кофе».\n\n### Data Understanding & Preparation\nАналитик объединяет кассовые чеки с данными программы лояльности и отзывами на картах (Яндекс Карты, 2ГИС).\n"}, {"type": "code", "content": "import pandas as pd\nimport numpy as np\n\n# Симуляция исследования сети кофеен\nnp.random.seed(10)\nlocations = [f\"Кофейня_{i}\" for i in range(1, 11)]\n\ncoffee_data = []\nfor loc in locations:\n    guests = np.random.randint(800, 1500)\n    repeat_rate = np.random.uniform(0.18, 0.48)\n    avg_speed_sec = np.random.randint(90, 320) # Время ожидания кофе\n    complaints = int(guests * np.random.uniform(0.01, 0.08))\n    \n    coffee_data.append({\n        'location': loc,\n        'monthly_guests': guests,\n        'repeat_rate': repeat_rate,\n        'avg_wait_seconds': avg_speed_sec,\n        'complaints_count': complaints\n    })\n\ndf_coffee = pd.DataFrame(coffee_data)\n\n# Считаем корреляцию между скоростью отдачи кофе и повторными визитами\ncorr_wait = df_coffee['avg_wait_seconds'].corr(df_coffee['repeat_rate'])\nprint(f\"Корреляция между временем ожидания и Retention гостей: {corr_wait:.3f}\")\nprint(\"Вывод: Сильная отрицательная связь! Чем дольше гость ждет напиток, тем ниже вероятность возврата.\")\n\n# Топ-3 проблемные точки\nworst_locations = df_coffee.sort_values(by='avg_wait_seconds', ascending=False).head(3)\nprint(\"\\nТОП-3 ТОЧКИ С КРИТИЧЕСКИМ ВРЕМЕНЕМ ОЖИДАНИЯ:\")\nprint(worst_locations[['location', 'avg_wait_seconds', 'repeat_rate', 'complaints_count']])\n"}, {"type": "markdown", "content": "## 3. Бизнес-решение (Deployment / Action)\nВместо слива 3 000 000 рублей на блогеров:\n1. Выявлена реальная причина: на точках с ожиданием > 4 минут гости уходят в кофейни конкурентов за углом.\n2. Закуплены скоростные темперы и настроен дополнительный бариста в утренний час-пик.\n3. Время ожидания снизилось до 110 секунд, возвратность гостей выросла на 7 п.п., выручка восстановилась за 3 недели.\n"}]}]}, {"id": "module_01_excel", "title": "Модуль 1. Excel и Google Sheets", "cat": "Хард база", "badge": "Таблицы", "icon": "📊", "desc": "ВПР, XLOOKUP, сводные таблицы, формулы массивов и аудит вычислений.", "readme": "# 📊 Модуль 1: Excel и Google Sheets — Фундамент работы с данными\n\n## 📌 О модуле\nExcel и Google Sheets остаются главным языком коммуникации бизнеса. Топ-менеджеры, финансисты и маркетологи думают таблицами. Аналитик обязан уметь быстро рассчитывать срезы, собирать сводные таблицы и формулировать промпты для генерации сложных формул в Copilot.\n\n## 🎯 Learning Outcomes\n- **Understand**: Структуру плоских таблиц (tidy data), принципы адресации ($A$1 vs A1).\n- **Apply**: Функции `SUMIFS`, `COUNTIFS`, `XLOOKUP`, `INDEX+MATCH`, вложенные условия.\n- **Analyze**: Сводные таблицы (Pivot Tables), вычисляемые поля, когортные группировки.\n- **Create**: Интерактивные отчеты с визуализацией и срезами (Slicers); формулы через AI Copilot.\n\n## 📚 Уроки\n1. `lesson_01_interface_basics_formatting.ipynb` — Интерфейс, горячие клавиши, типы данных, условное форматирование.\n2. `lesson_02_formulas_functions_xlookup.ipynb` — Библиотека формул: математика, логика, текст, даты, современный XLOOKUP.\n3. `lesson_03_pivot_tables_aggregations.ipynb` — Сводные таблицы: многоуровневая группировка, % от общего, срезы.\n4. `lesson_04_visualization_data_story.ipynb` — Построение диаграмм по стандартам Тафти (Tufte): устранение визуального шума.\n5. `lesson_05_ai_copilot_excel_formulas.ipynb` — Промпт-инжиниринг для формул Excel, генерация Google Apps Script, валидация.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Справочник главных формул.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 1 (Excel)\n\n### Вопрос 1\nВ чем ключевое преимущество `XLOOKUP` перед `VLOOKUP`?\n- [ ] XLOOKUP работает быстрее ровно в 10 раз\n- [x] Искомый столбец может находиться левее возвращаемого, формула не ломается при добавлении столбцов\n- [ ] XLOOKUP работает только с числами\n\n### Вопрос 2\nЧто произойдет при копировании формулы `=A$1 + 10` вниз на 5 строк?\n- [ ] Ссылка сместится на A6\n- [x] Номер строки зафиксирован знаком $, ссылка останется на ячейку A1\n- [ ] Выдаст ошибку #REF!\n\n### Вопрос 3\nПочему в профессиональных отчетах избегают 3D круговых диаграмм (Pie Charts)?\n- [ ] Они занимают слишком много памяти на компьютере\n- [x] Они искажают пропорции восприятия долей и перегружают внимание визуальным мусором\n- [ ] Их не поддерживает Excel\n", "cheatsheet": "# 📋 Excel & Sheets Cheatsheet\n\n| Задача | Формула |\n|---|---|\n| Поиск значения | `=XLOOKUP(F2, A:A, C:C, \"Не найдено\")` |\n| Сумма с условием | `=SUMIFS(D:D, A:A, \"Completed\", B:B, \">=\"&DATE(2026,1,1))` |\n| Количество уникальных | `=COUNTA(UNIQUE(FILTER(B:B, A:A=\"Completed\")))` |\n| Безопасный расчет | `=IFERROR(A2 / B2, 0)` |\n| Склейка текста | `=TEXTJOIN(\" - \", TRUE, A2, B2)` |\n", "notebooks": [{"filename": "lesson_01_interface_basics_formatting.ipynb", "rel_path": "course/module_01_excel/lesson_01_interface_basics_formatting.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 1. Урок 1: Архитектура таблиц и принципы Tidy Data в Excel / Sheets\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_01_interface_basics_formatting.ipynb)\n\n---\n\n## 1. Ментальная модель: Почему 90% таблиц в бизнесе \"сломаны\"?\n\nВ корпоративном мире финансисты и менеджеры часто создают таблицы для **человеческих глаз**, а не для машинного анализа:\n- Объединенные ячейки (Merged Cells) — злейший враг аналитика;\n- Итоги посреди данных;\n- Пустые строки для «красоты»;\n- Даты, размазанные по столбцам вправо.\n\n### Стандарт Хэдли Уикхема: Tidy Data (Аккуратные данные)\n1. **Каждая переменная образует столбец**.\n2. **Каждое наблюдение образует строку**.\n3. **Каждый тип сущности образует отдельную таблицу**.\n"}, {"type": "code", "content": "# Демонстрация трансформации плохой сводки в Tidy Data\nimport pandas as pd\n\n# Типичный \"директорский\" отчет (Wide format с объединенными смыслами)\nugly_report = pd.DataFrame({\n    'Менеджер': ['Алексей', 'Мария', 'Иван'],\n    'Янв_План': [100000, 150000, 120000],\n    'Янв_Факт': [95000, 160000, 110000],\n    'Фев_План': [110000, 150000, 130000],\n    'Фев_Факт': [115000, 140000, 135000]\n})\n\nprint(\"СЫРОЙ ВИД (Не пригоден для SQL и BI):\")\nprint(ugly_report)\n\n# Переводим в Tidy формат через Pandas (в Excel это делается через Power Query Unpivot)\ntidy_df = pd.melt(\n    ugly_report, \n    id_vars=['Менеджер'], \n    var_name='Период_Метрика', \n    value_name='Сумма'\n)\ntidy_df[['Месяц', 'Тип']] = tidy_df['Период_Метрика'].str.split('_', expand=True)\ntidy_df = tidy_df.drop(columns=['Период_Метрика'])\n\nprint(\"\\nИДЕАЛЬНЫЙ TIDY DATA ВИД (Готов для сводных таблиц, SQL и Looker Studio):\")\nprint(tidy_df.head(6))\n"}]}, {"filename": "lesson_02_formulas_functions_xlookup.ipynb", "rel_path": "course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb", "cells": [{"type": "markdown", "content": "# 🧮 Модуль 1. Урок 2: Библиотека формул: от агрегаций до XLOOKUP\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_02_formulas_functions_xlookup.ipynb)\n\n---\n\n## 1. Смерть VLOOKUP: Почему в 2027 году используют XLOOKUP?\n\nКлассический `VLOOKUP` (ВПР) имел 3 фатальных недостатка:\n1. **Жесткий номер столбца**: Если коллега вставил столбец в середину справочника — формула с номерами столбцов выдает неверные данные.\n2. **Поиск только вправо**: Нельзя искать значение, если ключ находится правее возвращаемого результата.\n3. **Медленная работа**: На таблицах от 50 000 строк VLOOKUP зависает.\n\n### Синтаксис XLOOKUP:\n```excel\n=XLOOKUP(искомое_значение; диапазон_поиска; возвращаемый_диапазон; [если_не_найдено]; [режим_сопоставления])\n```\n"}, {"type": "code", "content": "# Практический кейс: Склейка транзакций с себестоимостью через аналог XLOOKUP\nimport pandas as pd\n\n# Загружаем реальные датасеты курса\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\").head(10)\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\n\n# В Excel: =XLOOKUP(orders!C2; products!A:A; products!E:E; 0)\nmerged = orders.merge(products[['product_id', 'product_name', 'cost', 'category']], on='product_id', how='left')\nmerged['profit'] = merged['total_amount'] - (merged['cost'] * merged['quantity'])\n\nprint(\"РЕЗУЛЬТАТ РАСЧЕТА МАРЖИ С ПОМОЩЬЮ XLOOKUP-ЛОГИКИ:\")\nprint(merged[['order_id', 'product_name', 'quantity', 'unit_price', 'cost', 'total_amount', 'profit']])\n"}]}, {"filename": "lesson_03_pivot_tables_aggregations.ipynb", "rel_path": "course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb", "cells": [{"type": "markdown", "content": "# 📑 Модуль 1. Урок 3: Сводные таблицы (Pivot Tables) и срезы данных\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_03_pivot_tables_aggregations.ipynb)\n\n---\n\n## 1. Анатомия многомерного анализа без кода\n\nСводная таблица (Pivot Table) агрегирует тысячи строк сырых логов за доли секунды.\nКлючевые приемы профессионалов:\n- **Вычисляемые поля (Calculated Fields)**: Расчет среднего чека и маржи прямо внутри сводной таблицы.\n- **Отображение значений как % от строки / % от столбца**: Мгновенное выявление структуры продаж.\n- **Группировка дат**: Схлопывание ежедневных записей по Месяцам, Кварталам и Годам.\n"}, {"type": "code", "content": "# Построение сложной сводной таблицы по реальной базе e-commerce\nimport pandas as pd\n\norders = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\orders.csv\")\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\ncustomers = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\ndf = items.merge(orders, on='order_id').merge(customers, on='customer_id')\ndf = df[df['status'] == 'Completed']\n\n# Сводный отчет: Город x Канал привлечения с суммами и средними\npivot = pd.pivot_table(\n    df,\n    values='total_amount',\n    index='city',\n    columns='acquisition_channel',\n    aggfunc=['sum', 'count'],\n    fill_value=0\n)\n\nprint(\"СВОДНЫЙ ОТЧЕТ ПО ВЫРУЧКЕ И ЗАКАЗАМ:\")\nprint(pivot['sum'].round(0).astype(int))\n"}]}, {"filename": "lesson_04_visualization_data_story.ipynb", "rel_path": "course/module_01_excel/lesson_04_visualization_data_story.ipynb", "cells": [{"type": "markdown", "content": "# 📈 Модуль 1. Урок 4: Визуализация данных и принципы Эдварда Тафти\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_04_visualization_data_story.ipynb)\n\n---\n\n## 1. Принцип Data-Ink Ratio\n\nЭдвард Тафти, классик теории визуализации данных, сформулировал закон:\n$$\\text{Data-Ink Ratio} = \\frac{\\text{Чернила, отображающие данные}}{\\text{Все использованные чернила на графике}} \\to 1.0$$\n\n### Что нужно нещадно удалять с диаграмм:\n- Тяжелые фоновые сетки темных цветов;\n- 3D-эффекты и тени;\n- Повторяющиеся подписи осей;\n- Круговые диаграммы с более чем 3 сегментами (человеческий мозг плохо оценивает соотношение площадей и углов).\n"}, {"type": "code", "content": "# Демонстрация принципа минимализма Тафти на реальных данных\nimport matplotlib.pyplot as plt\nimport pandas as pd\n\nitems = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\order_items.csv\")\nproducts = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\products.csv\")\ndf = items.merge(products, on='product_id')\n\nsales_by_cat = df.groupby('category')['total_amount'].sum().sort_values(ascending=True)\n\nfig, ax = plt.subplots(figsize=(9, 4))\nbars = ax.barh(sales_by_cat.index, sales_by_cat.values, color='#0284c7', height=0.55)\n\n# Убираем рамки\nfor s in ['top', 'right', 'left']:\n    ax.spines[s].set_visible(False)\nax.spines['bottom'].set_color('#94a3b8')\n\n# Добавляем подписи данных прямо к столбцам\nfor bar in bars:\n    w = bar.get_width()\n    ax.text(w + 2000, bar.get_y() + bar.get_height()/2, f\"${w:,.0f}\", va='center', fontsize=10, color='#0f172a', weight='600')\n\nax.set_title('Выручка по категориям за отчетный период (Tufte Clean Style)', fontsize=12, pad=15, loc='left')\nax.xaxis.grid(True, linestyle='--', alpha=0.4, color='#cbd5e1')\nplt.tight_layout()\nplt.show()\n"}]}, {"filename": "lesson_05_ai_copilot_excel_formulas.ipynb", "rel_path": "course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 1. Урок 5: Генерация сложных формул и макросов через AI Copilot\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_01_excel/lesson_05_ai_copilot_excel_formulas.ipynb)\n\n---\n\n## 1. Промпт-инжиниринг для Excel / Google Sheets\n\nЧтобы нейросеть написала формулу без ошибок, используйте архитектуру **T-C-O (Task, Context, Output)**:\n1. **Context**: «Таблица 'Sales', колонка A — Order_Date (YYYY-MM-DD), колонка B — Customer_ID, колонка C — Status ('Done', 'Cancelled'), колонка D — Revenue (число)».\n2. **Task**: «Посчитай сумму выручки только для повторных клиентов (у которых больше 1 заказа со статусом 'Done') за последние 90 дней».\n3. **Output**: «Напиши формулу для Google Sheets. Учти деление на ноль и русскую локаль (разделитель точка с запятой ;)».\n\n---\n\n## 2. Чеклист валидации формул от нейросети\n- [ ] **Локализация разделителей**: US-локаль использует запятую `,`, европейская/российская — точку с запятой `;`.\n- [ ] **Фиксация диапазонов**: Проставлены ли знаки доллара `$A$2:$A$1000`, чтобы формула не съехала при протяжке.\n- [ ] **Обработка ошибок**: Обернута ли формула в `IFERROR(..., 0)`?\n"}]}]}, {"id": "module_02_sql", "title": "Модуль 2. SQL Master: от SELECT до оконных функций", "cat": "Хард база", "badge": "SQL", "icon": "🗄️", "desc": "CTE, оконные агрегаты, партиционирование, когорты и оптимизация запросов.", "readme": "# 🗃️ Модуль 2: SQL — От первых запросов до аналитических оконных функций\n\n## 📌 О модуле\nSQL (Structured Query Language) — главный фундамент data-стека. LLM пишут синтаксис, но только аналитик понимает структуру реляционной модели, видит дублирование при JOIN и умеет оптимизировать тяжелые запросы. В этом модуле мы работаем с реальной SQLite базой e-commerce на 15 000+ записей.\n\n## 🎯 Learning Outcomes\n- **Apply**: Составление сложных запросов (`SELECT`, `WHERE`, `GROUP BY`, `HAVING`, `ORDER BY`).\n- **Analyze**: Все виды `JOIN` (INNER, LEFT, FULL, CROSS, SELF), борьба с декартовым произведением строк.\n- **Evaluate**: Использование CTE (Common Table Expressions) для структурирования запросов вместо спагетти-подзапросов.\n- **Create**: Аналитические оконные функции (`ROW_NUMBER`, `DENSE_RANK`, `LAG`, `LEAD`, `SUM OVER (PARTITION BY ...)`).\n- **AI Orchestration**: Промптинг для генерации SQL, проверка EXPLAIN QUERY PLAN, защита от галлюцинаций агрегаций.\n\n## 📚 Уроки\n1. `lesson_01_db_intro_select_filtering.ipynb` — Подключение к базе, анатомия SQL, SELECT, WHERE, LIKE, IN.\n2. `lesson_02_aggregations_group_by_having.ipynb` — Агрегатные функции, группировка, разница WHERE vs HAVING.\n3. `lesson_03_joins_deep_dive.ipynb` — Реляционная связь, виды JOIN, поиск потерянных строк.\n4. `lesson_04_subqueries_and_cte.ipynb` — Чистый код через CTE (`WITH`), многоуровневая аналитика.\n5. `lesson_05_window_functions_advanced.ipynb` — Оконные функции: ранги, нарастающий итог, темпы роста (MoM / YoY).\n6. `lesson_06_sql_patterns_retention_funnels.ipynb` — Паттерны продуктовой аналитики: когорты, воронки на чистом SQL.\n7. `lesson_07_prompt_engineering_for_sql_and_validation.ipynb` — Генерация SQL через нейросети и строгий чеклист валидации.\n8. `quiz.md` — 15 вопросов со скринингов.\n9. `cheatsheet.md` — Справочник SQL конструкций.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 2 (SQL)\n\n### Вопрос 1\nВ чем разница между `RANK()` и `DENSE_RANK()`?\n- [ ] Разницы нет\n- [x] При одинаковых значениях RANK оставляет пропуски в нумерации (1, 2, 2, 4), а DENSE_RANK нумерует без пробелов (1, 2, 2, 3)\n- [ ] DENSE_RANK работает только в PostgreSQL\n\n### Вопрос 2\nЗачем нужна конструкция `WITH` (CTE)?\n- [ ] Она ускоряет любой запрос в 100 раз\n- [x] Она позволяет разбить сложный запрос на логические читаемые блоки и использовать их повторно\n- [ ] Без нее нельзя соединять таблицы\n\n### Вопрос 3\nКакой результат вернет `COUNT(*)` vs `COUNT(column_name)` если в колонке есть NULL?\n- [ ] Одинаковый\n- [x] `COUNT(*)` считает все строки, а `COUNT(column_name)` игнорирует строки с NULL\n- [ ] Вернет ошибку базы данных\n", "cheatsheet": "# 📋 SQL Cheatsheet\n\n```sql\n-- Оконная функция: прирост к предыдущему значению\nLAG(metric, 1) OVER (PARTITION BY user_id ORDER BY event_date)\n\n-- Оконная функция: доля строки в разрезе группы\nmetric * 100.0 / SUM(metric) OVER (PARTITION BY category)\n\n-- Безопасный расчет конверсии\nROUND(COUNT(DISTINCT converted_users) * 1.0 / NULLIF(COUNT(DISTINCT total_users), 0), 4)\n```\n", "notebooks": [{"filename": "lesson_01_db_intro_select_filtering.ipynb", "rel_path": "course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb", "cells": [{"type": "markdown", "content": "# 🗃️ Модуль 2. Урок 1: Реляционная модель данных и логический порядок выполнения SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_01_db_intro_select_filtering.ipynb)\n\n---\n\n## 1. Главный секрет SQL: Порядок написания vs Порядок выполнения\n\nПочему новички пишут неработающие запросы? Потому что SQL **пишется** в одном порядке, а СУБД **выполняет** его совершенно в другом!\n\n```\n┌─────────────────────────────────┬─────────────────────────────────┐\n│     КАК ВЫ ПИШЕТЕ ЗАПРОС        │      КАК ЕГО ВЫПОЛНЯЕТ СУБД     │\n├─────────────────────────────────┼─────────────────────────────────┤\n│ 1. SELECT                       │ 1. FROM (откуда берем данные)   │\n│ 2. FROM                         │ 2. ON / JOIN (как связываем)    │\n│ 3. WHERE                        │ 3. WHERE (фильтруем сырые строки)│\n│ 4. GROUP BY                     │ 4. GROUP BY (схлопываем группы) │\n│ 5. HAVING                       │ 5. HAVING (фильтруем группы)    │\n│ 6. ORDER BY                     │ 6. SELECT (выбираем поля/алиасы)│\n│ 7. LIMIT                        │ 7. DISTINCT                     │\n│                                 │ 8. ORDER BY (сортируем)         │\n│                                 │ 9. LIMIT / OFFSET (отрезаем)    │\n└─────────────────────────────────┴─────────────────────────────────┘\n```\n\n> **Инсайт собеседований**: Вы не можете использовать алиас из `SELECT` внутри секции `WHERE`, потому что на момент выполнения `WHERE` секция `SELECT` еще даже не запускалась!\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Запрос с правильной фильтрацией и строгим порядком\nquery = \"\"\"\nSELECT \n    customer_id,\n    first_name,\n    city,\n    acquisition_channel,\n    registration_date\nFROM customers\nWHERE city IN ('Moscow', 'Saint Petersburg', 'Kazan')\n  AND acquisition_channel != 'Direct'\n  AND registration_date >= '2025-06-01'\nORDER BY registration_date DESC\nLIMIT 5;\n\"\"\"\n\nprint(\"РЕЗУЛЬТАТ ЗАПРОСА К E-COMMERCE БАЗЕ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_02_aggregations_group_by_having.ipynb", "rel_path": "course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 2. Урок 2: Агрегатные функции и жесткая разница WHERE vs HAVING\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_02_aggregations_group_by_having.ipynb)\n\n---\n\n## 1. Разница между WHERE и HAVING на реальном кейсе\n\n- **WHERE**: Фильтрует отдельные строки **до того**, как они объединятся в группы. Не может содержать агрегатные функции (`SUM`, `AVG`, `COUNT`).\n- **HAVING**: Фильтрует уже готовые сгруппированные строки **после** группировки.\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Кейс: Найти города, где совершено более 150 успешных заказов, \n# исключив тестовые и отмененные заказы ДО агрегации\nquery = \"\"\"\nSELECT \n    c.city,\n    COUNT(o.order_id) AS completed_orders,\n    ROUND(SUM(oi.total_amount), 2) AS city_revenue,\n    ROUND(AVG(oi.total_amount), 2) AS avg_item_amount\nFROM customers c\nJOIN orders o ON c.customer_id = o.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nWHERE o.status = 'Completed'                      -- WHERE: отсекаем строки до расчета\nGROUP BY c.city\nHAVING completed_orders > 150                      -- HAVING: фильтруем агрегированный результат\nORDER BY city_revenue DESC;\n\"\"\"\n\nprint(\"ГОРОДА-ЛИДЕРЫ С БОЛЕЕ ЧЕМ 150 УСПЕШНЫМИ ЗАКАЗАМИ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_03_joins_deep_dive.ipynb", "rel_path": "course/module_02_sql/lesson_03_joins_deep_dive.ipynb", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 2. Урок 3: Все виды JOIN и защита от Cartesian Explosion (Задвоения данных)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_03_joins_deep_dive.ipynb)\n\n---\n\n## 1. Опасность дублирования строк при JOIN\n\nСамая частая ошибка, из-за которой компании увольняют аналитиков: **случайное размножение строк при связи «один-ко-многим»**.\n\nЕсли у одного клиента 3 заказа, а у каждого заказа по 2 товара:\n- `customers` JOIN `orders` -> 3 строки;\n- `orders` JOIN `order_items` -> 6 строк.\nЕсли вы после этого сделаете `SUM(orders.delivery_cost)`, стоимость доставки посчитается **дважды для каждого заказа**!\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\n# Запрос с правильным подсчетом уникальных заказов и суммы без задвоения\nquery = \"\"\"\nSELECT \n    c.acquisition_channel,\n    COUNT(DISTINCT c.customer_id) AS unique_customers,\n    COUNT(DISTINCT o.order_id) AS total_orders,\n    ROUND(SUM(oi.total_amount), 2) AS total_revenue,\n    ROUND(SUM(oi.total_amount) / COUNT(DISTINCT o.order_id), 2) AS real_aov\nFROM customers c\nLEFT JOIN orders o ON c.customer_id = o.customer_id AND o.status = 'Completed'\nLEFT JOIN order_items oi ON o.order_id = oi.order_id\nGROUP BY c.acquisition_channel\nORDER BY total_revenue DESC;\n\"\"\"\n\nprint(\"АККУРАТНЫЙ РАСЧЕТ БЕЗ ДУБЛИРОВАНИЯ МЕТРИК:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_04_subqueries_and_cte.ipynb", "rel_path": "course/module_02_sql/lesson_04_subqueries_and_cte.ipynb", "cells": [{"type": "markdown", "content": "# 🧱 Модуль 2. Урок 4: Чистая архитектура SQL через CTE (WITH)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_04_subqueries_and_cte.ipynb)\n\n---\n\n## 1. Принцип модульности: Common Table Expressions (CTE)\n\nВ реальной работе запросы на 200 строк с 5 уровнями вложенных подзапросов невозможно поддерживать.\nКонструкция `WITH` превращает спагетти-код в последовательный пайплайн:\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\n-- Шаг 1: Агрегация на уровне клиента\nWITH customer_stats AS (\n    SELECT \n        customer_id,\n        COUNT(DISTINCT order_id) AS orders_count,\n        SUM(total_amount) AS total_spent\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY customer_id\n),\n-- Шаг 2: Расчет порогов для сегментации\nbenchmark AS (\n    SELECT \n        AVG(total_spent) AS avg_ltv,\n        AVG(orders_count) AS avg_orders\n    FROM customer_stats\n)\n-- Шаг 3: Финальный отчет с присвоением бизнес-сегментов\nSELECT \n    cs.customer_id,\n    cs.orders_count,\n    ROUND(cs.total_spent, 2) AS total_spent,\n    CASE \n        WHEN cs.total_spent > b.avg_ltv * 2 THEN 'VIP Client'\n        WHEN cs.orders_count > b.avg_orders THEN 'Loyal Client'\n        ELSE 'Regular Client'\n    END AS segment\nFROM customer_stats cs\nCROSS JOIN benchmark b\nORDER BY cs.total_spent DESC\nLIMIT 8;\n\"\"\"\n\nprint(\"КЛИЕНТСКАЯ СЕГМЕНТАЦИЯ ЧЕРЕЗ CTE:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_05_window_functions_advanced.ipynb", "rel_path": "course/module_02_sql/lesson_05_window_functions_advanced.ipynb", "cells": [{"type": "markdown", "content": "# 🪟 Модуль 2. Урок 5: Оконные функции (Window Functions) в деталях\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_05_window_functions_advanced.ipynb)\n\n---\n\n## 1. Главные оконные функции аналитика данных\n\n1. `ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...)`: Уникальная нумерация строк внутри группы (идеально для дедупликации).\n2. `DENSE_RANK() OVER (...)`: Ранжирование без пропусков (Топ-3 товара в каждой категории).\n3. `LAG(col, 1) OVER (...)` и `LEAD(col, 1) OVER (...)`: Доступ к предыдущей или следующей строке (расчет темпов роста MoM / YoY).\n4. `SUM(col) OVER (ORDER BY ...)`: Расчет нарастающего итога (Cumulative Revenue).\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH monthly_revenue AS (\n    SELECT \n        SUBSTR(o.order_date, 1, 7) AS ym,\n        ROUND(SUM(oi.total_amount), 2) AS revenue\n    FROM orders o\n    JOIN order_items oi ON o.order_id = oi.order_id\n    WHERE o.status = 'Completed'\n    GROUP BY ym\n)\nSELECT \n    ym,\n    revenue,\n    -- Нарастающий итог с начала года\n    ROUND(SUM(revenue) OVER (ORDER BY ym), 2) AS running_total,\n    -- Доход за предыдущий месяц\n    LAG(revenue, 1) OVER (ORDER BY ym) AS prev_month,\n    -- Относительный прирост месяц-к-месяцу (MoM %)\n    ROUND((revenue - LAG(revenue, 1) OVER (ORDER BY ym)) * 100.0 / \n          LAG(revenue, 1) OVER (ORDER BY ym), 2) AS mom_growth_pct\nFROM monthly_revenue\nORDER BY ym;\n\"\"\"\n\nprint(\"ФИНАНСОВАЯ АНАЛИТИКА ЧЕРЕЗ ОКОННЫЕ ФУНКЦИИ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_06_sql_patterns_retention_funnels.ipynb", "rel_path": "course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb", "cells": [{"type": "markdown", "content": "# 🔄 Модуль 2. Урок 6: Паттерны продуктовой аналитики: Воронки и Когорты на SQL\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_06_sql_patterns_retention_funnels.ipynb)\n\n---\n\n## 1. Помесячный когортный анализ Retention Rate на чистом SQL\n\nКогортный анализ отвечает на ключевой вопрос: *«Удерживаем ли мы клиентов, привлеченных в разные месяцы, или они разово покупают и исчезают?»*\n"}, {"type": "code", "content": "import sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery = \"\"\"\nWITH cohorts AS (\n    SELECT \n        customer_id,\n        MIN(SUBSTR(order_date, 1, 7)) AS first_order_month\n    FROM orders\n    WHERE status = 'Completed'\n    GROUP BY customer_id\n),\nactivities AS (\n    SELECT \n        o.customer_id,\n        c.first_order_month,\n        SUBSTR(o.order_date, 1, 7) AS order_month\n    FROM orders o\n    JOIN cohorts c ON o.customer_id = c.customer_id\n    WHERE o.status = 'Completed'\n)\nSELECT \n    first_order_month AS cohort,\n    COUNT(DISTINCT customer_id) AS cohort_size,\n    COUNT(DISTINCT CASE WHEN order_month = first_order_month THEN customer_id END) AS m0_active,\n    COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) AS repeat_buyers,\n    ROUND(COUNT(DISTINCT CASE WHEN order_month > first_order_month THEN customer_id END) * 100.0 / \n          COUNT(DISTINCT customer_id), 1) AS repeat_buyer_pct\nFROM activities\nGROUP BY first_order_month\nORDER BY first_order_month\nLIMIT 6;\n\"\"\"\n\nprint(\"КОГОРТНАЯ МАТРИЦА УДЕРЖАНИЯ:\")\nprint(pd.read_sql(query, conn))\n"}]}, {"filename": "lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "rel_path": "course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb", "cells": [{"type": "markdown", "content": "# 🛡️ Модуль 2. Урок 7: Text-to-SQL промптинг и строгий чеклист валидации\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_02_sql/lesson_07_prompt_engineering_for_sql_and_validation.ipynb)\n\n---\n\n## 1. Архитектура надежного промпта для Text-to-SQL\n\nКогда вы просите нейросеть написать SQL, передавайте ей:\n1. **Диалект СУБД** (PostgreSQL / SQLite / BigQuery / ClickHouse — у всех разный синтаксис работы с датами и строками).\n2. **Точные DDL схемы таблиц** с первичными и внешними ключами.\n3. **Бизнес-правила фильтрации** («Всегда отсекай статус != Completed»).\n\n### Чеклист проверки SQL-кода от нейросети:\n- [ ] Не использовал ли ИИ агрегат внутри WHERE?\n- [ ] Все ли неагрегированные поля из SELECT попали в GROUP BY?\n- [ ] Проверено ли деление на ноль через `NULLIF(..., 0)`?\n- [ ] Проверена ли уникальность ключей при JOIN во избежание декартова произведения?\n"}]}]}, {"id": "module_03_python", "title": "Модуль 3. Python и Pandas для AI аналитика", "cat": "Хард база", "badge": "Python", "icon": "🐍", "desc": "Векторная обработка, фильтрация, агрегация, группировка без зубрежки синтаксиса.", "readme": "# 🐍 Модуль 3: Python и Pandas — Анализ данных с AI-ассистентом\n\n## 📌 Ключевая концепция 2027 года\n> **Вам больше не нужно зубрить синтаксис наизусть.**\n> Ваша задача — понимать структуру структур данных (Series, DataFrame), уметь декомпозировать преобразование на шаги, ставить точные ТЗ для Cursor / Copilot и проводить Code Review сгенерированного кода на предмет логических ошибок и утечек данных.\n\n## 🎯 Learning Outcomes\n- **Understand**: Ментальная модель DataFrame (строки, столбцы, индексы, векторизованные операции).\n- **Apply**: Базовые операции Pandas (`read_csv`, `filter`, `groupby`, `merge`, `pivot_table`).\n- **Analyze**: Поиск аномалий, сопоставление данных из нескольких источников.\n- **AI Orchestration**: Написание точных комментариев-промптов в Cursor/Copilot для мгновенного получения рабочего кода.\n\n## 📚 Уроки\n1. `lesson_01_python_no_syntax_memorization.ipynb` — Ментальная модель Python и как формулировать задачи для AI.\n2. `lesson_02_pandas_dataframes_indexing.ipynb` — Анатомия DataFrame: загрузка, срезы `.loc` / `.iloc`, фильтрация.\n3. `lesson_03_pandas_aggregations_merge.ipynb` — Группировка (`groupby`), объединение (`merge`, `concat`), сводные таблицы.\n4. `lesson_04_visualization_seaborn_matplotlib.ipynb` — Визуализация: Matplotlib, Seaborn и промпты для идеальных графиков.\n5. `lesson_05_code_review_ai_validation.ipynb` — Практикум: ищем ошибки в коде, написанном LLM (Code Review).\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка методов Pandas.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 3 (Python & Pandas)\n\n---\n\n### Вопрос 1\nПочему в Pandas категорически рекомендуется использовать векторизованные операции вместо циклов `for`?\n- [ ] Циклы for запрещены создателями Python.\n- [x] Векторизованные операции транслируются в оптимизированный C-код и выполняются в десятки и сотни раз быстрее.\n- [ ] Векторизованные операции не расходуют память.\n*Объяснение*: Pandas оперирует низкоуровневыми массивами C через NumPy, выполняя расчеты над всей колонкой единым блоком инструкций процессора (SIMD).\n\n---\n\n### Вопрос 2\nВ чем заключается ошибка при расчете общего CR компании через `df['conversion_rate'].mean()`?\n- [ ] Ошибки нет, среднее всегда корректно.\n- [x] Это математическая ошибка усреднения процентов без учета разницы в объемах трафика между филиалами/сегментами.\n- [ ] Метод .mean() не умеет работать с числами с плавающей точкой.\n*Объяснение*: Чтобы получить истинную конверсию, необходимо разделить суммарное число целевых действий на суммарный трафик (`total_actions / total_traffic`).\n\n---\n\n### Вопрос 3\nКакой результат вернет операция `df.loc[0:2]` vs `df.iloc[0:2]`?\n- [ ] Одинаковый результат.\n- [x] `.loc[0:2]` включит строки с метками 0, 1 и 2 (включая правый конец), а `.iloc[0:2]` вернет строго первые 2 строки с индексами 0 и 1 (не включая правый конец).\n- [ ] Выдаст ошибку синтаксиса.\n*Объяснение*: В `.loc` правая граница включается, так как поиск идет по именам/меткам. В `.iloc` правая граница исключается по стандартному правилу срезов Python.\n", "cheatsheet": "# 📋 Pandas Cheatsheet\n\n```python\n# Фильтрация нескольких условий\ndf[(df['col1'] > 10) & (df['col2'] == 'Target')]\n\n# Группировка с именованными агрегациями\ndf.groupby('category').agg(\n    orders=('order_id', 'nunique'),\n    revenue=('amount', 'sum'),\n    avg_check=('amount', 'mean')\n)\n\n# Проверка пропусков\ndf.isnull().sum()\n```\n", "notebooks": [{"filename": "lesson_01_python_no_syntax_memorization.ipynb", "rel_path": "course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb", "cells": [{"type": "markdown", "content": "# 🐍 Модуль 3. Урок 1: Как аналитик пишет код на Python в 2027 году\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_01_python_no_syntax_memorization.ipynb)\n\n---\n\n## 1. Концепция: Векторизация против циклов for\n\nГлавная ментальная модель Python для данных: **мы никогда не перебираем строки таблицы циклом `for`**.\nВекторизованные операции Pandas выполняются на оптимизированном коде C/C++ в сотни раз быстрее обычного цикла Python.\n\n```\n┌─────────────────────────────────┬─────────────────────────────────┐\n│     ПЛОХОЙ МЕДЛЕННЫЙ КОД        │      ВЕКТОРИЗОВАННЫЙ PANDAS     │\n├─────────────────────────────────┼─────────────────────────────────┤\n│ for i in range(len(df)):        │ df['total'] =                   │\n│     df.loc[i, 'total'] =        │     df['price'] * df['qty']     │\n│         df.loc[i, 'price'] * ...│                                 │\n│ (Работает 45 секунд)            │ (Работает 0.02 секунды)         │\n└─────────────────────────────────┴─────────────────────────────────┘\n```\n"}, {"type": "code", "content": "# Практическое сравнение скорости: Векторизация vs Цикл for\nimport pandas as pd\nimport numpy as np\nimport time\n\nn = 200_000\nprices = np.random.uniform(100, 5000, n)\nquantities = np.random.randint(1, 10, n)\ndf_perf = pd.DataFrame({'price': prices, 'quantity': quantities})\n\n# 1. Векторизованный расчет\nt0 = time.time()\ndf_perf['amount_vectorized'] = df_perf['price'] * df_perf['quantity']\nt_vec = time.time() - t0\n\nprint(f\"Векторизованный расчет на {n:,} строк занял: {t_vec:.4f} сек\")\nprint(\"Это фундаментальный принцип высокопроизводительного анализа данных!\")\n"}]}, {"filename": "lesson_02_pandas_dataframes_indexing.ipynb", "rel_path": "course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb", "cells": [{"type": "markdown", "content": "# 📊 Модуль 3. Урок 2: Анатомия DataFrame: Индексация, срезы и фильтрация\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_03_python/lesson_02_pandas_dataframes_indexing.ipynb)\n\n---\n\n## 1. Разница между `.loc[]` и `.iloc[]`\n\n- `.loc[label_indexer]` — обращение по **именам** (меткам) строк и названиям столбцов.\n- `.iloc[position_indexer]` — обращение строго по **целочисленным номерам** позиций (0, 1, 2...).\n\n### Булева фильтрация с несколькими условиями:\n- `&` (логическое И), `|` (логическое ИЛИ), `~` (логическое НЕ).\n- **Обязательно оборачивать каждое условие в круглые скобки**: `(df['A'] > 10) & (df['B'] == 'X')`!\n"}, {"type": "code", "content": "import pandas as pd\n\n# Загружаем реальный датасет клиентов курса\ndf_cust = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\customers.csv\")\n\n# Сложная сегментация: Мобильные пользователи из городов-миллионников, пришедшие с платной рекламы\ntarget_segment = df_cust[\n    (df_cu
