esson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb` — Статистические гипотезы: $H_0$ vs $H_1$, ошибки I/II рода, t-тест, Mann-Whitney.\n5. `lesson_05_correlation_and_regression_ols_logistic.ipynb` — Корреляционный анализ, OLS регрессия, предсказание оттока (логистическая).\n6. `lesson_06_statistical_traps_in_business.ipynb` — Парадокс Симпсона и частые когнитивные ошибки при интерпретации данных.\n7. `quiz.md` — 20 вопросов для подготовки к техническому собеседованию.\n8. `cheatsheet.md` — Полная шпаргалка статистических критериев.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 5 (Статистика & Гипотезы)\n\n---\n\n### Вопрос 1\nЧто в строгом математическом смысле показывает $p\\text{-value} = 0.02$?\n- [ ] Вероятность того, что альтернативная гипотеза верна, равна 98%.\n- [x] Вероятность получить такое же или еще более сильное различие случайно, если нулевая гипотеза (об отсутствии эффекта) на самом деле верна, составляет 2%.\n- [ ] Ошибка в расчете доверительного интервала.\n*Объяснение*: $p$-value — это условная вероятность наблюдаемых данных при истинности нулевой гипотезы $P(\\text{Data} | H_0)$.\n\n---\n\n### Вопрос 2\nВ каких случаях следует отдать предпочтение U-критерию Манна-Уитни перед t-тестом Стьюдента?\n- [ ] Когда выборка идеально подчиняется нормальному распределению Гаусса.\n- [x] Когда данные имеют сильную асимметрию, тяжелые хвосты и не подчиняются нормальному распределению (например, доходы или чеки).\n- [ ] Когда сравниваются доли конверсий.\n*Объяснение*: Манна-Уитни — непараметрический ранговый критерий, он сравнивает распределение рангов и устойчив к экстремальным выбросам.\n\n---\n\n### Вопрос 3\nЧто описывает Парадокс Симпсона?\n- [ ] Ошибку округления при делении на ноль.\n- [x] Ситуацию, когда тренд, наблюдаемый в отдельных подгруппах данных, полностью исчезает или меняет знак на противоположный при объединении этих групп.\n- [ ] Корреляцию двух не связанных случайных величин.\n*Объяснение*: Парадокс возникает из-за неравномерного распределения скрытой переменной (confounding variable), например, перекоса трафика между десктопом и мобайлом.\n", "cheatsheet": "# 📋 Statistics Cheatsheet\n\n| Ситуация | Рекомендуемый тест / метод |\n|---|---|\n| Сравнение средних чеков (Нормальное распр.) | Двухвыборочный Two-Sample t-test |\n| Сравнение чеков со скошенным распр. и выбросами | U-критерий Манна-Уитни (Mann-Whitney U) |\n| Сравнение долей (Конверсия A/B) | Z-test для пропорций или Chi-Square (Хи-квадрат) |\n| Взаимосвязь числовых величин | Коэффициент Пирсона (линейная) или Спирмена (ранговая) |\n", "notebooks": [{"filename": "lesson_01_descriptive_stats_outliers.ipynb", "rel_path": "course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📐 Модуль 5. Урок 1: Описательная статистика: Мода, Медиана, Дисперсия и Квартили\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Почему среднее врет в 80% задач бизнеса?\\n\",\n        \"\\n\",\n        \"В реальной жизни большинство продуктовых и финансовых метрик (чеки, зарплаты, время сессии в приложении) подчиняются **скошенным распределениям с тяжелыми правыми хвостами** (Log-normal, Pareto).\\n\",\n        \"\\n\",\n        \"- **Среднее (Mean)**: Чувствительно к единичным крупным выбросам.\\n\",\n        \"- **Медиана (Median, 50-й перцентиль)**: Робастная метрика, делящая выборку ровно пополам.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"import pandas as pd\\n\",\n        \"import matplotlib.pyplot as plt\\n\",\n        \"\\n\",\n        \"# Симулируем распределение доходов пользователей (Парето)\\n\",\n        \"np.random.seed(42)\\n\",\n        \"incomes = np.random.pareto(a=2.5, size=5000) * 40000 + 25000\\n\",\n        \"\\n\",\n        \"mean_val = np.mean(incomes)\\n\",\n        \"median_val = np.median(incomes)\\n\",\n        \"q75 = np.percentile(incomes, 75)\\n\",\n        \"q90 = np.percentile(incomes, 90)\\n\",\n        \"\\n\",\n        \"print(f\\\"Средний доход: {mean_val:,.0f} руб (Искажен длинным хвостом)\\\")\\n\",\n        \"print(f\\\"Медианный доход: {median_val:,.0f} руб (Отражает реальный средний класс)\\\")\\n\",\n        \"print(f\\\"75% пользователей зарабатывают меньше: {q75:,.0f} руб\\\")\\n\",\n        \"print(f\\\"90% пользователей зарабатывают меньше: {q90:,.0f} руб\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📐 Модуль 5. Урок 1: Описательная статистика: Мода, Медиана, Дисперсия и Квартили\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_01_descriptive_stats_outliers.ipynb)\n\n---\n\n## 1. Почему среднее врет в 80% задач бизнеса?\n\nВ реальной жизни большинство продуктовых и финансовых метрик (чеки, зарплаты, время сессии в приложении) подчиняются **скошенным распределениям с тяжелыми правыми хвостами** (Log-normal, Pareto).\n\n- **Среднее (Mean)**: Чувствительно к единичным крупным выбросам.\n- **Медиана (Median, 50-й перцентиль)**: Робастная метрика, делящая выборку ровно пополам.\n"}, {"type": "code", "content": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\n# Симулируем распределение доходов пользователей (Парето)\nnp.random.seed(42)\nincomes = np.random.pareto(a=2.5, size=5000) * 40000 + 25000\n\nmean_val = np.mean(incomes)\nmedian_val = np.median(incomes)\nq75 = np.percentile(incomes, 75)\nq90 = np.percentile(incomes, 90)\n\nprint(f\"Средний доход: {mean_val:,.0f} руб (Искажен длинным хвостом)\")\nprint(f\"Медианный доход: {median_val:,.0f} руб (Отражает реальный средний класс)\")\nprint(f\"75% пользователей зарабатывают меньше: {q75:,.0f} руб\")\nprint(f\"90% пользователей зарабатывают меньше: {q90:,.0f} руб\")\n"}]}, {"filename": "lesson_02_probability_bayes_law_of_large_numbers.ipynb", "rel_path": "course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🎲 Модуль 5. Урок 2: Теория вероятностей и Теорема Байеса в Финтехе\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Реальный кейс Банка: Антифрод-система и Базовая ставка (Base Rate Fallacy)\\n\",\n        \"\\n\",\n        \"Формула Байеса связывает априорную вероятность с новыми свидетельствами:\\n\",\n        \"$$P(\\\\text{Fraud} | \\\\text{Alert}) = \\\\frac{P(\\\\text{Alert} | \\\\text{Fraud}) \\\\cdot P(\\\\text{Fraud})}{P(\\\\text{Alert})}$$\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Кейс: Модель антифрода с точностью 98%\\n\",\n        \"# P(Fraud) = 0.005 (0.5% транзакций мошеннические)\\n\",\n        \"# Sensitivity = 0.98 (поймает 98% мошенников)\\n\",\n        \"# False Positive Rate = 0.02 (на 2% честных операций ложно сработает)\\n\",\n        \"\\n\",\n        \"p_fraud = 0.005\\n\",\n        \"p_clean = 0.995\\n\",\n        \"p_alert_fraud = 0.98\\n\",\n        \"p_alert_clean = 0.02\\n\",\n        \"\\n\",\n        \"# Полная вероятность срабатывания алерта\\n\",\n        \"p_alert = (p_alert_fraud * p_fraud) + (p_alert_clean * p_clean)\\n\",\n        \"\\n\",\n        \"# Истинная вероятность фрода при сработавшем алерте\\n\",\n        \"p_true_fraud = (p_alert_fraud * p_fraud) / p_alert\\n\",\n        \"\\n\",\n        \"print(f\\\"Вероятность того, что заблокированный платеж реально мошеннический: {p_true_fraud*100:.1f}%\\\")\\n\",\n        \"print(\\\"ШОК-ВЫВОД ДЛЯ РУКОВОДСТВА: Почти 80% заблокированных операций — ЧЕСТНЫЕ КЛИЕНТЫ!\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🎲 Модуль 5. Урок 2: Теория вероятностей и Теорема Байеса в Финтехе\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_02_probability_bayes_law_of_large_numbers.ipynb)\n\n---\n\n## 1. Реальный кейс Банка: Антифрод-система и Базовая ставка (Base Rate Fallacy)\n\nФормула Байеса связывает априорную вероятность с новыми свидетельствами:\n$$P(\\text{Fraud} | \\text{Alert}) = \\frac{P(\\text{Alert} | \\text{Fraud}) \\cdot P(\\text{Fraud})}{P(\\text{Alert})}$$\n"}, {"type": "code", "content": "# Кейс: Модель антифрода с точностью 98%\n# P(Fraud) = 0.005 (0.5% транзакций мошеннические)\n# Sensitivity = 0.98 (поймает 98% мошенников)\n# False Positive Rate = 0.02 (на 2% честных операций ложно сработает)\n\np_fraud = 0.005\np_clean = 0.995\np_alert_fraud = 0.98\np_alert_clean = 0.02\n\n# Полная вероятность срабатывания алерта\np_alert = (p_alert_fraud * p_fraud) + (p_alert_clean * p_clean)\n\n# Истинная вероятность фрода при сработавшем алерте\np_true_fraud = (p_alert_fraud * p_fraud) / p_alert\n\nprint(f\"Вероятность того, что заблокированный платеж реально мошеннический: {p_true_fraud*100:.1f}%\")\nprint(\"ШОК-ВЫВОД ДЛЯ РУКОВОДСТВА: Почти 80% заблокированных операций — ЧЕСТНЫЕ КЛИЕНТЫ!\")\n"}]}, {"filename": "lesson_03_distributions_clt_confidence_intervals.ipynb", "rel_path": "course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔔 Модуль 5. Урок 3: Центральная предельная теорема (ЦПТ) и 95% Доверительные интервалы\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Смысл 95% Доверительного интервала (Confidence Interval)\\n\",\n        \"\\n\",\n        \"Формула для среднего значения:\\n\",\n        \"$$CI = \\\\bar{X} \\\\pm 1.96 \\\\cdot \\\\frac{\\\\sigma}{\\\\sqrt{n}}$$\\n\",\n        \"\\n\",\n        \"> **Что это значит простыми словами?** Если мы повторим наш эксперимент 100 раз и построим 100 интервалов, ровно 95 из них накроют истинное среднее генеральной совокупности.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import numpy as np\\n\",\n        \"from scipy import stats\\n\",\n        \"\\n\",\n        \"np.random.seed(42)\\n\",\n        \"sample_checks = np.random.exponential(scale=2500, size=400) # 400 чеков клиентов\\n\",\n        \"\\n\",\n        \"mean = np.mean(sample_checks)\\n\",\n        \"sem = stats.sem(sample_checks) # Стандартная ошибка среднего\\n\",\n        \"ci = stats.t.interval(0.95, df=len(sample_checks)-1, loc=mean, scale=sem)\\n\",\n        \"\\n\",\n        \"print(f\\\"Выборочное среднее: {mean:.2f} руб\\\")\\n\",\n        \"print(f\\\"95% Доверительный интервал: [{ci[0]:.2f}, {ci[1]:.2f}] руб\\\")\\n\",\n        \"print(f\\\"Бизнес-интерпретация: Мы на 95% уверены, что истинный средний чек бизнеса лежит в диапазоне от {ci[0]:.0f} до {ci[1]:.0f} руб.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔔 Модуль 5. Урок 3: Центральная предельная теорема (ЦПТ) и 95% Доверительные интервалы\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_03_distributions_clt_confidence_intervals.ipynb)\n\n---\n\n## 1. Смысл 95% Доверительного интервала (Confidence Interval)\n\nФормула для среднего значения:\n$$CI = \\bar{X} \\pm 1.96 \\cdot \\frac{\\sigma}{\\sqrt{n}}$$\n\n> **Что это значит простыми словами?** Если мы повторим наш эксперимент 100 раз и построим 100 интервалов, ровно 95 из них накроют истинное среднее генеральной совокупности.\n"}, {"type": "code", "content": "import numpy as np\nfrom scipy import stats\n\nnp.random.seed(42)\nsample_checks = np.random.exponential(scale=2500, size=400) # 400 чеков клиентов\n\nmean = np.mean(sample_checks)\nsem = stats.sem(sample_checks) # Стандартная ошибка среднего\nci = stats.t.interval(0.95, df=len(sample_checks)-1, loc=mean, scale=sem)\n\nprint(f\"Выборочное среднее: {mean:.2f} руб\")\nprint(f\"95% Доверительный интервал: [{ci[0]:.2f}, {ci[1]:.2f}] руб\")\nprint(f\"Бизнес-интерпретация: Мы на 95% уверены, что истинный средний чек бизнеса лежит в диапазоне от {ci[0]:.0f} до {ci[1]:.0f} руб.\")\n"}]}, {"filename": "lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "rel_path": "course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚖️ Модуль 5. Урок 4: Проверка гипотез: $p$-value, t-тест Стьюдента и критерий Манна-Уитни\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Решающее дерево выбора статистического критерия\\n\",\n        \"\\n\",\n        \"```\\n\",\n        \"                          [Какая метрика?]\\n\",\n        \"                                 │\\n\",\n        \"           ┌─────────────────────┴─────────────────────┐\\n\",\n        \"     [Качественная (Доли / CR)]              [Количественная (Чеки, Время)]\\n\",\n        \"           │                                           │\\n\",\n        \"  Z-test пропорций / Хи-квадрат            [Нормальное распределение?]\\n\",\n        \"                                                       │\\n\",\n        \"                                   ┌───────────────────┴───────────────────┐\\n\",\n        \"                                 [ДА]                                    [НЕТ]\\n\",\n        \"                             t-тест Стьюдента                   U-тест Манна-Уитни / Бутстрап\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"from scipy import stats\\n\",\n        \"import numpy as np\\n\",\n        \"\\n\",\n        \"# Сравнение времени загрузки двух версий приложения\\n\",\n        \"np.random.seed(101)\\n\",\n        \"time_v1 = np.random.normal(loc=1.8, scale=0.4, size=300) # Старая версия\\n\",\n        \"time_v2 = np.random.normal(loc=1.65, scale=0.38, size=300) # Новая оптимизированная версия\\n\",\n        \"\\n\",\n        \"# Двухвыборочный t-тест (H0: разницы нет, H1: время отличается)\\n\",\n        \"t_stat, p_val = stats.ttest_ind(time_v1, time_v2)\\n\",\n        \"\\n\",\n        \"print(f\\\"Среднее время V1: {time_v1.mean():.3f} сек\\\")\\n\",\n        \"print(f\\\"Среднее время V2: {time_v2.mean():.3f} сек (Ускорение на 150 мс)\\\")\\n\",\n        \"print(f\\\"p-value: {p_val:.6f}\\\")\\n\",\n        \"\\n\",\n        \"if p_val < 0.05:\\n\",\n        \"    print(\\\" Результат статистически значим (p < 0.05)! Новая версия приложения реально быстрее.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚖️ Модуль 5. Урок 4: Проверка гипотез: $p$-value, t-тест Стьюдента и критерий Манна-Уитни\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_04_hypothesis_testing_p_value_ttest_mann_whitney.ipynb)\n\n---\n\n## 1. Решающее дерево выбора статистического критерия\n\n```\n                          [Какая метрика?]\n                                 │\n           ┌─────────────────────┴─────────────────────┐\n     [Качественная (Доли / CR)]              [Количественная (Чеки, Время)]\n           │                                           │\n  Z-test пропорций / Хи-квадрат            [Нормальное распределение?]\n                                                       │\n                                   ┌───────────────────┴───────────────────┐\n                                 [ДА]                                    [НЕТ]\n                             t-тест Стьюдента                   U-тест Манна-Уитни / Бутстрап\n```\n"}, {"type": "code", "content": "from scipy import stats\nimport numpy as np\n\n# Сравнение времени загрузки двух версий приложения\nnp.random.seed(101)\ntime_v1 = np.random.normal(loc=1.8, scale=0.4, size=300) # Старая версия\ntime_v2 = np.random.normal(loc=1.65, scale=0.38, size=300) # Новая оптимизированная версия\n\n# Двухвыборочный t-тест (H0: разницы нет, H1: время отличается)\nt_stat, p_val = stats.ttest_ind(time_v1, time_v2)\n\nprint(f\"Среднее время V1: {time_v1.mean():.3f} сек\")\nprint(f\"Среднее время V2: {time_v2.mean():.3f} сек (Ускорение на 150 мс)\")\nprint(f\"p-value: {p_val:.6f}\")\n\nif p_val < 0.05:\n    print(\" Результат статистически значим (p < 0.05)! Новая версия приложения реально быстрее.\")\n"}]}, {"filename": "lesson_05_correlation_and_regression_ols_logistic.ipynb", "rel_path": "course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📈 Модуль 5. Урок 5: Корреляция vs Причинность и Регрессионный анализ (OLS)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Уравнение множественной линейной регрессии\\n\",\n        \"\\n\",\n        \"$$Y = \\\\beta_0 + \\\\beta_1 X_1 + \\\\beta_2 X_2 + \\\\dots + \\\\epsilon$$\\n\",\n        \"\\n\",\n        \"### Главные метрики качества модели:\\n\",\n        \"- **$R^2$ (Коэффициент детерминации)**: Какую долю дисперсии целевой переменной объясняет наша модель ($0.0 \\\\dots 1.0$).\\n\",\n        \"- **p-value коэффициента $\\\\beta_i$**: Если $p > 0.05$, фактор статистически незначим и должен быть исключен.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"import statsmodels.api as sm\\n\",\n        \"\\n\",\n        \"saas = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\saas_users.csv\\\")\\n\",\n        \"\\n\",\n        \"# Исследуем, какие факторы влияют на отток (MRR компании)\\n\",\n        \"X = saas[['active_seats', 'feature_a_usage', 'nps_score']]\\n\",\n        \"X = sm.add_constant(X)\\n\",\n        \"y = saas['mrr']\\n\",\n        \"\\n\",\n        \"model = sm.OLS(y, X).fit()\\n\",\n        \"print(\\\"РЕЗУЛЬТАТЫ РЕГРЕССИОННОГО АНАЛИЗА:\\\")\\n\",\n        \"print(f\\\"R-squared: {model.rsquared:.3f}\\\")\\n\",\n        \"print(\\\"\\\\nКоэффициенты модели:\\\")\\n\",\n        \"print(model.params.round(3))\\n\",\n        \"print(\\\"\\\\np-values факторов:\\\")\\n\",\n        \"print(model.pvalues.apply(lambda x: f\\\"{x:.4f}\\\"))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📈 Модуль 5. Урок 5: Корреляция vs Причинность и Регрессионный анализ (OLS)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_05_correlation_and_regression_ols_logistic.ipynb)\n\n---\n\n## 1. Уравнение множественной линейной регрессии\n\n$$Y = \\beta_0 + \\beta_1 X_1 + \\beta_2 X_2 + \\dots + \\epsilon$$\n\n### Главные метрики качества модели:\n- **$R^2$ (Коэффициент детерминации)**: Какую долю дисперсии целевой переменной объясняет наша модель ($0.0 \\dots 1.0$).\n- **p-value коэффициента $\\beta_i$**: Если $p > 0.05$, фактор статистически незначим и должен быть исключен.\n"}, {"type": "code", "content": "import pandas as pd\nimport statsmodels.api as sm\n\nsaas = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\saas_users.csv\")\n\n# Исследуем, какие факторы влияют на отток (MRR компании)\nX = saas[['active_seats', 'feature_a_usage', 'nps_score']]\nX = sm.add_constant(X)\ny = saas['mrr']\n\nmodel = sm.OLS(y, X).fit()\nprint(\"РЕЗУЛЬТАТЫ РЕГРЕССИОННОГО АНАЛИЗА:\")\nprint(f\"R-squared: {model.rsquared:.3f}\")\nprint(\"\\nКоэффициенты модели:\")\nprint(model.params.round(3))\nprint(\"\\np-values факторов:\")\nprint(model.pvalues.apply(lambda x: f\"{x:.4f}\"))\n"}]}, {"filename": "lesson_06_statistical_traps_in_business.ipynb", "rel_path": "course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚠️ Модуль 5. Урок 6: Статистические ловушки бизнеса: Парадокс Симпсона и Ошибка выжившего\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Классические когнитивные искажения при анализе данных\\n\",\n        \"\\n\",\n        \"1. **Парадокс Симпсона**: Направление тренда меняется на противоположное при объединении групп. Решение: Всегда исследовать данные в срезах!\\n\",\n        \"2. **Ошибка выжившего (Survivorship Bias)**: Анализ только тех клиентов, кто остался в сервисе 6 месяцев, полностью игнорируя 80% отвалившихся в первую неделю.\\n\",\n        \"3. **Регрессия к среднему (Regression to the Mean)**: Экстремальный всплеск продаж в понедельник естественным образом сменится спадом во вторник без всякого вмешательства менеджмента.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚠️ Модуль 5. Урок 6: Статистические ловушки бизнеса: Парадокс Симпсона и Ошибка выжившего\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_05_statistics/lesson_06_statistical_traps_in_business.ipynb)\n\n---\n\n## 1. Классические когнитивные искажения при анализе данных\n\n1. **Парадокс Симпсона**: Направление тренда меняется на противоположное при объединении групп. Решение: Всегда исследовать данные в срезах!\n2. **Ошибка выжившего (Survivorship Bias)**: Анализ только тех клиентов, кто остался в сервисе 6 месяцев, полностью игнорируя 80% отвалившихся в первую неделю.\n3. **Регрессия к среднему (Regression to the Mean)**: Экстремальный всплеск продаж в понедельник естественным образом сменится спадом во вторник без всякого вмешательства менеджмента.\n"}]}]}, {"id": "module_06_bi_looker_studio", "title": "Модуль 6. BI аналитика в Looker Studio", "category": "Визуализация", "badge": "BI", "readme": "# 📊 Модуль 6: BI-аналитика и Looker Studio — Создание дашбордов\n\n## 📌 О модуле\nДашборд — это рабочий инструмент топ-менеджеров и продуктовых команд. Looker Studio (Google) — один из самых доступных, мощных и облачных инструментов визуализации. Аналитик учится не просто «ставить графики», а проектировать экраны, отвечающие на вопросы принятия решений за 5 секунд.\n\n## 🎯 Learning Outcomes\n- **Apply**: Подключение источников данных (Google Sheets, BigQuery, CSV, базы данных).\n- **Create**: Вычисляемые поля (`CASE WHEN`, математика), Blending (объединение таблиц в интерфейсе).\n- **Evaluate**: Проектирование UI/UX дашборда по правилу F-паттерна и принципу Actionable Insights.\n- **Analyze**: Настройка фильтров, диапазонов дат, параметров и Drill-Down срезов.\n\n## 📚 Уроки\n1. `lesson_01_looker_studio_setup_and_data_sources.ipynb` — Старт в Looker Studio: источники, типы полей, измерения vs показатели.\n2. `lesson_02_calculated_fields_and_parameters.ipynb` — Вычисляемые поля: формулы, логика CASE WHEN.\n3. `lesson_03_data_blending_joins_in_bi.ipynb` — Data Blending: соединение источников данных на лету.\n4. `lesson_04_dashboard_ui_ux_for_executives.ipynb` — UX/UI принципы: иерархия внимания, KPI карточки.\n5. `lesson_05_interactive_filters_controls.ipynb` — Интерактивность: кросс-фильтрация, параметры, drill-down.\n6. `quiz.md` — Тест для самопроверки.\n7. `cheatsheet.md` — Шпаргалка формул Looker Studio.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 6 (Looker Studio & BI)\n\n---\n\n### Вопрос 1\nКак правильно рассчитать конверсию (Conversion Rate) в вычисляемом поле Looker Studio?\n- [ ] `AVG(Purchases / Sessions)`\n- [x] `SUM(Purchases) / SUM(Sessions)`\n- [ ] `Purchases / Sessions`\n*Объяснение*: Нельзя усреднять частные (`AVG(...)`). Необходимо вычислить отношение суммы всех покупок к сумме всех сессий.\n\n---\n\n### Вопрос 2\nЧто такое Granularity Mismatch при Data Blending?\n- [ ] Ошибка в названии столбца.\n- [x] Несоответствие уровня детализации таблиц (например, расходы сгруппированы по дням, а продажи — по конкретным секундам чеков), приводящее к задвоению метрик.\n- [ ] Нехватка оперативной памяти в браузере.\n*Объяснение*: Для корректного соединения обе таблицы должны быть приведены к одинаковому составному ключу группировки.\n\n---\n\n### Вопрос 3\nКаково правило «5 секунд» в дизайне бизнес-дашбордов?\n- [ ] Дашборд должен загружаться не более 5 секунд.\n- [x] Руководитель должен за 5 секунд понять текущий статус ключевых KPI и наличие отклонений от плана.\n- [ ] Графики должны обновляться каждые 5 секунд.\n*Объяснение*: Главные карточки метрик с индикаторами отклонения должны считываться моментально в верхнем левом углу.\n", "cheatsheet": "# 📋 Looker Studio Cheatsheet\n\n```sql\n-- Извлечение года-месяца\nYEAR_MONTH(Date_Column)\n\n-- Условная группировка\nCASE \n  WHEN REGEXP_MATCH(Device, '.*Mobile.*') THEN 'Mobile' \n  ELSE 'Desktop' \nEND\n\n-- Безопасная маржа\n(SUM(Revenue) - SUM(Cost)) / NULLIF(SUM(Revenue), 0)\n```\n", "notebooks": [{"filename": "lesson_01_looker_studio_setup_and_data_sources.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 6. Урок 1: Подключение источников данных и архитектура витрин в Looker Studio\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Ментальная модель BI: Измерения (Dimensions) vs Показатели (Metrics)\\n\",\n        \"\\n\",\n        \"В Looker Studio и любом современном BI-инструменте данные жестко разделяются:\\n\",\n        \"- **Dimensions (Зеленые поля)**: Категориальные срезы, по которым данные группируются (Город, Категория, Дата, Канал привлечения).\\n\",\n        \"- **Metrics (Синие поля)**: Числовые агрегируемые величины (Выручка, Количество клиентов, Средний чек).\\n\",\n        \"\\n\",\n        \"### Золотое правило витрины данных для BI:\\n\",\n        \"Никогда не подключайте «сырые» ненормализованные логи напрямую в отчеты, если в них миллионы строк. Сначала подготовьте денормализованную витрину (Data Mart) на уровне SQL/Python.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"# Экспорт оптимизированной витрины для Looker Studio\\n\",\n        \"import sqlite3\\n\",\n        \"import pandas as pd\\n\",\n        \"\\n\",\n        \"conn = sqlite3.connect(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\ecommerce.db\\\")\\n\",\n        \"\\n\",\n        \"query_bi = \\\"\\\"\\\"\\n\",\n        \"SELECT \\n\",\n        \"    SUBSTR(o.order_date, 1, 10) AS order_date,\\n\",\n        \"    c.city,\\n\",\n        \"    c.acquisition_channel,\\n\",\n        \"    c.device,\\n\",\n        \"    p.category,\\n\",\n        \"    p.product_name,\\n\",\n        \"    oi.quantity,\\n\",\n        \"    oi.unit_price,\\n\",\n        \"    oi.total_amount AS revenue,\\n\",\n        \"    (oi.total_amount - (p.cost * oi.quantity)) AS gross_profit\\n\",\n        \"FROM orders o\\n\",\n        \"JOIN customers c ON o.customer_id = c.customer_id\\n\",\n        \"JOIN order_items oi ON o.order_id = oi.order_id\\n\",\n        \"JOIN products p ON oi.product_id = p.product_id\\n\",\n        \"WHERE o.status = 'Completed';\\n\",\n        \"\\\"\\\"\\\"\\n\",\n        \"\\n\",\n        \"bi_data = pd.read_sql(query_bi, conn)\\n\",\n        \"bi_data.to_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\processed\\\\looker_studio_source.csv\\\", index=False)\\n\",\n        \"print(\\\" ВИТРИНА ДЛЯ LOOKER STUDIO ГОТОВА:\\\")\\n\",\n        \"print(f\\\"Строк: {len(bi_data):,} | Колонок: {len(bi_data.columns)}\\\")\\n\",\n        \"print(bi_data.head(3))\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 6. Урок 1: Подключение источников данных и архитектура витрин в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_01_looker_studio_setup_and_data_sources.ipynb)\n\n---\n\n## 1. Ментальная модель BI: Измерения (Dimensions) vs Показатели (Metrics)\n\nВ Looker Studio и любом современном BI-инструменте данные жестко разделяются:\n- **Dimensions (Зеленые поля)**: Категориальные срезы, по которым данные группируются (Город, Категория, Дата, Канал привлечения).\n- **Metrics (Синие поля)**: Числовые агрегируемые величины (Выручка, Количество клиентов, Средний чек).\n\n### Золотое правило витрины данных для BI:\nНикогда не подключайте «сырые» ненормализованные логи напрямую в отчеты, если в них миллионы строк. Сначала подготовьте денормализованную витрину (Data Mart) на уровне SQL/Python.\n"}, {"type": "code", "content": "# Экспорт оптимизированной витрины для Looker Studio\nimport sqlite3\nimport pandas as pd\n\nconn = sqlite3.connect(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\ecommerce.db\")\n\nquery_bi = \"\"\"\nSELECT \n    SUBSTR(o.order_date, 1, 10) AS order_date,\n    c.city,\n    c.acquisition_channel,\n    c.device,\n    p.category,\n    p.product_name,\n    oi.quantity,\n    oi.unit_price,\n    oi.total_amount AS revenue,\n    (oi.total_amount - (p.cost * oi.quantity)) AS gross_profit\nFROM orders o\nJOIN customers c ON o.customer_id = c.customer_id\nJOIN order_items oi ON o.order_id = oi.order_id\nJOIN products p ON oi.product_id = p.product_id\nWHERE o.status = 'Completed';\n\"\"\"\n\nbi_data = pd.read_sql(query_bi, conn)\nbi_data.to_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\processed\\looker_studio_source.csv\", index=False)\nprint(\" ВИТРИНА ДЛЯ LOOKER STUDIO ГОТОВА:\")\nprint(f\"Строк: {len(bi_data):,} | Колонок: {len(bi_data.columns)}\")\nprint(bi_data.head(3))\n"}]}, {"filename": "lesson_02_calculated_fields_and_parameters.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚙️ Модуль 6. Урок 2: Вычисляемые поля и логика CASE WHEN в Looker Studio\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Топ-3 формулы в Looker Studio\\n\",\n        \"\\n\",\n        \"### 1. Маржинальность бизнеса (% Margin):\\n\",\n        \"```sql\\n\",\n        \"SUM(gross_profit) / SUM(revenue)\\n\",\n        \"```\\n\",\n        \"*(Ошибочно писать: `AVG(gross_profit / revenue)` — это усреднит проценты без весов).*\\n\",\n        \"\\n\",\n        \"### 2. Динамическая сегментация чека:\\n\",\n        \"```sql\\n\",\n        \"CASE \\n\",\n        \"  WHEN revenue >= 15000 THEN '1. Крупный чек (>15k)'\\n\",\n        \"  WHEN revenue >= 5000 THEN '2. Средний чек (5k-15k)'\\n\",\n        \"  ELSE '3. Малый чек (<5k)'\\n\",\n        \"END\\n\",\n        \"```\\n\",\n        \"\\n\",\n        \"### 3. Нормализация каналов рекламы:\\n\",\n        \"```sql\\n\",\n        \"CASE \\n\",\n        \"  WHEN REGEXP_MATCH(acquisition_channel, '.*(Paid|Ads).*') THEN 'Платный трафик'\\n\",\n        \"  ELSE 'Органический трафик'\\n\",\n        \"END\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚙️ Модуль 6. Урок 2: Вычисляемые поля и логика CASE WHEN в Looker Studio\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_02_calculated_fields_and_parameters.ipynb)\n\n---\n\n## 1. Топ-3 формулы в Looker Studio\n\n### 1. Маржинальность бизнеса (% Margin):\n```sql\nSUM(gross_profit) / SUM(revenue)\n```\n*(Ошибочно писать: `AVG(gross_profit / revenue)` — это усреднит проценты без весов).*\n\n### 2. Динамическая сегментация чека:\n```sql\nCASE \n  WHEN revenue >= 15000 THEN '1. Крупный чек (>15k)'\n  WHEN revenue >= 5000 THEN '2. Средний чек (5k-15k)'\n  ELSE '3. Малый чек (<5k)'\nEND\n```\n\n### 3. Нормализация каналов рекламы:\n```sql\nCASE \n  WHEN REGEXP_MATCH(acquisition_channel, '.*(Paid|Ads).*') THEN 'Платный трафик'\n  ELSE 'Органический трафик'\nEND\n```\n"}]}, {"filename": "lesson_03_data_blending_joins_in_bi.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🔗 Модуль 6. Урок 3: Data Blending: Склейка фактов разных уровней гранулярности\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Проблема разных уровней детализации (Granularity Mismatch)\\n\",\n        \"\\n\",\n        \"Кейс:\\n\",\n        \"- **Таблица 1 (Маркетинг)**: Расходы по дням и рекламным кампаниям (Google Sheets, 1 строка на день).\\n\",\n        \"- **Таблица 2 (Продажи)**: Транзакции по каждому отдельному чеку (База данных, 500 строк на день).\\n\",\n        \"Если вы наивно соедините их в BI без предварительной агрегации, рекламный бюджет дня продублируется 500 раз!\\n\",\n        \"\\n\",\n        \"### Правило безопасного Blending:\\n\",\n        \"Перед объединением в Looker Studio агрегируйте обе таблицы к **единому ключу** (например: `Дата` + `Канал`).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🔗 Модуль 6. Урок 3: Data Blending: Склейка фактов разных уровней гранулярности\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_03_data_blending_joins_in_bi.ipynb)\n\n---\n\n## 1. Проблема разных уровней детализации (Granularity Mismatch)\n\nКейс:\n- **Таблица 1 (Маркетинг)**: Расходы по дням и рекламным кампаниям (Google Sheets, 1 строка на день).\n- **Таблица 2 (Продажи)**: Транзакции по каждому отдельному чеку (База данных, 500 строк на день).\nЕсли вы наивно соедините их в BI без предварительной агрегации, рекламный бюджет дня продублируется 500 раз!\n\n### Правило безопасного Blending:\nПеред объединением в Looker Studio агрегируйте обе таблицы к **единому ключу** (например: `Дата` + `Канал`).\n"}]}, {"filename": "lesson_04_dashboard_ui_ux_for_executives.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📱 Модуль 6. Урок 4: UI/UX дизайн дашбордов для C-Level руководителей\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Принцип Actionable Dashboard: Ответ за 5 секунд\\n\",\n        \"\\n\",\n        \"Топ-менеджер не должен разгадывать дашборд как ребус.\\n\",\n        \"Экран делится на 3 смысловых яруса:\\n\",\n        \"1. **Верхний ярус (Карточки Scorecard)**: Выручка, Количество заказов, Средний чек, LTV/CAC с динамикой к прошлому периоду ($\\\\Delta\\\\%$).\\n\",\n        \"2. **Средний ярус (Тренды)**: Линейный график динамики за 90 дней и столбчатая диаграмма структуры по категориям.\\n\",\n        \"3. **Нижний ярус (Детализация)**: Таблица лидеров и аутсайдеров с условным цветовым форматированием (Heatmap).\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📱 Модуль 6. Урок 4: UI/UX дизайн дашбордов для C-Level руководителей\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_04_dashboard_ui_ux_for_executives.ipynb)\n\n---\n\n## 1. Принцип Actionable Dashboard: Ответ за 5 секунд\n\nТоп-менеджер не должен разгадывать дашборд как ребус.\nЭкран делится на 3 смысловых яруса:\n1. **Верхний ярус (Карточки Scorecard)**: Выручка, Количество заказов, Средний чек, LTV/CAC с динамикой к прошлому периоду ($\\Delta\\%$).\n2. **Средний ярус (Тренды)**: Линейный график динамики за 90 дней и столбчатая диаграмма структуры по категориям.\n3. **Нижний ярус (Детализация)**: Таблица лидеров и аутсайдеров с условным цветовым форматированием (Heatmap).\n"}]}, {"filename": "lesson_05_interactive_filters_controls.ipynb", "rel_path": "course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🎛️ Модуль 6. Урок 5: Интерактивные фильтры, параметры и Drill-down\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Превращение статического отчета в инструмент исследователя\\n\",\n        \"\\n\",\n        \"- **Cross-filtering (Кросс-фильтрация)**: Клик по столбцу категории на одной диаграмме мгновенно пересчитывает все остальные графики страницы.\\n\",\n        \"- **Drill-down**: Иерархия уровней (`Год -> Квартал -> Месяц -> День`).\\n\",\n        \"- **Срезы по устройствам (Device Slicers)**: Выбор Desktop / Mobile.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🎛️ Модуль 6. Урок 5: Интерактивные фильтры, параметры и Drill-down\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_06_bi_looker_studio/lesson_05_interactive_filters_controls.ipynb)\n\n---\n\n## 1. Превращение статического отчета в инструмент исследователя\n\n- **Cross-filtering (Кросс-фильтрация)**: Клик по столбцу категории на одной диаграмме мгновенно пересчитывает все остальные графики страницы.\n- **Drill-down**: Иерархия уровней (`Год -> Квартал -> Месяц -> День`).\n- **Срезы по устройствам (Device Slicers)**: Выбор Desktop / Mobile.\n"}]}]}, {"id": "module_07_ab_testing", "title": "Модуль 7. A/B тестирование и эксперименты", "category": "Эксперименты", "badge": "A/B тесты", "readme": "# 🧪 Модуль 7: A/B-тестирование — Научный подход к изменениям в продукте\n\n## 📌 О модуле\nБизнес не может полагаться на интуицию («мне кажется, эта синяя кнопка красивее»). A/B-тестирование — золотой стандарт проверки гипотез в продуктовых и маркетинговых компаниях (Яндекс, Авито, Ozon, Netflix, Uber).\n\n## 🎯 Learning Outcomes\n- **Understand**: Ошибки I рода ($\\alpha$, ложная тревога) и II рода ($\\beta$, упущенная выгода), статистическая мощность ($1 - \\beta$).\n- **Apply**: Расчет размера выборки (Sample Size) и MDE (Minimum Detectable Effect) до старта теста.\n- **Analyze**: Проверка корректности сплитования: A/A-тесты и Sample Ratio Mismatch (SRM).\n- **Evaluate**: Проблема ранней остановки (Peeking Problem), множественное тестирование (поправка Бонферрони).\n- **Create**: Полный Python-ноутбук анализа A/B-теста от валидации до решения о раскатке.\n\n## 📚 Уроки\n1. `lesson_01_ab_testing_framework_and_mde.ipynb` — Дизайн эксперимента: формулировка гипотезы, метрики OEC, расчет Sample Size & MDE.\n2. `lesson_02_splitting_aa_tests_srm.ipynb` — Рандомизация, A/A-тестирование и проверка Sample Ratio Mismatch (Chi-Square).\n3. `lesson_03_evaluating_metrics_proportions_means.ipynb` — Оценка результатов: тест пропорций для конверсий, t-тест / бутстрап для выручки.\n4. `lesson_04_p_hacking_peeking_problem.ipynb` — Ловушки: p-hacking, peeking problem (почему нельзя подглядывать каждый день).\n5. `lesson_05_business_decision_rollout.ipynb` — Принятие бизнес-решения: статистическая значимость vs экономическая целесообразность.\n6. `quiz.md` — Тест для закрепления.\n7. `cheatsheet.md` — Памятка формул A/B теста.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 7 (A/B-тестирование)\n\n---\n\n### Вопрос 1\nЧто происходит с реальным уровнем ошибки I рода ($\\alpha$), если аналитик каждый день проверяет тест и останавливает его при первом $p < 0.05$ (Peeking Problem)?\n- [ ] Ошибка остается строго 5%.\n- [x] Реальная вероятность ложноположительного результата подскакивает до 30-40%, фиксируя случайный шум.\n- [ ] Ошибка уменьшается до нуля.\n*Объяснение*: Непрерывный мониторинг накапливает вероятность случайного пересечения порога 0.05.\n\n---\n\n### Вопрос 2\nЧто показывает Sample Ratio Mismatch (SRM)?\n- [ ] Разницу в конверсиях между группами.\n- [x] Нарушение запланированного соотношения объемов трафика в группах (например, 48/52 вместо 50/50), указывающее на технический сбой рандомизатора.\n- [ ] Ошибку в расчете выручки.\n*Объяснение*: При наличии SRM результаты сравнения метрик между группами математически невалидны.\n\n---\n\n### Вопрос 3\nЗачем нужны Guardrail-метрики в эксперименте?\n- [ ] Чтобы ускорить расчет p-value.\n- [x] Чтобы предотвратить раскатку фичи, которая вырастила локальную метрику за счет разрушения глобального здоровья бизнеса (например, рост кликов ценой падения выручки).\n- [ ] Для шифрования данных.\n*Объяснение*: Guardrail-метрики защищают ключевые бизнес-показатели от деградации.\n", "cheatsheet": "# 📋 A/B Testing Cheatsheet\n\n| Понятие | Формула / Смысл |\n|---|---|\n| Ошибка I рода (Alpha) | Вероятность увидеть разницу там, где её нет (норма: 0.05) |\n| Ошибка II рода (Beta) | Вероятность не заметить реальный эффект (норма: 0.20) |\n| Мощность (Power) | $1 - \\beta = 0.80$ (шанс поймать реальное улучшение) |\n| Поправка Бонферрони | $\\alpha_{new} = \\alpha / k$ (при проверке $k$ гипотез одновременно) |\n", "notebooks": [{"filename": "lesson_01_ab_testing_framework_and_mde.ipynb", "rel_path": "course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧪 Модуль 7. Урок 1: Дизайн эксперимента: Метрики OEC, Sample Size и MDE\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Математика планирования A/B-эксперимента\\n\",\n        \"\\n\",\n        \"Никогда не запускайте тест со словами: *«Покрутим пару дней, а там посмотрим»*.\\n\",\n        \"До запуска теста аналитик обязан рассчитать **минимальный размер выборки (Sample Size)**.\\n\",\n        \"\\n\",\n        \"Формула необходимого размера выборки на группу:\\n\",\n        \"$$n = \\\\frac{2 \\\\cdot (Z_{\\\\alpha/2} + Z_{\\\\beta})^2 \\\\cdot p(1-p)}{MDE^2}$$\\n\",\n        \"\\n\",\n        \"Где:\\n\",\n        \"- $\\\\alpha = 0.05$ (Ошибка I рода, вероятность ложной тревоги 5%);\\n\",\n        \"- $\\\\beta = 0.20$ (Ошибка II рода, мощность $1 - \\\\beta = 80\\\\%$);\\n\",\n        \"- $MDE$ (Minimum Detectable Effect) — минимальный эффект, который экономически имеет смысл обнаружить.\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import statsmodels.stats.api as sms\\n\",\n        \"\\n\",\n        \"# Расчет выборки для интернет-магазина\\n\",\n        \"baseline_cr = 0.082  # Текущая конверсия 8.2%\\n\",\n        \"target_cr = 0.095    # Ожидаемый рост до 9.5% (MDE = +1.3% абс.)\\n\",\n        \"\\n\",\n        \"effect_size = sms.proportion_effectsize(baseline_cr, target_cr)\\n\",\n        \"required_n = sms.NormalIndPower().solve_power(\\n\",\n        \"    effect_size=effect_size,\\n\",\n        \"    power=0.80,\\n\",\n        \"    alpha=0.05,\\n\",\n        \"    ratio=1\\n\",\n        \")\\n\",\n        \"\\n\",\n        \"print(f\\\"Базовая конверсия: {baseline_cr*100:.1f}% | Целевая: {target_cr*100:.1f}%\\\")\\n\",\n        \"print(f\\\"Необходимо пользователей В КАЖДОЙ группе: {int(round(required_n)):,}\\\")\\n\",\n        \"print(f\\\"Всего пользователей в тесте: {int(round(required_n))*2:,}\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧪 Модуль 7. Урок 1: Дизайн эксперимента: Метрики OEC, Sample Size и MDE\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_01_ab_testing_framework_and_mde.ipynb)\n\n---\n\n## 1. Математика планирования A/B-эксперимента\n\nНикогда не запускайте тест со словами: *«Покрутим пару дней, а там посмотрим»*.\nДо запуска теста аналитик обязан рассчитать **минимальный размер выборки (Sample Size)**.\n\nФормула необходимого размера выборки на группу:\n$$n = \\frac{2 \\cdot (Z_{\\alpha/2} + Z_{\\beta})^2 \\cdot p(1-p)}{MDE^2}$$\n\nГде:\n- $\\alpha = 0.05$ (Ошибка I рода, вероятность ложной тревоги 5%);\n- $\\beta = 0.20$ (Ошибка II рода, мощность $1 - \\beta = 80\\%$);\n- $MDE$ (Minimum Detectable Effect) — минимальный эффект, который экономически имеет смысл обнаружить.\n"}, {"type": "code", "content": "import statsmodels.stats.api as sms\n\n# Расчет выборки для интернет-магазина\nbaseline_cr = 0.082  # Текущая конверсия 8.2%\ntarget_cr = 0.095    # Ожидаемый рост до 9.5% (MDE = +1.3% абс.)\n\neffect_size = sms.proportion_effectsize(baseline_cr, target_cr)\nrequired_n = sms.NormalIndPower().solve_power(\n    effect_size=effect_size,\n    power=0.80,\n    alpha=0.05,\n    ratio=1\n)\n\nprint(f\"Базовая конверсия: {baseline_cr*100:.1f}% | Целевая: {target_cr*100:.1f}%\")\nprint(f\"Необходимо пользователей В КАЖДОЙ группе: {int(round(required_n)):,}\")\nprint(f\"Всего пользователей в тесте: {int(round(required_n))*2:,}\")\n"}]}, {"filename": "lesson_02_splitting_aa_tests_srm.ipynb", "rel_path": "course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# ⚖️ Модуль 7. Урок 2: Проверка честности сплитования: Sample Ratio Mismatch (SRM)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Sample Ratio Mismatch (SRM) — Убийца A/B-тестов\\n\",\n        \"\\n\",\n        \"Если вы планировали тест 50/50, а в группу А пришло 5 200 пользователей, а в группу B — 4 800 пользователей:\\n\",\n        \"- Это не «случайная погрешность».\\n\",\n        \"- Это технический сбой системы сплитования (например, на iOS вариант B не загружался и пользователи отваливались до попадания в лог).\\n\",\n        \"- **Результаты такого теста нельзя анализировать! Они полностью невалидны.**\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"from scipy.stats import chisquare\\n\",\n        \"\\n\",\n        \"# Загружаем реальный датасет эксперимента чекаута\\n\",\n        \"ab_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\ab_test_checkout.csv\\\")\\n\",\n        \"counts = ab_df['test_group'].value_counts()\\n\",\n        \"print(\\\"ФАКТИЧЕСКИЙ СПЛИТ ПОЛЬЗОВАТЕЛЕЙ:\\\")\\n\",\n        \"print(counts)\\n\",\n        \"\\n\",\n        \"# Проверка критерием Хи-квадрат\\n\",\n        \"obs = [counts['A_Control'], counts['B_Variant']]\\n\",\n        \"exp = [len(ab_df)/2, len(ab_df)/2]\\n\",\n        \"stat, p_val = chisquare(obs, exp)\\n\",\n        \"\\n\",\n        \"print(f\\\"\\\\nChi2-statistic: {stat:.4f}, p-value: {p_val:.4f}\\\")\\n\",\n        \"if p_val < 0.01:\\n\",\n        \"    print(\\\" АВАРИЯ: Обнаружен SRM! Тест бракованный.\\\")\\n\",\n        \"else:\\n\",\n        \"    print(\\\" SRM не обнаружен! Сплитование 50/50 корректно.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# ⚖️ Модуль 7. Урок 2: Проверка честности сплитования: Sample Ratio Mismatch (SRM)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_02_splitting_aa_tests_srm.ipynb)\n\n---\n\n## 1. Sample Ratio Mismatch (SRM) — Убийца A/B-тестов\n\nЕсли вы планировали тест 50/50, а в группу А пришло 5 200 пользователей, а в группу B — 4 800 пользователей:\n- Это не «случайная погрешность».\n- Это технический сбой системы сплитования (например, на iOS вариант B не загружался и пользователи отваливались до попадания в лог).\n- **Результаты такого теста нельзя анализировать! Они полностью невалидны.**\n"}, {"type": "code", "content": "import pandas as pd\nfrom scipy.stats import chisquare\n\n# Загружаем реальный датасет эксперимента чекаута\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\ncounts = ab_df['test_group'].value_counts()\nprint(\"ФАКТИЧЕСКИЙ СПЛИТ ПОЛЬЗОВАТЕЛЕЙ:\")\nprint(counts)\n\n# Проверка критерием Хи-квадрат\nobs = [counts['A_Control'], counts['B_Variant']]\nexp = [len(ab_df)/2, len(ab_df)/2]\nstat, p_val = chisquare(obs, exp)\n\nprint(f\"\\nChi2-statistic: {stat:.4f}, p-value: {p_val:.4f}\")\nif p_val < 0.01:\n    print(\" АВАРИЯ: Обнаружен SRM! Тест бракованный.\")\nelse:\n    print(\" SRM не обнаружен! Сплитование 50/50 корректно.\")\n"}]}, {"filename": "lesson_03_evaluating_metrics_proportions_means.ipynb", "rel_path": "course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 📊 Модуль 7. Урок 3: Полный статистический анализ A/B-теста на Python\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Z-test для конверсий и оценка Uplift\\n\",\n        \"\"\n      ]\n    },\n    {\n      \"cell_type\": \"code\",\n      \"execution_count\": null,\n      \"metadata\": {},\n      \"outputs\": [],\n      \"source\": [\n        \"import pandas as pd\\n\",\n        \"from statsmodels.stats.proportion import proportions_ztest\\n\",\n        \"\\n\",\n        \"ab_df = pd.read_csv(r\\\"d:\\\\vibe_app\\\\main_data_analytics\\\\course\\\\datasets\\\\raw\\\\ab_test_checkout.csv\\\")\\n\",\n        \"\\n\",\n        \"a = ab_df[ab_df['test_group'] == 'A_Control']\\n\",\n        \"b = ab_df[ab_df['test_group'] == 'B_Variant']\\n\",\n        \"\\n\",\n        \"cr_a = a['converted'].mean()\\n\",\n        \"cr_b = b['converted'].mean()\\n\",\n        \"uplift = (cr_b - cr_a) / cr_a * 100\\n\",\n        \"\\n\",\n        \"count = [b['converted'].sum(), a['converted'].sum()]\\n\",\n        \"nobs = [len(b), len(a)]\\n\",\n        \"z_stat, p_val = proportions_ztest(count, nobs)\\n\",\n        \"\\n\",\n        \"print(f\\\"Контроль (A): CR = {cr_a*100:.2f}% | Вариант (B): CR = {cr_b*100:.2f}%\\\")\\n\",\n        \"print(f\\\"Относительный прирост (Uplift): +{uplift:.2f}%\\\")\\n\",\n        \"print(f\\\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\\\")\\n\",\n        \"\\n\",\n        \"if p_val < 0.05:\\n\",\n        \"    print(\\\" РЕШЕНИЕ: Изменение статистически значимо! Выкатываем вариант B на 100% аудитории.\\\")\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 📊 Модуль 7. Урок 3: Полный статистический анализ A/B-теста на Python\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_03_evaluating_metrics_proportions_means.ipynb)\n\n---\n\n## 1. Z-test для конверсий и оценка Uplift\n"}, {"type": "code", "content": "import pandas as pd\nfrom statsmodels.stats.proportion import proportions_ztest\n\nab_df = pd.read_csv(r\"d:\\vibe_app\\main_data_analytics\\course\\datasets\\raw\\ab_test_checkout.csv\")\n\na = ab_df[ab_df['test_group'] == 'A_Control']\nb = ab_df[ab_df['test_group'] == 'B_Variant']\n\ncr_a = a['converted'].mean()\ncr_b = b['converted'].mean()\nuplift = (cr_b - cr_a) / cr_a * 100\n\ncount = [b['converted'].sum(), a['converted'].sum()]\nnobs = [len(b), len(a)]\nz_stat, p_val = proportions_ztest(count, nobs)\n\nprint(f\"Контроль (A): CR = {cr_a*100:.2f}% | Вариант (B): CR = {cr_b*100:.2f}%\")\nprint(f\"Относительный прирост (Uplift): +{uplift:.2f}%\")\nprint(f\"Z-stat: {z_stat:.4f}, p-value: {p_val:.5f}\")\n\nif p_val < 0.05:\n    print(\" РЕШЕНИЕ: Изменение статистически значимо! Выкатываем вариант B на 100% аудитории.\")\n"}]}, {"filename": "lesson_04_p_hacking_peeking_problem.ipynb", "rel_path": "course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🛑 Модуль 7. Урок 4: Peeking Problem и p-hacking: Почему нельзя подглядывать в результаты\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Механика ложного срабатывания при Peeking\\n\",\n        \"\\n\",\n        \"Если вы каждый день заглядываете в дашборд теста и решаете остановить его в первый момент, когда $p < 0.05$, вероятность ложноположительного результата (**False Positive**) возрастает с нормальных $5\\\\%$ до $35-40\\\\%$!\\n\",\n        \"Вы гарантированно выкатите на прод бесполезную или вредную фичу, приняв случайное колебание за победу.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛑 Модуль 7. Урок 4: Peeking Problem и p-hacking: Почему нельзя подглядывать в результаты\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_04_p_hacking_peeking_problem.ipynb)\n\n---\n\n## 1. Механика ложного срабатывания при Peeking\n\nЕсли вы каждый день заглядываете в дашборд теста и решаете остановить его в первый момент, когда $p < 0.05$, вероятность ложноположительного результата (**False Positive**) возрастает с нормальных $5\\%$ до $35-40\\%$!\nВы гарантированно выкатите на прод бесполезную или вредную фичу, приняв случайное колебание за победу.\n"}]}, {"filename": "lesson_05_business_decision_rollout.ipynb", "rel_path": "course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🚀 Модуль 7. Урок 5: Принятие бизнес-решения о раскатке: Guardrail метрики\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Guardrail Metrics (Защитные метрики)\\n\",\n        \"\\n\",\n        \"Даже если целевая метрика (CR) статистически значимо выросла на 15%, тест **нельзя** раскатывать, если:\\n\",\n        \"1. Выросло число возвратов товаров (Refund Rate);\\n\",\n        \"2. Упал средний чек (AOV);\\n\",\n        \"3. Увеличилось время ответа саппорта или выросла нагрузка на серверы.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🚀 Модуль 7. Урок 5: Принятие бизнес-решения о раскатке: Guardrail метрики\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_07_ab_testing/lesson_05_business_decision_rollout.ipynb)\n\n---\n\n## 1. Guardrail Metrics (Защитные метрики)\n\nДаже если целевая метрика (CR) статистически значимо выросла на 15%, тест **нельзя** раскатывать, если:\n1. Выросло число возвратов товаров (Refund Rate);\n2. Упал средний чек (AOV);\n3. Увеличилось время ответа саппорта или выросла нагрузка на серверы.\n"}]}]}, {"id": "module_08_prompt_engineering", "title": "Модуль 8. Prompt Engineering для аналитики", "category": "AI стек", "badge": "Промпты", "readme": "# 🤖 Модуль 8: Prompt Engineering для Data Analyst 2027\n\n## 📌 О модуле\nПромпт-инжиниринг в аналитике — это не просто вежливое обращение к ChatGPT. Это строгое инженерное искусство составления структурированных технических заданий для больших языковых моделей (LLM), позволяющее получать безошибочный код, корректную архитектуру данных и воспроизводимые инсайты.\n\n## 🎯 Learning Outcomes\n- **Understand**: Принципы работы LLM (токены, контекстное окно, вероятностное предсказание следующего слова).\n- **Apply**: Архитектурные фреймворки составления промптов (RTCE: Role, Task, Context, Expectation).\n- **Analyze**: Методологии Few-Shot Prompting, Chain-of-Thought (CoT) и ReAct в аналитических задачах.\n- **Create**: Персональную библиотеку промптов для SQL, дебага Pandas и подготовки отчетов для C-level.\n\n## 📚 Уроки\n1. `lesson_01_prompt_engineering_fundamentals.ipynb` — Анатомия промпта аналитика: фреймворк RTCE, Zero-shot vs Few-shot.\n2. `lesson_02_chain_of_thought_for_analytics.ipynb` — Рассуждение по шагам (Chain-of-Thought) для сложных математических задач.\n3. `lesson_03_prompting_for_sql_and_python.ipynb` — Инженерия промптов для генерации SQL, оконных функций и Pandas-пайплайнов.\n4. `lesson_04_debugging_and_root_cause_prompts.ipynb` — Промпты для дебага ошибок, анализа стектрейсов и оптимизации тяжелых запросов.\n5. `prompt_library.md` — Готовая библиотека 25+ рабочих промптов аналитика данных.\n6. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 8 (Prompt Engineering)\n\n---\n\n### Вопрос 1\nЧто дает добавление инструкции «Рассуждай по шагам» (Chain-of-Thought) в промпте для аналитика?\n- [ ] Уменьшает количество затраченных токенов.\n- [x] Позволяет модели сформировать промежуточные логические выводы перед финальным расчетом, резко снижая процент математических ошибок.\n- [ ] Переводит код на язык C++.\n*Объяснение*: CoT принуждает LLM использовать контекст генерируемых токенов как рабочую память.\n\n---\n\n### Вопрос 2\nВ чем заключается техника Few-Shot Prompting?\n- [ ] Однократный запрос без контекста.\n- [x] Предоставление модели в тексте промпта 1-3 готовых примеров «входные данные -> ожидаемый результат» перед постановкой основной задачи.\n- [ ] Написание кода без использования библиотек.\n*Объяснение*: Few-Shot задает точный шаблон структуры ответа и логики рассуждений.\n\n---\n\n### Вопрос 3\nКакой компонент фреймворка RTCE отвечает за формат и ограничения вывода?\n- [ ] R (Role).\n- [ ] T (Task).\n- [x] E (Expectation).\n*Объяснение*: В Expectation задаются ограничения (например, «только валидный JSON без пояснений», «обработать деление на ноль»).\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_prompt_engineering_fundamentals.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🤖 Модуль 8. Урок 1: Архитектурные фреймворки промптинга: RTCE и Few-Shot\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Фреймворк RTCE в аналитике\\n\",\n        \"\\n\",\n        \"1. **R (Role)**: «Ты Principal Database Architect в FinTech компании с 15-летним опытом оптимизации PostgreSQL».\\n\",\n        \"2. **T (Task)**: «Напиши запрос для расчета 30-дневного скользящего среднего Retention Rate».\\n\",\n        \"3. **C (Context)**: Схема таблицы, типы полей, объем (50 млн строк, нужны индексы).\\n\",\n        \"4. **E (Expectation)**: «Используй только стандартный SQL, CTE и оконные функции. Добавь пояснения логики».\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🤖 Модуль 8. Урок 1: Архитектурные фреймворки промптинга: RTCE и Few-Shot\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_01_prompt_engineering_fundamentals.ipynb)\n\n---\n\n## 1. Фреймворк RTCE в аналитике\n\n1. **R (Role)**: «Ты Principal Database Architect в FinTech компании с 15-летним опытом оптимизации PostgreSQL».\n2. **T (Task)**: «Напиши запрос для расчета 30-дневного скользящего среднего Retention Rate».\n3. **C (Context)**: Схема таблицы, типы полей, объем (50 млн строк, нужны индексы).\n4. **E (Expectation)**: «Используй только стандартный SQL, CTE и оконные функции. Добавь пояснения логики».\n"}]}, {"filename": "lesson_02_chain_of_thought_for_analytics.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🧠 Модуль 8. Урок 2: Метод Chain-of-Thought (Рассуждение по шагам)\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Почему нейросети ошибаются в математике без CoT?\\n\",\n        \"\\n\",\n        \"LLM — это авторегрессионные языковые модели. Они не вычисляют формулу в скрытом процессоре, они предсказывают следующее слово (токен).\\n\",\n        \"Если заставить модель сразу выдать число — шанс ошибки велик.\\n\",\n        \"Если заставить модель расписать каждый шаг формулы вслух — вероятность правильного ответа превышает 98%.\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🧠 Модуль 8. Урок 2: Метод Chain-of-Thought (Рассуждение по шагам)\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_08_prompt_engineering/lesson_02_chain_of_thought_for_analytics.ipynb)\n\n---\n\n## 1. Почему нейросети ошибаются в математике без CoT?\n\nLLM — это авторегрессионные языковые модели. Они не вычисляют формулу в скрытом процессоре, они предсказывают следующее слово (токен).\nЕсли заставить модель сразу выдать число — шанс ошибки велик.\nЕсли заставить модель расписать каждый шаг формулы вслух — вероятность правильного ответа превышает 98%.\n"}]}, {"filename": "lesson_03_prompting_for_sql_and_python.ipynb", "rel_path": "course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_08_prompt_engineering/lesson_03_prompting_for_sql_and_python.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 💻 Модуль 8. Урок 3: k_hallucinations.ipynb` — Архитектура валидации: как защитить бизнес от галлюцинаций ИИ.\n4. `quiz.md` — Тест для самопроверки.\n", "quiz": "# 🧠 Quiz: Самопроверка по Модулю 9 (AI в ежедневной работе)\n\n---\n\n### Вопрос 1\nЗачем в проектах аналитики используется файл `.cursorrules`?\n- [ ] Для ускорения интернета.\n- [x] Для автоматической передачи AI-ассистенту корпоративных стандартов кода, схемы баз данных и бизнес-правил компании.\n- [ ] Для компиляции Python в бинарный файл.\n*Объяснение*: Файл `.cursorrules` автоматически подмешивается в системный контекст каждого запроса в IDE.\n\n---\n\n### Вопрос 2\nЧто такое проверка бизнес-инвариантов при аудите кода нейросети?\n- [ ] Проверка орфографии комментариев.\n- [x] Проверка фундаментальных ограничений предметной области (например: сумма заказов не может быть отрицательной, а LTV не может быть ниже нуля).\n- [ ] Измерение скорости процессора.\n*Объяснение*: Если синтаксически корректный код от ИИ выдал отрицательный отток или конверсию 140%, нарушен бизнес-инвариант.\n\n---\n\n### Вопрос 3\nКакой инструмент лучше всего подходит для мгновенного разведочного анализа (EDA) сырого CSV-файла?\n- [ ] Ручной ввод данных в калькулятор.\n- [x] Advanced Data Analysis / Code Interpreter (встроенный запуск Python с визуализацией в реальном времени).\n- [ ] Отрисовка графиков на бумаге.\n*Объяснение*: Code Interpreter выполняет код в изолированной песочнице, строя графики и считая квантили за секунды.\n", "cheatsheet": "", "notebooks": [{"filename": "lesson_01_cursor_vs_copilot_workflows.ipynb", "rel_path": "course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "filepath": "d:/vibe_app/main_data_analytics/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb", "raw_json": "{\n  \"cells\": [\n    {\n      \"cell_type\": \"markdown\",\n      \"metadata\": {},\n      \"source\": [\n        \"# 🛠️ Модуль 9. Урок 1: AI-ассистенты в редакторе: Cursor IDE, Copilot и `.cursorrules`\\n\",\n        \"\\n\",\n        \"[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\\n\",\n        \"\\n\",\n        \"---\\n\",\n        \"\\n\",\n        \"## 1. Конфигурация аналитического проекта через `.cursorrules`\\n\",\n        \"\\n\",\n        \"В современных командах аналитики не повторяют одни и те же правила в каждом чате.\\n\",\n        \"В корне проекта создается файл `.cursorrules` (или системный промпт проекта):\\n\",\n        \"\\n\",\n        \"```markdown\\n\",\n        \"# Corporate Data Analytics Guidelines (2027)\\n\",\n        \"- Язык общения: Русский. Названия переменных, функций и колонок: Английский (snake_case).\\n\",\n        \"- СУБД: PostgreSQL 16. Всегда фильтровать `status = 'Completed'` при расчете выручки.\\n\",\n        \"- Векторизация: Никогда не использовать циклы for для строк DataFrame.\\n\",\n        \"- Защита от деления на ноль: Всегда использовать `NULLIF(denominator, 0)` в SQL и `div()` с `fill_value=0` в Pandas.\\n\",\n        \"- Формат дат: ISO-8601 (YYYY-MM-DD).\\n\",\n        \"```\\n\",\n        \"\"\n      ]\n    }\n  ],\n  \"metadata\": {\n    \"colab\": {\n      \"provenance\": []\n    },\n    \"kernelspec\": {\n      \"display_name\": \"Python 3\",\n      \"name\": \"python3\"\n    },\n    \"language_info\": {\n      \"name\": \"python\",\n      \"version\": \"3.10.0\"\n    }\n  },\n  \"nbformat\": 4,\n  \"nbformat_minor\": 0\n}", "cells": [{"type": "markdown", "content": "# 🛠️ Модуль 9. Урок 1: AI-ассистенты в редакторе: Cursor IDE, Copilot и `.cursorrules`\n\n[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Enlyl/data-analyst-2027/blob/main/course/module_09_ai_tools_daily/lesson_01_cursor_vs_copilot_workflows.ipynb)\n\n---\n\n## 1. Конфигурация аналитического проекта
