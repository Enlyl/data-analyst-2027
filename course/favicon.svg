<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="28" cy="28" r="24" fill="#0f172a"/>
  <!-- Glass lens border -->
  <circle cx="28" cy="28" r="19" fill="#1e293b" stroke="url(#lensGrad)" stroke-width="4"/>
  <!-- Mini Bar Chart inside the lens -->
  <rect x="18" y="27" width="4" height="13" rx="1.5" fill="#38bdf8"/>
  <rect x="25" y="20" width="4" height="20" rx="1.5" fill="#818cf8"/>
  <rect x="32" y="14" width="4" height="26" rx="1.5" fill="#34d399"/>
  <!-- Trend line -->
  <path d="M16 29 L 26 19 L 35 13" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Magnifier Handle -->
  <rect x="42" y="42" width="7" height="20" rx="3.5" transform="rotate(-45 42 42)" fill="url(#handleGrad)"/>
</svg>
